# Native application dependency policy.
#
# Git URLs are admitted here only so cargo-deny can classify the graph. The
# companion dependency-source-policy-v1.json and
# hepta-native-dependency-policy gate bind every admitted URL to an exact
# Cargo.lock source ID and commit.

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "deny"
unused-license-exception = "deny"

[[licenses.clarify]]
name = "makepad-latex-math"
version = "=0.1.0"
expression = "MIT"
license-files = [
    { path = "../../LICENSE", hash = 0x26738672 },
]

[[licenses.clarify]]
name = "makepad-regex"
version = "=0.1.0"
expression = "MIT"
license-files = [
    { path = "../../LICENSE", hash = 0x26738672 },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
# The graph intentionally uses local path/workspace dependencies without
# registry version requirements. Source admission is enforced independently
# below and by the exact source ledger.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
unused-allowed-source = "deny"
unused-allowed-org = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/kevinaboos/makepad",
    "https://github.com/openai-oss-forks/tokio-tungstenite",
    "https://github.com/openai-oss-forks/tungstenite-rs",
    "https://github.com/openwallet-foundation-labs/tsp.git",
    "https://github.com/openwallet-foundation/askar.git",
    "https://github.com/project-robius/matrix-rust-sdk",
    "https://github.com/project-robius/robius",
    "https://github.com/project-robius/ruma.git",
    "https://github.com/project-robius/sqlx.git",
]

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
