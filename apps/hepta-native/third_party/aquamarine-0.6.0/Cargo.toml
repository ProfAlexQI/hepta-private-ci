[package]
name = "aquamarine"
version = "0.6.0"
authors = ["Mike Lubinets <git@mkl.dev>", "Frank Rehberger <frehberg@gmail.com>"]
description = "Hepta hermetic compatibility attribute for aquamarine 0.6.0 call sites"
keywords = ["proc_macro", "docs", "rustdoc", "mermaid", "diagram"]
