name: Hepta A0 V4.5.1 Ruff-clean replacement publisher

on:
  push:
    branches:
      - "automation/hepta-a0-v451-ruff-replacement-publisher-20260830-0030"

permissions:
  contents: write

concurrency:
  group: hepta-a0-v451-ruff-replacement-publisher-20260830-0030
  cancel-in-progress: true

env:
  EXPECTED_REPOSITORY: ProfHepta/hepta-private-ci
  TARGET_BRANCH: codex/hepta-intelligence-a0-authority-gap-closure-20260829
  TARGET_HEAD: 08e6ed017e8cbfb94f86a5fa8397eb00eb396ed2
  TARGET_TREE: ca05954360479e64f7ed6c375ee841627529fca3
  Q0_HEAD: c768bcbeb4c1168088d2499828c24da521a2a73a
  Q0_TREE: ca455a9ef797cd95164c880c7b8faba80b305589
  STAGING_BRANCH: staging/hepta-a0-v451-ruff-replacement-20260830-0030
  REPORT_DIR: artifacts/hepta-a0-v451-ruff-replacement

jobs:
  publish:
    name: Build and validate one Ruff-clean Q0-single-parent replacement
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout publisher source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: publisher
          persist-credentials: false

      - name: Checkout exact current A0 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_HEAD }}
          path: target
          fetch-depth: 2
          persist-credentials: true

      - name: Install locked uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3

      - name: Build, validate and publish immutable staging candidate
        shell: bash
        run: |
          set -euo pipefail
          bash publisher/automation/run-hepta-a0-v451-ruff-replacement-publisher.sh

      - name: Upload deterministic publisher evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-a0-v451-ruff-replacement-${{ github.sha }}
          path: target/artifacts/hepta-a0-v451-ruff-replacement/**
          if-no-files-found: error
          retention-days: 30
