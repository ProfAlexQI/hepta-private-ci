name: hepta-browser next required v9

on:
  workflow_call:
  pull_request:
    paths:
      - "codex-rs/hepta-shadow-qualification/**"
      - "tools/hepta-browser-c1-protocol/**"
      - "tools/hepta-browser-c1-startup-bridge/**"
      - "tools/hepta-browser-c1-artifact-gate/**"
      - "scripts/hepta-servo-*.py"
      - "scripts/verify-hepta-servo-*.py"
      - "scripts/verify-hepta-browser-*.py"
      - "scripts/hepta_browser_runner_evidence/**"
      - "scripts/tests/test_hepta_servo_*.py"
      - "scripts/tests/test_hepta_browser_*.py"
      - "docs/hepta-vnext/browser/**"
      - "third_party/servo-patches/**"
      - ".github/workflows/hepta-browser-ci.yml"
      - ".github/workflows/hepta-browser-c1-protocol.yml"
      - ".github/workflows/hepta-browser-c1-startup-bridge.yml"
      - ".github/workflows/hepta-servo-*.yml"
      - ".github/workflows/hepta-browser-next-required-v9.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}::runner-recovery-v2::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

# This workflow is a top-level required context. Its leaves expose workflow_call
# only, so a PR update runs each qualification gate exactly once.
jobs:
  browser-contracts:
    name: Browser contracts and deterministic Actor fixture
    uses: ./.github/workflows/hepta-browser-ci.yml
    secrets: inherit

  private-protocol:
    name: Dependency-free private worker protocol
    uses: ./.github/workflows/hepta-browser-c1-protocol.yml
    secrets: inherit

  startup-bridge:
    name: Artifact-to-browser startup bridge
    uses: ./.github/workflows/hepta-browser-c1-startup-bridge.yml
    secrets: inherit

  independent-source-v3:
    name: Git-order-correct source and archive tooling
    uses: ./.github/workflows/hepta-servo-independent-source-contract-v3.yml
    secrets: inherit

  exact-source-review-candidate-v2:
    name: Exact-source workflow evidence compiler and separate-review fence
    uses: ./.github/workflows/hepta-servo-exact-source-review-candidate-v2-contract.yml
    secrets: inherit

  source-api-topology:
    name: Hepta-owned minimal Servo source and API topology
    uses: ./.github/workflows/hepta-servo-worker-source-topology-contract.yml
    secrets: inherit

  source-acceptance-pointer-v1:
    name: Exact-source accepted pointer and review contract
    uses: ./.github/workflows/hepta-servo-exact-source-acceptance-pointer-v1-contract.yml
    secrets: inherit

  topology-acceptance-pointer-v1:
    name: Worker source/API topology pointer and review contract
    uses: ./.github/workflows/hepta-servo-worker-source-topology-acceptance-pointer-v1-contract.yml
    secrets: inherit

  build-input-v3:
    name: Toolchain-bound build-input tooling with real version text
    uses: ./.github/workflows/hepta-servo-build-input-contract-v3.yml
    secrets: inherit

  build-preflight:
    name: Linux build preflight cross-binding and stop conditions
    uses: ./.github/workflows/hepta-servo-build-preflight-contract.yml
    secrets: inherit

  required:
    name: Hepta Browser next required v9
    if: ${{ always() }}
    needs:
      - browser-contracts
      - private-protocol
      - startup-bridge
      - independent-source-v3
      - exact-source-review-candidate-v2
      - source-api-topology
      - source-acceptance-pointer-v1
      - topology-acceptance-pointer-v1
      - build-input-v3
      - build-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all qualification-only dependencies
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          failures = {
              name: value.get("result")
              for name, value in needs.items()
              if value.get("result") != "success"
          }
          if failures:
              print(json.dumps({"status": "FAIL", "dependencies": failures}, sort_keys=True))
              sys.exit(1)
          print(
              json.dumps(
                  {
                      "status": "PASS_TOOLING_AND_FIXTURES_ONLY",
                      "dependencies": sorted(needs),
                      "workflow_topology": "top_level_v9_to_workflow_call_only_leaves",
                      "private_protocol": "dependency_free_qualification_only",
                      "startup_bridge": "fixture_artifact_to_browser_handoff",
                      "source_generator": "v2_deterministic_umask",
                      "source_verifier": "v2_git_base_name_compare",
                      "source_review_candidate": "v2_separate_review",
                      "source_acceptance_pointer": "v2_verify_only_no_creation_command",
                      "source_api_topology": "hepta_owned_embedder_v1",
                      "topology_acceptance_pointer": "v1_verify_only_no_creation_command",
                      "build_input_sealer": "v3_toolchain_bound",
                      "build_preflight": "v2_strict_capture_facts",
                      "exact_servo_source_accepted": False,
                      "source_review_candidate_accepted": False,
                      "worker_source_topology_accepted": False,
                      "build_authorized": False,
                      "accepted_toolchain_receipt": False,
                      "accepted_build_recipe": False,
                      "sealed_real_build_inputs": False,
                      "real_build_preflight": False,
                      "servo_build_run": False,
                      "servo_artifact": False,
                      "sbom": False,
                      "servo_runtime_qualified": False,
                      "operator_acceptance": False,
                      "promotion": False,
                      "release_qualified": False,
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Record negative authority
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Hepta Browser canonical next-stage aggregate v9"
            echo
            echo "- top-level required workflow with workflow_call-only leaves"
            echo "- independent private protocol and startup bridge: required"
            echo "- exact Servo source accepted: false"
            echo "- Worker source topology accepted: false"
            echo "- build authorized: false"
            echo "- Servo built/runtime qualified: false"
            echo "- operator acceptance/promotion/release: false"
          } >> "$GITHUB_STEP_SUMMARY"
