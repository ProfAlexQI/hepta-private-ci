name: Hepta P0.7a runtime bootstrap

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "codex-rs/hepta-contracts/**"
      - "codex-rs/hepta-fleet/**"
      - "codex-rs/hepta-supervisor/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/Cargo.lock"
      - "MODULE.bazel.lock"
      - "docs/architecture/**"
      - "scripts/verify-hepta-selected-architecture-plan.py"
      - "scripts/verify-hepta-architecture-plan-v4.py"
      - "scripts/verify-hepta-architecture-plan-v5.py"
      - "scripts/verify-hepta-p0-7a-format.py"
      - ".github/workflows/hepta-runtime-bootstrap-p0-7a.yml"
  push:
    branches:
      - "codex/hepta-architecture-v4-p0-7a-*"
      - "codex/hepta-architecture-v5-*"
    paths:
      - "codex-rs/hepta-contracts/**"
      - "codex-rs/hepta-fleet/**"
      - "codex-rs/hepta-supervisor/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/Cargo.lock"
      - "MODULE.bazel.lock"
      - "docs/architecture/**"
      - "scripts/verify-hepta-selected-architecture-plan.py"
      - "scripts/verify-hepta-architecture-plan-v4.py"
      - "scripts/verify-hepta-architecture-plan-v5.py"
      - "scripts/verify-hepta-p0-7a-format.py"
      - ".github/workflows/hepta-runtime-bootstrap-p0-7a.yml"

permissions:
  contents: read

concurrency:
  group: hepta-p0-7a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-qualification:
    name: P0.7a source qualification
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout exact event identity
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest@0.9.143

      - name: Verify checked-out identity
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Locked metadata
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: P0.7a scoped format
        working-directory: .
        run: python3 scripts/verify-hepta-p0-7a-format.py --check

      - name: Runtime bootstrap tests
        run: |
          set -euo pipefail
          just test -p codex-hepta-contracts
          just test -p codex-hepta-fleet
          just test -p codex-hepta-supervisor
          just test -p codex-hepta-agentd

      - name: Runtime bootstrap check
        run: |
          set -euo pipefail
          cargo check --locked --all-targets \
            -p codex-hepta-contracts \
            -p codex-hepta-fleet \
            -p codex-hepta-supervisor \
            -p codex-hepta-agentd

      - name: Runtime bootstrap strict Clippy
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets \
            -p codex-hepta-contracts \
            -p codex-hepta-fleet \
            -p codex-hepta-supervisor \
            -p codex-hepta-agentd \
            -- -D warnings

      - name: Verify committed Bazel lock
        working-directory: .
        run: just bazel-lock-check

      - name: Verify selected architecture source truth
        working-directory: .
        run: python3 scripts/verify-hepta-selected-architecture-plan.py

      - name: Clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  lock-coherence:
    name: P0.7a committed lock coherence
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout exact event identity
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Regenerate Cargo and Bazel locks
        id: regenerate
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path codex-rs/Cargo.toml --format-version 1 >/dev/null
          just bazel-lock-update
          git diff -- codex-rs/Cargo.lock MODULE.bazel.lock > "$RUNNER_TEMP/hepta-p0-7a-locks.patch"
          git diff --exit-code -- codex-rs/Cargo.lock MODULE.bazel.lock

      - name: Upload diagnostic lock output
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-p0-7a-lock-diagnostic
          path: |
            codex-rs/Cargo.lock
            MODULE.bazel.lock
            ${{ runner.temp }}/hepta-p0-7a-locks.patch
          if-no-files-found: error
          retention-days: 3

  required:
    name: Hepta P0.7a required
    if: ${{ always() }}
    needs:
      - source-qualification
      - lock-coherence
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Require successful P0.7a dependencies
        env:
          SOURCE_RESULT: ${{ needs.source-qualification.result }}
          LOCK_RESULT: ${{ needs.lock-coherence.result }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RESULT" == success ]]
          [[ "$LOCK_RESULT" == success ]]
