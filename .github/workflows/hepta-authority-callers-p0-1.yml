name: Hepta authority callers P0.1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "codex-rs/**/*.rs"
      - "docs/architecture/HEPTA_AUTHORITY_CALLERS_V1.json"
      - "scripts/verify-hepta-authority-callers-p0-1.py"
      - ".github/workflows/hepta-authority-callers-p0-1.yml"
  push:
    branches:
      - codex/hepta-architecture-convergence-p0-2-20260828
      - integration/vnext-main-20260811
    paths:
      - "codex-rs/**/*.rs"
      - "docs/architecture/HEPTA_AUTHORITY_CALLERS_V1.json"
      - "scripts/verify-hepta-authority-callers-p0-1.py"
      - ".github/workflows/hepta-authority-callers-p0-1.yml"

permissions:
  contents: read

concurrency:
  group: hepta-authority-callers-p0-1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-source-head:
    name: Exact source-head authority caller ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          git rev-parse 'HEAD^{tree}'

      - name: Verify authority caller set
        run: python3 scripts/verify-hepta-authority-callers-p0-1.py

      - name: Record caller evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "schema=hepta_authority_callers_evidence_v1"
            echo "identity=source_head"
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_arch=$RUNNER_ARCH"
            echo "job_status=${{ job.status }}"
            echo "public_constructor_is_cryptographic_authority=false"
            echo "caller_set_version_controlled=true"
            echo "external_effect=false"
            echo "model_invocation=false"
            echo "promotion=false"
          } >> "$GITHUB_STEP_SUMMARY"

  merge-candidate:
    name: Merge-candidate authority caller ratchet
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout merge candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify merge identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD^1
          git rev-parse HEAD^2

      - name: Verify merged caller set
        run: python3 scripts/verify-hepta-authority-callers-p0-1.py
