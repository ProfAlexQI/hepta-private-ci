name: Hepta Intelligence A0 external artifact observer macOS

on:
  push:
    branches:
      - "automation/hepta-a0-external-observer-macos-20260830-0120"

permissions:
  actions: read
  contents: read

concurrency:
  group: hepta-a0-external-observer-macos-20260830-0120
  cancel-in-progress: true

env:
  EXPECTED_REPOSITORY: ProfHepta/hepta-private-ci
  TARGET_BRANCH: codex/hepta-intelligence-a0-authority-gap-closure-20260829
  TARGET_HEAD: 73a636867dbebc2dd4bdf957c9c6ff3eb0ea9358
  TARGET_TREE: be18f73ac54f21a7b0b862940ab6007c6589300c
  TARGET_PARENT: c768bcbeb4c1168088d2499828c24da521a2a73a
  SOURCE_RUN_ID: "33284877038"
  SOURCE_JOB_ID: "99186214666"
  SOURCE_ARTIFACT_ID: "9724132824"
  SOURCE_ARTIFACT_NAME: hepta-intelligence-a0-source-73a636867dbebc2dd4bdf957c9c6ff3eb0ea9358
  SOURCE_ARTIFACT_DIGEST: sha256:5dd14dc3edbeff1af3551aec648aa4910c6fdb10c37ab4540d62ed50f6a56cdc
  SOURCE_ARTIFACT_EXPIRES: 2026-09-29T01:10:01Z
  REPORT_DIR: artifacts/hepta-a0-external-observer

jobs:
  observe:
    name: Observe immutable A0 source artifact on macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout observer source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: observer
          persist-credentials: false

      - name: Checkout exact A0 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_HEAD }}
          path: target
          fetch-depth: 2
          persist-credentials: false

      - name: Verify immutable candidate and observer identities
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$(git -C target rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git -C target rev-parse HEAD^)" = "$TARGET_PARENT"
          test "$(git -C target rev-list --count "$TARGET_PARENT"..HEAD)" = 1
          test "$(git -C observer rev-parse HEAD)" = "$GITHUB_SHA"
          git -C target diff --check HEAD^ HEAD

      - name: Fetch source-run, producer-job and artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/$REPORT_DIR/api target/$REPORT_DIR/extracted
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          curl -fsSL "${headers[@]}" "$api/actions/runs/$SOURCE_RUN_ID" > target/$REPORT_DIR/api/source-run.json
          curl -fsSL "${headers[@]}" "$api/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest&per_page=100" > target/$REPORT_DIR/api/source-jobs.json
          curl -fsSL "${headers[@]}" "$api/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > target/$REPORT_DIR/api/source-artifacts.json
          curl -fsSL "${headers[@]}" "$api/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" > target/$REPORT_DIR/api/observer-jobs.json
          artifact_url="$(python3 - <<'PY'
          import json, os, pathlib
          doc = json.loads(pathlib.Path('target', os.environ['REPORT_DIR'], 'api', 'source-artifacts.json').read_text())
          found = [a for a in doc.get('artifacts', []) if a.get('id') == int(os.environ['SOURCE_ARTIFACT_ID'])]
          assert len(found) == 1
          artifact = found[0]
          assert artifact['name'] == os.environ['SOURCE_ARTIFACT_NAME']
          assert artifact['digest'] == os.environ['SOURCE_ARTIFACT_DIGEST']
          assert artifact['expires_at'] == os.environ['SOURCE_ARTIFACT_EXPIRES']
          assert artifact['expired'] is False
          print(artifact['archive_download_url'])
          PY
          )"
          curl -fsSL -L "${headers[@]}" "$artifact_url" -o target/$REPORT_DIR/api/source-artifact.zip

      - name: Verify archive and emit non-qualifying observer receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import stat
          import subprocess
          import zipfile

          target = Path('target')
          report = target / os.environ['REPORT_DIR']
          api = report / 'api'
          extracted = report / 'extracted'
          extracted.mkdir(parents=True, exist_ok=True)

          def canonical(value):
              return json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()

          source_run = json.loads((api / 'source-run.json').read_text())
          source_jobs = json.loads((api / 'source-jobs.json').read_text()).get('jobs', [])
          source_artifacts = json.loads((api / 'source-artifacts.json').read_text()).get('artifacts', [])
          observer_jobs = json.loads((api / 'observer-jobs.json').read_text()).get('jobs', [])

          assert source_run['id'] == int(os.environ['SOURCE_RUN_ID'])
          assert source_run['head_sha'] == os.environ['TARGET_HEAD']
          assert source_run['head_branch'] == os.environ['TARGET_BRANCH']
          assert source_run['event'] in {'push', 'pull_request', 'workflow_dispatch'}

          producer = [j for j in source_jobs if j.get('id') == int(os.environ['SOURCE_JOB_ID'])]
          assert len(producer) == 1
          producer = producer[0]
          assert producer['name'] == 'A0 exact-head source evidence producer'
          assert producer['status'] == 'completed' and producer['conclusion'] == 'success'
          assert int(producer.get('runner_id') or 0) > 0
          assert producer.get('runner_name') and producer.get('labels') and producer.get('steps')
          required_steps = {
              'Checkout exact source candidate',
              'Verify exact identity and one-parent topology',
              'Compile strict validators',
              'Run canonical plan, document, truth and compatibility gates',
              'Produce authority-negative source receipt',
              'Bind workflow and changed-path manifests',
              'Upload exact-head source evidence',
          }
          by_name = {s.get('name'): s for s in producer['steps']}
          for name in required_steps:
              assert by_name[name]['status'] == 'completed'
              assert by_name[name]['conclusion'] == 'success'

          artifact = [a for a in source_artifacts if a.get('id') == int(os.environ['SOURCE_ARTIFACT_ID'])]
          assert len(artifact) == 1
          artifact = artifact[0]
          assert artifact['name'] == os.environ['SOURCE_ARTIFACT_NAME']
          assert artifact['digest'] == os.environ['SOURCE_ARTIFACT_DIGEST']
          assert artifact['expires_at'] == os.environ['SOURCE_ARTIFACT_EXPIRES']
          assert artifact['expired'] is False
          assert artifact['workflow_run']['id'] == int(os.environ['SOURCE_RUN_ID'])
          assert artifact['workflow_run']['head_sha'] == os.environ['TARGET_HEAD']

          archive = api / 'source-artifact.zip'
          archive_digest = 'sha256:' + hashlib.sha256(archive.read_bytes()).hexdigest()
          assert archive_digest == os.environ['SOURCE_ARTIFACT_DIGEST']

          expected_names = {
              'a0-source-evidence-receipt.json',
              'current-truth-1.json',
              'current-truth-2.json',
              'current-truth.json',
              'source-manifest.json',
          }
          seen = set()
          files = []
          expanded = 0
          with zipfile.ZipFile(archive) as zf:
              infos = zf.infolist()
              assert 0 < len(infos) <= 64
              for info in infos:
                  pure = PurePosixPath(info.filename)
                  assert not pure.is_absolute() and '..' not in pure.parts
                  normalized = pure.as_posix().rstrip('/')
                  assert normalized and normalized not in seen
                  seen.add(normalized)
                  mode = (info.external_attr >> 16) & 0xFFFF
                  assert not stat.S_ISLNK(mode)
                  assert not stat.S_ISCHR(mode) and not stat.S_ISBLK(mode) and not stat.S_ISFIFO(mode)
                  target_path = extracted / pure
                  target_path.resolve().relative_to(extracted.resolve())
                  if info.is_dir():
                      target_path.mkdir(parents=True, exist_ok=True)
                      continue
                  data = zf.read(info)
                  assert len(data) == info.file_size
                  expanded += len(data)
                  assert expanded <= 16 * 1024 * 1024
                  target_path.parent.mkdir(parents=True, exist_ok=True)
                  target_path.write_bytes(data)
                  files.append({'path': normalized, 'size': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          assert seen == expected_names

          source_receipt = json.loads((extracted / 'a0-source-evidence-receipt.json').read_text())
          manifest = json.loads((extracted / 'source-manifest.json').read_text())
          truth_1 = (extracted / 'current-truth-1.json').read_bytes()
          truth_2 = (extracted / 'current-truth-2.json').read_bytes()
          truth = (extracted / 'current-truth.json').read_bytes()
          assert truth_1 == truth_2 == truth
          truth_value = json.loads(truth)

          assert source_receipt['status'] == 'PASS_HEPTA_INTELLIGENCE_A0_SOURCE_EVIDENCE'
          assert source_receipt['candidate'] == {
              'branch': os.environ['TARGET_BRANCH'],
              'head': os.environ['TARGET_HEAD'],
              'tree': os.environ['TARGET_TREE'],
              'parent': os.environ['TARGET_PARENT'],
          }
          assert source_receipt['a0_candidate_qualified'] is False
          assert source_receipt['selected'] is False
          assert source_receipt['source_writeback'] is False
          assert source_receipt['full_repository_merge_green'] is False
          assert source_receipt['authority'] and all(v is False for v in source_receipt['authority'].values())
          assert hashlib.sha256(canonical(truth_value)).hexdigest() == source_receipt['current_truth_sha256']

          integration = json.loads((target / 'plans/hepta-intelligence/HEPTA_INTELLIGENCE_INTEGRATION_CANDIDATE_V1.json').read_text())
          assert manifest['head'] == os.environ['TARGET_HEAD']
          assert manifest['tree'] == os.environ['TARGET_TREE']
          assert manifest['parent'] == os.environ['TARGET_PARENT']
          assert manifest['changed_paths'] == integration['allowed_changed_paths']
          assert len(manifest['changed_paths']) == 17
          assert manifest['source_writeback'] is False
          assert manifest['a0_candidate_qualified'] is False

          observer = [j for j in observer_jobs if j.get('name') == 'Observe immutable A0 source artifact on macOS']
          assert len(observer) == 1
          observer = observer[0]
          assert int(observer.get('runner_id') or 0) > 0
          assert observer.get('runner_name') and observer.get('labels')

          workflow = Path('observer/.github/workflows/hepta-a0-external-observer-macos.yml')
          workflow_blob = subprocess.check_output(
              ['git', '-C', 'observer', 'rev-parse', f"{os.environ['GITHUB_SHA']}:.github/workflows/hepta-a0-external-observer-macos.yml"],
              text=True,
          ).strip()
          receipt = {
              'schema': 'hepta_intelligence_a0_exact_head_evidence_receipt_v2',
              'status': 'PASS_HEPTA_INTELLIGENCE_A0_EXACT_HEAD_EVIDENCE_OBSERVED',
              'repository': os.environ['EXPECTED_REPOSITORY'],
              'candidate': {
                  'branch': os.environ['TARGET_BRANCH'],
                  'head': os.environ['TARGET_HEAD'],
                  'tree': os.environ['TARGET_TREE'],
                  'parent': os.environ['TARGET_PARENT'],
              },
              'observer': {
                  'workflow_path': '.github/workflows/hepta-a0-external-observer-macos.yml',
                  'workflow_commit': os.environ['GITHUB_SHA'],
                  'workflow_blob_sha': workflow_blob,
                  'workflow_content_sha256': hashlib.sha256(workflow.read_bytes()).hexdigest(),
                  'run_id': int(os.environ['GITHUB_RUN_ID']),
                  'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
                  'job_id': observer['id'],
                  'runner_id': observer['runner_id'],
                  'runner_name': observer['runner_name'],
                  'runner_labels': observer['labels'],
                  'transport_self_binding': False,
              },
              'producer': {
                  'run_id': int(os.environ['SOURCE_RUN_ID']),
                  'job_id': producer['id'],
                  'runner_id': producer['runner_id'],
                  'runner_name': producer['runner_name'],
                  'runner_labels': producer['labels'],
                  'required_steps': sorted(required_steps),
              },
              'artifact': {
                  'id': artifact['id'],
                  'name': artifact['name'],
                  'digest': artifact['digest'],
                  'created_at': artifact['created_at'],
                  'expires_at': artifact['expires_at'],
                  'expired': artifact['expired'],
                  'expanded_bytes': expanded,
                  'files': sorted(files, key=lambda x: x['path']),
              },
              'evidence': {
                  'source_receipt_sha256': hashlib.sha256((extracted / 'a0-source-evidence-receipt.json').read_bytes()).hexdigest(),
                  'source_manifest_sha256': hashlib.sha256((extracted / 'source-manifest.json').read_bytes()).hexdigest(),
                  'current_truth_sha256': hashlib.sha256(truth).hexdigest(),
                  'current_truth_canonical_sha256': hashlib.sha256(canonical(truth_value)).hexdigest(),
                  'archive_sha256': archive_digest,
              },
              'conclusion': {
                  'source_evidence_observed': True,
                  'a0_candidate_qualified': False,
                  'selected': False,
                  'runtime_wired': False,
                  'runtime_qualified': False,
                  'production_authority': False,
                  'full_repository_merge_green': False,
              },
              'authority': source_receipt['authority'],
          }
          receipt['receipt_binding_sha256'] = hashlib.sha256(canonical(receipt)).hexdigest()
          (report / 'a0-external-observer-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          (report / 'safe-extraction-manifest.json').write_text(
              json.dumps({'archive_sha256': archive_digest, 'expanded_bytes': expanded, 'files': sorted(files, key=lambda x: x['path'])}, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git -C target diff --check HEAD^ HEAD
          test -z "$(git -C target status --porcelain --untracked-files=no)"

      - name: Upload external observer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-a0-external-observer-${{ env.TARGET_HEAD }}-${{ github.sha }}
          path: target/artifacts/hepta-a0-external-observer/**
          if-no-files-found: error
          retention-days: 30
