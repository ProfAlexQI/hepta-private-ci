name: Hepta Intelligence Q0 bootstrap v10

on:
  push:
    branches:
      - codex/hepta-intelligence-plan-v3-20260828
    paths:
      - .github/workflows/hepta-intelligence-q0-bootstrap-v10.yml

permissions:
  contents: write

concurrency:
  group: hepta-intelligence-q0-bootstrap-v10
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact bootstrap commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Materialize and validate atomic Q0 candidate
        shell: bash
        env:
          EXPECTED_BRANCH: codex/hepta-intelligence-plan-v3-20260828
          EXPECTED_PARENT: b5be850d64501730424f8108b078406135593578
          PAYLOAD_SHA256: 867672d39d2853833d19b92b0b61981832fbfa6f43b25161d5978108cc2887b1
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ProfHepta/hepta-private-ci"
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

          base64 --decode .github/q0-v10-payload.b64 > /tmp/q0-v10-payload.tar.gz
          printf '%s  %s\n' "$PAYLOAD_SHA256" /tmp/q0-v10-payload.tar.gz | sha256sum --check --strict
          tar -xzf /tmp/q0-v10-payload.tar.gz
          sed -i "s/__PARENT_SHA__/${GITHUB_SHA}/" \
            .github/workflows/hepta-intelligence-q0-paired-candidate-v10.yml
          ! grep -R '__PARENT_SHA__' \
            .github/workflows/hepta-intelligence-q0-paired-candidate-v10.yml

          rm -f \
            .github/q0-v10-payload.b64 \
            .github/workflows/hepta-intelligence-q0-bootstrap-v10.yml \
            .github/workflows/hepta-intelligence-q0-exact-candidate-v9.yml \
            .github/workflows/hepta-intelligence-q0-independent-witness.yml \
            .github/workflows/hepta-intelligence-grounding-ledger.yml \
            .github/workflows/hepta-intelligence-grounding-gate.yml \
            .github/workflows/hepta-intelligence-mutation-state-machine.yml \
            .github/workflows/hepta-intelligence-mutation-journal.yml \
            .github/workflows/hepta-intelligence-shadow-host.yml

          python3 -m py_compile \
            .github/scripts/hepta-intelligence-q0-supplemental-repair-v1.py \
            scripts/verify-hepta-intelligence-q0-evidence-pair.py \
            scripts/verify-hepta-intelligence-repository-identity.py \
            scripts/verify-hepta-intelligence-q0-workflow-consolidation.py
          bash -n scripts/q0-qualification/00-prepare.sh
          bash -n scripts/q0-qualification/10-source-gates.sh
          bash -n scripts/q0-qualification/30-receipt.sh
          python3 scripts/verify-hepta-intelligence-q0-evidence-pair.py --self-test
          python3 scripts/verify-hepta-intelligence-repository-identity.py
          python3 scripts/verify-hepta-intelligence-q0-workflow-consolidation.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check

          python3 - <<'PY'
          import subprocess

          expected = {
              ".github/q0-v10-payload.b64",
              ".github/scripts/hepta-intelligence-q0-supplemental-repair-v1.py",
              ".github/workflows/hepta-intelligence-q0-bootstrap-v10.yml",
              ".github/workflows/hepta-intelligence-q0-paired-candidate-v10.yml",
              ".github/workflows/hepta-intelligence-q0-exact-candidate-v9.yml",
              ".github/workflows/hepta-intelligence-q0-independent-witness.yml",
              ".github/workflows/hepta-intelligence-grounding-ledger.yml",
              ".github/workflows/hepta-intelligence-grounding-gate.yml",
              ".github/workflows/hepta-intelligence-mutation-state-machine.yml",
              ".github/workflows/hepta-intelligence-mutation-journal.yml",
              ".github/workflows/hepta-intelligence-shadow-host.yml",
              "plans/hepta-intelligence/HEPTA_INTELLIGENCE_Q0_WORKFLOW_CONSOLIDATION_V1.json",
              "plans/hepta-intelligence/HEPTA_INTELLIGENCE_REPOSITORY_IDENTITY_V1.json",
              "scripts/q0-qualification/00-prepare.sh",
              "scripts/q0-qualification/10-source-gates.sh",
              "scripts/q0-qualification/30-receipt.sh",
              "scripts/verify-hepta-intelligence-q0-evidence-pair.py",
              "scripts/verify-hepta-intelligence-repository-identity.py",
              "scripts/verify-hepta-intelligence-q0-workflow-consolidation.py",
          }
          actual = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          assert actual == expected, {"missing": sorted(expected - actual), "extra": sorted(actual - expected)}
          print("PASS_Q0_V10_ATOMIC_CHANGESET")
          PY

          git config user.name "hepta-q0-bot"
          git config user.email "hepta-q0-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(intelligence): close Q0 execution and evidence blockers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
