name: Hepta operation materialize once

on:
  push:
    branches:
      - codex/hepta-architecture-convergence-p0-2-20260828
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-operation-materialize-once
  cancel-in-progress: true

env:
  BRANCH_NAME: codex/hepta-architecture-convergence-p0-2-20260828
  SOURCE_HEAD: ${{ github.sha }}

jobs:
  materialize:
    name: Materialize audited operation source and retire mutators
    if: ${{ !contains(github.event.head_commit.message || '', '[hepta-operation-materialized]') }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 2
          persist-credentials: true

      - name: Prove exact current branch identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH_NAME"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          git fetch --no-tags origin "refs/heads/$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
          test "$(git rev-parse refs/remotes/origin/$BRANCH_NAME)" = "$SOURCE_HEAD"
          git diff --exit-code
          git diff --cached --exit-code

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt

      - name: Apply audited deterministic source repair
        run: python3 scripts/hepta-operation-safety-repair.py

      - name: Normalize exact audited Rust files
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          files=(
            hepta-automation/src/model.rs
            hepta-automation/src/store.rs
            hepta-agentd/src/automation.rs
            hepta-matrix-store/src/operation.rs
            hepta-matrix-store/src/store.rs
            hepta-matrix-store/tests/sqlite_full.rs
            hepta-contracts/src/provider_operation.rs
            hepta-contracts/tests/cross_owner_fault_matrix.rs
            hepta-memory-runtime/src/production_writer.rs
          )
          rustfmt --edition 2024 --config skip_children=true "${files[@]}"
          rustfmt --edition 2024 --check --config skip_children=true "${files[@]}"

      - name: Enforce bounded generated source surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/hepta-automation-operation-repair-once.yml",
              ".github/workflows/hepta-operation-materialize-once.yml",
              ".github/workflows/hepta-operation-safety-repair-slim-once.yml",
              "scripts/.hepta-automation-repair-trigger",
              "scripts/hepta-operation-safety-repair.py",
              "scripts/hepta-automation-operation-repair-once.py",
              "scripts/hepta-automation-operation-repair-once.py.part-00",
              "scripts/hepta-automation-operation-repair-once.py.part-01",
              "scripts/hepta-automation-operation-repair-once.py.part-02",
              "scripts/hepta-automation-operation-repair-once.py.part-03",
              "scripts/hepta-automation-model-v4.rs",
              "scripts/verify-hepta-cross-owner-operation-wiring.py",
              "codex-rs/hepta-automation/src/model.rs",
              "codex-rs/hepta-automation/src/store.rs",
              "codex-rs/hepta-automation/migrations/0004_operation_identity.sql",
              "codex-rs/hepta-agentd/src/automation.rs",
              "codex-rs/hepta-matrix-store/src/operation.rs",
              "codex-rs/hepta-matrix-store/src/store.rs",
              "codex-rs/hepta-matrix-store/tests/sqlite_full.rs",
              "codex-rs/hepta-contracts/src/provider_operation.rs",
              "codex-rs/hepta-contracts/tests/cross_owner_fault_matrix.rs",
              "codex-rs/hepta-memory-runtime/src/production_writer.rs",
          }
          tracked = set(subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=ACMRTUXB"], text=True
          ).splitlines())
          untracked = set(subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard"], text=True
          ).splitlines())
          changed = tracked | untracked
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"operation materializer escaped allowlist: {unexpected}")
          required = {
              "codex-rs/hepta-automation/src/model.rs",
              "codex-rs/hepta-automation/src/store.rs",
              "codex-rs/hepta-automation/migrations/0004_operation_identity.sql",
              "codex-rs/hepta-agentd/src/automation.rs",
              "codex-rs/hepta-matrix-store/src/operation.rs",
              "codex-rs/hepta-matrix-store/src/store.rs",
              "codex-rs/hepta-contracts/src/provider_operation.rs",
              "scripts/verify-hepta-cross-owner-operation-wiring.py",
          }
          missing = sorted(required - changed)
          if missing:
              raise SystemExit(f"operation materializer did not produce: {missing}")
          PY
          git diff --check

      - name: Retire every operation source mutator
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/hepta-automation-operation-repair-once.py
          git rm --ignore-unmatch \
            .github/workflows/hepta-automation-operation-repair-once.yml \
            .github/workflows/hepta-operation-materialize-once.yml \
            .github/workflows/hepta-operation-safety-repair-slim-once.yml \
            scripts/.hepta-automation-repair-trigger \
            scripts/hepta-operation-safety-repair.py \
            scripts/hepta-automation-operation-repair-once.py.part-00 \
            scripts/hepta-automation-operation-repair-once.py.part-01 \
            scripts/hepta-automation-operation-repair-once.py.part-02 \
            scripts/hepta-automation-operation-repair-once.py.part-03 \
            scripts/hepta-automation-model-v4.rs
          python3 scripts/verify-hepta-architecture-convergence-p0-2.py
          python3 scripts/verify-hepta-cross-owner-operation-wiring.py
          python3 scripts/verify-hepta-memory-runtime-extraction-p0-1.py
          python3 scripts/verify-hepta-architecture-gap-ledger.py
          git diff --check

      - name: Commit after final remote CAS
        shell: bash
        run: |
          set -euo pipefail
          git add \
            scripts/verify-hepta-cross-owner-operation-wiring.py \
            codex-rs/hepta-automation/src/model.rs \
            codex-rs/hepta-automation/src/store.rs \
            codex-rs/hepta-automation/migrations/0004_operation_identity.sql \
            codex-rs/hepta-agentd/src/automation.rs \
            codex-rs/hepta-matrix-store/src/operation.rs \
            codex-rs/hepta-matrix-store/src/store.rs \
            codex-rs/hepta-matrix-store/tests/sqlite_full.rs \
            codex-rs/hepta-contracts/src/provider_operation.rs \
            codex-rs/hepta-contracts/tests/cross_owner_fault_matrix.rs \
            codex-rs/hepta-memory-runtime/src/production_writer.rs
          git diff --cached --check
          git fetch --no-tags origin "refs/heads/$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
          test "$(git rev-parse refs/remotes/origin/$BRANCH_NAME)" = "$SOURCE_HEAD"
          git config user.name "Hepta operation materializer"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git commit -m "fix(hepta): materialize operation safety closure [hepta-operation-materialized]"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
