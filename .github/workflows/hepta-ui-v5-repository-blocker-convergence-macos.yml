name: Hepta UI v5 repository blocker convergence macOS

on:
  push:
    branches:
      - automation/ui-v5-repository-blocker-convergence-macos-322200-20260830
    paths:
      - .github/workflows/hepta-ui-v5-repository-blocker-convergence-macos.yml

permissions:
  contents: write

concurrency:
  group: hepta-ui-v5-repository-blocker-convergence-macos-322200
  cancel-in-progress: false

jobs:
  converge-macos:
    if: github.repository == 'ProfHepta/hepta-private-ci'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DRIVER_PATH: .github/workflows/hepta-ui-v5-repository-blocker-convergence-macos.yml
      TARGET_BRANCH: codex/ui-v5-plan-and-repo-gap-closure-20260829
      EXPECTED_PR_HEAD: dba1fce798e3c5ce7964a64c2f41114c375f12d0
      CANDIDATE_HEAD: 322200c8c1acb66ff9d010b5ecca9e9b9a9b26fe
      OUTPUT_BRANCH: staging/ui-v5-repository-blocker-convergence-macos-322200-20260830
      R13_PREVIOUS_HEAD: dde85b435b16994f956bce08e5fb796ed94c27fd
      R13_HEAD: da23e131e68b171909407f469da1b2f72d9c4f4a
      R13_REF: refs/remotes/upstream/hepta-intake-20260830-r13
      INTAKE_PATH: docs/architecture/HEPTA_UPSTREAM_CODEX_CURRENT_INTAKE_2026-08-30_R13.json
      RECORD_PATH: docs/architecture/HEPTA_UPSTREAM_CODEX_R13_SEMANTIC_ABSORPTION_RECORD_2026-08-30.json
      REGISTRY_PATH: docs/architecture/HEPTA_UPSTREAM_CODEX_SEMANTIC_ABSORPTION_REGISTRY_V1.json
      CONTRACT_PATH: .github/hepta-ci-contract-v1.json
      MATERIALIZER_PATH: scripts/hepta-ci-materialize-upstream-intake
      SIDECAR_CONTRACT_PATH: .github/hepta-ci-upstream-intake-r13-extension-v1.json
      SIDECAR_REGISTRY_PATH: docs/architecture/HEPTA_UPSTREAM_CODEX_SEMANTIC_ABSORPTION_EXTENSION_R13_V1.json

    steps:
      - name: Check out exact convergence driver
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify driver ancestry and exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_HEAD"
          test "$(git diff --name-only HEAD^ HEAD)" = "$DRIVER_PATH"
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_PR_HEAD"
          git merge-base --is-ancestor "$EXPECTED_PR_HEAD" "$CANDIDATE_HEAD"
          git checkout --detach "$CANDIDATE_HEAD"
          test -z "$(git status --short)"
          test "${BASH_VERSINFO[0]}" -eq 3

      - name: Verify current upstream and candidate repairs
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git ls-remote https://github.com/openai/codex.git refs/heads/main | awk 'NR == 1 {print $1}')"
          test "$actual" = "$R13_HEAD"
          git fetch --no-tags --filter=blob:none https://github.com/openai/codex.git "$R13_HEAD"
          test "$(git rev-parse FETCH_HEAD)" = "$R13_HEAD"
          git merge-base --is-ancestor "$R13_PREVIOUS_HEAD" "$R13_HEAD"
          git update-ref "$R13_REF" "$R13_HEAD" 0000000000000000000000000000000000000000
          scripts/hepta-budgeted-test self-test > /tmp/hepta-budgeted-test.json
          jq -e '.status == "ready" and .embedded_repository_state_enforced == true' /tmp/hepta-budgeted-test.json >/dev/null
          scripts/hepta-native-robrix-upstream-sync-check-v2.sh --json --strict > /tmp/hepta-native-sync.json
          jq -e '.status == "ready" and .provenance_ready == true and .downstream_overlay_accounted == true' /tmp/hepta-native-sync.json >/dev/null
          scripts/hepta-native-product-shell-gate-v2.sh --output /tmp/hepta-native-shell.json
          jq -e '.status == "ready"' /tmp/hepta-native-shell.json >/dev/null
          test -z "$(git status --short)"

      - name: Canonically fold R13
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          intake_path = root / os.environ["INTAKE_PATH"]
          record_path = root / os.environ["RECORD_PATH"]
          registry_path = root / os.environ["REGISTRY_PATH"]
          contract_path = root / os.environ["CONTRACT_PATH"]
          materializer_path = root / os.environ["MATERIALIZER_PATH"]
          previous_head = os.environ["R13_PREVIOUS_HEAD"]
          r13_head = os.environ["R13_HEAD"]
          r13_ref = os.environ["R13_REF"]

          def load(path: Path):
              return json.loads(path.read_text(encoding="utf-8"))

          def write(path: Path, value):
              path.write_text(json.dumps(value, indent=2) + "\n", encoding="utf-8")

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          intake = load(intake_path)
          record = load(record_path)
          observation = intake["observation"]
          assert intake["schema_version"] == "hepta_upstream_codex_current_intake_v13"
          assert observation["range_start_exclusive"] == previous_head
          assert observation["range_end_inclusive"] == r13_head
          assert observation["observed_upstream_head"] == r13_head
          assert observation["commit_count"] == 4
          assert observation["merge_commit_count"] == 0
          inventory = intake["commit_inventory"]
          assert len(inventory) == 4 and inventory[-1]["upstream_commit"] == r13_head

          intake_sha = digest(intake_path)
          source = record["source_intake"]
          assert source["path"] == os.environ["INTAKE_PATH"]
          assert source["manifest_sha256"] == intake_sha
          assert source["range_start_exclusive"] == previous_head
          assert source["range_end_inclusive"] == r13_head
          source_commit = source["commit"]
          subprocess.run(["git", "cat-file", "-e", f"{source_commit}^{{commit}}"], check=True)
          subprocess.run(["git", "merge-base", "--is-ancestor", source_commit, os.environ["CANDIDATE_HEAD"]], check=True)
          assert record["absorptions"] == []
          deferrals = record["deferrals"]
          assert len(deferrals) == 4
          assert {item["upstream_commit"] for item in deferrals} == {item["upstream_commit"] for item in inventory}
          record_sha = digest(record_path)

          registry = load(registry_path)
          assert registry["schema_version"] == "hepta_upstream_codex_semantic_absorption_registry_v1"
          assert registry["status"] == "ready"
          assert registry["upstream"]["expected_head"] == previous_head
          assert registry["upstream"]["frozen_ref"] == "refs/remotes/upstream/hepta-intake-20260830-r12"
          assert len(registry["records"]) == 12
          assert all(item["id"] != "r13" for item in registry["records"])
          bindings = []
          for item in deferrals:
              assert item["hepta_commit"] is None
              assert item["scope"] and item["non_claims"]
              bindings.append({
                  "kind": "deferral",
                  "upstream_commit": item["upstream_commit"],
                  "local_commit": None,
                  "scope": item["scope"],
                  "non_claims": item["non_claims"],
              })
          registry["records"].append({
              "id": "r13",
              "source_intake": {
                  "path": os.environ["INTAKE_PATH"],
                  "sha256": intake_sha,
                  "range_start_exclusive": previous_head,
                  "range_end_inclusive": r13_head,
                  "frozen_ref": r13_ref,
              },
              "record": {
                  "path": os.environ["RECORD_PATH"],
                  "sha256": record_sha,
                  "schema_version": "hepta_upstream_codex_semantic_absorption_record_v1",
              },
              "disposition_bindings": bindings,
          })
          registry["upstream"]["frozen_ref"] = r13_ref
          registry["upstream"]["expected_head"] = r13_head
          write(registry_path, registry)

          contract = load(contract_path)
          refs = contract["upstream_intake"]["refs"]
          assert refs[-1] == {
              "role": "current_r12",
              "ref": "refs/remotes/upstream/hepta-intake-20260830-r12",
              "sha": previous_head,
          }
          assert all(item["role"] != "current_r13" for item in refs)
          refs.append({"role": "current_r13", "ref": r13_ref, "sha": r13_head})
          contract["upstream_truth"]["registry_sha256"] = digest(registry_path)
          write(contract_path, contract)

          text = materializer_path.read_text(encoding="utf-8")
          constant_anchor = f'EXPECTED_R12_SHA="{previous_head}"\n'
          assert text.count(constant_anchor) == 1
          text = text.replace(
              constant_anchor,
              constant_anchor + f'EXPECTED_R13_REF="{r13_ref}"\nEXPECTED_R13_SHA="{r13_head}"\n',
              1,
          )
          lines = text.splitlines(keepends=True)
          indexes = [i for i, line in enumerate(lines) if '--arg r12_sha "$EXPECTED_R12_SHA"' in line]
          assert len(indexes) == 1
          continuation = " " + chr(92) + "\n"
          lines[indexes[0] + 1:indexes[0] + 1] = [
              '    --arg r13_ref "$EXPECTED_R13_REF"' + continuation,
              '    --arg r13_sha "$EXPECTED_R13_SHA"' + continuation,
          ]
          text = "".join(lines)
          list_anchor = '{role:"current_r12",ref:$r12_ref,sha:$r12_sha}\n        ]'
          assert text.count(list_anchor) == 1
          text = text.replace(
              list_anchor,
              '{role:"current_r12",ref:$r12_ref,sha:$r12_sha},\n'
              '          {role:"current_r13",ref:$r13_ref,sha:$r13_sha}\n'
              '        ]',
              1,
          )
          output_anchor = 'current_r12_ref_materialized:true,merge_performed:false'
          assert text.count(output_anchor) == 1
          text = text.replace(
              output_anchor,
              'current_r12_ref_materialized:true,current_r13_ref_materialized:true,merge_performed:false',
              1,
          )
          materializer_path.write_text(text, encoding="utf-8")

          for relative in (os.environ["SIDECAR_CONTRACT_PATH"], os.environ["SIDECAR_REGISTRY_PATH"]):
              path = root / relative
              assert path.is_file()
              path.unlink()
          PY
          python3 -m json.tool "$REGISTRY_PATH" >/dev/null
          python3 -m json.tool "$CONTRACT_PATH" >/dev/null
          bash -n "$MATERIALIZER_PATH"
          git diff --check
          git config user.name hepta-ui-v5-convergence-macos
          git config user.email hepta-ui-v5-convergence-macos@invalid
          git add -A -- "$REGISTRY_PATH" "$CONTRACT_PATH" "$MATERIALIZER_PATH" "$SIDECAR_CONTRACT_PATH" "$SIDECAR_REGISTRY_PATH"
          git diff --cached --check
          git commit -m 'fix(upstream): fold R13 into canonical truth contracts'

      - name: Execute canonical gates and publish
        shell: bash
        run: |
          set -euo pipefail
          scripts/hepta-ci-materialize-upstream-intake materialize > /tmp/hepta-r13-materialize.json
          jq -e '.status == "ready" and .current_r13_ref_materialized == true and .refs[-1].role == "current_r13"' /tmp/hepta-r13-materialize.json >/dev/null
          scripts/hepta-ci-materialize-upstream-intake verify
          scripts/hepta-upstream-truth-gate verify-semantic > /tmp/hepta-r13-semantic.json
          jq -e '.status == "ready" and .record_count == 13' /tmp/hepta-r13-semantic.json >/dev/null
          scripts/hepta-upstream-truth-gate self-test > /tmp/hepta-upstream-self-test.json
          scripts/hepta-ci-baseline contract
          scripts/hepta-ci-baseline contract-self-test
          scripts/hepta-budgeted-test self-test > /tmp/hepta-budgeted-test-final.json
          scripts/hepta-native-robrix-upstream-sync-check-v2.sh --json --strict > /tmp/hepta-native-sync-final.json
          scripts/hepta-native-product-shell-gate-v2.sh --output /tmp/hepta-native-shell-final.json
          test -z "$(git status --short)"
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_HEAD"
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_PR_HEAD"
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH"
          printf 'qualified_head=%s\nrunner=%s\nupstream_head=%s\n' "$(git rev-parse HEAD)" "$RUNNER_OS" "$R13_HEAD" >> "$GITHUB_STEP_SUMMARY"
