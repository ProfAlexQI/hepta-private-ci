name: Temporary Hepta Intelligence A0 formatter

on:
  push:
    branches:
      - "automation/hepta-intelligence-a0-format-20260830"

permissions:
  contents: write

concurrency:
  group: hepta-a0-format-once
  cancel-in-progress: false

jobs:
  format-a0-scripts:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout formatter branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2

      - name: Set up locked uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3

      - name: Format only the four A0 Python sources
        shell: bash
        run: |
          set -euo pipefail
          files=(
            scripts/hepta-intelligence-current-truth.py
            scripts/verify-hepta-intelligence-a0-authority.py
            scripts/verify-hepta-intelligence-document-authority.py
            scripts/verify-hepta-intelligence-master-plan.py
          )
          uv run --frozen --project scripts ruff format "${files[@]}"
          python3 -m py_compile "${files[@]}"
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 4
          for path in "${changed[@]}"; do
            case "$path" in
              scripts/hepta-intelligence-current-truth.py|scripts/verify-hepta-intelligence-a0-authority.py|scripts/verify-hepta-intelligence-document-authority.py|scripts/verify-hepta-intelligence-master-plan.py) ;;
              *) echo "unexpected formatted path: $path" >&2; exit 1 ;;
            esac
          done

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/hepta-intelligence-current-truth.py \
            scripts/verify-hepta-intelligence-a0-authority.py \
            scripts/verify-hepta-intelligence-document-authority.py \
            scripts/verify-hepta-intelligence-master-plan.py
          git commit -m "chore(format): apply A0 ruff format"
          git push origin HEAD:automation/hepta-intelligence-a0-format-20260830
