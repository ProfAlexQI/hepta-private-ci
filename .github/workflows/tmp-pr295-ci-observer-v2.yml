name: Temporary clean-output CI observer v2

on:
  push:
    branches:
      - codex/tmp-generate-cargo-lock-20260902

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: hepta-clean-output-ci-observer-v2-20260902
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HEAD_BRANCH: codex/hepta-v8-final-gap-closure-output-20260902
      REPORT_BRANCH: codex/hepta-v8-ci-report-20260902
    steps:
      - name: Observe exact clean-output PR and retry transient failures once
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p observer-logs
          pr_json="$(gh api "/repos/${REPOSITORY}/pulls?state=open&head=TrillionniumFoundation:${HEAD_BRANCH}")"
          printf '%s\n' "$pr_json" > observer-logs/pr-discovery.json
          test "$(jq 'length' <<<"$pr_json")" = "1"
          pr_number="$(jq -r '.[0].number' <<<"$pr_json")"
          head_sha="$(jq -r '.[0].head.sha' <<<"$pr_json")"
          printf '{"pr":%s,"headSha":"%s","headBranch":"%s"}\n' "$pr_number" "$head_sha" "$HEAD_BRANCH" > observer-logs/identity.json

          deadline=$((SECONDS + 2700))
          rerun_done=false
          while (( SECONDS < deadline )); do
            runs="$(gh api --paginate "/repos/${REPOSITORY}/actions/runs?head_sha=${head_sha}&event=pull_request&per_page=100" --jq '.workflow_runs')"
            printf '%s\n' "$runs" > observer-logs/runs-current.json
            if [[ "$(jq 'length' <<<"$runs")" = "0" ]]; then
              sleep 15
              continue
            fi
            if [[ "$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")" != "0" ]]; then
              sleep 20
              continue
            fi
            failed_ids="$(jq -r '.[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure") | .id' <<<"$runs")"
            if [[ -n "$failed_ids" && "$rerun_done" = "false" ]]; then
              while read -r run_id; do
                [[ -n "$run_id" ]] || continue
                gh api --method POST "/repos/${REPOSITORY}/actions/runs/${run_id}/rerun-failed-jobs" || true
              done <<<"$failed_ids"
              rerun_done=true
              sleep 30
              continue
            fi
            break
          done

          runs="$(gh api --paginate "/repos/${REPOSITORY}/actions/runs?head_sha=${head_sha}&event=pull_request&per_page=100" --jq '.workflow_runs')"
          printf '%s\n' "$runs" > observer-logs/runs-final.json
          jq -n \
            --argjson pr "$pr_number" \
            --arg headSha "$head_sha" \
            --arg headBranch "$HEAD_BRANCH" \
            --argjson runs "$runs" \
            '{schema:"hepta.ci-observation.v1",pr:$pr,headSha:$headSha,headBranch:$headBranch,workflows:[$runs[]|{id,name,status,conclusion,event,run_number,html_url}],counts:{total:($runs|length),active:([$runs[]|select(.status!="completed")]|length),failed:([$runs[]|select(.conclusion=="failure" or .conclusion=="timed_out" or .conclusion=="action_required" or .conclusion=="startup_failure")]|length),successful:([$runs[]|select(.conclusion=="success")]|length),skipped:([$runs[]|select(.conclusion=="skipped")]|length)}}' \
            > observer-logs/summary.json

          while read -r run_id; do
            [[ -n "$run_id" ]] || continue
            gh api "/repos/${REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > "observer-logs/jobs-${run_id}.json"
            gh run view "$run_id" --repo "$REPOSITORY" --log-failed > "observer-logs/failed-${run_id}.log" 2>&1 || true
          done < <(jq -r '.[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | .id' <<<"$runs")

          {
            echo "# Clean-output CI observation"
            echo
            echo "- PR: #${pr_number}"
            echo "- Head: \`${head_sha}\`"
            echo "- Workflows: $(jq '.counts.total' observer-logs/summary.json)"
            echo "- Active: $(jq '.counts.active' observer-logs/summary.json)"
            echo "- Failed: $(jq '.counts.failed' observer-logs/summary.json)"
            echo "- Successful: $(jq '.counts.successful' observer-logs/summary.json)"
          } > observer-logs/README.md

          worktree="$(mktemp -d)"
          git clone --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "$worktree/repo"
          cd "$worktree/repo"
          git checkout --orphan report
          git rm -rf . >/dev/null 2>&1 || true
          cp -R "$GITHUB_WORKSPACE/observer-logs/." .
          git add .
          git config user.name "Hepta CI observer"
          git config user.email "hepta-ci-observer@users.noreply.github.com"
          git commit -m "chore(ci): publish exact clean-output observation"
          git push --force origin "HEAD:refs/heads/${REPORT_BRANCH}"

          cd "$GITHUB_WORKSPACE"
          test "$(jq '.counts.active' observer-logs/summary.json)" = "0"
          test "$(jq '.counts.failed' observer-logs/summary.json)" = "0"

      - name: Retain exact CI observation
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hepta-clean-output-ci-observation
          path: observer-logs
          if-no-files-found: error
          retention-days: 7
