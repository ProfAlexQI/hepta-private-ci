name: AuthBus P0.3 one-shot deterministic lock and replay hardening bootstrap

on:
  push:
    branches:
      - integration/vnext-main-full-ci-authbus-p0-3-20260828
    paths:
      - .github/workflows/authbus-p0-3-lock-bootstrap.yml

permissions:
  contents: write

env:
  MANIFEST: codex-rs/hepta-authbus-p0-3-qualification/Cargo.toml
  PACKAGE: codex-hepta-authbus-p0-3-qualification
  CRATE_ROOT: codex-rs/hepta-authbus-p0-3-qualification
  EXPECTED_PARENT: e3dc2cdee7349526e5f34ecd92e7bd4d184b4ff6

jobs:
  bootstrap:
    name: Commit replay hardening and Rust 1.95 lock only
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout exact bootstrap commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Verify one-shot branch and ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "integration/vnext-main-full-ci-authbus-p0-3-20260828"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"

      - name: Apply deterministic P0.3 hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bootstrap-authbus-p0-3.py
          python3 scripts/verify-authbus-p0-3.py | tee authbus-p0-3-bootstrap-source.json
          grep -q 'PASS_AUTHBUS_P0_3_SOURCE_ONLY' authbus-p0-3-bootstrap-source.json

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Resolve and validate deterministic outputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc -V | awk '{print $2}')" = "1.95.0"
          cargo generate-lockfile --manifest-path "${MANIFEST}"
          cargo fmt --manifest-path "${MANIFEST}" --package "${PACKAGE}"
          cargo fmt --manifest-path "${MANIFEST}" --package "${PACKAGE}" -- --check
          cargo metadata --manifest-path "${MANIFEST}" --locked --format-version 1 --no-deps >/dev/null
          test -s "${CRATE_ROOT}/Cargo.lock"

          allowed='^codex-rs/hepta-authbus-p0-3-qualification/(Cargo.lock|src/[^/]+[.]rs|tests/[^/]+[.]rs)$'
          changed="$(git status --porcelain=v1 | awk '{print $2}')"
          test -n "${changed}"
          while IFS= read -r path; do
            test -n "${path}"
            echo "${path}" | grep -Eq "${allowed}"
          done <<<"${changed}"

      - name: Commit exact deterministic outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${CRATE_ROOT}/Cargo.lock" "${CRATE_ROOT}/src" "${CRATE_ROOT}/tests"
          git diff --cached --check
          git diff --cached --name-only | tee bootstrap-files.txt
          git commit -m "fix(authbus): harden P0.3 replay and pin Rust 1.95 lock"
          git push origin "HEAD:${GITHUB_REF_NAME}" \
            --force-with-lease="refs/heads/${GITHUB_REF_NAME}:${GITHUB_SHA}"
