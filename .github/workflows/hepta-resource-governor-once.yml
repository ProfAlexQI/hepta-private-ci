name: Hepta resource governor once

on:
  push:
    branches:
      - codex/hepta-architecture-convergence-p0-2-20260828
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-resource-governor-once
  cancel-in-progress: true

env:
  BRANCH_NAME: codex/hepta-architecture-convergence-p0-2-20260828
  SOURCE_HEAD: ${{ github.sha }}
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_BUILD_JOBS: 2

jobs:
  materialize:
    name: Materialize and qualify runtime resource governor
    if: ${{ !contains(github.event.head_commit.message || '', '[hepta-resource-governor]') }}
    runs-on: ubuntu-slim
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 2
          persist-credentials: true

      - name: Prove exact clean branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH_NAME"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          git fetch --no-tags origin "refs/heads/$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
          test "$(git rev-parse refs/remotes/origin/$BRANCH_NAME)" = "$SOURCE_HEAD"
          git diff --exit-code
          git diff --cached --exit-code

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Repair exact source anchors and apply governor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/hepta-resource-governor-once.py")
          source = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '''    replace(
                  "codex-rs/app-server/src/request_processors.rs",
                  "use crate::request_serialization::RequestSerializationQueues;\\n",
                  "use crate::request_serialization::RequestSerializationQueues;\\n"
                  "use crate::runtime_resource_governor::RuntimeResourceGovernor;\\n",
              )
          ''',
                  '''    replace(
                  "codex-rs/app-server/src/request_processors.rs",
                  "use crate::outgoing_message::ThreadScopedOutgoingMessageSender;\\n",
                  "use crate::outgoing_message::ThreadScopedOutgoingMessageSender;\\n"
                  "use crate::runtime_resource_governor::RuntimeResourceGovernor;\\n",
              )
          ''',
              ),
              (
                  '''    replace(
                  relative,
                  "    turn_cost_worker: Option<crate::turn_cost_worker::TurnCostWorkerHandle>,\\n",
                  "    turn_cost_worker: Option<crate::turn_cost_worker::TurnCostWorkerHandle>,\\n"
                  "    resource_governor: RuntimeResourceGovernor,\\n",
              )
          ''',
                  '''    replace(
                  relative,
                  "    skills_watcher: Arc<SkillsWatcher>,\\n"
                  "    turn_cost_worker: Option<crate::turn_cost_worker::TurnCostWorkerHandle>,\\n"
                  "}\\n",
                  "    skills_watcher: Arc<SkillsWatcher>,\\n"
                  "    turn_cost_worker: Option<crate::turn_cost_worker::TurnCostWorkerHandle>,\\n"
                  "    resource_governor: RuntimeResourceGovernor,\\n"
                  "}\\n",
              )
          ''',
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"resource governor patch-script anchor drifted: {old[:80]!r}")
              source = source.replace(old, new)

          def qualify_run_params(start_marker: str, end_marker: str) -> None:
              global source
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              section = source[start:end]
              lhs = '        "        output_bytes_cap,\\n    } = params;\\n",'
              lhs_new = (
                  '        "        expiration,\\n"\n'
                  '        "        output_bytes_cap,\\n"\n'
                  '        "    } = params;\\n",'
              )
              rhs = (
                  '        "        output_bytes_cap,\\n"\n'
                  '        "        tool_process_permit: _tool_process_permit,\\n"'
              )
              rhs_new = (
                  '        "        expiration,\\n"\n'
                  '        "        output_bytes_cap,\\n"\n'
                  '        "        tool_process_permit: _tool_process_permit,\\n"'
              )
              if section.count(lhs) != 1 or section.count(rhs) != 1:
                  raise SystemExit(f"run-parameter anchor drifted in {start_marker}")
              section = section.replace(lhs, lhs_new).replace(rhs, rhs_new)
              source = source[:start] + section + source[end:]

          qualify_run_params(
              "def patch_command_exec() -> None:",
              "\ndef patch_command_exec_processor() -> None:",
          )
          qualify_run_params(
              "def patch_process_exec() -> None:",
              "\ndef patch_agentd() -> None:",
          )
          path.write_text(source, encoding="utf-8")
          PY
          python3 scripts/hepta-resource-governor-once.py

      - name: Normalize owned Rust source
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -p codex-app-server -p codex-hepta-agentd
          cargo fmt -p codex-app-server -p codex-hepta-agentd -- --check

      - name: Retire source mutator
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/hepta-resource-governor-once.yml \
            scripts/hepta-resource-governor-once.py

      - name: Verify source ratchets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-hepta-architecture-convergence-p0-2.py
          python3 scripts/verify-hepta-authority-callers-p0-1.py
          python3 scripts/verify-hepta-memory-runtime-extraction-p0-1.py
          python3 scripts/verify-hepta-cross-owner-operation-wiring.py
          python3 scripts/verify-hepta-architecture-gap-ledger.py
          git diff --check

      - name: Check affected packages
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p codex-app-server -p codex-hepta-agentd

      - name: Execute resource governor tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-app-server runtime_resource_governor -- --nocapture
          cargo test --locked -p codex-app-server thread_state::tests::terminal_before_bind_drops_turn_permit_without_leak -- --nocapture
          cargo test --locked -p codex-app-server thread_state::tests::listener_clear_releases_bound_turn_permit -- --nocapture
          cargo test --locked -p codex-hepta-agentd app_runtime::tests::manifest_queue_capacity_reaches_app_server_runtime_options_exactly -- --nocapture

      - name: Enforce exact mutation surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/hepta-resource-governor-once.yml",
              "scripts/hepta-resource-governor-once.py",
              "codex-rs/app-server/src/runtime_resource_governor.rs",
              "codex-rs/app-server/src/lib.rs",
              "codex-rs/app-server/src/message_processor.rs",
              "codex-rs/app-server/src/request_processors.rs",
              "codex-rs/app-server/src/request_processors/turn_processor.rs",
              "codex-rs/app-server/src/thread_state.rs",
              "codex-rs/app-server/src/command_exec.rs",
              "codex-rs/app-server/src/request_processors/command_exec_processor.rs",
              "codex-rs/app-server/src/request_processors/process_exec_processor.rs",
              "codex-rs/hepta-agentd/src/app_runtime.rs",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          changed |= set(subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"], text=True).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"resource governor escaped allowlist: {unexpected}")
          missing = sorted(allowed - changed)
          if missing:
              raise SystemExit(f"resource governor did not materialize: {missing}")
          PY

      - name: Commit after final remote CAS
        shell: bash
        run: |
          set -euo pipefail
          git add \
            codex-rs/app-server/src/runtime_resource_governor.rs \
            codex-rs/app-server/src/lib.rs \
            codex-rs/app-server/src/message_processor.rs \
            codex-rs/app-server/src/request_processors.rs \
            codex-rs/app-server/src/request_processors/turn_processor.rs \
            codex-rs/app-server/src/thread_state.rs \
            codex-rs/app-server/src/command_exec.rs \
            codex-rs/app-server/src/request_processors/command_exec_processor.rs \
            codex-rs/app-server/src/request_processors/process_exec_processor.rs \
            codex-rs/hepta-agentd/src/app_runtime.rs
          git diff --cached --check
          git fetch --no-tags origin "refs/heads/$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
          test "$(git rev-parse refs/remotes/origin/$BRANCH_NAME)" = "$SOURCE_HEAD"
          git config user.name "Hepta resource governor materializer"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git commit -m "feat(hepta): enforce turn and tool resource budgets [hepta-resource-governor]"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
