name: Hepta inference INF-0 apply bounded repair v7

on:
  push:
    branches:
      - codex/hepta-inference-inf0-macos-diagnostics-v2-20260828
    paths:
      - ".github/workflows/hepta-inference-inf0-apply-repair-v7.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-inference-inf0-apply-repair-v7
  cancel-in-progress: false

jobs:
  apply:
    runs-on: macos-14
    timeout-minutes: 180
    env:
      BRANCH: codex/hepta-inference-runtime-v2-20260828
      EXPECTED_HEAD: 3afce0894a597f1968169400e3b79c4a5e94ec17
      REPAIR_SCRIPT: scripts/hepta-inference-inf0-bounded-repair-v6.py
      RECEIPT: docs/hepta-vnext/inference/HEPTA_INFERENCE_INF0C_SOURCE_RECEIPT_2026-08-28.json
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind exact main head and isolated repair script
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/hepta-inference-inf0-apply-repair-v7.yml"
          git show "$GITHUB_SHA:$REPAIR_SCRIPT" > "$RUNNER_TEMP/repair.py"
          python3 -m py_compile "$RUNNER_TEMP/repair.py"
          git fetch --no-tags origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Apply bounded compile and formatting repair
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/repair.py"
          (
            cd codex-rs
            cargo fmt \
              -p codex-lmstudio \
              -p codex-ollama \
              -p codex-utils-oss \
              -p codex-responses-api-proxy
          )
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          codex-rs/lmstudio/src/lib.rs
          codex-rs/lmstudio/src/sha256.rs
          codex-rs/ollama/src/client_support.inc.rs
          codex-rs/ollama/src/lib.rs
          codex-rs/responses-api-proxy/src/dump.rs
          codex-rs/responses-api-proxy/src/sha256.rs
          codex-rs/utils/oss/src/lib.rs
          EOF
          sed -i '' 's/^          //' "$RUNNER_TEMP/expected.txt"
          git diff --name-only | sort > "$RUNNER_TEMP/changed.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/changed.txt"
          git diff --check
          (
            cd codex-rs
            cargo fmt \
              -p codex-lmstudio \
              -p codex-ollama \
              -p codex-utils-oss \
              -p codex-responses-api-proxy \
              -- --check
            rustfmt --edition 2024 --check \
              ollama/src/client.rs \
              ollama/src/client_*.inc.rs \
              lmstudio/src/client.rs \
              lmstudio/src/client_*.inc.rs
          )

      - name: Compile repaired packages
        shell: bash
        working-directory: codex-rs
        run: |
          cargo check --locked \
            -p codex-lmstudio \
            -p codex-ollama \
            -p codex-utils-oss \
            -p codex-responses-api-proxy

      - name: Test repaired packages
        shell: bash
        working-directory: codex-rs
        run: |
          cargo test --locked \
            -p codex-lmstudio \
            -p codex-ollama \
            -p codex-utils-oss \
            -p codex-responses-api-proxy

      - name: Strict Clippy for repaired packages
        shell: bash
        working-directory: codex-rs
        run: |
          cargo clippy --locked --all-targets \
            -p codex-lmstudio \
            -p codex-ollama \
            -p codex-utils-oss \
            -p codex-responses-api-proxy \
            -- -D warnings

      - name: Create bounded source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            codex-rs/lmstudio/src/lib.rs \
            codex-rs/lmstudio/src/sha256.rs \
            codex-rs/ollama/src/client_support.inc.rs \
            codex-rs/ollama/src/lib.rs \
            codex-rs/responses-api-proxy/src/dump.rs \
            codex-rs/responses-api-proxy/src/sha256.rs \
            codex-rs/utils/oss/src/lib.rs
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 7
          git commit -m "fix(inference): repair package compile and formatting"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"

      - name: Rebind append-only qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RECEIPT"])
          data = json.loads(path.read_text(encoding="utf-8"))
          data["source_candidate_commit"] = os.environ["SOURCE_SHA"]
          data["source_candidate_tree"] = os.environ["SOURCE_TREE"]

          components = data["source_candidate_components"]
          components["inf0c_explicit_format_macro_bindings"] = True
          components["inf0c_package_scoped_rustfmt_repair"] = True

          validation = data["validation"]
          validation["local_python_syntax"] = "PASS"
          validation["local_receipt_json_parse"] = "PASS"
          validation["exact_candidate_source_gate"] = "NOT_RUN_FOR_NEW_RECEIPT_HEAD"
          validation["rust_fmt"] = "PASS_RUST_1_95_MACOS_PACKAGE_AND_FRAGMENT_SCOPE"
          validation["rust_check"] = "PASS_RUST_1_95_MACOS_FOUR_PACKAGE_SCOPE"
          validation["rust_test"] = "PASS_RUST_1_95_MACOS_FOUR_PACKAGE_SCOPE"
          validation["rust_clippy"] = "PASS_RUST_1_95_MACOS_FOUR_PACKAGE_SCOPE_D_WARNINGS"

          run_id = int(os.environ["GITHUB_RUN_ID"])
          history = [entry for entry in data.get("ci_history", []) if entry.get("run_id") != run_id]
          history.append({
              "run_id": run_id,
              "head": os.environ["GITHUB_SHA"],
              "runner_assigned": True,
              "runner_os": "macOS-14",
              "exact_input_head": os.environ["EXPECTED_HEAD"],
              "source_gate_full_history_diagnostic": "PASS_RUN_33174647316",
              "reference_format": "PASS",
              "fragment_format": "PASS",
              "package_format": "PASS_AFTER_REPAIR",
              "package_check": "PASS_AFTER_REPAIR",
              "package_test": "PASS_AFTER_REPAIR",
              "package_clippy_d_warnings": "PASS_AFTER_REPAIR",
              "classification": "EXECUTED_BOUNDED_SOURCE_REPAIR",
          })
          data["ci_history"] = history
          data["current_ci"] = {
              "status": "NOT_RUN_FOR_RECEIPT_HEAD",
              "runner_assigned": False,
              "source_gate": "NOT_RUN_ON_HOSTED_RUNNER_FOR_RECEIPT_HEAD",
              "reference_contract": "NOT_RUN_ON_HOSTED_RUNNER_FOR_RECEIPT_HEAD",
              "compatibility_readiness": "NOT_RUN_ON_HOSTED_RUNNER_FOR_RECEIPT_HEAD",
              "real_software_e2e": "NOT_RUN",
          }
          data["claim"] = "SOURCE_PRESENT_NOT_RUN"
          data["qualified"] = False
          data["known_gaps"] = [
              "the new exact receipt head must execute the canonical source, package formatting, test, check and Clippy matrix on its hosted qualification workflow",
              "the canonical workflow still needs its formatting responsibility narrowed from unrelated whole-workspace drift to the owned INF-0C package and fragment scope",
              "the real-software E2E harness has not executed against fixed pre-installed Ollama and LM Studio tuples",
              "semantic, tool-call, disconnect, backend cancellation acknowledgement and controlled-restart evidence remain in stacked qualification lanes",
              "hepta-inferd, the UDS protocol, native workers and hardware performance receipts are absent",
              "INF-1 remains inactive and all production, effect, model-NPU, remote-inference and promotion authority remains closed",
          ]
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          python3 -m json.tool "$RECEIPT" >/dev/null
          test "$(git diff --name-only)" = "$RECEIPT"
          git add "$RECEIPT"
          test "$(git diff --cached --name-only)" = "$RECEIPT"
          git commit -m "docs(inference): rebind repaired qualification receipt"
          echo "RECEIPT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RECEIPT_TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"

      - name: Verify final source and receipt contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/hepta-inference-inf0-source-gate.py \
            scripts/hepta-inference-inf0c-real-e2e.py
          python3 scripts/hepta-inference-inf0-source-gate.py
          (
            cd codex-rs
            cargo fmt \
              -p codex-lmstudio \
              -p codex-ollama \
              -p codex-utils-oss \
              -p codex-responses-api-proxy \
              -- --check
            rustfmt --edition 2024 --check \
              ollama/src/client.rs \
              ollama/src/client_*.inc.rs \
              lmstudio/src/client.rs \
              lmstudio/src/client_*.inc.rs
          )
          test -z "$(git status --porcelain)"

      - name: Fast-forward repaired receipt head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git push origin HEAD:"$BRANCH"

      - name: Record fail-closed result
        if: always()
        shell: bash
        run: |
          {
            echo "source_commit=${SOURCE_SHA:-not-created}"
            echo "source_tree=${SOURCE_TREE:-not-created}"
            echo "receipt_commit=${RECEIPT_SHA:-not-created}"
            echo "receipt_tree=${RECEIPT_TREE:-not-created}"
            echo "qualified=false"
            echo "INF-1=NOT_STARTED"
            echo "production/effect/model-NPU/remote/promotion authority=false"
          } >> "$GITHUB_STEP_SUMMARY"
