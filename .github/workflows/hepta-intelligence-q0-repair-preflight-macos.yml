name: Hepta Intelligence Q0 repair preflight macOS

on:
  push:
    branches:
      - qualification/q0-repair-preflight-macos-830a26b-20260829
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-intelligence-q0-repair-preflight-macos-830a26b
  cancel-in-progress: true

env:
  EXPECTED_SOURCE: 830a26b9b086ba22d0ad45b1edca74221d8b5b74
  WORKFLOW_PATH: .github/workflows/hepta-intelligence-q0-repair-preflight-macos.yml
  ARTIFACT_DIR: artifacts/hepta-intelligence-q0-repair-preflight-macos

jobs:
  preflight:
    name: Replay the complete Q0 repair tail on macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout exact preflight wrapper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify wrapper-only commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE"
          test "$(git rev-list --count "$EXPECTED_SOURCE"..HEAD)" = "1"
          test "$(git diff --name-only "$EXPECTED_SOURCE"..HEAD)" = "$WORKFLOW_PATH"

      - name: Normalize and replay the complete frozen repair tail
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/q0-qualification/normalize-hepta-intelligence-q0-repair-state.py \
            2>&1 | tee "$ARTIFACT_DIR/normalizer.log"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/hepta-intelligence-q0-manual-clippy-repair-v7.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          needle = r"        rf'(?:async[ \t]+)?fn[ \t]+{re.escape(name)}[ \t]*\('"
          assert lines.count(needle) == 1, lines.count(needle)
          index = lines.index(needle)
          assert lines[index + 1] == '    )', lines[index + 1]
          lines.insert(index + 1, "        r')'")
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 -m py_compile \
            scripts/q0-qualification/normalize-hepta-intelligence-q0-repair-state.py \
            .github/scripts/hepta-intelligence-q0-manual-clippy-repair-v7.py \
            .github/scripts/hepta-intelligence-q0-reconstruct-v7.py \
            .github/scripts/hepta-intelligence-q0-supplemental-repair-v1.py
          python3 .github/scripts/hepta-intelligence-q0-reconstruct-v7.py \
            2>&1 | tee "$ARTIFACT_DIR/reconstruct.log"
          python3 .github/scripts/hepta-intelligence-q0-supplemental-repair-v1.py \
            2>&1 | tee "$ARTIFACT_DIR/supplemental.log"
          grep -F "PASS_Q0_FULL_REPAIR_PRECONDITION" "$ARTIFACT_DIR/normalizer.log"
          grep -F "PASS_Q0_SUPPLEMENTAL_REPAIR_V1" "$ARTIFACT_DIR/supplemental.log"
          git restore --source=HEAD -- .github/scripts/hepta-intelligence-q0-manual-clippy-repair-v7.py
          git diff --check
          git diff --name-only | LC_ALL=C sort > "$ARTIFACT_DIR/changed-files.txt"
          test -s "$ARTIFACT_DIR/changed-files.txt"

      - name: Write preflight receipt
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "schema": "hepta.intelligence.q0.repair_preflight.v1",
              "status": "PASS_Q0_COMPLETE_REPAIR_REPLAY_PREFLIGHT",
              "source_commit": os.environ["EXPECTED_SOURCE"],
              "wrapper_commit": os.environ["GITHUB_SHA"],
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "source_writeback": False,
              "runtime_wired": False,
              "production_authority": False,
              "operator_acceptance": False,
              "promotion": False,
              "callers_ratchet": False,
          }
          Path(os.environ["ARTIFACT_DIR"], "receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q0-repair-preflight-macos-${{ github.sha }}
          path: artifacts/hepta-intelligence-q0-repair-preflight-macos/**
          if-no-files-found: warn
          retention-days: 7
