name: hepta-intelligence-p1-1c-rustfmt-materialization

on:
  push:
    branches:
      - "qualification/hepta-intelligence-p1-1c-rustfmt-arm-20260828"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-intelligence-p1-1c-rustfmt-materialization
  cancel-in-progress: true

env:
  SOURCE_BRANCH: codex/hepta-intelligence-offline-efficacy-p1c-20260828
  OUTPUT_BRANCH: qualification/hepta-intelligence-p1-1c-rustfmt-output-20260828
  WRAPPER_PATH: .github/workflows/hepta-intelligence-p1-1c-rustfmt-materialization.yml
  CRATE_ROOT: codex-rs/hepta-memory-p1-1c-qualification
  MANIFEST_PATH: codex-rs/hepta-memory-p1-1c-qualification/Cargo.toml
  VERIFIER_PATH: scripts/verify-hepta-intelligence-p1-1c-offline-efficacy.py
  ARTIFACT_DIR: artifacts/hepta-intelligence-p1-1c-rustfmt
  CARGO_NET_OFFLINE: "true"

jobs:
  materialize:
    name: P1.1c Rust 1.95 materialization and qualification
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout source plus wrapper
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact source and wrapper-only commit
        id: source
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          git fetch --no-tags origin \
            "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
          source_sha="$(git rev-parse "refs/remotes/origin/$SOURCE_BRANCH")"
          test "$(git rev-parse HEAD^)" = "$source_sha"
          test "$(git rev-list --count "$source_sha"..HEAD)" = "1"
          test "$(git diff --name-only "$source_sha"..HEAD)" = "$WRAPPER_PATH"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          python3 - "$source_sha" <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          source = sys.argv[1]
          receipt = {
              "schema": "hepta.intelligence.p1_1c.rustfmt_source_binding.v1",
              "source_branch": os.environ["SOURCE_BRANCH"],
              "source_commit": source,
              "source_tree": subprocess.check_output(
                  ["git", "rev-parse", f"{source}^{{tree}}"], text=True
              ).strip(),
              "wrapper_commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "wrapper_path": os.environ["WRAPPER_PATH"],
              "wrapper_only_diff": True,
              "runtime_wired": False,
              "production_authority": False,
          }
          (Path(os.environ["ARTIFACT_DIR"]) / "source-binding.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Isolate Cargo outputs
        run: |
          set -euo pipefail
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/hepta-p1-1c-rustfmt-target" >> "$GITHUB_ENV"
          rm -f "$CRATE_ROOT/Cargo.lock"
          rm -rf "$CRATE_ROOT/target"

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt,clippy

      - name: Materialize canonical formatting
        run: |
          set -euo pipefail
          rustc --version | tee "$ARTIFACT_DIR/rustc-version.txt"
          cargo --version | tee "$ARTIFACT_DIR/cargo-version.txt"
          rustfmt --version | tee "$ARTIFACT_DIR/rustfmt-version.txt"
          cargo clippy --version | tee "$ARTIFACT_DIR/clippy-version.txt"
          test "$(rustc --version | awk '{print $2}')" = "1.95.0"
          cargo fmt --manifest-path "$MANIFEST_PATH" --all
          cargo fmt --manifest-path "$MANIFEST_PATH" --all -- --check

      - name: Enforce formatting-only path boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          allowed = {
              "codex-rs/hepta-memory-p1-1c-qualification/src/bin/p1_1c_receipt.rs",
              "codex-rs/hepta-memory-p1-1c-qualification/src/corpus.rs",
              "codex-rs/hepta-memory-p1-1c-qualification/src/digest.rs",
              "codex-rs/hepta-memory-p1-1c-qualification/src/evaluation.rs",
              "codex-rs/hepta-memory-p1-1c-qualification/src/kg.rs",
              "codex-rs/hepta-memory-p1-1c-qualification/src/lib.rs",
              "codex-rs/hepta-memory-p1-1c-qualification/src/metrics.rs",
              "codex-rs/hepta-memory-p1-1c-qualification/src/reranker.rs",
              "codex-rs/hepta-memory-p1-1c-qualification/tests/p1_1c.rs",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "--", os.environ["CRATE_ROOT"]],
                  text=True,
              ).splitlines()
          )
          outside = subprocess.check_output(
              ["git", "diff", "--name-only", "--", ".", f":(exclude){os.environ['CRATE_ROOT']}/**"],
              text=True,
          ).splitlines()
          if not actual or not actual.issubset(allowed) or outside:
              raise SystemExit(
                  json.dumps(
                      {
                          "allowed": sorted(allowed),
                          "actual": sorted(actual),
                          "outside": outside,
                      },
                      indent=2,
                      sort_keys=True,
                  )
              )
          artifact_dir = Path(os.environ["ARTIFACT_DIR"])
          (artifact_dir / "formatted-changed-paths.txt").write_text(
              "\n".join(sorted(actual)) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run source verifier on formatted source
        run: |
          set -o pipefail
          python3 "$VERIFIER_PATH" \
            2>&1 | tee "$ARTIFACT_DIR/source-gate.json"

      - name: Run complete Rust gate matrix
        run: |
          set -o pipefail
          cargo test --manifest-path "$MANIFEST_PATH" --all-targets -- --nocapture \
            2>&1 | tee "$ARTIFACT_DIR/tests.log"
          cargo check --manifest-path "$MANIFEST_PATH" --all-targets \
            2>&1 | tee "$ARTIFACT_DIR/check.log"
          cargo clippy --manifest-path "$MANIFEST_PATH" --all-targets -- -D warnings \
            2>&1 | tee "$ARTIFACT_DIR/clippy.log"
          python3 - <<'PY'
          import re
          from pathlib import Path

          log = Path("artifacts/hepta-intelligence-p1-1c-rustfmt/tests.log").read_text(
              encoding="utf-8", errors="replace"
          )
          passed = sum(
              int(value)
              for value in re.findall(r"test result: ok\. (\d+) passed", log)
          )
          if passed != 13:
              raise SystemExit(f"expected 13 P1.1c tests, observed {passed}")
          PY

      - name: Verify deterministic receipt twice
        run: |
          set -euo pipefail
          cargo run --quiet --manifest-path "$MANIFEST_PATH" --bin p1_1c_receipt \
            > "$ARTIFACT_DIR/evaluation-receipt-a.json"
          cargo run --quiet --manifest-path "$MANIFEST_PATH" --bin p1_1c_receipt \
            > "$ARTIFACT_DIR/evaluation-receipt-b.json"
          cmp \
            "$ARTIFACT_DIR/evaluation-receipt-a.json" \
            "$ARTIFACT_DIR/evaluation-receipt-b.json"
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path("artifacts/hepta-intelligence-p1-1c-rustfmt/evaluation-receipt-a.json")
              .read_text(encoding="utf-8")
          )
          assert receipt["status"] == "PASS_P1_1C_SEED_PIPELINE"
          assert len(receipt["lanes"]) == 7
          assert receipt["case_count"] == 8
          for key in [
              "network_access",
              "model_download",
              "runtime_wired",
              "production_authority",
              "efficacy_validation",
              "efficacy_claim",
              "promotion",
          ]:
              assert receipt[key] is False, key
          PY

      - name: Create exact formatting commit
        id: output
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          rm -f "$CRATE_ROOT/Cargo.lock"
          rm -rf "$CRATE_ROOT/target"
          git checkout -B "$OUTPUT_BRANCH" "$SOURCE_SHA"
          git diff --check
          test -z "$(git ls-files --others --exclude-standard -- "$CRATE_ROOT")"

          mapfile -t changed < <(git diff --name-only -- "$CRATE_ROOT")
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              "$CRATE_ROOT"/*.rs|"$CRATE_ROOT"/src/*.rs|"$CRATE_ROOT"/src/bin/*.rs|"$CRATE_ROOT"/tests/*.rs) ;;
              *) echo "unexpected formatting path: $path" >&2; exit 1 ;;
            esac
          done
          git add -- "${changed[@]}"
          git config user.name "Hepta Qualification Bot"
          git config user.email "102159240+ProfAlexQI@users.noreply.github.com"
          git commit -m "style(intelligence): apply exact P1.1c Rust 1.95 rustfmt"
          output_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          echo "sha=$output_sha" >> "$GITHUB_OUTPUT"

      - name: Write materialization receipt
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          OUTPUT_SHA: ${{ steps.output.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact_dir = Path(os.environ["ARTIFACT_DIR"])
          receipt = {
              "schema": "hepta.intelligence.p1_1c.rustfmt_materialization.v1",
              "status": "PASS_P1_1C_RUSTFMT_AND_EXECUTABLE_GATES",
              "source_commit": os.environ["SOURCE_SHA"],
              "output_commit": os.environ["OUTPUT_SHA"],
              "output_branch": os.environ["OUTPUT_BRANCH"],
              "changed_paths": (artifact_dir / "formatted-changed-paths.txt")
                  .read_text(encoding="utf-8")
                  .splitlines(),
              "tests_passed": 13,
              "gates": {
                  "source_binding": "success",
                  "rust_1_95_0": "success",
                  "rustfmt": "success",
                  "source_gate": "success",
                  "tests": "success",
                  "check": "success",
                  "clippy": "success",
                  "receipt_reproducibility": "success",
                  "receipt_json": "success",
                  "output_commit": "success",
              },
              "runner": {
                  "name": os.environ["RUNNER_NAME"],
                  "os": os.environ["RUNNER_OS"],
                  "arch": os.environ["RUNNER_ARCH"],
              },
              "workflow": {
                  "run_id": int(os.environ["RUN_ID"]),
                  "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              },
              "source_qualified": True,
              "qualified": False,
              "efficacy_validation": False,
              "runtime_wired": False,
              "production_authority": False,
              "promotion": False,
          }
          (artifact_dir / "materialization-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload materialization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-intelligence-p1-1c-rustfmt-${{ github.sha }}
          path: artifacts/hepta-intelligence-p1-1c-rustfmt
          if-no-files-found: warn
          retention-days: 14

      - name: Push exact formatting output branch
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH"
