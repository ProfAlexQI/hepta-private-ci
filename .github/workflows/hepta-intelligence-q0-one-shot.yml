name: Hepta Intelligence Q0 one-shot exact-head qualification

on:
  push:
    branches:
      - codex/hepta-intelligence-plan-v3-20260828
    paths:
      - .github/workflows/hepta-intelligence-q0-one-shot.yml

permissions:
  contents: read

concurrency:
  group: hepta-intelligence-q0-one-shot-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_BRANCH: codex/hepta-intelligence-plan-v3-20260828
  EXPECTED_PARENT: 7afdc5c94260aa8249837791d82f53f7705ec631
  ARTIFACT_DIR: artifacts/hepta-intelligence-q0-one-shot
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  exact-head-qualification:
    name: Q0 exact-head source, SQLite, Rust and Agentd qualification
    runs-on: ubuntu-slim
    timeout-minutes: 120
    steps:
      - name: Checkout exact one-shot candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prove branch, head, tree and exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          mkdir -p "${ARTIFACT_DIR}"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          payload = {
              "schema": "hepta_intelligence_q0_exact_head_identity_v1",
              "branch": os.environ["GITHUB_REF_NAME"],
              "expected_head": os.environ["GITHUB_SHA"],
              "actual_head": git("rev-parse", "HEAD"),
              "actual_tree": git("rev-parse", "HEAD^{tree}"),
              "actual_parent": git("rev-parse", "HEAD^"),
              "expected_parent": os.environ["EXPECTED_PARENT"],
              "runner_class": "GITHUB_HOSTED_UBUNTU_SLIM",
              "merge_candidate": False,
              "current_authority_changed": False,
              "runtime_authority": False,
          }
          Path(os.environ["ARTIFACT_DIR"], "identity.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Compile compatibility and source verifiers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/hepta-intelligence-status-compat.py \
            scripts/verify-hepta-intelligence-grounding-ledger.py \
            scripts/verify-hepta-intelligence-grounding-gate.py \
            scripts/verify-hepta-intelligence-mutation-state.py \
            scripts/hepta-intelligence-mutation-journal-sqlite-selftest.py \
            scripts/verify-hepta-intelligence-mutation-journal.py \
            scripts/verify-hepta-intelligence-shadow-host.py \
            scripts/verify-hepta-intelligence-master-plan.py

      - name: Run exact-head P0 source and SQLite compatibility matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${ARTIFACT_DIR}"
          status_path=plans/hepta-intelligence/HEPTA_INTELLIGENCE_EXECUTION_STATUS_V2.json
          canonical_copy="${ARTIFACT_DIR}/canonical-status-v2.json"
          cp "${status_path}" "${canonical_copy}"
          restore_status() {
            cp "${canonical_copy}" "${status_path}"
          }
          trap restore_status EXIT

          plan_status=$(python3 scripts/verify-hepta-intelligence-master-plan.py)
          test "${plan_status}" = "PASS_HEPTA_INTELLIGENCE_MASTER_PLAN_V4_SOURCE_ONLY"
          PLAN_STATUS="${plan_status}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema": "hepta_intelligence_master_plan_source_receipt_v1",
              "status": "PASS_CANONICAL_MASTER_PLAN_SOURCE_ONLY",
              "verifier_status": os.environ["PLAN_STATUS"],
              "current_plan_authority_changed": False,
              "runtime_wired": False,
              "production_authority": False,
              "external_effects": False,
              "operator_acceptance": False,
              "promotion": False,
              "callers_ratchet": False,
          }
          Path(os.environ["ARTIFACT_DIR"], "master-plan-source.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          python3 scripts/hepta-intelligence-status-compat.py P0.2 \
            | tee "${ARTIFACT_DIR}/p0-2-snapshot.json"
          python3 scripts/verify-hepta-intelligence-grounding-ledger.py \
            | tee "${ARTIFACT_DIR}/p0-2-source.json"

          python3 scripts/hepta-intelligence-status-compat.py P0.3 \
            | tee "${ARTIFACT_DIR}/p0-3-snapshot.json"
          python3 scripts/verify-hepta-intelligence-grounding-gate.py \
            | tee "${ARTIFACT_DIR}/p0-3-source.json"

          python3 scripts/hepta-intelligence-status-compat.py P0.4a \
            | tee "${ARTIFACT_DIR}/p0-4a-snapshot.json"
          python3 scripts/verify-hepta-intelligence-mutation-state.py \
            | tee "${ARTIFACT_DIR}/p0-4a-source.json"

          python3 scripts/hepta-intelligence-status-compat.py P0.4b \
            | tee "${ARTIFACT_DIR}/p0-4b-snapshot.json"
          python3 scripts/hepta-intelligence-mutation-journal-sqlite-selftest.py \
            | tee "${ARTIFACT_DIR}/p0-4b-sqlite.json"
          python3 scripts/verify-hepta-intelligence-mutation-journal.py \
            | tee "${ARTIFACT_DIR}/p0-4b-source.json"

          python3 scripts/hepta-intelligence-status-compat.py P0.4c \
            | tee "${ARTIFACT_DIR}/p0-4c-snapshot.json"
          python3 scripts/verify-hepta-intelligence-shadow-host.py \
            | tee "${ARTIFACT_DIR}/p0-4c-source.json"

          restore_status
          trap - EXIT

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ARTIFACT_DIR"])
          expected = {
              "master-plan-source.json": "PASS_CANONICAL_MASTER_PLAN_SOURCE_ONLY",
              "p0-2-source.json": "PASS_P0_2_DURABLE_GROUNDING_SOURCE_ONLY",
              "p0-3-source.json": "PASS_P0_3_SHADOW_GROUNDING_SOURCE_ONLY",
              "p0-4a-source.json": "PASS_P0_4_MUTATION_STATE_SOURCE_ONLY",
              "p0-4b-sqlite.json": "PASS_P0_4B_MUTATION_JOURNAL_SQLITE",
              "p0-4b-source.json": "PASS_P0_4B_MUTATION_JOURNAL_SOURCE_ONLY",
              "p0-4c-source.json": "PASS_P0_4C_SHADOW_HOST_SOURCE_ONLY",
          }
          receipts = {}
          for filename, wanted in expected.items():
              value = json.loads((root / filename).read_text(encoding="utf-8"))
              actual = value.get("status")
              assert actual == wanted, (filename, actual, wanted)
              for key in (
                  "runtime_wired",
                  "default_open_wired",
                  "app_runtime_attached",
                  "tool_registered",
                  "memory_write_authority",
                  "projection_write_authority",
                  "learning_write_authority",
                  "outbox_dispatch_authority",
                  "production_authority",
                  "external_effects",
                  "operator_acceptance",
                  "promotion",
                  "callers_ratchet",
              ):
                  if key in value:
                      assert value[key] is False, (filename, key)
              receipts[filename] = wanted

          identity = json.loads((root / "identity.json").read_text(encoding="utf-8"))
          aggregate = {
              "schema": "hepta_intelligence_q0_source_sqlite_receipt_v1",
              "status": "PASS_Q0_SOURCE_AND_SQLITE_EXACT_HEAD",
              "identity": identity,
              "receipts": receipts,
              "legacy_status_materialized_only_in_ephemeral_worktree": True,
              "current_plan_authority_changed": False,
              "runtime_wired": False,
              "production_authority": False,
              "external_effects": False,
              "operator_acceptance": False,
              "promotion": False,
              "callers_ratchet": False,
              "rust_qualification": False,
              "merge_candidate_qualified": False,
              "q0_satisfied": False,
          }
          (root / "source-sqlite-aggregate.json").write_text(
              json.dumps(aggregate, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git diff --exit-code

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Verify compiler, repository pin and locked workspace
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          expected=$(python3 - <<'PY'
          import pathlib
          import tomllib
          value = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())
          print(value["toolchain"]["channel"])
          PY
          )
          actual=$(rustc --version | awk '{print $2}')
          test "${actual}" = "${expected}"
          test "${actual}" = "1.95.0"
          test -s Cargo.lock
          cargo metadata --locked --format-version 1 --no-deps \
            > "../${ARTIFACT_DIR}/cargo-metadata.json"
          git diff --exit-code -- Cargo.lock

      - name: Check owned-package formatting
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt -p codex-hepta-memory -- --check
          cargo fmt -p codex-hepta-memory-extension -- --check
          cargo fmt -p codex-hepta-agentd -- --check

      - name: Run focused frozen-tranche tests
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test -p codex-hepta-memory durable_grounding -- --nocapture \
            2>&1 | tee "../${ARTIFACT_DIR}/test-p0-2-durable-grounding.log"
          cargo test -p codex-hepta-memory fact_grounding -- --nocapture \
            2>&1 | tee "../${ARTIFACT_DIR}/test-p0-1-grounding-regression.log"
          cargo test -p codex-hepta-memory shadow_ -- --nocapture \
            2>&1 | tee "../${ARTIFACT_DIR}/test-p0-3-shadow.log"
          cargo test -p codex-hepta-memory intelligence_mutation_state -- --nocapture \
            2>&1 | tee "../${ARTIFACT_DIR}/test-p0-4a-state.log"
          cargo test -p codex-hepta-memory intelligence_mutation_journal -- --nocapture \
            2>&1 | tee "../${ARTIFACT_DIR}/test-p0-4b-journal.log"
          cargo test -p codex-hepta-memory shadow_intelligence_mutation_host -- --nocapture \
            2>&1 | tee "../${ARTIFACT_DIR}/test-p0-4c-memory-host.log"
          cargo test -p codex-hepta-memory-extension grounding_v3 -- --nocapture \
            2>&1 | tee "../${ARTIFACT_DIR}/test-p0-3-extension.log"
          cargo test -p codex-hepta-agentd \
            --features qualification-intelligence-mutation-shadow \
            shadow_intelligence_mutation_host -- --nocapture \
            2>&1 | tee "../${ARTIFACT_DIR}/test-p0-4c-agentd-host.log"

      - name: Run full owned-crate and Agentd default-off tests
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test -p codex-hepta-memory \
            2>&1 | tee "../${ARTIFACT_DIR}/test-full-memory.log"
          cargo test -p codex-hepta-memory-extension \
            2>&1 | tee "../${ARTIFACT_DIR}/test-full-memory-extension.log"
          cargo test -p codex-hepta-agentd --no-default-features \
            2>&1 | tee "../${ARTIFACT_DIR}/test-agentd-default-off.log"
          cargo test -p codex-hepta-agentd \
            --features qualification-intelligence-mutation-shadow \
            2>&1 | tee "../${ARTIFACT_DIR}/test-agentd-shadow-feature.log"

      - name: Run strict owned-crate Clippy
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo clippy -p codex-hepta-memory --all-targets -- -D warnings \
            2>&1 | tee "../${ARTIFACT_DIR}/clippy-memory.log"
          cargo clippy -p codex-hepta-memory-extension --all-targets -- -D warnings \
            2>&1 | tee "../${ARTIFACT_DIR}/clippy-memory-extension.log"
          cargo clippy -p codex-hepta-agentd --no-default-features --all-targets -- -D warnings \
            2>&1 | tee "../${ARTIFACT_DIR}/clippy-agentd-default-off.log"
          cargo clippy -p codex-hepta-agentd \
            --features qualification-intelligence-mutation-shadow \
            --all-targets -- -D warnings \
            2>&1 | tee "../${ARTIFACT_DIR}/clippy-agentd-shadow-feature.log"

      - name: Emit exact-head executable qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ARTIFACT_DIR"])
          identity = json.loads((root / "identity.json").read_text(encoding="utf-8"))
          source = json.loads(
              (root / "source-sqlite-aggregate.json").read_text(encoding="utf-8")
          )
          receipt = {
              "schema": "hepta_intelligence_q0_exact_head_executable_receipt_v1",
              "evidence_class": "E2_INDEPENDENT_RUNNER_EXACT_HEAD_CANDIDATE",
              "status": "PASS_Q0_EXACT_HEAD_EXECUTABLE_CANDIDATE",
              "identity": identity,
              "source_sqlite_receipt": source["status"],
              "rust_toolchain": "1.95.0",
              "owned_package_fmt": True,
              "focused_tests": True,
              "full_owned_crate_tests": True,
              "agentd_default_off": True,
              "strict_clippy": True,
              "merge_candidate_qualified": False,
              "runtime_wired": False,
              "default_open_wired": False,
              "app_runtime_attached": False,
              "tool_registered": False,
              "memory_write_authority": False,
              "projection_write_authority": False,
              "learning_write_authority": False,
              "outbox_dispatch_authority": False,
              "production_authority": False,
              "external_effects": False,
              "operator_acceptance": False,
              "promotion": False,
              "callers_ratchet": False,
              "q0_satisfied": False,
              "does_not_imply": [
                  "merge-candidate qualification",
                  "runtime wiring",
                  "learning efficacy",
                  "operator acceptance",
                  "promotion",
              ],
          }
          (root / "exact-head-executable-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git diff --exit-code

      - name: Upload Q0 one-shot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-intelligence-q0-one-shot-${{ github.sha }}
          path: artifacts/hepta-intelligence-q0-one-shot/**
          if-no-files-found: error
          retention-days: 30
