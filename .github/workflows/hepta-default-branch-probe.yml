name: Hepta default branch endpoint probe

on:
  push:
    branches:
      - integration/vnext-main-20260811
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY_FULL_NAME: TrillionniumFoundation/hepta-private-ci
    steps:
      - name: Set repository default branch to existing main ref
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repository = os.environ['REPOSITORY_FULL_NAME']
          token = os.environ['GH_TOKEN']
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}',
              data=json.dumps({'default_branch': 'main'}).encode(),
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'hepta-default-branch-probe',
              },
              method='PATCH',
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  body = json.loads(response.read())
                  print(json.dumps({'status': response.status, 'defaultBranch': body.get('default_branch')}, sort_keys=True))
          except urllib.error.HTTPError as error:
              payload = error.read().decode('utf-8', errors='replace')
              try:
                  message = json.loads(payload).get('message', payload)
              except json.JSONDecodeError:
                  message = payload
              print(json.dumps({'status': error.code, 'message': message}, sort_keys=True))
              raise
          PY
