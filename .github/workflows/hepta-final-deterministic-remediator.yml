name: Hepta final deterministic remediator

on:
  push:
    branches:
      - codex/hepta-final-ci-observer-20260902
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-final-deterministic-remediator-20260902
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_BRANCH: codex/hepta-v8-repository-closure-final-20260902
      OUTPUT_BRANCH: codex/hepta-v8-repository-closure-remediated-20260902
    steps:
      - name: Check out immutable final candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/hepta-v8-repository-closure-final-20260902
          fetch-depth: 0
          persist-credentials: true

      - name: Set up repository CI tools
        uses: ./.github/actions/setup-ci

      - name: Install repository-pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Set up repository Bazel toolchain
        uses: ./.github/actions/setup-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu

      - name: Apply only deterministic formatting and lock regeneration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$SOURCE_BRANCH"
          corepack enable || true
          just fmt
          just bazel-lock-update
          git diff --check

      - name: Verify the remediated repository-owned closure
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --project scripts ruff format --check scripts
          python3 -m compileall -q scripts
          cargo fmt --all --manifest-path codex-rs/Cargo.toml -- --check
          for manifest in \
            qualification/hnmf-reference/Cargo.toml \
            qualification/hnmf-contract-reference/Cargo.toml \
            qualification/hnmf-adversarial-reference/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" -- --check
            cargo check --manifest-path "$manifest" --all-targets --locked
            cargo test --manifest-path "$manifest" --locked
          done
          python3 scripts/hepta-paper-evidence.py verify
          python3 scripts/hepta-hnmf.py self-test
          python3 scripts/hepta-hnmf.py verify
          python3 scripts/hepta-cns.py self-test
          python3 scripts/hepta-cns.py generate-status --check
          python3 scripts/hepta-cns.py verify
          python3 scripts/hepta-module-docs.py self-test
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-algorithm-docs.py self-test
          python3 scripts/hepta-algorithm-docs.py verify-sources
          python3 scripts/hepta-algorithm-docs.py generate-status --check
          python3 scripts/hepta-algorithm-docs.py verify
          python3 scripts/hepta-docs.py self-test
          python3 scripts/hepta-docs.py generate-status
          git diff --exit-code -- docs/STATUS.md
          python3 scripts/hepta-docs.py verify
          python3 scripts/hepta-repository-integrity.py self-test
          python3 scripts/hepta-repository-integrity.py verify
          ./scripts/check-module-bazel-lock.sh
          if find .github/workflows -maxdepth 1 -type f -name 'tmp-*.yml' -print -quit | grep -q .; then
            echo "temporary workflow present in remediated candidate" >&2
            exit 1
          fi
          git diff --check

      - name: Publish ordinary remediated source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta deterministic remediator"
          git config user.email "hepta-deterministic-remediator@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style(ci): replay repository formatters and Bzlmod lock"
          fi
          git push --force origin "HEAD:refs/heads/${OUTPUT_BRANCH}"
