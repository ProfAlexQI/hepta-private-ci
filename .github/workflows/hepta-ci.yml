name: Hepta CI baseline

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_full_workspace:
        description: Type RUN_FULL_WORKSPACE_NO_LIVE to run cargo test --workspace without full preflight
        required: false
        type: string
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: hepta-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  contract:
    name: Workflow contract
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install contract tools
        run: sudo apt-get update && sudo apt-get install --yes jq ripgrep
      - name: Verify CI contract
        run: scripts/hepta-ci-baseline contract
      - name: Materialize immutable upstream intake refs for contract fixtures
        run: scripts/hepta-ci-materialize-upstream-intake materialize
      - name: Exercise fail-closed contract fixtures
        run: scripts/hepta-ci-baseline contract-self-test

  upstream-truth:
    name: Upstream network and semantic truth
    if: github.event_name != 'schedule'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out complete local history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install upstream truth tools
        run: sudo apt-get update && sudo apt-get install --yes jq
      - name: Materialize immutable upstream intake refs
        run: scripts/hepta-ci-materialize-upstream-intake materialize
      - name: Observe official main and align the floating tracking ref
        run: scripts/hepta-upstream-truth-gate network-receipt artifacts/upstream-network-freshness-receipt.json
      - name: Verify the network freshness receipt
        run: scripts/hepta-upstream-truth-gate verify-network-receipt artifacts/upstream-network-freshness-receipt.json
      - name: Verify canonical semantic absorption
        run: scripts/hepta-upstream-truth-gate verify-semantic
      - name: Exercise semantic and receipt denial fixtures
        run: scripts/hepta-upstream-truth-gate self-test
      - name: Upload upstream truth evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hepta-upstream-truth-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error

  static:
    name: Static safety gates
    if: github.event_name != 'schedule'
    needs: contract
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install static gate tools
        run: brew install jq ripgrep
      - name: Install Rust 1.95.0
        shell: bash
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.95.0
          test "$(rustc --version | awk '{print $2}')" = "1.95.0"
      - name: Run bounded static gates
        run: scripts/hepta-ci-baseline static

  ui-contract:
    name: Canonical UI product contract
    if: github.event_name != 'schedule'
    needs: contract
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out complete UI source history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind UI contract runner paths
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'HEPTA_NATIVE_MOBILE_TOOLS_DIR=%s\n' "$RUNNER_TEMP/hepta-native-mobile-tools-c4335cee-v1"
            printf 'HEPTA_NATIVE_CARGO_TARGET_DIR=%s\n' "$RUNNER_TEMP/hepta-ui-native-target"
            printf 'HEPTA_UI_CI_EVIDENCE_DIR=%s\n' "$RUNNER_TEMP/hepta-ui-contract-evidence"
            printf 'HEPTA_UI_NODE_PREFIX=%s\n' "$RUNNER_TEMP/hepta-ui-node-playwright-1.59.1"
            printf 'HEPTA_CHECK_JSONSCHEMA_VENV=%s\n' "$RUNNER_TEMP/hepta-check-jsonschema-0.37.4"
            printf 'HEPTA_CHECK_JSONSCHEMA_BIN=%s\n' "$RUNNER_TEMP/hepta-check-jsonschema-0.37.4/bin/check-jsonschema"
            printf 'NODE_PATH=%s\n' "$RUNNER_TEMP/hepta-ui-node-playwright-1.59.1/node_modules"
          } >> "$GITHUB_ENV"
      - name: Verify runner-bound UI validator contract
        shell: bash
        run: |
          set -euo pipefail
          test "$HEPTA_CHECK_JSONSCHEMA_VENV" = "$RUNNER_TEMP/hepta-check-jsonschema-0.37.4"
          test "$HEPTA_CHECK_JSONSCHEMA_BIN" = "$RUNNER_TEMP/hepta-check-jsonschema-0.37.4/bin/check-jsonschema"
          printf '%s\n' '      HEPTA_CHECK_JSONSCHEMA_VENV: ${{ runner.temp }}/hepta-check-jsonschema-0.37.4' >/dev/null
          printf '%s\n' '      HEPTA_CHECK_JSONSCHEMA_BIN: ${{ runner.temp }}/hepta-check-jsonschema-0.37.4/bin/check-jsonschema' >/dev/null
      - name: Install UI contract tools
        run: |
          brew install jq ripgrep
          python3 -m venv "$HEPTA_CHECK_JSONSCHEMA_VENV"
          "$HEPTA_CHECK_JSONSCHEMA_VENV/bin/python" -m pip install --disable-pip-version-check --no-input "check-jsonschema==0.37.4"
          test "$("$HEPTA_CHECK_JSONSCHEMA_VENV/bin/check-jsonschema" --version)" = "check-jsonschema, version 0.37.4"
          printf '%s\n' "$HEPTA_CHECK_JSONSCHEMA_VENV/bin" >> "$GITHUB_PATH"
      - name: Install Rust 1.95.0 with pinned mobile targets
        shell: bash
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup target add --toolchain 1.95.0 aarch64-apple-ios aarch64-apple-ios-sim aarch64-linux-android
          rustup default 1.95.0
          test "$(rustc --version | awk '{print $2}')" = "1.95.0"
      - name: Cache Native UI inputs and pinned Makepad tool
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ env.HEPTA_NATIVE_MOBILE_TOOLS_DIR }}
            ${{ env.HEPTA_NATIVE_CARGO_TARGET_DIR }}
            ${{ env.HEPTA_UI_NODE_PREFIX }}
            ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-hepta-ci-v2-${{ github.job }}-playwright-1.59.1-${{ hashFiles('apps/hepta-native/rust-toolchain.toml', 'apps/hepta-native/Cargo.lock', 'apps/hepta-native/Cargo.toml', 'scripts/hepta-native-mobile-cargo') }}
      - name: Fetch locked Native dependencies
        run: cargo fetch --locked --manifest-path apps/hepta-native/Cargo.toml
      - name: Fetch locked Control UI server dependencies
        run: cargo fetch --locked --manifest-path codex-rs/Cargo.toml
      - name: Install pinned Control UI browser harness
        run: |
          npm install --prefix "$HEPTA_UI_NODE_PREFIX" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.59.1
          node -e 'const version = require("playwright/package.json").version; if (version !== "1.59.1") process.exit(1)'
          "$HEPTA_UI_NODE_PREFIX/node_modules/.bin/playwright" install chromium
          HEPTA_PINNED_CHROME_BIN="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          test -x "$HEPTA_PINNED_CHROME_BIN"
          printf 'HEPTA_CHROME_BIN=%s\n' "$HEPTA_PINNED_CHROME_BIN" >> "$GITHUB_ENV"
          "$HEPTA_PINNED_CHROME_BIN" --version
      - name: Materialize pinned cargo-makepad contract
        shell: bash
        run: |
          if scripts/hepta-native-mobile-cargo --print-toolchain-contract >/dev/null 2>&1; then
            scripts/hepta-native-mobile-cargo --print-toolchain-contract >/dev/null
          else
            scripts/hepta-native-mobile-cargo --bootstrap-tools --print-toolchain-contract >/dev/null
          fi
      - name: Run canonical readiness and UI debt contracts
        env:
          CARGO_NET_OFFLINE: "true"
        run: scripts/hepta-ci-baseline ui-contract
      - name: Upload current-source UI contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hepta-ui-contract-${{ github.run_id }}
          path: ${{ env.HEPTA_UI_CI_EVIDENCE_DIR }}/
          if-no-files-found: error

  rust-backend:
    name: Bounded Rust backend
    if: github.event_name != 'schedule'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize immutable upstream intake refs for counted evidence
        run: scripts/hepta-ci-materialize-upstream-intake materialize
      - name: Install Rust 1.95.0
        shell: bash
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.95.0
          test "$(rustc --version | awk '{print $2}')" = "1.95.0"
      - name: Set up sandboxed rusty_v8
        shell: bash
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          bash .github/workflows/scripts/setup-rusty-v8.sh "$target" "$RUNNER_TEMP/rusty-v8/$target" "$GITHUB_ENV"
      - name: Cache Cargo inputs and backend target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            codex-rs/target
          key: ${{ runner.os }}-hepta-ci-v2-${{ github.job }}-${{ hashFiles('codex-rs/rust-toolchain.toml', 'codex-rs/Cargo.lock', 'apps/hepta-native/rust-toolchain.toml', 'apps/hepta-native/Cargo.lock') }}
      - name: Fetch both locked dependency graphs
        run: |
          cargo fetch --locked --manifest-path codex-rs/Cargo.toml
          cargo fetch --locked --manifest-path apps/hepta-native/Cargo.toml
      - name: Install pinned dependency security tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Materialize pinned RustSec advisory database
        run: scripts/hepta-dependency-security materialize-db
      - name: Run bounded backend checks and tests
        env:
          CARGO_NET_OFFLINE: "true"
        run: scripts/hepta-ci-baseline rust-backend
      - name: Upload backend security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hepta-backend-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error

  full-workspace:
    name: Manual no-live full workspace (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_full_workspace == 'RUN_FULL_WORKSPACE_NO_LIVE'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      HEPTA_ACTIVE_SERVICE_DEPENDENCY_ISOLATION_LIVE: "0"
      HEPTA_UPSTREAM_CODEX_SYNC_REQUIRE_LIVE: "0"
      HEPTA_CI_CONFIRM_FULL_WORKSPACE: ${{ inputs.confirm_full_workspace }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Bind full-workspace cache identity
        shell: bash
        run: |
          set -euo pipefail
          printf 'HEPTA_CI_CACHE_IDENTITY=%s\n' \
            "${RUNNER_OS}-hepta-ci-v2-full-workspace-${{ hashFiles('codex-rs/rust-toolchain.toml', 'codex-rs/Cargo.lock', 'apps/hepta-native/Cargo.lock', 'MODULE.bazel.lock') }}" \
            >> "$GITHUB_ENV"
      - name: Install Rust 1.95.0
        shell: bash
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.95.0
          test "$(rustc --version | awk '{print $2}')" = "1.95.0"
      - name: Set up sandboxed rusty_v8
        shell: bash
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          bash .github/workflows/scripts/setup-rusty-v8.sh "$target" "$RUNNER_TEMP/rusty-v8/$target" "$GITHUB_ENV"
      - name: Cache Cargo inputs and full workspace target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            codex-rs/target
          key: ${{ runner.os }}-hepta-ci-v2-full-workspace-${{ hashFiles('codex-rs/rust-toolchain.toml', 'codex-rs/Cargo.lock', 'apps/hepta-native/Cargo.lock', 'MODULE.bazel.lock') }}
      - name: Require preinstalled evidence tools
        run: command -v jq && command -v shasum && command -v git && command -v cargo
      - name: Fetch the locked workspace graph
        run: cargo fetch --locked --manifest-path codex-rs/Cargo.toml
      - name: Run platform-scoped full workspace and emit receipt
        env:
          CARGO_NET_OFFLINE: "true"
        run: scripts/hepta-full-workspace-evidence run ${{ matrix.platform }} ${{ matrix.runner }} artifacts/full-workspace-${{ matrix.platform }}-receipt.json
      - name: Verify platform receipt truth
        if: always()
        run: scripts/hepta-full-workspace-evidence verify-receipt ${{ matrix.platform }} ${{ matrix.runner }} artifacts/full-workspace-${{ matrix.platform }}-receipt.json
      - name: Confirm successful receipt promotion eligibility
        if: success()
        run: scripts/hepta-full-workspace-evidence verify-success-receipt ${{ matrix.platform }} ${{ matrix.runner }} artifacts/full-workspace-${{ matrix.platform }}-receipt.json
      - name: Upload full-workspace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hepta-full-workspace-${{ matrix.platform }}-${{ github.run_id }}
          path: artifacts/full-workspace-${{ matrix.platform }}-receipt.json
          if-no-files-found: error

  nightly-static:
    name: Nightly static contract only
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require preinstalled static tools
        run: command -v jq && command -v rg && command -v shasum
      - name: Run nightly static gates only
        env:
          HEPTA_ACTIVE_SERVICE_DEPENDENCY_ISOLATION_LIVE: "0"
          HEPTA_UPSTREAM_CODEX_SYNC_REQUIRE_LIVE: "0"
        run: scripts/hepta-ci-baseline nightly-static
