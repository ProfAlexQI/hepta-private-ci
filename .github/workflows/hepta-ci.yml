name: Hepta CI baseline

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_full_workspace:
        description: Type RUN_FULL_WORKSPACE_NO_LIVE to run cargo test --workspace without full preflight
        required: false
        type: string
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: hepta-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  contract:
    name: Workflow contract
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install contract tools
        run: sudo apt-get update && sudo apt-get install --yes jq ripgrep
      - name: Verify CI contract
        run: scripts/hepta-ci-baseline contract
      - name: Materialize immutable upstream intake refs for contract fixtures
        run: scripts/hepta-ci-materialize-upstream-intake materialize
      - name: Exercise fail-closed contract fixtures
        run: scripts/hepta-ci-baseline contract-self-test

  upstream-truth:
    name: Upstream network and semantic truth
    if: github.event_name != 'schedule'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out complete local history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize upstream truth failure evidence
        shell: bash
        run: |
          mkdir -p artifacts
          printf '{"schema":"hepta_ci_job_start_v1","status":"started","job":"upstream-truth","head_sha":"%s","run_id":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" >artifacts/upstream-truth-job-start.json
      - name: Install upstream truth tools
        run: sudo apt-get update && sudo apt-get install --yes jq
      - name: Materialize immutable upstream intake refs
        run: scripts/hepta-ci-materialize-upstream-intake materialize
      - name: Observe official main and align the floating tracking ref
        run: scripts/hepta-upstream-truth-gate network-receipt artifacts/upstream-network-freshness-receipt.json
      - name: Verify the network freshness receipt
        run: scripts/hepta-upstream-truth-gate verify-network-receipt artifacts/upstream-network-freshness-receipt.json
      - name: Verify canonical semantic absorption
        run: scripts/hepta-upstream-truth-gate verify-semantic
      - name: Exercise semantic and receipt denial fixtures
        run: scripts/hepta-upstream-truth-gate self-test
      - name: Upload upstream truth evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hepta-upstream-truth-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error

  static:
    name: Static safety gates
    if: github.event_name != 'schedule'
    needs: contract
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize static failure evidence
        shell: bash
        run: |
          mkdir -p artifacts
          printf '{"schema":"hepta_ci_job_start_v1","status":"started","job":"static","head_sha":"%s","run_id":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" >artifacts/static-job-start.json
      - name: Install static gate tools
        run: brew install jq ripgrep
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
      - name: Run bounded static gates
        shell: bash
        run: scripts/hepta-ci-baseline static 2>&1 | tee artifacts/static-gates.log
      - name: Upload static gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hepta-static-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error

  rust-backend:
    name: Bounded Rust backend
    if: github.event_name != 'schedule'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      HEPTA_RUST_BACKEND_MIN_AVAILABLE_BYTES: "21474836480"
      HEPTA_RUST_BACKEND_TARGET_CACHE_REUSED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind backend paths to runner temp
        shell: bash
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/hepta-rust-backend-target" >>"$GITHUB_ENV"
          echo "HEPTA_CI_BACKEND_ARTIFACTS_DIR=$RUNNER_TEMP/hepta-backend-artifacts" >>"$GITHUB_ENV"
      - name: Initialize backend failure evidence
        shell: bash
        run: |
          mkdir -p "$HEPTA_CI_BACKEND_ARTIFACTS_DIR"
          printf '{"schema":"hepta_ci_job_start_v1","status":"started","job":"rust-backend","head_sha":"%s","run_id":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" >"$HEPTA_CI_BACKEND_ARTIFACTS_DIR/rust-backend-job-start.json"
      - name: Install backend gate tools
        run: sudo apt-get update && sudo apt-get install --yes jq ripgrep
      - name: Materialize immutable upstream intake refs for counted evidence
        run: scripts/hepta-ci-materialize-upstream-intake materialize
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          components: rustfmt, clippy
      - name: Set up sandboxed rusty_v8
        shell: bash
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          bash .github/workflows/scripts/setup-rusty-v8.sh "$target" "$RUNNER_TEMP/rusty-v8/$target" "$GITHUB_ENV"
      - name: Cache Cargo inputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-hepta-ci-v3-${{ github.job }}-${{ hashFiles('codex-rs/rust-toolchain.toml', 'codex-rs/Cargo.lock', 'apps/hepta-native/rust-toolchain.toml', 'apps/hepta-native/Cargo.lock') }}
      - name: Fetch both locked dependency graphs
        run: |
          cargo fetch --locked --manifest-path codex-rs/Cargo.toml
          cargo fetch --locked --manifest-path apps/hepta-native/Cargo.toml
      - name: Install pinned dependency security tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Materialize pinned RustSec advisory database
        env:
          HEPTA_DEPENDENCY_SECURITY_CACHE_ROOT: ${{ runner.temp }}/hepta-dependency-security
        run: scripts/hepta-dependency-security materialize-db
      - name: Reclaim and attest backend disk capacity
        shell: bash
        run: |
          resource_policy="linux-hosted-unused-toolchains-prune-v1"
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'END {print $4}')"
          [[ "$available_kib" =~ ^[0-9]+$ ]]
          available_bytes="$((available_kib * 1024))"
          [[ "$available_bytes" -ge "$HEPTA_RUST_BACKEND_MIN_AVAILABLE_BYTES" ]]
          [[ "$CARGO_TARGET_DIR" == "$RUNNER_TEMP/"* ]]
          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg resource_policy "$resource_policy" \
            --arg target_dir_scope runner_temp \
            --arg cargo_incremental "$CARGO_INCREMENTAL" \
            --arg cargo_profile_dev_debug "$CARGO_PROFILE_DEV_DEBUG" \
            --arg cargo_profile_test_debug "$CARGO_PROFILE_TEST_DEBUG" \
            --argjson available_bytes "$available_bytes" \
            --argjson minimum_available_bytes "$HEPTA_RUST_BACKEND_MIN_AVAILABLE_BYTES" \
            '{
              schema:"hepta_rust_backend_resource_receipt_v1",
              status:"ready",
              source_sha:$source_sha,
              resource_policy:$resource_policy,
              available_bytes:$available_bytes,
              minimum_available_bytes:$minimum_available_bytes,
              cargo_incremental:$cargo_incremental,
              cargo_profile_dev_debug:$cargo_profile_dev_debug,
              cargo_profile_test_debug:$cargo_profile_test_debug,
              artifact_dir_scope:"runner_temp",
              target_dir_scope:$target_dir_scope,
              target_cache_reused:false
            }' >"$HEPTA_CI_BACKEND_ARTIFACTS_DIR/rust-backend-resource-receipt.json"
          jq -e \
            --arg source_sha "$GITHUB_SHA" \
            --argjson minimum_available_bytes "$HEPTA_RUST_BACKEND_MIN_AVAILABLE_BYTES" \
            '.schema == "hepta_rust_backend_resource_receipt_v1"
             and .status == "ready"
             and .source_sha == $source_sha
             and .resource_policy == "linux-hosted-unused-toolchains-prune-v1"
             and .available_bytes >= $minimum_available_bytes
             and .minimum_available_bytes == $minimum_available_bytes
             and .cargo_incremental == "0"
             and .cargo_profile_dev_debug == "0"
             and .cargo_profile_test_debug == "0"
             and .artifact_dir_scope == "runner_temp"
             and .target_dir_scope == "runner_temp"
             and .target_cache_reused == false' \
            "$HEPTA_CI_BACKEND_ARTIFACTS_DIR/rust-backend-resource-receipt.json" >/dev/null
          df -h "$GITHUB_WORKSPACE"
      - name: Run bounded backend checks and tests
        env:
          CARGO_NET_OFFLINE: "true"
          HEPTA_DEPENDENCY_SECURITY_CACHE_ROOT: ${{ runner.temp }}/hepta-dependency-security
        shell: bash
        run: scripts/hepta-ci-baseline rust-backend 2>&1 | tee "$HEPTA_CI_BACKEND_ARTIFACTS_DIR/rust-backend-gates.log"
      - name: Upload backend security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hepta-backend-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/hepta-backend-artifacts/
          if-no-files-found: error

  full-workspace:
    name: Manual no-live full workspace (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_full_workspace == 'RUN_FULL_WORKSPACE_NO_LIVE'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      HEPTA_ACTIVE_SERVICE_DEPENDENCY_ISOLATION_LIVE: "0"
      HEPTA_FULL_WORKSPACE_MIN_AVAILABLE_BYTES: "21474836480"
      HEPTA_FULL_WORKSPACE_TARGET_CACHE_REUSED: "false"
      HEPTA_UPSTREAM_CODEX_SYNC_REQUIRE_LIVE: "0"
      HEPTA_CI_CONFIRM_FULL_WORKSPACE: ${{ inputs.confirm_full_workspace }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Bind full-workspace cache identity
        run: |
          echo "HEPTA_CI_CACHE_IDENTITY=${RUNNER_OS}-hepta-ci-v3-full-workspace-${{ hashFiles('codex-rs/rust-toolchain.toml', 'codex-rs/Cargo.lock', 'apps/hepta-native/Cargo.lock', 'MODULE.bazel.lock') }}" >>"$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/hepta-full-workspace-target" >>"$GITHUB_ENV"
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
      - name: Set up sandboxed rusty_v8
        shell: bash
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          bash .github/workflows/scripts/setup-rusty-v8.sh "$target" "$RUNNER_TEMP/rusty-v8/$target" "$GITHUB_ENV"
      - name: Cache Cargo inputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-hepta-ci-v3-full-workspace-${{ hashFiles('codex-rs/rust-toolchain.toml', 'codex-rs/Cargo.lock', 'apps/hepta-native/Cargo.lock', 'MODULE.bazel.lock') }}
      - name: Require preinstalled evidence tools
        run: |
          command -v jq && command -v shasum && command -v git && command -v cargo
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes libcap-dev pkg-config
            pkg-config --exists libcap
          fi
      - name: Fetch the locked workspace graph
        run: cargo fetch --locked --manifest-path codex-rs/Cargo.toml
      - name: Reclaim and attest full-workspace disk capacity
        shell: bash
        run: |
          resource_policy="macos-hosted-no-prune-v1"
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            resource_policy="linux-hosted-unused-toolchains-prune-v1"
            sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
            sudo apt-get clean
          fi
          available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'END {print $4}')"
          [[ "$available_kib" =~ ^[0-9]+$ ]]
          available_bytes="$((available_kib * 1024))"
          [[ "$available_bytes" -ge "$HEPTA_FULL_WORKSPACE_MIN_AVAILABLE_BYTES" ]]
          echo "HEPTA_FULL_WORKSPACE_RESOURCE_POLICY=$resource_policy" >>"$GITHUB_ENV"
          echo "HEPTA_FULL_WORKSPACE_AVAILABLE_BYTES=$available_bytes" >>"$GITHUB_ENV"
          df -h "$GITHUB_WORKSPACE"
      - name: Run platform-scoped full workspace and emit receipt
        env:
          CARGO_NET_OFFLINE: "true"
        run: scripts/hepta-full-workspace-evidence run ${{ matrix.platform }} ${{ matrix.runner }} artifacts/full-workspace-${{ matrix.platform }}-receipt.json
      - name: Verify platform receipt truth
        if: always()
        run: scripts/hepta-full-workspace-evidence verify-receipt ${{ matrix.platform }} ${{ matrix.runner }} artifacts/full-workspace-${{ matrix.platform }}-receipt.json
      - name: Confirm successful receipt promotion eligibility
        if: success()
        run: scripts/hepta-full-workspace-evidence verify-success-receipt ${{ matrix.platform }} ${{ matrix.runner }} artifacts/full-workspace-${{ matrix.platform }}-receipt.json
      - name: Upload full-workspace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hepta-full-workspace-${{ matrix.platform }}-${{ github.run_id }}
          path: artifacts/full-workspace-${{ matrix.platform }}-receipt.json
          if-no-files-found: error

  nightly-static:
    name: Nightly static contract only
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install nightly static tools
        run: sudo apt-get update && sudo apt-get install --yes jq ripgrep
      - name: Verify nightly static tools
        run: command -v jq && command -v rg && command -v shasum
      - name: Run nightly static gates only
        env:
          HEPTA_ACTIVE_SERVICE_DEPENDENCY_ISOLATION_LIVE: "0"
          HEPTA_UPSTREAM_CODEX_SYNC_REQUIRE_LIVE: "0"
        run: scripts/hepta-ci-baseline nightly-static
