name: hepta Servo worker startup descriptor contract

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/hepta-servo-worker-startup-descriptor.py"
      - "scripts/verify-hepta-servo-worker-startup-descriptor.py"
      - "scripts/tests/test_hepta_servo_worker_startup_descriptor.py"
      - "docs/hepta-vnext/browser/C1_STARTUP_DESCRIPTOR*"
      - "docs/hepta-vnext/browser/hepta.servo.worker_startup_descriptor*"
      - ".github/workflows/hepta-servo-worker-startup-descriptor-contract.yml"
      - ".github/workflows/blocking-ci.yml"
  push:
    branches:
      - integration/vnext-main-20260811
      - "codex/hepta-*"
    paths:
      - "scripts/hepta-servo-worker-startup-descriptor.py"
      - "scripts/verify-hepta-servo-worker-startup-descriptor.py"
      - "scripts/tests/test_hepta_servo_worker_startup_descriptor.py"
      - "docs/hepta-vnext/browser/C1_STARTUP_DESCRIPTOR*"
      - "docs/hepta-vnext/browser/hepta.servo.worker_startup_descriptor*"
      - ".github/workflows/hepta-servo-worker-startup-descriptor-contract.yml"
      - ".github/workflows/blocking-ci.yml"

permissions:
  contents: read

jobs:
  startup-descriptor-contract:
    name: Graph-bound startup descriptor (fixture only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize negative-authority posture
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/hepta-servo-worker-startup-descriptor"
          mkdir -p "$evidence_dir"
          echo "HEPTA_SERVO_STARTUP_DESCRIPTOR_EVIDENCE=$evidence_dir" >> "$GITHUB_ENV"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "scope=synthetic_graph_bound_descriptor_only"
            echo "real_descriptor_created=false"
            echo "launch_authorized=false"
            echo "worker_executed=false"
            echo "servo_runtime_qualified=false"
            echo "external_network_used=false"
            echo "secret_material_in_descriptor=false"
            echo "verification_required_again_at_launch=true"
            echo "machine_authority=false"
            echo "runtime_authority=false"
            echo "production_caller=false"
            echo "production_writer=false"
            echo "effect_authority=false"
            echo "external_effect=false"
            echo "external_network_allowed=false"
            echo "credential_export_allowed=false"
            echo "operator_acceptance=false"
            echo "g5_allowed=false"
            echo "execute_allowed=false"
            echo "promotion=false"
            echo "release_qualified=false"
          } > "$evidence_dir/posture.txt"

      - name: Compile Python contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/hepta-servo-worker-startup-descriptor.py \
            scripts/verify-hepta-servo-worker-startup-descriptor.py \
            scripts/tests/test_hepta_servo_worker_startup_descriptor.py \
            2>&1 | tee "$HEPTA_SERVO_STARTUP_DESCRIPTOR_EVIDENCE/py-compile.log"
          echo "py_compile=passed" >> "$HEPTA_SERVO_STARTUP_DESCRIPTOR_EVIDENCE/posture.txt"

      - name: Verify repository contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-hepta-servo-worker-startup-descriptor.py \
            2>&1 | tee "$HEPTA_SERVO_STARTUP_DESCRIPTOR_EVIDENCE/static-verifier.log"
          echo "static_verifier=passed" >> "$HEPTA_SERVO_STARTUP_DESCRIPTOR_EVIDENCE/posture.txt"

      - name: Run descriptor contract and self-test
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-servo-worker-startup-descriptor.py contract \
            2>&1 | tee "$HEPTA_SERVO_STARTUP_DESCRIPTOR_EVIDENCE/contract.log"
          python3 scripts/hepta-servo-worker-startup-descriptor.py self-test \
            2>&1 | tee "$HEPTA_SERVO_STARTUP_DESCRIPTOR_EVIDENCE/self-test.log"
          python3 scripts/tests/test_hepta_servo_worker_startup_descriptor.py -v \
            2>&1 | tee "$HEPTA_SERVO_STARTUP_DESCRIPTOR_EVIDENCE/unit-tests.log"
          echo "fixture_tests=passed" >> "$HEPTA_SERVO_STARTUP_DESCRIPTOR_EVIDENCE/posture.txt"

      - name: Record fixture-only result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "job_status=${{ job.status }}" >> "$HEPTA_SERVO_STARTUP_DESCRIPTOR_EVIDENCE/posture.txt"
          {
            echo "### Hepta Servo graph-bound startup descriptor"
            echo
            echo "This job creates and verifies synthetic descriptors only."
            echo "It does not authorize or perform launch, generate secrets, execute a worker, or qualify Servo."
            echo
            sed 's/^/- /' "$HEPTA_SERVO_STARTUP_DESCRIPTOR_EVIDENCE/posture.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fixture-only evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hepta-servo-worker-startup-descriptor-contract
          path: ${{ env.HEPTA_SERVO_STARTUP_DESCRIPTOR_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14

      - name: Check clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
