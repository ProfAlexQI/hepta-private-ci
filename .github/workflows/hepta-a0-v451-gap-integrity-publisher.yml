name: Hepta A0 V4.5.1 gap-integrity source publisher

on:
  push:
    branches:
      - "automation/hepta-a0-v451-gap-integrity-publisher-20260829-2315"

permissions:
  contents: write

concurrency:
  group: hepta-a0-v451-gap-integrity-publisher-20260829-2315
  cancel-in-progress: true

env:
  EXPECTED_REPOSITORY: ProfHepta/hepta-private-ci
  TARGET_BRANCH: codex/hepta-intelligence-a0-authority-gap-closure-20260829
  TARGET_HEAD: f09972580e7a10781bf48890f7eeeb2d9b9e945e
  TARGET_TREE: 603cd5111399bb413a947e605c303c467b8fd06c
  Q0_HEAD: c768bcbeb4c1168088d2499828c24da521a2a73a
  Q0_TREE: ca455a9ef797cd95164c880c7b8faba80b305589
  PATCH_SHA256: b1f5ccbe5700841d35782ca49457e0d16af5275efe0415bfe0f2c8b144b509b1
  PATCH_PAYLOAD: automation/hepta-a0-v451-gap-integrity.patch.gz.b64

jobs:
  publish:
    name: Build one Q0-single-parent replacement (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-22.04
            os: ubuntu-22.04
          - label: macos-15
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout publisher payload
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: publisher
          persist-credentials: false

      - name: Checkout exact current A0 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_HEAD }}
          path: target
          fetch-depth: 2
          persist-credentials: true

      - name: Build, validate and publish immutable staging candidate
        shell: bash
        env:
          MATRIX_LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          bash publisher/automation/run-hepta-a0-v451-gap-integrity-publisher.sh

      - name: Upload deterministic publisher evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-a0-v451-gap-integrity-${{ matrix.label }}-${{ github.sha }}
          path: target/artifacts/hepta-a0-v451-gap-integrity/**
          if-no-files-found: error
          retention-days: 30
