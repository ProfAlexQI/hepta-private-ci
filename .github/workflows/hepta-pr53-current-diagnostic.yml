name: Hepta PR53 current diagnostic

on:
  push:
    branches:
      - codex/hepta-pr53-current-diagnostic-20260829

permissions:
  contents: read

env:
  TARGET_HEAD: 795f76da9ca777c380e303ee9e985c556a1a14ec
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  source-and-format:
    name: Current source ratchets and owned rustfmt
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_HEAD }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt
      - run: |
          set -euo pipefail
          python3 scripts/verify-hepta-architecture-convergence-p0-2.py
          python3 scripts/verify-hepta-authority-callers-p0-1.py
          python3 scripts/verify-hepta-memory-runtime-extraction-p0-1.py
          python3 scripts/verify-hepta-cross-owner-operation-wiring.py
          python3 scripts/verify-hepta-architecture-gap-ledger.py
      - working-directory: codex-rs
        run: |
          cargo fmt \
            -p codex-hepta-contracts \
            -p codex-hepta-memory \
            -p codex-hepta-memory-runtime \
            -p codex-hepta-automation \
            -p codex-hepta-agentd \
            -p codex-hepta-matrix-store \
            -p codex-hepta-matrixd \
            -- --check

  contracts:
    name: Current authority and operation contracts
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_HEAD }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: clippy
      - working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-contracts authority::tests -- --nocapture
          cargo test --locked -p codex-hepta-contracts operation::tests -- --nocapture
          cargo test --locked -p codex-hepta-contracts product_graph::tests -- --nocapture
          cargo test --locked -p codex-hepta-contracts provider_operation::tests -- --nocapture
          cargo test --locked -p codex-hepta-contracts --test cross_owner_fault_matrix -- --nocapture
          cargo clippy --locked -p codex-hepta-contracts --all-targets -- -D warnings

  matrix:
    name: Current Matrix operation and same-connection SQLITE_FULL
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_HEAD }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: clippy
      - working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-matrix-store --lib -- --nocapture
          cargo test --locked -p codex-hepta-matrix-store \
            --features qualification-fault-injection --test sqlite_full -- --nocapture
          cargo test --locked -p codex-hepta-matrixd --lib -- --nocapture
          cargo clippy --locked -p codex-hepta-matrix-store --all-targets -- -D warnings
          cargo clippy --locked -p codex-hepta-matrix-store --all-targets \
            --features qualification-fault-injection -- -D warnings
          cargo clippy --locked -p codex-hepta-matrixd --all-targets -- -D warnings

  memory-runtime:
    name: Current Memory and runtime boundary
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_HEAD }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: clippy
      - working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-memory --lib -- --nocapture
          cargo test --locked -p codex-hepta-memory-runtime -- --nocapture
          cargo clippy --locked -p codex-hepta-memory --all-targets -- -D warnings
          cargo clippy --locked -p codex-hepta-memory-runtime --all-targets -- -D warnings

  automation-agentd:
    name: Current Automation and Agentd integration
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_HEAD }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: clippy
      - working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-automation --lib -- --nocapture
          cargo test --locked -p codex-hepta-agentd --lib -- --nocapture
          cargo test --locked -p codex-hepta-agentd \
            --features qualification-cognitive-write --lib -- --nocapture
          cargo check --locked --all-targets \
            -p codex-hepta-agentd \
            -p codex-hepta-supervisor \
            -p codex-hepta-native-gateway
          cargo check --locked --all-targets --no-default-features \
            -p codex-hepta-agentd --features qualification-cognitive-write
          cargo clippy --locked -p codex-hepta-automation -p codex-hepta-agentd \
            --all-targets -- -D warnings
