name: Hepta bounded blocker candidate materialization

on:
  push:
    branches: [codex/hepta-blocker-materialization-20260905-r3]

permissions:
  contents: write

concurrency:
  group: hepta-bounded-materialization-r3
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: 2569607012501456d290183df9e986b0a4703fe5
      OUTPUT_BRANCH: codex/hepta-blocker-repair-20260905-r3
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Check out fixed source, excluding this generator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 2569607012501456d290183df9e986b0a4703fe5
          persist-credentials: false
          fetch-depth: 1

      - name: Load exact bounded recovery source candidates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path
          source = '2569607012501456d290183df9e986b0a4703fe5'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip() == source
          prepared = {
              'codex-rs/hepta-neuron/src/journal.rs': '2ed922c1977bf29fe72569c0a67781e7ce037fb7',
              'codex-rs/hepta-neuron/src/journal_anchor_tests.rs': '67808d964e540f23604a8c3c62496d98588c9e63',
              'codex-rs/hepta-neuron/RECOVERY_ANCHOR.md': 'f83217aa985b0fba16625bbcaf48464cb4bfcece',
          }
          for path, sha in prepared.items():
              url = 'https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/git/blobs/' + sha
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=60) as response:
                  value = json.load(response)
              assert value['sha'] == sha and value['encoding'] == 'base64'
              content = base64.b64decode(value['content'])
              actual = subprocess.check_output(['git', 'hash-object', '--stdin'], input=content).decode().strip()
              assert actual == sha, path
              Path(path).write_bytes(content)
          lib = Path('codex-rs/hepta-neuron/src/lib.rs')
          assert subprocess.check_output(['git', 'hash-object', str(lib)]).decode().strip() == 'cd4ce659b06d67a136be143d7aa8fd64d5519786'
          before = lib.read_text()
          needle = 'pub use journal::JournalError;\n'
          assert before.count(needle) == 1
          lib.write_text(before.replace(needle, 'pub use journal::JournalAnchor;\n' + needle))
          out = Path(os.environ['RUNNER_TEMP']) / 'hepta-normalization'
          out.mkdir()
          (out / 'prepared.json').write_text(json.dumps(prepared, indent=2) + '\n')
          (out / 'source.txt').write_bytes(subprocess.check_output(['git', 'rev-parse', 'HEAD', 'HEAD^{tree}']))
          PY

      - name: Install repository format and test tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,nextest@0.9.103

      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3
          enable-cache: false

      - name: Generate formatting candidate and exact spelling exceptions
        shell: bash
        run: |
          set -euo pipefail
          just fmt
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.codespellignore')
          before = path.read_text()
          assert before == 'ans\niTerm\niTerm2\nnumer\npsuedo\nre-use\nSOM\nte\nTE\nWRONLY\n'
          # Existing Rust enum identifiers, not prose misspellings. No files skipped.
          path.write_text(before + 'atleast\natmost\n')
          PY
          just fmt-check
          uvx --from codespell==2.4.3 codespell --ignore-words .codespellignore --skip ./.git

      - name: Bound changed paths and preserve Python semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import json
          import os
          import subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args])
          allowed_python = {
              'scripts/hepta-cns.py', 'scripts/hepta-gap-closure.py',
              'scripts/hepta-value-learning.py', 'scripts/hepta_module_doc_metadata.py',
              'scripts/hepta_source_registry_closure.py', 'scripts/hepta_wave2_memory_sources.py',
              'scripts/test_hepta_module_doc_metadata.py', 'scripts/verify_hepta_callers.py',
          }
          allowed_rust = {
              'hepta-bellman-operator/src/lib.rs', 'hepta-bellman-operator/src/lib_tests.rs',
              'hepta-infer-worker-host/src/lib.rs', 'hepta-intelligence-eval/src/lib.rs',
              'hepta-intelligence-eval/src/lib_tests.rs', 'hepta-intelligence-eval/src/ope.rs',
              'hepta-intelligence-eval/src/ope_confidence.rs',
              'hepta-intelligence-eval/src/temporal_evaluation.rs',
              'hepta-intelligence-eval/src/temporal_evaluation_tests.rs',
              'hepta-intelligence-eval/src/temporal_fold.rs', 'hepta-intuition/src/lib.rs',
              'hepta-neuron/src/lib.rs', 'hepta-neuron/src/sparse.rs',
              'hepta-operations/src/error.rs', 'hepta-operations/src/ledger.rs',
              'hepta-operations/src/ledger_tests.rs', 'hepta-operations/src/outbox_tests.rs',
              'hepta-plasticity/src/lib.rs', 'hepta-prompt-optimizer/src/lib.rs',
              'hepta-prompt-registry/src/lib.rs', 'hepta-types/src/bounded.rs',
              'hepta-types/src/digest.rs', 'hepta-types/src/digest_tests.rs',
              'hepta-types/src/fixed.rs', 'hepta-types/src/identity.rs',
              'hepta-types/src/identity_tests.rs', 'hepta-wire/src/envelope.rs',
              'hepta-wire/src/envelope_tests.rs',
          }
          implementation = {
              'codex-rs/hepta-neuron/src/journal.rs',
              'codex-rs/hepta-neuron/src/journal_anchor_tests.rs',
              'codex-rs/hepta-neuron/RECOVERY_ANCHOR.md',
          }
          allowed = allowed_python | {'codex-rs/' + p for p in allowed_rust} | {'.codespellignore'} | implementation
          tracked = set(filter(None, git('diff', '--name-only', '-z').decode().split('\0')))
          untracked = set(filter(None, git('ls-files', '--others', '--exclude-standard', '-z').decode().split('\0')))
          changed = sorted(tracked | untracked)
          assert changed and set(changed) <= allowed, sorted(set(changed) - allowed)
          assert untracked <= implementation
          for path in changed:
              assert Path(path).is_file() and not Path(path).is_symlink(), path
              if path in allowed_python:
                  before = git('show', 'HEAD:' + path).decode()
                  after = Path(path).read_text()
                  assert ast.dump(ast.parse(before), include_attributes=False) == ast.dump(ast.parse(after), include_attributes=False), path
          out = Path(os.environ['RUNNER_TEMP']) / 'hepta-normalization'
          hashes = {path: git('hash-object', path).decode().strip() for path in changed}
          (out / 'paths.json').write_text(json.dumps(changed, indent=2) + '\n')
          (out / 'hashes.json').write_text(json.dumps(hashes, indent=2) + '\n')
          subprocess.run(['git', 'add', '--', *changed], check=True)
          (out / 'changes.patch').write_bytes(git('diff', '--cached', '--binary'))
          print(json.dumps({'source': os.environ['SOURCE_SHA'], 'changed_files': len(changed), 'paths': changed}))
          PY
          git diff --cached --check

      - name: Compile, execute all neuron regressions, and lint
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p codex-hepta-neuron --all-targets
          just test --locked -p codex-hepta-neuron
          cargo clippy --locked -p codex-hepta-neuron --all-targets -- -D warnings
          cargo fmt --package codex-hepta-neuron -- --config imports_granularity=Item --check

      - name: Check document, caller and existing boundary regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-gap-closure.py verify
          python3 scripts/hepta-cns.py verify
          python3 scripts/hepta-docs.py verify
          python3 scripts/verify_hepta_callers.py self-test
          python3 scripts/verify_hepta_callers.py verify
          python3 -m unittest discover -s scripts -p test_hepta_module_doc_metadata.py -v
          python3 -m unittest discover -s qualification/cns-organ-reference -v
          python3 -m unittest discover -s tools/hepta-engineering-control -v

      - name: Create candidate Git objects and a new branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path
          repo = 'TrillionniumFoundation/hepta-private-ci'
          source = '2569607012501456d290183df9e986b0a4703fe5'
          branch = 'codex/hepta-blocker-repair-20260905-r3'
          def git(*args):
              return subprocess.check_output(['git', *args])
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/hepta-blocker-materialization-20260905-r3'
          assert git('rev-parse', 'HEAD').decode().strip() == source
          out = Path(os.environ['RUNNER_TEMP']) / 'hepta-normalization'
          paths = json.loads((out / 'paths.json').read_text())
          hashes = json.loads((out / 'hashes.json').read_text())
          assert not git('diff', '--name-only').strip(), 'tests modified staged source'
          assert not git('ls-files', '--others', '--exclude-standard').strip(), 'unexpected untracked files'
          actual_paths = set(filter(None, git('diff', '--cached', '--name-only', '-z').decode().split('\0')))
          assert actual_paths == set(paths)
          def post(endpoint, data):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + '/git/' + endpoint,
                  data=json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28',
                           'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          entries = []
          for path in paths:
              content = Path(path).read_bytes()
              assert git('hash-object', path).decode().strip() == hashes[path], path
              blob = post('blobs', {'encoding': 'base64', 'content': base64.b64encode(content).decode()})
              assert blob['sha'] == hashes[path], path
              original = git('ls-tree', 'HEAD', '--', path).decode().split()
              mode = original[0] if original else '100644'
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
          base_tree = git('rev-parse', 'HEAD^{tree}').decode().strip()
          tree = post('trees', {'base_tree': base_tree, 'tree': entries})
          assert tree['sha'] == git('write-tree').decode().strip()
          message = 'fix(hepta): anchor acknowledged recovery and reconcile mandatory format blockers\n\nBounded candidate from exact 2569607. Add externally anchored recovery with nine regressions; preserve legacy journal bytes and deny silent acknowledged-history loss before repair. Other source changes use existing formatters only, with Python AST equality. Add only existing AtLeast/AtMost spelling exceptions. No evaluator, formatter rule, workflow, dependency, permission, activation or release change. Generator tests are not independent acceptance; exact source and synthetic-merge CI remain required.'
          commit = post('commits', {'message': message, 'tree': tree['sha'], 'parents': [source]})
          # POST creates only; 422 on an existing branch. Never PATCH, force-push or merge.
          post('refs', {'ref': 'refs/heads/' + branch, 'sha': commit['sha']})
          identity = {'source': source, 'tree': tree['sha'], 'head': commit['sha'], 'branch': branch, 'acceptance': False, 'release': False}
          (out / 'candidate.json').write_text(json.dumps(identity, indent=2) + '\n')
          print(json.dumps(identity))
          PY

      - name: Retain candidate patch and identities, not acceptance receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-bounded-normalization-r3
          path: ${{ runner.temp }}/hepta-normalization/
          if-no-files-found: warn
          retention-days: 7
