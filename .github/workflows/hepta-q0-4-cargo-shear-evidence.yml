name: Hepta Intelligence Q0.4 cargo-shear exact evidence

on:
  push:
    branches:
      - "automation/hepta-q0-4-cargo-shear-evidence-20260830"

permissions:
  contents: read

concurrency:
  group: hepta-q0-4-cargo-shear-evidence-20260830
  cancel-in-progress: true

env:
  EXPECTED_REPOSITORY: ProfHepta/hepta-private-ci
  Q0_2_SHA: be4e5675bd2f7142cca5a141f3c050547f9a8bd6
  Q0_3_SHA: 2783d516073fa3a49cf8504e34694edcf95b2a2d
  Q0_4_SHA: cf00eb98637e4d6c3e2cfebc9103eff86ee35b9f
  Q0_4_TREE: b5ae1c5688b58c8eaf92fa87f7d4eae0f369ef2c
  MERGE_SHA: f27e2f19fb76b2078b8668e312db317c138c2862

jobs:
  verify:
    name: Q0.4 exact-head and synthetic-merge cargo-shear evidence
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact Q0.4 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.Q0_4_SHA }}
          path: head
          fetch-depth: 3
          persist-credentials: false

      - name: Checkout exact synthetic merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.MERGE_SHA }}
          path: merge
          fetch-depth: 3
          persist-credentials: false

      - name: Verify immutable topology and path budgets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$(git -C head rev-parse HEAD)" = "$Q0_4_SHA"
          test "$(git -C head rev-parse HEAD^{tree})" = "$Q0_4_TREE"
          test "$(git -C head rev-parse HEAD^)" = "$Q0_3_SHA"
          test "$(git -C head rev-list --count "$Q0_3_SHA"..HEAD)" = 1
          test "$(git -C head diff --name-only HEAD^ HEAD)" = "codex-rs/Cargo.toml"
          test "$(git -C merge rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git -C merge rev-parse HEAD^{tree})" = "$Q0_4_TREE"
          test "$(git -C merge rev-parse HEAD^1)" = "$Q0_3_SHA"
          test "$(git -C merge rev-parse HEAD^2)" = "$Q0_4_SHA"
          test "$(git -C merge rev-list --parents -n 1 HEAD | wc -w | tr -d ' ')" = 3
          git -C head diff --check HEAD^ HEAD

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0

      - name: Install cargo-shear 1.11.2
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-shear@1.11.2

      - name: Verify exact head has zero cargo-shear findings
        shell: bash
        working-directory: head
        run: |
          set -euo pipefail
          cargo shear --deny-warnings --format=json > "$RUNNER_TEMP/head-cargo-shear.json"
          python3 - "$RUNNER_TEMP/head-cargo-shear.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          findings = report.get("findings", [])
          if findings:
              raise SystemExit(json.dumps(findings, indent=2, sort_keys=True))
          PY

      - name: Verify synthetic merge has zero cargo-shear findings
        shell: bash
        working-directory: merge
        run: |
          set -euo pipefail
          cargo shear --deny-warnings --format=json > "$RUNNER_TEMP/merge-cargo-shear.json"
          python3 - "$RUNNER_TEMP/merge-cargo-shear.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          findings = report.get("findings", [])
          if findings:
              raise SystemExit(json.dumps(findings, indent=2, sort_keys=True))
          PY

      - name: Verify matrixd remains a workspace member
        shell: bash
        run: |
          set -euo pipefail
          for checkout in head merge; do
            cargo metadata --manifest-path "$checkout/codex-rs/Cargo.toml" --no-deps --format-version 1 \
              > "$RUNNER_TEMP/${checkout}-metadata.json"
            python3 - "$RUNNER_TEMP/${checkout}-metadata.json" <<'PY'
          import json, sys
          metadata = json.load(open(sys.argv[1], encoding="utf-8"))
          names = {package["name"] for package in metadata["packages"]}
          if "codex-hepta-matrixd" not in names:
              raise SystemExit("codex-hepta-matrixd missing from workspace packages")
          PY
          done

      - name: Emit immutable evidence receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/q0-4-cargo-shear
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess

          def git(path, *args):
              return subprocess.check_output(["git", "-C", path, *args], text=True).strip()

          receipt = {
              "schema": "hepta_intelligence_q0_4_cargo_shear_evidence_v1",
              "status": "PASS_HEPTA_INTELLIGENCE_Q0_4_CARGO_SHEAR",
              "repository": os.environ["EXPECTED_REPOSITORY"],
              "candidate": {
                  "q0_2": os.environ["Q0_2_SHA"],
                  "q0_3": os.environ["Q0_3_SHA"],
                  "q0_4": os.environ["Q0_4_SHA"],
                  "q0_4_tree": os.environ["Q0_4_TREE"],
                  "synthetic_merge": os.environ["MERGE_SHA"],
                  "synthetic_merge_tree": git("merge", "rev-parse", "HEAD^{tree}"),
              },
              "run": {
                  "id": int(os.environ["GITHUB_RUN_ID"]),
                  "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "workflow_commit": os.environ["GITHUB_SHA"],
              },
              "cargo_shear_version": "1.11.2",
              "head_findings": 0,
              "synthetic_merge_findings": 0,
              "matrixd_workspace_member": True,
              "source_writeback": False,
              "runtime_authority": False,
              "production_authority": False,
              "merge_authority": False,
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()
          receipt["receipt_binding_sha256"] = hashlib.sha256(canonical).hexdigest()
          pathlib.Path("artifacts/q0-4-cargo-shear/receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          test -z "$(git -C head status --porcelain --untracked-files=no)"
          test -z "$(git -C merge status --porcelain --untracked-files=no)"

      - name: Upload immutable evidence receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-q0-4-cargo-shear-evidence-${{ env.Q0_4_SHA }}
          path: artifacts/q0-4-cargo-shear/**
          if-no-files-found: error
          retention-days: 30
