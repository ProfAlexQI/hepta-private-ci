# Temporary one-shot event trigger; removed from the final candidate.
name: Hepta one-shot docs patch

on:
  pull_request:

permissions:
  actions: write
  contents: write

jobs:
  patch-and-format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Guard exact event head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3

      - name: Set up repository-pinned Bazel
        uses: ./.github/actions/setup-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu

      - name: Set up pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22

      - name: Install repository-locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize hardened verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import lzma

          root = Path("scripts/.hepta-docs-payload")
          parts = sorted(root.glob("part*.payload"))
          if len(parts) != 6:
              raise SystemExit(f"expected 6 payload parts, found {len(parts)}")
          encoded = "".join(part.read_text(encoding="ascii") for part in parts)
          source = lzma.decompress(base64.b64decode(encoded))
          Path("scripts/hepta-docs.py").write_bytes(source)
          PY

      - name: Harden deleted JSON consumer boundary matching
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/hepta-docs.py")
          source = path.read_text(encoding="utf-8")

          helper_anchor = "def acyclic(nodes, edges, label):\n"
          helper = '''def deleted_path_reference_present(text: str, deleted_path: str) -> bool:
              if deleted_path in text:
                  return True
              basename = re.escape(Path(deleted_path).name)
              return re.search(
                  rf"(?<![A-Za-z0-9_.-]){basename}(?![A-Za-z0-9_.-])",
                  text,
              ) is not None


          '''
          if source.count(helper_anchor) != 1:
              raise SystemExit("could not locate helper insertion anchor")
          source = source.replace(helper_anchor, helper + helper_anchor, 1)

          old_consumer_scan = '''        terms = (old_path, Path(old_path).name)
              for path, text in retained:
                  if any(term in text for term in terms):
                      consumer_hits.append({"retainedPath": path, "deletedJson": old_path})
          '''
          new_consumer_scan = '''        for path, text in retained:
                  if deleted_path_reference_present(text, old_path):
                      consumer_hits.append({"retainedPath": path, "deletedJson": old_path})
          '''
          if source.count(old_consumer_scan) != 1:
              raise SystemExit("could not locate deleted JSON consumer scan")
          source = source.replace(old_consumer_scan, new_consumer_scan, 1)

          self_test_anchor = "def self_test():\n    cases = []\n"
          self_test_prefix = '''def self_test():
              cases = []
              need(
                  not deleted_path_reference_present(
                      "https://bcr.bazel.build/bazel_registry.json",
                      "docs/historical/registry.json",
                  ),
                  "deleted JSON basename boundary false positive",
              )
              need(
                  deleted_path_reference_present(
                      'consumer = "registry.json"',
                      "docs/historical/registry.json",
                  ),
                  "deleted JSON basename boundary false negative",
              )
              cases.append("deleted_json_consumer_boundary")
          '''
          if source.count(self_test_anchor) != 1:
              raise SystemExit("could not locate self-test insertion anchor")
          source = source.replace(self_test_anchor, self_test_prefix, 1)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Format with repository-locked Ruff
        run: uv run --frozen --project scripts ruff format scripts/hepta-docs.py

      - name: Refresh canonical generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          just bazel-lock-update
          stale_path='docs/hepta-vnext/dropbox-current-2026-08-27/historical/qualification/hepta-tree-hygiene-20260827-r25/registry.json'
          if grep -Fq "${stale_path}" MODULE.bazel.lock; then
            echo "MODULE.bazel.lock still contains the exact deleted JSON path" >&2
            exit 1
          fi
          python3 scripts/hepta-docs.py generate-status

      - name: Validate complete development-document closure
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/hepta-docs.py
          python3 scripts/hepta-docs.py self-test

          status_snapshot="${RUNNER_TEMP}/hepta-status.md"
          cp docs/STATUS.md "${status_snapshot}"
          python3 scripts/hepta-docs.py generate-status
          cmp -s docs/STATUS.md "${status_snapshot}"

          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-docs.py verify
          python3 scripts/hepta-docs.py verify-source-tree
          python3 scripts/hepta-docs.py verify-source-head \
            --head-sha "$(git rev-parse HEAD)" \
            --expected-repository "${GITHUB_REPOSITORY}"
          python3 scripts/hepta-docs.py verify-no-legacy-docs
          python3 scripts/hepta-docs.py verify-selected-source
          just bazel-lock-check
          pnpm run format
          git diff --check

      - name: Remove temporary repair transport
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hepta-one-shot-docs-patch.yml
          rm -rf scripts/.hepta-docs-payload

      - name: Commit canonical documentation repair
        id: commit
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail

          unexpected="$({
            git status --porcelain=v1 --untracked-files=normal | while IFS= read -r line; do
              path="${line:3}"
              path="${path##* -> }"
              case "${path}" in
                MODULE.bazel.lock | docs/STATUS.md | scripts/hepta-docs.py | \
                  .github/workflows/hepta-one-shot-docs-patch.yml | \
                  scripts/.hepta-docs-payload/*)
                  ;;
                *)
                  printf '%s\n' "${line}"
                  ;;
              esac
            done
          } || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Unexpected files changed by the documentation repair:" >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            MODULE.bazel.lock \
            docs/STATUS.md \
            scripts/hepta-docs.py \
            .github/workflows/hepta-one-shot-docs-patch.yml \
            scripts/.hepta-docs-payload
          git diff --cached --quiet && { echo "No documentation repair changes to commit"; exit 0; }
          git commit -m "docs: close canonical documentation blockers"
          git push origin "HEAD:${HEAD_REF}"
          echo "pushed-sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Dispatch final source-head documentation verification
        if: steps.commit.outputs.pushed-sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run hepta-development-docs.yml --ref "${HEAD_REF}"
