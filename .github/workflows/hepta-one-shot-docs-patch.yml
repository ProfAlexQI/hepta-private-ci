name: Hepta one-shot docs patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-and-format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Guard exact event head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3

      - name: Materialize hardened verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import lzma

          root = Path("scripts/.hepta-docs-payload")
          parts = sorted(root.glob("part*.payload"))
          if len(parts) != 6:
              raise SystemExit(f"expected 6 payload parts, found {len(parts)}")
          encoded = "".join(part.read_text(encoding="ascii") for part in parts)
          source = lzma.decompress(base64.b64decode(encoded))
          Path("scripts/hepta-docs.py").write_bytes(source)
          PY

      - name: Format with repository-locked Ruff
        run: uv run --frozen --project scripts ruff format scripts/hepta-docs.py

      - name: Validate hardened document system
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/hepta-docs.py
          python3 scripts/hepta-docs.py self-test
          python3 scripts/hepta-docs.py generate-status
          git diff --exit-code -- docs/STATUS.md
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-docs.py verify
          git diff --check

      - name: Commit formatted verifier to the pull-request branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/hepta-docs.py
          git diff --cached --quiet && { echo "No verifier changes to commit"; exit 0; }
          git commit -m "docs: harden canonical receipt and cleanup verification"
          git push origin "HEAD:${HEAD_REF}"
