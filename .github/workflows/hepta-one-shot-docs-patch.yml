# Temporary repair transport; this workflow deletes itself before pushing the final candidate.
name: Hepta one-shot docs patch

on:
  pull_request:

permissions:
  actions: write
  contents: write

jobs:
  patch-and-format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Guard exact event head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3

      - name: Set up repository-pinned Bazel
        uses: ./.github/actions/setup-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu

      - name: Set up pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22

      - name: Install repository-locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize and harden canonical verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import lzma
          import re

          payload = Path("scripts/.hepta-docs-payload")
          parts = sorted(payload.glob("part*.payload"))
          if len(parts) != 6:
              raise SystemExit(f"expected 6 payload parts, found {len(parts)}")
          encoded = "".join(part.read_text(encoding="ascii") for part in parts)
          path = Path("scripts/hepta-docs.py")
          path.write_bytes(lzma.decompress(base64.b64decode(encoded)))

          source = path.read_text(encoding="utf-8")
          had_trailing_newline = source.endswith("\n")
          lines = source.splitlines()
          needle = "terms = (old_path, Path(old_path).name)"
          matches = [i for i, line in enumerate(lines) if line.strip() == needle]
          if len(matches) != 1:
              raise SystemExit(f"expected one deleted JSON scan, found {len(matches)}")
          index = matches[0]
          expected = [
              needle,
              "for retained_path, text in retained_text:",
              "if any(term in text for term in terms):",
              'hits.append({"retainedPath": retained_path, "deletedJson": old_path})',
          ]
          actual = [line.strip() for line in lines[index : index + 4]]
          if actual != expected:
              raise SystemExit("deleted JSON scan shape changed: " + repr(actual))

          indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
          lines[index : index + 4] = [
              indent + "basename = re.escape(Path(old_path).name)",
              indent + "basename_pattern = re.compile(",
              indent + '    rf"(?<![A-Za-z0-9_.-]){basename}(?![A-Za-z0-9_.-])"',
              indent + ")",
              indent + "for retained_path, text in retained_text:",
              indent + "    if old_path in text or basename_pattern.search(text):",
              indent + '        hits.append({"retainedPath": retained_path, "deletedJson": old_path})',
          ]

          basename = re.escape(Path("docs/historical/registry.json").name)
          pattern = re.compile(rf"(?<![A-Za-z0-9_.-]){basename}(?![A-Za-z0-9_.-])")
          if pattern.search("https://bcr.bazel.build/bazel_registry.json"):
              raise SystemExit("deleted JSON basename false positive")
          if not pattern.search('consumer = "registry.json"'):
              raise SystemExit("deleted JSON basename false negative")

          updated = "\n".join(lines) + ("\n" if had_trailing_newline else "")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Format, regenerate and remove repair transport
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --project scripts ruff format scripts/hepta-docs.py
          python3 scripts/hepta-docs.py generate-status
          rm -f .github/workflows/hepta-one-shot-docs-patch.yml
          rm -rf scripts/.hepta-docs-payload

      - name: Commit local canonical candidate
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$({
            git status --porcelain=v1 --untracked-files=normal | while IFS= read -r line; do
              path="${line:3}"
              path="${path##* -> }"
              case "${path}" in
                docs/STATUS.md | scripts/hepta-docs.py | \
                  .github/workflows/hepta-one-shot-docs-patch.yml | \
                  scripts/.hepta-docs-payload/*) ;;
                *) printf '%s\n' "${line}" ;;
              esac
            done
          } || true)"
          if [[ -n "${unexpected}" ]]; then
            echo "Unexpected repair changes:" >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs/STATUS.md scripts/hepta-docs.py \
            .github/workflows/hepta-one-shot-docs-patch.yml scripts/.hepta-docs-payload
          git diff --cached --quiet && { echo "No repair changes to commit"; exit 1; }
          git commit -m "docs: close canonical documentation blockers"
          echo "candidate-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate committed candidate through supported interfaces
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          test "$candidate_sha" = "${{ steps.commit.outputs.candidate-sha }}"
          test ! -e .github/workflows/hepta-one-shot-docs-patch.yml
          test ! -e scripts/.hepta-docs-payload
          python3 -m py_compile scripts/hepta-docs.py
          python3 scripts/hepta-docs.py self-test
          python3 scripts/hepta-docs.py inventory-legacy
          status_snapshot="${RUNNER_TEMP}/hepta-status.md"
          cp docs/STATUS.md "$status_snapshot"
          python3 scripts/hepta-docs.py generate-status
          cmp -s docs/STATUS.md "$status_snapshot"
          python3 scripts/hepta-module-docs.py self-test
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-docs.py verify
          python3 scripts/hepta-docs.py cleanup-inventory \
            --output "${RUNNER_TEMP}/cleanup-source-head.json"
          just bazel-lock-check
          pnpm run format
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Push verified canonical repair
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: git push origin "HEAD:${HEAD_REF}"

      - name: Dispatch exact source-head verification
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run hepta-development-docs.yml --ref "$HEAD_REF"
