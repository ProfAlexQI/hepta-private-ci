name: AuthBus P1.3 exact source export

on:
  push:
    branches:
      - tmp/authbus-p1-3-source-export-20260829
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authbus-p1-3-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export exact P1.3 seed source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and archive source outside the tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
          printf '%s\n' "${GITHUB_SHA}" > SOURCE_HEAD
          printf '%s\n' "$(git rev-parse 'HEAD^{tree}')" > SOURCE_TREE
          tar --exclude=.git -czf /tmp/authbus-p1-3-source.tar.gz .
          test -s /tmp/authbus-p1-3-source.tar.gz

      - name: Upload exact source archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: authbus-p1-3-source-${{ github.sha }}
          path: /tmp/authbus-p1-3-source.tar.gz
          if-no-files-found: error
          retention-days: 1
