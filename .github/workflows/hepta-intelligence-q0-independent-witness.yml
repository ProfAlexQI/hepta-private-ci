name: Hepta Intelligence Q0 independent witness

on:
  push:
    branches:
      - codex/hepta-intelligence-plan-v3-20260828
    paths:
      - .github/workflows/hepta-intelligence-q0-independent-witness.yml
      - .github/workflows/hepta-intelligence-q0-exact-candidate-v9.yml
      - scripts/run-hepta-intelligence-q0-qualification.sh
      - scripts/q0-qualification/**
      - scripts/verify-hepta-intelligence-mutation-journal.py
      - scripts/verify-hepta-intelligence-q0-evidence-pair.py
      - plans/hepta-intelligence/HEPTA_INTELLIGENCE_OPERATOR_ACCEPTANCE_TEMPLATE_V1.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hepta-intelligence-q0-independent-witness-${{ github.sha }}
  cancel-in-progress: false

env:
  EXPECTED_BRANCH: codex/hepta-intelligence-plan-v3-20260828
  EXPECTED_PARENT: 1089229428270867a4de4c8d3795a6c48bf67464
  ARTIFACT_DIR: artifacts/hepta-intelligence-q0-independent-witness/arm64
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_BUILD_JOBS: 4
  RUST_BACKTRACE: 1

jobs:
  prove-independent:
    name: Prove frozen Q0 candidate independently on ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Checkout exact independent candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Execute exact E2 qualification matrix
        shell: bash
        env:
          Q0_EXPECTED_UNAME: aarch64
          Q0_EXPECTED_RUST_HOST: aarch64-unknown-linux-gnu
          Q0_EVIDENCE_CLASS: E2_INDEPENDENT_RUNNER
        run: bash scripts/run-hepta-intelligence-q0-qualification.sh

      - name: Pair E2 with the exact successful E1 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          e1_run_id=""
          for attempt in $(seq 1 180); do
            response=$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/hepta-intelligence-q0-exact-candidate-v9.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=20")
            e1_run_id=$(python3 -c '
          import json, sys
          data=json.load(sys.stdin)
          runs=[r for r in data.get("workflow_runs", []) if r.get("head_sha")==sys.argv[1]]
          success=[r for r in runs if r.get("status")=="completed" and r.get("conclusion")=="success"]
          print(success[0]["id"] if success else "")
          ' "$GITHUB_SHA" <<<"$response")
            if test -n "$e1_run_id"; then
              break
            fi
            failed=$(python3 -c '
          import json, sys
          data=json.load(sys.stdin)
          runs=[r for r in data.get("workflow_runs", []) if r.get("head_sha")==sys.argv[1]]
          print("1" if any(r.get("status")=="completed" and r.get("conclusion") not in (None,"success") for r in runs) else "0")
          ' "$GITHUB_SHA" <<<"$response")
            if test "$failed" = "1"; then
              printf 'exact E1 workflow completed unsuccessfully\n' >&2
              exit 1
            fi
            sleep 30
          done
          test -n "$e1_run_id"
          mkdir -p "$RUNNER_TEMP/q0-e1"
          gh run download "$e1_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "hepta-intelligence-q0-exact-candidate-v9-x64-$GITHUB_SHA" \
            --dir "$RUNNER_TEMP/q0-e1"
          python3 scripts/verify-hepta-intelligence-q0-evidence-pair.py \
            --e1 "$RUNNER_TEMP/q0-e1/e1-qualification-receipt.json" \
            --e2 "$ARTIFACT_DIR/e2-qualification-receipt.json" \
            --output "$ARTIFACT_DIR/q0-evidence-pair-receipt.json"

      - name: Upload independent witness and paired evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-intelligence-q0-independent-witness-arm64-${{ github.sha }}
          path: artifacts/hepta-intelligence-q0-independent-witness/arm64/**
          if-no-files-found: error
          retention-days: 30
