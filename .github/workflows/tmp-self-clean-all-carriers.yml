name: Temporary self-clean all carriers

on:
  push:
    branches:
      - codex/tmp-generate-cargo-lock-20260902

permissions:
  contents: write

concurrency:
  group: hepta-carrier-self-clean-20260902
  cancel-in-progress: true

jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out carrier branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/tmp-generate-cargo-lock-20260902
          fetch-depth: 0
          persist-credentials: true

      - name: Remove every temporary transport workflow from the carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/tmp-final-converge-v2.yml \
            .github/workflows/tmp-final-converge-v3.yml \
            .github/workflows/tmp-final-converge-v4.yml \
            .github/workflows/tmp-pr295-ci-observer.yml \
            .github/workflows/tmp-pr295-ci-observer-v2.yml \
            .github/workflows/tmp-transport-cleanup.yml \
            .github/workflows/tmp-generate-cargo-lock.yml \
            .github/workflows/tmp-self-clean-all-carriers.yml
          git config user.name "Hepta carrier cleanup"
          git config user.email "hepta-carrier-cleanup@users.noreply.github.com"
          git add -A .github/workflows
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(ci): retire temporary convergence carriers"
          git push origin HEAD:refs/heads/codex/tmp-generate-cargo-lock-20260902
