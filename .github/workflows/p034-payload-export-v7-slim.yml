name: P0.3.4 v7 immutable payload export

on:
  push:
    branches:
      - codex/p034-rebuild-v2-20260829
    paths:
      - .github/workflows/p034-payload-export-v7-slim.yml
      - ci/p034-rebuild/hotfix.py
      - ci/p034-rebuild/paired.py
      - ci/p034-rebuild/publish.py
      - ci/p034-rebuild/payload.part*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PAYLOAD_SHA256: 9e8fcf09a0da859a7f0b1495c4a0559a6d3f9f6f24ac85e4721184fc9fd3bd96
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Reconstruct, validate, and bind payload
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p034-v7-export"
          mkdir -p "${out}/payload"
          cat ci/p034-rebuild/payload.part* > "${out}/payload.b64"
          base64 -d "${out}/payload.b64" > "${out}/payload.tar.gz"
          echo "${PAYLOAD_SHA256}  ${out}/payload.tar.gz" | sha256sum -c -
          tar -C "${out}/payload" -xzf "${out}/payload.tar.gz"
          python3 ci/p034-rebuild/hotfix.py "${out}/payload" | tee "${out}/payload-validation-receipt.json"
          python3 "${out}/payload/clippy_delta.py" --self-test | tee "${out}/clippy-selftest-receipt.json"
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/p034-v7-helper-pycache" \
            python3 -m py_compile ci/p034-rebuild/hotfix.py ci/p034-rebuild/paired.py ci/p034-rebuild/publish.py
          printf '%s\n' "${GITHUB_SHA}" > "${out}/HELPER_HEAD"
          find "${out}/payload" -type f -print0 | sort -z | xargs -0 sha256sum > "${out}/EXTRACTED_SHA256SUMS"
      - name: Upload immutable payload evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: p034-v7-payload-${{ github.sha }}
          path: ${{ runner.temp }}/p034-v7-export/**
          if-no-files-found: error
          retention-days: 30
