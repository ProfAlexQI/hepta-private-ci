name: P0.3.4 v7 build-bundle qualify-pair then publish

on:
  push:
    branches:
      - codex/p034-rebuild-v2-20260829
    paths:
      - .github/workflows/p034-rebuild-v7-paired.yml
      - ci/p034-rebuild/hotfix.py
      - ci/p034-rebuild/paired.py
      - ci/p034-rebuild/publish.py
      - ci/p034-rebuild/payload.part*
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: p034-rebuild-v7-paired
  cancel-in-progress: true

env:
  P033_HEAD: eddcb59ca43a76ac83b64507983bd908f406ff48
  BASE_BRANCH: codex/hepta-intelligence-evidence-resolver-v4-20260828
  TARGET_BRANCH: codex/hepta-intelligence-legacy-governance-v3-20260829
  PAYLOAD_SHA256: 9e8fcf09a0da859a7f0b1495c4a0559a6d3f9f6f24ac85e4721184fc9fd3bd96
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  build-x64:
    name: Build one unpublished successor and qualify X64
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      candidate_head: ${{ steps.build.outputs.candidate_head }}
    env:
      QUALIFICATION_LANE: linux-x64
      EXPECTED_RUNNER_ARCH: X64
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: helper
          persist-credentials: false

      - name: Checkout exact P0.3.3 build base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.P033_HEAD }}
          fetch-depth: 0
          path: target
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Recover and validate immutable reconstruction payload
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p034-rebuild-v7"
          payload="${out}/payload"
          mkdir -p "${payload}"
          cat helper/ci/p034-rebuild/payload.part* > "${out}/payload.b64"
          base64 -d "${out}/payload.b64" > "${out}/payload.tar.gz"
          echo "${PAYLOAD_SHA256}  ${out}/payload.tar.gz" | sha256sum -c -
          tar -C "${payload}" -xzf "${out}/payload.tar.gz"
          python3 helper/ci/p034-rebuild/hotfix.py "${payload}"
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/p034-v7-payload-pycache" python3 -m py_compile "${payload}/"*.py
          python3 "${payload}/clippy_delta.py" --self-test

      - name: Build, exact-qualify, and bundle without publishing
        id: build
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/p034-helper-x64/qualification
          CANDIDATE_BUNDLE: ${{ runner.temp }}/p034-helper-x64/candidate.bundle
          CANDIDATE_BUNDLE_RECEIPT: ${{ runner.temp }}/p034-helper-x64/candidate-bundle-receipt.json
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "${P033_HEAD}"
          log="${RUNNER_TEMP}/p034-helper-x64/build.log"
          mkdir -p "$(dirname "${log}")"
          python3 "${RUNNER_TEMP}/p034-rebuild-v7/payload/apply.py" target 2>&1 | tee "${log}"
          candidate_head="$(tail -n 1 "${log}" | tr -d '\r')"
          [[ "${candidate_head}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C target rev-parse HEAD)" = "${candidate_head}"
          test "$(git -C target rev-parse HEAD^)" = "${P033_HEAD}"
          test "$(git -C target rev-list --count "${P033_HEAD}..HEAD")" = "1"
          echo "candidate_head=${candidate_head}" >> "${GITHUB_OUTPUT}"

      - name: Upload unpublished X64 bundle and qualification evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: p034-v7-linux-x64-${{ github.sha }}
          path: ${{ runner.temp }}/p034-helper-x64/**
          if-no-files-found: error
          retention-days: 30

  qualify-arm64:
    name: Qualify the identical unpublished bundle on ARM64
    needs: build-x64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      QUALIFICATION_LANE: linux-arm64
      EXPECTED_RUNNER_ARCH: ARM64
      EXPECTED_HEAD: ${{ needs.build-x64.outputs.candidate_head }}
    steps:
      - name: Checkout exact P0.3.3 qualification base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.P033_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download unpublished X64 candidate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: p034-v7-linux-x64-${{ github.sha }}
          path: ${{ runner.temp }}/p034-x64-evidence

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Materialize and verify exact bundled candidate
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(find "${RUNNER_TEMP}/p034-x64-evidence" -name candidate.bundle -type f -print -quit)"
          receipt="$(find "${RUNNER_TEMP}/p034-x64-evidence" -name candidate-bundle-receipt.json -type f -print -quit)"
          test -n "${bundle}" && test -n "${receipt}"
          export bundle receipt
          python3 - <<'PY'
          import hashlib, json, os
          r=json.load(open(os.environ['receipt']))
          observed=hashlib.sha256(open(os.environ['bundle'],'rb').read()).hexdigest()
          assert r['schema']=='hepta_intelligence_p0_3_4_candidate_bundle_v1'
          assert r['base_head']==os.environ['P033_HEAD']
          assert r['head']==os.environ['EXPECTED_HEAD']
          assert r['successor_commit_count']==1
          assert r['bundle_sha256']==observed
          assert r['qualified_before_publication'] is True
          assert r['published'] is False
          assert r['force_push'] is False and r['history_rewrite'] is False
          PY
          git bundle verify "${bundle}"
          git fetch "${bundle}" refs/heads/p034-candidate-bundle:refs/remotes/p034/candidate
          test "$(git rev-parse refs/remotes/p034/candidate)" = "${EXPECTED_HEAD}"
          test "$(git rev-parse refs/remotes/p034/candidate^)" = "${P033_HEAD}"
          test "$(git rev-list --count "${P033_HEAD}..refs/remotes/p034/candidate")" = "1"
          git checkout --detach refs/remotes/p034/candidate

      - name: Execute exact-head ARM64 admission matrix
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/p034-helper-arm64/qualification
        run: python3 scripts/run-hepta-intelligence-legacy-grounding-governance-v2.py

      - name: Upload ARM64 qualification evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: p034-v7-linux-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/p034-helper-arm64/**
          if-no-files-found: error
          retention-days: 30

  paired-qualification:
    name: Aggregate same-head X64 and ARM64 before publication
    needs: [build-x64, qualify-arm64]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      qualified: ${{ steps.aggregate.outputs.qualified }}
      head: ${{ steps.aggregate.outputs.head }}
      tree: ${{ steps.aggregate.outputs.tree }}
      bundle_sha256: ${{ steps.aggregate.outputs.bundle_sha256 }}
    env:
      EXPECTED_HEAD: ${{ needs.build-x64.outputs.candidate_head }}
    steps:
      - name: Checkout exact helper aggregator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download X64 evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: p034-v7-linux-x64-${{ github.sha }}
          path: ${{ runner.temp }}/p034-paired/linux-x64

      - name: Download ARM64 evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: p034-v7-linux-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/p034-paired/linux-arm64

      - name: Build and enforce paired qualification receipt
        id: aggregate
        if: always()
        shell: bash
        run: |
          python3 ci/p034-rebuild/paired.py \
            "${RUNNER_TEMP}/p034-paired" \
            "${EXPECTED_HEAD}" \
            "${RUNNER_TEMP}/p034-paired/paired-qualification-receipt.json"

      - name: Upload paired qualification receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: p034-v7-paired-${{ github.sha }}
          path: ${{ runner.temp }}/p034-paired/paired-qualification-receipt.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Ordinary-push exact head and create Draft PR
    needs: paired-qualification
    if: needs.paired-qualification.result == 'success' && needs.paired-qualification.outputs.qualified == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ needs.paired-qualification.outputs.head }}
      EXPECTED_TREE: ${{ needs.paired-qualification.outputs.tree }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact helper publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: helper
          persist-credentials: false

      - name: Checkout exact P0.3.3 publication base with credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.P033_HEAD }}
          fetch-depth: 0
          path: target

      - name: Download X64 candidate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: p034-v7-linux-x64-${{ github.sha }}
          path: ${{ runner.temp }}/p034-publication/x64

      - name: Download paired authorization receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: p034-v7-paired-${{ github.sha }}
          path: ${{ runner.temp }}/p034-publication/paired

      - name: Publish idempotently without force and create Draft PR
        shell: bash
        run: |
          set -euo pipefail
          paired="$(find "${RUNNER_TEMP}/p034-publication/paired" -name paired-qualification-receipt.json -type f -print -quit)"
          test -n "${paired}"
          python3 helper/ci/p034-rebuild/publish.py \
            target \
            "${RUNNER_TEMP}/p034-publication/x64" \
            "${paired}" \
            "${EXPECTED_HEAD}" \
            "${RUNNER_TEMP}/p034-publication/publication-receipt.json"

      - name: Upload publication receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: p034-v7-publication-${{ github.sha }}
          path: ${{ runner.temp }}/p034-publication/publication-receipt.json
          if-no-files-found: error
          retention-days: 30
