name: Hepta source-ratchet repair once

on:
  push:
    branches:
      - codex/hepta-architecture-convergence-p0-2-20260828
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-source-ratchet-repair-once
  cancel-in-progress: false

env:
  BRANCH_NAME: codex/hepta-architecture-convergence-p0-2-20260828
  SOURCE_HEAD: ${{ github.sha }}

jobs:
  repair:
    name: Apply bounded source-ratchet repair
    if: ${{ !contains(github.event.head_commit.message || '', '[hepta-source-fix]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify exact live branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH_NAME"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          git fetch --no-tags origin \
            "refs/heads/$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
          test "$(git rev-parse "refs/remotes/origin/$BRANCH_NAME")" = "$SOURCE_HEAD"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Apply exact bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git apply --check scripts/hepta-source-fix-once.patch
          git apply scripts/hepta-source-fix-once.patch
          git rm .github/workflows/hepta-source-fix-once.yml
          git rm scripts/hepta-source-fix-once.patch

      - name: Execute source ratchets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/verify-hepta-architecture-convergence-p0-2.py \
            scripts/verify-hepta-authority-callers-p0-1.py \
            scripts/verify-hepta-cross-owner-operation-wiring.py \
            scripts/verify-hepta-architecture-gap-ledger.py
          python3 scripts/verify-hepta-authority-callers-p0-1.py
          python3 scripts/verify-hepta-cross-owner-operation-wiring.py
          python3 scripts/verify-hepta-architecture-gap-ledger.py
          python3 scripts/verify-hepta-architecture-convergence-p0-2.py

      - name: Enforce exact mutation allowlist
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              ".github/workflows/hepta-cargo-lock-finalizer-p0-2.yml",
              ".github/workflows/hepta-source-export.yml",
              ".github/workflows/hepta-source-fix-once.yml",
              "codex-rs/hepta-contracts/src/provider_operation.rs",
              "docs/architecture/HEPTA_AUTHORITY_CALLERS_V1.json",
              "scripts/hepta-source-fix-once.patch",
              "scripts/verify-hepta-architecture-convergence-p0-2.py",
              "scripts/verify-hepta-cross-owner-operation-wiring.py",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "status", "--short"], text=True
              ).splitlines()
          )
          paths = {line[3:] for line in changed if len(line) > 3}
          unexpected = sorted(paths - allowed)
          if unexpected:
              raise SystemExit(f"source repair escaped allowlist: {unexpected}")
          if not paths:
              raise SystemExit("source repair produced no changes")
          PY

      - name: Commit and fast-forward repaired source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git fetch --no-tags origin \
            "refs/heads/$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
          test "$(git rev-parse "refs/remotes/origin/$BRANCH_NAME")" = "$SOURCE_HEAD"
          git config user.name "Hepta source-ratchet repair"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git commit -m "fix(hepta): repair source ratchets and route lock closure [hepta-source-fix]"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
