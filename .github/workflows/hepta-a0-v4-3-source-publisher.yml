name: Hepta A0 v4.3 governed source publisher

on:
  push:
    branches:
      - "automation/hepta-a0-v4-3-rv-fix-20260829-2249"

permissions:
  contents: write

concurrency:
  group: hepta-a0-v4-3-source-publisher-20260829-2249
  cancel-in-progress: false

env:
  REPOSITORY: ProfHepta/hepta-private-ci
  TARGET_BRANCH: codex/hepta-intelligence-a0-authority-gap-closure-20260829
  TARGET_HEAD: 0b80caff91010f40a79c795c20487ff9d773d229
  TARGET_TREE: 9f67a4892a3474e7f424327ecc46d81a98421cc4
  Q0_HEAD: c768bcbeb4c1168088d2499828c24da521a2a73a
  STAGING_BRANCH: staging/hepta-a0-v4-3-rv-fix-20260829-2249

jobs:
  publish:
    name: Build one Q0-single-parent A0 replacement
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source-publisher program
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: publisher
          persist-credentials: false

      - name: Checkout exact predecessor candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_HEAD }}
          path: target
          fetch-depth: 2
          persist-credentials: true

      - name: Verify immutable input and publisher syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPOSITORY"
          test "$(git -C target rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git -C target rev-parse HEAD^)" = "$Q0_HEAD"
          remote_head="$(git -C target ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$TARGET_HEAD"
          python3 -m py_compile publisher/automation/hepta-a0-v4-3-source-publisher.py

      - name: Build and validate exact replacement
        shell: bash
        run: |
          set -euo pipefail
          git -C target config user.name "Hepta governed source publisher"
          git -C target config user.email "hepta-source-publisher@users.noreply.github.com"
          python3 publisher/automation/hepta-a0-v4-3-source-publisher.py \
            --root "$GITHUB_WORKSPACE/target" \
            --report-dir "$GITHUB_WORKSPACE/target/artifacts/hepta-a0-v4-3-source-publisher"

      - name: Publish immutable staging ref only
        shell: bash
        run: |
          set -euo pipefail
          commit="$(cat target/artifacts/hepta-a0-v4-3-source-publisher/commit.txt)"
          remote_head="$(git -C target ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$TARGET_HEAD"
          git -C target push --force origin "$commit:refs/heads/$STAGING_BRANCH"

      - name: Upload source-publisher receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-a0-v4-3-source-publisher-${{ github.sha }}
          path: target/artifacts/hepta-a0-v4-3-source-publisher/**
          if-no-files-found: error
          retention-days: 30
