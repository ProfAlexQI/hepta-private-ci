name: Hepta inference historical INF-0C protocol evidence

on:
  pull_request:
    paths:
      - "scripts/hepta-inference-inf0c-real-e2e.py"
      - "scripts/hepta-inference-inf0c-protocol-evidence.py"
      - "scripts/hepta-inference-inf0c-protocol-evidence-selftest.py"
      - "scripts/hepta-inference-inf0c-protocol-evidence-source-gate.py"
      - "scripts/hepta-inference-inf0c-historical-receipt-gate.py"
      - "docs/hepta-vnext/inference/HEPTA_INFERENCE_INF0C_PROTOCOL_EVIDENCE.md"
      - "docs/hepta-vnext/inference/HEPTA_INFERENCE_INF0C_SOURCE_RECEIPT_2026-08-28.json"
      - ".github/workflows/hepta-inference-inf0c-protocol-evidence.yml"
  workflow_dispatch:
    inputs:
      run_real_protocol_evidence:
        description: "Run exact tool-call and inventory evidence on pre-provisioned services"
        required: false
        default: false
        type: boolean
      ollama_model:
        description: "Exact pre-installed Ollama model ID"
        required: false
        type: string
      lmstudio_model:
        description: "Exact pre-installed LM Studio model ID"
        required: false
        type: string

permissions:
  contents: read

jobs:
  protocol-source:
    name: Historical protocol parser and fault evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify assigned runner and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNNER_NAME"
          test -n "$RUNNER_OS"
          test -n "$RUNNER_ARCH"
          test -z "$(git status --porcelain)"
          python3 -m py_compile \
            scripts/hepta-inference-inf0c-real-e2e.py \
            scripts/hepta-inference-inf0c-protocol-evidence.py \
            scripts/hepta-inference-inf0c-protocol-evidence-selftest.py \
            scripts/hepta-inference-inf0c-protocol-evidence-source-gate.py \
            scripts/hepta-inference-inf0c-historical-receipt-gate.py

      - name: Self-test exact tool-call parser and inventory fence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-inference-inf0c-protocol-evidence.py --self-test \
            | tee "$RUNNER_TEMP/hepta-inference-inf0c-protocol-parser.txt"

      - name: Self-test strict SSE malformed-event and timeout matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-inference-inf0c-protocol-evidence-selftest.py \
            | tee "$RUNNER_TEMP/hepta-inference-inf0c-protocol-sse.txt"

      - name: Verify protocol source and negative-authority contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-inference-inf0c-protocol-evidence-source-gate.py \
            | tee "$RUNNER_TEMP/hepta-inference-inf0c-protocol-source.txt"

      - name: Verify immutable historical receipt and ancestry
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-inference-inf0c-historical-receipt-gate.py \
            | tee "$RUNNER_TEMP/hepta-inference-inf0c-historical-receipt.txt"

      - name: Record qualification-only posture
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Historical INF-0C protocol evidence posture"
            echo
            echo "- exact descendant head: $(git rev-parse HEAD)"
            echo "- historical receipt validated: true"
            echo "- mutable current stage gate replayed: false"
            echo "- exact tool-call real execution: false"
            echo "- real inventory stability: false"
            echo "- real strict SSE execution: false"
            echo "- backend cancellation acknowledged: false"
            echo "- qualification_only: true"
            echo "- operator/promotion/release authority: false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload protocol source evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-inf0c-protocol-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/hepta-inference-inf0c-*.txt
          if-no-files-found: error
          retention-days: 30

  real-protocol-evidence:
    name: Fixed-tuple tool-call and inventory evidence
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_real_protocol_evidence }}
    needs: protocol-source
    runs-on: [self-hosted, hepta-inference-e2e]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact pre-installed model IDs
        shell: bash
        env:
          OLLAMA_MODEL: ${{ inputs.ollama_model }}
          LMSTUDIO_MODEL: ${{ inputs.lmstudio_model }}
        run: |
          set -euo pipefail
          test -n "$OLLAMA_MODEL"
          test -n "$LMSTUDIO_MODEL"

      - name: Execute exact tool-call and inventory evidence
        shell: bash
        env:
          OLLAMA_MODEL: ${{ inputs.ollama_model }}
          LMSTUDIO_MODEL: ${{ inputs.lmstudio_model }}
        run: |
          set -euo pipefail
          python3 scripts/hepta-inference-inf0c-protocol-evidence.py \
            --execute \
            --ollama-model "$OLLAMA_MODEL" \
            --lmstudio-model "$LMSTUDIO_MODEL" \
            --receipt "$RUNNER_TEMP/hepta-inference-inf0c-protocol-evidence.json"

      - name: Require protocol receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/hepta-inference-inf0c-protocol-evidence.json"

      - name: Upload real protocol evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-inf0c-protocol-real-software-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-inference-inf0c-protocol-evidence.json
          if-no-files-found: error
          retention-days: 30

  protocol-summary:
    name: Historical protocol evidence source aggregate
    if: always()
    needs: protocol-source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce protocol source result
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.protocol-source.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          echo PASS_HEPTA_INFERENCE_INF0C_HISTORICAL_PROTOCOL_SOURCE_ONLY
          echo real_provider_executed=false
          echo backend_cancellation_acknowledged=false
          echo operator_accepted=false
          echo promoted=false
          echo released=false
