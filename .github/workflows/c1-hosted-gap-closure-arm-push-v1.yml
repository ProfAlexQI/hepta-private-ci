name: C1 hosted gap closure ARM64 push v1

on:
  push:
    branches:
      - codex/hepta-vnext-plan-browser-c0-c3-20260827
    paths:
      - ".github/workflows/c1-hosted-gap-closure-arm-push-v1.yml"
      - "scripts/c1_hosted_gap_closure_v1.py"

permissions:
  contents: write

concurrency:
  group: c1-hosted-gap-closure-arm-push-v1
  cancel-in-progress: true

jobs:
  close-current-gaps:
    name: Close exact branch gaps on ARM64
    if: github.repository == 'ProfHepta/hepta-private-ci'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      HEAD_REF: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Execute fail-closed exact-head closure
        run: python3 scripts/c1_hosted_gap_closure_v1.py
