name: Hepta A0 Q0.1-Q0.3 focused integration

on:
  push:
    branches:
      - automation/hepta-a0-q01-focused-20260830
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-a0-q01-focused-integration
  cancel-in-progress: true

env:
  QUALIFICATION_SHA: 0f1d7e8fdeedac0ac81d17b89748372249a32e40
  QUALIFICATION_TREE: 0c1dc4111e446d1aac5d01420038fc543587e5da

jobs:
  uds-source:
    name: Exact-tree UDS format test and strict Clippy
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout exact qualification tree
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          persist-credentials: false

      - name: Assert exact qualification tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${QUALIFICATION_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "${QUALIFICATION_TREE}"

      - uses: ./.github/actions/setup-ci

      - name: Install Rust 1.95 with formatter and Clippy
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Validate the bounded Q0.3 package
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --manifest-path codex-rs/Cargo.toml -p codex-uds -- --check
          cargo +1.95.0 test --manifest-path codex-rs/Cargo.toml -p codex-uds --locked
          cargo +1.95.0 clippy --manifest-path codex-rs/Cargo.toml -p codex-uds --all-targets --locked -- -D warnings

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  format:
    name: Exact-tree repository format gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout exact qualification tree
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          persist-credentials: false

      - name: Assert exact qualification tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${QUALIFICATION_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "${QUALIFICATION_TREE}"

      - uses: ./.github/actions/setup-ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"

      - name: Run canonical format check
        run: just fmt-check

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  cargo-deny:
    name: Exact-tree cargo-deny policy gate
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact qualification tree
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          persist-credentials: false

      - name: Assert exact qualification tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${QUALIFICATION_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "${QUALIFICATION_TREE}"

      - uses: ./.github/actions/setup-ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0

      - name: Run cargo-deny with checked policy
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml
          arguments: --all-features --config ./codex-rs/deny.toml

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
