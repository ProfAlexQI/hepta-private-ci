name: Hepta A0 Q0.1/Q0.2 focused integration

on:
  push:
    branches:
      - automation/hepta-a0-q01-focused-20260830
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-a0-q01-focused-integration
  cancel-in-progress: true

env:
  QUALIFICATION_SHA: 6170ea18c4205904461c8ae9c5c272091ba2b188

jobs:
  macos-uds-clippy:
    name: Exact-tree macOS UDS Clippy diagnostic
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          persist-credentials: false

      - name: Assert exact qualification tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${QUALIFICATION_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "c39831605fc57e6c40df11dc3c26a18b6a21af98"

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: aarch64-apple-darwin
          cache-scope: bazel-hepta-a0-uds-clippy-diagnostic

      - name: Run exact failing Clippy target and capture stderr
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -uo pipefail
          log_file="${RUNNER_TEMP}/uds-clippy-aarch64-apple-darwin.log"
          set +e
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            -- \
            build \
            --config=clippy \
            --build_metadata=COMMIT_SHA=${QUALIFICATION_SHA} \
            --build_metadata=TAG_job=hepta-a0-focused-uds-clippy \
            -- \
            //codex-rs/uds:uds-unit-tests-bin \
            2>&1 | tee "${log_file}"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "${status}" > "${RUNNER_TEMP}/uds-clippy-exit-code.txt"
          exit "${status}"

      - name: Upload exact diagnostic
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-a0-uds-clippy-diagnostic-6170ea18
          path: |
            ${{ runner.temp }}/uds-clippy-aarch64-apple-darwin.log
            ${{ runner.temp }}/uds-clippy-exit-code.txt
            ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: error
          retention-days: 30

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  format:
    name: Exact-tree format gate
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact qualification tree
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          persist-credentials: false

      - name: Assert exact qualification tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${QUALIFICATION_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "c39831605fc57e6c40df11dc3c26a18b6a21af98"

      - uses: ./.github/actions/setup-ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"

      - name: Run canonical format check
        run: just fmt-check

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  cargo-deny:
    name: Exact-tree cargo-deny policy gate
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact qualification tree
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          persist-credentials: false

      - name: Assert exact qualification tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${QUALIFICATION_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "c39831605fc57e6c40df11dc3c26a18b6a21af98"

      - uses: ./.github/actions/setup-ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0

      - name: Run cargo-deny with checked policy
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml
          arguments: --all-features --config ./codex-rs/deny.toml

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
