name: p0-3-3-format-clippy-fix-v1

on:
  push:
    branches:
      - "codex/hepta-intelligence-evidence-resolver-v4-20260828"
    paths:
      - ".github/workflows/p0-3-3-format-clippy-fix-v1.yml"

permissions:
  contents: write

concurrency:
  group: p0-3-3-format-clippy-fix-v1
  cancel-in-progress: false

jobs:
  repair:
    name: P0.3.3 exact formatter and scoped Clippy repair
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BRANCH: codex/hepta-intelligence-evidence-resolver-v4-20260828
      EXPECTED_PARENT: 9fc697284284c7ed227e2c31f1f534eac7f1b96a
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Apply bounded diagnostics repair
        shell: bash
        run: |
          set -euo pipefail
          STAGED_HEAD=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          from pathlib import Path

          resolver = Path(
              "codex-rs/ext/hepta-memory/src/cognitive/evidence_resolver_v4/resolver.rs"
          )
          text = resolver.read_text(encoding="utf-8")
          old = ".try_fold(0usize, |total, count| total.checked_add(count))"
          new = ".try_fold(0usize, usize::checked_add)"
          if text.count(old) != 1:
              raise SystemExit("resolver checked-add target drifted")
          resolver.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path(
              "codex-rs/ext/hepta-memory/src/cognitive/evidence_resolver_v4/tests.rs"
          )
          text = tests.read_text(encoding="utf-8")
          old = """    assert!(!GROUNDED_TOOL_V4_REGISTERED);
    assert!(!GROUNDED_TOOL_V4_PRODUCTION_AUTHORITY);
    assert!(!MODEL_SUPPLIED_BYTE_OFFSETS);
    assert!(!MODEL_SUPPLIED_DIGESTS);"""
          new = """    const {
        assert!(!GROUNDED_TOOL_V4_REGISTERED);
        assert!(!GROUNDED_TOOL_V4_PRODUCTION_AUTHORITY);
        assert!(!MODEL_SUPPLIED_BYTE_OFFSETS);
        assert!(!MODEL_SUPPLIED_DIGESTS);
    }"""
          if text.count(old) != 1:
              raise SystemExit("constant authority assertion target drifted")
          tests.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          cd codex-rs
          rustfmt --edition 2024 \
            ext/hepta-memory/src/framing.rs \
            ext/hepta-memory/src/cognitive/evidence_resolver_v4.rs \
            ext/hepta-memory/src/cognitive/evidence_resolver_v4/receipt.rs \
            ext/hepta-memory/src/cognitive/evidence_resolver_v4/resolver.rs \
            ext/hepta-memory/src/cognitive/evidence_resolver_v4/schema.rs \
            ext/hepta-memory/src/cognitive/evidence_resolver_v4/support.rs \
            ext/hepta-memory/src/cognitive/evidence_resolver_v4/tests.rs
          cd ..

          rm -f .github/workflows/p0-3-3-format-clippy-fix-v1.yml
          python3 scripts/run-hepta-intelligence-evidence-resolver-v5.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path(
              "artifacts/hepta-intelligence-evidence-resolver-v5/qualification-receipt.json"
          ).read_text(encoding="utf-8"))
          failed = [check["id"] for check in receipt["checks"] if not check["passed"]]
          if failed:
              raise SystemExit(f"P0.3.3 repair preflight failed: {failed}")
          assert receipt["qualified"] is True
          assert receipt["p0_3_2_dependency_qualified"] is True
          PY
          git diff --check
          git config user.name "Qian QI"
          git config user.email "102159240+ProfAlexQI@users.noreply.github.com"
          git add -A
          git commit --no-gpg-sign -m "fix(memory): format and lint host evidence resolver P0.3.3"
          git push \
            --force-with-lease="refs/heads/${BRANCH}:${STAGED_HEAD}" \
            origin "HEAD:refs/heads/${BRANCH}"
