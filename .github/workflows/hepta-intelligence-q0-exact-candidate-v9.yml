name: Hepta Intelligence Q0 exact-candidate matrix v9

on:
  push:
    branches:
      - codex/hepta-intelligence-plan-v3-20260828
    paths:
      - .github/workflows/hepta-intelligence-q0-exact-candidate-v9.yml
      - .github/workflows/hepta-intelligence-q0-independent-witness.yml
      - scripts/run-hepta-intelligence-q0-qualification.sh
      - scripts/q0-qualification/**
      - scripts/verify-hepta-intelligence-mutation-journal.py
      - scripts/verify-hepta-intelligence-q0-evidence-pair.py
      - plans/hepta-intelligence/HEPTA_INTELLIGENCE_OPERATOR_ACCEPTANCE_TEMPLATE_V1.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-intelligence-q0-exact-candidate-v9-${{ github.sha }}
  cancel-in-progress: false

env:
  EXPECTED_BRANCH: codex/hepta-intelligence-plan-v3-20260828
  EXPECTED_PARENT: a7f84baf0afc4a55bc281610501ba41327f4715d
  ARTIFACT_DIR: artifacts/hepta-intelligence-q0-exact-candidate-v9/x64
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_BUILD_JOBS: 4
  RUST_BACKTRACE: 1

jobs:
  prove-candidate:
    name: Prove complete frozen Q0 candidate on x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact Q0 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Execute exact E1 qualification matrix
        shell: bash
        env:
          Q0_EXPECTED_UNAME: x86_64
          Q0_EXPECTED_RUST_HOST: x86_64-unknown-linux-gnu
          Q0_EVIDENCE_CLASS: E1_LOCAL_EXECUTABLE
        run: bash scripts/run-hepta-intelligence-q0-qualification.sh

      - name: Upload exact E1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-intelligence-q0-exact-candidate-v9-x64-${{ github.sha }}
          path: artifacts/hepta-intelligence-q0-exact-candidate-v9/x64/**
          if-no-files-found: error
          retention-days: 30
