name: Hepta UI v5 remediation v25 macOS

on:
  push:
    branches:
      - ops/ui-v5-remediation-v25-macos-20260830
    paths:
      - .github/workflows/hepta-ui-v5-remediation-v25-macos.yml

permissions:
  contents: write

concurrency:
  group: hepta-ui-v5-remediation-v25-macos
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'ProfHepta/hepta-private-ci'
    runs-on: macos-14
    timeout-minutes: 90
    env:
      BRANCH: codex/ui-v5-plan-and-repo-gap-closure-20260829
      EXPECTED_PARENT: 3f2d8192439e8fcc5cb030011202a4f58ceda082
      BOOTSTRAP_PATH: .github/workflows/hepta-ui-v5-remediation-v25-macos.yml
      UPSTREAM_URL: https://github.com/openai/codex.git
      UPSTREAM_PREVIOUS: 61a44880a85d2fd0d8770908dea5733495e571c8
      UPSTREAM_ROLE: current_r12
      UPSTREAM_FROZEN_REF: refs/remotes/upstream/hepta-intake-20260830-r12
      UPSTREAM_INTAKE_PATH: docs/architecture/HEPTA_UPSTREAM_CODEX_CURRENT_INTAKE_2026-08-30_R12.json
      UPSTREAM_RECORD_PATH: docs/architecture/HEPTA_UPSTREAM_CODEX_R12_SEMANTIC_ABSORPTION_RECORD_2026-08-30.json
      V12_DRIVER_COMMIT: 554d710f6a561166553f3c01fafc5b27cd8c28b9
      V14_DRIVER_COMMIT: 3f2d8192439e8fcc5cb030011202a4f58ceda082
      V18_DRIVER_COMMIT: 022b91a04f443d7fe4ca2bce853bc26bccf99f84
      V20_DRIVER_COMMIT: 781c237dbc81f49d3f22432b341d904aaa929291
      V24_X64_DRIVER_COMMIT: 9a1fc8005bab27e668e9cba98235fc21a3021a0d
    steps:
      - name: Check out exact v25 macOS driver commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install deterministic GNU remediation tools
        shell: bash
        run: |
          set -euo pipefail
          brew install bash coreutils findutils gnu-sed jq ripgrep
          printf '%s\n' \
            "$(brew --prefix bash)/bin" \
            "$(brew --prefix coreutils)/libexec/gnubin" \
            "$(brew --prefix findutils)/libexec/gnubin" \
            "$(brew --prefix gnu-sed)/libexec/gnubin" \
            >> "$GITHUB_PATH"
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --no-self-update

      - name: Execute v24 payload with syntax-authoritative addon validation
        shell: bash
        run: |
          set -euo pipefail

          source_workflow="$RUNNER_TEMP/hepta-ui-v5-remediation-v24-x64.yml"
          generated_driver="$RUNNER_TEMP/hepta-ui-v5-remediation-v25-macos.sh"
          if ! git cat-file -e "$V24_X64_DRIVER_COMMIT^{commit}"; then
            git fetch --no-tags origin "$V24_X64_DRIVER_COMMIT"
          fi
          git show "$V24_X64_DRIVER_COMMIT:.github/workflows/hepta-ui-v5-remediation-v24-x64.yml" > "$source_workflow"
          awk '
            /      - name: Execute v20 remediation with corrected Windows patch payload/ { found=1; next }
            found && /        shell: bash/ { next }
            found && /        run: \|/ { in_run=1; next }
            in_run { sub(/^          /, ""); print }
          ' "$source_workflow" > "$generated_driver"
          test -s "$generated_driver"

          export V25_GENERATED_DRIVER="$generated_driver"
          python3 <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          path = Path(os.environ["V25_GENERATED_DRIVER"])
          text = path.read_text(encoding="utf-8")
          overbroad_guard = '''if '!= 1:\\\\n    raise' in decoded:
    raise SystemExit("v24 Windows addon still contains double-escaped statement newlines")
'''
          if text.count(overbroad_guard) != 1:
              raise SystemExit(
                  "v25 syntax-authoritative guard replacement: expected exactly one v24 guard, "
                  f"found {text.count(overbroad_guard)}"
              )
          text = text.replace(overbroad_guard, "", 1)
          path.write_text(text, encoding="utf-8")
          PY

          bash --version
          sed --version | head -n 1
          bash -n "$generated_driver"
          bash -x "$generated_driver"
