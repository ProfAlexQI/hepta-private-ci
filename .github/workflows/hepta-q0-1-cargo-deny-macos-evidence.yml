name: Hepta Intelligence Q0.1 cargo-deny exact evidence macOS

on:
  push:
    branches:
      - "automation/hepta-q0-1-cargo-deny-macos-20260830-0125"

permissions:
  contents: read

concurrency:
  group: hepta-q0-1-cargo-deny-macos-20260830-0125
  cancel-in-progress: true

env:
  EXPECTED_REPOSITORY: ProfHepta/hepta-private-ci
  BASE_SHA: c768bcbeb4c1168088d2499828c24da521a2a73a
  HEAD_SHA: 99b2b44c00bf7b50b588fffddc299bf55fac698a
  HEAD_TREE: 381ed770be51883db94b717e21a96277de726238
  MERGE_SHA: 06661355415a257f19dcae1d23c3914a850eb2c2
  CARGO_DENY_VERSION: 0.19.0
  AARCH64_ARCHIVE_SHA256: a22f2023c06f3eefd099a5d42dd828fd4fa74d1e1c167bd1dbc3cf59ad62ded0
  X86_64_ARCHIVE_SHA256: c42163655413f7e872638cd8c4345a327b512ef0ab99109e9cced691b95af5fb

jobs:
  verify-pair:
    name: Q0.1 exact-head and synthetic-merge cargo-deny policy on macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout evidence workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: evidence
          persist-credentials: false

      - name: Checkout exact Q0.1 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          path: head
          fetch-depth: 2
          persist-credentials: false

      - name: Checkout exact synthetic merge candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.MERGE_SHA }}
          path: merge
          fetch-depth: 3
          persist-credentials: false

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0

      - name: Install pinned cargo-deny release with archive verification
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              triple="aarch64-apple-darwin"
              expected="$AARCH64_ARCHIVE_SHA256"
              ;;
            x86_64)
              triple="x86_64-apple-darwin"
              expected="$X86_64_ARCHIVE_SHA256"
              ;;
            *)
              echo "unsupported macOS architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/cargo-deny-${CARGO_DENY_VERSION}-${triple}.tar.gz"
          extract="$RUNNER_TEMP/cargo-deny-${CARGO_DENY_VERSION}-${triple}"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-${triple}.tar.gz" \
            --output "$archive"
          observed="$(shasum -a 256 "$archive" | awk '{print $1}')"
          test "$observed" = "$expected"
          mkdir -p "$extract"
          tar -xzf "$archive" -C "$extract"
          binary="$(find "$extract" -type f -name cargo-deny -perm -111 -print -quit)"
          test -n "$binary"
          install -m 0755 "$binary" "$RUNNER_TEMP/cargo-deny"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cargo-deny" --version | grep -F "$CARGO_DENY_VERSION"

      - name: Verify immutable identities and source scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$(git -C head rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git -C head rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test "$(git -C head rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git -C head rev-list --count "$BASE_SHA"..HEAD)" = 1
          test "$(git -C head diff --name-only HEAD^ HEAD)" = ".github/workflows/cargo-deny.yml"
          test "$(git -C merge rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git -C merge rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test "$(git -C merge rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git -C merge rev-parse HEAD^2)" = "$HEAD_SHA"
          test "$(git -C merge rev-list --parents -n 1 HEAD | wc -w | tr -d ' ')" = 3
          git -C head diff --check HEAD^ HEAD
          git -C merge diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Verify exact Q0.1 head with checked-in policy
        shell: bash
        working-directory: head
        run: |
          set -euo pipefail
          cargo-deny \
            --log-level warn \
            --manifest-path ./codex-rs/Cargo.toml \
            --all-features \
            check \
            --config ./codex-rs/deny.toml

      - name: Verify synthetic merge with checked-in policy
        shell: bash
        working-directory: merge
        run: |
          set -euo pipefail
          cargo-deny \
            --log-level warn \
            --manifest-path ./codex-rs/Cargo.toml \
            --all-features \
            check \
            --config ./codex-rs/deny.toml

      - name: Emit immutable pair receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/artifacts/q0-1-cargo-deny-macos
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          def git(path, *args):
              return subprocess.check_output(["git", "-C", path, *args], text=True).strip()

          workflow = pathlib.Path("evidence/.github/workflows/hepta-q0-1-cargo-deny-macos-evidence.yml")
          head_policy = pathlib.Path("head/codex-rs/deny.toml")
          head_workflow = pathlib.Path("head/.github/workflows/cargo-deny.yml")
          receipt = {
              "schema": "hepta_intelligence_q0_1_cargo_deny_pair_v1",
              "status": "PASS_HEPTA_INTELLIGENCE_Q0_1_CARGO_DENY_PAIR",
              "repository": os.environ["EXPECTED_REPOSITORY"],
              "candidate": {
                  "base": os.environ["BASE_SHA"],
                  "head": os.environ["HEAD_SHA"],
                  "head_tree": os.environ["HEAD_TREE"],
                  "synthetic_merge": os.environ["MERGE_SHA"],
                  "synthetic_merge_tree": git("merge", "rev-parse", "HEAD^{tree}"),
              },
              "execution": {
                  "platform": "macos-15",
                  "run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "workflow_commit": os.environ["GITHUB_SHA"],
                  "workflow_blob_sha": git(
                      "evidence",
                      "rev-parse",
                      f"{os.environ['GITHUB_SHA']}:.github/workflows/hepta-q0-1-cargo-deny-macos-evidence.yml",
                  ),
                  "workflow_content_sha256": hashlib.sha256(workflow.read_bytes()).hexdigest(),
                  "cargo_deny_version": os.environ["CARGO_DENY_VERSION"],
              },
              "bindings": {
                  "cargo_deny_workflow_blob_sha": git(
                      "head", "rev-parse", "HEAD:.github/workflows/cargo-deny.yml"
                  ),
                  "cargo_deny_workflow_sha256": hashlib.sha256(head_workflow.read_bytes()).hexdigest(),
                  "policy_path": "codex-rs/deny.toml",
                  "policy_sha256": hashlib.sha256(head_policy.read_bytes()).hexdigest(),
              },
              "exact_head_result": "success",
              "synthetic_merge_result": "success",
              "source_writeback": False,
              "runtime_authority": False,
              "production_authority": False,
              "merge_authority": False,
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()
          receipt["receipt_binding_sha256"] = hashlib.sha256(canonical).hexdigest()
          pathlib.Path("evidence/artifacts/q0-1-cargo-deny-macos/receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          test -z "$(git -C head status --porcelain --untracked-files=no)"
          test -z "$(git -C merge status --porcelain --untracked-files=no)"

      - name: Upload immutable pair receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-q0-1-cargo-deny-macos-pair-${{ env.HEAD_SHA }}
          path: evidence/artifacts/q0-1-cargo-deny-macos/**
          if-no-files-found: error
          retention-days: 30
