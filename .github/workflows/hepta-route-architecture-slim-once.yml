name: Hepta one-shot architecture slim routing

on:
  push:
    branches:
      - codex/hepta-architecture-convergence-p0-2-20260828
    paths:
      - ".github/workflows/hepta-route-architecture-slim-once.yml"

permissions:
  contents: write

concurrency:
  group: hepta-route-architecture-slim-once
  cancel-in-progress: true

env:
  BRANCH_NAME: codex/hepta-architecture-convergence-p0-2-20260828
  SOURCE_HEAD: ${{ github.sha }}

jobs:
  route-and-self-delete:
    name: Route architecture closure through ubuntu-slim
    if: ${{ github.repository == 'ProfAlexQI/hepta-private-ci' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout exact routing head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact clean routing input
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH_NAME"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Route the complete Linux architecture chain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          expected = {
              ".github/workflows/hepta-architecture-convergence-p0-2-finalize.yml": 1,
              ".github/workflows/hepta-architecture-convergence-p0-2.yml": 3,
              ".github/workflows/hepta-authority-callers-p0-1.yml": 2,
              ".github/workflows/hepta-legacy-production-authority-adapter-p0-1.yml": 2,
              ".github/workflows/hepta-architecture-fault-matrix-p0-2.yml": 1,
              ".github/workflows/hepta-architecture-convergence-p0-2-bootstrap.yml": 1,
              ".github/workflows/hepta-architecture-p0-2-portability-bootstrap.yml": 1,
          }

          for raw_path, expected_count in expected.items():
              path = Path(raw_path)
              text = path.read_text(encoding="utf-8")
              if "ubuntu-24.04-arm" in text:
                  raise SystemExit(f"stale ARM label remains in {raw_path}")
              actual_count = text.count("ubuntu-24.04")
              if actual_count != expected_count:
                  raise SystemExit(
                      f"unexpected ubuntu-24.04 count for {raw_path}: "
                      f"expected={expected_count} actual={actual_count}"
                  )
              routed = text.replace("ubuntu-24.04", "ubuntu-slim")
              if routed.count("ubuntu-slim") < expected_count:
                  raise SystemExit(f"slim route was not materialized in {raw_path}")
              path.write_text(routed, encoding="utf-8")

          Path(".github/workflows/hepta-route-architecture-slim-once.yml").unlink()
          PY
          git diff --check

      - name: Enforce exact routing allowlist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/hepta-architecture-convergence-p0-2-finalize.yml",
              ".github/workflows/hepta-architecture-convergence-p0-2.yml",
              ".github/workflows/hepta-authority-callers-p0-1.yml",
              ".github/workflows/hepta-legacy-production-authority-adapter-p0-1.yml",
              ".github/workflows/hepta-architecture-fault-matrix-p0-2.yml",
              ".github/workflows/hepta-architecture-convergence-p0-2-bootstrap.yml",
              ".github/workflows/hepta-architecture-p0-2-portability-bootstrap.yml",
              ".github/workflows/hepta-route-architecture-slim-once.yml",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "--diff-filter=ACMRTUXBD"],
                  text=True,
              ).splitlines()
          )
          if changed != expected:
              raise SystemExit(
                  f"one-shot route escaped exact allowlist: "
                  f"missing={sorted(expected - changed)} unexpected={sorted(changed - expected)}"
              )
          PY

      - name: Commit and fast-forward the routed graph
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- \
            .github/workflows/hepta-architecture-convergence-p0-2-finalize.yml \
            .github/workflows/hepta-architecture-convergence-p0-2.yml \
            .github/workflows/hepta-authority-callers-p0-1.yml \
            .github/workflows/hepta-legacy-production-authority-adapter-p0-1.yml \
            .github/workflows/hepta-architecture-fault-matrix-p0-2.yml \
            .github/workflows/hepta-architecture-convergence-p0-2-bootstrap.yml \
            .github/workflows/hepta-architecture-p0-2-portability-bootstrap.yml \
            .github/workflows/hepta-route-architecture-slim-once.yml
          git diff --cached --check
          git config user.name "Hepta architecture slim router"
          git config user.email "102159240+ProfAlexQI@users.noreply.github.com"
          git commit -m "ci(hepta): route architecture closure through slim pool [hepta-slim-route]"
          git fetch origin "refs/heads/$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
          test "$(git rev-parse "origin/$BRANCH_NAME")" = "$SOURCE_HEAD"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
