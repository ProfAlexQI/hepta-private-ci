name: hepta-intelligence-p1-1b-bounded-read-driver-v2

on:
  push:
    branches:
      - "qualification/hepta-intelligence-p1-1b-bounded-read-arm-v2-20260828"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-intelligence-p1-1b-bounded-read-driver-v2-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_NET_OFFLINE: "true"

jobs:
  qualify:
    name: P1.1b bounded index read materialization driver
    runs-on: ubuntu-slim
    timeout-minutes: 60
    steps:
      - name: Checkout exact qualification driver with complete ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact trigger binding
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt,clippy

      - name: Align machine-readable plan boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/qualification/materialize-hepta-intelligence-p1-1b-bounded-read.py")
          text = path.read_text(encoding="utf-8")
          old = "qualified=false\nwired=false\nproduct_workspace_member=false"
          new = "qualified=false\nruntime_wired=false\nproduct_workspace_member=false"
          if text.count(old) != 1:
              raise SystemExit("bounded-read plan marker is not unique")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Execute fail-closed qualification runner
        run: bash scripts/qualification/run-hepta-intelligence-p1-1b-bounded-read.sh

      - name: Upload exact bounded-read evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-intelligence-p1-1b-bounded-read-${{ github.sha }}
          path: artifacts/hepta-intelligence-p1-1b-bounded-read
          if-no-files-found: warn
          retention-days: 14
