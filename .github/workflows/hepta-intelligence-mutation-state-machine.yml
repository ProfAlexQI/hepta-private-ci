name: hepta-intelligence-mutation-state-machine

on:
  push:
    branches:
      - "codex/hepta-intelligence-mutation-state-machine-v4-*"
  pull_request:
    paths:
      - "codex-rs/hepta-memory/src/intelligence_mutation_state.rs"
      - "codex-rs/hepta-memory/src/framing.rs"
      - "codex-rs/rust-toolchain.toml"
      - ".github/workflows/hepta-intelligence-grounding-ledger.yml"
      - ".github/workflows/hepta-intelligence-grounding-gate.yml"
      - "scripts/hepta-intelligence-status-compat.py"
      - "scripts/verify-hepta-intelligence-mutation-state.py"
      - "plans/hepta-intelligence/status-snapshots/HEPTA_INTELLIGENCE_P0_4A_STATUS_SNAPSHOT_V1.json"
      - "plans/hepta-intelligence/HEPTA_INTELLIGENCE_P0_4_SOURCE_TRANCHE_2026-08-28.md"
      - "plans/hepta-intelligence/models/P0_4_INTELLIGENCE_MUTATION_STATE_MACHINE.tla"
      - "plans/hepta-intelligence/HEPTA_INTELLIGENCE_EXECUTION_STATUS_V2.json"
      - ".github/workflows/hepta-intelligence-mutation-state-machine.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: hepta-intelligence-mutation-state-machine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: P0.4 mutation state source contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout explicit candidate identity
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove checked-out commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate Python and immutable tranche status
        run: |
          python3 -m py_compile \
            scripts/hepta-intelligence-status-compat.py \
            scripts/verify-hepta-intelligence-mutation-state.py
          python3 scripts/hepta-intelligence-status-compat.py P0.4a
          python3 -m json.tool \
            plans/hepta-intelligence/HEPTA_INTELLIGENCE_EXECUTION_STATUS_V2.json \
            >/dev/null

      - name: Run fail-closed P0.4 source gate
        run: |
          set -o pipefail
          mkdir -p artifacts/hepta-intelligence-mutation-state-machine
          python3 scripts/verify-hepta-intelligence-mutation-state.py \
            | tee artifacts/hepta-intelligence-mutation-state-machine/source-gate.json

      - name: Verify source-only authority boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path("artifacts/hepta-intelligence-mutation-state-machine/source-gate.json")
              .read_text(encoding="utf-8")
          )
          assert receipt["status"] == "PASS_P0_4_MUTATION_STATE_SOURCE_ONLY"
          for key in (
              "runtime_wired",
              "sqlite_persistence",
              "sqlite_failpoint_execution",
              "production_authority",
              "external_effects",
              "operator_acceptance",
              "promotion",
              "callers_ratchet",
          ):
              assert receipt[key] is False, key
          PY

      - name: Upload source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-intelligence-mutation-state-source-${{ env.EXPECTED_SHA }}
          path: artifacts/hepta-intelligence-mutation-state-machine/source-gate.json
          if-no-files-found: error
          retention-days: 14

  rust-qualification:
    name: P0.4 mutation state Rust qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout explicit candidate identity
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove checked-out commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Check owned-package formatting
        working-directory: codex-rs
        run: cargo fmt -p codex-hepta-memory -- --check

      - name: Run focused mutation-state tests
        working-directory: codex-rs
        env:
          CARGO_TERM_COLOR: always
        run: cargo test -p codex-hepta-memory intelligence_mutation_state -- --nocapture

      - name: Run full hepta-memory tests
        working-directory: codex-rs
        env:
          CARGO_TERM_COLOR: always
        run: cargo test -p codex-hepta-memory

      - name: Run strict clippy
        working-directory: codex-rs
        env:
          CARGO_TERM_COLOR: always
        run: cargo clippy -p codex-hepta-memory --all-targets -- -D warnings
