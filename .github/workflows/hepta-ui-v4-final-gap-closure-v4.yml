name: hepta-ui-v4-final-gap-closure-v4

on:
  push:
    branches: ["codex/ui-v4-executable-final-gap-closure-v3-*"]
  pull_request:
    paths:
      - "apps/hepta-control-ui/**"
      - "apps/hepta-native/src/shared/**"
      - "codex-rs/hepta-core/**"
      - "codex-rs/hepta-native-gateway/**"
      - "tools/hepta-ui-global-platform-source-closure/**"
      - "tools/hepta-ui-windows-product-host-safety/**"
      - "tools/hepta-ui-windows-product-host-device-drill/**"
      - "scripts/hepta-ui-v4-final-gap-closure-index-v3"
      - "scripts/hepta-ui-v4-executable-final-gap-closure-v3-gate"
      - ".github/workflows/hepta-ui-v4-final-gap-closure-v4.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  HEPTA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: hepta-ui-v4-final-gap-v4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Final gap v4 source contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate exact source and contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_CANDIDATE_SHA"
          ruby -c scripts/hepta-ui-v4-final-gap-closure-index-v3
          ruby -c scripts/hepta-ui-v4-executable-final-gap-closure-v3-gate
          ruby scripts/hepta-ui-v4-final-gap-closure-index-v3 --self-test
          ruby scripts/hepta-ui-v4-executable-final-gap-closure-v3-gate
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/hepta-ui-v4-final-gap-closure-v4.yml")'

  served-native:
    name: Final gap v4 served and Native contracts
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_CANDIDATE_SHA"
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Install Linux Native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            pkg-config \
            clang \
            ca-certificates \
            libssl-dev \
            libx11-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libasound2-dev \
            libpulse-dev \
            libwayland-dev \
            wayland-protocols \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libglx-dev \
            libdrm-dev \
            libgbm-dev
      - name: Compile Rust-served bundle and Native contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path codex-rs/Cargo.toml -p hepta-core
          cargo check --manifest-path codex-rs/Cargo.toml -p hepta-native-gateway
          cargo test --manifest-path codex-rs/Cargo.toml -p hepta-core --test control_ui_v4_bundle
          cargo fmt --manifest-path apps/hepta-native/Cargo.toml -- --check
          cargo test --manifest-path apps/hepta-native/Cargo.toml --lib \
            shared::hepta_v4::tests::v4_contract_is_fail_closed_and_readable -- --exact
          cargo test --manifest-path apps/hepta-native/Cargo.toml --lib \
            shared::hepta_platform_material::tests::platform_profiles_are_bounded_and_fail_closed -- --exact
          cargo test --manifest-path apps/hepta-native/Cargo.toml --lib \
            shared::hepta_platform_material_runtime::tests::runtime_material_resolution_is_bounded_and_fail_closed -- --exact

  platform-contracts:
    name: Final gap v4 platform contracts (${{ matrix.os }})
    needs: source-contract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Enable Windows long paths before checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_CANDIDATE_SHA"
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Compile and test converged platform contracts
        shell: bash
        run: |
          set -euo pipefail
          for manifest in \
            tools/hepta-ui-global-platform-source-closure/Cargo.toml \
            tools/hepta-ui-windows-product-host-safety/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" -- --check
            cargo check --manifest-path "$manifest" --all-targets
            cargo test --manifest-path "$manifest" -- --nocapture
          done
          manifest=tools/hepta-ui-windows-product-host-device-drill/Cargo.toml
          cargo fmt --manifest-path "$manifest" -- --check
          cargo check --manifest-path "$manifest" --all-targets

  mobile-targets:
    name: Final gap v4 mobile target (${{ matrix.target }})
    needs: source-contract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-ios
          - os: ubuntu-latest
            target: aarch64-linux-android
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_CANDIDATE_SHA"
      - name: Install Rust 1.95 target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - name: Compile target-specific platform contract
        shell: bash
        run: |
          set -euo pipefail
          cargo check \
            --manifest-path tools/hepta-ui-global-platform-source-closure/Cargo.toml \
            --lib --target "${{ matrix.target }}"

  final-index:
    name: Final UI repository-controlled closure v4
    if: always()
    needs: [source-contract, served-native, platform-contracts, mobile-targets]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Produce exact same-run runner receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_CANDIDATE_SHA"
          mkdir -p artifacts/final
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            > artifacts/final/jobs.json
          ruby -rjson -e '
            jobs=JSON.parse(File.read("artifacts/final/jobs.json")).fetch("jobs")
            required=[
              "Final gap v4 source contract",
              "Final gap v4 served and Native contracts",
              "Final gap v4 platform contracts (ubuntu-latest)",
              "Final gap v4 platform contracts (windows-latest)",
              "Final gap v4 platform contracts (macos-latest)",
              "Final gap v4 mobile target (aarch64-apple-ios)",
              "Final gap v4 mobile target (aarch64-linux-android)"
            ]
            candidate=ENV.fetch("HEPTA_CANDIDATE_SHA")
            selected=required.map do |name|
              matches=jobs.select{|job| job["name"]==name}
              next {"name"=>name,"qualified"=>false} unless matches.length==1
              job=matches.first; steps=Array(job["steps"])
              ok=job["head_sha"]==candidate && job["status"]=="completed" && job["conclusion"]=="success" && job["runner_id"].to_i>0 && !job["runner_name"].to_s.empty? && !steps.empty? && steps.all?{|s| %w[success skipped].include?(s["conclusion"])}
              {"name"=>name,"jobId"=>job["id"],"runnerId"=>job["runner_id"].to_i,"runnerName"=>job["runner_name"].to_s,"labels"=>Array(job["labels"]),"stepCount"=>steps.length,"qualified"=>ok}
            end
            pass=selected.all?{|job| job["qualified"]}
            payload={
              "status"=>pass ? "PASS_EXACT_HEAD_EXECUTABLE_RUNNER_MATRIX" : "FAIL_EXACT_HEAD_EXECUTABLE_RUNNER_MATRIX",
              "candidate"=>{"commit"=>candidate,"tree"=>`git rev-parse HEAD^{tree}`.strip},
              "jobs"=>selected,
              "allRequiredJobsExecuted"=>pass,
              "allRequiredStepsSuccessful"=>pass,
              "exactHeadCheckedOut"=>pass,
              "servedBundleCompiled"=>pass,
              "nativeContractsTested"=>pass,
              "globalPlatformHarnessTested"=>pass,
              "windowsSafetyHarnessTested"=>pass,
              "iosTargetCompiled"=>pass,
              "androidTargetCompiled"=>pass,
              "qualification"=>{"productWired"=>false,"productCargoFeatureDeclared"=>false,"productModuleRegistered"=>false,"productLifecycleWired"=>false,"automaticBindingAllowed"=>false,"productHostMayBind"=>false,"productBound"=>false,"systemMaterialBound"=>false,"nativeProductRuntime"=>false,"deviceValidation"=>false},
              "authority"=>{"network"=>false,"mutation"=>false,"effect"=>false,"liveAdapter"=>false,"production"=>false,"operatorAcceptance"=>false,"promotion"=>false,"release"=>false},
              "failures"=>pass ? [] : ["one or more exact-head executable jobs failed"]
            }
            File.write("artifacts/final/runner.json",JSON.pretty_generate(payload)+"\n")
          '
      - name: Produce bounded final index
        id: index
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ruby scripts/hepta-ui-v4-final-gap-closure-index-v3 \
            --candidate-commit "$HEPTA_CANDIDATE_SHA" \
            --candidate-tree "$(git rev-parse 'HEAD^{tree}')" \
            --evaluated-at-unix "$(date +%s)" \
            --runner-execution artifacts/final/runner.json \
            --output artifacts/final/index.json
      - name: Enforce repository-controlled closure result
        if: always()
        shell: bash
        env:
          INDEX_OUTCOME: ${{ steps.index.outcome }}
        run: |
          set -euo pipefail
          if [[ "$INDEX_OUTCOME" != success ]]; then
            cat artifacts/final/index.json >&2
            exit 1
          fi
          jq -e '
            .status == "BLOCKED_EXTERNAL_EVIDENCE_REQUIRED"
            and .sourceControllableGapsClosed == true
            and .externalEvidenceComplete == false
            and .allGapsClosed == false
            and .slots.runnerExecution.qualified == true
            and (.failures|length) == 0
            and ([.authority[]]|all(.==false))
            and ([.boundary[]]|all(.==false))
          ' artifacts/final/index.json
      - name: Upload repository-controlled closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-ui-v4-final-gap-v4-${{ env.HEPTA_CANDIDATE_SHA }}
          path: artifacts/final
          if-no-files-found: error
          retention-days: 14
