name: hepta-ui-v4-executable-remediation

on:
  push:
    branches:
      - "codex/ui-v4-executable-gap-remediation-20260829"
  pull_request:
    paths:
      - "apps/hepta-native/**"
      - "apps/hepta-control-ui/**"
      - "codex-rs/hepta-core/**"
      - "codex-rs/hepta-native-gateway/**"
      - "tools/hepta-ui-global-platform-source-closure/**"
      - "tools/hepta-ui-windows-product-host-safety/**"
      - "tools/hepta-ui-windows-product-host-device-drill/**"
      - ".github/workflows/hepta-ui-v4-executable-remediation.yml"

permissions:
  contents: read

env:
  HEPTA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  HEPTA_RUST_TOOLCHAIN: "1.95.0"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: "true"

concurrency:
  group: hepta-ui-v4-executable-remediation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Executable remediation source contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate inherited exact source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_CANDIDATE_SHA"
          ruby -c scripts/hepta-ui-v4-final-gap-closure-index-v3
          ruby -c scripts/hepta-ui-v4-executable-final-gap-closure-v3-gate
          ruby scripts/hepta-ui-v4-final-gap-closure-index-v3 --self-test >/dev/null
          ruby scripts/hepta-ui-v4-executable-final-gap-closure-v3-gate > source-gate.json
          ruby -rjson -e '
            receipt=JSON.parse(File.read("source-gate.json"))
            abort "source gate" unless receipt.fetch("status") == "PASS_EXECUTABLE_FINAL_GAP_CLOSURE_V3_SOURCE_ONLY"
            abort "authority" unless %w[production_authority effect_authority live_adapter_authority operator_acceptance promotion release].all? { |key| receipt.fetch(key) == false }
          '

  served-native-contract:
    name: Executable remediation served and Native contracts
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_CANDIDATE_SHA"
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Compile Rust-served bundle and Native contracts
        shell: bash
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail
          cargo check --manifest-path codex-rs/Cargo.toml -p hepta-core
          cargo check --manifest-path codex-rs/Cargo.toml -p hepta-native-gateway
          cargo test --manifest-path codex-rs/Cargo.toml -p hepta-core --test control_ui_v4_bundle
          cargo fmt --manifest-path apps/hepta-native/Cargo.toml -- --check
          cargo test --manifest-path apps/hepta-native/Cargo.toml --lib \
            shared::hepta_v4::tests::v4_contract_is_fail_closed_and_readable -- --exact
          cargo test --manifest-path apps/hepta-native/Cargo.toml --lib \
            shared::hepta_platform_material::tests::platform_profiles_are_bounded_and_fail_closed -- --exact
          cargo test --manifest-path apps/hepta-native/Cargo.toml --lib \
            shared::hepta_platform_material_runtime::tests::runtime_material_resolution_is_bounded_and_fail_closed -- --exact

  platform-contract:
    name: Executable remediation platform contracts (${{ matrix.os }})
    needs: source-contract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout exact sparse candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/hepta-native/src/shared/
            /tools/hepta-ui-global-platform-source-closure/
            /tools/hepta-ui-windows-product-host-safety/
            /tools/hepta-ui-windows-product-host-device-drill/
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_CANDIDATE_SHA"
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Compile and test converged platform contracts
        shell: bash
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail
          global_manifest=tools/hepta-ui-global-platform-source-closure/Cargo.toml
          safety_manifest=tools/hepta-ui-windows-product-host-safety/Cargo.toml
          device_manifest=tools/hepta-ui-windows-product-host-device-drill/Cargo.toml
          cargo fmt --manifest-path "$global_manifest" -- --check
          cargo check --manifest-path "$global_manifest" --all-targets
          cargo test --manifest-path "$global_manifest" -- --nocapture
          cargo fmt --manifest-path "$safety_manifest" -- --check
          cargo check --manifest-path "$safety_manifest" --all-targets --no-default-features
          cargo test --manifest-path "$safety_manifest" --no-default-features -- --nocapture
          cargo check --manifest-path "$safety_manifest" --all-targets --no-default-features --features hepta_ui_windows_system_material_v4
          cargo test --manifest-path "$safety_manifest" --no-default-features --features hepta_ui_windows_system_material_v4 -- --nocapture
          cargo fmt --manifest-path "$device_manifest" -- --check
          cargo check --manifest-path "$device_manifest" --all-targets --no-default-features
          cargo check --manifest-path "$device_manifest" --all-targets --no-default-features --features hepta_ui_windows_system_material_v4

  mobile-target-contract:
    name: Executable remediation mobile target (${{ matrix.target }})
    needs: source-contract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, target: aarch64-apple-ios}
          - {os: ubuntu-latest, target: aarch64-linux-android}
    steps:
      - name: Checkout exact sparse candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/hepta-native/src/shared/
            /tools/hepta-ui-global-platform-source-closure/
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_CANDIDATE_SHA"
      - name: Install Rust 1.95 target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - name: Compile target-specific platform contract
        shell: bash
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail
          cargo check --manifest-path tools/hepta-ui-global-platform-source-closure/Cargo.toml --lib --target "${{ matrix.target }}"

  closure:
    name: Executable remediation matrix closure
    if: always()
    needs: [source-contract, served-native-contract, platform-contract, mobile-target-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Emit fail-closed exact-candidate result
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.source-contract.result }}
          SERVED_RESULT: ${{ needs.served-native-contract.result }}
          PLATFORM_RESULT: ${{ needs.platform-contract.result }}
          MOBILE_RESULT: ${{ needs.mobile-target-contract.result }}
        run: |
          set -euo pipefail
          pass=true
          for value in "$SOURCE_RESULT" "$SERVED_RESULT" "$PLATFORM_RESULT" "$MOBILE_RESULT"; do
            [[ "$value" == success ]] || pass=false
          done
          if [[ "$pass" == true ]]; then
            status=PASS_EXECUTABLE_UI_REMEDIATION_MATRIX
          else
            status=FAIL_EXECUTABLE_UI_REMEDIATION_MATRIX
          fi
          printf '{"schema":"hepta.ui.v4.executable-remediation.v1","status":"%s","candidate":{"commit":"%s"},"results":{"source":"%s","servedNative":"%s","platform":"%s","mobile":"%s"},"productWired":false,"systemMaterialBound":false,"authority":{"network":false,"mutation":false,"effect":false,"liveAdapter":false,"production":false,"operatorAcceptance":false,"promotion":false,"release":false}}\n' \
            "$status" "$HEPTA_CANDIDATE_SHA" "$SOURCE_RESULT" "$SERVED_RESULT" "$PLATFORM_RESULT" "$MOBILE_RESULT" | tee result.json
          [[ "$pass" == true ]]
