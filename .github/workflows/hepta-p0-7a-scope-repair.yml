name: Hepta P0.7a scope repair (temporary)

on:
  push:
    branches:
      - codex/hepta-architecture-v4-p0-7a-closure-20260830
    paths:
      - .github/workflows/hepta-p0-7a-scope-repair.yml

permissions:
  contents: write

concurrency:
  group: hepta-p0-7a-scope-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ProfHepta/hepta-private-ci' &&
      github.ref == 'refs/heads/codex/hepta-architecture-v4-p0-7a-closure-20260830'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact package head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/hepta-architecture-v4-p0-7a-closure-20260830
          fetch-depth: 0
          persist-credentials: true

      - name: Restore package-external formatting from pre-materialization parent
        shell: bash
        env:
          RESTORE_BASE: 094d076132cfa0fa3ddf9145b2caae1560ec0e28
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git checkout "$RESTORE_BASE" -- \
            codex-rs/core/src/agent/control/execution.rs \
            codex-rs/core/src/guardian/review.rs \
            codex-rs/core/src/session/handlers.rs \
            codex-rs/core/src/session/inject.rs \
            codex-rs/core/src/session/thread_settings.rs \
            codex-rs/core/src/session/inject.rs \
            codex-rs/core/src/session/thread_settings.rs \
            codex-rs/core/src/session/turn.rs \
            codex-rs/core/src/session/turn_input.rs \
            codex-rs/core/src/session/turn_suspension.rs \
            codex-rs/core/src/state/mod.rs \
            codex-rs/core/src/tasks/lifecycle.rs \
            codex-rs/core/src/tasks/mod_tests.rs \
            codex-rs/ext/extension-api/src/contributors.rs \
            codex-rs/ext/extension-api/src/contributors/turn_lifecycle.rs \
            codex-rs/ext/extension-api/src/lib.rs \
            codex-rs/ext/extension-api/tests/registry.rs \
            codex-rs/ext/hepta-memory/src/lib.rs \
            codex-rs/ext/hepta-memory/src/local_lifecycle.rs \
            codex-rs/ext/hepta-memory/src/local_turn_writer.rs \
            codex-rs/hepta-agent-protocol/src/lib.rs \
            codex-rs/hepta-agentd/src/config.rs \
            codex-rs/hepta-contracts/src/checked_provider_operation.rs \
            codex-rs/hepta-contracts/src/runtime_authority.rs \
            codex-rs/hepta-contracts/src/runtime_instance.rs \
            codex-rs/hepta-contracts/src/runtime_profile_binding.rs \
            codex-rs/hepta-contracts/src/runtime_profile_binding_tests.rs \
            codex-rs/hepta-evidence/src/store.rs \
            codex-rs/hepta-fleet/src/runtime_launch.rs \
            codex-rs/hepta-fleet/src/runtime_launch_tests.rs \
            codex-rs/hepta-fleet/src/runtime_release_lookup_tests.rs \
            codex-rs/hepta-supervisor/src/daemon_protocol.rs \
            codex-rs/hepta-supervisor/src/main.rs
          rm .github/workflows/hepta-p0-7a-scope-repair.yml
          git diff --check HEAD

      - name: Assert repair is limited to the enumerated restore set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/hepta-p0-7a-scope-repair.yml',
              'codex-rs/core/src/agent/control/execution.rs',
              'codex-rs/core/src/guardian/review.rs',
              'codex-rs/core/src/session/handlers.rs',
              'codex-rs/core/src/session/inject.rs',
              'codex-rs/core/src/session/thread_settings.rs',
              'codex-rs/core/src/session/turn.rs',
              'codex-rs/core/src/session/turn_input.rs',
              'codex-rs/core/src/session/turn_suspension.rs',
              'codex-rs/core/src/state/mod.rs',
              'codex-rs/core/src/tasks/lifecycle.rs',
              'codex-rs/core/src/tasks/mod_tests.rs',
              'codex-rs/ext/extension-api/src/contributors.rs',
              'codex-rs/ext/extension-api/src/contributors/turn_lifecycle.rs',
              'codex-rs/ext/extension-api/src/lib.rs',
              'codex-rs/ext/extension-api/tests/registry.rs',
              'codex-rs/ext/hepta-memory/src/lib.rs',
              'codex-rs/ext/hepta-memory/src/local_lifecycle.rs',
              'codex-rs/ext/hepta-memory/src/local_turn_writer.rs',
              'codex-rs/hepta-agent-protocol/src/lib.rs',
              'codex-rs/hepta-agentd/src/config.rs',
              'codex-rs/hepta-contracts/src/checked_provider_operation.rs',
              'codex-rs/hepta-contracts/src/runtime_authority.rs',
              'codex-rs/hepta-contracts/src/runtime_instance.rs',
              'codex-rs/hepta-contracts/src/runtime_profile_binding.rs',
              'codex-rs/hepta-contracts/src/runtime_profile_binding_tests.rs',
              'codex-rs/hepta-evidence/src/store.rs',
              'codex-rs/hepta-fleet/src/runtime_launch.rs',
              'codex-rs/hepta-fleet/src/runtime_launch_tests.rs',
              'codex-rs/hepta-fleet/src/runtime_release_lookup_tests.rs',
              'codex-rs/hepta-supervisor/src/daemon_protocol.rs',
              'codex-rs/hepta-supervisor/src/main.rs',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          unexpected = actual - expected
          missing = expected - actual
          if unexpected or missing:
              raise SystemExit(f'scope mismatch: unexpected={sorted(unexpected)} missing={sorted(missing)}')
          PY

      - name: Commit repaired package scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(hepta): restore P0.7a package scope'
          git push origin HEAD:codex/hepta-architecture-v4-p0-7a-closure-20260830
