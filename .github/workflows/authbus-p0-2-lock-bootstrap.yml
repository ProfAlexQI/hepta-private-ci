name: AuthBus P0.2 one-shot deterministic lock and rustfmt bootstrap

on:
  push:
    branches:
      - integration/vnext-main-full-ci-authbus-p0-2-20260828
    paths:
      - .github/workflows/authbus-p0-2-lock-bootstrap.yml

permissions:
  contents: write

env:
  MANIFEST: codex-rs/hepta-authbus-qualification/Cargo.toml
  PACKAGE: codex-hepta-authbus-qualification
  CRATE_ROOT: codex-rs/hepta-authbus-qualification
  EXPECTED_PARENT: 3180691daae7cadaace29a4f83855311b5cf60dc

jobs:
  bootstrap:
    name: Commit Rust 1.95 lock and package rustfmt only
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout exact bootstrap commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Verify one-shot branch and ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "integration/vnext-main-full-ci-authbus-p0-2-20260828"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"

      - name: Verify source and negative authority contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-authbus-p0-2.py | tee authbus-p0-2-bootstrap-source.json
          grep -q 'PASS_AUTHBUS_P0_2_SOURCE_ONLY' authbus-p0-2-bootstrap-source.json

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Generate deterministic outputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc -V | awk '{print $2}')" = "1.95.0"
          cargo generate-lockfile --manifest-path "${MANIFEST}"
          cargo fmt --manifest-path "${MANIFEST}" --package "${PACKAGE}"
          test -s "${CRATE_ROOT}/Cargo.lock"
          git diff --check

      - name: Commit exact deterministic outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${CRATE_ROOT}/Cargo.lock"
          git add \
            "${CRATE_ROOT}/src/lib.rs" \
            "${CRATE_ROOT}/src/model.rs" \
            "${CRATE_ROOT}/src/store.rs" \
            "${CRATE_ROOT}/tests/sqlite_wal.rs"

          allowed='^(codex-rs/hepta-authbus-qualification/Cargo.lock|codex-rs/hepta-authbus-qualification/src/lib.rs|codex-rs/hepta-authbus-qualification/src/model.rs|codex-rs/hepta-authbus-qualification/src/store.rs|codex-rs/hepta-authbus-qualification/tests/sqlite_wal.rs)$'
          changed="$(git diff --cached --name-only)"
          test -n "${changed}"
          while IFS= read -r path; do
            test -n "${path}"
            echo "${path}" | grep -Eq "${allowed}"
          done <<<"${changed}"

          git diff --cached --check
          printf '%s\n' "${changed}" | tee bootstrap-files.txt
          git commit -m "chore(authbus): pin P0.2 Rust 1.95 lock and rustfmt"
          git push origin "HEAD:${GITHUB_REF_NAME}" \
            --force-with-lease="refs/heads/${GITHUB_REF_NAME}:${GITHUB_SHA}"
