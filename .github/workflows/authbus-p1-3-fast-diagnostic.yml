name: AuthBus P1.3 fast compile diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - codex/authbus-p1-3-fast-diagnostic-20260829
    paths:
      - .github/workflows/authbus-p1-3-fast-diagnostic.yml
      - scripts/authbus-p1-3-gap-closure.py

permissions:
  contents: read

env:
  P02_MANIFEST: codex-rs/hepta-authbus-qualification/Cargo.toml
  P03_MANIFEST: codex-rs/hepta-authbus-p0-3-qualification/Cargo.toml
  P13_MANIFEST: codex-rs/hepta-authbus-p1-3-qualification/Cargo.toml
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TARGET_DIR: /tmp/authbus-p1-3-fast-target

jobs:
  compile:
    name: Materialize and expose next compiler gap
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic seed
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Materialize and repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/authbus-p1-3-finalize.py
          scheduler=codex-rs/hepta-authbus-p0-3-qualification/src/scheduler.rs
          sed -i 's/request_sha256\.to_string()/request_sha256.as_str().to_owned()/' "${scheduler}"
          python3 scripts/authbus-p1-3-semantic-completion.py
          python3 scripts/authbus-p1-3-gap-closure.py
          python3 scripts/verify-authbus-p1-3.py
          git diff --check

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Generate lock and format
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path "${P13_MANIFEST}"
          cargo fmt --manifest-path "${P02_MANIFEST}" --all
          cargo fmt --manifest-path "${P03_MANIFEST}" --all
          cargo fmt --manifest-path "${P13_MANIFEST}" --all

      - name: Compile P0.2, P0.3, and P1.3
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path "${P02_MANIFEST}" --locked \
            --features sqlite-qualification --all-targets
          cargo check --manifest-path "${P03_MANIFEST}" --locked \
            --features p0-3-qualification --all-targets
          cargo check --manifest-path "${P13_MANIFEST}" --locked \
            --features p1-3-qualification --all-targets
