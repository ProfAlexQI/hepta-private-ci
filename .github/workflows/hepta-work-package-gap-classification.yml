name: Hepta V8 work-package gap classification

on:
  push:
    branches:
      - "codex/hepta-v8-gap-closure-20260905"
    paths:
      - "scripts/hepta-work-package-gap-classifier.py"
      - ".github/workflows/hepta-work-package-gap-classification.yml"

permissions:
  contents: write

concurrency:
  group: hepta-v8-work-package-classification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    if: ${{ !contains(github.event.head_commit.message, '[gap-classified]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate and verify classification
        run: |
          python3 scripts/hepta-work-package-gap-classifier.py normalize
          python3 scripts/hepta-work-package-gap-classifier.py verify
          git diff --check

      - name: Commit classification only
        run: |
          git add qualification/gap-closure/WORK_PACKAGE_GAPS.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "hepta-ci-bot"
          git config user.email "hepta-ci-bot@users.noreply.github.com"
          git commit -m "docs(hepta): classify remaining V8 work-package gaps [gap-classified]"
          git diff --exit-code
          git push origin "HEAD:${GITHUB_REF_NAME}"
