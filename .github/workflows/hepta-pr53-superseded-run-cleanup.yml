name: Hepta PR53 superseded-run cleanup

on:
  push:
    branches:
      - codex/hepta-architecture-convergence-p0-2-20260828
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: hepta-pr53-superseded-run-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    name: Cancel superseded runs for this branch only
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      CURRENT_SHA: ${{ github.sha }}
      CURRENT_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Cancel only older branch identities
        shell: python
        run: |
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH"]
          current_sha = os.environ["CURRENT_SHA"]
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "hepta-pr53-superseded-run-cleanup",
          }
          active = {"queued", "in_progress", "waiting", "pending", "requested"}
          cancelled = []
          preserved = []

          for page in range(1, 21):
              query = urllib.parse.urlencode({
                  "branch": branch,
                  "per_page": 100,
                  "page": page,
              })
              url = f"https://api.github.com/repos/{repository}/actions/runs?{query}"
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              runs = payload.get("workflow_runs", [])
              if not runs:
                  break
              for run in runs:
                  run_id = int(run["id"])
                  status = run.get("status")
                  head_sha = run.get("head_sha")
                  if run_id == current_run_id or head_sha == current_sha or status not in active:
                      preserved.append((run_id, head_sha, status))
                      continue
                  cancel = urllib.request.Request(
                      f"https://api.github.com/repos/{repository}/actions/runs/{run_id}/cancel",
                      data=b"",
                      headers=headers,
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(cancel, timeout=30) as response:
                          if response.status != 202:
                              raise RuntimeError(f"unexpected cancel status {response.status}")
                      cancelled.append(run_id)
                  except urllib.error.HTTPError as error:
                      if error.code not in {409, 422}:
                          raise
              if len(runs) < 100:
                  break

          print(f"current_sha={current_sha}")
          print(f"cancelled_superseded={len(cancelled)}")
          print(f"preserved_current_or_terminal={len(preserved)}")
          print("source_mutation=false")
          print("production_authority=false")
