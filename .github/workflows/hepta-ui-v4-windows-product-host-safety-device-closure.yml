name: hepta-ui-v4-windows-product-host-safety-device-closure

on:
  push:
    branches:
      - "codex/ui-v4-windows-product-host-safety-device-closure-*"
  pull_request:
    paths:
      - "apps/hepta-native/src/shared/hepta_windows_product_host_qualification_host.rs"
      - "tools/hepta-ui-windows-product-host-safety/**"
      - "tools/hepta-ui-windows-product-host-device-drill/**"
      - "scripts/hepta-ui-v4-windows-product-host-safety-device-gate"
      - "docs/ui/HEPTA_WINDOWS_PRODUCT_HOST_SAFETY_DEVICE_CLOSURE_V1.json"
      - "docs/ui/HEPTA_UI_V4_TRANCHE_24_PRODUCT_HOST_SAFETY_DEVICE_CLOSURE_2026-08-28.md"
      - ".github/workflows/hepta-ui-v4-windows-product-host-safety-device-closure.yml"
  workflow_dispatch:
    inputs:
      review_envelope_artifact_id:
        description: "Artifact ID containing PASS_WINDOWS_PRODUCT_HOST_INTEGRATION_REVIEW_ENVELOPE"
        required: true
        type: string
      implementation_review_approved:
        description: "Explicit implementation-review approval for the isolated device drill"
        required: true
        default: false
        type: boolean
      operator_accepted:
        description: "Explicit operator acceptance for the isolated physical-device drill"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: hepta-ui-v4-product-host-safety-device-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HEPTA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  HEPTA_FEATURE_NAME: hepta_ui_windows_system_material_v4

jobs:
  source-contract:
    name: Product-host safety and device producer source contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout and source contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_CANDIDATE_SHA"
          ruby -c scripts/hepta-ui-v4-windows-product-host-safety-device-gate
          ruby -rjson -e 'ARGV.each { |path| JSON.parse(File.read(path)) }' \
            docs/ui/HEPTA_WINDOWS_PRODUCT_HOST_SAFETY_DEVICE_CLOSURE_V1.json \
            docs/ui/schemas/hepta.ui.v4.windows-product-host-device-drill.v1.schema.json
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/hepta-ui-v4-windows-product-host-safety-device-closure.yml")'
          mkdir -p artifacts/source
          ruby scripts/hepta-ui-v4-windows-product-host-safety-device-gate \
            | tee artifacts/source/source-gate.json
          ruby -rjson -e '
            receipt=JSON.parse(File.read("artifacts/source/source-gate.json"))
            abort "source gate" unless receipt.fetch("status") == "PASS_WINDOWS_PRODUCT_HOST_SAFETY_DEVICE_SOURCE_ONLY"
            abort "authority escaped" unless %w[production_authority effect_authority live_adapter_authority promotion release].all? { |key| receipt.fetch(key) == false }
          '
          printf '%s\n' "$HEPTA_CANDIDATE_SHA" > artifacts/source/candidate-commit.txt
          git rev-parse 'HEAD^{tree}' > artifacts/source/candidate-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-ui-v4-product-host-safety-source-${{ env.HEPTA_CANDIDATE_SHA }}
          path: artifacts/source
          if-no-files-found: warn
          retention-days: 14

  compile-contract:
    name: Product-host safety ${{ matrix.mode }} (${{ matrix.os }})
    needs: source-contract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, mode: default-off, cargo_args: "--no-default-features"}
          - {os: ubuntu-latest, mode: explicit-feature, cargo_args: "--no-default-features --features hepta_ui_windows_system_material_v4"}
          - {os: windows-latest, mode: default-off, cargo_args: "--no-default-features"}
          - {os: windows-latest, mode: explicit-feature, cargo_args: "--no-default-features --features hepta_ui_windows_system_material_v4"}
          - {os: macos-latest, mode: default-off, cargo_args: "--no-default-features"}
          - {os: macos-latest, mode: explicit-feature, cargo_args: "--no-default-features --features hepta_ui_windows_system_material_v4"}
    env:
      HEPTA_CARGO_ARGS: ${{ matrix.cargo_args }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Compile and test fail-closed safety host
        shell: bash
        run: |
          set -euo pipefail
          read -r -a cargo_args <<< "$HEPTA_CARGO_ARGS"
          manifest=tools/hepta-ui-windows-product-host-safety/Cargo.toml
          cargo fmt --manifest-path "$manifest" -- --check
          cargo check --manifest-path "$manifest" --all-targets "${cargo_args[@]}"
          cargo test --manifest-path "$manifest" "${cargo_args[@]}" -- --nocapture
      - name: Compile governed device producer surface
        shell: bash
        run: |
          set -euo pipefail
          read -r -a cargo_args <<< "$HEPTA_CARGO_ARGS"
          manifest=tools/hepta-ui-windows-product-host-device-drill/Cargo.toml
          cargo fmt --manifest-path "$manifest" -- --check
          cargo check --manifest-path "$manifest" --all-targets "${cargo_args[@]}"
      - name: Write compile evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/compile
          printf '{"schema":"hepta.ui.v4.windows-product-host-safety-compile.v1","status":"PASS_OR_FAIL_RECORDED_BY_JOB","candidate":{"commit":"%s","tree":"%s"},"platform":"%s","mode":"%s","productWired":false,"authority":false}\n' \
            "$HEPTA_CANDIDATE_SHA" "$(git rev-parse 'HEAD^{tree}')" "${{ matrix.os }}" "${{ matrix.mode }}" \
            > artifacts/compile/receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-ui-v4-product-host-safety-compile-${{ matrix.mode }}-${{ matrix.os }}-${{ env.HEPTA_CANDIDATE_SHA }}
          path: artifacts/compile/receipt.json
          if-no-files-found: warn
          retention-days: 14

  physical-device-drill:
    name: Governed physical Windows product-host rollback drill
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.implementation_review_approved == true &&
      inputs.operator_accepted == true
    needs: [source-contract, compile-contract]
    runs-on: [self-hosted, Windows, X64, hepta-ui-dwm]
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEW_ARTIFACT_ID: ${{ inputs.review_envelope_artifact_id }}
      HEPTA_IMPLEMENTATION_REVIEW_APPROVED: "true"
      HEPTA_OPERATOR_ACCEPTED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:HEPTA_CANDIDATE_SHA) {
            throw 'exact checkout drift'
          }
          $env:HEPTA_CANDIDATE_COMMIT=$env:HEPTA_CANDIDATE_SHA
          $env:HEPTA_CANDIDATE_TREE=(git rev-parse 'HEAD^{tree}').Trim()
          "HEPTA_CANDIDATE_COMMIT=$env:HEPTA_CANDIDATE_COMMIT" >> $env:GITHUB_ENV
          "HEPTA_CANDIDATE_TREE=$env:HEPTA_CANDIDATE_TREE" >> $env:GITHUB_ENV
      - name: Download and validate exact review envelope
        shell: pwsh
        run: |
          if ($env:REVIEW_ARTIFACT_ID -notmatch '^[1-9][0-9]*$') { throw 'invalid review artifact id' }
          New-Item -ItemType Directory -Force artifacts/review, artifacts/device | Out-Null
          $headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
          }
          $metadata=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:REVIEW_ARTIFACT_ID"
          if ($metadata.expired) { throw 'review artifact expired' }
          if ($metadata.name -notmatch '^[A-Za-z0-9_.-]+$') { throw 'unsafe artifact name' }
          Invoke-WebRequest -Headers $headers -Uri $metadata.archive_download_url -OutFile artifacts/review.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive=[System.IO.Compression.ZipFile]::OpenRead((Resolve-Path artifacts/review.zip))
          try {
            foreach ($entry in $archive.Entries) {
              $name=$entry.FullName.Replace('\','/')
              if ([string]::IsNullOrWhiteSpace($name) -or $name.StartsWith('/') -or $name -match '^[A-Za-z]:' -or $name.Split('/') -contains '..') {
                throw "unsafe archive entry: $name"
              }
            }
          } finally { $archive.Dispose() }
          [System.IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path artifacts/review.zip), (Resolve-Path artifacts/review))
          $matches=Get-ChildItem artifacts/review -Recurse -Filter *.json | Where-Object {
            try { (Get-Content -Raw $_.FullName | ConvertFrom-Json).status -eq 'PASS_WINDOWS_PRODUCT_HOST_INTEGRATION_REVIEW_ENVELOPE' } catch { $false }
          }
          if ($matches.Count -ne 1) { throw "review envelope count=$($matches.Count)" }
          $review=Get-Content -Raw $matches[0].FullName | ConvertFrom-Json
          foreach ($property in $review.authority.PSObject.Properties) { if ($property.Value) { throw "authority $($property.Name) escaped" } }
          if (-not $review.bindingDigest -or $review.bindingDigest -notmatch '^[0-9a-f]{64}$') { throw 'review binding digest invalid' }
          "HEPTA_REVIEW_BINDING_DIGEST=$($review.bindingDigest)" >> $env:GITHUB_ENV
          "HEPTA_REVIEW_CANDIDATE_COMMIT=$($review.candidate.commit)" >> $env:GITHUB_ENV
          "HEPTA_REVIEW_CANDIDATE_TREE=$($review.candidate.tree)" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Run physical DWM qualification and rollback drill
        shell: pwsh
        run: |
          $env:HEPTA_DEVICE_DRILL_RECEIPT_PATH="$PWD/artifacts/device/receipt.json"
          cargo run --manifest-path tools/hepta-ui-windows-product-host-device-drill/Cargo.toml `
            --no-default-features --features hepta_ui_windows_system_material_v4
      - name: Validate physical device PASS receipt
        shell: pwsh
        run: |
          $path='artifacts/device/receipt.json'
          if (-not (Test-Path $path)) { throw 'device receipt missing' }
          $receipt=Get-Content -Raw $path | ConvertFrom-Json
          if ($receipt.status -ne 'PASS_WINDOWS_PRODUCT_HOST_IMPLEMENTATION_DEVICE_DRILL') { throw 'device drill failed' }
          if ($receipt.candidate.commit -ne $env:HEPTA_CANDIDATE_SHA) { throw 'candidate drift' }
          if ($receipt.reviewBindingDigest -ne $env:HEPTA_REVIEW_BINDING_DIGEST) { throw 'review digest drift' }
          if (-not $receipt.checks.physicalDeviceValidated -or -not $receipt.checks.rollbackDrillValidated -or $receipt.checks.finalState -ne 'Unbound') { throw 'device checks incomplete' }
          foreach ($property in $receipt.authority.PSObject.Properties) { if ($property.Value) { throw "authority $($property.Name) escaped" } }
          foreach ($key in @('productCargoFeatureDeclared','productModuleRegistered','productLifecycleWired','automaticBindingAllowed','implementationApproved','productHostMayBind','productBound','transientSystemMaterialBound','completeProfileBound','systemMaterialBound','nativeProductRuntime','deviceValidation')) {
            if ($receipt.qualification.$key) { throw "$key escaped" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-ui-v4-product-host-device-drill-${{ env.HEPTA_CANDIDATE_SHA }}
          path: artifacts/device/receipt.json
          if-no-files-found: error
          retention-days: 14
