name: hepta-servo independent source contract v3

on:
  workflow_call:
  pull_request:
    paths:
      - "scripts/hepta-servo-independent-source.py"
      - "scripts/hepta-servo-independent-source-v2.py"
      - "scripts/hepta-servo-source-bundle-verify.py"
      - "scripts/hepta-servo-source-bundle-verify-v2.py"
      - "scripts/tests/test_hepta_servo_independent_source.py"
      - "scripts/tests/test_hepta_servo_independent_source_v2.py"
      - "scripts/tests/test_hepta_servo_source_bundle_verify.py"
      - "scripts/tests/test_hepta_servo_source_bundle_verify_v2.py"
      - "docs/hepta-vnext/browser/SOURCE_PIPELINE_CURRENT_V2.json"
      - "docs/hepta-vnext/browser/C1_INDEPENDENT_SOURCE_PIPELINE.md"
      - "docs/hepta-vnext/browser/C1_SOURCE_BUNDLE_OFFLINE_VERIFICATION.md"
      - ".github/workflows/hepta-servo-independent-source-contract-v3.yml"
      - ".github/workflows/hepta-servo-independent-source-qualification-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-v3:
    name: Canonical source v3 and Git-tree ordering (fixtures only)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize source-only posture
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/hepta-servo-source-contract-v3"
          mkdir -p "$evidence_dir"
          {
            echo "hepta_commit=$(git rev-parse HEAD)"
            echo "hepta_tree=$(git rev-parse 'HEAD^{tree}')"
            echo "canonical_generator=scripts/hepta-servo-independent-source-v2.py"
            echo "canonical_verifier=scripts/hepta-servo-source-bundle-verify-v2.py"
            echo "source_fetch_performed=false"
            echo "external_network=false"
            echo "exact_source_accepted=false"
            echo "servo_built=false"
            echo "servo_runtime_qualified=false"
            echo "production_caller=false"
            echo "production_writer=false"
            echo "effect_authority=false"
            echo "operator_acceptance=false"
            echo "promotion=false"
            echo "release_qualified=false"
          } > "$evidence_dir/posture.txt"

      - name: Compile source-only tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/hepta-servo-independent-source.py \
            scripts/hepta-servo-independent-source-v2.py \
            scripts/hepta-servo-source-bundle-verify.py \
            scripts/hepta-servo-source-bundle-verify-v2.py \
            scripts/tests/test_hepta_servo_independent_source.py \
            scripts/tests/test_hepta_servo_independent_source_v2.py \
            scripts/tests/test_hepta_servo_source_bundle_verify.py \
            scripts/tests/test_hepta_servo_source_bundle_verify_v2.py

      - name: Run independent source acquisition fixture suites
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/hepta-servo-source-contract-v3"
          python3 scripts/tests/test_hepta_servo_independent_source.py 2>&1 | tee "$evidence_dir/source-core-tests.log"
          python3 scripts/tests/test_hepta_servo_independent_source_v2.py 2>&1 | tee "$evidence_dir/source-v2-tests.log"
          echo "source_fixture_tests=passed" >> "$evidence_dir/posture.txt"

      - name: Run offline verifier core and Git-order regression suites
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/hepta-servo-source-contract-v3"
          python3 scripts/tests/test_hepta_servo_source_bundle_verify.py 2>&1 | tee "$evidence_dir/verifier-core-tests.log"
          python3 scripts/tests/test_hepta_servo_source_bundle_verify_v2.py 2>&1 | tee "$evidence_dir/verifier-v2-tests.log"
          echo "git_tree_ordering_tests=passed" >> "$evidence_dir/posture.txt"

      - name: Verify canonical source pointer
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/hepta-servo-source-contract-v3"
          python3 - <<'PY' 2>&1 | tee "$evidence_dir/pointer.log"
          import json
          import pathlib

          root = pathlib.Path.cwd()
          pointer = json.loads((root / "docs/hepta-vnext/browser/SOURCE_PIPELINE_CURRENT_V2.json").read_text(encoding="utf-8"))
          assert pointer["canonical_generator"] == "scripts/hepta-servo-independent-source-v2.py"
          assert pointer["canonical_offline_verifier"] == "scripts/hepta-servo-source-bundle-verify-v2.py"
          assert pointer["actual_exact_source_receipt"] is None
          assert pointer["actual_offline_verification_receipt"] is None
          assert pointer["git_tree_ordering"]["required"] is True
          assert all(value is False for value in pointer["authority"].values())
          generator = (root / pointer["canonical_generator"]).read_text(encoding="utf-8")
          verifier = (root / pointer["canonical_offline_verifier"]).read_text(encoding="utf-8")
          assert '"GIT_CONFIG_KEY_0": "tar.umask"' in generator
          assert "git_tree_entry_compare" in verifier
          assert 'ord("/")' in verifier
          assert "cmp_to_key" in verifier
          PY
          echo "canonical_pointer=passed" >> "$evidence_dir/posture.txt"

      - name: Record result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/hepta-servo-source-contract-v3"
          echo "job_status=${{ job.status }}" >> "$evidence_dir/posture.txt"
          {
            echo "### Canonical source-pipeline contract v3"
            echo
            echo "This job uses local Git fixtures only. It does not fetch, build, or run Servo."
            echo
            sed 's/^/- /' "$evidence_dir/posture.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source v3 contract evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-servo-independent-source-contract-v3
          path: ${{ runner.temp }}/hepta-servo-source-contract-v3
          if-no-files-found: error

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
