name: Hepta gap closure fast publish 591a500

on:
  push:
    branches:
      - codex/hepta-gap-closure-delivery-6cd9ff0-20260829
    paths:
      - .github/workflows/hepta-gap-closure-fast-publish-370713b.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-gap-closure-delivery-591a500
  cancel-in-progress: true

env:
  DELIVERY_BRANCH: codex/hepta-gap-closure-delivery-6cd9ff0-20260829
  TARGET_BRANCH: codex/hepta-architecture-convergence-p0-2-20260828
  EXPECTED_TARGET_HEAD: 591a50005bba363dca287078a9326a30f3158b0a
  PAYLOAD_ROOT: delivery/hepta-gap-closure-6cd9ff0
  PATCH_GZ_SHA256: ec47d855c19f3f1c0c4eba35cfdac5a213fe5d63c50d2c5c6a8282fbc358f24a
  PATCH_SHA256: 3141f02aef4abb509649c3eb31d8ae9fb57c3ce22bd7b8d9d1743be374709149

jobs:
  publish:
    name: Publish statically closed exact target
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - name: Checkout exact delivery head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify payload, target CAS, and apply exact source closure
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$DELIVERY_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mapfile -t parts < <(find "$PAYLOAD_ROOT" -maxdepth 1 -type f \
            -name 'gap-closure.patch.gz.b64.part-*' | sort)
          test "${#parts[@]}" -eq 10

          b64="$RUNNER_TEMP/gap-closure.patch.gz.b64"
          gz="$RUNNER_TEMP/gap-closure.patch.gz"
          patch="$RUNNER_TEMP/gap-closure.patch"
          cat "${parts[@]}" | tr -d '\r\n' > "$b64"
          base64 --decode "$b64" > "$gz"
          printf '%s  %s\n' "$PATCH_GZ_SHA256" "$gz" | sha256sum -c -
          gzip --decompress --stdout "$gz" > "$patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$patch" | sha256sum -c -

          git fetch --no-tags origin \
            "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          actual="$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")"
          test "$actual" = "$EXPECTED_TARGET_HEAD"
          git checkout --detach "$EXPECTED_TARGET_HEAD"
          git diff --exit-code
          git diff --cached --exit-code
          git apply --index --3way \
            --exclude=codex-rs/hepta-memory/src/h7_trajectory_store_tests.rs \
            "$patch"

          # The normal closure source already contains the bounded Automation
          # compatibility wrapper, so retire the competing source-mutating lane.
          git rm -f .github/workflows/hepta-architecture-automation-callsite-remediation.yml

          test ! -e .github/workflows/hepta-architecture-product-test-diagnostic.yml
          test ! -e .github/workflows/hepta-architecture-h7-expiry-remediation.yml
          test ! -e .github/workflows/hepta-architecture-automation-callsite-remediation.yml
          grep -q 'run_automation_scheduler_with_context' \
            codex-rs/hepta-agentd/src/automation.rs
          grep -q 'wait_until_after_unix_second' \
            codex-rs/hepta-memory/src/h7_trajectory_store_tests.rs
          grep -q 'prepared_with_ttl(10).await' \
            codex-rs/hepta-memory/src/h7_trajectory_store_tests.rs
          test -z "$(git diff --cached --name-only | grep '^delivery/' || true)"
          git diff --cached --check

      - name: Execute every source-level architecture ratchet
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-hepta-architecture-projections.py --check
          python3 scripts/generate-hepta-data-authority.py --check
          python3 scripts/verify-hepta-data-authority.py
          python3 scripts/verify-hepta-status-model.py
          python3 scripts/verify-hepta-repository-governance.py
          python3 scripts/verify-hepta-memory-runtime-extraction-p0-1.py
          python3 scripts/verify-hepta-authority-callers-p0-1.py
          python3 scripts/verify-hepta-cross-owner-operation-wiring.py
          python3 scripts/verify-hepta-architecture-gap-ledger.py
          python3 scripts/verify-hepta-p0-5-gap-closure.py
          python3 scripts/verify-hepta-architecture-convergence-p0-2.py
          python3 -m compileall -q scripts
          git diff --cached --check
          git diff --exit-code

      - name: Commit after final target CAS
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          actual="$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")"
          test "$actual" = "$EXPECTED_TARGET_HEAD"
          git config user.name 'Hepta gap closure delivery'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git commit -m 'feat(hepta): close remaining architecture source blockers'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Record fail-closed delivery boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "schema=hepta_gap_closure_fast_publish_v3"
            echo "delivery_head=$GITHUB_SHA"
            echo "expected_target_head=$EXPECTED_TARGET_HEAD"
            echo "patch_sha256=$PATCH_SHA256"
            echo "job_status=${{ job.status }}"
            echo "rust_execution_delegated_to_target_required_ci=true"
            echo "operator_acceptance=false"
            echo "promotion=false"
            echo "release=false"
          } >> "$GITHUB_STEP_SUMMARY"
