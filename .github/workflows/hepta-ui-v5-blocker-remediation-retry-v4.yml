name: Hepta UI v5 blocker remediation retry v4

on:
  push:
    branches:
      - codex/ui-v5-plan-and-repo-gap-closure-20260829
    paths:
      - .github/workflows/hepta-ui-v5-blocker-remediation-retry-v4.yml

permissions:
  contents: write

concurrency:
  group: hepta-ui-v5-blocker-remediation-retry-v4
  cancel-in-progress: false

jobs:
  remediate:
    if: >-
      github.repository == 'ProfHepta/hepta-private-ci' &&
      github.ref == 'refs/heads/codex/ui-v5-plan-and-repo-gap-closure-20260829'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BRANCH: codex/ui-v5-plan-and-repo-gap-closure-20260829
      EXPECTED_PARENT: 188aae0c6f3304a1773542d68b3a8e9dcf564a0e
      BOOTSTRAP_PATH: .github/workflows/hepta-ui-v5-blocker-remediation-retry-v4.yml
      UPSTREAM_URL: https://github.com/openai/codex.git
      UPSTREAM_PREVIOUS: 61a44880a85d2fd0d8770908dea5733495e571c8
      UPSTREAM_ROLE: current_r12
      UPSTREAM_FROZEN_REF: refs/remotes/upstream/hepta-intake-20260830-r12
      UPSTREAM_INTAKE_PATH: docs/architecture/HEPTA_UPSTREAM_CODEX_CURRENT_INTAKE_2026-08-30_R12.json
      UPSTREAM_RECORD_PATH: docs/architecture/HEPTA_UPSTREAM_CODEX_R12_SEMANTIC_ABSORPTION_RECORD_2026-08-30.json
    steps:
      - name: Check out exact retry-v4 commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install deterministic remediation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes jq ripgrep ruby
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --no-self-update

      - name: Replay remediation with exact mobile-target contract migration
        shell: bash
        run: |
          set -euo pipefail

          source_workflow=.github/workflows/hepta-ui-v5-blocker-remediation-bootstrap.yml
          generated_script="$RUNNER_TEMP/hepta-ui-v5-remediate-v4.sh"
          test -f "$source_workflow"
          awk '
            /      - name: Build and publish the fail-closed remediation/ { found=1; next }
            found && /        shell: bash/ { next }
            found && /        run: \|/ { in_run=1; next }
            in_run { sub(/^          /, ""); print }
          ' "$source_workflow" > "$generated_script"
          export GENERATED_SCRIPT="$generated_script"

          python3 <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          path = Path(os.environ["GENERATED_SCRIPT"])
          text = path.read_text(encoding="utf-8")

          def replace_exact(old: str, new: str, *, count: int = 1, label: str) -> None:
              global text
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{label}: expected {count} matches, found {actual}")
              text = text.replace(old, new)

          replace_exact(
              '    count=2,\n    label="plain Rust 1.95 workflow installs",\n',
              '    count=3,\n    label="plain Rust 1.95 workflow installs",\n',
              label="plain toolchain prefix count",
          )
          replace_exact(
              '    label="plain Rust 1.95 workflow installs",\n)\nmobile_action = (\n',
              '    label="plain Rust 1.95 workflow installs",\n)\n'
              'baseline_workflow = replace_exact(\n'
              '    baseline_workflow,\n'
              '    "          components: rustfmt, clippy\\n",\n'
              '    "",\n'
              '    label="remove stale backend components input",\n'
              ')\n'
              'mobile_action = (\n',
              label="remove backend action-only input",
          )
          replace_exact(
              '    backend_shell,\n    label="backend Rust 1.95 workflow install",\n',
              '    backend_shell,\n    count=0,\n    label="backend Rust 1.95 workflow install",\n',
              label="backend replacement already consumed",
          )

          full_format_pair = (
              'cargo +1.95.0 fmt --manifest-path codex-rs/Cargo.toml --all -- --check\n'
              'cargo +1.95.0 fmt --manifest-path apps/hepta-native/Cargo.toml --all -- --check\n'
          )
          bounded_format = (
              'rustfmt +1.95.0 --edition 2024 \\\n'
              '  codex-rs/tools/src/plugin_tool_manifest_schema_cutover_preflight.rs \\\n'
              '  codex-rs/thread-store/src/local/read_thread.rs \\\n'
              '  codex-rs/core-plugins/src/manager_tests.rs\n'
          )
          replace_exact(
              full_format_pair,
              bounded_format,
              count=2,
              label="bounded Rust formatting",
          )

          mobile_target_old = (
              '"          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-linux-android"'
          )
          mobile_target_new = (
              '"          rustup target add --toolchain 1.95.0 '
              'aarch64-apple-ios aarch64-apple-ios-sim aarch64-linux-android"'
          )
          mobile_contract_patch = (
              "test \"$(grep -Fc -- '"
              + mobile_target_old
              + "' scripts/hepta-ci-baseline-contract)\" = 1\n"
              + "sed -i 's|"
              + mobile_target_old
              + "|"
              + mobile_target_new
              + "|' scripts/hepta-ci-baseline-contract\n"
              + "test \"$(grep -Fc -- '"
              + mobile_target_old
              + "' scripts/hepta-ci-baseline-contract)\" = 0\n"
              + "test \"$(grep -Fc -- '"
              + mobile_target_new
              + "' scripts/hepta-ci-baseline-contract)\" = 1\n"
          )
          validation_anchor = (
              'ruby -c scripts/hepta-ui-v4-exact-candidate-materialization-gate\n'
              'bash -n scripts/hepta-architecture-budget\n'
              'bash -n scripts/hepta-ci-baseline-contract\n'
              'bash -n scripts/hepta-ci-materialize-upstream-intake\n'
          )
          replace_exact(
              validation_anchor,
              mobile_contract_patch + validation_anchor,
              label="first-stage mobile-target contract migration",
          )

          replace_exact(
              'git rm "$BOOTSTRAP_PATH"\n',
              'git rm "$BOOTSTRAP_PATH" \\\n'
              '  .github/workflows/hepta-ui-v5-blocker-remediation-bootstrap.yml \\\n'
              '  .github/workflows/hepta-ui-v5-blocker-remediation-retry.yml \\\n'
              '  .github/workflows/hepta-ui-v5-blocker-remediation-retry-v2.yml \\\n'
              '  .github/workflows/hepta-ui-v5-blocker-remediation-retry-v3.yml\n',
              label="self-delete remediation helpers",
          )

          path.write_text(text, encoding="utf-8")
          PY

          bash -n "$generated_script"
          bash -x "$generated_script"