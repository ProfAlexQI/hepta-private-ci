name: P0.3.4 strict Clippy autofix diagnostic v2

on:
  push:
    branches:
      - codex/p034-rebuild-v2-20260829
    paths:
      - .github/workflows/p034-clippy-autofix-diagnostic-v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p034-clippy-autofix-diagnostic-v2
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TARGET_BRANCH: codex/hepta-intelligence-legacy-governance-v2-20260829
      EXPECTED_TARGET: 35de548b07d3957679800f694ecf1a6f3e001c36
      P033_HEAD: eddcb59ca43a76ac83b64507983bd908f406ff48
      PAYLOAD_SHA256: f66d0ccfe03fd2dac66786e02077110ca7c5c1d251c445737fe528ca9061e621
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: helper
          persist-credentials: false

      - name: Checkout fenced P0.3.4 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          path: target
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Recover exact v5 payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/p034-rebuild" artifacts/p034-clippy-autofix-v2
          cat helper/ci/p034-rebuild/payload.part* > "${RUNNER_TEMP}/p034-rebuild.b64"
          base64 -d "${RUNNER_TEMP}/p034-rebuild.b64" > "${RUNNER_TEMP}/p034-rebuild.tar.gz"
          echo "${PAYLOAD_SHA256}  ${RUNNER_TEMP}/p034-rebuild.tar.gz" | sha256sum -c -
          tar -C "${RUNNER_TEMP}/p034-rebuild" -xzf "${RUNNER_TEMP}/p034-rebuild.tar.gz"
          python3 helper/ci/p034-rebuild/hotfix.py "${RUNNER_TEMP}/p034-rebuild" \
            | tee artifacts/p034-clippy-autofix-v2/payload-validation.json

      - name: Apply candidate, autofix safe lints, and capture complete staged patch
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/p034-rebuild/diagnose_v2.py" <<'PY'
          from __future__ import annotations

          import importlib.util
          import os
          import subprocess
          import sys
          import traceback
          from pathlib import Path

          payload = Path(os.environ["RUNNER_TEMP"]) / "p034-rebuild"
          target = Path.cwd() / "target"
          artifact = Path.cwd() / "artifacts" / "p034-clippy-autofix-v2"
          artifact.mkdir(parents=True, exist_ok=True)

          spec = importlib.util.spec_from_file_location("p034_apply", payload / "apply.py")
          if spec is None or spec.loader is None:
              raise SystemExit("unable to load reconstructed apply.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          original_run = module.run
          original_git = module.git

          def diagnostic_run(args, *, cwd, capture=False, check=True):
              argv = tuple(args)
              if argv[:2] == ("cargo", "clippy"):
                  fix_args = (
                      "cargo", "clippy", "--fix", "-p", "codex-hepta-memory",
                      "--all-targets", "--allow-dirty", "--allow-staged", "--",
                      "-D", "warnings",
                      "-A", "clippy::too_many_arguments",
                      "-A", "clippy::large_enum_variant",
                      "-A", "clippy::expect_used",
                      "-A", "clippy::assertions_on_constants",
                      "-A", "clippy::redundant_clone",
                  )
                  fixed = original_run(fix_args, cwd=cwd, capture=True, check=False)
                  (artifact / "clippy-autofix.log").write_text(
                      fixed.stdout or "", encoding="utf-8"
                  )
                  strict = original_run(argv, cwd=cwd, capture=True, check=False)
                  (artifact / "clippy-strict-after-autofix.log").write_text(
                      strict.stdout or "", encoding="utf-8"
                  )
                  (artifact / "clippy-return-codes.txt").write_text(
                      f"autofix={fixed.returncode}\nstrict={strict.returncode}\n",
                      encoding="utf-8",
                  )
                  return subprocess.CompletedProcess(list(argv), 0, stdout="")
              return original_run(args, cwd=cwd, capture=capture, check=check)

          def diagnostic_git(root, *args, capture=False, check=True):
              if args and args[0] == "push":
                  print("+ git push [suppressed: diagnostic is non-publishing]", flush=True)
                  return ""
              return original_git(root, *args, capture=capture, check=check)

          module.run = diagnostic_run
          module.git = diagnostic_git
          sys.argv = [str(payload / "apply.py"), str(target)]

          status = "completed"
          try:
              module.main()
          except BaseException:
              status = "failed"
              traceback.print_exc()
          finally:
              (artifact / "diagnostic-status.txt").write_text(status + "\n", encoding="utf-8")
              subprocess.run(
                  ["git", "-C", str(target), "status", "--short"],
                  check=False,
                  text=True,
                  stdout=(artifact / "git-status.txt").open("w", encoding="utf-8"),
              )
              subprocess.run(
                  ["git", "-C", str(target), "add", "-A"],
                  check=False,
              )
              subprocess.run(
                  [
                      "git", "-C", str(target), "diff", "--cached", "--binary",
                      os.environ["P033_HEAD"],
                  ],
                  check=False,
                  text=True,
                  stdout=(artifact / "candidate-after-autofix.patch").open(
                      "w", encoding="utf-8"
                  ),
              )
              subprocess.run(
                  [
                      "git", "-C", str(target), "diff", "--cached", "--name-status",
                      os.environ["P033_HEAD"],
                  ],
                  check=False,
                  text=True,
                  stdout=(artifact / "candidate-files.txt").open("w", encoding="utf-8"),
              )
              subprocess.run(
                  ["git", "-C", str(target), "rev-parse", "HEAD"],
                  check=False,
                  text=True,
                  stdout=(artifact / "candidate-head.txt").open("w", encoding="utf-8"),
              )
          PY
          python3 "${RUNNER_TEMP}/p034-rebuild/diagnose_v2.py"

      - name: Upload complete candidate patch and remaining strict lint log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p034-clippy-autofix-diagnostic-v2-${{ github.sha }}
          path: artifacts/p034-clippy-autofix-v2
          if-no-files-found: error
          retention-days: 14
