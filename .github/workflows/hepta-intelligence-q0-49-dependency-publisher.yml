name: Hepta Intelligence Q0.49 dependency policy publisher

on:
  push:
    branches:
      - automation/hepta-intelligence-q0-49-dependency-publisher-20260830

permissions:
  contents: write

concurrency:
  group: hepta-intelligence-q0-49-dependency-publisher
  cancel-in-progress: false

env:
  SOURCE_SHA: f2f200969fa0076178276bceab2eb21d23f0519e
  SOURCE_TREE: e6d9a631345927a8c0817080a2f8cab150c516f3
  BYTES_VERSION: 1.12.1
  BYTES_CHECKSUM: fc652a48c352aef3ea3aed32080501cf3ef6ed5da78602a020c991775b0aff04

jobs:
  publish-git-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-shear@1.11.2

      - name: Check out the exact Q0.48 source object
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git switch --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git show -s --format=%T HEAD)" = "$SOURCE_TREE"
          test -z "$(git status --porcelain)"

      - name: Bind the current cargo-shear findings to exact manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/q049-artifacts"
          set +e
          cargo shear \
            --manifest-path codex-rs/Cargo.toml \
            --locked \
            --deny-warnings \
            --format=json \
            > "$RUNNER_TEMP/q049-artifacts/shear-before.json"
          shear_rc=$?
          set -e
          cat "$RUNNER_TEMP/q049-artifacts/shear-before.json"
          test "$shear_rc" -eq 1
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path("/tmp")
          artifact = Path(__import__("os").environ["RUNNER_TEMP"]) / "q049-artifacts" / "shear-before.json"
          data = json.loads(artifact.read_text(encoding="utf-8"))
          expected = {
              "hepta-automation/Cargo.toml": "sha2",
              "hepta-contracts/Cargo.toml": "pretty_assertions",
              "hepta-fleet/Cargo.toml": "pretty_assertions",
          }
          observed = {}
          for finding in data.get("findings", []):
              if finding.get("code") != "shear/unused_dependency":
                  raise SystemExit(f"unexpected cargo-shear finding: {finding}")
              message = finding.get("message", "")
              match = re.fullmatch(r"unused dependency `([^`]+)`", message)
              if match is None:
                  raise SystemExit(f"unrecognized cargo-shear message: {message!r}")
              file = finding.get("file")
              if not isinstance(file, str):
                  raise SystemExit(f"cargo-shear finding lacks file: {finding}")
              if file in observed:
                  raise SystemExit(f"duplicate cargo-shear file finding: {file}")
              observed[file] = match.group(1)
          if observed != expected:
              raise SystemExit(
                  f"unexpected cargo-shear finding set: observed={observed!r} expected={expected!r}"
              )

          source_requirements = {
              "codex-rs/hepta-automation/src/lib.rs": ("mod taskflow;",),
              "codex-rs/hepta-automation/src/taskflow.rs": (
                  "sha2::Digest",
                  "sha2::Sha256",
              ),
              "codex-rs/hepta-contracts/src/agent_id.rs": ("agent_id_tests.rs",),
              "codex-rs/hepta-contracts/src/agent_id_tests.rs": ("pretty_assertions",),
              "codex-rs/hepta-fleet/src/registry.rs": ("registry_tests.rs",),
              "codex-rs/hepta-fleet/src/registry_tests.rs": ("pretty_assertions",),
          }
          for file, tokens in source_requirements.items():
              text = Path(file).read_text(encoding="utf-8")
              for token in tokens:
                  if token not in text:
                      raise SystemExit(f"required dependency use token missing: {file}: {token}")
          print("PASS_Q049_BOUND_EXACT_CARGO_SHEAR_FALSE_POSITIVES")
          PY

      - name: Apply the bounded dependency and cargo-shear repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(
                      f"expected one replacement token in {path}: {old!r}; count={text.count(old)}"
                  )
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "codex-rs/Cargo.toml",
              'bytes = "1.10.1"',
              'bytes = "1.12.1"',
          )
          replace_once(
              ".github/workflows/rust-ci.yml",
              "        run: cargo shear --deny-warnings\n",
              "        run: cargo shear --locked --deny-warnings\n",
          )
          replace_once(
              "codex-rs/hepta-automation/Cargo.toml",
              "publish = false\n\n[lib]\n",
              "publish = false\n\n[package.metadata.cargo-shear]\n"
              "# sha2 is used by the unconditionally linked path module src/taskflow.rs.\n"
              'ignored = ["sha2"]\n\n[lib]\n',
          )
          replace_once(
              "codex-rs/hepta-contracts/Cargo.toml",
              "version.workspace = true\n\n[lib]\n",
              "version.workspace = true\n\n[package.metadata.cargo-shear]\n"
              "# The path-mounted agent_id_tests module imports pretty_assertions.\n"
              'ignored = ["pretty_assertions"]\n\n[lib]\n',
          )
          replace_once(
              "codex-rs/hepta-fleet/Cargo.toml",
              "publish = false\n\n[lib]\n",
              "publish = false\n\n[package.metadata.cargo-shear]\n"
              "# The path-mounted registry_tests module imports pretty_assertions.\n"
              'ignored = ["pretty_assertions"]\n\n[lib]\n',
          )
          PY

          cargo update \
            --manifest-path codex-rs/Cargo.toml \
            -p bytes \
            --precise "$BYTES_VERSION"

      - name: Validate the exact lock and source delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          source = os.environ["SOURCE_SHA"]
          expected_paths = [
              ".github/workflows/rust-ci.yml",
              "codex-rs/Cargo.lock",
              "codex-rs/Cargo.toml",
              "codex-rs/hepta-automation/Cargo.toml",
              "codex-rs/hepta-contracts/Cargo.toml",
              "codex-rs/hepta-fleet/Cargo.toml",
          ]
          observed_paths = subprocess.check_output(
              ["git", "diff", "--name-only", source, "--"],
              text=True,
          ).splitlines()
          if observed_paths != expected_paths:
              raise SystemExit(
                  f"unexpected Q0.49 changed paths: {observed_paths!r} != {expected_paths!r}"
              )

          workspace = Path("codex-rs/Cargo.toml").read_text(encoding="utf-8")
          if workspace.count('bytes = "1.12.1"') != 1:
              raise SystemExit("workspace bytes dependency is not exactly 1.12.1")

          lock = Path("codex-rs/Cargo.lock").read_text(encoding="utf-8")
          blocks = re.findall(
              r'\[\[package\]\]\nname = "bytes"\nversion = "([^"]+)"\n'
              r'source = "registry\+https://github.com/rust-lang/crates.io-index"\n'
              r'checksum = "([0-9a-f]{64})"',
              lock,
          )
          expected = [(
              os.environ["BYTES_VERSION"],
              os.environ["BYTES_CHECKSUM"],
          )]
          if blocks != expected:
              raise SystemExit(f"unexpected bytes lock block: {blocks!r} != {expected!r}")

          diff = subprocess.check_output(
              ["git", "diff", "--unified=0", source, "--", "codex-rs/Cargo.lock"],
              text=True,
          )
          removed = [line for line in diff.splitlines() if line.startswith("-") and not line.startswith("---")]
          added = [line for line in diff.splitlines() if line.startswith("+") and not line.startswith("+++")]
          if len(removed) != 2 or len(added) != 2:
              raise SystemExit(
                  f"Cargo.lock delta must be exactly version+checksum: removed={removed!r} added={added!r}"
              )
          print("PASS_Q049_EXACT_BYTES_LOCK_DELTA")
          PY

          git diff --check "$SOURCE_SHA" --
          cargo metadata \
            --manifest-path codex-rs/Cargo.toml \
            --locked \
            --no-deps \
            > "$RUNNER_TEMP/q049-artifacts/cargo-metadata.json"
          cargo shear \
            --manifest-path codex-rs/Cargo.toml \
            --locked \
            --deny-warnings \
            --format=json \
            > "$RUNNER_TEMP/q049-artifacts/shear-after.json"
          cat "$RUNNER_TEMP/q049-artifacts/shear-after.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "q049-artifacts" / "shear-after.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          summary = data.get("summary", {})
          if data.get("findings") != []:
              raise SystemExit(f"cargo-shear findings remain: {data['findings']!r}")
          if summary.get("errors") != 0 or summary.get("warnings") != 0:
              raise SystemExit(f"cargo-shear summary not clean: {summary!r}")
          print("PASS_Q049_CARGO_SHEAR_LOCKED_CLEAN")
          PY

          cargo check \
            --manifest-path codex-rs/Cargo.toml \
            --locked \
            --all-targets \
            -p codex-hepta-automation \
            -p codex-hepta-contracts \
            -p codex-hepta-fleet

          git status --short

      - name: Create immutable Q0.49 Git objects without moving a ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          source = os.environ["SOURCE_SHA"]
          source_tree = os.environ["SOURCE_TREE"]
          changed_paths = [
              ".github/workflows/rust-ci.yml",
              "codex-rs/Cargo.lock",
              "codex-rs/Cargo.toml",
              "codex-rs/hepta-automation/Cargo.toml",
              "codex-rs/hepta-contracts/Cargo.toml",
              "codex-rs/hepta-fleet/Cargo.toml",
          ]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def post(path: str, payload: dict) -> dict:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{path}",
                  data=json.dumps(payload, separators=(",", ":")).encode(),
                  headers=headers,
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          blobs = {}
          tree_entries = []
          for path in changed_paths:
              content = Path(path).read_bytes()
              result = post(
                  "git/blobs",
                  {
                      "content": base64.b64encode(content).decode("ascii"),
                      "encoding": "base64",
                  },
              )
              sha = result["sha"]
              blobs[path] = sha
              tree_entries.append(
                  {"path": path, "mode": "100644", "type": "blob", "sha": sha}
              )
              print(f"Q049_BLOB {path} {sha}")

          tree = post(
              "git/trees",
              {"base_tree": source_tree, "tree": tree_entries},
          )
          commit = post(
              "git/commits",
              {
                  "message": (
                      "fix(rust): close Q0.49 dependency security and cargo-shear blockers\n\n"
                      "Upgrade bytes to the fixed 1.12.1 release, bind the lockfile to its "
                      "registry checksum, run cargo-shear with --locked, and record only the "
                      "three runner-observed static-analysis false positives whose source uses "
                      "are independently checked. Repository admission only; no runtime or "
                      "authority change."
                  ),
                  "tree": tree["sha"],
                  "parents": [source],
              },
          )
          receipt = {
              "schema": "hepta_intelligence_q0_49_git_objects_v1",
              "repository": repository,
              "source_sha": source,
              "source_tree": source_tree,
              "tree_sha": tree["sha"],
              "commit_sha": commit["sha"],
              "changed_paths": changed_paths,
              "blobs": blobs,
              "bytes_version": os.environ["BYTES_VERSION"],
              "bytes_checksum": os.environ["BYTES_CHECKSUM"],
              "cargo_shear_locked": True,
              "source_writeback": False,
              "runtime_authority": False,
              "production_authority": False,
              "operator_acceptance": False,
              "promotion": False,
              "release_authority": False,
              "callers_ratchet": False,
          }
          artifact_dir = Path(os.environ["RUNNER_TEMP"]) / "q049-artifacts"
          receipt_path = artifact_dir / "q049-git-objects.json"
          receipt_path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"Q049_TREE_SHA={tree['sha']}")
          print(f"Q049_COMMIT_SHA={commit['sha']}")
          print(receipt_path.read_text(encoding="utf-8"))
          PY

      - name: Stage publisher evidence
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p q049-artifacts
          if test -d "$RUNNER_TEMP/q049-artifacts"; then
            cp -R "$RUNNER_TEMP/q049-artifacts/." q049-artifacts/
          fi
          git diff --binary "$SOURCE_SHA" -- > q049-artifacts/q049.patch || true

      - name: Upload publisher evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-intelligence-q0-49-dependency-publisher-${{ github.sha }}
          path: q049-artifacts
          if-no-files-found: error
          retention-days: 30
