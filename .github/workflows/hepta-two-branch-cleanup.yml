name: Hepta safe two-branch consolidation

on:
  push:
    branches:
      - integration/vnext-main-20260811
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: hepta-safe-two-branch-consolidation
  cancel-in-progress: false

env:
  REPOSITORY_FULL_NAME: TrillionniumFoundation/hepta-private-ci
  CURRENT_DEFAULT: integration/vnext-main-20260811
  FUTURE_DEFAULT: main
  SELF_PATH: .github/workflows/hepta-two-branch-cleanup.yml

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact mirrored tip
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind both retained refs and authenticated Git
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name "Hepta Repository Consolidation"
          git config user.email "hepta-repository-consolidation@users.noreply.github.com"
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse refs/remotes/origin/$CURRENT_DEFAULT)" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/$FUTURE_DEFAULT)" = "$GITHUB_SHA"

      - name: Preflight truthful DOC-REGISTRY-CLOSED-WORLD state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path('.')
          current_default = 'integration/vnext-main-20260811'

          current_path = root / 'docs/CURRENT.json'
          current = json.loads(current_path.read_text(encoding='utf-8'))
          current['repository']['defaultBranch'] = current_default
          current['candidate'].update(
              {
                  'pullRequest': 286,
                  'targetBranch': 'main',
                  'sourceHead': 'resolved_by_exact_main_default_mirror_receipt',
                  'sourceTree': 'resolved_by_exact_main_default_mirror_receipt',
                  'mergeCandidate': 'not_applicable_after_ancestry_consolidation',
                  'relationship': 'main_and_current_default_same_tip_pending_repository_admin_switch',
              }
          )
          current['currentWorkPackage'] = 'DOC-2-DEFAULT-BRANCH-SELECTION'
          supersedes = current.setdefault('supersedes', [])
          marker = 'pre-consolidation multi-branch repository ref surface'
          if marker not in supersedes:
              supersedes.append(marker)
          current_path.write_text(json.dumps(current, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          packages_path = root / 'docs/delivery/WORK_PACKAGES.json'
          packages = json.loads(packages_path.read_text(encoding='utf-8'))
          packages['currentPackage'] = 'DOC-2-DEFAULT-BRANCH-SELECTION'
          states = {
              'DOC-0-CANONICAL-DOCUMENT-CONSOLIDATION': 'source_implemented',
              'DOC-1-V8-SEMANTIC-UPGRADE': 'source_implemented',
              'DOC-2-DEFAULT-BRANCH-SELECTION': 'blocked_external',
              'DOC-REGISTRY-CLOSED-WORLD': 'source_implemented',
          }
          for package in packages['packages']:
              if package['id'] in states:
                  package['state'] = states[package['id']]
          packages_path.write_text(json.dumps(packages, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          development_path = root / 'docs/DEVELOPMENT.md'
          development = development_path.read_text(encoding='utf-8')
          development = re.sub(
              r"\*\*Status:\*\*[^\n]*",
              "**Status:** canonical V8 content is mirrored on `main`; GitHub still names `integration/vnext-main-20260811` as the default branch, so default-branch selection remains an external repository-administration gate.",
              development,
              count=1,
          )
          cleanup_start = development.index('The exact default baseline contains a 138-file Dropbox development snapshot')
          cleanup_end = development.index('\n\n`python3 scripts/hepta-docs.py verify`', cleanup_start)
          cleanup = (
              'The pre-selection baseline contained 143 historical development paths. V8 deleted that complete set in '
              'the same commit that installed the canonical document system. Git ancestry now preserves every '
              'pre-consolidation branch tip without overlaying an obsolete branch tree or reintroducing an in-tree '
              'historical plan. Code-consumed APIs, schemas, policies, migrations, tests and implementation contracts '
              'remain protected.'
          )
          development = development[:cleanup_start] + cleanup + development[cleanup_end:]

          section_start = development.index('## 3. Current truthful baseline')
          section_end = development.index('## 4. Immutable execution, authority and data invariants', section_start)
          section = (
              '## 3. Current truthful baseline\n\n'
              'The selected V8 content is present on both `main` and `integration/vnext-main-20260811` at the same '
              'exact tip. Every pre-consolidation branch tip is reachable from that line as Git ancestry; obsolete '
              'branch trees were not overlaid. All outstanding pull requests were closed as superseded, and every '
              'other branch ref is removed by the bounded consolidation operation.\n\n'
              'GitHub still reports `integration/vnext-main-20260811` as the repository default because the Actions '
              'integration is not permitted to mutate repository administration settings. Therefore '
              '`DOC-2-DEFAULT-BRANCH-SELECTION` remains `blocked_external`. The final administrative transition is: '
              'select the existing `main` ref as default, then delete the old default ref. Until that observable state '
              'exists, canonical registries must not claim that `main` is already the GitHub default branch.\n\n'
              'Exact live head, tree, CI, review and operator facts remain dynamic evidence and must be resolved from '
              'current external receipts. This consolidation grants no runtime, model, provider, tool, network, '
              'filesystem, secret, Matrix, fleet, operator, promotion or release authority.\n\n'
          )
          development = development[:section_start] + section + development[section_end:]
          development_path.write_text(development, encoding='utf-8')
          PY

          python3 scripts/hepta-docs.py generate-status
          python3 scripts/hepta-docs.py self-test
          python3 scripts/hepta-docs.py inventory-legacy
          python3 scripts/hepta-docs.py verify
          git diff --check
          git diff --binary -- docs > /tmp/doc-registry-blocked.patch
          test -s /tmp/doc-registry-blocked.patch
          git reset --hard HEAD
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Confirm and close any late pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['REPOSITORY_FULL_NAME']
          token = os.environ['GH_TOKEN']
          base = f'https://api.github.com/repos/{repository}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'hepta-two-branch-consolidation',
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=60) as response:
                  body = response.read()
                  return None if not body else json.loads(body)

          closed = 0
          while True:
              pulls = request('GET', '/pulls?state=open&per_page=100&page=1')
              if not pulls:
                  break
              for pull in pulls:
                  request('PATCH', f"/pulls/{pull['number']}", {'state': 'closed'})
                  closed += 1
          print(json.dumps({'latePullRequestsClosed': closed}, sort_keys=True))
          PY

      - name: Delete every branch except main and the current GitHub default
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git for-each-ref --format='%(refname:strip=3)%09%(objectname)' refs/remotes/origin \
            | awk -F '\t' -v old="$CURRENT_DEFAULT" -v new="$FUTURE_DEFAULT" \
                '$1 != "HEAD" && $1 != old && $1 != new' \
            | sort > /tmp/delete-branches.tsv

          main_sha="$(git rev-parse refs/remotes/origin/$FUTURE_DEFAULT)"
          while IFS=$'\t' read -r branch sha; do
            git merge-base --is-ancestor "$sha" "$main_sha"
          done < /tmp/delete-branches.tsv

          mapfile -t rows < /tmp/delete-branches.tsv
          failures=()
          batch_size=24
          for ((offset=0; offset<${#rows[@]}; offset+=batch_size)); do
            args=(git push --atomic origin)
            upper=$((offset + batch_size))
            if (( upper > ${#rows[@]} )); then upper=${#rows[@]}; fi
            for ((index=offset; index<upper; index++)); do
              row="${rows[$index]}"
              branch="${row%%$'\t'*}"
              sha="${row#*$'\t'}"
              args+=("--force-with-lease=refs/heads/${branch}:${sha}" ":refs/heads/${branch}")
            done
            if ! "${args[@]}"; then
              for ((index=offset; index<upper; index++)); do
                row="${rows[$index]}"
                branch="${row%%$'\t'*}"
                sha="${row#*$'\t'}"
                if ! git push --force-with-lease="refs/heads/${branch}:${sha}" origin ":refs/heads/${branch}"; then
                  failures+=("$branch")
                fi
              done
            fi
          done

          if (( ${#failures[@]} > 0 )); then
            printf '%s\n' "${failures[@]}" | tee /tmp/delete-failures.txt
            exit 1
          fi

          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t remaining < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | awk '$1 != "HEAD"' | sort)
          expected=("$CURRENT_DEFAULT" "$FUTURE_DEFAULT")
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${remaining[*]}" = "${expected_sorted[*]}"
          echo "deletedBranches=${#rows[@]}"

      - name: Commit truthful registry synchronization and remove the temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/doc-registry-blocked.patch
          git rm "$SELF_PATH"
          python3 scripts/hepta-docs.py generate-status
          python3 scripts/hepta-docs.py self-test
          python3 scripts/hepta-docs.py inventory-legacy
          python3 scripts/hepta-docs.py verify
          git diff --check
          git add docs "$SELF_PATH"
          git commit -s \
            -m "docs(repo): synchronize closed-world registry after branch consolidation" \
            -m "All pre-consolidation branch tips are retained as ancestry. Every non-main, non-current-default branch ref is removed. main and the current GitHub default point to the same exact commit. DOC-2 remains blocked only on the repository administration setting required to select main as default. Authority delta: none."
          git push --atomic origin \
            HEAD:refs/heads/$CURRENT_DEFAULT \
            HEAD:refs/heads/$FUTURE_DEFAULT
          git rev-parse HEAD > /tmp/final-head

      - name: Verify exact two-ref blocked state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse refs/remotes/origin/$CURRENT_DEFAULT)" = "$(cat /tmp/final-head)"
          test "$(git rev-parse refs/remotes/origin/$FUTURE_DEFAULT)" = "$(cat /tmp/final-head)"
          test "$(git ls-remote --heads origin | wc -l | tr -d ' ')" = "2"
          python3 scripts/hepta-docs.py verify
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['REPOSITORY_FULL_NAME']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'hepta-two-branch-consolidation',
          }
          req = urllib.request.Request(f'https://api.github.com/repos/{repository}', headers=headers)
          with urllib.request.urlopen(req, timeout=60) as response:
              repo = json.loads(response.read())
          req = urllib.request.Request(f'https://api.github.com/repos/{repository}/pulls?state=open&per_page=1', headers=headers)
          with urllib.request.urlopen(req, timeout=60) as response:
              pulls = json.loads(response.read())
          result = {
              'defaultBranch': repo['default_branch'],
              'mainMirrorsCurrentDefault': True,
              'branchCount': 2,
              'openPullRequests': len(pulls),
              'finalHead': open('/tmp/final-head', encoding='utf-8').read().strip(),
              'remainingExternalGate': 'set main as default then delete old default ref',
          }
          print(json.dumps(result, sort_keys=True))
          if pulls:
              raise SystemExit('open pull requests remain')
          PY
