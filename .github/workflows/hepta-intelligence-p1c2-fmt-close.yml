name: hepta-intelligence-p1c2-semantic-close

on:
  push:
    branches:
      - "qualification/p1c2-fmt-close-v1-20260828"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-intelligence-p1c2-semantic-close
  cancel-in-progress: true

env:
  CARGO_NET_OFFLINE: "true"
  QUALIFICATION_DRIVER_SHA: 6c7d621cbdeca30bd6f9aea1c32db2137beff2e3

jobs:
  qualify:
    name: P1.1c.2 final-label semantic closure preflight
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout qualification trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 8

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt,clippy

      - name: Execute exact fail-closed semantic closure
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          git checkout --detach "$QUALIFICATION_DRIVER_SHA"
          cp scripts/qualification/run-hepta-intelligence-p1c2-fmt-close.sh \
            "$RUNNER_TEMP/run-hepta-intelligence-p1c2-semantic-close.sh"
          bash "$RUNNER_TEMP/run-hepta-intelligence-p1c2-semantic-close.sh"

      - name: Upload semantic closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-intelligence-p1c2-semantic-close-${{ github.sha }}
          path: artifacts/hepta-intelligence-p1-1c2-semantic-closure
          if-no-files-found: warn
          retention-days: 14
