name: hepta-intelligence-p1c2-stack-close

on:
  push:
    branches:
      - "qualification/p1c2-stack-v2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-intelligence-p1c2-stack-close
  cancel-in-progress: true

env:
  CARGO_NET_OFFLINE: "true"
  SOURCE_SHA: c3c42f60e5ca11fd49fe5d4d2013c5b21e183619

jobs:
  qualify:
    name: P1.1c.2 labels, references, and parent-stack closure
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout complete qualification ancestry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact qualification driver ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git cat-file -e "$SOURCE_SHA^{commit}"
          test "$(git merge-base "$SOURCE_SHA" HEAD)" = "$SOURCE_SHA"

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt,clippy

      - name: Execute exact fail-closed stack closure
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          cp scripts/qualification/run-hepta-intelligence-p1c2-fmt-close.sh \
            "$RUNNER_TEMP/run-hepta-intelligence-p1c2-stack-close.sh"
          bash "$RUNNER_TEMP/run-hepta-intelligence-p1c2-stack-close.sh"

      - name: Upload stack closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-intelligence-p1c2-stack-close-${{ github.sha }}
          path: artifacts/hepta-intelligence-p1-1c2-stack-closure
          if-no-files-found: warn
          retention-days: 14