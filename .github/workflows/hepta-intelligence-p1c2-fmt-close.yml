name: hepta-intelligence-p1c2-fmt-close

on:
  push:
    branches:
      - "qualification/p1c2-fmt-close-v1-20260828"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-intelligence-p1c2-fmt-close
  cancel-in-progress: true

env:
  CARGO_NET_OFFLINE: "true"
  QUALIFICATION_DRIVER_SHA: edd6f73cf3339381c7c701f26f6a066ce30e656d

jobs:
  qualify:
    name: P1.1c.2 package-scoped format and Clippy closure preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout qualification trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt,clippy

      - name: Execute exact fail-closed driver
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          git checkout --detach "$QUALIFICATION_DRIVER_SHA"
          cp scripts/qualification/run-hepta-intelligence-p1c2-fmt-close.sh \
            "$RUNNER_TEMP/run-hepta-intelligence-p1c2-fmt-close.sh"
          python3 - "$RUNNER_TEMP/run-hepta-intelligence-p1c2-fmt-close.sh" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          marker = "\nexport CARGO_NET_OFFLINE=true\n"
          if text.count(marker) != 1:
              raise SystemExit("qualification driver export marker is not unique")
          closure = r'''
          python3 - <<'CLIPPY_PATCH'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one strict-gate patch target, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "codex-rs/hepta-memory-p1-1c2-qualification/src/evaluation.rs",
              "P1_1C2_SCHEMA_VERSION, P1_1C2_SOURCE_QUALIFIED, ProjectionAudit, ReviewProjection,\n    framed_digest, p1c1_digest, p1c_digest, validate_commit_oid,",
              "P1_1C2_SCHEMA_VERSION, P1_1C2_SOURCE_QUALIFIED, ReviewProjection, framed_digest,\n    p1c1_digest, p1c_digest, validate_commit_oid,",
          )
          replace_once(
              "codex-rs/hepta-memory-p1-1c2-qualification/src/projection.rs",
              "fn reviews_by_item<'a>(reviews: &'a ReviewBatch) -> BTreeMap<&'a str, Vec<&'a ReviewRecord>> {",
              "fn reviews_by_item(reviews: &ReviewBatch) -> BTreeMap<&str, Vec<&ReviewRecord>> {",
          )
          CLIPPY_PATCH

          export CARGO_NET_OFFLINE=true
          '''
          path.write_text(text.replace(marker, "\n" + closure, 1), encoding="utf-8")
          PY
          bash "$RUNNER_TEMP/run-hepta-intelligence-p1c2-fmt-close.sh"

      - name: Upload format closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-intelligence-p1c2-fmt-close-${{ github.sha }}
          path: artifacts/hepta-intelligence-p1-1c2-fmt-close
          if-no-files-found: warn
          retention-days: 14
