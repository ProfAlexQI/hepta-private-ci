name: hepta-intelligence-p1c2-trust-close

on:
  push:
    branches:
      - "qualification/p1c2-fmt-close-v1-20260828"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-intelligence-p1c2-trust-close-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_NET_OFFLINE: "true"

jobs:
  qualify:
    name: P1.1c.2 object, label, reference and receipt closure
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact trigger binding
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt,clippy

      - name: Execute exact fail-closed trust closure
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: bash scripts/qualification/run-hepta-intelligence-p1c2-fmt-close.sh

      - name: Upload trust-closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-intelligence-p1c2-trust-close-${{ github.sha }}
          path: artifacts/hepta-intelligence-p1-1c2-trust-closure
          if-no-files-found: warn
          retention-days: 14
