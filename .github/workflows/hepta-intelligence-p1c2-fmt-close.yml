name: hepta-intelligence-p1c2-fmt-close

on:
  push:
    branches:
      - "qualification/p1c2-fmt-close-v1-20260828"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-intelligence-p1c2-fmt-close
  cancel-in-progress: true

env:
  CARGO_NET_OFFLINE: "true"

jobs:
  qualify:
    name: P1.1c.2 package-scoped format closure
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout exact qualification driver
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt,clippy

      - name: Execute fail-closed closure
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          cp scripts/qualification/run-hepta-intelligence-p1c2-fmt-close.sh \
            "$RUNNER_TEMP/run-hepta-intelligence-p1c2-fmt-close.sh"
          bash "$RUNNER_TEMP/run-hepta-intelligence-p1c2-fmt-close.sh"

      - name: Upload format closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-intelligence-p1c2-fmt-close-${{ github.sha }}
          path: artifacts/hepta-intelligence-p1-1c2-fmt-close
          if-no-files-found: warn
          retention-days: 14
