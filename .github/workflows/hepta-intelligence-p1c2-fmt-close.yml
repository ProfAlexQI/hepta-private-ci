name: hepta-intelligence-p1c2-reference-close-windows-2022

on:
  push:
    branches:
      - "qualification/p1c2-ref-win22-v1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-intelligence-p1c2-reference-close-windows-2022
  cancel-in-progress: true

env:
  CARGO_NET_OFFLINE: "true"
  QUALIFICATION_DRIVER_SHA: de95f9e6d39c6e57d132fc8ad8368ad89cf54fb4
  SOURCE_SHA: c3c42f60e5ca11fd49fe5d4d2013c5b21e183619
  SOURCE_BRANCH: codex/hepta-p1c2-eval-20260828
  PLAN_CONTRACT_PATH: scripts/qualification/materialize-hepta-intelligence-p1c2-plan-contract-closure.py
  PROJECTION_STATE_PATH: scripts/qualification/materialize-hepta-intelligence-p1c2-projection-state-closure.py

jobs:
  qualify:
    name: P1.1c.2 final-label and frozen-reference closure Windows 2022
    runs-on: windows-2022
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Enable Git long paths before checkout
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Checkout qualification trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 12

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt,clippy

      - name: Execute exact fail-closed reference closure
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$SOURCE_BRANCH")" = "$SOURCE_SHA"
          cp "$PLAN_CONTRACT_PATH" "$RUNNER_TEMP/materialize-p1c2-plan-contract.py"
          cp "$PROJECTION_STATE_PATH" "$RUNNER_TEMP/materialize-p1c2-projection-state.py"
          python -m py_compile \
            "$RUNNER_TEMP/materialize-p1c2-plan-contract.py" \
            "$RUNNER_TEMP/materialize-p1c2-projection-state.py"
          git checkout --detach "$QUALIFICATION_DRIVER_SHA"
          mkdir -p "$RUNNER_TEMP/hepta-bin"
          cat > "$RUNNER_TEMP/hepta-bin/python3" <<'SH'
          #!/usr/bin/env bash
          exec python "$@"
          SH
          chmod +x "$RUNNER_TEMP/hepta-bin/python3"
          export PATH="$RUNNER_TEMP/hepta-bin:$PATH"
          cp scripts/qualification/run-hepta-intelligence-p1c2-fmt-close.sh \
            "$RUNNER_TEMP/run-hepta-intelligence-p1c2-reference-close-win22.sh"
          python3 - \
            "$RUNNER_TEMP/run-hepta-intelligence-p1c2-reference-close-win22.sh" \
            "$RUNNER_TEMP/materialize-p1c2-plan-contract.py" \
            "$RUNNER_TEMP/materialize-p1c2-projection-state.py" <<'PY'
          import sys
          from pathlib import Path
          driver = Path(sys.argv[1])
          plan_contract = Path(sys.argv[2]).as_posix()
          projection_state = Path(sys.argv[3]).as_posix()
          text = driver.read_text(encoding="utf-8")
          old_branch = 'OUTPUT_BRANCH="qualification/p1c2-reference-candidate-c3c42-20260828"'
          new_branch = 'OUTPUT_BRANCH="qualification/p1c2-ref-win22-candidate"'
          if text.count(old_branch) != 1:
              raise SystemExit("candidate output branch marker is not unique")
          text = text.replace(old_branch, new_branch, 1)
          old_step = 'python3 "$RUNNER_TEMP/materialize-hepta-intelligence-p1c2-reference-closure.py"\n\nexport CARGO_NET_OFFLINE=true'
          new_step = (
              'python3 "$RUNNER_TEMP/materialize-hepta-intelligence-p1c2-reference-closure.py"\n'
              f'python3 "{projection_state}"\n'
              f'python3 "{plan_contract}"\n\n'
              'export CARGO_NET_OFFLINE=true'
          )
          if text.count(old_step) != 1:
              raise SystemExit("reference materializer step marker is not unique")
          driver.write_text(text.replace(old_step, new_step, 1), encoding="utf-8")
          PY
          bash "$RUNNER_TEMP/run-hepta-intelligence-p1c2-reference-close-win22.sh"

      - name: Upload reference closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-intelligence-p1c2-reference-close-windows-2022-${{ github.sha }}
          path: artifacts/hepta-intelligence-p1-1c2-reference-closure
          if-no-files-found: warn
          retention-days: 14
