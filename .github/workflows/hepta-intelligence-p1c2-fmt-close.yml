name: hepta-intelligence-p1c2-reference-close-windows

on:
  push:
    branches:
      - "qualification/p1c2-ref-win-v1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-intelligence-p1c2-reference-close-windows
  cancel-in-progress: true

env:
  CARGO_NET_OFFLINE: "true"
  QUALIFICATION_DRIVER_SHA: de95f9e6d39c6e57d132fc8ad8368ad89cf54fb4

jobs:
  qualify:
    name: P1.1c.2 final-label and frozen-reference closure Windows
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Enable Git long paths before checkout
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Checkout qualification trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt,clippy

      - name: Execute exact fail-closed reference closure
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          git checkout --detach "$QUALIFICATION_DRIVER_SHA"
          mkdir -p "$RUNNER_TEMP/hepta-bin"
          cat > "$RUNNER_TEMP/hepta-bin/python3" <<'SH'
          #!/usr/bin/env bash
          exec python "$@"
          SH
          chmod +x "$RUNNER_TEMP/hepta-bin/python3"
          export PATH="$RUNNER_TEMP/hepta-bin:$PATH"
          cp scripts/qualification/run-hepta-intelligence-p1c2-fmt-close.sh \
            "$RUNNER_TEMP/run-hepta-intelligence-p1c2-reference-close-win.sh"
          python3 - "$RUNNER_TEMP/run-hepta-intelligence-p1c2-reference-close-win.sh" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          old = 'OUTPUT_BRANCH="qualification/p1c2-reference-candidate-c3c42-20260828"'
          new = 'OUTPUT_BRANCH="qualification/p1c2-ref-win-candidate"'
          if text.count(old) != 1:
              raise SystemExit("candidate output branch marker is not unique")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          bash "$RUNNER_TEMP/run-hepta-intelligence-p1c2-reference-close-win.sh"

      - name: Upload reference closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-intelligence-p1c2-reference-close-windows-${{ github.sha }}
          path: artifacts/hepta-intelligence-p1-1c2-reference-closure
          if-no-files-found: warn
          retention-days: 14
