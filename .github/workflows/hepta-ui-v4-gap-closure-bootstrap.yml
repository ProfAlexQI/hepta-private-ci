name: hepta-ui-v4-gap-closure-bootstrap

on:
  push:
    branches:
      - "codex/ui-v4-executable-final-gap-closure-v3-20260829"
    paths:
      - ".github/workflows/hepta-ui-v4-gap-closure-bootstrap.yml"

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

concurrency:
  group: hepta-ui-v4-gap-closure-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply guarded UI v4 blocker closure
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
