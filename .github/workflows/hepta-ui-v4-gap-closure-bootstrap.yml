name: hepta-ui-v4-gap-closure-bootstrap

on:
  push:
    branches:
      - "ops/hepta-ui-v4-gap-closure-exec-20260829"
    paths:
      - ".github/workflows/hepta-ui-v4-gap-closure-bootstrap.yml"

permissions:
  contents: read

concurrency:
  group: hepta-ui-v4-gap-closure-ops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    name: Export verified UI v4 blocker-closure tree
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated execution head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify scope and execute verified payload locally
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "ops/hepta-ui-v4-gap-closure-exec-20260829"
          git fetch --no-tags --depth=1 origin f9f362c8c0eb2fa6e28ded8cb141e4d4e8a02a2d
          test "$(git diff --name-only f9f362c8c0eb2fa6e28ded8cb141e4d4e8a02a2d..HEAD)" = ".github/workflows/hepta-ui-v4-gap-closure-bootstrap.yml"
          git fetch --no-tags origin refs/heads/automation/hepta-ui-v4-gap-closure-payload-20260829:refs/remotes/origin/hepta-gap-payload
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import subprocess

          ref = "refs/remotes/origin/hepta-gap-payload"
          root = ".github/hepta-ui-v4-gap-closure-payload"

          def show(path: str) -> str:
              return subprocess.check_output(
                  ["git", "show", f"{ref}:{path}"], text=True
              )

          manifest = json.loads(show(f"{root}/manifest.json"))
          assert manifest["schema"] == "hepta.ui.v4.gap-closure-bootstrap-payload.v1"
          assert manifest["targetBase"] == "f9f362c8c0eb2fa6e28ded8cb141e4d4e8a02a2d"
          encoded = "".join(
              show(f"{root}/chunk-{index:02d}.txt").strip()
              for index in range(manifest["chunkCount"])
          )
          assert len(encoded) == manifest["base64Chars"]
          assert hashlib.sha256(encoded.encode()).hexdigest() == manifest["base64Sha256"]
          compressed = base64.b64decode(encoded, validate=True)
          assert len(compressed) == manifest["gzipBytes"]
          assert hashlib.sha256(compressed).hexdigest() == manifest["gzipSha256"]
          source = gzip.decompress(compressed)
          assert len(source) == manifest["sourceBytes"]
          assert hashlib.sha256(source).hexdigest() == manifest["sourceSha256"]

          payload_source_sha256 = hashlib.sha256(source).hexdigest()
          source_text = source.decode("utf-8")

          old_marker = '    marker = "    if digest != SHA256_ABC {\\n"\n'
          new_marker = '    marker = \'    if sha256_hex(b"abc") != SHA256_ABC {\\n\'\n'
          assert source_text.count(old_marker) == 1
          source_text = source_text.replace(old_marker, new_marker, 1)

          original_branch = "codex/ui-v4-executable-final-gap-closure-v3-20260829"
          execution_branch = "ops/hepta-ui-v4-gap-closure-exec-20260829"
          assert source_text.count(original_branch) >= 1
          source_text = source_text.replace(original_branch, execution_branch)
          source = source_text.encode("utf-8")

          real_subprocess_run = subprocess.run

          def local_only_subprocess_run(args, *positional, **kwargs):
              routed = list(args)
              if (
                  len(routed) >= 4
                  and routed[0:3] == ["git", "push", "origin"]
                  and routed[-1].startswith("HEAD:")
              ):
                  print(json.dumps({
                      "suppressedPush": routed[-1],
                      "reason": "export verified local result tree for authorized Git API promotion",
                  }, sort_keys=True))
                  return subprocess.CompletedProcess(
                      routed,
                      0,
                      stdout="verified local result staged for artifact export\n",
                      stderr="",
                  )
              return real_subprocess_run(routed, *positional, **kwargs)

          subprocess.run = local_only_subprocess_run
          print(json.dumps({
              "payloadSourceSha256": payload_source_sha256,
              "executionSourceSha256": hashlib.sha256(source).hexdigest(),
              "hotfixes": [
                  "build-rs-known-answer-marker-v2",
                  "isolated-execution-branch-v1",
                  "artifact-export-no-push-v1",
                  "explicit-audited-head-fetch-v1",
              ],
          }, sort_keys=True))
          exec(compile(source, "hepta-ui-v4-gap-closure-bootstrap", "exec"))
          PY

      - name: Export exact transformed files and commit identity
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          mkdir -p artifacts/gap-closure/files
          git rev-parse HEAD > artifacts/gap-closure/result-commit.txt
          git rev-parse 'HEAD^{tree}' > artifacts/gap-closure/result-tree.txt
          git rev-parse 'HEAD^' > artifacts/gap-closure/result-parent.txt
          git diff-tree --no-commit-id --name-status -r HEAD > artifacts/gap-closure/result-diff.txt
          git show --no-ext-diff --format=fuller --stat HEAD > artifacts/gap-closure/result-summary.txt
          for path in \
            apps/hepta-native/src/shared/hepta_material_app_lifecycle.rs \
            apps/hepta-native/src/persistence/matrix_session_store/private_file.rs \
            apps/hepta-native/src/shared/hepta_system_preferences.rs \
            codex-rs/hepta-core/build.rs \
            .gitattributes \
            scripts/hepta-ui-v4-served-bundle-gate \
            .github/workflows/hepta-ui-v4-windows-dwm-ack-producer.yml \
            .github/workflows/hepta-ui-v4-windows-material-profile-runtime.yml \
            .github/workflows/hepta-ui-v4-windows-material-profile-aggregate.yml \
            .github/workflows/hepta-ui-v4-windows-material-profile-exact.yml \
            scripts/hepta-ui-v4-exact-head-qualification-closure-gate \
            .github/workflows/hepta-ci.yml \
            .github/workflows/hepta-ui-v4.yml
          do
            mkdir -p "artifacts/gap-closure/files/$(dirname "$path")"
            cp "$path" "artifacts/gap-closure/files/$path"
          done
          if test -f artifacts/hepta-ui-v4-gap-closure-application.json; then
            cp artifacts/hepta-ui-v4-gap-closure-application.json artifacts/gap-closure/application-report.json
          fi
          tar -C artifacts/gap-closure/files -czf artifacts/gap-closure/transformed-files.tar.gz .
          sha256sum artifacts/gap-closure/transformed-files.tar.gz > artifacts/gap-closure/transformed-files.tar.gz.sha256
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("artifacts/gap-closure")
          files_root = root / "files"
          files = []
          for path in sorted(p for p in files_root.rglob("*") if p.is_file()):
              data = path.read_bytes()
              files.append({
                  "path": path.relative_to(files_root).as_posix(),
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })
          payload = {
              "schema": "hepta.ui.v4.gap-closure-result-export.v1",
              "status": "PASS_VERIFIED_LOCAL_RESULT_TREE_EXPORTED",
              "auditedHead": "f9f362c8c0eb2fa6e28ded8cb141e4d4e8a02a2d",
              "resultCommit": (root / "result-commit.txt").read_text().strip(),
              "resultTree": (root / "result-tree.txt").read_text().strip(),
              "resultParent": (root / "result-parent.txt").read_text().strip(),
              "changedFileCount": len(files),
              "files": files,
              "claims": {
                  "repositoryControlledPatchValidated": True,
                  "exactHeadHostedCiValidated": False,
                  "externalEvidenceComplete": False,
                  "allGapsClosed": False,
                  "releaseAuthority": False,
              },
          }
          (root / "export-manifest.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload verified result tree
        uses: actions/upload-artifact@v4
        with:
          name: hepta-ui-v4-gap-closure-result-${{ github.sha }}
          path: artifacts/gap-closure
          if-no-files-found: error
          retention-days: 14
