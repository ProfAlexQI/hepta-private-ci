name: hepta-ui-v4-gap-closure-bootstrap

on:
  push:
    branches:
      - "ops/hepta-ui-v4-gap-closure-exec-20260829"
    paths:
      - ".github/workflows/hepta-ui-v4-gap-closure-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: hepta-ui-v4-gap-closure-ops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply verified UI v4 blocker closure
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated execution head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Verify scope and execute verified payload
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "ops/hepta-ui-v4-gap-closure-exec-20260829"
          test "$(git diff --name-only f9f362c8c0eb2fa6e28ded8cb141e4d4e8a02a2d..HEAD)" = ".github/workflows/hepta-ui-v4-gap-closure-bootstrap.yml"
          git fetch --no-tags origin refs/heads/automation/hepta-ui-v4-gap-closure-payload-20260829:refs/remotes/origin/hepta-gap-payload
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import subprocess

          ref = "refs/remotes/origin/hepta-gap-payload"
          root = ".github/hepta-ui-v4-gap-closure-payload"

          def show(path: str) -> str:
              return subprocess.check_output(
                  ["git", "show", f"{ref}:{path}"], text=True
              )

          manifest = json.loads(show(f"{root}/manifest.json"))
          assert manifest["schema"] == "hepta.ui.v4.gap-closure-bootstrap-payload.v1"
          assert manifest["targetBase"] == "f9f362c8c0eb2fa6e28ded8cb141e4d4e8a02a2d"
          encoded = "".join(
              show(f"{root}/chunk-{index:02d}.txt").strip()
              for index in range(manifest["chunkCount"])
          )
          assert len(encoded) == manifest["base64Chars"]
          assert hashlib.sha256(encoded.encode()).hexdigest() == manifest["base64Sha256"]
          compressed = base64.b64decode(encoded, validate=True)
          assert len(compressed) == manifest["gzipBytes"]
          assert hashlib.sha256(compressed).hexdigest() == manifest["gzipSha256"]
          source = gzip.decompress(compressed)
          assert len(source) == manifest["sourceBytes"]
          assert hashlib.sha256(source).hexdigest() == manifest["sourceSha256"]

          payload_source_sha256 = hashlib.sha256(source).hexdigest()
          source_text = source.decode("utf-8")

          old_marker = '    marker = "    if digest != SHA256_ABC {\\n"\n'
          new_marker = '    marker = \'    if sha256_hex(b"abc") != SHA256_ABC {\\n\'\n'
          assert source_text.count(old_marker) == 1
          source_text = source_text.replace(old_marker, new_marker, 1)

          original_branch = "codex/ui-v4-executable-final-gap-closure-v3-20260829"
          execution_branch = "ops/hepta-ui-v4-gap-closure-exec-20260829"
          assert source_text.count(original_branch) >= 1
          source_text = source_text.replace(original_branch, execution_branch)
          source = source_text.encode("utf-8")

          real_subprocess_run = subprocess.run
          result_branch = "automation/hepta-ui-v4-gap-closure-result-v2-20260829"

          def routed_subprocess_run(args, *positional, **kwargs):
              routed = list(args)
              if (
                  len(routed) >= 4
                  and routed[0:3] == ["git", "push", "origin"]
                  and routed[-1].startswith("HEAD:")
              ):
                  routed[-1] = f"HEAD:{result_branch}"
                  print(json.dumps({
                      "redirectedPush": routed[-1],
                      "reason": "stage verified result tree for authorized Git API promotion",
                  }, sort_keys=True))
              return real_subprocess_run(routed, *positional, **kwargs)

          subprocess.run = routed_subprocess_run
          print(json.dumps({
              "payloadSourceSha256": payload_source_sha256,
              "executionSourceSha256": hashlib.sha256(source).hexdigest(),
              "hotfixes": [
                  "build-rs-known-answer-marker-v2",
                  "isolated-execution-branch-v1",
              ],
          }, sort_keys=True))
          exec(compile(source, "hepta-ui-v4-gap-closure-bootstrap", "exec"))
          PY
