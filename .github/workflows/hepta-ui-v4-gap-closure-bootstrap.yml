        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "codex/ui-v4-executable-final-gap-closure-v3-20260829"
          test -f .github/workflows/hepta-ui-v4-gap-closure-bootstrap.yml
          test "$(git diff --name-only f9f362c8c0eb2fa6e28ded8cb141e4d4e8a02a2d..HEAD)" = ".github/workflows/hepta-ui-v4-gap-closure-bootstrap.yml"

