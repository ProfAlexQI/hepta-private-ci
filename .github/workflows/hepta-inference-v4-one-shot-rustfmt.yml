name: Hepta inference one-shot Rust 1.95 formatter

on:
  push:
    branches:
      - codex/hepta-inference-gap-closure-20260829
    paths:
      - .github/workflows/hepta-inference-v4-one-shot-rustfmt.yml

permissions:
  contents: write

concurrency:
  group: hepta-inference-v4-one-shot-rustfmt
  cancel-in-progress: false

jobs:
  format-owned-inference-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Guard exact parent and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/hepta-inference-gap-closure-20260829
          test "$(git rev-parse HEAD^)" = a60887e4b1e9805b29d33c4f4be17e5e76238403
          test -z "$(git status --porcelain)"

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Format only owned inference packages
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd

      - name: Enforce exact formatter change set
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(cat <<'EOF' | LC_ALL=C sort
          codex-rs/hepta-infer-core/src/controller.rs
          codex-rs/hepta-infer-core/src/hashing.rs
          codex-rs/hepta-infer-core/src/security.rs
          codex-rs/hepta-infer-core/src/tests.rs
          codex-rs/hepta-inferd/src/lib.rs
          codex-rs/hepta-inferd/src/tests.rs
          EOF
          )"
          test "$actual" = "$expected"
          git diff --check

      - name: Commit formatting and remove one-shot workflow
        shell: bash
        env:
          TARGET_BRANCH: codex/hepta-inference-gap-closure-20260829
        run: |
          set -euo pipefail
          rm .github/workflows/hepta-inference-v4-one-shot-rustfmt.yml
          git add \
            codex-rs/hepta-infer-core/src/controller.rs \
            codex-rs/hepta-infer-core/src/hashing.rs \
            codex-rs/hepta-infer-core/src/security.rs \
            codex-rs/hepta-infer-core/src/tests.rs \
            codex-rs/hepta-inferd/src/lib.rs \
            codex-rs/hepta-inferd/src/tests.rs \
            .github/workflows/hepta-inference-v4-one-shot-rustfmt.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style(inference): apply Rust 1.95 formatting"
          git push origin "HEAD:${TARGET_BRANCH}"
