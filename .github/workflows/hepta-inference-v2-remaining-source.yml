name: Hepta inference v2 exact-head runtime closure qualification

on:
  pull_request:
    paths:
      - "codex-rs/hepta-infer-backend-v1/**"
      - "codex-rs/hepta-infer-input-lease/**"
      - "codex-rs/hepta-infer-model-registry/**"
      - "codex-rs/hepta-infer-product-bridge/**"
      - "codex-rs/hepta-infer-router/**"
      - "codex-rs/hepta-infer-scheduler/**"
      - "codex-rs/hepta-infer-semantic/**"
      - "codex-rs/hepta-infer-worker-host/**"
      - "codex-rs/hepta-infer-core/**"
      - "codex-rs/hepta-infer-client/**"
      - "codex-rs/hepta-inferd/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "tools/hepta-inference-v2-qualification/**"
      - "scripts/hepta-inference-inf0c-cancel-capability-v4.py"
      - "docs/hepta-vnext/inference/HEPTA_INFERENCE_V2_REMAINING_*"
      - "docs/hepta-vnext/inference/HEPTA_INFERENCE_CURRENT_STATUS_V3.json"
      - "docs/hepta-vnext/inference/HEPTA_INFERENCE_STAGE_MATRIX_V4.json"
      - "docs/hepta-vnext/inference/HEPTA_INFERENCE_V2_CLOSURE_EVIDENCE_CONTRACT_V1.json"
      - ".github/workflows/hepta-inference-v2-remaining-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-inference-v2-exact-head-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  source-contract:
    name: Exact source, authority, and deterministic process gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Verify clean exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'

      - name: Compile qualification Python
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q tools/hepta-inference-v2-qualification
          python3 -m py_compile scripts/hepta-inference-inf0c-cancel-capability-v4.py

      - name: Run closed-authority source gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/hepta-inference-v2-qualification/source_gate.py \
            > "$RUNNER_TEMP/hepta-inference-v2-source-gate.json"

      - name: Execute native ABI sanitizer fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/hepta-inference-v2-qualification/run_native_abi_sanitizer.py \
            --output "$RUNNER_TEMP/hepta-inference-v2-native-abi-sanitizer.json"

      - name: Execute hermetic qualification suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q tools/hepta-inference-v2-qualification/tests \
            | tee "$RUNNER_TEMP/hepta-inference-v2-pytest.txt"

      - name: Emit exact-head source receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/hepta-inference-v2-qualification/qualify.py \
            --output "$RUNNER_TEMP/hepta-inference-v2-local-source-receipt.json"
          python3 - "$RUNNER_TEMP/hepta-inference-v2-exact-source-receipt.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess
          import sys

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          output = pathlib.Path(sys.argv[1])
          source_gate = pathlib.Path(__import__("os").environ["RUNNER_TEMP"]) / "hepta-inference-v2-source-gate.json"
          tests = pathlib.Path(__import__("os").environ["RUNNER_TEMP"]) / "hepta-inference-v2-pytest.txt"
          native_abi = pathlib.Path(__import__("os").environ["RUNNER_TEMP"]) / "hepta-inference-v2-native-abi-sanitizer.json"
          receipt = {
              "schema": "hepta.inference.v2.exact_source_receipt.v1",
              "head": git("rev-parse", "HEAD"),
              "tree": git("rev-parse", "HEAD^{tree}"),
              "parent": git("rev-parse", "HEAD^"),
              "source_gate_digest": "sha256:" + hashlib.sha256(source_gate.read_bytes()).hexdigest(),
              "test_output_digest": "sha256:" + hashlib.sha256(tests.read_bytes()).hexdigest(),
              "native_abi_sanitizer_digest": "sha256:" + hashlib.sha256(native_abi.read_bytes()).hexdigest(),
              "native_abi_sanitizer": "EXECUTED_PASSED_QUALIFICATION_ONLY_FIXTURE",
              "python_source_and_process_qualification": "EXECUTED_PASSED_QUALIFICATION_ONLY",
              "rust_qualification": "PENDING_MATRIX",
              "native_llamacpp_inference": "NOT_EXECUTED",
              "hardware_performance": "NOT_EXECUTED",
              "product_default_route_changed": False,
              "operator_accepted": False,
              "promoted": False,
              "released": False,
          }
          output.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload exact source evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-v2-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/hepta-inference-v2-source-gate.json
            ${{ runner.temp }}/hepta-inference-v2-pytest.txt
            ${{ runner.temp }}/hepta-inference-v2-native-abi-sanitizer.json
            ${{ runner.temp }}/hepta-inference-v2-local-source-receipt.json
            ${{ runner.temp }}/hepta-inference-v2-exact-source-receipt.json
          if-no-files-found: error
          retention-days: 30

  rust-qualification:
    name: Rust 1.95 ${{ matrix.name }}
    needs: source-contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: linux-x64
            runner: ubuntu-24.04
          - name: macos-intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Verify Rust 1.95-compatible Rama lock graph
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import tomllib
          lock = tomllib.loads(pathlib.Path("Cargo.lock").read_text(encoding="utf-8"))
          packages = {package["name"]: package for package in lock.get("package", []) if package.get("name") in {"rama-error", "rama-macros", "rama-utils"}}
          expected = {
              "rama-error": ("0.3.0-alpha.4", "3c452aba1beb7e29b873ff32f304536164cffcc596e786921aea64e858ff8f40"),
              "rama-macros": ("0.3.0-alpha.4", "ea18a110bcf21e35c5f194168e6914ccea45ffdd0fea51bc4b169fbeafef6428"),
              "rama-utils": ("0.3.0-alpha.4", "bf28b18ba4a57f8334d7992d3f8020194ea359b246ae6f8f98b8df524c7a14ef"),
          }
          if set(packages) != set(expected):
              raise SystemExit(f"Rama lock package set drift: {sorted(packages)}")
          for name, (version, checksum) in expected.items():
              package = packages[name]
              if package.get("version") != version or package.get("checksum") != checksum:
                  raise SystemExit(f"Rama lock drift for {name}: version={package.get('version')} checksum={package.get('checksum')}")
          print("PASS_HEPTA_INFERENCE_RAMA_ALPHA4_RUST_1_95_LOCK")
          PY

      - name: Verify workspace lock is unchanged
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/hepta-inference-v2-metadata.json"
          test -z "$(git status --porcelain -- Cargo.lock Cargo.toml)"

      - name: Check exact owned formatting
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd \
            -p codex-hepta-infer-backend-v1 \
            -p codex-hepta-infer-input-lease \
            -p codex-hepta-infer-model-registry \
            -p codex-hepta-infer-product-bridge \
            -p codex-hepta-infer-router \
            -p codex-hepta-infer-scheduler \
            -p codex-hepta-infer-semantic \
            -p codex-hepta-infer-worker-host \
            -- --check

      - name: Locked compile
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo check --locked \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd \
            -p codex-hepta-infer-backend-v1 \
            -p codex-hepta-infer-input-lease \
            -p codex-hepta-infer-model-registry \
            -p codex-hepta-infer-product-bridge \
            -p codex-hepta-infer-router \
            -p codex-hepta-infer-scheduler \
            -p codex-hepta-infer-semantic \
            -p codex-hepta-infer-worker-host

      - name: Locked tests
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd \
            -p codex-hepta-infer-backend-v1 \
            -p codex-hepta-infer-input-lease \
            -p codex-hepta-infer-model-registry \
            -p codex-hepta-infer-product-bridge \
            -p codex-hepta-infer-router \
            -p codex-hepta-infer-scheduler \
            -p codex-hepta-infer-semantic \
            -p codex-hepta-infer-worker-host \
            -- --test-threads=1

      - name: Strict owned-source Clippy
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets --no-deps \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd \
            -p codex-hepta-infer-backend-v1 \
            -p codex-hepta-infer-input-lease \
            -p codex-hepta-infer-model-registry \
            -p codex-hepta-infer-product-bridge \
            -p codex-hepta-infer-router \
            -p codex-hepta-infer-scheduler \
            -p codex-hepta-infer-semantic \
            -p codex-hepta-infer-worker-host \
            -- -D warnings

      - name: Emit Rust qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/hepta-inference-v2-rust-${{ matrix.name }}.txt"
          {
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "metadata_locked=PASS"
            echo "fmt=PASS"
            echo "check=PASS"
            echo "test=PASS"
            echo "clippy_all_targets_no_deps_D_warnings=PASS"
            echo "qualification_only=true"
            echo "native_llamacpp_inference=false"
            echo "hardware_performance=false"
            echo "product_default_route_changed=false"
            echo "operator_accepted=false"
            echo "promoted=false"
            echo "released=false"
          } | tee "$receipt"

      - name: Upload Rust evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-v2-rust-${{ matrix.name }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/hepta-inference-v2-metadata.json
            ${{ runner.temp }}/hepta-inference-v2-rust-${{ matrix.name }}.txt
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Qualification-only aggregate
    if: always()
    needs:
      - source-contract
      - rust-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce all exact-head source gates
        shell: bash
        env:
          SOURCE_CONTRACT: ${{ needs.source-contract.result }}
          RUST_QUALIFICATION: ${{ needs.rust-qualification.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_CONTRACT" = success
          test "$RUST_QUALIFICATION" = success
          echo "PASS_HEPTA_INFERENCE_V2_EXACT_HEAD_RUNTIME_CLOSURE_QUALIFICATION_ONLY"
          echo "native_llamacpp_inference=false"
          echo "hardware_performance=false"
          echo "product_default_route_changed=false"
          echo "operator_accepted=false"
          echo "promoted=false"
          echo "released=false"
