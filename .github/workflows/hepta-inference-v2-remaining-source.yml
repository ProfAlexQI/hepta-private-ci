name: Hepta inference V3 exact-head multi-platform qualification-only

on:
  pull_request:
    paths:
      - "codex-rs/hepta-infer-core/**"
      - "codex-rs/hepta-infer-client/**"
      - "codex-rs/hepta-inferd/**"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "docs/hepta-vnext/inference/HEPTA_INFERENCE_RUNTIME_DEVELOPMENT_PLAN_V3.md"
      - "docs/hepta-vnext/inference/HEPTA_INFERENCE_BLOCKER_LEDGER_V1.json"
      - "docs/hepta-vnext/inference/HEPTA_INFERENCE_CURRENT_STATUS_V3.json"
      - "docs/hepta-vnext/inference/HEPTA_INFERENCE_IMPLEMENTATION_STATUS_V2.json"
      - "docs/hepta-vnext/inference/HEPTA_INFERENCE_STAGE_MATRIX_V4.json"
      - "docs/hepta-vnext/inference/HEPTA_INFERENCE_V3_CLOSURE_EVIDENCE_CONTRACT_V1.json"
      - "scripts/hepta-inference-v3-source-truth.py"
      - ".github/workflows/hepta-inference-gap-closure.yml"
      - ".github/workflows/hepta-inference-v2-remaining-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-inference-v3-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  source-contract:
    name: V3 exact-head source inventory and authority
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Verify clean exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python3 -m py_compile scripts/hepta-inference-v3-source-truth.py
          python3 scripts/hepta-inference-v3-source-truth.py \
            | tee "$RUNNER_TEMP/hepta-inference-v3-exact-source.json"

      - name: Upload exact source evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-v3-exact-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/hepta-inference-v3-exact-source.json
          if-no-files-found: error
          retention-days: 30

  rust-qualification:
    name: Rust 1.95 ${{ matrix.name }} source qualification
    needs: source-contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Verify locked metadata
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 \
            > "$RUNNER_TEMP/hepta-inference-v3-metadata-${{ matrix.name }}.json"
          test -z "$(git status --porcelain -- Cargo.toml Cargo.lock)"

      - name: Check exact owned formatting
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd -- --check

      - name: Locked all-target compile
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo check --locked --all-targets \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd

      - name: Locked all-target tests
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked --all-targets \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd

      - name: Strict all-target Clippy
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets --no-deps \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd -- -D warnings

      - name: Emit platform receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/hepta-inference-v3-rust-${{ matrix.name }}.txt"
          {
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "parent=$(git rev-parse HEAD^)"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "metadata_locked=PASS"
            echo "fmt=PASS"
            echo "check_all_targets=PASS"
            echo "test_all_targets=PASS"
            echo "clippy_all_targets_no_deps_D_warnings=PASS"
            echo "qualification_only=true"
            echo "real_provider_executed=false"
            echo "real_native_model_executed=false"
            echo "hardware_qualified=false"
            echo "product_default_route_changed=false"
            echo "operator_accepted=false"
            echo "promoted=false"
            echo "released=false"
          } | tee "$receipt"

      - name: Upload platform evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-v3-rust-${{ matrix.name }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/hepta-inference-v3-metadata-${{ matrix.name }}.json
            ${{ runner.temp }}/hepta-inference-v3-rust-${{ matrix.name }}.txt
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: V3 multi-platform qualification-only aggregate
    if: always()
    needs:
      - source-contract
      - rust-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce every required exact-head source job
        shell: bash
        env:
          SOURCE_CONTRACT: ${{ needs.source-contract.result }}
          RUST_QUALIFICATION: ${{ needs.rust-qualification.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_CONTRACT" = success
          test "$RUST_QUALIFICATION" = success
          echo PASS_HEPTA_INFERENCE_V3_MULTI_PLATFORM_QUALIFICATION_ONLY
          echo real_provider_executed=false
          echo real_native_model_executed=false
          echo hardware_qualified=false
          echo product_default_route_changed=false
          echo operator_accepted=false
          echo promoted=false
          echo released=false
