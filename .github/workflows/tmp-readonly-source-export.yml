name: Temporary read-only exact-source export

on:
  push:
    branches:
      - audit/readonly-source-export-bee6217-20260902
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-readonly-source-export-bee6217
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact immutable candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: bee6217a0083f7368e477c6768bca285dabb1545
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and archive exact tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bee6217a0083f7368e477c6768bca285dabb1545
          git archive \
            --format=tar.gz \
            --output="$RUNNER_TEMP/hepta-private-ci-bee6217.tar.gz" \
            HEAD
          sha256sum "$RUNNER_TEMP/hepta-private-ci-bee6217.tar.gz" \
            > "$RUNNER_TEMP/hepta-private-ci-bee6217.tar.gz.sha256"

      - name: Retain exact source archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-private-ci-source-bee6217
          path: |
            ${{ runner.temp }}/hepta-private-ci-bee6217.tar.gz
            ${{ runner.temp }}/hepta-private-ci-bee6217.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
