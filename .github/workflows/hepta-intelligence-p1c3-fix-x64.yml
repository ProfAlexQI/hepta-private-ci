name: hepta-intelligence-p1c3-fix-x64

on:
  push:
    branches:
      - "qualification/p1c3-fix-v1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-intelligence-p1c3-fix-x64-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_SHA: df95a8c9e3b0555f73aa8f943fe1c72133ccdf3c
  PATCH_SCRIPT: scripts/qualification/materialize-p1c3-fix-v1.py
  MAC_WORKFLOW: .github/workflows/hepta-intelligence-p1c3-fix-v1.yml
  DRIVER_PATH: scripts/qualification/run-p1c3-fix-x64.sh
  X64_WORKFLOW: .github/workflows/hepta-intelligence-p1c3-fix-x64.yml

jobs:
  qualify:
    name: P1.1c.3 x64 executable qualification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact x64 driver
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt,clippy

      - name: Execute x64 fail-closed qualification
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: bash scripts/qualification/run-p1c3-fix-x64.sh

      - name: Upload x64 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-intelligence-p1c3-fix-x64-${{ github.sha }}
          path: artifacts/hepta-intelligence-p1-1c3-fix-x64
          if-no-files-found: warn
          retention-days: 14
