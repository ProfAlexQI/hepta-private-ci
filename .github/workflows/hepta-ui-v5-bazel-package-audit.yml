name: Hepta UI v5 Bazel package completeness audit

on:
  push:
    branches:
      - diagnostic/ui-v5-bazel-package-audit-20260830
    paths:
      - .github/workflows/hepta-ui-v5-bazel-package-audit.yml

permissions:
  contents: read

concurrency:
  group: hepta-ui-v5-bazel-package-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_PARENT: 1e6f7cf3db498153fd52250dee1112f89489e094
      REPORT_DIR: artifacts/hepta-ui-v5-bazel-package-audit
    steps:
      - name: Check out exact diagnostic commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify isolated diagnostic topology
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/hepta-ui-v5-bazel-package-audit.yml"

      - name: Audit every Cargo workspace member and Bazel package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import pathlib
          import tomllib

          root = pathlib.Path("codex-rs")
          workspace = tomllib.loads((root / "Cargo.toml").read_text(encoding="utf-8"))
          members = workspace["workspace"]["members"]
          if len(members) != len(set(members)):
              raise SystemExit("duplicate Cargo workspace members")

          records: list[dict[str, object]] = []
          for member in members:
              member_dir = root / member
              cargo_path = member_dir / "Cargo.toml"
              if not member_dir.is_dir():
                  raise SystemExit(f"workspace member directory missing: {member}")
              if not cargo_path.is_file():
                  raise SystemExit(f"workspace Cargo.toml missing: {member}")
              cargo = tomllib.loads(cargo_path.read_text(encoding="utf-8"))
              package = cargo.get("package", {})
              package_name = package.get("name")
              if not isinstance(package_name, str) or not package_name:
                  raise SystemExit(f"workspace package name missing: {member}")

              explicit_lib = cargo.get("lib")
              inferred_lib = (member_dir / "src/lib.rs").is_file()
              inferred_bin = (member_dir / "src/main.rs").is_file()
              explicit_bins = cargo.get("bin", [])
              if not isinstance(explicit_bins, list):
                  raise SystemExit(f"unexpected [[bin]] shape: {member}")

              path_dependencies: set[str] = set()
              for section_name in ("dependencies", "dev-dependencies", "build-dependencies"):
                  section = cargo.get(section_name, {})
                  if not isinstance(section, dict):
                      continue
                  for dependency in section.values():
                      if isinstance(dependency, dict) and isinstance(dependency.get("path"), str):
                          path_dependencies.add(dependency["path"])

              build_files = [
                  name
                  for name in ("BUILD.bazel", "BUILD")
                  if (member_dir / name).is_file()
              ]
              records.append(
                  {
                      "member": member,
                      "package_name": package_name,
                      "build_files": build_files,
                      "missing_bazel_package": not build_files,
                      "lib": {
                          "present": bool(explicit_lib is not None or inferred_lib),
                          "explicit": explicit_lib,
                          "inferred_src_lib": inferred_lib,
                      },
                      "bins": {
                          "explicit": explicit_bins,
                          "inferred_src_main": inferred_bin,
                      },
                      "path_dependencies": sorted(path_dependencies),
                  }
              )

          missing = [record for record in records if record["missing_bazel_package"]]
          report = {
              "schema": "hepta.ui.bazel-package-completeness-audit.v1",
              "source_commit": os.environ["EXPECTED_PARENT"],
              "workspace_member_count": len(records),
              "missing_bazel_package_count": len(missing),
              "missing_members": missing,
              "members": records,
          }
          report_dir = pathlib.Path(os.environ["REPORT_DIR"])
          (report_dir / "workspace-bazel-audit.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# Cargo workspace Bazel package audit",
              "",
              f"- source: `{os.environ['EXPECTED_PARENT']}`",
              f"- workspace members: {len(records)}",
              f"- missing Bazel packages: {len(missing)}",
              "",
              "## Missing members",
              "",
          ]
          for record in missing:
              lines.append(
                  f"- `{record['member']}` / package `{record['package_name']}` / "
                  f"lib={record['lib']['present']} / "
                  f"explicit_bins={len(record['bins']['explicit'])} / "
                  f"src_main={record['bins']['inferred_src_main']}"
              )
          if not missing:
              lines.append("- none")
          lines.append("")
          (report_dir / "workspace-bazel-audit.md").write_text(
              "\n".join(lines), encoding="utf-8"
          )
          with pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("\n".join(lines))
          print("\n".join(lines))
          PY

          cp codex-rs/cli/BUILD.bazel "$REPORT_DIR/cli.BUILD.bazel"
          cp codex-rs/rmcp-client/BUILD.bazel "$REPORT_DIR/rmcp-client.BUILD.bazel"
          git diff --check HEAD^ HEAD
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload deterministic audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-ui-v5-bazel-package-audit-${{ github.sha }}
          path: artifacts/hepta-ui-v5-bazel-package-audit
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
