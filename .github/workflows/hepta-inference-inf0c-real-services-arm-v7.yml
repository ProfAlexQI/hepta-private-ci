name: Hepta inference INF-0C real services ARM closure v7

on:
  push:
    branches: [codex/hepta-inference-inf0c-real-services-arm-20260828]
    paths: [".github/workflows/hepta-inference-inf0c-real-services-arm-v7.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-inference-inf0c-real-services-arm-v7
  cancel-in-progress: false

jobs:
  closure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      CANDIDATE_BRANCH: codex/hepta-inference-inf0c-toolcall-restacked-20260829
      CANDIDATE_RECEIPT: cd3344d767667b177d6d21c7198bade228d010bb
      CANDIDATE_SOURCE: a45d0b6b1591ed67f6f580879a706849a81c6fe9
      CANDIDATE_TREE: eb415339159aff6bdf39a2030b55432d89321f2d
      CANCEL_BRANCH: codex/hepta-inference-inf0c-cancel-capability-v3-20260828
      CANCEL_SOURCE: cf8b448c4d09d1677519a674126fb7dc61452414
      CANCEL_RECEIPT: 6109b43cd303253d84c9ef0a16ae4592d9e96cd0
      OLLAMA_MODEL: granite4:1b
      LMSTUDIO_MODEL: ibm/granite-4-micro
      LMSTUDIO_DOWNLOAD: ibm/granite-4-micro@q4_k_m
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_CONTEXT_LENGTH: "2048"
      EXPECTED_OLLAMA_INSTALLER_SHA256: 25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f
      EXPECTED_LMSTUDIO_INSTALLER_SHA256: f6492caf54327951d55f281133d0d9646efd62985c2465c597bfff8d35b6795f
      CI: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Copy audited contract and detach exact candidate
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/hepta-inference-inf0c-real-services-arm-v6.yml \
            "$RUNNER_TEMP/hepta-inference-inf0c-real-services-arm-v6.yml"
          git fetch --no-tags origin \
            "refs/heads/$CANDIDATE_BRANCH:refs/remotes/origin/hepta-inf0c-capability-v3" \
            "refs/heads/$CANCEL_BRANCH:refs/remotes/origin/hepta-inf0c-cancel-v3"
          test "$(git rev-parse refs/remotes/origin/hepta-inf0c-capability-v3)" = "$CANDIDATE_RECEIPT"
          test "$(git rev-parse "$CANDIDATE_RECEIPT^")" = "$CANDIDATE_SOURCE"
          test "$(git rev-parse "$CANDIDATE_SOURCE^{tree}")" = "$CANDIDATE_TREE"
          test "$(git diff --name-only "$CANDIDATE_SOURCE" "$CANDIDATE_RECEIPT")" = \
            "docs/hepta-vnext/inference/HEPTA_INFERENCE_INF0C_CAPABILITY_CLASSIFIER_SOURCE_RECEIPT_2026-08-29.json"
          test "$(git rev-parse refs/remotes/origin/hepta-inf0c-cancel-v3)" = "$CANCEL_RECEIPT"
          test "$(git rev-parse "$CANCEL_RECEIPT^")" = "$CANCEL_SOURCE"
          git checkout --detach "$CANDIDATE_RECEIPT"
          test -z "$(git status --porcelain)"

      - name: Materialize audited v6 run blocks
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/hepta-inference-inf0c-real-services-arm-v6.yml" \
            "$RUNNER_TEMP/hepta-inf0c-v7-steps.sh" <<'PY'
          import pathlib,sys,yaml
          source=pathlib.Path(sys.argv[1]); target=pathlib.Path(sys.argv[2])
          value=yaml.safe_load(source.read_text())
          selected=False; blocks=[]
          for step in value['jobs']['closure']['steps']:
              name=step.get('name','')
              if name == 'Verify classifier and strict SSE fault fixtures':
                  selected=True
              if name == 'Upload complete INF-0C real-service evidence':
                  break
              if selected and isinstance(step.get('run'),str):
                  blocks.append((name,step['run']))
          required={
              'Verify classifier and strict SSE fault fixtures',
              'Stabilize LM Studio CLI and explicitly provision exact GGUF',
              'Execute exact tuple tool-call and strict SSE capability classification',
              'Execute bounded disconnect and controlled restart qualification',
              'Classify explicit provider cancellation without overclaiming ACK',
              'Build exact hardware and latency qualification receipt',
              'Require complete INF-0C evidence set',
          }
          names={name for name,_ in blocks}
          if not required.issubset(names):
              raise SystemExit(f'audited step set drift: {sorted(required-names)}')
          with target.open('w') as out:
              out.write('#!/usr/bin/env bash\nset -euo pipefail\n')
              for index,(name,block) in enumerate(blocks,1):
                  out.write(f"echo '=== v7 audited step {index}: {name}'\n")
                  out.write('(\nset -euo pipefail\n')
                  out.write(block)
                  out.write('\n)\n')
                  out.write('if [[ -s "$GITHUB_ENV" ]]; then set -a; source "$GITHUB_ENV"; set +a; fi\n')
          target.chmod(0o500)
          PY
          bash -n "$RUNNER_TEMP/hepta-inf0c-v7-steps.sh"

      - name: Execute complete audited INF-0C contract
        shell: bash
        run: "$RUNNER_TEMP/hepta-inf0c-v7-steps.sh"

      - name: Upload complete real-service evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-inf0c-real-services-v7-${{ env.CANDIDATE_RECEIPT }}
          path: |
            ${{ runner.temp }}/hepta-inf0c
            ${{ runner.temp }}/hepta-inf0c-capability-selftest.txt
            ${{ runner.temp }}/hepta-inf0c-cancel-v3-source-sha256.txt
          if-no-files-found: warn
          retention-days: 14
