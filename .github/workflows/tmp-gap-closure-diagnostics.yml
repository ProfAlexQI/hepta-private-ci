name: Temporary Hepta gap-closure diagnostics

on:
  push:
    branches:
      - codex/hepta-gap-closure-diagnostics-20260904

permissions:
  contents: read

concurrency:
  group: hepta-gap-closure-diagnostics
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Verify new product crates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cargo metadata --manifest-path codex-rs/Cargo.toml --locked --format-version 1 --no-deps >/tmp/metadata.json
          cargo fmt --manifest-path codex-rs/Cargo.toml \
            --package codex-hepta-types \
            --package codex-hepta-wire \
            --package codex-hepta-operations \
            -- --check
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-types -p codex-hepta-wire -p codex-hepta-operations
          cargo check --manifest-path codex-rs/Cargo.toml --locked --all-targets \
            -p codex-hepta-types -p codex-hepta-wire -p codex-hepta-operations
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked --all-targets \
            -p codex-hepta-types -p codex-hepta-wire -p codex-hepta-operations -- -D warnings

  bazel-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: gap-closure-diagnostic

      - name: Generate exact lock candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hepta-diagnostics
          set +e
          ./scripts/check-module-bazel-lock.sh >.hepta-diagnostics/before.log 2>&1
          printf '%s\n' "$?" >.hepta-diagnostics/before.exit
          just bazel-lock-update >.hepta-diagnostics/update.log 2>&1
          printf '%s\n' "$?" >.hepta-diagnostics/update.exit
          ./scripts/check-module-bazel-lock.sh >.hepta-diagnostics/after.log 2>&1
          printf '%s\n' "$?" >.hepta-diagnostics/after.exit
          set -e
          cp MODULE.bazel.lock .hepta-diagnostics/MODULE.bazel.lock
          git diff --stat -- MODULE.bazel.lock >.hepta-diagnostics/stat.txt

      - name: Retain lock diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-gap-closure-bazel-lock-${{ github.sha }}
          path: .hepta-diagnostics
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
