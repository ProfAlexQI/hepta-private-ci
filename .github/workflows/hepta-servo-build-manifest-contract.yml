name: hepta Servo worker build manifest contract

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/hepta-servo-build-manifest.py"
      - "scripts/hepta_servo_build_manifest_core.py"
      - "scripts/hepta_servo_build_manifest_io.py"
      - "scripts/verify-hepta-servo-build-manifest-contract.py"
      - "scripts/tests/test_hepta_servo_build_manifest.py"
      - "docs/hepta-vnext/browser/C1_BUILD_MANIFEST*"
      - "docs/hepta-vnext/browser/hepta.servo.worker_build_manifest.v1.schema.json"
      - ".github/workflows/hepta-servo-build-manifest-contract.yml"
      - ".github/workflows/blocking-ci.yml"
  push:
    branches: [integration/vnext-main-20260811, "codex/hepta-*"]
    paths:
      - "scripts/hepta-servo-build-manifest.py"
      - "scripts/hepta_servo_build_manifest_core.py"
      - "scripts/hepta_servo_build_manifest_io.py"
      - "scripts/verify-hepta-servo-build-manifest-contract.py"
      - "scripts/tests/test_hepta_servo_build_manifest.py"
      - "docs/hepta-vnext/browser/C1_BUILD_MANIFEST*"
      - "docs/hepta-vnext/browser/hepta.servo.worker_build_manifest.v1.schema.json"
      - ".github/workflows/hepta-servo-build-manifest-contract.yml"
      - ".github/workflows/blocking-ci.yml"

permissions:
  contents: read

jobs:
  build-manifest-contract:
    name: Build manifest contract (fixture inputs only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Initialize negative-authority posture
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/hepta-servo-build-manifest-contract"
          mkdir -p "$evidence_dir"
          echo "HEPTA_BUILD_MANIFEST_EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "work_item=C1-004B-1"
            echo "fixture_inputs=true"
            echo "servo_fetch_performed=false"
            echo "servo_build_performed=false"
            echo "real_build_manifest=false"
            echo "worker_artifact_built=false"
            echo "sbom_fixture_only=true"
            echo "runtime_authority=false"
            echo "production_caller=false"
            echo "production_writer=false"
            echo "effect_authority=false"
            echo "external_effect=false"
            echo "external_network_allowed=false"
            echo "credential_export_allowed=false"
            echo "operator_acceptance=false"
            echo "promotion=false"
            echo "release_qualified=false"
          } > "$evidence_dir/posture.txt"
      - name: Compile Python tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/hepta-servo-build-manifest.py \
            scripts/hepta_servo_build_manifest_core.py \
            scripts/hepta_servo_build_manifest_io.py \
            scripts/verify-hepta-servo-build-manifest-contract.py \
            scripts/tests/test_hepta_servo_build_manifest.py \
            2>&1 | tee "$HEPTA_BUILD_MANIFEST_EVIDENCE_DIR/py-compile.log"
      - name: Verify build-manifest contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-hepta-servo-build-manifest-contract.py \
            2>&1 | tee "$HEPTA_BUILD_MANIFEST_EVIDENCE_DIR/contract.log"
      - name: Run fixture-input tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_hepta_servo_build_manifest.py -v \
            2>&1 | tee "$HEPTA_BUILD_MANIFEST_EVIDENCE_DIR/tests.log"
      - name: Verify clean governed paths
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            scripts/hepta-servo-build-manifest.py \
            scripts/hepta_servo_build_manifest_core.py \
            scripts/hepta_servo_build_manifest_io.py \
            scripts/verify-hepta-servo-build-manifest-contract.py \
            scripts/tests/test_hepta_servo_build_manifest.py \
            docs/hepta-vnext/browser \
            .github/workflows/hepta-servo-build-manifest-contract.yml \
            2>&1 | tee "$HEPTA_BUILD_MANIFEST_EVIDENCE_DIR/clean-worktree.log"
      - name: Record final status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "job_status=${{ job.status }}" >> "$HEPTA_BUILD_MANIFEST_EVIDENCE_DIR/posture.txt"
          {
            echo "### Hepta Servo worker build-manifest contract"
            echo
            echo "This job uses fixture source/SBOM/license inputs only."
            echo "It does not fetch, build, link, execute, sandbox, or qualify Servo."
            echo
            sed 's/^/- /' "$HEPTA_BUILD_MANIFEST_EVIDENCE_DIR/posture.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-servo-build-manifest-contract
          path: ${{ env.HEPTA_BUILD_MANIFEST_EVIDENCE_DIR }}
          if-no-files-found: error
