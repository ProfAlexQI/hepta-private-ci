name: sdk

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python-sdk:
    name: python-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"

      - name: Verify hosted Python SDK toolchain
        shell: bash
        run: |
          set -euo pipefail
          python --version
          uv --version

      - name: python-sdk tests
        run: uv run --directory sdk/python pytest

  sdks:
    name: sdks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0

      - name: Activate pinned pnpm and verify hosted SDK toolchain
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          node --version
          pnpm --version
          python --version
          uv --version
          just --version

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run SDK tests
        run: |
          just test-client-generators
          just test-client-generators-stub-crate
          pnpm --dir sdk/typescript test

      - name: Check schemas are up to date
        run: |
          uv run --directory sdk/python ./scripts/generate_responses.py --schemas ../../codex-rs/app-server-protocol/schema/json/ --out responses
          uv run --directory sdk/python ./scripts/generate_app_server_protocol.py --schemas ../../codex-rs/app-server-protocol/schema/json/ --out codex_app_server
          git diff --exit-code
