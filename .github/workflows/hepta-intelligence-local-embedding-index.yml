name: hepta-intelligence-local-embedding-index

on:
  push:
    branches:
      - "codex/hepta-intelligence-local-embedding-index-v1b-*"
  pull_request:
    paths:
      - "codex-rs/hepta-memory-p1-1b-qualification/**"
      - "scripts/verify-hepta-intelligence-local-embedding-index.py"
      - "plans/hepta-intelligence/HEPTA_INTELLIGENCE_P1_1B_LOCAL_EMBEDDING_INDEX_2026-08-28.md"
      - "plans/hepta-intelligence/HEPTA_INTELLIGENCE_P1_1B_IMPLEMENTATION_RECEIPT_2026-08-28.json"
      - "plans/hepta-intelligence/HEPTA_INTELLIGENCE_EXECUTION_STATUS_V2.json"
      - ".github/workflows/hepta-intelligence-local-embedding-index.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-intelligence-local-embedding-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: P1.1b local embedding/index source contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Validate Python and machine documents
        run: |
          python3 -m py_compile scripts/verify-hepta-intelligence-local-embedding-index.py
          python3 -m json.tool \
            plans/hepta-intelligence/HEPTA_INTELLIGENCE_EXECUTION_STATUS_V2.json \
            >/dev/null
          python3 -m json.tool \
            plans/hepta-intelligence/HEPTA_INTELLIGENCE_P1_1B_IMPLEMENTATION_RECEIPT_2026-08-28.json \
            >/dev/null

      - name: Run fail-closed P1.1b source gate
        run: |
          set -o pipefail
          mkdir -p artifacts/hepta-intelligence-local-embedding-index
          python3 scripts/verify-hepta-intelligence-local-embedding-index.py \
            | tee artifacts/hepta-intelligence-local-embedding-index/source-gate.json

      - name: Verify negative authority boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path("artifacts/hepta-intelligence-local-embedding-index/source-gate.json")
              .read_text(encoding="utf-8")
          )
          assert receipt["status"] == "PASS_P1_1B_LOCAL_EMBEDDING_INDEX_SOURCE_ONLY"
          for key in (
              "wired",
              "qualified",
              "product_workspace_member",
              "product_module_registered",
              "default_recall_changed",
              "federation_recall_changed",
              "context_attachment",
              "physical_send",
              "remote_embedding",
              "model_download",
              "network_access",
              "external_effects",
              "production_authority",
              "operator_acceptance",
              "promotion",
              "callers_ratchet",
              "efficacy_validation",
          ):
              assert receipt[key] is False, key
          PY

      - name: Upload source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-intelligence-p1-1b-source-${{ github.sha }}
          path: artifacts/hepta-intelligence-local-embedding-index/source-gate.json
          if-no-files-found: error
          retention-days: 14

  rust-qualification:
    name: P1.1b isolated Rust qualification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt,clippy

      - name: Verify repository toolchain pin
        working-directory: codex-rs
        run: |
          expected="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel'])
          PY
          )"
          actual="$(rustc --version | awk '{print $2}')"
          test "$actual" = "$expected"

      - name: Check isolated crate formatting
        run: |
          cargo fmt --manifest-path codex-rs/hepta-memory-p1-1b-qualification/Cargo.toml --all -- --check

      - name: Run P1.1b unit and integration tests
        run: |
          cargo test --manifest-path codex-rs/hepta-memory-p1-1b-qualification/Cargo.toml --all-targets -- --nocapture

      - name: Check all isolated targets
        run: |
          cargo check --manifest-path codex-rs/hepta-memory-p1-1b-qualification/Cargo.toml --all-targets

      - name: Run strict isolated Clippy
        run: |
          cargo clippy --manifest-path codex-rs/hepta-memory-p1-1b-qualification/Cargo.toml --all-targets -- -D warnings
