name: Hepta architecture convergence P0.2 bootstrap

on:
  push:
    branches:
      - codex/hepta-architecture-convergence-p0-2-20260828
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-architecture-convergence-p0-2-bootstrap
  cancel-in-progress: true

jobs:
  rustfmt-and-verify:
    name: Guarded rustfmt and executable verification
    if: ${{ !contains(github.event.head_commit.message || '', '[hepta-rustfmt-bootstrap]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify exact input identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/hepta-architecture-convergence-p0-2-20260828
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --count HEAD^..HEAD)" = 1

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Apply deterministic owned-package rustfmt
        working-directory: codex-rs
        run: |
          cargo fmt \
            -p codex-hepta-contracts \
            -p codex-hepta-memory \
            -p codex-hepta-agentd

      - name: Enforce formatting allowlist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import subprocess

          allowed = {
              "codex-rs/hepta-contracts/src/authority.rs",
              "codex-rs/hepta-contracts/src/lib.rs",
              "codex-rs/hepta-contracts/src/operation.rs",
              "codex-rs/hepta-contracts/src/product_graph.rs",
              "codex-rs/hepta-memory/src/cognitive_runtime.rs",
              "codex-rs/hepta-agentd/src/app_runtime.rs",
              "codex-rs/hepta-agentd/src/composition.rs",
              "codex-rs/hepta-agentd/src/runtime.rs",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "--diff-filter=ACMRTUXB"],
                  text=True,
              ).splitlines()
          )
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"rustfmt escaped the owned-path allowlist: {unexpected}")
          for path in changed:
              if not pathlib.Path(path).is_file():
                  raise SystemExit(f"formatted path is not a regular file: {path}")
          PY
          git diff --check

      - name: Canonical architecture source gate
        run: python3 scripts/verify-hepta-architecture-convergence-p0-2.py

      - name: Authority and operation tests
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-hepta-contracts authority::tests -- --nocapture
          cargo test --locked -p codex-hepta-contracts operation::tests -- --nocapture
          cargo test --locked -p codex-hepta-contracts product_graph::tests -- --nocapture

      - name: Memory and Agentd integration tests
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-hepta-memory cognitive_runtime::authority_tests -- --nocapture
          cargo test --locked -p codex-hepta-agentd composition::tests -- --nocapture
          cargo test --locked -p codex-hepta-agentd app_runtime::tests -- --nocapture

      - name: Product package graph compilation
        working-directory: codex-rs
        run: |
          cargo check --locked \
            -p codex-hepta-agentd \
            -p codex-hepta-supervisor \
            -p codex-hepta-matrixd \
            -p codex-hepta-native-gateway

      - name: Strict owned-package Clippy
        working-directory: codex-rs
        run: |
          cargo clippy --locked --all-targets \
            -p codex-hepta-contracts \
            -p codex-hepta-memory \
            -p codex-hepta-agentd \
            -- -D warnings

      - name: Commit only deterministic formatting
        shell: bash
        env:
          BRANCH_NAME: codex/hepta-architecture-convergence-p0-2-20260828
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No rustfmt delta."
            exit 0
          fi
          git config user.name "Hepta qualification bootstrap"
          git config user.email "102159240+ProfAlexQI@users.noreply.github.com"
          git add \
            codex-rs/hepta-contracts/src/authority.rs \
            codex-rs/hepta-contracts/src/lib.rs \
            codex-rs/hepta-contracts/src/operation.rs \
            codex-rs/hepta-contracts/src/product_graph.rs \
            codex-rs/hepta-memory/src/cognitive_runtime.rs \
            codex-rs/hepta-agentd/src/app_runtime.rs \
            codex-rs/hepta-agentd/src/composition.rs \
            codex-rs/hepta-agentd/src/runtime.rs
          git diff --cached --check
          git commit -m "style(hepta): apply deterministic rustfmt [hepta-rustfmt-bootstrap]"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
