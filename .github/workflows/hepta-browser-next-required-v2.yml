name: hepta-browser superseded aggregate (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  superseded:
    name: Superseded by Hepta Browser next required v9
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record provenance-only status
        shell: bash
        run: |
          set -euo pipefail
          echo '{"status":"SUPERSEDED_MANUAL_ONLY","canonical_workflow":".github/workflows/hepta-browser-next-required-v9.yml","exact_servo_source_accepted":false,"worker_source_topology_accepted":false,"build_authorized":false,"servo_runtime_qualified":false,"authority":"all_false"}'
