name: hepta-intelligence-p1-1b-bounded-decode-promote

on:
  push:
    branches:
      - "qualification/hepta-intelligence-p1-1b-bounded-decode-promote-e6cded3-20260828"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-intelligence-p1-1b-bounded-decode-promote-e6cded3
  cancel-in-progress: false

env:
  SOURCE_SHA: e6cded3099ec53c1b6de36bf7b389ff30a8d3718
  WRAPPER_PATH: .github/workflows/hepta-intelligence-p1-1b-bounded-decode-promote.yml
  OUTPUT_BRANCH: qualification/hepta-intelligence-p1-1b-bounded-decode-output-v3-e6cded3-20260828
  CANONICAL_BRANCH: codex/hepta-intelligence-local-embedding-index-v1b-20260828
  CRATE_ROOT: codex-rs/hepta-memory-p1-1b-qualification
  MANIFEST_PATH: codex-rs/hepta-memory-p1-1b-qualification/Cargo.toml
  VERIFIER_PATH: scripts/verify-hepta-intelligence-local-embedding-index.py
  ARTIFACT_DIR: artifacts/hepta-intelligence-p1-1b-bounded-decode-promotion
  CARGO_NET_OFFLINE: "true"

jobs:
  promote:
    name: P1.1b bounded decoder exact promotion
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout promotion wrapper
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify wrapper and exact candidate ancestry
        id: candidate
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git rev-list --count "$SOURCE_SHA"..HEAD)" = "1"
          test "$(git diff --name-only "$SOURCE_SHA"..HEAD)" = "$WRAPPER_PATH"

          git fetch --no-tags origin \
            "+refs/heads/$OUTPUT_BRANCH:refs/remotes/origin/$OUTPUT_BRANCH" \
            "+refs/heads/$CANONICAL_BRANCH:refs/remotes/origin/$CANONICAL_BRANCH"
          output_sha="$(git rev-parse "refs/remotes/origin/$OUTPUT_BRANCH")"
          canonical_sha="$(git rev-parse "refs/remotes/origin/$CANONICAL_BRANCH")"
          test "$canonical_sha" = "$SOURCE_SHA"
          test "$(git rev-parse "$output_sha^")" = "$SOURCE_SHA"
          test "$(git rev-list --count "$SOURCE_SHA".."$output_sha")" = "1"

          python3 - "$SOURCE_SHA" "$output_sha" "$canonical_sha" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          source, output, canonical = sys.argv[1:]
          expected = [
              "codex-rs/hepta-memory-p1-1b-qualification/src/index.rs",
              "codex-rs/hepta-memory-p1-1b-qualification/src/index/build.rs",
              "codex-rs/hepta-memory-p1-1b-qualification/src/index/impl.rs",
              "codex-rs/hepta-memory-p1-1b-qualification/src/index/tests_module.rs",
              "codex-rs/hepta-memory-p1-1b-qualification/src/index/types.rs",
              "scripts/verify-hepta-intelligence-local-embedding-index.py",
          ]
          actual = subprocess.check_output(
              ["git", "diff", "--name-only", f"{source}..{output}"], text=True
          ).splitlines()
          if actual != expected:
              raise SystemExit(json.dumps({"expected": expected, "actual": actual}, indent=2))
          receipt = {
              "schema": "hepta.intelligence.p1_1b.bounded_decode_candidate_audit.v1",
              "source_commit": source,
              "candidate_commit": output,
              "canonical_before": canonical,
              "single_parent": True,
              "single_commit": True,
              "changed_paths": actual,
              "runtime_wired": False,
              "production_authority": False,
          }
          artifact_dir = Path("artifacts/hepta-intelligence-p1-1b-bounded-decode-promotion")
          (artifact_dir / "candidate-audit.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          echo "sha=$output_sha" >> "$GITHUB_OUTPUT"
          git checkout --detach "$output_sha"

      - name: Isolate Cargo outputs and install Rust 1.95.0
        run: |
          set -euo pipefail
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/hepta-p1-1b-bounded-promote-target" >> "$GITHUB_ENV"
          rm -f "$CRATE_ROOT/Cargo.lock"
          rm -rf "$CRATE_ROOT/target"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt,clippy

      - name: Run exact candidate gate matrix
        run: |
          set -o pipefail
          rustc --version | tee "$ARTIFACT_DIR/rustc-version.txt"
          cargo --version | tee "$ARTIFACT_DIR/cargo-version.txt"
          rustfmt --version | tee "$ARTIFACT_DIR/rustfmt-version.txt"
          cargo clippy --version | tee "$ARTIFACT_DIR/clippy-version.txt"
          test "$(rustc --version | awk '{print $2}')" = "1.95.0"

          python3 "$VERIFIER_PATH" 2>&1 | tee "$ARTIFACT_DIR/source-gate.log"
          cargo fmt --manifest-path "$MANIFEST_PATH" --all -- --check \
            2>&1 | tee "$ARTIFACT_DIR/rustfmt.log"
          cargo test --manifest-path "$MANIFEST_PATH" --all-targets -- --nocapture \
            2>&1 | tee "$ARTIFACT_DIR/tests.log"
          cargo check --manifest-path "$MANIFEST_PATH" --all-targets \
            2>&1 | tee "$ARTIFACT_DIR/check.log"
          cargo clippy --manifest-path "$MANIFEST_PATH" --all-targets -- -D warnings \
            2>&1 | tee "$ARTIFACT_DIR/clippy.log"

          python3 - <<'PY'
          import re
          from pathlib import Path

          log = Path("artifacts/hepta-intelligence-p1-1b-bounded-decode-promotion/tests.log").read_text(
              encoding="utf-8", errors="replace"
          )
          passed = sum(int(value) for value in re.findall(r"test result: ok\. (\d+) passed", log))
          if passed != 15:
              raise SystemExit(f"expected 15 tests, observed {passed}")
          PY

          rm -f "$CRATE_ROOT/Cargo.lock"
          rm -rf "$CRATE_ROOT/target"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Recheck canonical lease and fast-forward without force
        env:
          OUTPUT_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$CANONICAL_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$OUTPUT_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          git push origin "HEAD:refs/heads/$CANONICAL_BRANCH"

      - name: Write promotion receipt
        env:
          OUTPUT_SHA: ${{ steps.candidate.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact_dir = Path(os.environ["ARTIFACT_DIR"])
          receipt = {
              "schema": "hepta.intelligence.p1_1b.bounded_decode_promotion.v1",
              "status": "PASS_P1_1B_BOUNDED_DECODE_FAST_FORWARD",
              "source_commit": os.environ["SOURCE_SHA"],
              "promoted_commit": os.environ["OUTPUT_SHA"],
              "canonical_branch": os.environ["CANONICAL_BRANCH"],
              "tests_passed": 15,
              "gates": {
                  "candidate_ancestry": "success",
                  "changed_path_allowlist": "success",
                  "source_gate": "success",
                  "rustfmt": "success",
                  "tests": "success",
                  "check": "success",
                  "clippy": "success",
                  "clean_tree": "success",
                  "canonical_lease": "success",
                  "non_force_fast_forward": "success",
              },
              "runner": {
                  "name": os.environ["RUNNER_NAME"],
                  "os": os.environ["RUNNER_OS"],
                  "arch": os.environ["RUNNER_ARCH"],
              },
              "workflow": {
                  "run_id": int(os.environ["RUN_ID"]),
                  "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              },
              "qualified": False,
              "runtime_wired": False,
              "default_recall_changed": False,
              "federation_recall_changed": False,
              "context_attachment": False,
              "physical_send": False,
              "external_effects": False,
              "production_authority": False,
              "operator_acceptance": False,
              "promotion": False,
              "callers_ratchet": False,
          }
          (artifact_dir / "promotion-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          summary = [
              "## P1.1b bounded decoder promotion",
              "",
              f"- Source: `{receipt['source_commit']}`",
              f"- Promoted: `{receipt['promoted_commit']}`",
              "- Exact gates: source/fmt/15 tests/check/Clippy/clean-tree PASS",
              "- Push mode: non-force fast-forward with source lease",
              "- Overall `qualified` remains `false`; runtime and authority remain disabled.",
          ]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(summary) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: hepta-intelligence-p1-1b-bounded-decode-promotion-${{ github.sha }}
          path: artifacts/hepta-intelligence-p1-1b-bounded-decode-promotion
          if-no-files-found: error
          retention-days: 14
