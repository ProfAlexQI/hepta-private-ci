name: Hepta Intelligence A0 + Q0.14 exact diagnostic

on:
  push:
    branches:
      - "diagnostic/hepta-intelligence-a0-q0-13-exact-20260830"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-intelligence-a0-q0-14-exact
  cancel-in-progress: true

env:
  EXPECTED_REPOSITORY: ProfHepta/hepta-private-ci
  EXPECTED_HEAD: 0c238342c77e667928a8ed1ea57e47c5d87b14d0
  EXPECTED_TREE: c6e70d7794b467efd3d0fab1c7795a7ad1b9fd14
  EXPECTED_FIRST_PARENT: 73a636867dbebc2dd4bdf957c9c6ff3eb0ea9358
  EXPECTED_SECOND_PARENT: 695f64119f5eca58dbd5ef2c3047dde00c03afd7
  EXPECTED_SYNTHETIC_MERGE: db9986f701566971b4b44e0e5d279b3f4c783e84
  EXPECTED_SYNTHETIC_TREE: c6e70d7794b467efd3d0fab1c7795a7ad1b9fd14
  Q0_13_HEAD: 7a7380578f67412d79218909d975d710b96cf686
  REPORT_DIR: /tmp/hepta-intelligence-a0-q0-14-exact
  PYTHONPYCACHEPREFIX: /tmp/hepta-intelligence-python-cache

jobs:
  exact-control-and-toolchain-gates:
    name: Exact Q0.14 source and Windows toolchain analysis
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact integration candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact head, tree, parents and signed synthetic merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$REPORT_DIR"
          mkdir -p "$REPORT_DIR"
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          read -r first second extra <<< "$(git show -s --format=%P HEAD)"
          test "$first" = "$EXPECTED_FIRST_PARENT"
          test "$second" = "$EXPECTED_SECOND_PARENT"
          test -z "${extra:-}"

          git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" \
            fetch --no-tags --depth=2 \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            refs/pull/93/merge
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SYNTHETIC_MERGE"
          test "$(git rev-parse FETCH_HEAD^{tree})" = "$EXPECTED_SYNTHETIC_TREE"
          read -r merge_base merge_head merge_extra <<< "$(git show -s --format=%P FETCH_HEAD)"
          test "$merge_base" = "$EXPECTED_FIRST_PARENT"
          test "$merge_head" = "$EXPECTED_HEAD"
          test -z "${merge_extra:-}"

          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "candidate_head=$(git rev-parse HEAD)"
            echo "candidate_tree=$(git rev-parse HEAD^{tree})"
            echo "candidate_parents=$(git show -s --format=%P HEAD)"
            echo "synthetic_merge=$(git rev-parse FETCH_HEAD)"
            echo "synthetic_tree=$(git rev-parse FETCH_HEAD^{tree})"
            echo "synthetic_parents=$(git show -s --format=%P FETCH_HEAD)"
          } > "$REPORT_DIR/identity.txt"

      - name: Verify all canonical A0 blobs remain exact
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$EXPECTED_FIRST_PARENT" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          a0 = sys.argv[1]
          root = pathlib.Path.cwd()
          candidate = json.loads(
              (root / "plans/hepta-intelligence/HEPTA_INTELLIGENCE_INTEGRATION_CANDIDATE_V1.json").read_text(
                  encoding="utf-8"
              )
          )
          paths = candidate["allowed_changed_paths"]
          if len(paths) != 17 or len(set(paths)) != 17:
              raise SystemExit(f"unexpected A0 allowlist: {paths!r}")
          for path in paths:
              current = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:{path}"], text=True
              ).strip()
              canonical = subprocess.check_output(
                  ["git", "rev-parse", f"{a0}:{path}"], text=True
              ).strip()
              if current != canonical:
                  raise SystemExit(f"A0 blob drift: {path}: {current} != {canonical}")
          print("PASS_A0_BLOB_IDENTITY")
          PY

      - name: Verify Q0.14 immutable core and source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:.github/scripts/run-bazel-ci-core.sh)" = \
            "$(git rev-parse "$Q0_13_HEAD:.github/scripts/run-bazel-ci.sh")"
          bash -n .github/scripts/run-bazel-ci.sh
          bash -n .github/scripts/run-bazel-ci-core.sh
          python3 -m py_compile \
            .github/scripts/run_bazel_with_buildbuddy.py \
            .github/scripts/test_run_bazel_with_buildbuddy.py \
            .github/scripts/test_run_bazel_local_windows_fallback.py \
            .github/scripts/test_run_bazel_ci_wrapper.py
          python3 - <<'PY'
          from pathlib import Path

          wrapper = Path(".github/scripts/run-bazel-ci.sh").read_text(encoding="utf-8")
          required = [
              "--config=ci-windows",
              "--host_platform=//:local_windows_msvc",
              "--platforms=//:windows_x86_64_gnullvm",
              "--extra_execution_platforms=//:windows_x86_64_msvc",
              "--extra_toolchains=//:windows_gnullvm_tests_on_msvc_host_toolchain",
              "--strategy=TestRunner=local",
              "--strategy=V8Mksnapshot=local",
              "--build_metadata=TAG_windows_gnullvm_local=true",
          ]
          for token in required:
              if token not in wrapper:
                  raise SystemExit(f"missing Q0.14 token: {token}")
          print("PASS_Q0_14_SOURCE_CONTRACT")
          PY

      - name: Run all Bazel launcher regressions
        shell: bash
        run: |
          set -euo pipefail
          (
            cd .github/scripts
            python3 -m unittest -v \
              test_run_bazel_with_buildbuddy.py \
              test_run_bazel_local_windows_fallback.py \
              test_run_bazel_ci_wrapper.py
          ) 2>&1 | tee "$REPORT_DIR/bazel-launcher-tests.txt"

      - name: Execute canonical Hepta Intelligence source validators
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/hepta-intelligence-current-truth.py \
            scripts/hepta-intelligence-status-compat.py \
            scripts/verify-hepta-intelligence-document-authority.py \
            scripts/verify-hepta-intelligence-master-plan.py
          python3 scripts/verify-hepta-intelligence-master-plan.py
          python3 scripts/verify-hepta-intelligence-document-authority.py
          python3 scripts/hepta-intelligence-current-truth.py --verify
          for tranche in P0.2 P0.3 P0.4a P0.4b P0.4c; do
            python3 scripts/hepta-intelligence-status-compat.py "$tranche" --check-only
          done

      - name: Set up Bazel analysis environment
        uses: ./.github/actions/setup-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu

      - name: Verify patched module lock
        shell: bash
        run: |
          set -euo pipefail
          scripts/check-module-bazel-lock.sh
          git diff --exit-code -- MODULE.bazel.lock

      - name: Compare mixed-host and all-gnullvm Windows toolchain analysis
        shell: bash
        run: |
          set -euo pipefail
          target=//codex-rs/utils/rustls-provider:rustls-provider-provider-test
          mixed_log="$REPORT_DIR/mixed-msvc-host-gnullvm-target.log"
          gnullvm_log="$REPORT_DIR/all-gnullvm-host-target.log"

          set +e
          bazel --noexperimental_remote_repo_contents_cache build \
            --nobuild \
            --host_platform=//:windows_x86_64_msvc \
            --platforms=//:windows_x86_64_gnullvm \
            --extra_execution_platforms=//:windows_x86_64_msvc \
            --extra_toolchains=//:windows_gnullvm_tests_on_msvc_host_toolchain \
            "$target" 2>&1 | tee "$mixed_log"
          mixed_status=${PIPESTATUS[0]}

          bazel --noexperimental_remote_repo_contents_cache build \
            --nobuild \
            --host_platform=//:windows_x86_64_gnullvm \
            --platforms=//:windows_x86_64_gnullvm \
            "$target" 2>&1 | tee "$gnullvm_log"
          gnullvm_status=${PIPESTATUS[0]}
          set -e

          {
            echo "mixed_msvc_host_gnullvm_target_status=$mixed_status"
            echo "all_gnullvm_status=$gnullvm_status"
          } > "$REPORT_DIR/toolchain-analysis-status.txt"
          test "$mixed_status" -eq 0

      - name: Verify clean exact checkout and emit negative authority receipt
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=normal --ignore-submodules=none)"
          {
            echo "completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "job_status=${{ job.status }}"
            echo "source_writeback=false"
            echo "a0_candidate_qualified=false"
            echo "selected=false"
            echo "full_repository_merge_green=false"
            echo "runtime_authority=false"
            echo "production_authority=false"
            echo "promotion=false"
            echo "release=false"
          } > "$REPORT_DIR/outcome.txt"

      - name: Upload exact diagnostic evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4
        with:
          name: hepta-intelligence-a0-q0-14-exact-${{ github.run_id }}
          path: /tmp/hepta-intelligence-a0-q0-14-exact/**
          if-no-files-found: error
          retention-days: 30
