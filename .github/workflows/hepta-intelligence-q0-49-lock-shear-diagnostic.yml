name: Hepta Intelligence Q0.49 lock and shear diagnostic

on:
  push:
    branches:
      - diagnostic/hepta-intelligence-q0-49-lock-shear-20260830

permissions:
  contents: read

concurrency:
  group: hepta-intelligence-q0-49-lock-shear
  cancel-in-progress: true

jobs:
  lock-shear:
    name: lock/shear diagnostic on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-24.04
            bazel_target: x86_64-unknown-linux-gnu
            run_deny: true
          - name: aarch64
            runner: ubuntu-24.04-arm
            bazel_target: aarch64-unknown-linux-gnu
            run_deny: false
    env:
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_BASE: f2f200969fa0076178276bceab2eb21d23f0519e
      ARTIFACT_DIR: artifacts/q049-${{ matrix.name }}

    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source and diagnostic-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_BASE" HEAD
          mapfile -t changed < <(
            git diff --name-only --no-renames "$SOURCE_BASE" HEAD
          )
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/hepta-intelligence-q0-49-lock-shear-diagnostic.yml|\
              plans/hepta-intelligence/HEPTA_INTELLIGENCE_Q0_49_LOCK_DIAGNOSTIC_TRIGGER.txt)
                ;;
              *)
                echo "unexpected diagnostic path: $path" >&2
                exit 1
                ;;
            esac
          done
          git diff --check "$SOURCE_BASE" HEAD

      - name: Install repository CI prerequisites
        uses: ./.github/actions/setup-ci

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt,clippy

      - name: Install pinned cargo-shear
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-shear@1.11.2

      - name: Install pinned cargo-deny
        if: ${{ matrix.run_deny }}
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-deny@0.19.0

      - name: Generate exact Cargo lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          cp codex-rs/Cargo.lock "$ARTIFACT_DIR/Cargo.lock.before"

          set +e
          cargo +1.95.0 metadata \
            --manifest-path codex-rs/Cargo.toml \
            --format-version=1 \
            --locked \
            >"$ARTIFACT_DIR/metadata-locked-before.json" \
            2>"$ARTIFACT_DIR/metadata-locked-before.stderr"
          metadata_before_rc=$?
          set -e
          printf '%s\n' "$metadata_before_rc" \
            >"$ARTIFACT_DIR/metadata-locked-before.rc"

          cargo +1.95.0 generate-lockfile \
            --manifest-path codex-rs/Cargo.toml \
            >"$ARTIFACT_DIR/generate-lockfile.stdout" \
            2>"$ARTIFACT_DIR/generate-lockfile.stderr"
          cp codex-rs/Cargo.lock "$ARTIFACT_DIR/Cargo.lock.generated"
          git diff -- codex-rs/Cargo.lock \
            >"$ARTIFACT_DIR/Cargo.lock.diff"

          cargo +1.95.0 metadata \
            --manifest-path codex-rs/Cargo.toml \
            --format-version=1 \
            --locked \
            >"$ARTIFACT_DIR/metadata-locked-after.json" \
            2>"$ARTIFACT_DIR/metadata-locked-after.stderr"

          {
            echo "head=$SOURCE_SHA"
            echo "source_base=$SOURCE_BASE"
            echo "runner_arch=$RUNNER_ARCH"
            echo "metadata_locked_before_rc=$metadata_before_rc"
            echo "cargo_lock_sha256=$(sha256sum codex-rs/Cargo.lock | awk '{print $1}')"
          } >"$ARTIFACT_DIR/summary.env"

      - name: Exercise precise cargo-shear dispositions
        shell: bash
        run: |
          set -euo pipefail

          set +e
          (
            cd codex-rs
            cargo +1.95.0 shear --deny-warnings
          ) >"$ARTIFACT_DIR/shear-baseline.log" 2>&1
          shear_baseline_rc=$?
          set -e

          python3 - <<'PY'
          from pathlib import Path

          dispositions = {
              Path("codex-rs/hepta-automation/Cargo.toml"): "sha2",
              Path("codex-rs/hepta-contracts/Cargo.toml"): "pretty_assertions",
              Path("codex-rs/hepta-fleet/Cargo.toml"): "pretty_assertions",
          }
          for path, dependency in dispositions.items():
              text = path.read_text(encoding="utf-8")
              if "[package.metadata.cargo-shear]" in text:
                  raise SystemExit(f"pre-existing cargo-shear metadata: {path}")
              path.write_text(
                  text.rstrip()
                  + "\n\n[package.metadata.cargo-shear]\n"
                  + f'ignored = ["{dependency}"]\n',
                  encoding="utf-8",
              )
          PY

          git diff -- \
            codex-rs/hepta-automation/Cargo.toml \
            codex-rs/hepta-contracts/Cargo.toml \
            codex-rs/hepta-fleet/Cargo.toml \
            >"$ARTIFACT_DIR/shear-dispositions.diff"

          set +e
          (
            cd codex-rs
            cargo +1.95.0 shear --deny-warnings
          ) >"$ARTIFACT_DIR/shear-dispositions.log" 2>&1
          shear_dispositions_rc=$?

          cargo +1.95.0 check \
            --manifest-path codex-rs/Cargo.toml \
            --locked \
            --all-targets \
            -p codex-hepta-automation \
            -p codex-hepta-contracts \
            -p codex-hepta-fleet \
            >"$ARTIFACT_DIR/focused-check.log" 2>&1
          focused_check_rc=$?

          cargo +1.95.0 test \
            --manifest-path codex-rs/Cargo.toml \
            --locked \
            --no-run \
            -p codex-hepta-automation \
            -p codex-hepta-contracts \
            -p codex-hepta-fleet \
            >"$ARTIFACT_DIR/focused-test-no-run.log" 2>&1
          focused_test_rc=$?
          set -e

          git restore --source="$SOURCE_SHA" -- \
            codex-rs/hepta-automation/Cargo.toml \
            codex-rs/hepta-contracts/Cargo.toml \
            codex-rs/hepta-fleet/Cargo.toml

          {
            echo "shear_baseline_rc=$shear_baseline_rc"
            echo "shear_dispositions_rc=$shear_dispositions_rc"
            echo "focused_check_rc=$focused_check_rc"
            echo "focused_test_no_run_rc=$focused_test_rc"
          } >>"$ARTIFACT_DIR/summary.env"

      - name: Set up Bazel for module-lock regeneration
        uses: ./.github/actions/setup-bazel-ci
        with:
          target: ${{ matrix.bazel_target }}

      - name: Regenerate Bazel module lock
        shell: bash
        run: |
          set -euo pipefail
          set +e
          just bazel-lock-update \
            >"$ARTIFACT_DIR/bazel-lock-update.log" 2>&1
          bazel_lock_rc=$?
          set -e
          printf '%s\n' "$bazel_lock_rc" \
            >"$ARTIFACT_DIR/bazel-lock-update.rc"
          cp MODULE.bazel.lock \
            "$ARTIFACT_DIR/MODULE.bazel.lock.generated"
          git diff -- MODULE.bazel.lock \
            >"$ARTIFACT_DIR/MODULE.bazel.lock.diff"
          {
            echo "bazel_lock_rc=$bazel_lock_rc"
            echo "module_bazel_lock_sha256=$(sha256sum MODULE.bazel.lock | awk '{print $1}')"
          } >>"$ARTIFACT_DIR/summary.env"

      - name: Run cargo-deny against generated lock
        id: cargo_deny
        if: ${{ matrix.run_deny }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (
            cd codex-rs
            cargo +1.95.0 deny --all-features check --config deny.toml
          ) >"$ARTIFACT_DIR/cargo-deny.log" 2>&1
          cargo_deny_rc=$?
          printf '%s\n' "$cargo_deny_rc" \
            >"$ARTIFACT_DIR/cargo-deny.rc"
          exit "$cargo_deny_rc"

      - name: Record final diagnostic state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          {
            echo "cargo_deny_outcome=${{ steps.cargo_deny.outcome }}"
            if [[ -f "$ARTIFACT_DIR/cargo-deny.rc" ]]; then
              echo "cargo_deny_rc=$(cat "$ARTIFACT_DIR/cargo-deny.rc")"
            fi
          } >>"$ARTIFACT_DIR/summary.env"
          git status --short >"$ARTIFACT_DIR/git-status.txt"
          git diff --stat >"$ARTIFACT_DIR/final-diff-stat.txt"
          git diff --check >"$ARTIFACT_DIR/final-diff-check.txt"
          cat "$ARTIFACT_DIR/summary.env"

      - name: Upload Q0.49 diagnostic bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-intelligence-q0-49-${{ matrix.name }}-${{ github.sha }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 30
