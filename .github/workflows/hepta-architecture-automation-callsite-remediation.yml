name: Hepta architecture automation callsite remediation

on:
  push:
    branches:
      - codex/hepta-architecture-convergence-p0-2-20260828
    paths:
      - .github/workflows/hepta-architecture-automation-callsite-remediation.yml

permissions:
  contents: write

concurrency:
  group: hepta-architecture-automation-callsite-remediation
  cancel-in-progress: true

jobs:
  remediate-automation-callsites:
    name: Repair Automation operation-bound test callsites
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      EXPECTED_PARENT: 370713b6bc5471b5239bf2d960dee074c9007d62
      EXPECTED_BRANCH: codex/hepta-architecture-convergence-p0-2-20260828
      WORKFLOW_PATH: .github/workflows/hepta-architecture-automation-callsite-remediation.yml
      AUTOMATION_PATH: codex-rs/hepta-agentd/src/automation.rs
      RUNTIME_TESTS_PATH: codex-rs/hepta-agentd/src/runtime_tests.rs
    steps:
      - name: Checkout exact remediation trigger
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify immutable remediation boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          mapfile -t trigger_paths < <(git diff --name-only "$EXPECTED_PARENT" HEAD | sort)
          test "${#trigger_paths[@]}" -eq 1
          test "${trigger_paths[0]}" = "$WORKFLOW_PATH"
          git diff --exit-code
          git diff --cached --exit-code

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Apply exact operation-bound callsite repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def lines(*items: str) -> str:
              return "\n".join(items) + "\n"

          automation_path = Path("codex-rs/hepta-agentd/src/automation.rs")
          automation = automation_path.read_text(encoding="utf-8")

          imports_old = lines(
              "mod tests {",
              "    use codex_hepta_automation::AutomationTaskId;",
              "    use codex_hepta_automation::AutomationTick;",
              "    use codex_hepta_contracts::AgentId;",
          )
          imports_new = lines(
              "mod tests {",
              "    use codex_hepta_automation::AutomationLease;",
              "    use codex_hepta_automation::AutomationOperationContext;",
              "    use codex_hepta_automation::AutomationSchedule;",
              "    use codex_hepta_automation::AutomationTask;",
              "    use codex_hepta_automation::AutomationTaskId;",
              "    use codex_hepta_automation::AutomationTaskState;",
              "    use codex_hepta_automation::AutomationTick;",
              "    use codex_hepta_contracts::AgentId;",
          )
          if automation.count(imports_old) != 1:
              raise SystemExit("unexpected automation test import shape")
          automation = automation.replace(imports_old, imports_new, 1)

          test_marker = "    fn automation_has_only_normal_app_server_queue_admission() {\n"
          request_marker = "        let ClientRequest::ThreadQueueAdd { params, .. } = automation_queue_request(&admission)\n"
          if automation.count(test_marker) != 1 or automation.count(request_marker) != 1:
              raise SystemExit("unexpected automation admission test boundary")
          test_start = automation.index(test_marker)
          request_start = automation.index(request_marker, test_start)
          old_test_prefix = automation[test_start:request_start]
          if old_test_prefix.count("agent_id:") != 1 or "owner_agent_id" in old_test_prefix:
              raise SystemExit("automation admission test is not the expected legacy callsite")
          new_test_prefix = lines(
              "    fn automation_has_only_normal_app_server_queue_admission() {",
              "        let owner_agent_id =",
              "            AgentId::parse(\"018f4f72-5f8f-7cc1-8f55-df9fb3aa2c12\").expect(\"agent id\");",
              "        let task_id = AutomationTaskId::parse(\"019153a4-3088-7000-a56a-9b1964f75007\")",
              "            .expect(\"task id\");",
              "        let lease = AutomationLease {",
              "            task: AutomationTask {",
              "                task_id,",
              "                owner_agent_id,",
              "                thread_id: \"019153a4-3088-7e03-a56a-9b1964f75ddd\".to_string(),",
              "                prompt: \"run through governance\".to_string(),",
              "                schedule: AutomationSchedule::Once,",
              "                state: AutomationTaskState::Enabled,",
              "                next_run_at_ms: Some(44),",
              "                next_occurrence: 3,",
              "                created_at_ms: 1,",
              "                updated_at_ms: 1,",
              "            },",
              "            occurrence: 3,",
              "            scheduled_for_ms: 44,",
              "            client_user_message_id: \"hepta.automation.test\".to_string(),",
              "            lease_generation: 1,",
              "            lease_token: \"automation-queue-test-lease\".to_string(),",
              "            lease_expires_at_ms: 1_000,",
              "        };",
              "        let operation_context = AutomationOperationContext::new(",
              "            1,",
              "            1,",
              "            1,",
              "            Sha256Digest::for_bytes(b\"automation-queue-test-fence\"),",
              "        )",
              "        .expect(\"operation context\");",
              "        let admission = lease",
              "            .admission(&operation_context)",
              "            .expect(\"automation admission\");",
          )
          automation = automation[:test_start] + new_test_prefix + automation[request_start:]
          automation_path.write_text(automation, encoding="utf-8")

          runtime_path = Path("codex-rs/hepta-agentd/src/runtime_tests.rs")
          runtime = runtime_path.read_text(encoding="utf-8")
          runtime_import_old = lines(
              "use codex_hepta_automation::AutomationError;",
              "use codex_hepta_automation::AutomationStore;",
          )
          runtime_import_new = lines(
              "use codex_hepta_automation::AutomationError;",
              "use codex_hepta_automation::AutomationOperationContext;",
              "use codex_hepta_automation::AutomationStore;",
          )
          if runtime.count(runtime_import_old) != 1:
              raise SystemExit("unexpected runtime test import shape")
          runtime = runtime.replace(runtime_import_old, runtime_import_new, 1)

          runtime_test_marker = "async fn runtime_automation_store_failure_stops_only_the_scheduler_plane() {\n"
          scheduler_marker = lines(
              "    fixture",
              "        .state",
              "        .attach_automation_store(store.clone())",
              "        .expect(\"attach automation store\");",
              "    let cancellation = CancellationToken::new();",
              "    let scheduler_task = tokio::spawn(run_automation_scheduler(",
              "        store.clone(),",
              "        Arc::clone(&fixture.state),",
              "        fixture.identity.clone(),",
              "        cancellation.clone(),",
              "    ));",
          )
          if runtime.count(runtime_test_marker) != 1:
              raise SystemExit("unexpected runtime scheduler test boundary")
          runtime_test_start = runtime.index(runtime_test_marker)
          scheduler_start = runtime.index(scheduler_marker, runtime_test_start)
          scheduler_new = lines(
              "    fixture",
              "        .state",
              "        .attach_automation_store(store.clone())",
              "        .expect(\"attach automation store\");",
              "    let authority = crate::composition::authority_for_identity(&fixture.identity)",
              "        .expect(\"build Automation authority\");",
              "    let operation_context = AutomationOperationContext::new(",
              "        u64::from(authority.schema_version()),",
              "        fixture.identity.spawn_generation,",
              "        fixture.identity.spawn_generation,",
              "        authority.digest(),",
              "    )",
              "    .expect(\"bind Automation operation context\");",
              "    let cancellation = CancellationToken::new();",
              "    let scheduler_task = tokio::spawn(run_automation_scheduler(",
              "        store.clone(),",
              "        operation_context,",
              "        Arc::clone(&fixture.state),",
              "        fixture.identity.clone(),",
              "        cancellation.clone(),",
              "    ));",
          )
          runtime = runtime[:scheduler_start] + scheduler_new + runtime[scheduler_start + len(scheduler_marker):]
          runtime_path.write_text(runtime, encoding="utf-8")
          PY
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "$AUTOMATION_PATH"
          test "${changed[1]}" = "$RUNTIME_TESTS_PATH"

      - name: Format and verify Agentd test callsites
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -p codex-hepta-agentd
          git diff --check
          cargo fmt -p codex-hepta-agentd -- --check
          cargo test --locked -p codex-hepta-agentd --lib --no-run
          cargo test --locked -p codex-hepta-agentd \
            automation::tests::automation_has_only_normal_app_server_queue_admission \
            -- --exact --nocapture
          cargo test --locked -p codex-hepta-agentd \
            runtime_tests::runtime_automation_store_failure_stops_only_the_scheduler_plane \
            -- --exact --nocapture
          cargo check --locked -p codex-hepta-agentd

      - name: Commit verified callsite repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git status --short | sed 's/^...//' | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "$AUTOMATION_PATH"
          test "${changed[1]}" = "$RUNTIME_TESTS_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$AUTOMATION_PATH" "$RUNTIME_TESTS_PATH"
          git commit -m "test(agentd): bind automation operation context in callsites"
          git push origin "HEAD:$EXPECTED_BRANCH"
