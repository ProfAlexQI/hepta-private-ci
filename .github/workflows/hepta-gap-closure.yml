name: Hepta V8 source-gap closure

on:
  push:
    branches:
      - "codex/hepta-v8-gap-closure-20260905"
  pull_request:
    paths:
      - "codex-rs/hepta-*/**"
      - "apps/hepta-control-ui/**"
      - "tools/hepta-engineering-control/**"
      - "scripts/hepta-gap-closure.py"
      - "qualification/gap-closure/**"
      - "docs/readiness/GAP_CLOSURE_IMPLEMENTATION.md"
      - ".github/workflows/hepta-gap-closure.yml"

permissions:
  contents: write

concurrency:
  group: hepta-v8-gap-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up repository CI toolchain
        uses: ./.github/actions/setup-ci

      - name: Normalize and verify closed-world source inventory
        run: |
          python3 scripts/hepta-gap-closure.py normalize
          python3 .github/scripts/verify_cargo_workspace_manifests.py

      - name: Format selected Rust packages
        working-directory: codex-rs
        run: |
          packages=(
            codex-hepta-objective
            codex-hepta-ndu
            codex-hepta-learning-ledger
            codex-hepta-learning-artifacts
            codex-hepta-bellman-operator
            codex-hepta-intelligence-eval
            codex-hepta-neuron
            codex-hepta-intuition
            codex-hepta-prompt-registry
            codex-hepta-prompt-optimizer
            codex-hepta-plasticity
            codex-hepta-infer-worker-host
          )
          for package in "${packages[@]}"; do
            cargo fmt --package "$package"
          done

      - name: Reconcile lockfile and check selected packages
        working-directory: codex-rs
        run: |
          cargo check \
            --package codex-hepta-objective \
            --package codex-hepta-ndu \
            --package codex-hepta-learning-ledger \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-bellman-operator \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-neuron \
            --package codex-hepta-intuition \
            --package codex-hepta-prompt-registry \
            --package codex-hepta-prompt-optimizer \
            --package codex-hepta-plasticity \
            --package codex-hepta-infer-worker-host \
            --all-targets

      - name: Run focused Rust tests
        working-directory: codex-rs
        run: |
          cargo test --locked \
            --package codex-hepta-objective \
            --package codex-hepta-ndu \
            --package codex-hepta-learning-ledger \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-bellman-operator \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-neuron \
            --package codex-hepta-intuition \
            --package codex-hepta-prompt-registry \
            --package codex-hepta-prompt-optimizer \
            --package codex-hepta-plasticity \
            --package codex-hepta-infer-worker-host
          cargo test --locked --package codex-hepta-shadow-qualification value_learning

      - name: Run strict selected-package Clippy
        working-directory: codex-rs
        run: |
          cargo clippy --locked \
            --package codex-hepta-objective \
            --package codex-hepta-ndu \
            --package codex-hepta-learning-ledger \
            --package codex-hepta-learning-artifacts \
            --package codex-hepta-bellman-operator \
            --package codex-hepta-intelligence-eval \
            --package codex-hepta-neuron \
            --package codex-hepta-intuition \
            --package codex-hepta-prompt-registry \
            --package codex-hepta-prompt-optimizer \
            --package codex-hepta-plasticity \
            --package codex-hepta-infer-worker-host \
            --all-targets -- -D warnings

      - name: Run control UI tests
        run: node --test apps/hepta-control-ui/test/*.test.js

      - name: Run engineering-control tests
        working-directory: tools/hepta-engineering-control
        run: python3 -m unittest -v test_hepta_engineering_control.py

      - name: Verify normalized candidate
        run: |
          python3 scripts/hepta-gap-closure.py verify
          python3 .github/scripts/verify_cargo_workspace_manifests.py
          git diff --check

      - name: Commit deterministic source normalization
        if: ${{ github.event_name == 'push' }}
        run: |
          git add \
            codex-rs/Cargo.toml \
            codex-rs/Cargo.lock \
            codex-rs/hepta-bellman-operator \
            codex-rs/hepta-infer-worker-host \
            codex-rs/hepta-intelligence-eval \
            codex-rs/hepta-intuition \
            codex-rs/hepta-learning-artifacts \
            codex-rs/hepta-learning-ledger \
            codex-rs/hepta-ndu \
            codex-rs/hepta-neuron \
            codex-rs/hepta-objective \
            codex-rs/hepta-plasticity \
            codex-rs/hepta-prompt-optimizer \
            codex-rs/hepta-prompt-registry
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "hepta-ci-bot"
          git config user.email "hepta-ci-bot@users.noreply.github.com"
          git commit -m "chore(hepta): normalize V8 gap-closure candidate [gap-normalized]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Require clean tracked source state
        run: git diff --exit-code
