name: hepta-vnext qualification

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "codex-rs/hepta-*/**"
      - "codex-rs/ext/hepta-*/**"
      - "docs/hepta-vnext/**"
      - "scripts/verify-hepta-browser-runner-evidence.py"
      - "scripts/hepta_browser_runner_evidence/**"
      - "scripts/tests/test_hepta_browser_runner_evidence.py"
      - ".github/workflows/hepta-vnext-qualification.yml"
      - ".github/workflows/hepta-browser-ci.yml"
      - ".github/workflows/blocking-ci.yml"
  push:
    branches:
      - vnext-main
      - "integration/vnext-main-full-ci-*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  runner-preflight:
    name: Runner preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm hosted runner execution
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          echo "event=$GITHUB_EVENT_NAME"
          echo "sha=$GITHUB_SHA"
          test -n "$RUNNER_TEMP"
          test -d "$RUNNER_TEMP"

  portable-product:
    name: Product (${{ matrix.os }})
    needs: runner-preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Enable Git long paths before checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev bubblewrap

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Locked workspace metadata
        shell: bash
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Portable Hepta tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked \
            -p codex-hepta-contracts \
            -p codex-hepta-evidence \
            -p codex-hepta-governance \
            -p codex-hepta-memory \
            -p codex-hepta-memory-extension \
            -p codex-hepta-paths \
            -p codex-hepta-runtime \
            -p codex-hepta-native-gateway

      - name: Product caller compilation
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked \
            -p codex-core \
            -p codex-app-server \
            -p codex-mcp-server \
            -p codex-cli

      - name: Strict Hepta Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets \
            -p codex-hepta-contracts \
            -p codex-hepta-evidence \
            -p codex-hepta-governance \
            -p codex-hepta-memory \
            -p codex-hepta-memory-extension \
            -p codex-hepta-paths \
            -p codex-hepta-runtime \
            -p codex-hepta-native-gateway \
            -- -D warnings

  authbus-local-qualification:
    name: AuthBus local qualification (feature-on, no authority)
    needs: runner-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Initialize qualification-only posture record
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/authbus-local-qualification"
          mkdir -p "$evidence_dir"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "feature=authbus-local-qualification"
            echo "qualification_only=true"
            echo "authority=false"
            echo "effect_authority=false"
            echo "production_caller=false"
            echo "production_writer=false"
            echo "operator_acceptance=false"
            echo "promotion=false"
          } > "$evidence_dir/posture.txt"

      - name: Locked AuthBus feature-on tests
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/authbus-local-qualification"
          cargo test --locked --no-default-features \
            -p codex-hepta-contracts \
            --features authbus-local-qualification \
            --tests -- --nocapture 2>&1 | tee "$evidence_dir/tests.log"
          echo "tests=passed" >> "$evidence_dir/posture.txt"

      - name: Locked AuthBus feature-on check
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/authbus-local-qualification"
          cargo check --locked --no-default-features \
            -p codex-hepta-contracts \
            --features authbus-local-qualification \
            --all-targets 2>&1 | tee "$evidence_dir/check.log"
          echo "check=passed" >> "$evidence_dir/posture.txt"

      - name: Record qualification-only result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/authbus-local-qualification"
          echo "job_status=${{ job.status }}" >> "$evidence_dir/posture.txt"
          {
            echo "### AuthBus local qualification"
            echo
            echo "The explicit authbus-local-qualification feature is qualification-only."
            echo "Its feature-on tests assert that authority, effect, production, operator, and promotion flags remain false."
            echo
            sed 's/^/- /' "$evidence_dir/posture.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AuthBus qualification evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: authbus-local-qualification
          path: ${{ runner.temp }}/authbus-local-qualification
          if-no-files-found: error

  browser-c0-c3:
    name: Browser qualification-only slice
    needs: runner-preflight
    uses: ./.github/workflows/hepta-browser-ci.yml
    secrets: inherit

  generated-and-locks:
    name: Generated artifacts and locks
    needs: runner-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Format
        working-directory: codex-rs
        run: cargo fmt --all -- --check

      - name: App Server schemas are current
        run: |
          set -euo pipefail
          just write-app-server-schema --experimental
          git diff --exit-code

      - name: Bazel lock is current
        run: just bazel-lock-check

      - name: Clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  required:
    name: Hepta vNext required
    if: ${{ always() }}
    needs:
      - runner-preflight
      - portable-product
      - authbus-local-qualification
      - browser-c0-c3
      - generated-and-locks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require successful Hepta dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
