name: hepta-runner recovery canary v2

on:
  pull_request:
    paths:
      - ".github/workflows/hepta-runner-recovery-canary-v2.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: hepta-pr1-queue-hygiene-v2
  cancel-in-progress: true

jobs:
  queue-hygiene:
    name: Cancel obsolete exact-branch queue entries
    runs-on: macos-15
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Cancel only non-current queued runs on this PR branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["REPOSITORY"]
          branch = os.environ["HEAD_BRANCH"]
          current_head = os.environ["CURRENT_HEAD"]
          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "hepta-pr1-queue-hygiene-v2",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(url: str, *, method: str = "GET"):
              req = urllib.request.Request(url, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          runs = []
          for page in range(1, 21):
              query = urllib.parse.urlencode(
                  {"branch": branch, "per_page": 100, "page": page}
              )
              payload = request(f"{base}/actions/runs?{query}")
              page_runs = payload.get("workflow_runs", [])
              if not isinstance(page_runs, list):
                  raise SystemExit("workflow_runs response is not a list")
              runs.extend(page_runs)
              if len(page_runs) < 100:
                  break
          else:
              raise SystemExit("queue listing exceeded the 2000-run safety bound")

          cancellable = {"queued", "pending", "requested", "waiting"}
          selected = []
          for run in runs:
              if run.get("head_branch") != branch:
                  continue
              if run.get("head_sha") == current_head:
                  continue
              if run.get("status") not in cancellable:
                  continue
              run_id = run.get("id")
              if not isinstance(run_id, int) or run_id <= 0:
                  raise SystemExit("invalid workflow run id")
              selected.append(
                  {
                      "head_sha": run.get("head_sha"),
                      "id": run_id,
                      "name": run.get("name"),
                      "status": run.get("status"),
                  }
              )

          selected.sort(key=lambda item: item["id"])
          cancelled = []
          failures = []
          for item in selected:
              try:
                  request(f"{base}/actions/runs/{item['id']}/cancel", method="POST")
                  cancelled.append(item)
              except urllib.error.HTTPError as error:
                  if error.code != 409:
                      failures.append({**item, "http_status": error.code})
              time.sleep(0.02)

          result = {
              "authority": {
                  "build_authorized": False,
                  "merge_authorized": False,
                  "operator_acceptance": False,
                  "promotion": False,
                  "release_qualified": False,
                  "runtime_authority": False,
              },
              "branch": branch,
              "cancelled_count": len(cancelled),
              "current_head": current_head,
              "failures": failures,
              "schema": "hepta.ci.branch_queue_hygiene.v2",
              "selected_count": len(selected),
          }
          print(json.dumps(result, sort_keys=True))
          if failures:
              raise SystemExit("one or more obsolete branch runs could not be cancelled")
          PY
