name: AuthBus P1.3 ARM exact-source preflight

on:
  push:
    branches:
      - tmp/authbus-p1-3-source-export-20260829
    paths:
      - .github/workflows/authbus-p1-3-arm-preflight.yml
      - scripts/authbus-p1-3-finalize.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authbus-p1-3-arm-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  P02_MANIFEST: codex-rs/hepta-authbus-qualification/Cargo.toml
  P03_MANIFEST: codex-rs/hepta-authbus-p0-3-qualification/Cargo.toml
  P13_MANIFEST: codex-rs/hepta-authbus-p1-3-qualification/Cargo.toml
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_TARGET_DIR: /tmp/authbus-p1-3-arm-target

jobs:
  preflight:
    name: Materialize and qualify P1.3 on ARM
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout exact preflight head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Materialize the canonical registry source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 -m py_compile scripts/authbus-p1-3-finalize.py
          python3 scripts/authbus-p1-3-finalize.py | tee /tmp/authbus-p1-3-finalize.txt
          grep -q 'applied_authbus_p1_3_registry_files=9' /tmp/authbus-p1-3-finalize.txt
          grep -q 'applied_authbus_p1_3_existing_file_patches=5' /tmp/authbus-p1-3-finalize.txt
          grep -q 'removed_p0_3_canonical_type_copies=2' /tmp/authbus-p1-3-finalize.txt
          python3 scripts/verify-authbus-p1-3.py | tee /tmp/authbus-p1-3-source.json
          grep -q 'PASS_AUTHBUS_P1_3_SOURCE_ONLY' /tmp/authbus-p1-3-source.json
          git diff --check

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Generate P1.3 lock and format affected source
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc -V | awk '{print $2}')" = "1.95.0"
          cargo generate-lockfile --manifest-path "${P13_MANIFEST}"
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-contracts
          cargo fmt --manifest-path "${P02_MANIFEST}" --all
          cargo fmt --manifest-path "${P03_MANIFEST}" --all
          cargo fmt --manifest-path "${P13_MANIFEST}" --all
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-contracts -- --check
          cargo fmt --manifest-path "${P02_MANIFEST}" --all -- --check
          cargo fmt --manifest-path "${P03_MANIFEST}" --all -- --check
          cargo fmt --manifest-path "${P13_MANIFEST}" --all -- --check
          test -s codex-rs/hepta-authbus-p1-3-qualification/Cargo.lock
          cargo metadata --manifest-path "${P13_MANIFEST}" --locked \
            --format-version 1 --no-deps >/dev/null
          python3 scripts/verify-authbus-p1-3.py | tee /tmp/authbus-p1-3-formatted.json
          grep -q 'PASS_AUTHBUS_P1_3_SOURCE_ONLY' /tmp/authbus-p1-3-formatted.json
          git diff --check

      - name: Run default-off and executable test matrices
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-contracts --features authbus-local-qualification \
            --lib -- --nocapture
          cargo test --manifest-path "${P03_MANIFEST}" --locked \
            --no-default-features --lib -- --nocapture
          cargo test --manifest-path "${P03_MANIFEST}" --locked \
            --features p0-3-qualification --tests -- --nocapture
          cargo test --manifest-path "${P02_MANIFEST}" --locked \
            --no-default-features --lib -- --nocapture
          cargo test --manifest-path "${P02_MANIFEST}" --locked \
            --features sqlite-qualification --tests -- --nocapture
          cargo test --manifest-path "${P13_MANIFEST}" --locked \
            --no-default-features --lib -- --nocapture
          cargo test --manifest-path "${P13_MANIFEST}" --locked \
            --features p1-3-qualification --tests -- --nocapture

      - name: Check all affected targets
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-contracts --features authbus-local-qualification \
            --all-targets
          cargo check --manifest-path "${P03_MANIFEST}" --locked \
            --features p0-3-qualification --all-targets
          cargo check --manifest-path "${P02_MANIFEST}" --locked \
            --features sqlite-qualification --all-targets
          cargo check --manifest-path "${P13_MANIFEST}" --locked \
            --features p1-3-qualification --all-targets

      - name: Run strict Clippy for all affected targets
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-contracts --features authbus-local-qualification \
            --all-targets -- -D warnings
          cargo clippy --manifest-path "${P03_MANIFEST}" --locked \
            --features p0-3-qualification --all-targets -- -D warnings
          cargo clippy --manifest-path "${P02_MANIFEST}" --locked \
            --features sqlite-qualification --all-targets -- -D warnings
          cargo clippy --manifest-path "${P13_MANIFEST}" --locked \
            --features p1-3-qualification --all-targets -- -D warnings

      - name: Record exact preflight receipt
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '{"schema":"hepta.authbus.p1.3.arm-preflight.v1","qualified":true,"qualification_only":true,"registry_sha256":"f6702be58c499d853d273f3174a2556481a3f5b4284cd9cd0b0a247160d7ac08","authority":false,"effect_authority":false,"production_caller":false,"production_writer":false}' \
            > /tmp/authbus-p1-3-arm-preflight.json

      - name: Upload preflight evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: authbus-p1-3-arm-preflight-${{ github.run_id }}
          path: |
            /tmp/authbus-p1-3-finalize.txt
            /tmp/authbus-p1-3-source.json
            /tmp/authbus-p1-3-formatted.json
            /tmp/authbus-p1-3-arm-preflight.json
            codex-rs/hepta-authbus-p1-3-qualification/Cargo.lock
          retention-days: 2
