name: Hepta Intelligence Q0 v4 x64 qualification

on:
  push:
    branches:
      - codex/hepta-intelligence-q0-v4-x64-20260828
    paths:
      - .github/workflows/hepta-intelligence-q0-v4-x64.yml

permissions:
  contents: read

concurrency:
  group: hepta-intelligence-q0-v4-x64-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_BRANCH: codex/hepta-intelligence-q0-v4-x64-20260828
  EXPECTED_PARENT: cfdc46652b5fadb2ce7a45d4ca9af9ae3d1dd639
  PATCH_FILE: .github/patches/hepta-intelligence-q0-compile-fix-v1.patch
  ARTIFACT_DIR: artifacts/hepta-intelligence-q0-v4-x64
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_BUILD_JOBS: 4
  RUST_BACKTRACE: 1

jobs:
  exact-candidate-x64:
    name: Q0 v4 x64 source, SQLite, tests and Clippy
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout exact isolated candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prove exact x64 candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(uname -m)" = "x86_64"
          test -f "$PATCH_FILE"
          mkdir -p "$ARTIFACT_DIR"
          printf '{"head":"%s","tree":"%s","parent":"%s","host":"x86_64-unknown-linux-gnu","source_head":"cfdc46652b5fadb2ce7a45d4ca9af9ae3d1dd639","runtime_authority":false}\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$(git rev-parse HEAD^)" \
            > "$ARTIFACT_DIR/identity.json"

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Verify compiler, host and lock
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          expected=$(python3 - <<'PY'
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])
          PY
          )
          test "$expected" = "1.95.0"
          test "$(rustc --version | awk '{print $2}')" = "$expected"
          test "$(rustc -vV | awk '/^host:/ {print $2}')" = "x86_64-unknown-linux-gnu"
          test -s Cargo.lock

      - name: Apply compile repair and single-connection tamper sequence
        shell: bash
        run: |
          set -euo pipefail
          git apply --check "$PATCH_FILE"
          git apply "$PATCH_FILE"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-memory/src/fact_grounding/durable/tests.rs")
          text = path.read_text(encoding="utf-8")
          marker = "#[tokio::test]\nasync fn tampered_evidence_digest_is_rejected_on_reopen() {"
          prefix, separator, test = text.partition(marker)
          assert separator == marker
          assert test.count(".execute(&store.pool)") == 3
          write_end = "        .await\n        .expect(\"write\");\n\n"
          assert test.count(write_end) == 1
          connection = (
              "    let mut tamper_connection = store\n"
              "        .pool\n"
              "        .acquire()\n"
              "        .await\n"
              "        .expect(\"acquire tamper connection\");\n\n"
          )
          test = test.replace(write_end, write_end + connection, 1)
          test = test.replace(".execute(&store.pool)", ".execute(&mut *tamper_connection)")
          assert test.count(".execute(&mut *tamper_connection)") == 3
          test = test.replace(
              "    drop(store);\n",
              "    drop(tamper_connection);\n    drop(store);\n",
              1,
          )
          path.write_text(prefix + separator + test, encoding="utf-8")
          PY

      - name: Check exact nine-file formatting and diff
        shell: bash
        run: |
          set -euo pipefail
          files=(
            codex-rs/hepta-memory/src/fact_grounding/durable/grounding/prepare.rs
            codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger/insert.rs
            codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger/support.rs
            codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger/verify.rs
            codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger.rs
            codex-rs/hepta-memory/src/intelligence_mutation_state.rs
            codex-rs/hepta-memory/src/fact_grounding/durable/schema.rs
            codex-rs/hepta-memory/src/intelligence_mutation_shadow_host.rs
            codex-rs/hepta-memory/src/fact_grounding/durable/tests.rs
          )
          rustfmt --edition 2024 --config skip_children=true "${files[@]}"
          rustfmt --edition 2024 --check --config skip_children=true "${files[@]}"
          git diff --check
          printf '%s\n' "${files[@]}" | sort > "$ARTIFACT_DIR/expected-files.txt"
          git diff --name-only | sort > "$ARTIFACT_DIR/actual-files.txt"
          diff -u "$ARTIFACT_DIR/expected-files.txt" "$ARTIFACT_DIR/actual-files.txt"
          git diff --binary > "$ARTIFACT_DIR/repair.patch"

      - name: Run frozen source and SQLite contracts
        shell: bash
        run: |
          set -euo pipefail
          status=plans/hepta-intelligence/HEPTA_INTELLIGENCE_EXECUTION_STATUS_V2.json
          canonical=$(mktemp)
          cp "$status" "$canonical"
          restore_status() { cp "$canonical" "$status"; rm -f "$canonical"; }
          trap restore_status EXIT
          test "$(python3 scripts/verify-hepta-intelligence-master-plan.py)" = "PASS_HEPTA_INTELLIGENCE_MASTER_PLAN_V4_SOURCE_ONLY"
          python3 scripts/hepta-intelligence-status-compat.py P0.2 >/dev/null
          python3 scripts/verify-hepta-intelligence-grounding-ledger.py >/dev/null
          python3 scripts/hepta-intelligence-status-compat.py P0.3 >/dev/null
          python3 scripts/verify-hepta-intelligence-grounding-gate.py >/dev/null
          python3 scripts/hepta-intelligence-status-compat.py P0.4a >/dev/null
          python3 scripts/verify-hepta-intelligence-mutation-state.py >/dev/null
          python3 scripts/hepta-intelligence-status-compat.py P0.4b >/dev/null
          python3 scripts/hepta-intelligence-mutation-journal-sqlite-selftest.py >/dev/null
          python3 scripts/verify-hepta-intelligence-mutation-journal.py >/dev/null
          python3 scripts/hepta-intelligence-status-compat.py P0.4c >/dev/null
          python3 scripts/verify-hepta-intelligence-shadow-host.py >/dev/null
          restore_status
          trap - EXIT

      - name: Run focused tests
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-memory durable_grounding -- --nocapture 2>&1 | tee "../$ARTIFACT_DIR/test-p0-2.log"
          cargo test --locked -p codex-hepta-memory fact_grounding -- --nocapture 2>&1 | tee "../$ARTIFACT_DIR/test-p0-1-regression.log"
          cargo test --locked -p codex-hepta-memory shadow_ -- --nocapture 2>&1 | tee "../$ARTIFACT_DIR/test-p0-3.log"
          cargo test --locked -p codex-hepta-memory intelligence_mutation_state -- --nocapture 2>&1 | tee "../$ARTIFACT_DIR/test-p0-4a.log"
          cargo test --locked -p codex-hepta-memory intelligence_mutation_journal -- --nocapture 2>&1 | tee "../$ARTIFACT_DIR/test-p0-4b.log"
          cargo test --locked -p codex-hepta-memory shadow_intelligence_mutation_host -- --nocapture 2>&1 | tee "../$ARTIFACT_DIR/test-p0-4c-memory.log"
          cargo test --locked -p codex-hepta-memory-extension grounding_v3 -- --nocapture 2>&1 | tee "../$ARTIFACT_DIR/test-p0-3-extension.log"
          cargo test --locked -p codex-hepta-agentd --features qualification-intelligence-mutation-shadow shadow_intelligence_mutation_host -- --nocapture 2>&1 | tee "../$ARTIFACT_DIR/test-p0-4c-agentd.log"

      - name: Run full memory tests and strict Clippy
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-memory 2>&1 | tee "../$ARTIFACT_DIR/test-full-memory.log"
          cargo clippy --locked -p codex-hepta-memory --all-targets -- -D warnings 2>&1 | tee "../$ARTIFACT_DIR/clippy-memory.log"

      - name: Emit x64 qualification receipt
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          receipt = {
              "schema": "hepta_intelligence_q0_v4_x64_receipt_v1",
              "status": "PASS_Q0_V4_X64_EXECUTABLE_CANDIDATE",
              "candidate_source_head": "cfdc46652b5fadb2ce7a45d4ca9af9ae3d1dd639",
              "qualification_head": os.environ["GITHUB_SHA"],
              "rust_toolchain": "1.95.0",
              "host": "x86_64-unknown-linux-gnu",
              "source_sqlite": True,
              "focused_tests": True,
              "full_memory_tests": True,
              "strict_clippy": True,
              "runtime_wired": False,
              "production_authority": False,
              "external_effects": False,
              "operator_acceptance": False,
              "promotion": False,
              "callers_ratchet": False,
              "q0_satisfied": False,
          }
          Path(os.environ["ARTIFACT_DIR"], "receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )

      - name: Upload x64 qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-intelligence-q0-v4-x64-${{ github.sha }}
          path: artifacts/hepta-intelligence-q0-v4-x64/**
          if-no-files-found: error
          retention-days: 30
