name: AuthBus P1.3 emergency clean source builder

on:
  push:
    branches:
      - codex/authbus-p1-3-emergency-builder-20260830
    paths:
      - .github/workflows/authbus-p1-3-emergency-builder.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: authbus-p1-3-emergency-builder-${{ github.sha }}
  cancel-in-progress: true

env:
  SEED_SHA: 87a5732a88354112af94a3e08459278758709dfe
  BASE_BRANCH: integration/vnext-main-full-ci-authbus-p1-3-20260829
  BASE_SHA: 6b7aa91d7702a92a50297b1b1bd8170ffb7cb184
  BASE_TREE: f46fa8c6d541742eaea62d70ea62c0fe316dbaf9
  TARGET_BRANCH: codex/authbus-p1-3-clean-replay-20260830
  REGISTRY_SHA256: dfcab028e1a135a0895b3f9eddec9f5f99cf5f392701b98ad14180058a284bf1
  AUTHBUS_SEED_WORKFLOW: .github/workflows/authbus-p1-3-clean-replay-materialize.yml
  P02_MANIFEST: codex-rs/hepta-authbus-qualification/Cargo.toml
  P03_MANIFEST: codex-rs/hepta-authbus-p0-3-qualification/Cargo.toml
  P11_MANIFEST: codex-rs/hepta-authbus-p1-qualification/Cargo.toml
  P12_MANIFEST: codex-rs/hepta-authbus-p1-2-qualification/Cargo.toml
  P13_MANIFEST: codex-rs/hepta-authbus-p1-3-qualification/Cargo.toml
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_TARGET_DIR: /tmp/authbus-p1-3-emergency-target

jobs:
  build-source:
    name: Materialize and assemble exact canonical-parent source
    runs-on: ubuntu-slim
    timeout-minutes: 45
    steps:
      - name: Checkout exact emergency helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Bind helper, canonical base, and empty target
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "codex/authbus-p1-3-emergency-builder-20260830"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${SEED_SHA}"
          python3 -m py_compile \
            scripts/authbus-p1-3-finalize.py \
            scripts/authbus-p1-3-semantic-completion.py \
            scripts/authbus-p1-3-gap-closure.py \
            scripts/authbus-p1-3-clippy-completion.py
          git fetch --no-tags --depth=1 origin \
            "refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${BASE_BRANCH}")" = "${BASE_SHA}"
          test "$(git rev-parse "${BASE_SHA}^{tree}")" = "${BASE_TREE}"
          ! git ls-remote --exit-code --heads origin \
            "refs/heads/${TARGET_BRANCH}" >/dev/null 2>&1

          cat > /tmp/extract-authbus-step.py <<'PY'
          from pathlib import Path
          import sys

          workflow = Path(sys.argv[1])
          step_name = sys.argv[2]
          lines = workflow.read_text(encoding="utf-8").splitlines()
          target = f"- name: {step_name}"
          start = next(i for i, line in enumerate(lines) if line.strip() == target)
          run = next(
              i for i in range(start + 1, len(lines)) if lines[i].strip() == "run: |"
          )
          indent = len(lines[run]) - len(lines[run].lstrip())
          body = []
          for line in lines[run + 1 :]:
              if line and len(line) - len(line.lstrip()) <= indent:
                  break
              body.append(line[indent + 2 :] if line else "")
          if not body:
              raise SystemExit(f"empty run block for {step_name}")
          print("\n".join(body))
          PY

      - name: Run authoritative materialization and gap-closure block
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract-authbus-step.py \
            "${AUTHBUS_SEED_WORKFLOW}" \
            "Materialize canonical registry and close known gaps" \
            > /tmp/authbus-materialize.sh
          bash /tmp/authbus-materialize.sh

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Generate lock and format every affected crate
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract-authbus-step.py \
            "${AUTHBUS_SEED_WORKFLOW}" \
            "Generate lock and format every affected crate" \
            > /tmp/authbus-format.sh
          bash /tmp/authbus-format.sh

      - name: Revalidate inherited source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract-authbus-step.py \
            "${AUTHBUS_SEED_WORKFLOW}" \
            "Revalidate all inherited source contracts" \
            > /tmp/authbus-revalidate.sh
          bash /tmp/authbus-revalidate.sh

      - name: Assemble and force-replace helper ref with clean source
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract-authbus-step.py \
            "${AUTHBUS_SEED_WORKFLOW}" \
            "Assemble one clean source commit from the exact canonical base" \
            > /tmp/authbus-assemble.sh
          bash /tmp/authbus-assemble.sh
