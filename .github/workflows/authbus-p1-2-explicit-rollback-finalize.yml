name: AuthBus P1.2 explicit rollback qualification and source commit

on:
  push:
    branches:
      - integration/vnext-main-full-ci-authbus-p1-2-20260828
    paths:
      - .github/workflows/authbus-p1-2-explicit-rollback-finalize.yml

permissions:
  contents: write

env:
  EXPECTED_PARENT: a68d5ec959f62392785744aa1abdcc40d5da318d
  MANIFEST: codex-rs/hepta-authbus-p1-2-qualification/Cargo.toml
  CRATE_ROOT: codex-rs/hepta-authbus-p1-2-qualification
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  qualify-and-commit:
    name: Qualify explicit rollback and commit non-workflow P1.2 source
    runs-on: ubuntu-slim
    timeout-minutes: 90
    steps:
      - name: Checkout exact repair candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Verify exact branch, head, parent, and repair inputs
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "integration/vnext-main-full-ci-authbus-p1-2-20260828"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test -s scripts/authbus-p1-2-finalize.py
          test -s scripts/authbus-p1-2-explicit-rollback-repair.py
          test -s docs/hepta-vnext/authbus/AUTHBUS_P1_2_TEST_FAILURE_2026-08-28.txt
          python3 -m py_compile scripts/authbus-p1-2-finalize.py
          python3 -m py_compile scripts/authbus-p1-2-explicit-rollback-repair.py

      - name: Materialize, repair, normalize, and verify reviewed source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/authbus-p1-2-finalize.py | tee /tmp/authbus-p1-2-finalize.txt
          grep -q 'applied_sha256_digest_text_repairs=29' /tmp/authbus-p1-2-finalize.txt
          grep -q 'applied_exact_ttl_boundary_repairs=1' /tmp/authbus-p1-2-finalize.txt
          grep -q 'applied_canonical_sqlite_shim_repairs=1' /tmp/authbus-p1-2-finalize.txt
          grep -q 'applied_source_verifier_shim_repairs=1' /tmp/authbus-p1-2-finalize.txt

          python3 scripts/authbus-p1-2-explicit-rollback-repair.py | tee /tmp/authbus-p1-2-rollback-repair.txt
          grep -q 'applied_explicit_precommit_rollbacks=7' /tmp/authbus-p1-2-rollback-repair.txt
          grep -q 'applied_commit_or_rollback_helper=1' /tmp/authbus-p1-2-rollback-repair.txt

          python3 - <<'PY' | tee /tmp/authbus-p1-2-plan-normalization.txt
          from pathlib import Path

          path = Path(
              "docs/hepta-vnext/authbus/"
              "AUTHBUS_P1_2_DEVELOPMENT_PLAN_2026-08-28.md"
          )
          source = path.read_text(encoding="utf-8")
          replacements = (
              ("Date: 2026-08-28  \n", "Date: 2026-08-28\n"),
              (
                  "Parent tranche: P1.1 signed identity and evidence verification  \n",
                  "Parent tranche: P1.1 signed identity and evidence verification\n",
              ),
          )
          for before, after in replacements:
              count = source.count(before)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one P1.2 plan whitespace anchor, found {count}"
                  )
              source = source.replace(before, after)
          path.write_text(source, encoding="utf-8")
          print("applied_plan_trailing_whitespace_repairs=2")
          PY
          grep -q 'applied_plan_trailing_whitespace_repairs=2' /tmp/authbus-p1-2-plan-normalization.txt

          python3 scripts/verify-authbus-p1-2.py | tee /tmp/authbus-p1-2-source.json
          grep -q 'PASS_AUTHBUS_P1_2_SOURCE_ONLY' /tmp/authbus-p1-2-source.json
          grep -q 'async fn commit_or_rollback(' "${CRATE_ROOT}/src/store.rs"
          test "$(grep -c 'commit_or_rollback(transaction, P12Failpoint::' "${CRATE_ROOT}/src/store.rs")" -eq 7
          ! grep -q 'self.maybe_fail(P12Failpoint::StorageUnavailableBeforeCommit)?;' "${CRATE_ROOT}/src/store.rs"
          grep -q 'open_durable_evidence_pool' "${CRATE_ROOT}/src/store.rs"
          ! grep -q 'connect_with' "${CRATE_ROOT}/src/store.rs"
          grep -q 'NOW + 298' "${CRATE_ROOT}/tests/p1_2.rs"
          test -s .github/workflows/authbus-p1-2-qualification.yml
          git diff --check

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Pin lockfile, format, and reverify source
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc -V | awk '{print $2}')" = "1.95.0"
          cargo generate-lockfile --manifest-path "${MANIFEST}"
          cargo fmt --manifest-path "${MANIFEST}" --all
          cargo fmt --manifest-path "${MANIFEST}" --all -- --check
          test -s "${CRATE_ROOT}/Cargo.lock"
          cargo metadata --manifest-path "${MANIFEST}" --locked --format-version 1 --no-deps >/dev/null
          python3 scripts/verify-authbus-p1-2.py | tee /tmp/authbus-p1-2-formatted.json
          grep -q 'PASS_AUTHBUS_P1_2_SOURCE_ONLY' /tmp/authbus-p1-2-formatted.json
          test "$(grep -c 'commit_or_rollback(transaction, P12Failpoint::' "${CRATE_ROOT}/src/store.rs")" -eq 7
          git diff --check

      - name: Check default-off authority posture
        shell: bash
        run: |
          cargo test --manifest-path "${MANIFEST}" --locked --no-default-features --lib -- --nocapture

      - name: Run restart, replay, explicit rollback, GC, and corruption matrix
        shell: bash
        run: |
          cargo test --manifest-path "${MANIFEST}" --locked --features p1-2-qualification --tests -- --nocapture

      - name: Check all P1.2 targets
        shell: bash
        run: |
          cargo check --manifest-path "${MANIFEST}" --locked --features p1-2-qualification --all-targets

      - name: Run strict P1.2 Clippy
        shell: bash
        run: |
          cargo clippy --manifest-path "${MANIFEST}" --locked --features p1-2-qualification --all-targets -- -D warnings

      - name: Commit only qualified non-workflow P1.2 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/__pycache__ "${CRATE_ROOT}/target"

          rm scripts/authbus-p1-2-finalize.py
          rm scripts/authbus-p1-2-explicit-rollback-repair.py
          rm scripts/authbus-p1-2-source-seed.part-00.b64
          rm scripts/authbus-p1-2-source-seed.part-01.b64
          rm scripts/authbus-p1-2-source-seed.part-02.b64
          rm scripts/authbus-p1-2-source-seed.part-03.b64
          rm scripts/authbus-p1-2-source-seed.part-04.b64
          rm scripts/authbus-p1-2-source-seed.part-05.b64
          rm scripts/authbus-p1-2-source-seed.part-06.b64
          rm scripts/authbus-p1-2-source-seed.part-07.b64
          rm docs/hepta-vnext/authbus/AUTHBUS_P1_2_TEST_FAILURE_2026-08-28.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          final_paths=(
            codex-rs/hepta-authbus-p1-2-qualification/Cargo.toml
            codex-rs/hepta-authbus-p1-2-qualification/Cargo.lock
            codex-rs/hepta-authbus-p1-2-qualification/README.md
            codex-rs/hepta-authbus-p1-2-qualification/migrations/0001_authbus_p1_2.sql
            codex-rs/hepta-authbus-p1-2-qualification/src/lib.rs
            codex-rs/hepta-authbus-p1-2-qualification/src/model.rs
            codex-rs/hepta-authbus-p1-2-qualification/src/store.rs
            codex-rs/hepta-authbus-p1-2-qualification/tests/p1_2.rs
            docs/hepta-vnext/authbus/AUTHBUS_P1_2_DEVELOPMENT_PLAN_2026-08-28.md
            docs/hepta-vnext/authbus/AUTHBUS_P1_2_IMPLEMENTATION_STATUS_2026-08-28.json
            docs/hepta-vnext/authbus/AUTHBUS_P1_2_IMPLEMENTATION_STATUS_2026-08-28.md
            scripts/verify-authbus-p1-2.py
          )
          git add -- "${final_paths[@]}"
          git add -u -- \
            docs/hepta-vnext/authbus/AUTHBUS_P1_2_TEST_FAILURE_2026-08-28.txt \
            scripts/authbus-p1-2-finalize.py \
            scripts/authbus-p1-2-explicit-rollback-repair.py \
            scripts/authbus-p1-2-source-seed.part-00.b64 \
            scripts/authbus-p1-2-source-seed.part-01.b64 \
            scripts/authbus-p1-2-source-seed.part-02.b64 \
            scripts/authbus-p1-2-source-seed.part-03.b64 \
            scripts/authbus-p1-2-source-seed.part-04.b64 \
            scripts/authbus-p1-2-source-seed.part-05.b64 \
            scripts/authbus-p1-2-source-seed.part-06.b64 \
            scripts/authbus-p1-2-source-seed.part-07.b64

          cat > /tmp/authbus-p1-2-expected-paths.txt <<'EOF'
          codex-rs/hepta-authbus-p1-2-qualification/Cargo.lock
          codex-rs/hepta-authbus-p1-2-qualification/Cargo.toml
          codex-rs/hepta-authbus-p1-2-qualification/README.md
          codex-rs/hepta-authbus-p1-2-qualification/migrations/0001_authbus_p1_2.sql
          codex-rs/hepta-authbus-p1-2-qualification/src/lib.rs
          codex-rs/hepta-authbus-p1-2-qualification/src/model.rs
          codex-rs/hepta-authbus-p1-2-qualification/src/store.rs
          codex-rs/hepta-authbus-p1-2-qualification/tests/p1_2.rs
          docs/hepta-vnext/authbus/AUTHBUS_P1_2_DEVELOPMENT_PLAN_2026-08-28.md
          docs/hepta-vnext/authbus/AUTHBUS_P1_2_IMPLEMENTATION_STATUS_2026-08-28.json
          docs/hepta-vnext/authbus/AUTHBUS_P1_2_IMPLEMENTATION_STATUS_2026-08-28.md
          docs/hepta-vnext/authbus/AUTHBUS_P1_2_TEST_FAILURE_2026-08-28.txt
          scripts/authbus-p1-2-explicit-rollback-repair.py
          scripts/authbus-p1-2-finalize.py
          scripts/authbus-p1-2-source-seed.part-00.b64
          scripts/authbus-p1-2-source-seed.part-01.b64
          scripts/authbus-p1-2-source-seed.part-02.b64
          scripts/authbus-p1-2-source-seed.part-03.b64
          scripts/authbus-p1-2-source-seed.part-04.b64
          scripts/authbus-p1-2-source-seed.part-05.b64
          scripts/authbus-p1-2-source-seed.part-06.b64
          scripts/authbus-p1-2-source-seed.part-07.b64
          scripts/verify-authbus-p1-2.py
          EOF
          sed -i 's/^          //' /tmp/authbus-p1-2-expected-paths.txt
          LC_ALL=C sort -o /tmp/authbus-p1-2-expected-paths.txt /tmp/authbus-p1-2-expected-paths.txt
          git diff --cached --name-only | LC_ALL=C sort > /tmp/authbus-p1-2-actual-paths.txt
          diff -u /tmp/authbus-p1-2-expected-paths.txt /tmp/authbus-p1-2-actual-paths.txt
          ! git diff --cached --name-only | grep -q '^.github/workflows/'
          git diff --cached --check

          git commit -m "feat(authbus): persist durable replay state with explicit rollback P1.2"
          git push origin "HEAD:${GITHUB_REF_NAME}" --force-with-lease="refs/heads/${GITHUB_REF_NAME}:${GITHUB_SHA}"
