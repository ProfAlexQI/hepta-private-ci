name: C1 hosted gap closure v1

on:
  pull_request:
    paths:
      - ".github/workflows/c1-hosted-gap-closure-v1.yml"
      - "scripts/c1_hosted_gap_closure_v1.py"
      - "scripts/c1_hosted_gap_closure_v2.py"

permissions:
  contents: write

concurrency:
  group: c1-hosted-gap-closure-v1-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Exact-head closure epoch 10. Two independently allocated Unix pools run the
# same producer. Both bind EXPECTED_HEAD and use a final compare-and-swap before
# a normal push, so at most one lane can update the branch. RUSTUP_TOOLCHAIN
# binds all child Cargo invocations to the toolchain already installed above;
# entering codex-rs must not trigger a second network sync.
jobs:
  close-current-gaps:
    name: Close current hosted qualification gaps (${{ matrix.runner }})
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'integration/vnext-main-20260811'
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-slim
          - macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.head_ref }}
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Execute fail-closed exact-head closure
        run: python3 scripts/c1_hosted_gap_closure_v2.py
