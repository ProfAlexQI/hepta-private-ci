name: Temporary AuthBus P1.3 clean expiry finalizer

on:
  push:
    branches:
      - codex/authbus-p1-3-expiry-finalizer-staging-20260901
    paths:
      - ".github/workflows/_temporary-authbus-p1-3-expiry-staging-finalizer.yml"

permissions:
  contents: write

concurrency:
  group: temporary-authbus-p1-3-clean-expiry-finalizer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    name: Build clean single-parent AuthBus candidate
    runs-on: macos-15-xlarge
    timeout-minutes: 90
    env:
      STAGING_BRANCH: codex/authbus-p1-3-expiry-finalizer-staging-20260901
      TARGET_BRANCH: codex/authbus-p1-3-semantic-closure-v12-gpt56-20260831
      BASE_SHA: 8572f3d2182541b14e0719b229ccd8754494f134
      MANIFEST: codex-rs/hepta-authbus-p1-3-qualification/Cargo.toml
      SOURCE_BOOTSTRAP: .github/workflows/_temporary-authbus-p1-3-expiry-repair.yml
      COMPRESSED_SHA256: cb46ac9d61cfcd27c0ebcd28a52e6c887aa5474678c7e101663a1cbddc2b066d
      PAYLOAD_SHA256: 9cfb84ef0043528c56e7ce296930cc384a27e3ffbc730a71a1588791048c41f9
    steps:
      - name: Checkout exact isolated staging head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.STAGING_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Recover and apply content-bound repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 - "$SOURCE_BOOTSTRAP" "$RUNNER_TEMP/authbus-expiry-repair.py" <<'PY'
          from __future__ import annotations
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path
          import re
          import sys

          source = Path(sys.argv[1]).read_text(encoding="utf-8")
          match = re.search(r'^\s*REPAIR_GZIP_B64:\s*"([A-Za-z0-9+/=]+)"\s*$', source, re.MULTILINE)
          if match is None:
              raise SystemExit("bounded repair payload missing")
          compressed = base64.b64decode(match.group(1), validate=True)
          if hashlib.sha256(compressed).hexdigest() != os.environ["COMPRESSED_SHA256"]:
              raise SystemExit("compressed repair payload digest mismatch")
          payload = gzip.decompress(compressed)
          if hashlib.sha256(payload).hexdigest() != os.environ["PAYLOAD_SHA256"]:
              raise SystemExit("repair payload digest mismatch")
          if not payload.startswith(b"from __future__ import annotations\n") or len(payload) > 64_000:
              raise SystemExit("repair payload identity invalid")
          anchor = b"from pathlib import Path\n"
          if payload.count(anchor) != 1 or b"from textwrap import dedent\n" in payload:
              raise SystemExit("repair-wrapper import anchor drift")
          payload = payload.replace(anchor, anchor + b"from textwrap import dedent\n", 1)
          Path(sys.argv[2]).write_bytes(payload)
          PY
          python3 -m py_compile "$RUNNER_TEMP/authbus-expiry-repair.py"
          python3 "$RUNNER_TEMP/authbus-expiry-repair.py"
          cargo +1.95.0 fmt --manifest-path "$MANIFEST" --all
          git rm -- \
            .github/workflows/_temporary-authbus-p1-3-expiry-repair.yml \
            .github/workflows/_temporary-authbus-p1-3-expiry-repair-arm.yml \
            .github/workflows/_temporary-authbus-p1-3-expiry-repair-macos.yml \
            .github/workflows/_temporary-authbus-p1-3-expiry-staging-finalizer.yml
          git diff --check

      - name: Construct clean single-parent candidate commit
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hepta-closure-bot'
          git config user.email 'hepta-closure-bot@users.noreply.github.com'
          git add -A
          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'fix(authbus): bind dispatch to expiry and admission window' | git commit-tree "$tree" -p "$BASE_SHA")"
          git reset --hard "$commit"
          test "$(git rev-list --parents -n 1 HEAD | wc -w | tr -d ' ')" -eq 2
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA" HEAD | wc -l | tr -d ' ')" -eq 7
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Execute complete fail-closed qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/verify-authbus-p1-3-semantic-v12.py
          python3 scripts/verify-authbus-p1-3-semantic-v12.py --check-git-delta
          cargo +1.95.0 fmt --manifest-path "$MANIFEST" -- --check
          cargo +1.95.0 test --locked --manifest-path "$MANIFEST" --no-default-features
          cargo +1.95.0 test --locked --manifest-path "$MANIFEST" --features p1-3-qualification --test p1_3_semantic -- --nocapture
          cargo +1.95.0 test --locked --manifest-path "$MANIFEST" --features p1-3-qualification --tests -- --nocapture
          cargo +1.95.0 check --locked --manifest-path "$MANIFEST" --features p1-3-qualification --all-targets
          cargo +1.95.0 clippy --locked --manifest-path "$MANIFEST" --features p1-3-qualification --all-targets -- -D warnings
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Atomically publish clean candidate and clean staging ref
        shell: bash
        run: |
          set -euo pipefail
          final="$(git rev-parse HEAD)"
          git push --force origin \
            "$final:refs/heads/$TARGET_BRANCH" \
            "$final:refs/heads/$STAGING_BRANCH"
