name: hepta-actions-queue-recovery-once

on:
  push:
    branches:
      - "ops/hepta-actions-queue-recovery-20260829"

permissions:
  contents: read
  actions: write

concurrency:
  group: hepta-actions-queue-recovery-once
  cancel-in-progress: true

jobs:
  prune-stale-ui-queue:
    name: Cancel superseded queued UI runs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PROTECTED_BRANCH: codex/ui-v4-executable-final-gap-closure-v3-20260829
      PROTECTED_EVENT: pull_request
      PROTECTED_WORKFLOWS: hepta-ui-v4-final-gap-closure-v4,hepta-ui-v4-rust-served-cross-browser-final
    steps:
      - name: Build and execute bounded cancellation plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          protected_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/$PROTECTED_BRANCH" \
            | ruby -rjson -e 'puts JSON.parse(STDIN.read).fetch("commit").fetch("sha")')"
          [[ "$protected_sha" =~ ^[0-9a-f]{40}$ ]]
          export PROTECTED_HEAD_SHA="$protected_sha"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?status=queued&per_page=100" \
            > artifacts/queued.json
          ruby -rjson -rdigest -e '
            payload=JSON.parse(File.read("artifacts/queued.json"))
            branch=ENV.fetch("PROTECTED_BRANCH")
            sha=ENV.fetch("PROTECTED_HEAD_SHA")
            event=ENV.fetch("PROTECTED_EVENT")
            workflows=ENV.fetch("PROTECTED_WORKFLOWS").split(",")
            candidates=payload.fetch("workflow_runs").select do |run|
              ui=run["head_branch"].to_s.start_with?("codex/ui-v4-")
              protected=run["head_branch"]==branch && run["head_sha"]==sha &&
                run["event"]==event && workflows.include?(run["name"])
              ui && !protected
            end
            plan={
              "schema"=>"hepta.actions.queue-recovery.once.v4",
              "repository"=>ENV.fetch("GITHUB_REPOSITORY"),
              "protectedBranch"=>branch,
              "protectedHeadSha"=>sha,
              "protectedEvent"=>event,
              "protectedWorkflows"=>workflows,
              "queuedObserved"=>payload.fetch("total_count"),
              "cancelRunIds"=>candidates.map{|run|run.fetch("id")}.sort,
              "cancelled"=>[],
              "failures"=>[]
            }
            plan["planSha256"]=Digest::SHA256.hexdigest(JSON.generate(plan.reject{|key,_|%w[cancelled failures].include?(key)}))
            File.write("artifacts/plan.json",JSON.pretty_generate(plan)+"\n")
            File.write("artifacts/run-ids.txt",plan.fetch("cancelRunIds").join("\n")+(plan.fetch("cancelRunIds").empty? ? "" : "\n"))
          '
          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            code="$(curl --silent --show-error \
              --output "artifacts/cancel-$run_id.json" \
              --write-out '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel")"
            if [[ "$code" == 202 || "$code" == 409 ]]; then
              echo "$run_id" >> artifacts/cancelled.txt
            else
              printf '%s %s\n' "$run_id" "$code" >> artifacts/failures.txt
            fi
          done < artifacts/run-ids.txt
          ruby -rjson -e '
            plan=JSON.parse(File.read("artifacts/plan.json"))
            plan["cancelled"]=File.exist?("artifacts/cancelled.txt") ? File.readlines("artifacts/cancelled.txt",chomp:true).reject(&:empty?).map(&:to_i) : []
            plan["failures"]=File.exist?("artifacts/failures.txt") ? File.readlines("artifacts/failures.txt",chomp:true).reject(&:empty?) : []
            File.write("artifacts/result.json",JSON.pretty_generate(plan)+"\n")
            abort "queue recovery failures" unless plan.fetch("failures").empty?
          '
      - name: Upload queue recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-actions-queue-recovery-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
          retention-days: 7
