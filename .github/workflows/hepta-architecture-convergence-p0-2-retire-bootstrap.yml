name: Hepta architecture convergence P0.2 bootstrap retirement

on:
  push:
    branches:
      - codex/hepta-architecture-convergence-p0-2-20260828

permissions:
  contents: write

concurrency:
  group: hepta-architecture-convergence-p0-2-write-lane
  cancel-in-progress: false

jobs:
  retire:
    name: Retire P0.2 write workflows
    if: ${{ contains(github.event.head_commit.message || '', '[hepta-p0-2-finalize]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout finalized branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/hepta-architecture-convergence-p0-2-20260828
          fetch-depth: 2
          persist-credentials: true

      - name: Verify finalized input
        shell: bash
        run: |
          set -euo pipefail
          git log -1 --pretty=%s | grep -F '[hepta-p0-2-finalize]'
          git diff --exit-code
          git diff --cached --exit-code

      - name: Materialize read-only provenance stubs
        run: python3 scripts/hepta-architecture-p0-2-retire-bootstraps.py

      - name: Validate retired workflow surface
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          root = pathlib.Path(".github/workflows")
          targets = [
              "hepta-architecture-convergence-p0-2-bootstrap.yml",
              "hepta-architecture-p0-2-portability-bootstrap.yml",
              "hepta-memory-runtime-extraction-p0-1-bootstrap.yml",
              "hepta-architecture-convergence-p0-2-finalize.yml",
              "hepta-architecture-convergence-p0-2-retire-bootstrap.yml",
          ]
          for name in targets:
              source = (root / name).read_text(encoding="utf-8")
              for forbidden in (
                  "contents: write",
                  "  push:",
                  "  pull_request:",
                  "git push",
                  "git commit",
              ):
                  if forbidden in source:
                      raise SystemExit(f"retired workflow {name} retains {forbidden!r}")
              if "workflow_dispatch:" not in source or "contents: read" not in source:
                  raise SystemExit(f"retired workflow {name} is not a read-only manual stub")
          receipt = json.loads(
              pathlib.Path(
                  "docs/architecture/HEPTA_ARCHITECTURE_P0_2_BOOTSTRAP_RETIREMENT_V1.json"
              ).read_text(encoding="utf-8")
          )
          if receipt.get("status") != "RETIRED_TO_READ_ONLY_PROVENANCE_STUBS":
              raise SystemExit("bootstrap retirement receipt drifted")
          if any(receipt.get("authority", {}).values()):
              raise SystemExit("bootstrap retirement receipt escaped authority")
          PY
          git diff --check

      - name: Enforce retirement allowlist
        run: |
          python3 - <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/hepta-architecture-convergence-p0-2-bootstrap.yml",
              ".github/workflows/hepta-architecture-p0-2-portability-bootstrap.yml",
              ".github/workflows/hepta-memory-runtime-extraction-p0-1-bootstrap.yml",
              ".github/workflows/hepta-architecture-convergence-p0-2-finalize.yml",
              ".github/workflows/hepta-architecture-convergence-p0-2-retire-bootstrap.yml",
              "docs/architecture/HEPTA_ARCHITECTURE_P0_2_BOOTSTRAP_RETIREMENT_V1.json",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f"bootstrap retirement changed unexpected paths: {sorted(changed)}")
          PY

      - name: Commit retirement snapshot
        run: |
          set -euo pipefail
          git config user.name "Hepta bootstrap retirement"
          git config user.email "102159240+ProfAlexQI@users.noreply.github.com"
          git add \
            .github/workflows/hepta-architecture-convergence-p0-2-bootstrap.yml \
            .github/workflows/hepta-architecture-p0-2-portability-bootstrap.yml \
            .github/workflows/hepta-memory-runtime-extraction-p0-1-bootstrap.yml \
            .github/workflows/hepta-architecture-convergence-p0-2-finalize.yml \
            .github/workflows/hepta-architecture-convergence-p0-2-retire-bootstrap.yml \
            docs/architecture/HEPTA_ARCHITECTURE_P0_2_BOOTSTRAP_RETIREMENT_V1.json
          git diff --cached --check
          git commit -m "ci(hepta): retire P0.2 write bootstraps [hepta-bootstrap-retired]"
          git push origin HEAD:refs/heads/codex/hepta-architecture-convergence-p0-2-20260828
