name: Hepta inference V5 source archaeology ARM

on:
  push:
    branches:
      - ops/hepta-inference-v5-source-publisher-gpt56-20260830
    paths:
      - .github/workflows/hepta-inference-v5-source-archaeology-arm-gpt56.yml

permissions:
  contents: read

concurrency:
  group: hepta-inference-v5-source-archaeology-arm-gpt56
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Inventory exact path variants from inference refs
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/hepta-inference-v5-source-archaeology"
          mkdir -p "$out/blobs"
          cat > "$RUNNER_TEMP/targets.txt" <<'EOF'
          codex-rs/app-server/src/hepta_inference_shadow.rs
          codex-rs/hepta-agentd/src/inference_shadow.rs
          codex-rs/hepta-infer-client/src/product_channel.rs
          codex-rs/hepta-infer-worker-host/src/fixture_runtime.rs
          codex-rs/hepta-infer-worker-host/src/native_runtime.rs
          codex-rs/hepta-infer-worker-host/tests/native_process.rs
          codex-rs/hepta-inferd/src/bin/hepta-inferd-integrated.rs
          codex-rs/hepta-inferd/src/bin/hepta-inferd-worker-fixture.rs
          codex-rs/hepta-inferd/src/integrated_runtime.rs
          codex-rs/hepta-inferd/src/qualification_config.rs
          codex-rs/hepta-inferd/src/runtime_coordinator.rs
          codex-rs/hepta-inferd/src/runtime_server.rs
          codex-rs/hepta-inferd/tests/integrated_runtime.rs
          codex-rs/hepta-inferd/tests/worker_lane.rs
          docs/hepta-vnext/inference/HEPTA_INFERENCE_V5_EXACT_HEAD_CONTRACT.md
          docs/hepta-vnext/inference/HEPTA_INFERENCE_V5_REAL_SOFTWARE_TEST_PROCEDURE.md
          docs/hepta-vnext/inference/HEPTA_INFERENCE_V5_STAGED_ACCEPTANCE.md
          docs/hepta-vnext/inference/HEPTA_INFERENCE_V5_TRUTH.md
          .github/workflows/hepta-inference-v5-exact-head-qualification.yml
          EOF
          printf 'ref\tcommit\tpath\tblob\n' > "$out/FOUND.tsv"
          git for-each-ref --format='%(refname)' refs/remotes/origin | while read -r ref; do
            case "$ref" in
              *hepta-inference*|*inference*|*hepta-v4*|*hepta-v5*) ;;
              *) continue ;;
            esac
            commit="$(git rev-parse "$ref")"
            while read -r path; do
              blob="$(git rev-parse "$ref:$path" 2>/dev/null || true)"
              test -n "$blob" || continue
              printf '%s\t%s\t%s\t%s\n' "$ref" "$commit" "$path" "$blob" >> "$out/FOUND.tsv"
              if test ! -e "$out/blobs/$blob"; then
                git cat-file blob "$blob" > "$out/blobs/$blob"
              fi
            done < "$RUNNER_TEMP/targets.txt"
          done
          LC_ALL=C sort -u "$out/FOUND.tsv" -o "$out/FOUND.tsv"
          cp "$RUNNER_TEMP/targets.txt" "$out/TARGETS.txt"
          printf '%s\n' "$GITHUB_SHA" > "$out/ARCHAEOLOGY_HEAD"
          git rev-parse 'HEAD^{tree}' > "$out/ARCHAEOLOGY_TREE"
          sha256sum "$out/FOUND.tsv" "$out/TARGETS.txt" "$out"/blobs/* > "$out/SHA256SUMS"
          test "$(wc -l < "$out/FOUND.tsv")" -gt 1

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-v5-source-archaeology-arm-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-inference-v5-source-archaeology
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
