name: Hepta P1 source snapshot once

on:
  push:
    branches:
      - codex/hepta-architecture-gap-closure-p1-20260829
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-p1-source-snapshot-once
  cancel-in-progress: true

jobs:
  snapshot:
    name: Package exact P1 source snapshot
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify clean exact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          git rev-parse 'HEAD^{tree}'

      - name: Package bounded source tree
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz \
            --output="$RUNNER_TEMP/hepta-p1-source-${GITHUB_SHA}.tar.gz" \
            HEAD
          sha256sum "$RUNNER_TEMP/hepta-p1-source-${GITHUB_SHA}.tar.gz" \
            > "$RUNNER_TEMP/hepta-p1-source-${GITHUB_SHA}.sha256"

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-p1-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hepta-p1-source-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/hepta-p1-source-${{ github.sha }}.sha256
          if-no-files-found: error
          retention-days: 1
