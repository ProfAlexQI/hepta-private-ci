name: Hepta source export once

on:
  push:
    branches:
      - codex/hepta-architecture-convergence-p0-2-20260828
    paths:
      - .github/workflows/hepta-source-export-once.yml

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Package source tree without repository metadata
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/hepta-source-$GITHUB_SHA.tar.gz"
          tar --exclude=.git -czf "$archive" .
          sha256sum "$archive" | tee "$RUNNER_TEMP/hepta-source-$GITHUB_SHA.sha256"
      - name: Upload exact source archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hepta-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hepta-source-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/hepta-source-${{ github.sha }}.sha256
          if-no-files-found: error
          compression-level: 0
