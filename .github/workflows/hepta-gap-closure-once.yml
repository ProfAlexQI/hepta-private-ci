name: Hepta gap closure once

on:
  push:
    branches:
      - codex/hepta-architecture-convergence-p0-2-20260828
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-gap-closure-once
  cancel-in-progress: true

env:
  BRANCH_NAME: codex/hepta-architecture-convergence-p0-2-20260828
  SOURCE_HEAD: ${{ github.sha }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  close-ci-gaps:
    name: Close qualification infrastructure gaps and retire bootstrap
    if: ${{ !contains(github.event.head_commit.message || '', '[hepta-ci-gap-closed]') }}
    runs-on: ubuntu-slim
    timeout-minutes: 90
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify exact clean branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH_NAME"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          git fetch --no-tags origin "refs/heads/$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
          test "$(git rev-parse refs/remotes/origin/$BRANCH_NAME)" = "$SOURCE_HEAD"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Package exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/hepta-source-$SOURCE_HEAD.tar.gz" .

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-source-${{ env.SOURCE_HEAD }}
          path: ${{ runner.temp }}/hepta-source-${{ env.SOURCE_HEAD }}.tar.gz
          if-no-files-found: error
          retention-days: 1

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Apply bounded CI closure patch
        run: python3 scripts/hepta-close-ci-gaps-once.py

      - name: Retire one-shot mutator before qualification
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/hepta-gap-closure-once.yml \
            scripts/hepta-close-ci-gaps-once.py

      - name: Verify architecture ratchets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-hepta-architecture-convergence-p0-2.py
          python3 scripts/verify-hepta-authority-callers-p0-1.py
          python3 scripts/verify-hepta-memory-runtime-extraction-p0-1.py
          python3 scripts/verify-hepta-cross-owner-operation-wiring.py
          python3 scripts/verify-hepta-architecture-gap-ledger.py
          git diff --check

      - name: Execute newly required Automation integration suite
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-automation --test automation -- --nocapture

      - name: Enforce exact mutation surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/blocking-ci.yml",
              ".github/workflows/hepta-architecture-convergence-p0-2.yml",
              ".github/workflows/hepta-gap-closure-once.yml",
              "scripts/hepta-close-ci-gaps-once.py",
              "scripts/verify-hepta-architecture-gap-ledger.py",
              "scripts/verify-hepta-cross-owner-operation-wiring.py",
          }
          tracked = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"],
                  text=True,
              ).splitlines()
          )
          untracked = set(
              subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard"],
                  text=True,
              ).splitlines()
          )
          changed = tracked | untracked
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"CI gap closure escaped allowlist: {unexpected}")
          missing = sorted(allowed - changed)
          if missing:
              raise SystemExit(f"CI gap closure did not produce expected paths: {missing}")
          PY

      - name: Commit after final remote CAS
        shell: bash
        run: |
          set -euo pipefail
          git add \
            .github/workflows/blocking-ci.yml \
            .github/workflows/hepta-architecture-convergence-p0-2.yml \
            scripts/verify-hepta-architecture-gap-ledger.py \
            scripts/verify-hepta-cross-owner-operation-wiring.py
          git diff --cached --check
          git fetch --no-tags origin "refs/heads/$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
          test "$(git rev-parse refs/remotes/origin/$BRANCH_NAME)" = "$SOURCE_HEAD"
          git config user.name "Hepta qualification closer"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git commit -m "ci(hepta): close qualification infrastructure gaps [hepta-ci-gap-closed]"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
