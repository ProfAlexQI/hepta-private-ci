name: Hepta one-shot readiness formatter

on:
  push:
    branches:
      - codex/tmp-materialize-readiness-20260904

permissions:
  contents: write

concurrency:
  group: hepta-one-shot-readiness-formatter
  cancel-in-progress: false

jobs:
  format-and-publish:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact readiness candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/hepta-v8-readiness-closure-20260904
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v7.6.0
        with:
          version: 0.11.3

      - name: Apply and verify the canonical Python formatter
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --project scripts ruff format scripts/hepta-readiness.py
          uv run --frozen --project scripts ruff format --check scripts/hepta-readiness.py
          python3 scripts/hepta-readiness.py self-test
          python3 scripts/hepta-readiness.py generate-status --check
          python3 scripts/hepta-readiness.py verify
          git diff --check

      - name: Publish formatting-only correction
        shell: bash
        env:
          FINAL_BRANCH: codex/hepta-v8-readiness-closure-20260904
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "scripts/hepta-readiness.py"
          git config user.name "Hepta Readiness Formatter"
          git config user.email "hepta-readiness@users.noreply.github.com"
          git add scripts/hepta-readiness.py
          git diff --cached --check
          git commit -m "style(readiness): apply canonical ruff formatting" \
            -m "Authority delta: none."
          git push origin "HEAD:refs/heads/$FINAL_BRANCH"
