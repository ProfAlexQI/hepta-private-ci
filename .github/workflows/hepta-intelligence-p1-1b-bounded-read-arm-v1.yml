          plan = '''# Hepta Intelligence P1.1b — Bounded Index Read Closure

Status: source-qualified candidate; overall P1.1b remains unqualified and unwired  
Parent: `98de1c4c3d11c6644ff46f50e80071f6f15e1652`

## Objective

Close the remaining time-of-check/time-of-read and allocation boundary in immutable ANN reopen. The reader must reject zero or oversized metadata lengths, cap physical reads at `MAX_INDEX_FILE_BYTES + 1`, and reject growth or truncation between metadata inspection and the completed read.

## Exact semantic delta

- add `read_bounded_index_bytes`;
- use a bounded `Read::take(MAX_INDEX_FILE_BYTES.saturating_add(1))` surface;
- avoid allocating the full metadata-advertised maximum up front;
- require the observed byte count to exactly equal the metadata length;
- route `reopen_local_ann_index` through the bounded helper;
- add exact-length, growth, truncation, zero-length, and oversized-length regression coverage.

## Authority boundary

```text
qualified=false
wired=false
product_workspace_member=false
product_module_registered=false
default_recall_changed=false
federation_recall_changed=false
context_attachment=false
physical_send=false
network_access=false
model_download=false
external_effects=false
production_authority=false
operator_acceptance=false
promotion=false
callers_ratchet=false
```

This tranche changes no index format, ranking behavior, product caller, model, tokenizer, context attachment, physical send, or production authority. It is a prerequisite for P1.1c executable qualification only.
'''
