name: hepta-intelligence-p1-1b-bounded-read-arm-v1

on:
  push:
    branches:
      - "qualification/hepta-intelligence-p1-1b-bounded-read-arm-v1-20260828"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-intelligence-p1-1b-bounded-read-arm-v1
  cancel-in-progress: true

env:
  SOURCE_SHA: 98de1c4c3d11c6644ff46f50e80071f6f15e1652
