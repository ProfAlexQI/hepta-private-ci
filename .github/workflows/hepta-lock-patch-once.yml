name: Hepta deterministic lock patch once

on:
  push:
    branches:
      - codex/hepta-architecture-convergence-p0-2-20260828
  workflow_dispatch:

permissions:
  contents: write

env:
  BRANCH_NAME: codex/hepta-architecture-convergence-p0-2-20260828
  SOURCE_HEAD: ${{ github.sha }}

jobs:
  patch-lock:
    name: Patch exact workspace lock and retire write lanes
    if: ${{ !contains(github.event.head_commit.message || '', '[hepta-lock-patched]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout exact live head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify exact current branch identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH_NAME"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          git fetch --no-tags origin \
            "refs/heads/$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
          test "$(git rev-parse "refs/remotes/origin/$BRANCH_NAME")" = "$SOURCE_HEAD"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Apply deterministic manifest-derived lock delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          path = Path("codex-rs/Cargo.lock")
          text = path.read_text(encoding="utf-8")
          agent_old = ''' "codex-hepta-memory",
           "codex-hepta-memory-extension",
           "codex-hepta-paths",'''
          agent_new = ''' "codex-hepta-memory",
           "codex-hepta-memory-extension",
           "codex-hepta-memory-runtime",
           "codex-hepta-paths",'''
          if text.count(agent_old) != 1:
              raise SystemExit("Agentd lock dependency anchor is not exact")
          text = text.replace(agent_old, agent_new, 1)

          runtime_package = '''
          [[package]]
          name = "codex-hepta-memory-runtime"
          version = "0.0.0"
          dependencies = [
           "codex-hepta-contracts",
           "codex-hepta-memory",
           "codex-hepta-paths",
           "tempfile",
           "tokio",
          ]

          '''
          anchor = '''[[package]]
          name = "codex-hepta-native-gateway"'''
          if text.count(anchor) != 1:
              raise SystemExit("Memory runtime package insertion anchor is not exact")
          if 'name = "codex-hepta-memory-runtime"' in text:
              raise SystemExit("Memory runtime package already exists; refusing changed replay")
          text = text.replace(anchor, runtime_package + anchor, 1)
          parsed = tomllib.loads(text)
          packages = parsed.get("package", [])
          matching = [p for p in packages if p.get("name") == "codex-hepta-memory-runtime"]
          if len(matching) != 1:
              raise SystemExit("Memory runtime lock node was not materialized exactly once")
          agentd = [p for p in packages if p.get("name") == "codex-hepta-agentd"]
          if len(agentd) != 1 or "codex-hepta-memory-runtime" not in agentd[0].get("dependencies", []):
              raise SystemExit("Agentd lock edge to Memory runtime is missing")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Retire temporary write workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/hepta-lock-patch-once.yml
          git rm .github/workflows/hepta-cargo-lock-finalizer-p0-2.yml

      - name: Execute source and lock ratchets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-hepta-authority-callers-p0-1.py
          python3 scripts/verify-hepta-cross-owner-operation-wiring.py
          python3 scripts/verify-hepta-architecture-gap-ledger.py
          python3 scripts/verify-hepta-architecture-convergence-p0-2.py
          python3 scripts/verify-hepta-memory-runtime-extraction-p0-1.py
          git diff --check

      - name: Enforce exact mutation set
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python3 - <<'PY'
          import subprocess
          expected = {
              "codex-rs/Cargo.lock",
              ".github/workflows/hepta-lock-patch-once.yml",
              ".github/workflows/hepta-cargo-lock-finalizer-p0-2.yml",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines())
          if changed != expected:
              raise SystemExit(f"lock patch mutation set drifted: {sorted(changed)}")
          PY
          git diff --cached --check

      - name: Commit and fast-forward exact lock closure
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/heads/$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
          test "$(git rev-parse "refs/remotes/origin/$BRANCH_NAME")" = "$SOURCE_HEAD"
          git config user.name "Hepta deterministic lock patch"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git commit -m "build(hepta): close workspace lock graph [hepta-lock-patched]"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
