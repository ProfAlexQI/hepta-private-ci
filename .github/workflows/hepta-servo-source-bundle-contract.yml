name: hepta Servo source bundle contract

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/hepta-servo-source-bundle.py"
      - "docs/hepta-vnext/browser/SOURCE_BUNDLE_*"
      - "docs/hepta-vnext/browser/NEXT_WORK_QUEUE_C1.json"
      - "docs/hepta-vnext/browser/hepta.servo.source_*"
      - "docs/hepta-vnext/browser/hepta.servo.license_packet.v1.schema.json"
      - "docs/hepta-vnext/browser/hepta.servo.patch_inventory.v1.schema.json"
      - ".github/workflows/hepta-servo-source-bundle-contract.yml"
      - ".github/workflows/hepta-servo-source-qualification.yml"
  push:
    branches:
      - integration/vnext-main-20260811
      - "codex/hepta-*"
    paths:
      - "scripts/hepta-servo-source-bundle.py"
      - "docs/hepta-vnext/browser/SOURCE_BUNDLE_*"
      - "docs/hepta-vnext/browser/NEXT_WORK_QUEUE_C1.json"
      - "docs/hepta-vnext/browser/hepta.servo.source_*"
      - "docs/hepta-vnext/browser/hepta.servo.license_packet.v1.schema.json"
      - "docs/hepta-vnext/browser/hepta.servo.patch_inventory.v1.schema.json"
      - ".github/workflows/hepta-servo-source-bundle-contract.yml"
      - ".github/workflows/hepta-servo-source-qualification.yml"

permissions:
  contents: read

jobs:
  source-bundle-contract:
    name: Source bundle contract (local fixtures, no Servo fetch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize fixture-only posture
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/hepta-servo-source-bundle-contract"
          mkdir -p "$evidence_dir"
          echo "HEPTA_SOURCE_BUNDLE_EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "work_items=C1-004A-1,C1-004A-2,C1-004A-3,C1-004A-4"
            echo "canonical_servo_fetch_performed=false"
            echo "canonical_source_receipt=false"
            echo "canonical_source_archive=false"
            echo "worker_artifact_built=false"
            echo "sbom_created=false"
            echo "machine_authority=false"
            echo "runtime_authority=false"
            echo "production_caller=false"
            echo "production_writer=false"
            echo "effect_authority=false"
            echo "external_effect=false"
            echo "external_network_allowed=false"
            echo "credential_export_allowed=false"
            echo "operator_acceptance=false"
            echo "promotion=false"
            echo "release_qualified=false"
          } > "$evidence_dir/posture.txt"

      - name: Compile bundle tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/hepta-servo-source-bundle.py \
            2>&1 | tee "$HEPTA_SOURCE_BUNDLE_EVIDENCE_DIR/py-compile.log"

      - name: Verify static fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-servo-source-bundle.py contract \
            2>&1 | tee "$HEPTA_SOURCE_BUNDLE_EVIDENCE_DIR/contract.log"

      - name: Run seven local Git fixture tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-servo-source-bundle.py self-test \
            2>&1 | tee "$HEPTA_SOURCE_BUNDLE_EVIDENCE_DIR/self-test.log"

      - name: Parse repository-native JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            docs/hepta-vnext/browser/SOURCE_BUNDLE_STATUS.json \
            docs/hepta-vnext/browser/NEXT_WORK_QUEUE_C1.json \
            docs/hepta-vnext/browser/hepta.servo.source_comparison_receipt.v1.schema.json \
            docs/hepta-vnext/browser/hepta.servo.source_archive_receipt.v1.schema.json \
            docs/hepta-vnext/browser/hepta.servo.source_archive_comparison.v1.schema.json \
            docs/hepta-vnext/browser/hepta.servo.license_packet.v1.schema.json \
            docs/hepta-vnext/browser/hepta.servo.patch_inventory.v1.schema.json \
            docs/hepta-vnext/browser/hepta.servo.source_distribution_receipt.v1.schema.json \
            docs/hepta-vnext/browser/hepta.servo.source_bundle_verification.v1.schema.json
          do
            python3 -m json.tool "$file" >/dev/null
          done
          echo "json_contracts=passed" >> "$HEPTA_SOURCE_BUNDLE_EVIDENCE_DIR/posture.txt"

      - name: Verify clean source-bundle paths
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            scripts/hepta-servo-source-bundle.py \
            docs/hepta-vnext/browser/SOURCE_BUNDLE_STATUS.json \
            docs/hepta-vnext/browser/SOURCE_BUNDLE_QUALIFICATION.md \
            docs/hepta-vnext/browser/NEXT_WORK_QUEUE_C1.json \
            docs/hepta-vnext/browser/hepta.servo.source_* \
            docs/hepta-vnext/browser/hepta.servo.license_packet.v1.schema.json \
            docs/hepta-vnext/browser/hepta.servo.patch_inventory.v1.schema.json \
            .github/workflows/hepta-servo-source-bundle-contract.yml \
            .github/workflows/hepta-servo-source-qualification.yml \
            2>&1 | tee "$HEPTA_SOURCE_BUNDLE_EVIDENCE_DIR/clean-worktree.log"

      - name: Record fixture-only result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "job_status=${{ job.status }}" >> "$HEPTA_SOURCE_BUNDLE_EVIDENCE_DIR/posture.txt"
          {
            echo "### Hepta Servo source bundle contract"
            echo
            echo "This job uses local Git fixtures only. It validates the source-comparison,"
            echo "deterministic-archive, MPL-packet, patch-governance, and full-bundle tools."
            echo "It does not fetch Servo, build a worker, create an SBOM, or grant authority."
            echo
            sed 's/^/- /' "$HEPTA_SOURCE_BUNDLE_EVIDENCE_DIR/posture.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fixture-only contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hepta-servo-source-bundle-contract-fixtures
          path: ${{ env.HEPTA_SOURCE_BUNDLE_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7
