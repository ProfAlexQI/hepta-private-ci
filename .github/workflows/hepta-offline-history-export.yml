name: Hepta exact Git history snapshot (read-only)
on:
  push:
    branches: [diagnostic/hepta-offline-rust-20260905]
    paths: [.github/workflows/hepta-offline-history-export.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: '5926feb1cdb38f814ea2e888ea0597ebd437874c'
          persist-credentials: false
          fetch-depth: 0
      - name: Capture source objects and named heads
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/hepta-history"
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD)" = '5926feb1cdb38f814ea2e888ea0597ebd437874c'
          git for-each-ref --format='%(refname) %(objectname)' refs/remotes/origin > "$OUT/heads.txt"
          git rev-parse HEAD HEAD^{tree} > "$OUT/identity.txt"
          git bundle create "$OUT/repository.bundle" --all
          (cd "$OUT" && sha256sum repository.bundle > SHA256SUMS)
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-exact-git-history
          path: ${{ runner.temp }}/hepta-history/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
