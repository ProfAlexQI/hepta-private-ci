name: Temporary ARM V8 r2 reconstruction

on:
  push:
    branches:
      - codex/tmp-generate-cargo-lock-20260902
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: temporary-arm-v8-r2-reconstruction
  cancel-in-progress: true

env:
  SOURCE_SHA: 5a8d22b2d38a8777756212554984b0aec6ebde42
  BASE_SHA: 70ef65a90a031ce0cc08b77b5596eb0d99edaa11
  OUTPUT_BRANCH: codex/hepta-v8-repository-closure-20260902-r2
  BAZEL_ARTIFACT_ID: "9842068004"
  BAZEL_LOCK_SHA256: c03b95ff14a8c813ea4cbb27498437293057540d2374b7f9b6903c1a0a4749d4

jobs:
  reconstruct:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - name: Check out isolated carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Recover immutable product source
        shell: bash
        run: |
          set -euo pipefail
          cp candidate-r2.patch.b64 "$RUNNER_TEMP/candidate-r2.patch.b64"
          git fetch origin refs/heads/codex/tmp-materialized-v8-final-output-20260902-r1:refs/remotes/origin/materialized-r1
          git cat-file -e "$SOURCE_SHA^{commit}"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')" = 1
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install repository-pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3

      - name: Apply bounded ordinary-source patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode "$RUNNER_TEMP/candidate-r2.patch.b64" > "$RUNNER_TEMP/candidate-r2.patch"
          git apply --check "$RUNNER_TEMP/candidate-r2.patch"
          git apply "$RUNNER_TEMP/candidate-r2.patch"

      - name: Replay verified Bazel lock artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bazel-lock-artifact"
          curl --fail --location --silent --show-error --retry 5 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$BAZEL_ARTIFACT_ID/zip" \
            --output "$RUNNER_TEMP/bazel-lock.zip"
          unzip -q "$RUNNER_TEMP/bazel-lock.zip" -d "$RUNNER_TEMP/bazel-lock-artifact"
          test "$(cat "$RUNNER_TEMP/bazel-lock-artifact/bazel-lock-update.exit")" = 0
          test "$(cat "$RUNNER_TEMP/bazel-lock-artifact/bazel-lock-after.exit")" = 0
          test "$(sha256sum "$RUNNER_TEMP/bazel-lock-artifact/MODULE.bazel.lock" | awk '{print $1}')" = "$BAZEL_LOCK_SHA256"
          cp "$RUNNER_TEMP/bazel-lock-artifact/MODULE.bazel.lock" MODULE.bazel.lock

      - name: Format and qualify repaired source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path qualification/hnmf-adversarial-reference/Cargo.toml
          uv run --frozen --project scripts ruff format scripts/hepta-repository-integrity.py
          cargo fmt --manifest-path qualification/hnmf-adversarial-reference/Cargo.toml -- --check
          uv run --frozen --project scripts ruff format --check scripts/hepta-repository-integrity.py
          cargo check --manifest-path qualification/hnmf-adversarial-reference/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path qualification/hnmf-adversarial-reference/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path qualification/hnmf-adversarial-reference/Cargo.toml --locked
          python3 -m py_compile scripts/hepta-repository-integrity.py
          python3 scripts/hepta-repository-integrity.py self-test

      - name: Enforce exact source boundary
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/expected" <<'EOF'
          .github/workflows/bazel.yml
          .github/workflows/rust-ci.yml
          .github/workflows/sdk.yml
          .github/workflows/v8-canary.yml
          MODULE.bazel.lock
          qualification/hnmf-adversarial-reference/src/recall.rs
          qualification/hnmf-adversarial-reference/src/tests.rs
          scripts/hepta-repository-integrity.py
          EOF
          sort -o "$RUNNER_TEMP/expected" "$RUNNER_TEMP/expected"
          git diff --name-only | sort > "$RUNNER_TEMP/actual"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          git diff --check
          ! grep -R -n -E 'macos-15-xlarge|windows-x64|repository\.name.*-runners' \
            .github/workflows/bazel.yml \
            .github/workflows/rust-ci.yml \
            .github/workflows/sdk.yml \
            .github/workflows/v8-canary.yml
          test "$(sha256sum MODULE.bazel.lock | awk '{print $1}')" = "$BAZEL_LOCK_SHA256"

      - name: Publish single-commit candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta V8 convergence"
          git config user.email "hepta-v8-convergence@users.noreply.github.com"
          git add -- \
            .github/workflows/bazel.yml \
            .github/workflows/rust-ci.yml \
            .github/workflows/sdk.yml \
            .github/workflows/v8-canary.yml \
            MODULE.bazel.lock \
            qualification/hnmf-adversarial-reference/src/recall.rs \
            qualification/hnmf-adversarial-reference/src/tests.rs \
            scripts/hepta-repository-integrity.py
          git diff --cached --check
          git commit --amend -m "feat(v8): close repository-owned CNS, learning and product blockers"
          test "$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')" = 1
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH"
