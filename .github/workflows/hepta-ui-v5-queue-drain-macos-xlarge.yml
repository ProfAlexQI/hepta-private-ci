name: Hepta UI v5 exact-head queue drain macOS xlarge

on:
  push:
    branches:
      - ops/ui-v5-queue-drain-macos-xlarge-20260830
    paths:
      - .github/workflows/hepta-ui-v5-queue-drain-macos-xlarge.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: hepta-ui-v5-queue-drain-macos-xlarge
  cancel-in-progress: true

jobs:
  drain:
    if: github.repository == 'ProfHepta/hepta-private-ci'
    runs-on: macos-15-xlarge
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CURRENT_RUN_ID: ${{ github.run_id }}
      TARGET_BRANCH: codex/ui-v5-plan-and-repo-gap-closure-20260829
      TARGET_HEAD: 1e6f7cf3db498153fd52250dee1112f89489e094
      CLEANUP_BRANCH: ops/ui-v5-queue-drain-macos-xlarge-20260830
    steps:
      - name: Cancel only superseded UI v5 runs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          target_branch = os.environ["TARGET_BRANCH"]
          target_head = os.environ["TARGET_HEAD"]
          cleanup_branch = os.environ["CLEANUP_BRANCH"]
          api_root = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "hepta-ui-v5-exact-head-queue-drain",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request_json(url: str) -> dict:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          candidates: dict[int, dict] = {}
          retained_current: list[dict] = []
          for status in ("queued", "in_progress"):
              for page in range(1, 16):
                  query = urllib.parse.urlencode(
                      {"status": status, "per_page": 100, "page": page}
                  )
                  payload = request_json(f"{api_root}/actions/runs?{query}")
                  runs = payload.get("workflow_runs", [])
                  for run in runs:
                      run_id = int(run["id"])
                      branch = run.get("head_branch") or ""
                      head_sha = run.get("head_sha") or ""
                      if run_id == current_run_id:
                          continue
                      if branch == target_branch and head_sha == target_head:
                          retained_current.append(
                              {
                                  "id": run_id,
                                  "name": run.get("name"),
                                  "status": run.get("status"),
                                  "head_sha": head_sha,
                              }
                          )
                          continue
                      stale_target = branch == target_branch and head_sha != target_head
                      stale_helper = branch.startswith("ops/ui-v5-") and branch != cleanup_branch
                      if not (stale_target or stale_helper):
                          continue
                      candidates[run_id] = {
                          "id": run_id,
                          "branch": branch,
                          "head_sha": head_sha,
                          "status": run.get("status"),
                          "name": run.get("name"),
                          "reason": (
                              "stale_target_head"
                              if stale_target
                              else "superseded_ui_helper"
                          ),
                      }
                  if len(runs) < 100:
                      break

          cancelled: list[dict] = []
          raced: list[dict] = []
          for run_id in sorted(candidates):
              item = candidates[run_id]
              request = urllib.request.Request(
                  f"{api_root}/actions/runs/{run_id}/cancel",
                  data=b"{}",
                  headers=headers,
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status != 202:
                          raise RuntimeError(
                              f"unexpected cancellation status {response.status} for {run_id}"
                          )
                  cancelled.append(item)
              except urllib.error.HTTPError as error:
                  if error.code in {409, 422}:
                      raced.append({**item, "http_status": error.code})
                      continue
                  body = error.read().decode("utf-8", errors="replace")
                  print(
                      json.dumps(
                          {
                              "error": "cancel_failed",
                              "run": item,
                              "http_status": error.code,
                              "body": body,
                          },
                          sort_keys=True,
                      ),
                      file=sys.stderr,
                  )
                  raise

          retained_ids = [int(item["id"]) for item in retained_current]
          if len(retained_ids) != len(set(retained_ids)):
              raise SystemExit("retained current-head run list contains duplicates")
          if any(item["head_sha"] != target_head for item in retained_current):
              raise SystemExit("queue drain retained a non-current target run")

          print(
              json.dumps(
                  {
                      "schema": "hepta_ui_v5_exact_head_queue_drain_receipt_v1",
                      "status": "ready",
                      "target_branch": target_branch,
                      "target_head": target_head,
                      "cancelled_count": len(cancelled),
                      "cancelled": cancelled,
                      "raced_count": len(raced),
                      "raced": raced,
                      "retained_current_count": len(retained_current),
                      "retained_current": sorted(
                          retained_current, key=lambda item: int(item["id"])
                      ),
                      "unrelated_runs_touched": 0,
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY
