name: Hepta Q0 E1 blocker closure

on:
  push:
    branches:
      - codex/hepta-intelligence-plan-v3-20260828
    paths:
      - .github/workflows/hepta-q0-e1-residue-repair.yml

permissions:
  contents: write

concurrency:
  group: hepta-q0-e1-residue-repair
  cancel-in-progress: true

jobs:
  repair:
    name: Commit exact qualification-only Q0 source patch
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Assert exact carrier identity
        shell: bash
        env:
          EXPECTED_REPOSITORY: ProfHepta/hepta-private-ci
          EXPECTED_BRANCH: codex/hepta-intelligence-plan-v3-20260828
          EXPECTED_PARENT: 8abdd15af809ea832b5df1c417bc969bdaa20a56
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - name: Apply exact fail-closed source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/q0-qualification/close-final-gaps.py
          rm scripts/q0-qualification/close-final-gaps.py
          rm -rf scripts/__pycache__ .github/scripts/__pycache__
          git diff --check

      - name: Verify source-only patch surface and push
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          changed = subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines()
          required = {
              "scripts/q0-qualification/close-final-gaps.py",
              "codex-rs/hepta-agentd/src/app_runtime.rs",
              "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger.rs",
              "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger/insert.rs",
              "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger/support.rs",
              "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger/verify.rs",
              "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/prepare.rs",
              "codex-rs/hepta-memory/src/fact_grounding/durable/schema.rs",
              "codex-rs/hepta-memory/src/intelligence_mutation_shadow_host.rs",
              "codex-rs/hepta-memory/src/intelligence_mutation_state.rs",
              "scripts/verify-hepta-intelligence-mutation-journal.py",
              "scripts/verify-hepta-intelligence-mutation-state.py",
          }
          missing = sorted(required.difference(changed))
          if missing:
              raise AssertionError(f"required repair paths missing: {missing}")

          exact_allowed = {
              "scripts/q0-qualification/close-final-gaps.py",
              "scripts/verify-hepta-intelligence-mutation-journal.py",
              "scripts/verify-hepta-intelligence-mutation-state.py",
          }
          allowed_prefixes = (
              "codex-rs/hepta-memory/",
              "codex-rs/ext/hepta-memory/",
              "codex-rs/hepta-agentd/",
          )
          unexpected = sorted(
              path
              for path in changed
              if path not in exact_allowed
              and not path.startswith(allowed_prefixes)
          )
          if unexpected:
              raise AssertionError(f"unexpected repair paths: {unexpected}")
          workflow_changes = [
              path for path in changed if path.startswith(".github/workflows/")
          ]
          if workflow_changes:
              raise AssertionError(
                  f"source repair must not change workflows: {workflow_changes}"
              )
          print(f"verified_source_repair_path_count={len(changed)}")
          PY

          remote_head="$(
            git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1
          )"
          test "$remote_head" = "$GITHUB_SHA"

          git config user.name "hepta-q0-bot"
          git config user.email "hepta-q0-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(intelligence): close remaining Q0 repository blockers"
          repair_sha="$(git rev-parse HEAD)"
          echo "repair_sha=${repair_sha}"

          remote_head="$(
            git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1
          )"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:${GITHUB_REF_NAME}"
