name: Hepta Q0 E1 blocker closure

on:
  push:
    branches:
      - codex/hepta-intelligence-plan-v3-20260828
    paths:
      - .github/workflows/hepta-q0-e1-residue-repair.yml

permissions:
  contents: write

concurrency:
  group: hepta-q0-e1-residue-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Close E1 module-boundary and strict-lint blockers
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact repair carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Assert exact carrier identity
        shell: bash
        env:
          EXPECTED_REPOSITORY: ProfHepta/hepta-private-ci
          EXPECTED_BRANCH: codex/hepta-intelligence-plan-v3-20260828
          EXPECTED_PARENT: a64b136f16c6f71af695f2024d626618d959d4ce
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Apply exact fail-closed repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise AssertionError(
                      f"{path}: expected exactly one match, found {count}: {old!r}"
                  )
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_all_exact(
              path: str, old: str, new: str, expected_count: int
          ) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected_count:
                  raise AssertionError(
                      f"{path}: expected {expected_count} matches, found {count}: {old!r}"
                  )
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "codex-rs/hepta-agentd/src/app_runtime.rs",
              '''#[expect(
              dead_code,
              reason = "the read-only constructor remains a qualification and regression seam"
          )]
          ''',
              '''#[allow(dead_code)]
          ''',
          )

          old_clippy = (
              '"cargo clippy --locked -p codex-hepta-memory '
              '--all-targets -- -D warnings",'
          )
          new_clippy = (
              '"cargo clippy --locked -p codex-hepta-memory '
              '--all-targets --no-deps -- -D warnings",'
          )
          for path in (
              "scripts/verify-hepta-intelligence-mutation-state.py",
              "scripts/verify-hepta-intelligence-mutation-journal.py",
          ):
              replace_exact(path, old_clippy, new_clippy)

          prepare = (
              "codex-rs/hepta-memory/src/fact_grounding/"
              "durable/grounding/prepare.rs"
          )
          for function in (
              "validate_source_binding",
              "require_groundable_revision",
              "bind_exact_citation",
              "prepare",
              "validate_canonical_identity_binding",
          ):
              replace_exact(
                  prepare,
                  f"pub(super) fn {function}(",
                  f"pub(in super::super) fn {function}(",
              )

          insert = (
              "codex-rs/hepta-memory/src/fact_grounding/"
              "durable/grounding/ledger/insert.rs"
          )
          replace_exact(
              insert,
              "use super::*;\n",
              "use super::*;\n"
              "use super::support::durable_receipt_digest;\n"
              "use super::support::to_i64_len;\n",
          )
          replace_exact(
              insert,
              "pub(super) async fn insert_tx(",
              "pub(in super::super::super) async fn insert_tx(",
          )

          verify = (
              "codex-rs/hepta-memory/src/fact_grounding/"
              "durable/grounding/ledger/verify.rs"
          )
          replace_exact(
              verify,
              "use super::*;\n",
              "use super::*;\n"
              "use super::support::durable_receipt_digest;\n"
              "use super::support::limit_plus_one;\n"
              "use super::support::parse_fact_kind;\n"
              "use super::support::stored_fact_supports;\n"
              "use super::support::validate_span_range_corrupt;\n",
          )
          replace_exact(
              verify,
              "pub(super) async fn verify_receipts(",
              "pub(in super::super::super) async fn verify_receipts(",
          )

          ledger = (
              "codex-rs/hepta-memory/src/fact_grounding/"
              "durable/grounding/ledger.rs"
          )
          replace_exact(
              ledger,
              "pub(super) use insert::insert_tx;",
              "pub(in super::super) use insert::insert_tx;",
          )
          replace_exact(
              ledger,
              "pub(super) use verify::verify_receipts;",
              "pub(in super::super) use verify::verify_receipts;",
          )

          support = (
              "codex-rs/hepta-memory/src/fact_grounding/"
              "durable/grounding/ledger/support.rs"
          )
          replace_exact(
              support,
              "use super::*;\n",
              "use super::*;\nuse crate::framing::frame_part;\n",
          )
          replace_exact(
              support,
              "async fn stored_fact_supports(",
              "pub(super) async fn stored_fact_supports(",
          )
          for function in (
              "durable_receipt_digest",
              "parse_fact_kind",
              "validate_span_range_corrupt",
              "to_i64_len",
              "limit_plus_one",
          ):
              replace_exact(
                  support,
                  f"fn {function}(",
                  f"pub(super) fn {function}(",
              )
          replace_all_exact(
              support,
              "super::super::frame_part",
              "frame_part",
              16,
          )

          replace_exact(
              "codex-rs/hepta-memory/src/fact_grounding/durable/schema.rs",
              "use sqlx::Executor;\n",
              "",
          )
          replace_exact(
              "codex-rs/hepta-memory/src/intelligence_mutation_shadow_host.rs",
              "use super::intelligence_mutation_state::IntelligenceMutationState;\n",
              "",
          )
          PY

          (cd codex-rs && cargo fmt --all)
          (cd codex-rs && cargo fmt --all -- --check)
          git diff --check

      - name: Verify all source gates and the complete Q0 Rust matrix
        shell: bash
        run: |
          set -euo pipefail
          carrier=.github/workflows/hepta-q0-e1-residue-repair.yml
          rm "$carrier"

          artifact_dir="$RUNNER_TEMP/hepta-q0-e1-blocker-closure"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir/gates" "$artifact_dir/rust"

          ARTIFACT_DIR="$artifact_dir" \
            bash scripts/q0-qualification/10-source-gates.sh
          ARTIFACT_DIR="$artifact_dir" \
            bash scripts/q0-qualification/20-rust-matrix.sh

          python3 - "$artifact_dir" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          exits = sorted(root.glob("*/*.exit"))
          if not exits:
              raise AssertionError("qualification emitted no exit records")
          failed = {
              str(path.relative_to(root)): path.read_text(encoding="utf-8").strip()
              for path in exits
              if path.read_text(encoding="utf-8").strip() != "0"
          }
          if failed:
              raise AssertionError(f"qualification failures: {failed}")
          print(f"verified_exit_count={len(exits)}")
          PY

          rm -rf scripts/__pycache__ .github/scripts/__pycache__
          (cd codex-rs && cargo fmt --all -- --check)
          git diff --check

      - name: Commit verified repair, bind final candidate, and retire carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/__pycache__ .github/scripts/__pycache__

          python3 - <<'PY'
          import subprocess

          changed = subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines()
          expected = sorted(
              [
                  ".github/workflows/hepta-q0-e1-residue-repair.yml",
                  "codex-rs/hepta-agentd/src/app_runtime.rs",
                  "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger.rs",
                  "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger/insert.rs",
                  "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger/support.rs",
                  "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger/verify.rs",
                  "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/prepare.rs",
                  "codex-rs/hepta-memory/src/fact_grounding/durable/schema.rs",
                  "codex-rs/hepta-memory/src/intelligence_mutation_shadow_host.rs",
                  "scripts/verify-hepta-intelligence-mutation-journal.py",
                  "scripts/verify-hepta-intelligence-mutation-state.py",
              ]
          )
          if sorted(changed) != expected:
              raise AssertionError(
                  f"unexpected repair paths: actual={sorted(changed)} expected={expected}"
              )
          PY

          remote_head="$(
            git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1
          )"
          test "$remote_head" = "$GITHUB_SHA"

          git config user.name "hepta-q0-bot"
          git config user.email "hepta-q0-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(intelligence): close Q0 E1 module and lint blockers"
          repair_sha="$(git rev-parse HEAD)"

          REPAIR_SHA="$repair_sha" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(
              ".github/workflows/hepta-intelligence-q0-paired-candidate-v10.yml"
          )
          text = path.read_text(encoding="utf-8")
          old = "  EXPECTED_PARENT: b445bfbfd22efb5ba81ed66b1b68b27934ccc701\n"
          new = f"  EXPECTED_PARENT: {os.environ['REPAIR_SHA']}\n"
          if text.count(old) != 1:
              raise AssertionError("paired workflow parent binding drifted")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          test "$(
            git diff --name-only
          )" = ".github/workflows/hepta-intelligence-q0-paired-candidate-v10.yml"
          git diff --check
          python3 scripts/verify-hepta-intelligence-q0-workflow-consolidation.py
          git add .github/workflows/hepta-intelligence-q0-paired-candidate-v10.yml
          git diff --cached --check
          git commit -m "ci(q0): bind candidate to E1 blocker closure"

          test "$(git rev-parse HEAD^)" = "$repair_sha"
          remote_head="$(
            git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1
          )"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:${GITHUB_REF_NAME}"
