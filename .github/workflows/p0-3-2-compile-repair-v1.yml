name: p0-3-2-compile-repair-v1

on:
  push:
    branches:
      - "codex/hepta-intelligence-shared-projection-planner-v5-20260828"
    paths:
      - ".github/workflows/p0-3-2-compile-repair-v1.yml"

permissions:
  contents: write

concurrency:
  group: p0-3-2-compile-repair-v1
  cancel-in-progress: true

jobs:
  repair:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@v4
        with:
          ref: codex/hepta-intelligence-shared-projection-planner-v5-20260828
          fetch-depth: 0

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Apply bounded compile and qualification repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected exactly one replacement target, observed {count}: {old[:120]!r}"
                  )
              write(path, text.replace(old, new, 1))

          prepare = "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/prepare.rs"
          text = read(prepare)
          for name in (
              "validate_source_binding",
              "require_groundable_revision",
              "bind_exact_citation",
              "prepare",
              "validate_canonical_identity_binding",
          ):
              old = f"pub(super) fn {name}("
              new = f"pub(in super::super) fn {name}("
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{prepare}: expected one visibility target for {name}, observed {count}"
                  )
              text = text.replace(old, new, 1)
          write(prepare, text)

          replace_once(
              "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger/insert.rs",
              "pub(super) async fn insert_tx(",
              "pub(in super::super::super) async fn insert_tx(",
          )
          replace_once(
              "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger/verify.rs",
              "pub(super) async fn verify_receipts(",
              "pub(in super::super::super) async fn verify_receipts(",
          )

          support = "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger/support.rs"
          text = read(support)
          count = text.count("super::super::frame_part")
          if count < 10:
              raise SystemExit(
                  f"{support}: expected the durable digest frame helper calls, observed {count}"
              )
          text = text.replace("super::super::frame_part", "crate::framing::frame_part")
          write(support, text)

          schema = "codex-rs/hepta-memory/src/fact_grounding/durable/schema.rs"
          replace_once(schema, "use sqlx::Executor;\n", "")

          reopen = "codex-rs/hepta-memory/src/cognitive_store.rs"
          replace_once(
              reopen,
              "#[derive(Clone, Debug, Eq, Ord, PartialEq, PartialOrd)]\nstruct StoredProjectionEdge {",
              """#[derive(Clone, Debug, Eq, Ord, PartialEq, PartialOrd)]
struct StoredProjectionNode {
    node_id: String,
    canonical_entity_id: String,
    entity_type: String,
    label: String,
    valid_from: i64,
    valid_to: Option<i64>,
    memory_id: String,
    memory_revision: i64,
    source_id: String,
    source_revision: i64,
}

impl From<&ProjectionNode> for StoredProjectionNode {
    fn from(node: &ProjectionNode) -> Self {
        Self {
            node_id: node.node_id.clone(),
            canonical_entity_id: node.canonical_entity_id.clone(),
            entity_type: node.entity_type.clone(),
            label: node.label.clone(),
            valid_from: node.valid_from,
            valid_to: node.valid_to,
            memory_id: node.memory_id.clone(),
            memory_revision: node.memory_revision,
            source_id: node.source_id.clone(),
            source_revision: node.source_revision,
        }
    }
}

#[derive(Clone, Debug, Eq, Ord, PartialEq, PartialOrd)]
struct StoredProjectionEdge {""",
          )
          replace_once(
              reopen,
              """            \"SELECT r.memory_id, r.revision, r.content_sha256,
                    r.verification, r.lifecycle, s.fact_set_sha256
             FROM memory_heads h""",
              """            \"SELECT r.memory_id, r.revision, r.content_sha256,
                    r.verification, r.lifecycle, s.fact_set_sha256,
                    s.entity_count, s.relation_count
             FROM memory_heads h""",
          )
          replace_once(
              reopen,
              """                    lifecycle: row.try_get(\"lifecycle\").map_err(unavailable)?,
                    fact_set_sha256: row.try_get(\"fact_set_sha256\").map_err(unavailable)?,
                })""",
              """                    lifecycle: row.try_get(\"lifecycle\").map_err(unavailable)?,
                    fact_set_sha256: row.try_get(\"fact_set_sha256\").map_err(unavailable)?,
                    entity_count: row.try_get(\"entity_count\").map_err(unavailable)?,
                    relation_count: row.try_get(\"relation_count\").map_err(unavailable)?,
                    grounding_receipt_sha256: None,
                })""",
          )
          replace_once(
              reopen,
              """            expected_nodes.push(ProjectionNode {
                node_id: occurrence_node_id(&memory_id, memory_revision, &entity_key),
                canonical_entity_id: row.try_get(\"canonical_entity_id\").map_err(unavailable)?,
                entity_type: row.try_get(\"entity_type\").map_err(unavailable)?,""",
              """            expected_nodes.push(ProjectionNode {
                node_id: occurrence_node_id(&memory_id, memory_revision, &entity_key),
                canonical_entity_id: row.try_get(\"canonical_entity_id\").map_err(unavailable)?,
                entity_key,
                entity_type: row.try_get(\"entity_type\").map_err(unavailable)?,""",
          )
          replace_once(
              reopen,
              """            expected_edges.push(ProjectionEdge {
                edge_id: occurrence_edge_id(&memory_id, memory_revision, &relation_key),
                canonical_relation_id: row.try_get(\"canonical_relation_id\").map_err(unavailable)?,
                from_node_id: occurrence_node_id(&memory_id, memory_revision, &from_entity_key),
                to_node_id: occurrence_node_id(&memory_id, memory_revision, &to_entity_key),""",
              """            expected_edges.push(ProjectionEdge {
                edge_id: occurrence_edge_id(&memory_id, memory_revision, &relation_key),
                canonical_relation_id: row.try_get(\"canonical_relation_id\").map_err(unavailable)?,
                relation_key,
                from_entity_key: from_entity_key.clone(),
                to_entity_key: to_entity_key.clone(),
                from_node_id: occurrence_node_id(&memory_id, memory_revision, &from_entity_key),
                to_node_id: occurrence_node_id(&memory_id, memory_revision, &to_entity_key),""",
          )
          replace_once(
              reopen,
              """        let mut stored_nodes = stored_node_rows
            .into_iter()
            .map(|row| {
                Ok(ProjectionNode {
                    node_id: row.try_get(\"node_id\").map_err(unavailable)?,
                    canonical_entity_id: row.try_get(\"canonical_entity_id\").map_err(unavailable)?,
                    entity_type: row.try_get(\"entity_type\").map_err(unavailable)?,
                    label: row.try_get(\"label\").map_err(unavailable)?,
                    valid_from: row
                        .try_get(\"valid_from_unix_seconds\")
                        .map_err(unavailable)?,
                    valid_to: row.try_get(\"valid_to_unix_seconds\").map_err(unavailable)?,
                    memory_id: row.try_get(\"memory_id\").map_err(unavailable)?,
                    memory_revision: row.try_get(\"memory_revision\").map_err(unavailable)?,
                    source_id: row.try_get(\"source_id\").map_err(unavailable)?,
                    source_revision: row.try_get(\"source_revision\").map_err(unavailable)?,
                })
            })
            .collect::<Result<Vec<_>, CognitiveStoreError>>()?;
        let mut expected_nodes_by_id = expected_nodes.clone();
        expected_nodes_by_id.sort_by(|left, right| left.node_id.cmp(&right.node_id));
        stored_nodes.sort_by(|left, right| left.node_id.cmp(&right.node_id));
        if stored_nodes != expected_nodes_by_id {""",
              """        let mut stored_nodes = stored_node_rows
            .into_iter()
            .map(|row| {
                Ok(StoredProjectionNode {
                    node_id: row.try_get(\"node_id\").map_err(unavailable)?,
                    canonical_entity_id: row.try_get(\"canonical_entity_id\").map_err(unavailable)?,
                    entity_type: row.try_get(\"entity_type\").map_err(unavailable)?,
                    label: row.try_get(\"label\").map_err(unavailable)?,
                    valid_from: row
                        .try_get(\"valid_from_unix_seconds\")
                        .map_err(unavailable)?,
                    valid_to: row.try_get(\"valid_to_unix_seconds\").map_err(unavailable)?,
                    memory_id: row.try_get(\"memory_id\").map_err(unavailable)?,
                    memory_revision: row.try_get(\"memory_revision\").map_err(unavailable)?,
                    source_id: row.try_get(\"source_id\").map_err(unavailable)?,
                    source_revision: row.try_get(\"source_revision\").map_err(unavailable)?,
                })
            })
            .collect::<Result<Vec<_>, CognitiveStoreError>>()?;
        let mut expected_stored_nodes = expected_nodes
            .iter()
            .map(StoredProjectionNode::from)
            .collect::<Vec<_>>();
        stored_nodes.sort();
        expected_stored_nodes.sort();
        if stored_nodes != expected_stored_nodes {""",
          )

          for workflow in (
              ".github/workflows/hepta-intelligence-shared-projection-planner-v5.yml",
              ".github/workflows/hepta-intelligence-shared-projection-planner-v5-macos.yml",
          ):
              text = read(workflow)
              marker = '      - "codex-rs/hepta-memory/src/cognitive_kg_store.rs"\n'
              if '      - "codex-rs/hepta-memory/src/cognitive_store.rs"\n' not in text:
                  occurrences = text.count(marker)
                  if occurrences != 2:
                      raise SystemExit(
                          f"{workflow}: expected two path-filter insertion points, observed {occurrences}"
                      )
                  text = text.replace(
                      marker,
                      '      - "codex-rs/hepta-memory/src/cognitive_store.rs"\n' + marker,
                  )
              candidate_fmt = """rustfmt --edition 2024 --check \\
            hepta-memory/src/cognitive_store.rs \\
            hepta-memory/src/cognitive_kg_store.rs \\
            hepta-memory/src/cognitive_projection_planner.rs \\
            hepta-memory/src/framing.rs \\
            hepta-memory/src/fact_grounding/durable.rs \\
            hepta-memory/src/fact_grounding/durable/grounding.rs \\
            hepta-memory/src/fact_grounding/durable/grounding/prepare.rs \\
            hepta-memory/src/fact_grounding/durable/grounding/ledger.rs \\
            hepta-memory/src/fact_grounding/durable/grounding/ledger/insert.rs \\
            hepta-memory/src/fact_grounding/durable/grounding/ledger/support.rs \\
            hepta-memory/src/fact_grounding/durable/grounding/ledger/verify.rs \\
            hepta-memory/src/fact_grounding/durable/schema.rs \\
            hepta-memory/src/fact_grounding/shadow_projection_gate.rs"""
              if workflow.endswith("-macos.yml"):
                  old = 'cargo fmt -p codex-hepta-memory -- --check > "$OUT/logs/fmt.log" 2>&1'
                  new = candidate_fmt + ' > "$OUT/logs/fmt.log" 2>&1'
              else:
                  old = """cargo fmt -p codex-hepta-memory -- --check \\
            > \"$OUT/logs/fmt.log\" 2>&1"""
                  new = candidate_fmt + """ \\
            > \"$OUT/logs/fmt.log\" 2>&1"""
              if old not in text:
                  raise SystemExit(f"{workflow}: formatter command target is missing")
              text = text.replace(old, new, 1)
              text = text.replace(
                  '"FMT": "cargo fmt -p codex-hepta-memory -- --check",',
                  '"FMT": "rustfmt --edition 2024 --check P0.3.2 candidate files",',
              )
              write(workflow, text)

          verifier = "scripts/verify-hepta-intelligence-shared-projection-planner-v5.py"
          text = read(verifier)
          replace_target = '''    "product": ROOT / "codex-rs/hepta-memory/src/cognitive_kg_store.rs",\n'''
          replace_value = '''    "reopen": ROOT / "codex-rs/hepta-memory/src/cognitive_store.rs",\n    "product": ROOT / "codex-rs/hepta-memory/src/cognitive_kg_store.rs",\n'''
          if replace_target not in text:
              raise SystemExit(f"{verifier}: FILES product entry is missing")
          text = text.replace(replace_target, replace_value, 1)
          replace_target = '''    "ledger": ROOT\n    / "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger.rs",\n'''
          replace_value = '''    "grounding": ROOT\n    / "codex-rs/hepta-memory/src/fact_grounding/durable/grounding.rs",\n    "prepare": ROOT\n    / "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/prepare.rs",\n    "ledger": ROOT\n    / "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger.rs",\n    "insert": ROOT\n    / "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger/insert.rs",\n'''
          if replace_target not in text:
              raise SystemExit(f"{verifier}: FILES ledger entry is missing")
          text = text.replace(replace_target, replace_value, 1)
          replace_target = '''    planner = text["planner"]\n    product = text["product"]\n'''
          replace_value = '''    planner = text["planner"]\n    reopen = text["reopen"]\n    product = text["product"]\n'''
          if replace_target not in text:
              raise SystemExit(f"{verifier}: local product binding is missing")
          text = text.replace(replace_target, replace_value, 1)
          replace_target = '''    schema = text["schema"]\n    ledger = text["ledger"]\n'''
          replace_value = '''    schema = text["schema"]\n    grounding = text["grounding"]\n    prepare = text["prepare"]\n    ledger = text["ledger"]\n    insert = text["insert"]\n'''
          if replace_target not in text:
              raise SystemExit(f"{verifier}: local ledger binding is missing")
          text = text.replace(replace_target, replace_value, 1)
          insertion = '''    checks["ledger.helper_visibility_bounded"] = has_all(\n'''
          if insertion not in text:
              raise SystemExit(f"{verifier}: helper visibility check insertion point is missing")
          extra = '''    checks["durable.module_visibility_bounded"] = has_all(\n        prepare,\n        (\n            "pub(in super::super) fn validate_source_binding",\n            "pub(in super::super) fn require_groundable_revision",\n            "pub(in super::super) fn bind_exact_citation",\n            "pub(in super::super) fn prepare",\n            "pub(in super::super) fn validate_canonical_identity_binding",\n        ),\n    ) and has_all(\n        insert + "\\n" + verify,\n        (\n            "pub(in super::super::super) async fn insert_tx",\n            "pub(in super::super::super) async fn verify_receipts",\n        ),\n    )\n    checks["ledger.frame_helper_absolute"] = (\n        "crate::framing::frame_part" in support\n        and "super::super::frame_part" not in support\n    )\n    checks["reopen.semantic_metadata_adapter"] = has_all(\n        reopen,\n        (\n            "struct StoredProjectionNode",\n            "impl From<&ProjectionNode> for StoredProjectionNode",\n            "grounding_receipt_sha256: None",\n            "entity_count: row.try_get",\n            "relation_count: row.try_get",\n            "expected_stored_nodes",\n            "map(StoredProjectionNode::from)",\n        ),\n    )\n'''
          text = text.replace(insertion, extra + insertion, 1)
          text = text.replace(
              '        framing + "\\n" + durable + "\\n" + ledger,',
              '        framing + "\\n" + durable + "\\n" + grounding + "\\n" + ledger,',
              1,
          )
          text = text.replace(
              '''            '#[path = "durable/grounding.rs"]',\n            '#[path = "durable/schema.rs"]',\n            '#[path = "ledger/support.rs"]',\n            '#[path = "ledger/verify.rs"]',\n''',
              '''            '#[path = "durable/grounding.rs"]',\n            '#[path = "durable/schema.rs"]',\n            '#[path = "grounding/prepare.rs"]',\n            '#[path = "ledger/insert.rs"]',\n            '#[path = "ledger/support.rs"]',\n            '#[path = "ledger/verify.rs"]',\n''',
              1,
          )
          write(verifier, text)
          PY

          cd codex-rs
          rustfmt --edition 2024 \
            hepta-memory/src/cognitive_store.rs \
            hepta-memory/src/cognitive_kg_store.rs \
            hepta-memory/src/cognitive_projection_planner.rs \
            hepta-memory/src/framing.rs \
            hepta-memory/src/fact_grounding/durable.rs \
            hepta-memory/src/fact_grounding/durable/grounding.rs \
            hepta-memory/src/fact_grounding/durable/grounding/prepare.rs \
            hepta-memory/src/fact_grounding/durable/grounding/ledger.rs \
            hepta-memory/src/fact_grounding/durable/grounding/ledger/insert.rs \
            hepta-memory/src/fact_grounding/durable/grounding/ledger/support.rs \
            hepta-memory/src/fact_grounding/durable/grounding/ledger/verify.rs \
            hepta-memory/src/fact_grounding/durable/schema.rs \
            hepta-memory/src/fact_grounding/shadow_projection_gate.rs
          cd ..

          set +e
          python3 scripts/verify-hepta-intelligence-shared-projection-planner-v5.py \
            | tee /tmp/p032-source-after-repair.json
          SOURCE=$?
          cd codex-rs
          cargo check -p codex-hepta-memory --all-targets \
            2>&1 | tee /tmp/p032-check-after-repair.log
          CHECK=${PIPESTATUS[0]}
          cd ..
          set -e

          rm .github/workflows/p0-3-2-compile-repair-v1.yml
          git config user.name "Qian QI"
          git config user.email "102159240+ProfAlexQI@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(memory): close P0.3.2 compile and reopen seams"
          git push origin HEAD:codex/hepta-intelligence-shared-projection-planner-v5-20260828

          test "$SOURCE" = 0
          test "$CHECK" = 0
