name: p0-3-2-compile-repair-v2

on:
  push:
    branches:
      - "codex/hepta-intelligence-shared-projection-planner-v5-20260828"
    paths:
      - "scripts/repair-hepta-intelligence-p0-3-2-compile-v2.py"
      - ".github/workflows/p0-3-2-compile-repair-v1.yml"

permissions:
  contents: write

concurrency:
  group: p0-3-2-compile-repair-v2
  cancel-in-progress: true

jobs:
  repair:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@v4
        with:
          ref: codex/hepta-intelligence-shared-projection-planner-v5-20260828
          fetch-depth: 0

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Apply bounded source repair
        run: python3 scripts/repair-hepta-intelligence-p0-3-2-compile-v2.py

      - name: Format exact repaired source set
        working-directory: codex-rs
        run: |
          rustfmt --edition 2024 \
            hepta-memory/src/cognitive_store.rs \
            hepta-memory/src/fact_grounding/durable/grounding/prepare.rs \
            hepta-memory/src/fact_grounding/durable/grounding/ledger/insert.rs \
            hepta-memory/src/fact_grounding/durable/grounding/ledger/support.rs \
            hepta-memory/src/fact_grounding/durable/grounding/ledger/verify.rs \
            hepta-memory/src/fact_grounding/durable/schema.rs

      - name: Verify source contract
        run: python3 scripts/verify-hepta-intelligence-shared-projection-planner-v5.py

      - name: Check every hepta-memory target
        working-directory: codex-rs
        run: cargo check -p codex-hepta-memory --all-targets

      - name: Commit verified compile repair
        run: |
          rm scripts/repair-hepta-intelligence-p0-3-2-compile-v2.py
          rm .github/workflows/p0-3-2-compile-repair-v1.yml
          git config user.name "Qian QI"
          git config user.email "102159240+ProfAlexQI@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(memory): close P0.3.2 compile and reopen seams"
          git push origin HEAD:codex/hepta-intelligence-shared-projection-planner-v5-20260828
