name: Hepta canonical baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "README.md"
      - "docs/CURRENT.json"
      - "docs/STATUS.md"
      - "docs/architecture/README.md"
      - "scripts/verify-hepta-current-baseline.py"
      - ".github/workflows/hepta-current-baseline.yml"
  push:
    branches:
      - integration/vnext-main-20260811
      - codex/hepta-canonical-baseline-v1-20260831
    paths:
      - "README.md"
      - "docs/CURRENT.json"
      - "docs/STATUS.md"
      - "docs/architecture/README.md"
      - "scripts/verify-hepta-current-baseline.py"
      - ".github/workflows/hepta-current-baseline.yml"

permissions:
  contents: read

concurrency:
  group: hepta-current-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify canonical discovery baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact event identity
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record exact identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "event=$GITHUB_EVENT_NAME"
            echo "github_sha=$GITHUB_SHA"
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "runtime_authority=false"
            echo "production_authority=false"
            echo "operator_acceptance=false"
            echo "promotion=false"
            echo "release=false"
          } | tee "$RUNNER_TEMP/hepta-current-baseline.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify baseline source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/verify-hepta-current-baseline.py
          python3 scripts/verify-hepta-current-baseline.py
          python3 -m json.tool docs/CURRENT.json >/dev/null
          git diff --check

      - name: Require read-only clean execution
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
