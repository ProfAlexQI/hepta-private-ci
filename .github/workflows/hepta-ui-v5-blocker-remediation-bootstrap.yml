          - deterministic plugin-manifest candidate ordering and canonical Windows path identity assertions.

          These changes remain unqualified until the final exact PR head receives nonempty successful
          assigned-runner jobs. Physical-device evidence, browser-human acceptance, Ed25519 operator
          acceptance, product binding, production, promotion, and release authority remain false.
          """
          if "## Remediation round 2 — exact-head failures observed on PR #78" in plan:
              raise SystemExit("remediation round 2 appendix already exists")
          normalized_appendix = __import__("textwrap").dedent(appendix).strip()
          if not normalized_appendix.startswith(
              "## Remediation round 2 — exact-head failures observed on PR #78"
          ):
              raise SystemExit("remediation appendix heading normalization failed")
          if any(line.startswith("          ") for line in normalized_appendix.splitlines()):
              raise SystemExit("remediation appendix retained generator indentation")
          plan_path.write_text(
              plan.rstrip() + "\n\n" + normalized_appendix + "\n",
