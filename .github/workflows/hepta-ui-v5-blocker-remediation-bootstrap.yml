          active_plan_path = root / "docs/ui/HEPTA_UI_ACTIVE_PLAN_V5.json"
          active_plan = json.loads(active_plan_path.read_text(encoding="utf-8"))
          active_plan["status"] = "REMEDIATION_ROUND_2_COMMITTED_HOSTED_QUALIFICATION_REQUIRED"
          active_plan["implementationCandidate"] = {
