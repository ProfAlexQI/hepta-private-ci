                  "record": {
                      "path": record_rel,
                      "sha256": record_sha,
                      "schema_version": "hepta_upstream_codex_semantic_absorption_record_v1",
                  },
                  "disposition_bindings": bindings,
              }
          )
          write_json(registry_path, registry)
          registry_sha = sha256_path(registry_path)

          ci_contract = json.loads(ci_contract_path.read_text(encoding="utf-8"))
          refs = ci_contract["upstream_intake"]["refs"]
          if any(value.get("role") == "current_r12" for value in refs):
              raise SystemExit("R12 CI intake ref already exists")
          refs.append(
