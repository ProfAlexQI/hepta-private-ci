          write_json(active_plan_path, active_plan)

          ledger_path = root / "docs/ui/HEPTA_UI_REPOSITORY_GAP_LEDGER_V1.json"
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          ledger["candidate"] = {
