                          "bounded behavioral evidence for any accepted transplant",
                      ],
                      "tests_run": False,
                      "hepta_commit": None,
                      "non_claims": non_claims,
                  }
              )
              bindings.append(
                  {
                      "kind": "deferral",
                      "upstream_commit": commit,
                      "local_commit": None,
                      "scope": scope,
                      "non_claims": non_claims,
                  }
              )

          record = {
              "schema_version": "hepta_upstream_codex_semantic_absorption_record_v1",
              "source_intake": {
                  "path": intake_rel,
