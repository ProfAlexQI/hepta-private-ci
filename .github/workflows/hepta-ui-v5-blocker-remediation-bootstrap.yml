                  "deferred_commit_count": len(deferrals),
                  "upstream_fully_consumed": False,
                  "merge_performed": False,
                  "rebase_performed": False,
                  "cherry_pick_performed": False,
                  "live_enablement": False,
                  "deployment": False,
                  "publication": False,
              },
          }
          record_path.parent.mkdir(parents=True, exist_ok=True)
          write_json(record_path, record)
          record_sha = sha256_path(record_path)

          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          if any(value.get("id") == "r12" for value in registry["records"]):
              raise SystemExit("R12 semantic registry entry already exists")
          registry["upstream"]["frozen_ref"] = frozen_ref
          registry["upstream"]["expected_head"] = upstream_head
          registry["records"].append(
              {
                  "id": "r12",
                  "source_intake": {
                      "path": intake_rel,
                      "sha256": intake_sha,
                      "range_start_exclusive": previous,
                      "range_end_inclusive": upstream_head,
                      "frozen_ref": frozen_ref,
