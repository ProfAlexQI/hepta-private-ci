          for gap in ledger.get("gaps", []):
              gap["state"] = "REMEDIATION_COMMITTED_AWAITING_EXACT_HEAD_HOSTED_QUALIFICATION"
          known_ids = {gap["id"] for gap in ledger.get("gaps", [])}
          additions = [
