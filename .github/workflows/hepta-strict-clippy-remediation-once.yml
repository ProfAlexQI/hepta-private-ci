name: Hepta integrated blocker closure bootstrap

on:
  push:
    branches:
      - codex/hepta-gap-closure-v2-20260829
    paths:
      - .github/workflows/hepta-strict-clippy-remediation-once.yml

permissions:
  contents: write

concurrency:
  group: hepta-integrated-blocker-closure-bootstrap
  cancel-in-progress: false

jobs:
  close-integrated-blockers:
    if: "${{ github.event.head_commit.message == 'ci: integrate Hepta hosted blocker closure' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      EXPECTED_PARENT: 8d27dc216bde821110fd966bea331af7d56810c0
      EXPECTED_CANONICAL_WORKFLOW_BLOB: 84f817b12cea184405729e831044ba782cbb6472
      BRANCH: codex/hepta-gap-closure-v2-20260829
      WORKFLOW_PATH: .github/workflows/hepta-strict-clippy-remediation-once.yml
    steps:
      - name: Checkout exact integrated bootstrap head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify immutable canonical boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse "$EXPECTED_PARENT:$WORKFLOW_PATH")" = "$EXPECTED_CANONICAL_WORKFLOW_BLOB"
          test -z "$(git status --porcelain)"

      - name: Set up CI environment
        uses: ./.github/actions/setup-ci

      - name: Install pinned Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Apply canonical remediation plus H7 reopen closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess
          import textwrap
          from pathlib import Path

          parent = os.environ["EXPECTED_PARENT"]
          workflow = os.environ["WORKFLOW_PATH"]
          source = subprocess.check_output(
              ["git", "show", f"{parent}:{workflow}"],
              text=True,
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = (
              "\n          PY\n\n"
              "      - name: Run compiler-guided mechanical remediation"
          )
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit("canonical remediation block boundary is not unique")
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          if "remove_struct_fields" not in script or "too_many" not in script:
              raise SystemExit("canonical remediation payload is incomplete")
          Path(".hepta-canonical-remediation.py").write_text(script, encoding="utf-8")
          PY
          python .hepta-canonical-remediation.py
          rm -- .hepta-canonical-remediation.py
          python - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-memory/src/h7_trajectory_store_tests.rs")
          source = path.read_text(encoding="utf-8")
          old = "    drop(store);\n"
          new = "    store.pool.close().await;\n"
          count = source.count(old)
          if count != 2:
              raise SystemExit(
                  f"expected exactly two H7 reopen pool drops, found {count}"
              )
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          git diff --check

      - name: Run compiler-guided mechanical remediation
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt \
            -p codex-hepta-memory \
            -p codex-hepta-agentd \
            -p codex-hepta-agent-protocol \
            -p codex-app-server-protocol
          for pass in 1 2; do
            echo "clippy-fix-pass=$pass"
            cargo clippy --fix --locked --all-targets \
              --allow-dirty \
              --allow-staged \
              -p codex-hepta-memory \
              -p codex-hepta-agentd \
              -p codex-hepta-agent-protocol \
              -p codex-app-server-protocol \
              -- -D warnings || true
          done
          cargo fmt \
            -p codex-hepta-memory \
            -p codex-hepta-agentd \
            -p codex-hepta-agent-protocol \
            -p codex-app-server-protocol

      - name: Verify bounded source mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git diff --name-only)"
          while IFS= read -r path; do
            case "$path" in
              codex-rs/hepta-memory/src/*) ;;
              codex-rs/hepta-agentd/src/app_runtime.rs) ;;
              codex-rs/hepta-agent-protocol/src/lib.rs) ;;
              codex-rs/app-server-protocol/src/protocol/thread_history.rs) ;;
              *)
                echo "unexpected remediation path: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only)

      - name: Run architecture source ratchets
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python .github/scripts/verify_cargo_workspace_manifests.py
          python scripts/verify-hepta-architecture-convergence-p0-2.py
          python scripts/verify-hepta-authority-callers-p0-1.py
          python scripts/verify-hepta-memory-runtime-extraction-p0-1.py
          python scripts/verify-hepta-cross-owner-operation-wiring.py
          python scripts/verify-hepta-architecture-gap-ledger.py
          git diff --check

      - name: Execute integrated blocker qualification
        id: blocker_matrix
        working-directory: codex-rs
        shell: bash
        env:
          DIAGNOSTIC_DIR: ${{ github.workspace }}/.hepta-blocker-diagnostic
        run: |
          set -u -o pipefail
          mkdir -p "$DIAGNOSTIC_DIR"
          full_log="$DIAGNOSTIC_DIR/full.log"
          summary="$DIAGNOSTIC_DIR/summary.txt"
          : > "$full_log"
          : > "$summary"

          write_failure() {
            local gate="$1"
            local status="$2"
            {
              echo "schema=hepta_integrated_blocker_diagnostic_v1"
              echo "bootstrap_head=$GITHUB_SHA"
              echo "expected_parent=$EXPECTED_PARENT"
              echo "failed_gate=$gate"
              echo "exit_code=$status"
              echo "runner_os=$RUNNER_OS"
              echo "production_authority=false"
              echo "effect_authority=false"
              echo "model_invocation_authority=false"
              echo "operator_acceptance=false"
              echo "promotion=false"
              echo "release=false"
              echo "error_markers_begin"
              grep -nE '(^error(\[|:)|FAILED|failures:|panicked at|test result: FAILED|could not compile|database is locked|warning:)' "$full_log" | tail -n 320 || true
              echo "error_markers_end"
              echo "log_tail_begin"
              tail -n 700 "$full_log"
              echo "log_tail_end"
            } > "$summary"
          }

          run_gate() {
            local gate="$1"
            shift
            {
              printf '\n===== gate=%s =====\n' "$gate"
              printf 'command='
              printf ' %q' "$@"
              printf '\n'
            } | tee -a "$full_log"
            set +e
            "$@" 2>&1 | tee -a "$full_log"
            local status=${PIPESTATUS[0]}
            set -e
            if (( status != 0 )); then
              write_failure "$gate" "$status"
              exit "$status"
            fi
          }

          set -e
          run_gate fmt_check cargo fmt \
            -p codex-hepta-memory \
            -p codex-hepta-agentd \
            -p codex-hepta-agent-protocol \
            -p codex-app-server-protocol \
            -- --check
          run_gate focused_check cargo check --locked \
            -p codex-hepta-memory \
            -p codex-hepta-agentd \
            -p codex-hepta-agent-protocol \
            -p codex-app-server-protocol
          run_gate h7_head_scoped_reopen cargo test --locked \
            -p codex-hepta-memory \
            h7_trajectory_store_tests::head_scoped_expired_terminal_gate_survives_store_reopen \
            -- --exact --nocapture
          run_gate h7_bound_reopen cargo test --locked \
            -p codex-hepta-memory \
            h7_trajectory_store_tests::bound_trajectory_is_append_only_causal_and_reopenable \
            -- --exact --nocapture
          run_gate memory_lib cargo test --locked \
            -p codex-hepta-memory --lib -- --nocapture
          run_gate agentd_lib cargo test --locked \
            -p codex-hepta-agentd --lib -- --nocapture
          run_gate agentd_qualification_lib cargo test --locked \
            -p codex-hepta-agentd \
            --features qualification-cognitive-write \
            --lib -- --nocapture
          run_gate agent_protocol_lib cargo test --locked \
            -p codex-hepta-agent-protocol --lib -- --nocapture
          run_gate app_server_protocol_lib cargo test --locked \
            -p codex-app-server-protocol --lib -- --nocapture
          run_gate strict_clippy cargo clippy --locked --all-targets \
            -p codex-hepta-memory \
            -p codex-hepta-agentd \
            -p codex-hepta-agent-protocol \
            -p codex-app-server-protocol \
            -- -D warnings
          {
            echo "schema=hepta_integrated_blocker_diagnostic_v1"
            echo "bootstrap_head=$GITHUB_SHA"
            echo "result=success"
          } > "$summary"

      - name: Upload compact blocker diagnostic
        if: ${{ failure() && steps.blocker_matrix.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hepta-integrated-blocker-diagnostic-${{ github.sha }}
          path: .hepta-blocker-diagnostic/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Commit tested source closure and retire bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            codex-rs/hepta-memory/src \
            codex-rs/hepta-agentd/src/app_runtime.rs \
            codex-rs/hepta-agent-protocol/src/lib.rs \
            codex-rs/app-server-protocol/src/protocol/thread_history.rs
          git rm -- "$WORKFLOW_PATH"
          test "$(git diff --cached --name-only | grep -Fx "$WORKFLOW_PATH")" = "$WORKFLOW_PATH"
          while IFS= read -r path; do
            case "$path" in
              "$WORKFLOW_PATH") ;;
              codex-rs/hepta-memory/src/*) ;;
              codex-rs/hepta-agentd/src/app_runtime.rs) ;;
              codex-rs/hepta-agent-protocol/src/lib.rs) ;;
              codex-rs/app-server-protocol/src/protocol/thread_history.rs) ;;
              *)
                echo "unexpected staged remediation path: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)
          git diff --cached --check
          git fetch --no-tags origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          test "$(git rev-parse refs/remotes/origin/$BRANCH)" = "$GITHUB_SHA"
          git config user.name "hepta-gap-closure"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git commit -m "fix(hepta): close hosted Rust blockers and retire bootstrap"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Record non-authoritative integrated receipt
        if: always()
        shell: bash
        run: |
          {
            echo "schema=hepta_integrated_blocker_closure_bootstrap_v1"
            echo "bootstrap_head=$GITHUB_SHA"
            echo "expected_parent=$EXPECTED_PARENT"
            echo "canonical_workflow_blob=$EXPECTED_CANONICAL_WORKFLOW_BLOB"
            echo "job_status=${{ job.status }}"
            echo "bootstrap_retired=${{ job.status == 'success' }}"
            echo "bootstrap_runner=ubuntu-24.04"
            echo "bootstrap_python=3.12"
            echo "production_authority=false"
            echo "effect_authority=false"
            echo "model_invocation_authority=false"
            echo "provider_dispatch_authority=false"
            echo "fleet_mutation_authority=false"
            echo "operator_acceptance=false"
            echo "promotion=false"
            echo "release=false"
          } >> "$GITHUB_STEP_SUMMARY"
