name: Hepta strict-clippy remediation once

on:
  push:
    branches:
      - codex/hepta-architecture-convergence-p0-2-20260828
    paths:
      - .github/workflows/hepta-strict-clippy-remediation-once.yml

permissions:
  contents: write

concurrency:
  group: hepta-strict-clippy-remediation-once
  cancel-in-progress: true

jobs:
  remediate:
    if: "${{ github.event.head_commit.message == 'ci: harden Hepta strict-clippy cleanup' }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      EXPECTED_PARENT: 41576972e063962db0d6cc6faffe81c1a4b6657c
      BRANCH: codex/hepta-architecture-convergence-p0-2-20260828
      WORKFLOW_PATH: .github/workflows/hepta-strict-clippy-remediation-once.yml
    steps:
      - name: Checkout guarded bootstrap commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify immutable bootstrap boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git branch --show-current)" = ""
          test -z "$(git status --porcelain)"

      - name: Set up CI environment
        uses: ./.github/actions/setup-ci

      - name: Install pinned Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt, clippy

      - name: Apply exact warning cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def remove_struct_fields(
              source: str,
              struct_name: str,
              fields: tuple[str, ...],
          ) -> str:
              marker = f"struct {struct_name} {{\n"
              start = source.find(marker)
              if start < 0:
                  raise SystemExit(f"missing struct: {struct_name}")
              end = source.find("}\n", start)
              if end < 0:
                  raise SystemExit(f"unterminated struct: {struct_name}")
              end += 2
              block = source[start:end]
              seen = {field: 0 for field in fields}
              kept: list[str] = []
              for line in block.splitlines(keepends=True):
                  stripped = line.strip()
                  matched = next(
                      (field for field in fields if stripped.startswith(field + ":")),
                      None,
                  )
                  if matched is None:
                      kept.append(line)
                      continue
                  seen[matched] += 1
              if any(count != 1 for count in seen.values()):
                  raise SystemExit(f"unexpected {struct_name} field counts: {seen}")
              return source[:start] + "".join(kept) + source[end:]

          def remove_initializer_fields(
              source: str,
              marker: str,
              fields: tuple[str, ...],
          ) -> str:
              start = source.find(marker)
              if start < 0:
                  raise SystemExit(f"missing initializer: {marker.strip()}")
              terminator = "\n        });"
              end = source.find(terminator, start)
              if end < 0:
                  raise SystemExit(f"unterminated initializer: {marker.strip()}")
              end += len(terminator)
              block = source[start:end]
              seen = {field: 0 for field in fields}
              kept: list[str] = []
              for line in block.splitlines(keepends=True):
                  stripped = line.strip()
                  matched = next(
                      (field for field in fields if stripped == field + ","),
                      None,
                  )
                  if matched is None:
                      kept.append(line)
                      continue
                  seen[matched] += 1
              if any(count != 1 for count in seen.values()):
                  raise SystemExit(
                      f"unexpected initializer field counts for {marker.strip()}: {seen}"
                  )
              return source[:start] + "".join(kept) + source[end:]

          memory = Path("codex-rs/hepta-memory/src/local_lease_outbox.rs")
          source = memory.read_text()
          source = remove_struct_fields(
              source,
              "EventRow",
              ("sequence", "previous_sha256", "event_sha256"),
          )
          source = remove_struct_fields(
              source,
              "OutboxRow",
              ("sequence", "previous_sha256", "outbox_sha256"),
          )
          source = remove_initializer_fields(
              source,
              "        events.push(EventRow {\n",
              ("sequence", "previous_sha256", "event_sha256"),
          )
          source = remove_initializer_fields(
              source,
              "        outbox_rows.push(OutboxRow {\n",
              ("sequence", "previous_sha256", "outbox_sha256"),
          )
          memory.write_text(source)

          agentd = Path("codex-rs/hepta-agentd/src/app_runtime.rs")
          source = agentd.read_text()
          for signature in (
              "pub(crate) fn app_server_runtime_options(\n",
              "pub(crate) fn app_server_runtime_options_for_agent(\n",
              "fn cognitive_write_for_authority(\n",
          ):
              if source.count(signature) != 1:
                  raise SystemExit(f"unexpected helper signature count: {signature!r}")
              if "#[cfg(test)]\n" + signature in source:
                  raise SystemExit(f"helper already test-only: {signature!r}")
              source = source.replace(signature, "#[cfg(test)]\n" + signature, 1)
          agentd.write_text(source)
          PY

      - name: Verify exact source changed-path boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            codex-rs/hepta-agentd/src/app_runtime.rs \
            codex-rs/hepta-memory/src/local_lease_outbox.rs | LC_ALL=C sort)"
          test "$actual" = "$expected"

      - name: Run source and manifest ratchets
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python .github/scripts/verify_cargo_workspace_manifests.py
          python scripts/verify-hepta-architecture-convergence-p0-2.py
          python scripts/verify-hepta-authority-callers-p0-1.py
          python scripts/verify-hepta-memory-runtime-extraction-p0-1.py
          python scripts/verify-hepta-cross-owner-operation-wiring.py
          python scripts/verify-hepta-architecture-gap-ledger.py

      - name: Run owned-package formatting, checks, and strict Clippy
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt \
            -p codex-hepta-memory \
            -p codex-hepta-agentd \
            -- --check
          cargo check --locked \
            -p codex-hepta-memory \
            -p codex-hepta-agentd
          cargo clippy --locked --all-targets \
            -p codex-hepta-memory \
            -p codex-hepta-agentd \
            -- -D warnings

      - name: Commit source cleanup and retire bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-ci-remediation"
          git config user.email "hepta-ci-remediation@users.noreply.github.com"
          git add -- \
            codex-rs/hepta-agentd/src/app_runtime.rs \
            codex-rs/hepta-memory/src/local_lease_outbox.rs
          git rm -- "$WORKFLOW_PATH"
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            "$WORKFLOW_PATH" \
            codex-rs/hepta-agentd/src/app_runtime.rs \
            codex-rs/hepta-memory/src/local_lease_outbox.rs | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m "ci: close and retire Hepta strict-clippy remediation"
          git fetch --no-tags origin "refs/heads/$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Record non-authoritative receipt
        if: always()
        shell: bash
        run: |
          {
            echo "schema=hepta_strict_clippy_remediation_once_v8"
            echo "bootstrap_head=$GITHUB_SHA"
            echo "expected_parent=$EXPECTED_PARENT"
            echo "job_status=${{ job.status }}"
            echo "changed_paths=hepta-agentd/app_runtime.rs,hepta-memory/local_lease_outbox.rs"
            echo "bootstrap_retired=${{ job.status == 'success' }}"
            echo "bootstrap_runner=ubuntu-22.04"
            echo "bootstrap_python=3.12"
            echo "canonical_qualification_runner=ubuntu-24.04"
            echo "production_authority=false"
            echo "effect_authority=false"
            echo "model_invocation_authority=false"
            echo "operator_acceptance=false"
            echo "promotion=false"
            echo "release=false"
          } >> "$GITHUB_STEP_SUMMARY"
