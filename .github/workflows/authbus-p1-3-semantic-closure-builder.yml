name: AuthBus P1.3 semantic closure builder standard v5

on:
  push:
    branches:
      - ops/authbus-p1-3-semantic-closure-builder-v1-20260830
    paths:
      - .github/workflows/authbus-p1-3-semantic-closure-builder.yml
      - scripts/authbus-p1-3-semantic-closure-builder.py
  workflow_dispatch:

concurrency:
  group: authbus-p1-3-semantic-closure-builder-standard-v5
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  SOURCE_HEAD: 8572f3d2182541b14e0719b229ccd8754494f134
  TARGET_BRANCH: ops/authbus-p1-3-semantic-closure-builder-v1-20260830
  P02: codex-rs/hepta-authbus-qualification/Cargo.toml
  P03: codex-rs/hepta-authbus-p0-3-qualification/Cargo.toml
  P11: codex-rs/hepta-authbus-p1-qualification/Cargo.toml
  P12: codex-rs/hepta-authbus-p1-2-qualification/Cargo.toml
  P13: codex-rs/hepta-authbus-p1-3-qualification/Cargo.toml
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  RUST_BACKTRACE: "1"
  CARGO_TARGET_DIR: /tmp/authbus-p1-3-semantic-closure-standard-v5-target

jobs:
  build_and_qualify:
    name: Apply, qualify, and publish clean semantic closure tree
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact builder seed
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
          persist-credentials: true

      - name: Bind exact seed and allowlist
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${SOURCE_HEAD}" HEAD
          mapfile -t changed < <(git diff --name-only "${SOURCE_HEAD}...HEAD" | sort)
          expected=(
            .github/workflows/authbus-p1-3-semantic-closure-builder.yml
            scripts/authbus-p1-3-semantic-closure-builder.b64.00
            scripts/authbus-p1-3-semantic-closure-builder.b64.01
            scripts/authbus-p1-3-semantic-closure-builder.b64.02
            scripts/authbus-p1-3-semantic-closure-builder.b64.03
            scripts/authbus-p1-3-semantic-closure-builder.b64.04
            scripts/authbus-p1-3-semantic-closure-builder.b64.05
            scripts/authbus-p1-3-semantic-closure-builder.py
          )
          test "${#changed[@]}" = "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done
          python3 -m py_compile scripts/authbus-p1-3-semantic-closure-builder.py

      - name: Apply exact semantic closure
        shell: bash
        run: |
          set -euo pipefail
          AUTHBUS_SKIP_EXACT_GIT_BINDING=1 \
            python3 scripts/authbus-p1-3-semantic-closure-builder.py \
              | tee /tmp/authbus-p1-3-semantic-closure.json
          grep -q '"applied_authbus_p1_3_semantic_closure": true' \
            /tmp/authbus-p1-3-semantic-closure.json
          git diff --check

      - name: Install Rust 1.95 with rustfmt and Clippy
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Format affected Rust sources and verify source contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc -V | awk '{print $2}')" = "1.95.0"
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-contracts
          cargo fmt --manifest-path "${P03}" --all
          cargo fmt --manifest-path "${P13}" --all
          AUTHBUS_SKIP_EXACT_GIT_BINDING=1 python3 scripts/verify-authbus-p0-2.py
          AUTHBUS_SKIP_EXACT_GIT_BINDING=1 python3 scripts/verify-authbus-p0-3.py
          AUTHBUS_SKIP_EXACT_GIT_BINDING=1 python3 scripts/verify-authbus-p1-1.py
          AUTHBUS_SKIP_EXACT_GIT_BINDING=1 python3 scripts/verify-authbus-p1-2.py
          AUTHBUS_SKIP_EXACT_GIT_BINDING=1 python3 scripts/verify-authbus-p1-3.py \
            | tee /tmp/authbus-p1-3-source.json
          grep -q PASS_AUTHBUS_P1_3_SOURCE_ONLY /tmp/authbus-p1-3-source.json
          git diff --check

      - name: Run complete P0.2 through P1.3 executable matrices
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-contracts --features authbus-local-qualification \
            --lib -- --nocapture

          cargo test --manifest-path "${P02}" --locked \
            --no-default-features --lib -- --nocapture
          cargo test --manifest-path "${P02}" --locked \
            --features sqlite-qualification --tests -- --nocapture

          cargo test --manifest-path "${P03}" --locked \
            --no-default-features --lib -- --nocapture
          cargo test --manifest-path "${P03}" --locked \
            --features p0-3-qualification --tests -- --nocapture

          cargo test --manifest-path "${P11}" --locked \
            --no-default-features --lib -- --nocapture
          cargo test --manifest-path "${P11}" --locked \
            --features p1-qualification --tests -- --nocapture

          cargo test --manifest-path "${P12}" --locked \
            --no-default-features --lib -- --nocapture
          cargo test --manifest-path "${P12}" --locked \
            --features p1-2-qualification --tests -- --nocapture

          cargo test --manifest-path "${P13}" --locked \
            --no-default-features --lib -- --nocapture
          cargo test --manifest-path "${P13}" --locked \
            --features p1-3-qualification --tests -- --nocapture

      - name: Run every affected all-target check
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-contracts --features authbus-local-qualification \
            --all-targets
          cargo check --manifest-path "${P02}" --locked \
            --features sqlite-qualification --all-targets
          cargo check --manifest-path "${P03}" --locked \
            --features p0-3-qualification --all-targets
          cargo check --manifest-path "${P11}" --locked \
            --features p1-qualification --all-targets
          cargo check --manifest-path "${P12}" --locked \
            --features p1-2-qualification --all-targets
          cargo check --manifest-path "${P13}" --locked \
            --features p1-3-qualification --all-targets

      - name: Run strict Clippy on every affected all-target surface
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-contracts --features authbus-local-qualification \
            --all-targets -- -D warnings
          cargo clippy --manifest-path "${P02}" --locked \
            --features sqlite-qualification --all-targets -- -D warnings
          cargo clippy --manifest-path "${P03}" --locked \
            --features p0-3-qualification --all-targets -- -D warnings
          cargo clippy --manifest-path "${P11}" --locked \
            --features p1-qualification --all-targets -- -D warnings
          cargo clippy --manifest-path "${P12}" --locked \
            --features p1-2-qualification --all-targets -- -D warnings
          cargo clippy --manifest-path "${P13}" --locked \
            --features p1-3-qualification --all-targets -- -D warnings

      - name: Remove one-shot builder and verify final source allowlist
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/authbus-p1-3-semantic-closure-builder.yml
          rm scripts/authbus-p1-3-semantic-closure-builder.py
          rm scripts/authbus-p1-3-semantic-closure-builder.b64.*
          test ! -e scripts/authbus-p1-3-finalize.py
          test ! -e scripts/authbus-p1-3-semantic-completion.py
          test ! -e .github/workflows/authbus-p1-3-materialize.yml
          mapfile -t changed < <(git diff --name-only "${SOURCE_HEAD}" | sort)
          expected=(
            .github/workflows/authbus-p1-3-qualification.yml
            codex-rs/hepta-authbus-p0-3-qualification/src/scheduler.rs
            codex-rs/hepta-authbus-p0-3-qualification/tests/p0_3.rs
            codex-rs/hepta-authbus-p1-3-qualification/README.md
            codex-rs/hepta-authbus-p1-3-qualification/tests/p1_3.rs
            codex-rs/hepta-contracts/src/authbus_b2.rs
            codex-rs/hepta-contracts/src/lib.rs
            codex-rs/hepta-contracts/src/quota_registry.rs
            docs/hepta-vnext/authbus/AUTHBUS_P1_3_DEVELOPMENT_PLAN_2026-08-29.md
            docs/hepta-vnext/authbus/AUTHBUS_P1_3_IMPLEMENTATION_STATUS_2026-08-29.json
            docs/hepta-vnext/authbus/AUTHBUS_P1_3_IMPLEMENTATION_STATUS_2026-08-29.md
            scripts/verify-authbus-p1-3.py
          )
          test "${#changed[@]}" = "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done
          git diff --check
          git status --short

      - name: Commit clean semantic closure tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-authbus-qualification"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add -A
          git commit -m "fix(authbus): close P1.3 semantic lifecycle blockers"
          test "$(git diff --name-only HEAD^..HEAD | wc -l | tr -d ' ')" = "12"
          git push origin "HEAD:${TARGET_BRANCH}"
