name: AuthBus P1.3 semantic source publisher Windows v5

on:
  push:
    branches:
      - ops/authbus-p1-3-semantic-closure-publisher-windows-v4-20260830
    paths:
      - .github/workflows/authbus-p1-3-semantic-closure-builder.yml
      - scripts/authbus-p1-3-semantic-closure-builder.py
  workflow_dispatch:

concurrency:
  group: authbus-p1-3-semantic-source-publisher-windows-v5
  cancel-in-progress: false

permissions:
  contents: write

env:
  SOURCE_HEAD: 8572f3d2182541b14e0719b229ccd8754494f134
  SEED_BRANCH: ops/authbus-p1-3-semantic-closure-publisher-windows-v4-20260830
  STAGING_BRANCH: staging/authbus-p1-3-semantic-closure-v11-20260830
  P03: codex-rs/hepta-authbus-p0-3-qualification/Cargo.toml
  P13: codex-rs/hepta-authbus-p1-3-qualification/Cargo.toml
  # actions/checkout temporarily replaces HOME on Windows, so a normal
  # --global core.longpaths setting is not reliable. Inject the setting into
  # every Git invocation, including checkout itself.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: "true"

jobs:
  publish_source:
    name: Materialize and publish unqualified semantic source on Windows
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout exact publisher seed with long paths enabled
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
          persist-credentials: true

      - name: Bind exact seed and helper-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${SEED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${SOURCE_HEAD}" HEAD
          mapfile -t changed < <(git diff --name-only "${SOURCE_HEAD}...HEAD" | sort)
          expected=(
            .github/workflows/authbus-p1-3-semantic-closure-builder.yml
            scripts/authbus-p1-3-semantic-closure-builder.b64.00
            scripts/authbus-p1-3-semantic-closure-builder.b64.01
            scripts/authbus-p1-3-semantic-closure-builder.b64.02
            scripts/authbus-p1-3-semantic-closure-builder.b64.03
            scripts/authbus-p1-3-semantic-closure-builder.b64.04
            scripts/authbus-p1-3-semantic-closure-builder.b64.05
            scripts/authbus-p1-3-semantic-closure-builder.py
          )
          test "${#changed[@]}" = "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done
          python -m py_compile scripts/authbus-p1-3-semantic-closure-builder.py

      - name: Materialize exact semantic closure source
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/authbus-p1-3-semantic-closure.json"
          AUTHBUS_SKIP_EXACT_GIT_BINDING=1 \
            python scripts/authbus-p1-3-semantic-closure-builder.py \
              | tee "${output}"
          grep -q '"applied_authbus_p1_3_semantic_closure": true' "${output}"
          git diff --check

      - name: Install Rust 1.95 rustfmt
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Format and source-verify the candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc -V | awk '{print $2}')" = "1.95.0"
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-contracts
          cargo fmt --manifest-path "${P03}" --all
          cargo fmt --manifest-path "${P13}" --all
          AUTHBUS_SKIP_EXACT_GIT_BINDING=1 python scripts/verify-authbus-p0-2.py
          AUTHBUS_SKIP_EXACT_GIT_BINDING=1 python scripts/verify-authbus-p0-3.py
          AUTHBUS_SKIP_EXACT_GIT_BINDING=1 python scripts/verify-authbus-p1-1.py
          AUTHBUS_SKIP_EXACT_GIT_BINDING=1 python scripts/verify-authbus-p1-2.py
          output="${RUNNER_TEMP}/authbus-p1-3-source.json"
          AUTHBUS_SKIP_EXACT_GIT_BINDING=1 python scripts/verify-authbus-p1-3.py \
            | tee "${output}"
          grep -q PASS_AUTHBUS_P1_3_SOURCE_ONLY "${output}"
          git diff --check

      - name: Remove one-shot publisher and enforce the final allowlist
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/authbus-p1-3-semantic-closure-builder.yml
          rm scripts/authbus-p1-3-semantic-closure-builder.py
          rm scripts/authbus-p1-3-semantic-closure-builder.b64.*
          test ! -e scripts/authbus-p1-3-finalize.py
          test ! -e scripts/authbus-p1-3-semantic-completion.py
          test ! -e .github/workflows/authbus-p1-3-materialize.yml
          mapfile -t changed < <(git diff --name-only "${SOURCE_HEAD}" | sort)
          expected=(
            .github/workflows/authbus-p1-3-qualification.yml
            codex-rs/hepta-authbus-p0-3-qualification/src/scheduler.rs
            codex-rs/hepta-authbus-p0-3-qualification/tests/p0_3.rs
            codex-rs/hepta-authbus-p1-3-qualification/README.md
            codex-rs/hepta-authbus-p1-3-qualification/tests/p1_3.rs
            codex-rs/hepta-contracts/src/authbus_b2.rs
            codex-rs/hepta-contracts/src/lib.rs
            codex-rs/hepta-contracts/src/quota_registry.rs
            docs/hepta-vnext/authbus/AUTHBUS_P1_3_DEVELOPMENT_PLAN_2026-08-29.md
            docs/hepta-vnext/authbus/AUTHBUS_P1_3_IMPLEMENTATION_STATUS_2026-08-29.json
            docs/hepta-vnext/authbus/AUTHBUS_P1_3_IMPLEMENTATION_STATUS_2026-08-29.md
            scripts/verify-authbus-p1-3.py
          )
          test "${#changed[@]}" = "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done
          git diff --check

      - name: Commit and publish the unqualified source candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-authbus-source-publisher"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add -A
          git commit -m "fix(authbus): close P1.3 semantic lifecycle blockers"
          test "$(git diff --name-only HEAD^..HEAD | wc -l | tr -d ' ')" = "12"
          git push origin "HEAD:${STAGING_BRANCH}"
