name: Temporary final blocker convergence

on:
  push:
    branches:
      - codex/tmp-generate-cargo-lock-20260902
  workflow_dispatch:

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out convergence carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository-pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3

      - name: Install exact repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0

      - name: Check out exact pull-request source
        shell: bash
        env:
          SOURCE_SHA: 5a8d22b2d38a8777756212554984b0aec6ebde42
          TARGET_BRANCH: codex/hepta-v8-final-gap-closure-20260902
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_SHA^{commit}"
          test "$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")" = "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Prepare exact Bazel toolchain
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: final-blocker-convergence

      - name: Apply deterministic source patch and regenerate Bazel lock
        shell: bash
        run: |
          set -euo pipefail
          cat <<'PATCH_B64' | base64 --decode | git apply --check
             