name: Temporary exact Cargo lock generation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out lock carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install exact repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0

      - name: Regenerate exact Cargo lock from source commit
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="caab9c103a8873827caeb31878fcdbaabc0ed577"
          git cat-file -e "$SOURCE_SHA^{tree}"
          git checkout --detach "$SOURCE_SHA"
          cp codex-rs/Cargo.lock "${RUNNER_TEMP}/Cargo.lock.before"
          cargo metadata --manifest-path codex-rs/Cargo.toml --format-version 1 > "${RUNNER_TEMP}/cargo-metadata.json"
          cp codex-rs/Cargo.lock Cargo.lock.generated
          diff -u "${RUNNER_TEMP}/Cargo.lock.before" Cargo.lock.generated > Cargo.lock.diff || true
          sha256sum Cargo.lock.generated > Cargo.lock.sha256
          git status --porcelain=v1 > Cargo.lock.status
          test -s Cargo.lock.generated

      - name: Publish clean ordinary lock output commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "caab9c103a8873827caeb31878fcdbaabc0ed577"
          cp Cargo.lock.generated codex-rs/Cargo.lock
          git config user.name "Hepta lock carrier"
          git config user.email "hepta-lock-carrier@users.noreply.github.com"
          git add -- codex-rs/Cargo.lock
          git diff --cached --quiet && { echo "Cargo lock did not change" >&2; exit 1; }
          git commit -m "chore(rust): regenerate workspace lock with Rust 1.95"
          git push origin HEAD:refs/heads/codex/tmp-generated-cargo-lock-output-20260902 --force
          printf 'commit=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > Cargo.lock.output.identity

      - name: Retain generated lock and diagnostics
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: exact-cargo-lock-caab9c1
          path: |
            Cargo.lock.generated
            Cargo.lock.diff
            Cargo.lock.sha256
            Cargo.lock.status
            Cargo.lock.output.identity
          if-no-files-found: error
          retention-days: 1
