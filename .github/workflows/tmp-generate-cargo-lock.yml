name: Temporary exact Cargo lock generation

on:
  push:
    branches:
      - codex/tmp-generate-cargo-lock-20260902

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out lock carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install exact repository Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0

      - name: Regenerate exact Cargo lock from source parent
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD^)"
          test "$SOURCE_SHA" = "caab9c103a8873827caeb31878fcdbaabc0ed577"
          git checkout --detach "$SOURCE_SHA"
          cp codex-rs/Cargo.lock "${RUNNER_TEMP}/Cargo.lock.before"
          cargo metadata --manifest-path codex-rs/Cargo.toml --format-version 1 > "${RUNNER_TEMP}/cargo-metadata.json"
          cp codex-rs/Cargo.lock Cargo.lock.generated
          diff -u "${RUNNER_TEMP}/Cargo.lock.before" Cargo.lock.generated > Cargo.lock.diff || true
          sha256sum Cargo.lock.generated > Cargo.lock.sha256
          git status --porcelain=v1 > Cargo.lock.status
          test -s Cargo.lock.generated

      - name: Retain generated lock and diagnostics
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: exact-cargo-lock-caab9c1
          path: |
            Cargo.lock.generated
            Cargo.lock.diff
            Cargo.lock.sha256
            Cargo.lock.status
          if-no-files-found: error
          retention-days: 1
