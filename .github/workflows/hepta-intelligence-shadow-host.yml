name: hepta-intelligence-shadow-host

on:
  push:
    branches:
      - "codex/hepta-intelligence-shadow-host-adapter-v4c-*"
  pull_request:
    paths:
      - "codex-rs/hepta-memory/src/intelligence_mutation_shadow_host.rs"
      - "codex-rs/hepta-memory/src/framing.rs"
      - "codex-rs/hepta-agentd/src/shadow_intelligence_mutation_host.rs"
      - "codex-rs/hepta-agentd/src/lib.rs"
      - "codex-rs/hepta-agentd/Cargo.toml"
      - "scripts/hepta-intelligence-status-compat.py"
      - "scripts/verify-hepta-intelligence-shadow-host.py"
      - "plans/hepta-intelligence/status-snapshots/HEPTA_INTELLIGENCE_P0_4C_STATUS_SNAPSHOT_V1.json"
      - "plans/hepta-intelligence/HEPTA_INTELLIGENCE_P0_4C_SHADOW_HOST_2026-08-28.md"
      - "plans/hepta-intelligence/HEPTA_INTELLIGENCE_EXECUTION_STATUS_V2.json"
      - ".github/workflows/hepta-intelligence-shadow-host.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: hepta-intelligence-shadow-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: P0.4c shadow host source contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout explicit candidate identity
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove checked-out commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate Python and immutable tranche status
        run: |
          python3 -m py_compile \
            scripts/hepta-intelligence-status-compat.py \
            scripts/verify-hepta-intelligence-shadow-host.py
          python3 scripts/hepta-intelligence-status-compat.py P0.4c
          python3 -m json.tool \
            plans/hepta-intelligence/HEPTA_INTELLIGENCE_EXECUTION_STATUS_V2.json \
            >/dev/null

      - name: Run fail-closed P0.4c source gate
        run: |
          set -o pipefail
          mkdir -p artifacts/hepta-intelligence-shadow-host
          python3 scripts/verify-hepta-intelligence-shadow-host.py \
            | tee artifacts/hepta-intelligence-shadow-host/source-gate.json

      - name: Verify authority-negative receipt
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path("artifacts/hepta-intelligence-shadow-host/source-gate.json")
              .read_text(encoding="utf-8")
          )
          assert receipt["status"] == "PASS_P0_4C_SHADOW_HOST_SOURCE_ONLY"
          for key in (
              "runtime_wired",
              "default_open_wired",
              "app_runtime_attached",
              "tool_registered",
              "memory_write_authority",
              "projection_write_authority",
              "outbox_dispatch_authority",
              "external_effects",
              "production_authority",
              "operator_acceptance",
              "promotion",
              "callers_ratchet",
              "rust_compile_validation",
              "rust_test_validation",
          ):
              assert receipt[key] is False, key
          PY

      - name: Upload source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-intelligence-shadow-host-source-${{ env.EXPECTED_SHA }}
          path: artifacts/hepta-intelligence-shadow-host/source-gate.json
          if-no-files-found: error
          retention-days: 14

  rust-qualification:
    name: P0.4c shadow host Rust qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout explicit candidate identity
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove checked-out commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt,clippy

      - name: Verify repository toolchain binding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          toolchain = Path("codex-rs/rust-toolchain.toml").read_text(encoding="utf-8")
          match = re.search(r'channel\s*=\s*"([^"]+)"', toolchain)
          assert match and match.group(1) == "1.95.0"
          version = subprocess.check_output(["rustc", "--version"], text=True).strip()
          assert version.startswith("rustc 1.95.0 "), version
          PY

      - name: Check owned-package formatting
        working-directory: codex-rs
        run: >-
          cargo fmt
          -p codex-hepta-memory
          -p codex-hepta-agentd
          -- --check

      - name: Run memory shadow-host focused tests
        working-directory: codex-rs
        env:
          CARGO_TERM_COLOR: always
        run: cargo test -p codex-hepta-memory shadow_intelligence_mutation_host -- --nocapture

      - name: Run Agentd feature-gated host tests
        working-directory: codex-rs
        env:
          CARGO_TERM_COLOR: always
        run: >-
          cargo test -p codex-hepta-agentd
          --features qualification-intelligence-mutation-shadow
          shadow_intelligence_mutation_host -- --nocapture

      - name: Run full hepta-memory tests
        working-directory: codex-rs
        env:
          CARGO_TERM_COLOR: always
        run: cargo test -p codex-hepta-memory

      - name: Run Agentd tests with shadow-host feature
        working-directory: codex-rs
        env:
          CARGO_TERM_COLOR: always
        run: >-
          cargo test -p codex-hepta-agentd
          --features qualification-intelligence-mutation-shadow

      - name: Run strict memory clippy
        working-directory: codex-rs
        env:
          CARGO_TERM_COLOR: always
        run: cargo clippy -p codex-hepta-memory --all-targets -- -D warnings

      - name: Run strict Agentd clippy with shadow-host feature
        working-directory: codex-rs
        env:
          CARGO_TERM_COLOR: always
        run: >-
          cargo clippy -p codex-hepta-agentd
          --features qualification-intelligence-mutation-shadow
          --all-targets -- -D warnings
