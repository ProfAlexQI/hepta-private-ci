name: Hepta PR53 queue cleanup v2

on:
  push:
    branches:
      - codex/hepta-pr53-queue-cleanup-v2-20260829

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Cancel only superseded PR53 branch runs
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TARGET_BRANCH: codex/hepta-architecture-convergence-p0-2-20260828
      CURRENT_TARGET_SHA: abb435c263c2967c6ba613c5b8554b4cb45e6153
    steps:
      - name: Cancel active runs on older target identities only
        shell: python
        run: |
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          current_sha = os.environ["CURRENT_TARGET_SHA"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "hepta-pr53-queue-cleanup-v2",
          }
          active = {"queued", "in_progress", "waiting", "pending", "requested"}
          cancelled = []
          preserved = []
          for page in range(1, 31):
              query = urllib.parse.urlencode({
                  "branch": branch,
                  "per_page": 100,
                  "page": page,
              })
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/actions/runs?{query}",
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  runs = json.load(response).get("workflow_runs", [])
              if not runs:
                  break
              for run in runs:
                  run_id = int(run["id"])
                  status = run.get("status")
                  head_sha = run.get("head_sha")
                  if status not in active or head_sha == current_sha:
                      preserved.append((run_id, head_sha, status))
                      continue
                  cancel = urllib.request.Request(
                      f"https://api.github.com/repos/{repository}/actions/runs/{run_id}/cancel",
                      data=b"",
                      headers=headers,
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(cancel, timeout=30) as response:
                          if response.status != 202:
                              raise RuntimeError(f"unexpected cancel status {response.status}")
                      cancelled.append(run_id)
                  except urllib.error.HTTPError as error:
                      if error.code not in {409, 422}:
                          raise
              if len(runs) < 100:
                  break
          print(f"target_branch={branch}")
          print(f"preserved_current_sha={current_sha}")
          print(f"cancelled_superseded={len(cancelled)}")
          print(f"preserved_current_or_terminal={len(preserved)}")
          print("source_mutation=false")
          print("production_authority=false")
