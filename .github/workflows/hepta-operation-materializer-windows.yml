name: Hepta operation materializer Windows

on:
  push:
    branches:
      - codex/hepta-operation-materializer-windows-20260829

permissions:
  contents: write

env:
  TARGET_BRANCH: codex/hepta-architecture-convergence-p0-2-20260828
  TARGET_HEAD: 3750554cff8f01e10c27ec74a3ac812d4747395a

jobs:
  materialize:
    name: Materialize exact target by CAS on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 2
          persist-credentials: true

      - name: Prove exact target and remote CAS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:TARGET_HEAD) { throw 'wrong target head' }
          git fetch --no-tags origin "refs/heads/$env:TARGET_BRANCH`:refs/remotes/origin/$env:TARGET_BRANCH"
          if ((git rev-parse "refs/remotes/origin/$env:TARGET_BRANCH").Trim() -ne $env:TARGET_HEAD) { throw 'remote target drifted' }
          if (git status --porcelain) { throw 'dirty target checkout' }

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt

      - name: Apply deterministic closure and exact formatting
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/hepta-operation-safety-repair.py
          Push-Location codex-rs
          $files = @(
            'hepta-automation/src/model.rs',
            'hepta-automation/src/store.rs',
            'hepta-agentd/src/automation.rs',
            'hepta-matrix-store/src/operation.rs',
            'hepta-matrix-store/src/store.rs',
            'hepta-matrix-store/tests/sqlite_full.rs',
            'hepta-contracts/src/provider_operation.rs',
            'hepta-contracts/tests/cross_owner_fault_matrix.rs',
            'hepta-memory-runtime/src/production_writer.rs'
          )
          rustfmt --edition 2024 --config skip_children=true @files
          rustfmt --edition 2024 --check --config skip_children=true @files
          Pop-Location
          git diff --check

      - name: Retire mutators and execute source ratchets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Force -ErrorAction SilentlyContinue scripts/hepta-automation-operation-repair-once.py
          git rm --ignore-unmatch -- `
            .github/workflows/hepta-automation-operation-repair-once.yml `
            .github/workflows/hepta-operation-materialize-once.yml `
            .github/workflows/hepta-operation-safety-repair-slim-once.yml `
            .github/workflows/hepta-pr53-superseded-run-cleanup.yml `
            scripts/.hepta-automation-repair-trigger `
            scripts/hepta-operation-safety-repair.py `
            scripts/hepta-automation-operation-repair-once.py.part-00 `
            scripts/hepta-automation-operation-repair-once.py.part-01 `
            scripts/hepta-automation-operation-repair-once.py.part-02 `
            scripts/hepta-automation-operation-repair-once.py.part-03 `
            scripts/hepta-automation-model-v4.rs
          python scripts/verify-hepta-architecture-convergence-p0-2.py
          python scripts/verify-hepta-cross-owner-operation-wiring.py
          python scripts/verify-hepta-memory-runtime-extraction-p0-1.py
          python scripts/verify-hepta-architecture-gap-ledger.py
          git diff --check

      - name: Enforce exact commit surface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import subprocess
          allowed = {
              ".github/workflows/hepta-automation-operation-repair-once.yml",
              ".github/workflows/hepta-operation-materialize-once.yml",
              ".github/workflows/hepta-operation-safety-repair-slim-once.yml",
              ".github/workflows/hepta-pr53-superseded-run-cleanup.yml",
              "scripts/.hepta-automation-repair-trigger",
              "scripts/hepta-operation-safety-repair.py",
              "scripts/hepta-automation-operation-repair-once.py.part-00",
              "scripts/hepta-automation-operation-repair-once.py.part-01",
              "scripts/hepta-automation-operation-repair-once.py.part-02",
              "scripts/hepta-automation-operation-repair-once.py.part-03",
              "scripts/hepta-automation-model-v4.rs",
              "scripts/verify-hepta-cross-owner-operation-wiring.py",
              "codex-rs/hepta-automation/src/model.rs",
              "codex-rs/hepta-automation/src/store.rs",
              "codex-rs/hepta-automation/migrations/0004_operation_identity.sql",
              "codex-rs/hepta-agentd/src/automation.rs",
              "codex-rs/hepta-matrix-store/src/operation.rs",
              "codex-rs/hepta-matrix-store/src/store.rs",
              "codex-rs/hepta-matrix-store/tests/sqlite_full.rs",
              "codex-rs/hepta-contracts/src/provider_operation.rs",
              "codex-rs/hepta-contracts/tests/cross_owner_fault_matrix.rs",
              "codex-rs/hepta-memory-runtime/src/production_writer.rs",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "HEAD"], text=True).splitlines())
          changed |= set(subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"], text=True).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"materializer escaped allowlist: {unexpected}")
          required = {
              "scripts/verify-hepta-cross-owner-operation-wiring.py",
              "codex-rs/hepta-automation/src/model.rs",
              "codex-rs/hepta-automation/src/store.rs",
              "codex-rs/hepta-automation/migrations/0004_operation_identity.sql",
              "codex-rs/hepta-agentd/src/automation.rs",
              "codex-rs/hepta-matrix-store/src/operation.rs",
              "codex-rs/hepta-matrix-store/src/store.rs",
              "codex-rs/hepta-contracts/src/provider_operation.rs",
          }
          missing = sorted(required - changed)
          if missing:
              raise SystemExit(f"materializer did not produce: {missing}")
          '@ | python -

      - name: Commit and non-force fast-forward target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git add -A
          git diff --cached --check
          git fetch --no-tags origin "refs/heads/$env:TARGET_BRANCH`:refs/remotes/origin/$env:TARGET_BRANCH"
          if ((git rev-parse "refs/remotes/origin/$env:TARGET_BRANCH").Trim() -ne $env:TARGET_HEAD) { throw 'remote target drifted before writeback' }
          git config user.name 'Hepta operation materializer'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git commit -m 'fix(hepta): materialize operation safety closure [hepta-operation-materialized]'
          git push origin "HEAD`:refs/heads/$env:TARGET_BRANCH"
