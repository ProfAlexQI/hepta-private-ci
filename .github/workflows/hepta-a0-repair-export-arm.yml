name: Hepta A0 repair input export ARM64

on:
  push:
    branches:
      - "automation/hepta-a0-repair-export-arm-20260831"

permissions:
  contents: read

concurrency:
  group: hepta-a0-repair-export-arm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Check out exact temporary export head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify source ancestry and export scope
        shell: bash
        env:
          EXPECTED_PARENT: 73a636867dbebc2dd4bdf957c9c6ff3eb0ea9358
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/hepta-a0-repair-export-arm.yml"

      - name: Build content-addressed repair input
        shell: bash
        run: |
          set -euo pipefail
          rm -rf repair-input
          mkdir -p repair-input/.github/workflows repair-input/plans repair-input/scripts
          cp -a plans/hepta-intelligence repair-input/plans/
          cp .github/workflows/hepta-intelligence-*.yml repair-input/.github/workflows/
          cp scripts/hepta-intelligence-current-truth.py repair-input/scripts/
          cp scripts/verify-hepta-intelligence-*.py repair-input/scripts/
          git rev-parse HEAD^ > repair-input/EXACT-A0-HEAD
          git rev-parse HEAD^^ > repair-input/EXACT-Q0-HEAD
          git rev-parse HEAD^^\{tree\} > repair-input/EXACT-Q0-TREE
          git ls-tree -r HEAD^ -- \
            .github/workflows/hepta-intelligence-a0-authority.yml \
            .github/workflows/hepta-intelligence-execution-spec.yml \
            .github/workflows/hepta-intelligence-master-plan.yml \
            plans/hepta-intelligence \
            scripts/hepta-intelligence-current-truth.py \
            scripts/verify-hepta-intelligence-a0-authority.py \
            scripts/verify-hepta-intelligence-document-authority.py \
            scripts/verify-hepta-intelligence-master-plan.py \
            > repair-input/GIT-TREE-MANIFEST.txt
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf hepta-a0-repair-input.tar.gz -C repair-input .
          sha256sum hepta-a0-repair-input.tar.gz > SHA256SUMS

      - name: Upload immutable repair input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-a0-repair-input-arm-${{ github.sha }}
          path: |
            hepta-a0-repair-input.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
