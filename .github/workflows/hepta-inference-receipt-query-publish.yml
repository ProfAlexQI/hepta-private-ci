name: Hepta inference receipt-query product shadow publisher

on:
  push:
    branches:
      - codex/hepta-inference-gap-closure-scratch-check-20260829
    paths:
      - ".github/workflows/hepta-inference-receipt-query-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-inference-receipt-query-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Qualify and publish fenced receipt-query lifecycle
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      TARGET_BRANCH: codex/hepta-inference-gap-closure-20260829
      EXPECTED_PARENT: c5dd83f1e4a17a7934443912180d6150470a8625
      PATCH_SHA256: e242594350028454a2d43c76df7c63b822523d8a9888712be815fd30256d7641
      PATCH_GZIP_BASE64: 
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          ref: ${{ env.EXPECTED_PARENT }}
          fetch-depth: 0

      - name: Verify exact immutable parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_PARENT"

      - name: Materialize exact bounded patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZIP_BASE64" | base64 --decode | gzip -d > "$RUNNER_TEMP/receipt-query.patch"
          test "$(sha256sum "$RUNNER_TEMP/receipt-query.patch" | awk '{print $1}')" = "$PATCH_SHA256"
          git apply --check "$RUNNER_TEMP/receipt-query.patch"
          git apply "$RUNNER_TEMP/receipt-query.patch"
          git diff --check

      - name: Enforce exact source allowlist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import subprocess
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          expected = {
              "codex-rs/hepta-infer-client/src/lib.rs",
              "codex-rs/hepta-infer-client/src/tests.rs",
              "codex-rs/hepta-infer-core/src/adapter.rs",
              "codex-rs/hepta-infer-core/src/controller.rs",
              "codex-rs/hepta-infer-core/src/lib.rs",
              "codex-rs/hepta-infer-core/src/protocol.rs",
              "codex-rs/hepta-infer-core/src/tests.rs",
              "codex-rs/hepta-inferd/src/lib.rs",
              "codex-rs/hepta-inferd/src/shadow.rs",
              "codex-rs/hepta-inferd/src/tests.rs",
          }
          if changed != expected:
              raise SystemExit(f"source allowlist mismatch: {sorted(changed)}")
          PY2
          grep -F 'GetReceipt' codex-rs/hepta-infer-core/src/protocol.rs >/dev/null
          grep -F 'terminal_receipt_fenced' codex-rs/hepta-infer-core/src/controller.rs >/dev/null
          grep -F 'await_terminal_receipt' codex-rs/hepta-infer-client/src/lib.rs >/dev/null
          grep -F 'creates_terminal_receipt' codex-rs/hepta-inferd/src/lib.rs >/dev/null

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Format exact inference packages
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd
          cargo fmt \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd -- --check

      - name: Verify source and authority contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/hepta-inference-inf0-source-gate.py \
            scripts/hepta-inference-inf0c-cancel-reclassifier.py
          python3 scripts/hepta-inference-inf0-source-gate.py

      - name: Locked check
        shell: bash
        working-directory: codex-rs
        run: |
          cargo check --locked --all-targets \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd

      - name: All-target tests
        shell: bash
        working-directory: codex-rs
        run: |
          cargo test --locked --all-targets \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd

      - name: Strict Clippy
        shell: bash
        working-directory: codex-rs
        run: |
          cargo clippy --locked --all-targets --no-deps \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd -- -D warnings

      - name: Create bounded source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            codex-rs/hepta-infer-client/src/lib.rs \
            codex-rs/hepta-infer-client/src/tests.rs \
            codex-rs/hepta-infer-core/src/adapter.rs \
            codex-rs/hepta-infer-core/src/controller.rs \
            codex-rs/hepta-infer-core/src/lib.rs \
            codex-rs/hepta-infer-core/src/protocol.rs \
            codex-rs/hepta-infer-core/src/tests.rs \
            codex-rs/hepta-inferd/src/lib.rs \
            codex-rs/hepta-inferd/src/shadow.rs \
            codex-rs/hepta-inferd/src/tests.rs
          test -z "$(git diff --name-only)"
          git commit -m "feat(inference): close fenced receipt-query shadow lifecycle"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CANDIDATE_TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"

      - name: Revalidate and fast-forward target branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_PARENT"
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Record fail-closed publisher result
        if: always()
        shell: bash
        run: |
          {
            echo "### Hepta inference receipt-query shadow publisher"
            echo
            echo "- expected parent: $EXPECTED_PARENT"
            echo "- candidate: ${CANDIDATE_SHA:-not-created}"
            echo "- candidate tree: ${CANDIDATE_TREE:-not-created}"
            echo "- qualification_only: true"
            echo "- product default route changed: false"
            echo "- production authority: false"
            echo "- operator acceptance: false"
            echo "- promotion: false"
            echo "- release: false"
          } >> "$GITHUB_STEP_SUMMARY"
