name: Hepta inference INF-1 materialized source export Linux

on:
  push:
    branches:
      - codex/hepta-inference-inf1-export-linux-20260829
    paths:
      - ".github/workflows/hepta-inference-inf1-materialize-export-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Materialize and export exact INF-1 payload
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify workflow-only overlay and materialize payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "44704e5a494a4e3fea7cd0177c3323a6f795e7df"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/hepta-inference-inf1-materialize-export-linux.yml"
          python3 scripts/hepta-inference-inf1-materialize.py
          python3 -m py_compile scripts/hepta-inference-inf1-bootstrap.py scripts/hepta-inference-inf1-source-gate.py
          test -f codex-rs/hepta-inference-core/Cargo.toml
          test -f codex-rs/hepta-inference-daemon/Cargo.toml

      - name: Build deterministic source bundle
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/hepta-inference-inf1-source"
          mkdir -p "$out/codex-rs" "$out/scripts" "$out/docs/hepta-vnext/inference"
          cp -R codex-rs/hepta-inference-core codex-rs/hepta-inference-daemon "$out/codex-rs/"
          cp scripts/hepta-inference-inf1-bootstrap.py scripts/hepta-inference-inf1-source-gate.py "$out/scripts/"
          cp docs/hepta-vnext/inference/HEPTA_INFERENCE_INF1_SOURCE_CONTRACT_V1.md "$out/docs/hepta-vnext/inference/"
          python3 - "$out" <<'PY'
          import hashlib,json,os,pathlib,sys
          root=pathlib.Path(sys.argv[1]); files=[]
          for path in sorted(root.rglob('*')):
              if path.is_file():
                  payload=path.read_bytes(); files.append({'path':str(path.relative_to(root)),'byte_length':len(payload),'sha256':hashlib.sha256(payload).hexdigest()})
          (root/'manifest.json').write_text(json.dumps({'schema':'hepta.inference.inf1.materialized-source.v2','payload_parent':'44704e5a494a4e3fea7cd0177c3323a6f795e7df','archive_sha256':'8462cdf4fdf05ae042e8e2b3c66ed5b2056512cd26ebf0f06c250afb367ccb67','files':files,'active':False,'qualified':False,'authority':False},indent=2)+'\n')
          PY
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS"

      - name: Upload materialized source
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-inf1-materialized-linux-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-inference-inf1-source
          if-no-files-found: error
          retention-days: 7
