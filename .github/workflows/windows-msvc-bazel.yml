name: Bazel Windows MSVC
run-name: Bazel Windows MSVC @ ${{ github.ref_name }}

on:
  pull_request:
    paths:
      - .github/workflows/windows-msvc-bazel.yml
      - .github/workflows/scripts/export-msvc-env.ps1
      - .github/workflows/scripts/setup-rusty-v8.sh
      - MODULE.bazel
      - MODULE.bazel.lock
      - patches/**
      - third_party/**
      - codex-rs/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/windows-msvc-bazel.yml
      - .github/workflows/scripts/export-msvc-env.ps1
      - .github/workflows/scripts/setup-rusty-v8.sh
      - MODULE.bazel
      - MODULE.bazel.lock
      - patches/**
      - third_party/**
      - codex-rs/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-windows-msvc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-windows-msvc:
    name: Bazel release pair x86_64-pc-windows-msvc
    runs-on: windows-2025
    timeout-minutes: 150

    steps:
      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize Windows execution evidence
        shell: pwsh
        run: |
          $executionLogDirectory = Join-Path $env:RUNNER_TEMP "bazel-execution-logs"
          New-Item -ItemType Directory -Force -Path $executionLogDirectory | Out-Null
          [ordered]@{
              schema = "hepta_windows_bazel_job_start_v1"
              status = "started"
              head_sha = $env:GITHUB_SHA
              run_id = $env:GITHUB_RUN_ID
              rust_version = "1.95.0"
              target = "x86_64-pc-windows-msvc"
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $executionLogDirectory "job-start.json")

      - name: Install Bazelisk
        shell: pwsh
        run: choco install bazelisk --yes --no-progress

      - name: Set up sandboxed rusty_v8
        shell: bash
        run: bash .github/workflows/scripts/setup-rusty-v8.sh x86_64-pc-windows-msvc "$RUNNER_TEMP/rusty-v8/x86_64-pc-windows-msvc" "$GITHUB_ENV"

      - name: Export the x64 MSVC developer environment
        shell: pwsh
        run: .github/workflows/scripts/export-msvc-env.ps1

      - name: Build the native Windows release pair
        shell: pwsh
        timeout-minutes: 120
        run: |
          $executionLogDirectory = Join-Path $env:RUNNER_TEMP "bazel-execution-logs"
          New-Item -ItemType Directory -Force -Path $executionLogDirectory | Out-Null

          $environmentVariables = @(
              "BAZEL_SH",
              "BAZEL_VC",
              "INCLUDE",
              "LIB",
              "LIBPATH",
              "Path",
              "UCRTVersion",
              "UniversalCRTSdkDir",
              "VCINSTALLDIR",
              "VCToolsInstallDir",
              "WindowsLibPath",
              "WindowsSdkBinPath",
              "WindowsSdkDir",
              "WindowsSDKLibVersion",
              "WindowsSDKVersion"
          )
          $environmentArguments = foreach ($name in $environmentVariables) {
              $value = [Environment]::GetEnvironmentVariable($name)
              if ($value) {
                  "--action_env=$name=$value"
                  "--host_action_env=$name=$value"
              }
          }

          $releaseBazelArguments = @(
              "build",
              "--lockfile_mode=error",
              "--config=ci-windows",
              "--platforms=//:windows_x86_64_msvc",
              "--host_platform=//:windows_x86_64_msvc",
              "--extra_execution_platforms=//:windows_x86_64_msvc",
              "--extra_toolchains=//:windows_msvc_tests_on_msvc_host_toolchain",
              "--jobs=8",
              "--build_event_json_file=$executionLogDirectory/release-build-events.json",
              "--execution_log_compact_file=$executionLogDirectory/release-execution-log.zst",
              "--profile=$executionLogDirectory/release-profile.gz",
              "--repo_contents_cache=$env:RUNNER_TEMP/bazel-repo-contents-cache"
          )
          $releaseTargets = @(
              "//codex-rs/hepta-cli:hepta",
              "//codex-rs/code-mode-host:codex-code-mode-host"
          )
          & bazelisk @releaseBazelArguments @environmentArguments "--" @releaseTargets
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          $releaseBin = Join-Path $env:RUNNER_TEMP "code-mode-release/bin"
          New-Item -ItemType Directory -Force -Path $releaseBin | Out-Null
          $cliSource = Join-Path $env:GITHUB_WORKSPACE "bazel-bin/codex-rs/hepta-cli/hepta.exe"
          $hostSource = Join-Path $env:GITHUB_WORKSPACE "bazel-bin/codex-rs/code-mode-host/codex-code-mode-host.exe"
          if (!(Test-Path -LiteralPath $cliSource -PathType Leaf) -or !(Test-Path -LiteralPath $hostSource -PathType Leaf)) {
              throw "Bazel release runtime pair is incomplete"
          }
          Copy-Item -LiteralPath $cliSource -Destination (Join-Path $releaseBin "hepta.exe")
          Copy-Item -LiteralPath $hostSource -Destination (Join-Path $releaseBin "codex-code-mode-host.exe")
          $stagedCli = Join-Path $releaseBin "hepta.exe"
          $stagedHost = Join-Path $releaseBin "codex-code-mode-host.exe"
          [ordered]@{
              schema = "hepta_code_mode_host_windows_packaging_v1"
              status = "ready"
              target = "x86_64-pc-windows-msvc"
              cli = [ordered]@{
                  name = "hepta.exe"
                  sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $stagedCli).Hash.ToLowerInvariant()
              }
              runtime_companion = [ordered]@{
                  id = "code-mode-host"
                  name = "codex-code-mode-host.exe"
                  sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $stagedHost).Hash.ToLowerInvariant()
                  adjacent_to_cli = ((Split-Path -Parent $stagedCli) -eq (Split-Path -Parent $stagedHost))
              }
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $executionLogDirectory "code-mode-host-packaging.json")

      - name: Upload Bazel execution logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bazel-release-execution-logs-windows-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: error

      - name: Check for a clean worktree
        if: always()
        shell: pwsh
        run: git diff --exit-code

  test-windows-msvc:
    name: Bazel test shard ${{ matrix.shard }} x86_64-pc-windows-msvc
    needs: release-windows-msvc
    runs-on: windows-2025
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize Windows shard evidence
        shell: pwsh
        run: |
          $executionLogDirectory = Join-Path $env:RUNNER_TEMP "bazel-execution-logs/shard-${{ matrix.shard }}"
          New-Item -ItemType Directory -Force -Path $executionLogDirectory | Out-Null
          [ordered]@{
              schema = "hepta_windows_bazel_shard_job_start_v1"
              status = "started"
              head_sha = $env:GITHUB_SHA
              run_id = $env:GITHUB_RUN_ID
              rust_version = "1.95.0"
              target = "x86_64-pc-windows-msvc"
              shard_index = ${{ matrix.shard }}
              shard_count = 4
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $executionLogDirectory "job-start.json")

      - name: Install Bazelisk
        shell: pwsh
        run: choco install bazelisk --yes --no-progress

      - name: Set up sandboxed rusty_v8
        shell: bash
        run: bash .github/workflows/scripts/setup-rusty-v8.sh x86_64-pc-windows-msvc "$RUNNER_TEMP/rusty-v8/x86_64-pc-windows-msvc" "$GITHUB_ENV"

      - name: Export the x64 MSVC developer environment
        shell: pwsh
        run: .github/workflows/scripts/export-msvc-env.ps1

      - name: Run the native Windows Bazel test shard
        shell: pwsh
        timeout-minutes: 150
        run: |
          $executionLogDirectory = Join-Path $env:RUNNER_TEMP "bazel-execution-logs/shard-${{ matrix.shard }}"
          New-Item -ItemType Directory -Force -Path $executionLogDirectory | Out-Null

          $environmentVariables = @(
              "BAZEL_SH",
              "BAZEL_VC",
              "INCLUDE",
              "LIB",
              "LIBPATH",
              "Path",
              "UCRTVersion",
              "UniversalCRTSdkDir",
              "VCINSTALLDIR",
              "VCToolsInstallDir",
              "WindowsLibPath",
              "WindowsSdkBinPath",
              "WindowsSdkDir",
              "WindowsSDKLibVersion",
              "WindowsSDKVersion"
          )
          $environmentArguments = foreach ($name in $environmentVariables) {
              $value = [Environment]::GetEnvironmentVariable($name)
              if ($value) {
                  "--action_env=$name=$value"
                  "--host_action_env=$name=$value"
              }
          }

          $queryExpression = 'kind(".*_test rule", //...) except attr("tags", "manual", //...) except //codex-rs/v8-poc:v8-poc-unit-tests'
          [string[]]$allTargets = @(& bazelisk query --lockfile_mode=error --output=label $queryExpression)
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
          $allTargets = @($allTargets | Where-Object { $_ } | Sort-Object -Unique)
          [Array]::Sort($allTargets, [StringComparer]::Ordinal)
          if ($allTargets.Count -eq 0) {
              throw "Windows Bazel test inventory is empty"
          }

          $utf8 = [Text.UTF8Encoding]::new($false)
          $inventoryPath = Join-Path $executionLogDirectory "test-target-inventory.txt"
          $inventoryText = ($allTargets -join "`n") + "`n"
          [IO.File]::WriteAllText($inventoryPath, $inventoryText, $utf8)
          $inventorySha = (Get-FileHash -Algorithm SHA256 -LiteralPath $inventoryPath).Hash.ToLowerInvariant()

          $shardIndex = ${{ matrix.shard }}
          $shardCount = 4
          [string[]]$shardTargets = @(
              for ($index = 0; $index -lt $allTargets.Count; $index++) {
                  if (($index % $shardCount) -eq $shardIndex) {
                      $allTargets[$index]
                  }
              }
          )
          if ($shardTargets.Count -eq 0) {
              throw "Windows Bazel test shard is empty"
          }

          $shardTargetsPath = Join-Path $executionLogDirectory "shard-targets.txt"
          $shardTargetsText = ($shardTargets -join "`n") + "`n"
          [IO.File]::WriteAllText($shardTargetsPath, $shardTargetsText, $utf8)
          $shardTargetsSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $shardTargetsPath).Hash.ToLowerInvariant()
          [ordered]@{
              schema = "hepta_windows_bazel_test_shard_v1"
              status = "ready"
              head_sha = $env:GITHUB_SHA
              target = "x86_64-pc-windows-msvc"
              partition = "ordinal_modulo"
              shard_index = $shardIndex
              shard_count = $shardCount
              inventory_count = $allTargets.Count
              inventory_sha256 = $inventorySha
              selected_count = $shardTargets.Count
              selected_sha256 = $shardTargetsSha
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $executionLogDirectory "shard-plan.json")

          $bazelArguments = @(
              "test",
              "--lockfile_mode=error",
              "--config=ci-windows",
              "--platforms=//:windows_x86_64_msvc",
              "--host_platform=//:windows_x86_64_msvc",
              "--extra_execution_platforms=//:windows_x86_64_msvc",
              "--extra_toolchains=//:windows_msvc_tests_on_msvc_host_toolchain",
              "--jobs=8",
              "--test_tag_filters=-argument-comment-lint",
              "--skip_incompatible_explicit_targets",
              "--test_verbose_timeout_warnings",
              "--build_event_json_file=$executionLogDirectory/build-events.json",
              "--execution_log_compact_file=$executionLogDirectory/execution-log.zst",
              "--profile=$executionLogDirectory/profile.gz",
              "--repo_contents_cache=$env:RUNNER_TEMP/bazel-repo-contents-cache"
          )

          & bazelisk @bazelArguments @environmentArguments "--" @shardTargets
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
          $buildEventsPath = Join-Path $executionLogDirectory "build-events.json"
          if (!(Test-Path -LiteralPath $buildEventsPath -PathType Leaf)) {
              throw "Windows Bazel shard completed without build-event evidence"
          }
          [ordered]@{
              schema = "hepta_windows_bazel_test_shard_success_v1"
              status = "passed"
              head_sha = $env:GITHUB_SHA
              target = "x86_64-pc-windows-msvc"
              partition = "ordinal_modulo"
              shard_index = $shardIndex
              shard_count = $shardCount
              inventory_count = $allTargets.Count
              inventory_sha256 = $inventorySha
              selected_count = $shardTargets.Count
              selected_sha256 = $shardTargetsSha
              build_events_sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $buildEventsPath).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $executionLogDirectory "shard-success.json")

      - name: Upload Bazel shard execution logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bazel-test-execution-logs-windows-x86_64-pc-windows-msvc-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/bazel-execution-logs/shard-${{ matrix.shard }}
          if-no-files-found: error

      - name: Check for a clean worktree
        if: always()
        shell: pwsh
        run: git diff --exit-code
