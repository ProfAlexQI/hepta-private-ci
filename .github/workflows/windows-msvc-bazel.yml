name: Bazel Windows MSVC
run-name: Bazel Windows MSVC @ ${{ github.ref_name }}

on:
  pull_request:
    paths:
      - .github/workflows/windows-msvc-bazel.yml
      - .github/workflows/scripts/export-msvc-env.ps1
      - .github/workflows/scripts/setup-rusty-v8.sh
      - MODULE.bazel
      - MODULE.bazel.lock
      - patches/**
      - third_party/**
      - codex-rs/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/windows-msvc-bazel.yml
      - .github/workflows/scripts/export-msvc-env.ps1
      - .github/workflows/scripts/setup-rusty-v8.sh
      - MODULE.bazel
      - MODULE.bazel.lock
      - patches/**
      - third_party/**
      - codex-rs/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-windows-msvc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows-msvc:
    name: Bazel test x86_64-pc-windows-msvc
    runs-on: windows-2025
    timeout-minutes: 180

    steps:
      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize Windows execution evidence
        shell: pwsh
        run: |
          $executionLogDirectory = Join-Path $env:RUNNER_TEMP "bazel-execution-logs"
          New-Item -ItemType Directory -Force -Path $executionLogDirectory | Out-Null
          [ordered]@{
              schema = "hepta_windows_bazel_job_start_v1"
              status = "started"
              head_sha = $env:GITHUB_SHA
              run_id = $env:GITHUB_RUN_ID
              rust_version = "1.95.0"
              target = "x86_64-pc-windows-msvc"
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $executionLogDirectory "job-start.json")

      - name: Install Bazelisk
        shell: pwsh
        run: choco install bazelisk --yes --no-progress

      - name: Set up sandboxed rusty_v8
        shell: bash
        run: bash .github/workflows/scripts/setup-rusty-v8.sh x86_64-pc-windows-msvc "$RUNNER_TEMP/rusty-v8/x86_64-pc-windows-msvc" "$GITHUB_ENV"

      - name: Export the x64 MSVC developer environment
        shell: pwsh
        run: .github/workflows/scripts/export-msvc-env.ps1

      - name: Run the native Windows Bazel suite
        shell: pwsh
        timeout-minutes: 150
        run: |
          $executionLogDirectory = Join-Path $env:RUNNER_TEMP "bazel-execution-logs"
          New-Item -ItemType Directory -Force -Path $executionLogDirectory | Out-Null

          $environmentVariables = @(
              "BAZEL_SH",
              "BAZEL_VC",
              "INCLUDE",
              "LIB",
              "LIBPATH",
              "Path",
              "UCRTVersion",
              "UniversalCRTSdkDir",
              "VCINSTALLDIR",
              "VCToolsInstallDir",
              "WindowsLibPath",
              "WindowsSdkBinPath",
              "WindowsSdkDir",
              "WindowsSDKLibVersion",
              "WindowsSDKVersion"
          )
          $environmentArguments = foreach ($name in $environmentVariables) {
              $value = [Environment]::GetEnvironmentVariable($name)
              if ($value) {
                  "--action_env=$name=$value"
                  "--host_action_env=$name=$value"
              }
          }

          $releaseBazelArguments = @(
              "build",
              "--config=ci-windows",
              "--platforms=//:windows_x86_64_msvc",
              "--host_platform=//:windows_x86_64_msvc",
              "--extra_execution_platforms=//:windows_x86_64_msvc",
              "--extra_toolchains=//:windows_msvc_tests_on_msvc_host_toolchain",
              "--jobs=8",
              "--build_event_json_file=$executionLogDirectory/release-build-events.json",
              "--execution_log_compact_file=$executionLogDirectory/release-execution-log.zst",
              "--profile=$executionLogDirectory/release-profile.gz",
              "--repo_contents_cache=$env:RUNNER_TEMP/bazel-repo-contents-cache"
          )
          $releaseTargets = @(
              "//codex-rs/hepta-cli:hepta",
              "//codex-rs/code-mode-host:codex-code-mode-host"
          )
          & bazelisk @releaseBazelArguments @environmentArguments "--" @releaseTargets
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          $releaseBin = Join-Path $env:RUNNER_TEMP "code-mode-release/bin"
          New-Item -ItemType Directory -Force -Path $releaseBin | Out-Null
          $cliSource = Join-Path $env:GITHUB_WORKSPACE "bazel-bin/codex-rs/hepta-cli/hepta.exe"
          $hostSource = Join-Path $env:GITHUB_WORKSPACE "bazel-bin/codex-rs/code-mode-host/codex-code-mode-host.exe"
          if (!(Test-Path -LiteralPath $cliSource -PathType Leaf) -or !(Test-Path -LiteralPath $hostSource -PathType Leaf)) {
              throw "Bazel release runtime pair is incomplete"
          }
          Copy-Item -LiteralPath $cliSource -Destination (Join-Path $releaseBin "hepta.exe")
          Copy-Item -LiteralPath $hostSource -Destination (Join-Path $releaseBin "codex-code-mode-host.exe")
          $stagedCli = Join-Path $releaseBin "hepta.exe"
          $stagedHost = Join-Path $releaseBin "codex-code-mode-host.exe"
          [ordered]@{
              schema = "hepta_code_mode_host_windows_packaging_v1"
              status = "ready"
              target = "x86_64-pc-windows-msvc"
              cli = [ordered]@{
                  name = "hepta.exe"
                  sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $stagedCli).Hash.ToLowerInvariant()
              }
              runtime_companion = [ordered]@{
                  id = "code-mode-host"
                  name = "codex-code-mode-host.exe"
                  sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $stagedHost).Hash.ToLowerInvariant()
                  adjacent_to_cli = ((Split-Path -Parent $stagedCli) -eq (Split-Path -Parent $stagedHost))
              }
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $executionLogDirectory "code-mode-host-packaging.json")

          $bazelArguments = @(
              "test",
              "--config=ci-windows",
              "--platforms=//:windows_x86_64_msvc",
              "--host_platform=//:windows_x86_64_msvc",
              "--extra_execution_platforms=//:windows_x86_64_msvc",
              "--extra_toolchains=//:windows_msvc_tests_on_msvc_host_toolchain",
              "--jobs=8",
              "--test_tag_filters=-argument-comment-lint",
              "--test_verbose_timeout_warnings",
              "--build_event_json_file=$executionLogDirectory/build-events.json",
              "--execution_log_compact_file=$executionLogDirectory/execution-log.zst",
              "--profile=$executionLogDirectory/profile.gz",
              "--repo_contents_cache=$env:RUNNER_TEMP/bazel-repo-contents-cache"
          )
          $targets = @(
              "//...",
              "-//third_party/v8:all",
              "-//codex-rs/v8-poc:v8-poc-unit-tests"
          )

          & bazelisk @bazelArguments @environmentArguments "--" @targets
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Upload Bazel execution logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bazel-execution-logs-windows-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/bazel-execution-logs
          if-no-files-found: error

      - name: Check for a clean worktree
        if: always()
        shell: pwsh
        run: git diff --exit-code
