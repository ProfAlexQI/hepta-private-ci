name: Hepta architecture convergence P0.2 finalizer

on:
  push:
    branches:
      - codex/hepta-architecture-convergence-p0-2-20260828
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-architecture-convergence-p0-2-write-lane
  cancel-in-progress: true

jobs:
  converge-and-verify:
    name: Converge and execute the product graph
    if: ${{ !contains(github.event.head_commit.message || '', '[hepta-p0-2-finalize]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout latest convergence branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/hepta-architecture-convergence-p0-2-20260828
          fetch-depth: 2
          persist-credentials: true

      - name: Verify clean branch input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = codex/hepta-architecture-convergence-p0-2-20260828
          git diff --exit-code
          git diff --cached --exit-code
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Complete product data ownership
        run: python3 scripts/hepta-product-graph-authority-completion-p0-1-v2.py

      - name: Apply cross-platform durability hardening
        run: python3 scripts/hepta-architecture-p0-2-portability-bootstrap.py

      - name: Extract physical Memory runtime facade
        run: python3 scripts/hepta-memory-runtime-extraction-p0-1.py

      - name: Wire legacy production authority adapter
        run: python3 scripts/hepta-legacy-production-authority-adapter-p0-1.py

      - name: Format owned convergence packages
        working-directory: codex-rs
        run: |
          cargo fmt \
            -p codex-hepta-contracts \
            -p codex-hepta-memory \
            -p codex-hepta-memory-runtime \
            -p codex-hepta-agentd

      - name: Refresh the local workspace lock graph
        working-directory: codex-rs
        run: |
          cargo check \
            -p codex-hepta-memory-runtime \
            -p codex-hepta-agentd

      - name: Validate workspace, lock, and module bindings
        run: |
          python3 - <<'PY'
          import pathlib
          import tomllib

          root = pathlib.Path("codex-rs")
          workspace = tomllib.loads((root / "Cargo.toml").read_text(encoding="utf-8"))
          members = workspace["workspace"]["members"]
          if members.count("hepta-memory-runtime") != 1:
              raise SystemExit("hepta-memory-runtime must be exactly one workspace member")
          dependencies = workspace["workspace"]["dependencies"]
          if dependencies.get("codex-hepta-memory-runtime", {}).get("path") != "hepta-memory-runtime":
              raise SystemExit("hepta-memory-runtime workspace dependency drifted")

          runtime_manifest = tomllib.loads(
              (root / "hepta-memory-runtime/Cargo.toml").read_text(encoding="utf-8")
          )
          if runtime_manifest["package"]["name"] != "codex-hepta-memory-runtime":
              raise SystemExit("Memory runtime package identity drifted")

          agentd = tomllib.loads((root / "hepta-agentd/Cargo.toml").read_text(encoding="utf-8"))
          if "codex-hepta-memory-runtime" not in agentd.get("dependencies", {}):
              raise SystemExit("Agentd is not bound to the Memory runtime facade")

          runtime_source = (root / "hepta-memory-runtime/src/lib.rs").read_text(encoding="utf-8")
          for needle in (
              "mod legacy_authority;",
              "pub use legacy_authority::adopt_verified_legacy_cognitive_write;",
              "pub struct AgentMemoryRuntime",
          ):
              if needle not in runtime_source:
                  raise SystemExit(f"Memory runtime is missing {needle!r}")

          lock = tomllib.loads((root / "Cargo.lock").read_text(encoding="utf-8"))
          packages = {package["name"]: package for package in lock["package"]}
          runtime = packages.get("codex-hepta-memory-runtime")
          if runtime is None:
              raise SystemExit("Memory runtime is missing from Cargo.lock")
          agentd_lock = packages.get("codex-hepta-agentd")
          if agentd_lock is None or "codex-hepta-memory-runtime" not in agentd_lock.get("dependencies", []):
              raise SystemExit("Agentd lock entry is missing the Memory runtime facade")
          PY

      - name: Enforce convergence changed-path allowlist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          allowed = {
              "codex-rs/Cargo.lock",
              "codex-rs/Cargo.toml",
              "codex-rs/hepta-contracts/src/authority.rs",
              "codex-rs/hepta-contracts/src/lib.rs",
              "codex-rs/hepta-contracts/src/operation.rs",
              "codex-rs/hepta-contracts/src/product_graph.rs",
              "codex-rs/hepta-contracts/tests/cross_owner_fault_matrix.rs",
              "codex-rs/hepta-memory/src/cognitive_runtime.rs",
              "codex-rs/hepta-memory-runtime/src/legacy_authority.rs",
              "codex-rs/hepta-memory-runtime/src/lib.rs",
              "codex-rs/hepta-agentd/Cargo.toml",
              "codex-rs/hepta-agentd/src/app_runtime.rs",
              "codex-rs/hepta-agentd/src/composition.rs",
              "codex-rs/hepta-agentd/src/runtime.rs",
              "docs/architecture/HEPTA_ARCHITECTURE_CONVERGENCE_P0_2_STATUS.json",
              "docs/architecture/HEPTA_CURRENT_ARCHITECTURE_V1.json",
              "scripts/verify-hepta-architecture-convergence-p0-2.py",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "--diff-filter=ACMRTUXB"],
                  text=True,
              ).splitlines()
          )
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"P0.2 finalizer escaped the allowlist: {unexpected}")
          PY
          git diff --check

      - name: Canonical architecture source gate
        run: python3 scripts/verify-hepta-architecture-convergence-p0-2.py

      - name: Unified authority and product graph tests
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-hepta-contracts authority::tests -- --nocapture
          cargo test --locked -p codex-hepta-contracts operation::tests -- --nocapture
          cargo test --locked -p codex-hepta-contracts product_graph::tests -- --nocapture

      - name: Durable cross-owner fault matrix
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-contracts --test cross_owner_fault_matrix -- --nocapture

      - name: Memory runtime facade and legacy adapter tests
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-memory-runtime -- --nocapture

      - name: Default Agentd product composition tests
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-hepta-agentd composition::tests -- --nocapture
          cargo test --locked -p codex-hepta-agentd app_runtime::tests -- --nocapture

      - name: Qualification writer typed-authority tests
        working-directory: codex-rs
        run: |
          cargo test --locked \
            -p codex-hepta-agentd \
            --features qualification-cognitive-write \
            app_runtime::tests -- --nocapture

      - name: Real product package graph compilation
        working-directory: codex-rs
        run: |
          cargo check --locked \
            -p codex-hepta-memory-runtime \
            -p codex-hepta-agentd \
            -p codex-hepta-supervisor \
            -p codex-hepta-matrixd \
            -p codex-hepta-native-gateway

      - name: Strict convergence Clippy
        working-directory: codex-rs
        run: |
          cargo clippy --locked --all-targets \
            -p codex-hepta-contracts \
            -p codex-hepta-memory-runtime \
            -p codex-hepta-agentd \
            -- -D warnings

      - name: Commit one verified convergence snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "The convergence snapshot is already materialized."
            exit 0
          fi
          git config user.name "Hepta convergence finalizer"
          git config user.email "102159240+ProfAlexQI@users.noreply.github.com"
          git add \
            codex-rs/Cargo.lock \
            codex-rs/Cargo.toml \
            codex-rs/hepta-contracts/src/authority.rs \
            codex-rs/hepta-contracts/src/lib.rs \
            codex-rs/hepta-contracts/src/operation.rs \
            codex-rs/hepta-contracts/src/product_graph.rs \
            codex-rs/hepta-contracts/tests/cross_owner_fault_matrix.rs \
            codex-rs/hepta-memory/src/cognitive_runtime.rs \
            codex-rs/hepta-memory-runtime/src/legacy_authority.rs \
            codex-rs/hepta-memory-runtime/src/lib.rs \
            codex-rs/hepta-agentd/Cargo.toml \
            codex-rs/hepta-agentd/src/app_runtime.rs \
            codex-rs/hepta-agentd/src/composition.rs \
            codex-rs/hepta-agentd/src/runtime.rs \
            docs/architecture/HEPTA_ARCHITECTURE_CONVERGENCE_P0_2_STATUS.json \
            docs/architecture/HEPTA_CURRENT_ARCHITECTURE_V1.json \
            scripts/verify-hepta-architecture-convergence-p0-2.py
          git diff --cached --check
          git commit -m "refactor(hepta): materialize architecture convergence P0.2 [hepta-p0-2-finalize]"
          git push origin HEAD:refs/heads/codex/hepta-architecture-convergence-p0-2-20260828
