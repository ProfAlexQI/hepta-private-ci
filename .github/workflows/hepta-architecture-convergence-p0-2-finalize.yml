name: Hepta architecture convergence P0.2 finalizer

on:
  push:
    branches:
      - codex/hepta-architecture-convergence-p0-2-20260828
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-architecture-convergence-p0-2-write-lane
  cancel-in-progress: true

env:
  BRANCH_NAME: codex/hepta-architecture-convergence-p0-2-20260828
  SOURCE_HEAD: ${{ github.sha }}

jobs:
  converge-and-verify:
    name: Converge and execute the product graph
    if: ${{ !contains(github.event.head_commit.message || '', '[hepta-p0-2-finalize]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact clean input identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH_NAME"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          git diff --exit-code
          git diff --cached --exit-code
          git rev-parse 'HEAD^{tree}'

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Complete product data ownership
        run: python3 scripts/hepta-product-graph-authority-completion-p0-1-v2.py

      - name: Apply cross-platform durability hardening
        run: python3 scripts/hepta-architecture-p0-2-portability-bootstrap.py

      - name: Extract physical Memory runtime facade
        run: python3 scripts/hepta-memory-runtime-extraction-p0-1.py

      - name: Wire legacy production authority adapter
        run: python3 scripts/hepta-legacy-production-authority-adapter-p0-1.py

      - name: Format bounded convergence packages
        working-directory: codex-rs
        run: |
          cargo fmt \
            -p codex-hepta-contracts \
            -p codex-hepta-memory \
            -p codex-hepta-memory-runtime \
            -p codex-hepta-agentd

      - name: Refresh the local workspace lock graph
        working-directory: codex-rs
        run: |
          cargo check \
            -p codex-hepta-memory-runtime \
            -p codex-hepta-agentd

      - name: Verify physical Memory extraction and lock binding
        run: python3 scripts/verify-hepta-memory-runtime-extraction-p0-1.py

      - name: Enforce convergence changed-path allowlist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import subprocess

          allowed_exact = {
              "codex-rs/Cargo.lock",
              "codex-rs/Cargo.toml",
              "codex-rs/hepta-agentd/Cargo.toml",
              "docs/architecture/HEPTA_ARCHITECTURE_CONVERGENCE_P0_2_STATUS.json",
              "docs/architecture/HEPTA_CURRENT_ARCHITECTURE_V1.json",
              "scripts/verify-hepta-architecture-convergence-p0-2.py",
          }
          allowed_rust_prefixes = (
              "codex-rs/hepta-contracts/",
              "codex-rs/hepta-memory/",
              "codex-rs/hepta-memory-runtime/",
              "codex-rs/hepta-agentd/",
          )
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "--diff-filter=ACMRTUXB"],
                  text=True,
              ).splitlines()
          )
          unexpected = sorted(
              path
              for path in changed
              if path not in allowed_exact
              and not (
                  path.endswith(".rs")
                  and path.startswith(allowed_rust_prefixes)
                  and pathlib.Path(path).is_file()
              )
          )
          if unexpected:
              raise SystemExit(f"P0.2 finalizer escaped the allowlist: {unexpected}")
          PY
          git diff --check

      - name: Stage one immutable candidate tree
        shell: bash
        run: |
          set -euo pipefail
          git add \
            codex-rs/Cargo.lock \
            codex-rs/Cargo.toml \
            codex-rs/hepta-contracts \
            codex-rs/hepta-memory \
            codex-rs/hepta-memory-runtime \
            codex-rs/hepta-agentd \
            docs/architecture/HEPTA_ARCHITECTURE_CONVERGENCE_P0_2_STATUS.json \
            docs/architecture/HEPTA_CURRENT_ARCHITECTURE_V1.json \
            scripts/verify-hepta-architecture-convergence-p0-2.py
          git diff --cached --check
          candidate_tree="$(git write-tree)"
          echo "CANDIDATE_TREE=$candidate_tree" >> "$GITHUB_ENV"
          echo "candidate_tree=$candidate_tree" >> "$GITHUB_STEP_SUMMARY"

      - name: Canonical architecture and authority source gates
        run: |
          python3 scripts/verify-hepta-architecture-convergence-p0-2.py
          python3 scripts/verify-hepta-authority-callers-p0-1.py
          python3 scripts/verify-hepta-memory-runtime-extraction-p0-1.py

      - name: Unified authority and product graph tests
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-hepta-contracts authority::tests -- --nocapture
          cargo test --locked -p codex-hepta-contracts operation::tests -- --nocapture
          cargo test --locked -p codex-hepta-contracts product_graph::tests -- --nocapture

      - name: Durable cross-owner fault matrix
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-contracts --test cross_owner_fault_matrix -- --nocapture

      - name: Memory runtime facade and legacy adapter tests
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-memory-runtime -- --nocapture

      - name: Default Agentd product composition tests
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-hepta-agentd composition::tests -- --nocapture
          cargo test --locked -p codex-hepta-agentd app_runtime::tests -- --nocapture

      - name: Qualification writer typed-authority tests
        working-directory: codex-rs
        run: |
          cargo test --locked \
            -p codex-hepta-agentd \
            --features qualification-cognitive-write \
            app_runtime::tests -- --nocapture

      - name: Real product package graph compilation
        working-directory: codex-rs
        run: |
          cargo check --locked \
            -p codex-hepta-memory-runtime \
            -p codex-hepta-agentd \
            -p codex-hepta-supervisor \
            -p codex-hepta-matrixd \
            -p codex-hepta-native-gateway

      - name: Strict convergence Clippy
        working-directory: codex-rs
        run: |
          cargo clippy --locked --all-targets \
            -p codex-hepta-contracts \
            -p codex-hepta-memory \
            -p codex-hepta-memory-runtime \
            -p codex-hepta-agentd \
            -- -D warnings

      - name: Verify tested candidate tree remained immutable
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --check
          test "$(git write-tree)" = "$CANDIDATE_TREE"

      - name: Commit and fast-forward the verified candidate
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "The verified convergence candidate is already materialized."
            exit 0
          fi
          git config user.name "Hepta convergence finalizer"
          git config user.email "102159240+ProfAlexQI@users.noreply.github.com"
          git commit -m "refactor(hepta): materialize architecture convergence P0.2 [hepta-p0-2-finalize]"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          git fetch origin "refs/heads/$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
          test "$(git rev-parse "origin/$BRANCH_NAME")" = "$SOURCE_HEAD"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
