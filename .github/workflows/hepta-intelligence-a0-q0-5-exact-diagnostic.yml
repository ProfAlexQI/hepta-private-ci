name: Hepta Intelligence A0 + Q0.13 exact integration diagnostic

on:
  push:
    branches:
      - "diagnostic/hepta-intelligence-a0-q0-5-exact-f950-20260830"
  workflow_dispatch:

permissions:
  contents: read

# Reuse the previous exact-diagnostic concurrency group so obsolete queued
# Q0.8 attempts are cancelled rather than consuming another runner.
concurrency:
  group: hepta-intelligence-a0-q0-8-exact-${{ github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_REPOSITORY: ProfHepta/hepta-private-ci
  EXPECTED_HEAD_SHA: 7282cdc83f66393a904d5d56d8672b2ca947df01
  EXPECTED_TREE_SHA: e77911c0e38a54666d01d937a24e98f22b929ee3
  EXPECTED_SYNTHETIC_MERGE: 28c91f01b8b3e4fff82215eaa06bb7c2710717fc
  A0_SOURCE_HEAD: 73a636867dbebc2dd4bdf957c9c6ff3eb0ea9358
  Q0_10_HEAD: 8d7960f1805c6b2cda0d6274bf2541a535a4d30c
  Q0_11_HEAD: 4ebb22ef9f46a8b50e5072e58041ea27f0a6caf7
  Q0_12_HEAD: fb24739dcc415c0dc0dd06ecac9762ac19f45471
  Q0_13_HEAD: 7a7380578f67412d79218909d975d710b96cf686
  PYTHONPYCACHEPREFIX: ${{ runner.temp }}/hepta-python-cache

jobs:
  exact-integration-diagnostic:
    name: Exact 7282cdc integration high-risk gates
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact integration candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact immutable identity and linear source topology
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE_SHA"
          test "$(git show -s --format=%P HEAD)" = "$A0_SOURCE_HEAD $Q0_13_HEAD"

          git fetch --no-tags --depth=1 origin \
            "+$Q0_10_HEAD:refs/remotes/hepta/q0-10" \
            "+$Q0_11_HEAD:refs/remotes/hepta/q0-11" \
            "+$Q0_12_HEAD:refs/remotes/hepta/q0-12" \
            "+$Q0_13_HEAD:refs/remotes/hepta/q0-13" \
            "+refs/pull/93/merge:refs/remotes/pull/93/merge"

          test "$(git show -s --format=%P "$Q0_11_HEAD")" = "$Q0_10_HEAD"
          test "$(git show -s --format=%P "$Q0_12_HEAD")" = "$Q0_11_HEAD"
          test "$(git show -s --format=%P "$Q0_13_HEAD")" = "$Q0_12_HEAD"
          test "$(git rev-parse refs/remotes/pull/93/merge)" = "$EXPECTED_SYNTHETIC_MERGE"
          test "$(git rev-parse refs/remotes/pull/93/merge^{tree})" = "$EXPECTED_TREE_SHA"
          test "$(git show -s --format=%P refs/remotes/pull/93/merge)" = "$A0_SOURCE_HEAD $EXPECTED_HEAD_SHA"

          test "$(git diff --name-only "$Q0_10_HEAD" "$Q0_11_HEAD")" = $'.github/scripts/run_bazel_with_buildbuddy.py\n.github/scripts/test_run_bazel_local_windows_fallback.py'
          test "$(git diff --name-only "$Q0_11_HEAD" "$Q0_12_HEAD")" = "patches/llvm_windows_mingw_compat.patch"
          test "$(git diff --name-only "$Q0_12_HEAD" "$Q0_13_HEAD")" = ".github/scripts/run-bazel-ci.sh"

          evidence_dir="$RUNNER_TEMP/hepta-intelligence-a0-q0-13-diagnostic"
          mkdir -p "$evidence_dir"
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "candidate_head=$(git rev-parse HEAD)"
            echo "candidate_tree=$(git rev-parse HEAD^{tree})"
            echo "candidate_parents=$(git show -s --format=%P HEAD)"
            echo "synthetic_merge=$(git rev-parse refs/remotes/pull/93/merge)"
            echo "synthetic_tree=$(git rev-parse refs/remotes/pull/93/merge^{tree})"
            echo "source_stack=$Q0_10_HEAD,$Q0_11_HEAD,$Q0_12_HEAD,$Q0_13_HEAD"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
          } > "$evidence_dir/identity.txt"

      - name: Verify all A0-owned blobs are byte-identical to the first parent
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$A0_SOURCE_HEAD" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          a0 = sys.argv[1]
          root = pathlib.Path.cwd()
          integration = json.loads(
              (root / "plans/hepta-intelligence/HEPTA_INTELLIGENCE_INTEGRATION_CANDIDATE_V1.json").read_text()
          )
          paths = integration["allowed_changed_paths"]
          assert len(paths) == 17, paths
          for path in paths:
              current = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:{path}"], text=True
              ).strip()
              source = subprocess.check_output(
                  ["git", "rev-parse", f"{a0}:{path}"], text=True
              ).strip()
              if current != source:
                  raise SystemExit(f"A0 blob drift: {path}: {current} != {source}")
          print("PASS_A0_FIRST_PARENT_BLOB_IDENTITY")
          PY

      - name: Compile and run Windows Bazel policy regression tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/run-bazel-ci.sh
          python3 -m py_compile \
            .github/scripts/run_bazel_with_buildbuddy.py \
            .github/scripts/test_run_bazel_with_buildbuddy.py \
            .github/scripts/test_run_bazel_local_windows_fallback.py
          (
            cd .github/scripts
            python3 -m unittest -v \
              test_run_bazel_with_buildbuddy.py \
              test_run_bazel_local_windows_fallback.py
          )

      - name: Prove default gnullvm fail-closed and explicit MSVC diagnostic construction
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/hepta-intelligence-a0-q0-13-diagnostic"

          set +e
          fail_output="$(
            env -i \
              HOME="$HOME" \
              PATH="$PATH" \
              RUNNER_OS=Windows \
              CODEX_BAZEL_WINDOWS_PATH='C:\Windows\System32' \
              bash .github/scripts/run-bazel-ci.sh \
                --windows-cross-compile -- build -- //:must-not-run 2>&1
          )"
          fail_status=$?
          set -e
          test "$fail_status" -ne 0
          grep -F "refusing to substitute an MSVC result for a gnullvm check" <<< "$fail_output"
          printf '%s\n' "$fail_output" > "$evidence_dir/default-fail-closed.txt"

          fixture_dir="$RUNNER_TEMP/hepta-bazel-wrapper-fixture"
          capture="$evidence_dir/explicit-msvc-diagnostic-args.txt"
          mkdir -p "$fixture_dir"
          cp .github/scripts/run-bazel-ci.sh "$fixture_dir/run-bazel-ci.sh"
          cat > "$fixture_dir/run_bazel_with_buildbuddy.py" <<'SH'
          #!/usr/bin/env bash
          printf '%s\n' "$@" > "$ARG_CAPTURE"
          SH
          chmod +x "$fixture_dir/run_bazel_with_buildbuddy.py"

          env -i \
            HOME="$HOME" \
            PATH="$PATH" \
            RUNNER_OS=Windows \
            GITHUB_ACTIONS=true \
            GITHUB_JOB=diagnostic \
            ALLOW_WINDOWS_MSVC_FALLBACK=1 \
            CODEX_BAZEL_WINDOWS_PATH='C:\Windows\System32' \
            ARG_CAPTURE="$capture" \
            bash "$fixture_dir/run-bazel-ci.sh" \
              --windows-cross-compile -- build -- //:diagnostic-fixture

          grep -Fqx -- "--host_platform=//:local_windows_msvc" "$capture"
          grep -Fqx -- "--platforms=//:local_windows_msvc" "$capture"
          grep -Fqx -- "--jobs=8" "$capture"

          grep -Fq 'LOCAL_WINDOWS_CI_CONFIG = "--config=ci-windows"' \
            .github/scripts/run_bazel_with_buildbuddy.py
          grep -Fq '//constraints/windows/abi:gnullvm' \
            patches/llvm_windows_mingw_compat.patch
          grep -Fq 'common:ci-windows-cross --platforms=//:windows_x86_64_gnullvm' \
            .bazelrc

      - name: Set up repository CI tools
        uses: ./.github/actions/setup-ci

      - name: Install Rust 1.95 with fmt and Clippy
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Install cargo-shear 1.11.2
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-shear@1.11.2

      - name: Verify canonical plan, truth, A0 authority, and compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/hepta-intelligence-current-truth.py \
            scripts/hepta-intelligence-status-compat.py \
            scripts/verify-hepta-intelligence-a0-authority.py \
            scripts/verify-hepta-intelligence-document-authority.py \
            scripts/verify-hepta-intelligence-master-plan.py
          python3 scripts/verify-hepta-intelligence-master-plan.py
          python3 scripts/verify-hepta-intelligence-document-authority.py
          python3 scripts/hepta-intelligence-current-truth.py --verify
          for tranche in P0.2 P0.3 P0.4a P0.4b P0.4c; do
            python3 scripts/hepta-intelligence-status-compat.py "$tranche" --check-only
          done

          a0_dir="$RUNNER_TEMP/hepta-intelligence-a0-source"
          git worktree add --detach "$a0_dir" "$A0_SOURCE_HEAD"
          (
            cd "$a0_dir"
            env -u GITHUB_HEAD_REF -u GITHUB_REF_NAME \
              GITHUB_SHA="$A0_SOURCE_HEAD" \
              GITHUB_REPOSITORY="$EXPECTED_REPOSITORY" \
              python3 scripts/verify-hepta-intelligence-a0-authority.py \
              > "$RUNNER_TEMP/hepta-intelligence-a0-q0-13-diagnostic/a0-authority-receipt.json"
          )
          git worktree remove --force "$a0_dir"

      - name: Verify Bazel module patch and exact lock
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'target_settings = target_settings + ["//constraints/windows/abi:gnullvm"]' \
            patches/llvm_windows_mingw_compat.patch
          ./scripts/check-module-bazel-lock.sh

      - name: Repository and Rust format gates
        shell: bash
        run: |
          set -euo pipefail
          just fmt-check
          (
            cd codex-rs
            cargo +1.95.0 fmt -- --config imports_granularity=Item --check
          )

      - name: Cargo shear strict gate and Matrixd membership
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo shear --deny-warnings
          cargo +1.95.0 metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert any(p["name"] == "codex-hepta-matrixd" for p in d["packages"])'

      - name: Compile all Q0 manifest-affected packages and test targets
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            codex-queue-extension
            codex-hepta-agent-protocol
            codex-hepta-agentd
            codex-hepta-automation
            codex-hepta-contracts
            codex-hepta-fleet
            codex-hepta-matrix-sdk
            codex-hepta-matrix-store
            codex-hepta-paths
          )
          cargo_args=()
          for package in "${packages[@]}"; do
            cargo_args+=(--package "$package")
          done
          cargo +1.95.0 check --all-targets --locked "${cargo_args[@]}"
          cargo +1.95.0 test --all-targets --locked --no-run "${cargo_args[@]}"

      - name: Run repaired package tests and strict Clippy
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            codex-uds
            codex-hepta-automation
            codex-hepta-contracts
            codex-hepta-fleet
          )
          for package in "${packages[@]}"; do
            cargo +1.95.0 test -p "$package" --all-targets --locked
            cargo +1.95.0 clippy -p "$package" --all-targets --locked -- -D warnings
          done

      - name: Cargo deny checked policy gate
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml
          arguments: --all-features
          command-arguments: --config ./codex-rs/deny.toml

      - name: Verify no source mutation and emit negative-authority outcome
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=normal --ignore-submodules=none)"
          evidence_dir="$RUNNER_TEMP/hepta-intelligence-a0-q0-13-diagnostic"
          mkdir -p "$evidence_dir"
          {
            echo "completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "job_status=${{ job.status }}"
            echo "source_writeback=false"
            echo "a0_candidate_qualified=false"
            echo "selected=false"
            echo "full_repository_merge_green=false"
            echo "runtime_authority=false"
            echo "production_authority=false"
            echo "operator_acceptance=false"
            echo "promotion=false"
            echo "release_authority=false"
            echo "callers_ratchet=false"
          } > "$evidence_dir/outcome.txt"

      - name: Upload diagnostic evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-intelligence-a0-q0-13-exact-7282cdc-${{ github.run_id }}
          path: ${{ runner.temp }}/hepta-intelligence-a0-q0-13-diagnostic/**
          if-no-files-found: error
          retention-days: 30
