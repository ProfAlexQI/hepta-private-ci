name: Hepta Intelligence A0 + Q0.7 exact integration diagnostic

on:
  push:
    branches:
      - "diagnostic/hepta-intelligence-a0-q0-5-exact-f950-20260830"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-intelligence-a0-q0-5-exact-f950-${{ github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_REPOSITORY: ProfHepta/hepta-private-ci
  EXPECTED_HEAD_SHA: 1b6cab3814031fa903450f893bbefadfe410adea
  EXPECTED_TREE_SHA: 09675380e8a2d93ed836069271d7b499676c1209
  A0_SOURCE_HEAD: 73a636867dbebc2dd4bdf957c9c6ff3eb0ea9358
  Q0_7_SECOND_PARENT: 5895eea863b9997d13586a2a26aef29a9f69e98e

jobs:
  exact-integration-diagnostic:
    name: Exact 1b6cab integration high-risk gates
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact integration candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact immutable identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE_SHA"
          read -r first_parent second_parent extra <<< "$(git show -s --format=%P HEAD)"
          test "$first_parent" = "$A0_SOURCE_HEAD"
          test "$second_parent" = "$Q0_7_SECOND_PARENT"
          test -z "${extra:-}"
          git cat-file -e "$A0_SOURCE_HEAD^{commit}"
          git cat-file -e "$Q0_7_SECOND_PARENT^{commit}"
          mkdir -p "$RUNNER_TEMP/hepta-intelligence-a0-q0-7-diagnostic"
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "candidate_head=$(git rev-parse HEAD)"
            echo "candidate_tree=$(git rev-parse HEAD^{tree})"
            echo "candidate_parents=$(git show -s --format=%P HEAD)"
            echo "a0_source_head=$A0_SOURCE_HEAD"
            echo "q0_7_second_parent=$Q0_7_SECOND_PARENT"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
          } > "$RUNNER_TEMP/hepta-intelligence-a0-q0-7-diagnostic/identity.txt"

      - name: Verify all A0-owned blobs are byte-identical to the first parent
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$A0_SOURCE_HEAD" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          a0 = sys.argv[1]
          root = pathlib.Path.cwd()
          integration = json.loads(
              (root / "plans/hepta-intelligence/HEPTA_INTELLIGENCE_INTEGRATION_CANDIDATE_V1.json").read_text()
          )
          paths = integration["allowed_changed_paths"]
          assert len(paths) == 17, paths
          for path in paths:
              current = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:{path}"], text=True
              ).strip()
              source = subprocess.check_output(
                  ["git", "rev-parse", f"{a0}:{path}"], text=True
              ).strip()
              if current != source:
                  raise SystemExit(f"A0 blob drift: {path}: {current} != {source}")
          print("PASS_A0_FIRST_PARENT_BLOB_IDENTITY")
          PY

      - name: Verify the bounded sha2 repair contract
        shell: bash
        run: |
          set -euo pipefail
          manifest=codex-rs/hepta-automation/Cargo.toml
          grep -Fqx '[package.metadata.cargo-shear]' "$manifest"
          grep -Fqx 'ignored = ["sha2"]' "$manifest"
          grep -Fqx 'sha2 = { workspace = true }' "$manifest"
          grep -Fqx 'mod taskflow;' codex-rs/hepta-automation/src/lib.rs
          grep -Fqx 'use sha2::Digest;' codex-rs/hepta-automation/src/taskflow.rs
          grep -Fqx 'use sha2::Sha256;' codex-rs/hepta-automation/src/taskflow.rs

      - name: Set up repository CI tools
        uses: ./.github/actions/setup-ci

      - name: Install Rust 1.95 with fmt and Clippy
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Install cargo-shear 1.11.2
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-shear@1.11.2

      - name: Compile strict Hepta Intelligence validators
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/hepta-intelligence-current-truth.py \
            scripts/hepta-intelligence-status-compat.py \
            scripts/verify-hepta-intelligence-a0-authority.py \
            scripts/verify-hepta-intelligence-document-authority.py \
            scripts/verify-hepta-intelligence-master-plan.py

      - name: Verify integration plan, document authority, truth, and compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-hepta-intelligence-master-plan.py
          python3 scripts/verify-hepta-intelligence-document-authority.py
          python3 scripts/hepta-intelligence-current-truth.py --verify
          for tranche in P0.2 P0.3 P0.4a P0.4b P0.4c; do
            python3 scripts/hepta-intelligence-status-compat.py "$tranche" --check-only
          done

      - name: Re-verify canonical A0 source in an isolated first-parent worktree
        shell: bash
        run: |
          set -euo pipefail
          a0_dir="$RUNNER_TEMP/hepta-intelligence-a0-source"
          git worktree add --detach "$a0_dir" "$A0_SOURCE_HEAD"
          (
            cd "$a0_dir"
            env -u GITHUB_HEAD_REF -u GITHUB_REF_NAME \
              GITHUB_SHA="$A0_SOURCE_HEAD" \
              GITHUB_REPOSITORY="$EXPECTED_REPOSITORY" \
              python3 scripts/verify-hepta-intelligence-a0-authority.py \
              > "$RUNNER_TEMP/hepta-intelligence-a0-q0-7-diagnostic/a0-authority-receipt.json"
          )
          git worktree remove --force "$a0_dir"

      - name: Repository format gate
        shell: bash
        run: |
          set -euo pipefail
          just fmt-check

      - name: Canonical Rust format gate
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -- --config imports_granularity=Item --check

      - name: Cargo shear strict gate
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo shear --deny-warnings
          cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert any(p["name"] == "codex-hepta-matrixd" for p in d["packages"])'

      - name: Compile every Q0.3 affected package and all test targets
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            codex-queue-extension
            codex-hepta-agent-protocol
            codex-hepta-agentd
            codex-hepta-automation
            codex-hepta-contracts
            codex-hepta-fleet
            codex-hepta-matrix-sdk
            codex-hepta-matrix-store
            codex-hepta-paths
          )
          cargo_args=()
          for package in "${packages[@]}"; do
            cargo_args+=(--package "$package")
          done
          cargo check --all-targets --locked "${cargo_args[@]}"
          cargo test --all-targets --locked --no-run "${cargo_args[@]}"

      - name: Automation tests and strict Clippy
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-hepta-automation --all-targets --locked
          cargo clippy -p codex-hepta-automation --all-targets --locked -- -D warnings

      - name: Cargo deny checked policy gate
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml
          arguments: --all-features
          command-arguments: --config ./codex-rs/deny.toml

      - name: UDS package tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-uds --all-targets --locked

      - name: UDS strict Clippy
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p codex-uds --all-targets --all-features --locked -- -D warnings

      - name: Verify no source mutation
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=normal --ignore-submodules=none)"
          {
            echo "completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "job_status=${{ job.status }}"
            echo "source_writeback=false"
            echo "a0_candidate_qualified=false"
            echo "selected=false"
            echo "runtime_authority=false"
            echo "production_authority=false"
          } > "$RUNNER_TEMP/hepta-intelligence-a0-q0-7-diagnostic/outcome.txt"

      - name: Upload diagnostic evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4
        with:
          name: hepta-intelligence-a0-q0-7-exact-1b6cab-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/hepta-intelligence-a0-q0-7-diagnostic/**
          if-no-files-found: error
          retention-days: 30
