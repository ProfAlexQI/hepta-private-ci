name: Temporary Hepta V6 atomic finalizer

on:
  push:
    branches:
      - codex/hepta-development-docs-v6-final-20260831
    paths:
      - ".github/workflows/_temporary-hepta-v6-input-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: temporary-hepta-v6-atomic-finalizer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    name: Apply verified V6.0.1 payload and self-delete
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BRANCH: codex/hepta-development-docs-v6-final-20260831
      BASE_SHA: b621768b70a09d56626bb8a2c331e3dc424e6a4d
      PAYLOAD_SHA256: 11155f0f7429aa9c83d0e74159c79c37107b94dbf2f7a489d3302bb0e05b47e0
      AUTHBUS_HEAD: e082ea504ac9c34e13851e183b8adf972ee7fb93
      AUTHBUS_TREE: 7b8520c60fe32a66dedd99f5765aa297a0d4ef7c
      AUTHBUS_UPDATED_AT: 2026-08-31T15:42:33Z
    steps:
      - name: Checkout exact branch head with one-shot credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify staged hardening payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -f .github/hepta-v6-final-payload/part-00
          test -f .github/hepta-v6-final-payload/part-01
          test -f .github/hepta-v6-final-payload/part-02
          cat .github/hepta-v6-final-payload/part-* | base64 --decode > "$RUNNER_TEMP/hepta-v6-hardening-payload.tar.xz"
          echo "$PAYLOAD_SHA256  $RUNNER_TEMP/hepta-v6-hardening-payload.tar.xz" | sha256sum --check --strict
          tar -tJf "$RUNNER_TEMP/hepta-v6-hardening-payload.tar.xz" > "$RUNNER_TEMP/payload-files.txt"
          test "$(wc -l < "$RUNNER_TEMP/payload-files.txt")" -eq 26
          grep -Fx '.github/workflows/hepta-development-docs.yml' "$RUNNER_TEMP/payload-files.txt"
          grep -Fx 'docs/governance/LEGACY_DELETION_MANIFEST.json' "$RUNNER_TEMP/payload-files.txt"
          grep -Fx 'scripts/test-hepta-docs.py' "$RUNNER_TEMP/payload-files.txt"

      - name: Apply payload and refresh exact observed bindings
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf "$RUNNER_TEMP/hepta-v6-hardening-payload.tar.xz" -C .
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export observed_at
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path

          root = Path('.')
          observed_at = os.environ['observed_at']
          auth_head = os.environ['AUTHBUS_HEAD']
          auth_tree = os.environ['AUTHBUS_TREE']
          auth_updated = os.environ['AUTHBUS_UPDATED_AT']

          def load(path: str):
              return json.loads((root / path).read_text(encoding='utf-8'))

          def dump(path: str, value):
              (root / path).write_text(json.dumps(value, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          current = load('docs/CURRENT.json')
          current['observedAt'] = observed_at
          for candidate in current['activeCandidates']:
              candidate['observedAt'] = observed_at
              if candidate['pullRequest'] == 279:
                  candidate['sourceHead'] = auth_head
                  candidate['sourceTree'] = auth_tree
                  candidate['updatedAt'] = auth_updated
                  candidate['qualification']['staticVerification'] = 'source_verified'
                  candidate['qualification']['exactHeadExecution'] = 'passed'
                  candidate['qualification']['mergeCandidateExecution'] = 'passed'
                  candidate['qualification']['semanticReview'] = 'independent_semantic_review_pending'
                  candidate['qualification']['physicalEvidence'] = 'identity_bound_artifacts_available'
              elif candidate['pullRequest'] == 285:
                  candidate['updatedAt'] = observed_at
          current['normativePlanCandidate']['observedAt'] = observed_at
          current['normativePlanCandidate']['updatedAt'] = observed_at
          current['repository'].pop('observedAt', None)
          dump('docs/CURRENT.json', current)

          evidence = load('docs/evidence/INDEX.json')
          evidence['observedAt'] = observed_at
          for observation in evidence['observations']:
              observation['observedAt'] = observed_at
              if observation['pullRequest'] == 279:
                  observation['sourceHead'] = auth_head
                  observation['sourceTree'] = auth_tree
                  observation['updatedAt'] = auth_updated
                  observation['terminalExecutablePass'] = False
                  observation['receipts'] = []
                  observation['note'] = (
                      'Exact source-head and synthetic-merge repository-controlled matrices passed on run '
                      '33409999862; identity-bound artifacts exist, but this index remains conservative until '
                      'their complete execution receipts are embedded and independently revalidated.'
                  )
              elif observation['pullRequest'] == 285:
                  observation['updatedAt'] = observed_at
          dump('docs/evidence/INDEX.json', evidence)
          PY
          python3 scripts/hepta-docs.py generate-status

      - name: Remove all bootstrap and payload residue
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/hepta-v6-final-payload
          rm -f .github/workflows/_temporary-hepta-v6-input-snapshot.yml
          test ! -e .github/hepta-v6-final-payload
          test ! -e .github/workflows/_temporary-hepta-v6-input-snapshot.yml
          git diff --check

      - name: Commit one final atomic candidate tree
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hepta-closure-bot'
          git config user.email 'hepta-closure-bot@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain=v1)"
          git commit -m 'docs(hepta): apply fail-closed V6.0.1 hardening'
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Verify committed candidate and negative fixtures
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/hepta-docs.py scripts/test-hepta-docs.py
          python3 scripts/test-hepta-docs.py
          python3 scripts/hepta-docs.py verify | tee "$RUNNER_TEMP/static-verification.json"
          python3 scripts/hepta-docs.py inventory-legacy | tee "$RUNNER_TEMP/legacy-inventory.json"
          python3 scripts/hepta-docs.py verify-changeset --base "$BASE_SHA" --head HEAD | tee "$RUNNER_TEMP/changeset-verification.txt"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Push final candidate and retire this writer
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:$BRANCH"
