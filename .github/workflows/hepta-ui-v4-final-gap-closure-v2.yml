name: hepta-ui-v4-final-gap-closure-v2

on:
  push:
    branches: ["codex/ui-v4-final-source-and-evidence-closure-*"]
  pull_request:
    paths:
      - "scripts/hepta-ui-v4-final-gap-closure-index-v2"
      - "scripts/hepta-ui-v4-final-gap-closure-v2-gate"
      - "docs/ui/HEPTA_UI_FINAL_GAP_CLOSURE_V2.json"
      - "docs/ui/HEPTA_UI_REMAINING_EXTERNAL_BLOCKERS_V6.json"
      - "docs/ui/schemas/hepta.ui.v4.final-gap-closure-index.v2.schema.json"
      - ".github/workflows/hepta-ui-v4-final-gap-closure-v2.yml"
  workflow_dispatch:
    inputs:
      windows_device_artifact_id: {required: false, default: "", type: string}
      operator_acceptance_artifact_id: {required: false, default: "", type: string}
      macos_device_artifact_id: {required: false, default: "", type: string}
      ios_device_artifact_id: {required: false, default: "", type: string}
      android_device_artifact_id: {required: false, default: "", type: string}
      cross_browser_runtime_artifact_id: {required: false, default: "", type: string}
      browser_human_acceptance_artifact_id: {required: false, default: "", type: string}

permissions:
  contents: read
  actions: read

env:
  HEPTA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: hepta-ui-v4-final-gap-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Final gap closure v2 source contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate exact source framework
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_CANDIDATE_SHA"
          ruby -c scripts/hepta-ui-v4-final-gap-closure-index-v2
          ruby -c scripts/hepta-ui-v4-final-gap-closure-v2-gate
          ruby -rjson -e 'ARGV.each { |p| JSON.parse(File.read(p)) }' \
            docs/ui/HEPTA_UI_FINAL_GAP_CLOSURE_V2.json \
            docs/ui/HEPTA_UI_REMAINING_EXTERNAL_BLOCKERS_V6.json \
            docs/ui/schemas/hepta.ui.v4.final-gap-closure-index.v2.schema.json
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/hepta-ui-v4-final-gap-closure-v2.yml")'
          mkdir -p artifacts/source
          ruby scripts/hepta-ui-v4-final-gap-closure-index-v2 --self-test | tee artifacts/source/index-self-test.json
          ruby scripts/hepta-ui-v4-final-gap-closure-v2-gate | tee artifacts/source/source-gate.json
          printf '%s\n' "$HEPTA_CANDIDATE_SHA" > artifacts/source/candidate-commit.txt
          git rev-parse 'HEAD^{tree}' > artifacts/source/candidate-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-ui-v4-final-gap-v2-source-${{ env.HEPTA_CANDIDATE_SHA }}
          path: artifacts/source
          if-no-files-found: error
          retention-days: 14

  runner-proof:
    name: Final gap runner proof (${{ matrix.os }})
    needs: source-contract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove exact assigned runner and nonempty execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_CANDIDATE_SHA"
          ruby scripts/hepta-ui-v4-final-gap-closure-index-v2 --self-test >/dev/null

  final-index:
    name: Final UI gap closure index v2
    if: always()
    needs: [source-contract, runner-proof]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      WINDOWS_ID: ${{ inputs.windows_device_artifact_id || '' }}
      OPERATOR_ID: ${{ inputs.operator_acceptance_artifact_id || '' }}
      MACOS_ID: ${{ inputs.macos_device_artifact_id || '' }}
      IOS_ID: ${{ inputs.ios_device_artifact_id || '' }}
      ANDROID_ID: ${{ inputs.android_device_artifact_id || '' }}
      BROWSER_RUNTIME_ID: ${{ inputs.cross_browser_runtime_artifact_id || '' }}
      BROWSER_HUMAN_ID: ${{ inputs.browser_human_acceptance_artifact_id || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Produce same-run assigned-runner receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/input artifacts/output
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            > artifacts/output/jobs.json
          ruby -rjson -e '
            jobs=JSON.parse(File.read("artifacts/output/jobs.json")).fetch("jobs")
            required=[
              "Final gap closure v2 source contract",
              "Final gap runner proof (ubuntu-latest)",
              "Final gap runner proof (windows-latest)",
              "Final gap runner proof (macos-latest)"
            ]
            candidate=ENV.fetch("HEPTA_CANDIDATE_SHA")
            selected=required.map do |name|
              matches=jobs.select { |job| job["name"] == name }
              next {"name"=>name,"qualified"=>false,"reason"=>"job count #{matches.length}"} unless matches.length == 1
              job=matches.fetch(0)
              steps=Array(job["steps"])
              qualified=job["head_sha"] == candidate && job["status"] == "completed" && job["conclusion"] == "success" && job["runner_id"].to_i > 0 && !job["runner_name"].to_s.empty? && !steps.empty? && steps.all? { |step| %w[success skipped].include?(step["conclusion"]) }
              {"name"=>name,"jobId"=>job["id"],"runnerId"=>job["runner_id"].to_i,"runnerName"=>job["runner_name"].to_s,"labels"=>Array(job["labels"]),"stepCount"=>steps.length,"qualified"=>qualified}
            end
            pass=selected.all? { |job| job["qualified"] }
            payload={
              "schema"=>"hepta.ui.v4.runner-execution-receipt.v1",
              "status"=>pass ? "PASS_EXACT_HEAD_RUNNER_EXECUTION" : "FAIL_EXACT_HEAD_RUNNER_EXECUTION",
              "candidate"=>{"commit"=>candidate,"tree"=>`git rev-parse HEAD^{tree}`.strip},
              "jobs"=>selected,
              "allRequiredJobsExecuted"=>pass,
              "allRequiredStepsSuccessful"=>pass,
              "authority"=>{"network"=>false,"mutation"=>false,"effect"=>false,"liveAdapter"=>false,"production"=>false,"operatorAcceptance"=>false,"promotion"=>false,"release"=>false},
              "failures"=>pass ? [] : ["one or more exact-head jobs lack successful non-empty assigned-runner execution"]
            }
            File.write("artifacts/input/runnerExecution.json",JSON.pretty_generate(payload)+"\n")
          '
      - name: Download explicit evidence by artifact ID
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/input archives artifacts/output
          download_one() {
            local slot="$1" id="$2"
            [[ -z "$id" ]] && return 0
            [[ "$id" =~ ^[1-9][0-9]*$ ]]
            curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > "archives/$slot.metadata.json"
            ruby -rjson -e 'm=JSON.parse(File.read(ARGV[0])); abort "expired" if m.fetch("expired"); u=m.fetch("archive_download_url"); abort "unsafe url" unless u.start_with?("https://api.github.com/"); puts u' "archives/$slot.metadata.json" > "archives/$slot.url"
            curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$(cat "archives/$slot.url")" > "archives/$slot.zip"
            unzip -Z1 "archives/$slot.zip" > "archives/$slot.entries"
            SLOT="$slot" ruby -e 'File.readlines("archives/#{ENV.fetch("SLOT")}.entries",chomp:true).each{|e| abort "unsafe entry" if e.empty? || e.start_with?("/","\\") || e.match?(/\A[A-Za-z]:/) || e.tr("\\","/").split("/").include?("..")}'
            mkdir -p "artifacts/input/$slot"
            unzip -q "archives/$slot.zip" -d "artifacts/input/$slot"
            mapfile -t matches < <(find "artifacts/input/$slot" -type f -name '*.json' -print)
            [[ "${#matches[@]}" -eq 1 ]]
            cp "${matches[0]}" "artifacts/input/$slot.json"
          }
          download_one windowsDevice "$WINDOWS_ID"
          download_one operatorAcceptance "$OPERATOR_ID"
          download_one macosDevice "$MACOS_ID"
          download_one iosDevice "$IOS_ID"
          download_one androidDevice "$ANDROID_ID"
          download_one crossBrowserRuntime "$BROWSER_RUNTIME_ID"
          download_one browserHumanAcceptance "$BROWSER_HUMAN_ID"
      - name: Produce bounded final index
        id: index
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          args=(--candidate-commit "$HEPTA_CANDIDATE_SHA" --candidate-tree "$(git rev-parse 'HEAD^{tree}')" --evaluated-at-unix "$(date +%s)" --output artifacts/output/final-gap-closure.json)
          for slot in runnerExecution windowsDevice operatorAcceptance macosDevice iosDevice androidDevice crossBrowserRuntime browserHumanAcceptance; do
            path="artifacts/input/$slot.json"
            [[ -f "$path" ]] || continue
            flag="$(printf '%s' "$slot" | sed -E 's/([A-Z])/-\L\1/g')"
            args+=("--$flag" "$path")
          done
          ruby scripts/hepta-ui-v4-final-gap-closure-index-v2 "${args[@]}"
      - name: Enforce canonical result
        if: always()
        shell: bash
        env:
          INDEX_OUTCOME: ${{ steps.index.outcome }}
        run: |
          set -euo pipefail
          jq -e '.schema == "hepta.ui.v4.final-gap-closure-index.v2" and ([.authority[]] | all(. == false)) and ([.boundary[]] | all(. == false))' artifacts/output/final-gap-closure.json
          if [[ "$INDEX_OUTCOME" == "success" ]]; then
            jq -e '.status == "PASS_ALL_UI_GAPS_CLOSED" or .status == "BLOCKED_EXTERNAL_EVIDENCE_REQUIRED"' artifacts/output/final-gap-closure.json
          else
            jq -e '.status == "FAIL_UI_GAP_CLOSURE" and (.failures|length>0)' artifacts/output/final-gap-closure.json
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hepta-ui-v4-final-gap-v2-${{ env.HEPTA_CANDIDATE_SHA }}
          path: artifacts/output
          if-no-files-found: error
          retention-days: 14
