name: hepta-browser next required v8

on:
  workflow_call:
  pull_request:
    paths:
      - "codex-rs/hepta-shadow-qualification/**"
      - "scripts/hepta-servo-*.py"
      - "scripts/verify-hepta-servo-*.py"
      - "scripts/tests/test_hepta_servo_*.py"
      - "docs/hepta-vnext/browser/**"
      - "third_party/servo-patches/**"
      - ".github/workflows/hepta-browser-ci.yml"
      - ".github/workflows/hepta-servo-*.yml"
      - ".github/workflows/hepta-browser-next-required-v8.yml"
      - ".github/workflows/hepta-servo-exact-source-acceptance-live-review-v2.yml"
      - ".github/workflows/blocking-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  canonical-v7:
    name: Canonical C1 source candidate and pre-build tooling
    uses: ./.github/workflows/hepta-browser-next-required-v7.yml
    secrets: inherit

  source-acceptance-pointer-v1:
    name: Separate source-only pointer and current-head review fence
    uses: ./.github/workflows/hepta-servo-exact-source-acceptance-pointer-v1-contract.yml
    secrets: inherit

  required:
    name: Hepta Browser next required v8
    if: ${{ always() }}
    needs:
      - canonical-v7
      - source-acceptance-pointer-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require canonical tooling and source acceptance review fence
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          needs = json.loads(os.environ["NEEDS"])
          failures = {name: value.get("result") for name, value in needs.items() if value.get("result") != "success"}
          if failures:
              print(json.dumps({"status": "FAIL", "dependencies": failures}, sort_keys=True))
              sys.exit(1)
          print(json.dumps({
              "status": "PASS_TOOLING_AND_FIXTURES_ONLY",
              "dependencies": sorted(needs),
              "canonical_previous_gate": "v7",
              "source_acceptance_review_policy": "v1_self_bound",
              "source_acceptance_review_challenge": "v1_create_only",
              "source_acceptance_pointer": "v1_verify_only_no_creation_command",
              "source_live_review": "v2_trusted_base_standalone_required_status",
              "required_status_check": "Source-only accepted pointer live review",
              "exact_servo_source_accepted": False,
              "source_review_candidate_accepted": False,
              "worker_source_topology_accepted": False,
              "build_authorized": False,
              "accepted_toolchain_receipt": False,
              "accepted_build_recipe": False,
              "sealed_real_build_inputs": False,
              "real_build_preflight": False,
              "servo_build_run": False,
              "servo_artifact": False,
              "sbom": False,
              "servo_runtime_qualified": False,
              "operator_acceptance": False,
              "promotion": False,
              "release_qualified": False,
          }, sort_keys=True))
          PY

      - name: Record negative authority
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Hepta Browser canonical next-stage aggregate v8"
            echo
            echo "- trusted-base source acceptance live review v2: standalone required status"
            echo "- PR-head verifier execution: forbidden"
            echo "- exact Servo source accepted: false"
            echo "- Worker source topology accepted: false"
            echo "- build authorized: false"
            echo "- Servo built/runtime qualified: false"
            echo "- operator acceptance/promotion/release: false"
          } >> "$GITHUB_STEP_SUMMARY"
