name: Hepta inference historical INF-0 qualification

on:
  pull_request:
    paths:
      - "docs/hepta-vnext/inference/**"
      - "tools/hepta-inference-inf0/**"
      - "scripts/hepta-inference-inf0c-historical-receipt-gate.py"
      - "scripts/hepta-inference-inf0c-real-e2e.py"
      - "codex-rs/lmstudio/**"
      - "codex-rs/ollama/**"
      - "codex-rs/utils/oss/**"
      - "codex-rs/responses-api-proxy/**"
      - ".github/workflows/hepta-inference-inf0.yml"
  workflow_dispatch:
    inputs:
      run_real_software_e2e:
        description: "Run against pre-provisioned loopback Ollama and LM Studio services"
        required: false
        default: false
        type: boolean
      ollama_model:
        description: "Exact pre-installed Ollama model ID"
        required: false
        type: string
      lmstudio_model:
        description: "Exact pre-installed LM Studio model ID"
        required: false
        type: string

permissions:
  contents: read

jobs:
  source-contract:
    name: Immutable historical receipt and authority contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify assigned runner and Python sources
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNNER_NAME"
          test -n "$RUNNER_OS"
          test -n "$RUNNER_ARCH"
          test -z "$(git status --porcelain)"
          python3 -m py_compile \
            scripts/hepta-inference-inf0c-historical-receipt-gate.py \
            scripts/hepta-inference-inf0c-real-e2e.py

      - name: Verify immutable append-only INF-0C receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-inference-inf0c-historical-receipt-gate.py \
            | tee "$RUNNER_TEMP/hepta-inference-inf0c-historical-source.json"

      - name: Record qualification-only historical posture
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Hepta inference historical INF-0C source posture"
            echo
            echo "- exact descendant head: $(git rev-parse HEAD)"
            echo "- historical receipt validated: true"
            echo "- mutable current stage gate replayed: false"
            echo "- qualification_only: true"
            echo "- real_software_e2e_executed: false"
            echo "- backend_cancellation_acknowledged: false"
            echo "- qualified: false"
            echo "- production/effect/remote/operator/promotion/release authority: false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload historical source evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-inf0c-historical-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/hepta-inference-inf0c-historical-source.json
          if-no-files-found: error
          retention-days: 30

  reference-contract:
    name: Historical reference contracts
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Check standalone reference formatting
        shell: bash
        run: cargo fmt --manifest-path tools/hepta-inference-inf0/Cargo.toml -- --check

      - name: Test standalone reference crate
        shell: bash
        run: cargo test --manifest-path tools/hepta-inference-inf0/Cargo.toml --locked

      - name: Strict Clippy for standalone reference crate
        shell: bash
        run: |
          cargo clippy --manifest-path tools/hepta-inference-inf0/Cargo.toml \
            --all-targets --locked -- -D warnings

  compatibility-readiness:
    name: Compatibility readiness hardening
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Check included inference source fragments
        shell: bash
        run: |
          rustfmt --edition 2024 --check \
            ollama/src/client.rs \
            ollama/src/client_*.inc.rs \
            lmstudio/src/client.rs \
            lmstudio/src/client_*.inc.rs

      - name: Check owned inference package formatting
        shell: bash
        run: |
          cargo fmt \
            -p codex-lmstudio \
            -p codex-ollama \
            -p codex-utils-oss \
            -p codex-responses-api-proxy \
            -- --check

      - name: Compile readiness and privacy adapters
        shell: bash
        run: |
          cargo check --locked \
            -p codex-lmstudio \
            -p codex-ollama \
            -p codex-utils-oss \
            -p codex-responses-api-proxy

      - name: Test readiness and privacy adapters
        shell: bash
        run: |
          cargo test --locked \
            -p codex-lmstudio \
            -p codex-ollama \
            -p codex-utils-oss \
            -p codex-responses-api-proxy

      - name: Strict readiness and privacy Clippy
        shell: bash
        run: |
          cargo clippy --locked --all-targets --no-deps \
            -p codex-lmstudio \
            -p codex-ollama \
            -p codex-utils-oss \
            -p codex-responses-api-proxy \
            -- -D warnings

  real-software-e2e:
    name: Real software E2E on pre-provisioned runner
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_real_software_e2e }}
    needs: source-contract
    runs-on: [self-hosted, hepta-inference-e2e]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact pre-installed model IDs
        shell: bash
        env:
          OLLAMA_MODEL: ${{ inputs.ollama_model }}
          LMSTUDIO_MODEL: ${{ inputs.lmstudio_model }}
        run: |
          set -euo pipefail
          test -n "$OLLAMA_MODEL"
          test -n "$LMSTUDIO_MODEL"

      - name: Execute loopback-only no-download smoke
        shell: bash
        env:
          OLLAMA_MODEL: ${{ inputs.ollama_model }}
          LMSTUDIO_MODEL: ${{ inputs.lmstudio_model }}
        run: |
          set -euo pipefail
          python3 scripts/hepta-inference-inf0c-real-e2e.py \
            --execute \
            --ollama-model "$OLLAMA_MODEL" \
            --lmstudio-model "$LMSTUDIO_MODEL" \
            --receipt "$RUNNER_TEMP/hepta-inference-inf0c-real-e2e.json"

      - name: Upload real-software receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-inf0c-real-e2e-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-inference-inf0c-real-e2e.json
          if-no-files-found: error
          retention-days: 30

  qualification-summary:
    name: Historical qualification-only aggregate
    if: always()
    needs:
      - source-contract
      - reference-contract
      - compatibility-readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce aggregate result
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.source-contract.result }}
          REFERENCE_RESULT: ${{ needs.reference-contract.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility-readiness.result }}
        run: |
          set -euo pipefail
          printf 'source=%s\nreference=%s\ncompatibility=%s\n' \
            "$SOURCE_RESULT" "$REFERENCE_RESULT" "$COMPATIBILITY_RESULT"
          test "$SOURCE_RESULT" = success
          test "$REFERENCE_RESULT" = success
          test "$COMPATIBILITY_RESULT" = success
          echo PASS_HEPTA_INFERENCE_INF0C_HISTORICAL_SOURCE_AND_RUST_QUALIFICATION_ONLY
          echo real_provider_executed=false
          echo real_native_model_executed=false
          echo operator_accepted=false
          echo promoted=false
          echo released=false
