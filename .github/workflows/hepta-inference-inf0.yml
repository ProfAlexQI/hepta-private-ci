name: Hepta inference INF-0 qualification

on:
  pull_request:
    paths:
      - "docs/hepta-vnext/inference/**"
      - "tools/hepta-inference-inf0/**"
      - "scripts/hepta-inference-inf0-source-gate.py"
      - "scripts/hepta-inference-inf0c-real-e2e.py"
      - "codex-rs/lmstudio/**"
      - "codex-rs/ollama/**"
      - "codex-rs/utils/oss/**"
      - "codex-rs/responses-api-proxy/**"
      - ".github/workflows/hepta-inference-inf0.yml"
  workflow_dispatch:
    inputs:
      run_real_software_e2e:
        description: "Run against pre-provisioned loopback Ollama and LM Studio services"
        required: false
        default: false
        type: boolean
      ollama_model:
        description: "Exact pre-installed Ollama model ID"
        required: false
        type: string
      lmstudio_model:
        description: "Exact pre-installed LM Studio model ID"
        required: false
        type: string

permissions:
  contents: read

jobs:
  source-contract:
    name: Source and authority contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Verify Python sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/hepta-inference-inf0-source-gate.py \
            scripts/hepta-inference-inf0c-real-e2e.py

      - name: Verify source-bound INF-0C contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-inference-inf0-source-gate.py \
            | tee "$RUNNER_TEMP/hepta-inference-inf0c-source.txt"

      - name: Record qualification-only source posture
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Hepta inference INF-0C source posture"
            echo
            echo "- receipt commit: $(git rev-parse HEAD)"
            echo "- receipt tree: $(git rev-parse 'HEAD^{tree}')"
            echo "- source candidate: $(git rev-parse HEAD^)"
            echo "- source tree: $(git show -s --format=%T HEAD^)"
            echo "- qualification_only: true"
            echo "- source_complete: true"
            echo "- real_software_e2e_executed: false"
            echo "- qualified: false"
            echo "- production_authority: false"
            echo "- model_npu: false"
            echo "- remote_inference: false"
            echo "- promotion: false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-inf0c-source
          path: ${{ runner.temp }}/hepta-inference-inf0c-source.txt
          if-no-files-found: warn

  reference-contract:
    name: Reference contracts
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Format standalone reference crate
        shell: bash
        run: cargo fmt --manifest-path tools/hepta-inference-inf0/Cargo.toml -- --check

      - name: Test standalone reference crate
        shell: bash
        run: cargo test --manifest-path tools/hepta-inference-inf0/Cargo.toml --locked

      - name: Strict Clippy for standalone reference crate
        shell: bash
        run: |
          cargo clippy --manifest-path tools/hepta-inference-inf0/Cargo.toml \
            --all-targets --locked -- -D warnings

  compatibility-readiness:
    name: Compatibility readiness hardening
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Format included inference source fragments
        shell: bash
        run: |
          rustfmt --edition 2024 --check \
            ollama/src/client.rs \
            ollama/src/client_*.inc.rs \
            lmstudio/src/client.rs \
            lmstudio/src/client_*.inc.rs

      - name: Workspace formatting
        shell: bash
        run: cargo fmt --all -- --check

      - name: Compile readiness and privacy adapters
        shell: bash
        run: |
          cargo check --locked \
            -p codex-lmstudio \
            -p codex-ollama \
            -p codex-utils-oss \
            -p codex-responses-api-proxy

      - name: Test readiness and privacy adapters
        shell: bash
        run: |
          cargo test --locked \
            -p codex-lmstudio \
            -p codex-ollama \
            -p codex-utils-oss \
            -p codex-responses-api-proxy

      - name: Strict readiness and privacy Clippy
        shell: bash
        run: |
          cargo clippy --locked --all-targets \
            -p codex-lmstudio \
            -p codex-ollama \
            -p codex-utils-oss \
            -p codex-responses-api-proxy \
            -- -D warnings

  real-software-e2e:
    name: Real software E2E on pre-provisioned runner
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_real_software_e2e }}
    needs: source-contract
    runs-on: [self-hosted, hepta-inference-e2e]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Require exact pre-installed model IDs
        shell: bash
        env:
          OLLAMA_MODEL: ${{ inputs.ollama_model }}
          LMSTUDIO_MODEL: ${{ inputs.lmstudio_model }}
        run: |
          set -euo pipefail
          test -n "$OLLAMA_MODEL"
          test -n "$LMSTUDIO_MODEL"

      - name: Execute loopback-only no-download smoke
        shell: bash
        env:
          OLLAMA_MODEL: ${{ inputs.ollama_model }}
          LMSTUDIO_MODEL: ${{ inputs.lmstudio_model }}
        run: |
          set -euo pipefail
          python3 scripts/hepta-inference-inf0c-real-e2e.py \
            --execute \
            --ollama-model "$OLLAMA_MODEL" \
            --lmstudio-model "$LMSTUDIO_MODEL" \
            --receipt "$RUNNER_TEMP/hepta-inference-inf0c-real-e2e.json"

      - name: Upload real-software receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-inf0c-real-e2e
          path: ${{ runner.temp }}/hepta-inference-inf0c-real-e2e.json
          if-no-files-found: error

  qualification-summary:
    name: Qualification-only aggregate
    if: always()
    needs:
      - source-contract
      - reference-contract
      - compatibility-readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce aggregate result
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.source-contract.result }}
          REFERENCE_RESULT: ${{ needs.reference-contract.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility-readiness.result }}
        run: |
          set -euo pipefail
          printf 'source=%s\nreference=%s\ncompatibility=%s\n' \
            "$SOURCE_RESULT" "$REFERENCE_RESULT" "$COMPATIBILITY_RESULT"
          test "$SOURCE_RESULT" = success
          test "$REFERENCE_RESULT" = success
          test "$COMPATIBILITY_RESULT" = success
          echo "PASS_HEPTA_INFERENCE_INF0C_SOURCE_AND_RUST_QUALIFICATION_ONLY"
