name: Hepta Intelligence A0 + Q0.8 macOS exact diagnostic

on:
  push:
    branches:
      - "diagnostic/hepta-intelligence-a0-q0-8-macos-20260830"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-intelligence-a0-q0-8-macos-${{ github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_REPOSITORY: ProfHepta/hepta-private-ci
  EXPECTED_HEAD_SHA: e4e6a05c5e44b66a211dcc31435eb6021d69499b
  EXPECTED_TREE_SHA: 142f4517284d1b2ba822bfdbff461c3ebecaef6b
  A0_SOURCE_HEAD: 73a636867dbebc2dd4bdf957c9c6ff3eb0ea9358
  Q0_8_SECOND_PARENT: 5c69de275a18ff319d9453b781ef9442ddc5dce8

jobs:
  macos-exact-diagnostic:
    name: Exact e4e6a05 macOS Rust gates
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout exact integration candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact identity and dependency contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE_SHA"
          read -r first_parent second_parent extra <<< "$(git show -s --format=%P HEAD)"
          test "$first_parent" = "$A0_SOURCE_HEAD"
          test "$second_parent" = "$Q0_8_SECOND_PARENT"
          test -z "${extra:-}"

          automation=codex-rs/hepta-automation/Cargo.toml
          contracts=codex-rs/hepta-contracts/Cargo.toml
          fleet=codex-rs/hepta-fleet/Cargo.toml
          grep -Fqx 'sha2 = { workspace = true }' "$automation"
          grep -Fqx 'pretty_assertions = { workspace = true }' "$contracts"
          grep -Fqx 'pretty_assertions = { workspace = true }' "$fleet"
          for manifest in "$automation" "$contracts" "$fleet"; do
            ! grep -Fq '[package.metadata.cargo-shear]' "$manifest"
          done
          grep -Fqx 'use sha2::Digest;' codex-rs/hepta-automation/src/taskflow.rs
          grep -Fqx 'use sha2::Sha256;' codex-rs/hepta-automation/src/taskflow.rs
          grep -Fqx 'use pretty_assertions::assert_eq;' \
            codex-rs/hepta-contracts/src/agent_id_tests.rs
          grep -Fqx 'use pretty_assertions::assert_eq;' \
            codex-rs/hepta-fleet/src/registry_tests.rs

          mkdir -p "$RUNNER_TEMP/hepta-intelligence-a0-q0-8-macos"
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "parents=$(git show -s --format=%P HEAD)"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
          } > "$RUNNER_TEMP/hepta-intelligence-a0-q0-8-macos/identity.txt"

      - name: Set up repository CI tools
        uses: ./.github/actions/setup-ci

      - name: Install Rust 1.95 with fmt and Clippy
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Install cargo-shear 1.11.2
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-shear@1.11.2

      - name: Repository and canonical Rust format gates
        shell: bash
        run: |
          set -euo pipefail
          just fmt-check
          cd codex-rs
          cargo fmt -- --config imports_granularity=Item --check

      - name: Cargo shear and workspace membership gates
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo shear --deny-warnings
          cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert any(p["name"] == "codex-hepta-matrixd" for p in d["packages"])'

      - name: Compile every Q0.3 affected package and all test targets
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            codex-queue-extension
            codex-hepta-agent-protocol
            codex-hepta-agentd
            codex-hepta-automation
            codex-hepta-contracts
            codex-hepta-fleet
            codex-hepta-matrix-sdk
            codex-hepta-matrix-store
            codex-hepta-paths
          )
          cargo_args=()
          for package in "${packages[@]}"; do
            cargo_args+=(--package "$package")
          done
          cargo check --all-targets --locked "${cargo_args[@]}"
          cargo test --all-targets --locked --no-run "${cargo_args[@]}"

      - name: Run repaired package tests and strict Clippy
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            codex-hepta-automation
            codex-hepta-contracts
            codex-hepta-fleet
            codex-uds
          )
          for package in "${packages[@]}"; do
            cargo test -p "$package" --all-targets --locked
            cargo clippy -p "$package" --all-targets --locked -- -D warnings
          done

      - name: Verify clean worktree and record negative authority
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=normal --ignore-submodules=none)"
          {
            echo "completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "job_status=${{ job.status }}"
            echo "source_writeback=false"
            echo "a0_candidate_qualified=false"
            echo "selected=false"
            echo "runtime_authority=false"
            echo "production_authority=false"
          } > "$RUNNER_TEMP/hepta-intelligence-a0-q0-8-macos/outcome.txt"

      - name: Upload macOS diagnostic evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4
        with:
          name: hepta-intelligence-a0-q0-8-macos-e4e6a05-${{ github.run_id }}
          path: ${{ runner.temp }}/hepta-intelligence-a0-q0-8-macos/**
          if-no-files-found: error
          retention-days: 30
