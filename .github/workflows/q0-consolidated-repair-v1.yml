name: Q0 consolidated source and hosted-runner repair v1

on:
  push:
    branches:
      - codex/q0-consolidated-repair-v1-20260829
    paths:
      - .github/workflows/q0-consolidated-repair-v1.yml

permissions:
  contents: write

concurrency:
  group: q0-consolidated-repair-v1
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TARGET_BRANCH: codex/hepta-intelligence-plan-v3-20260828
      EXPECTED_TARGET: 8208b24a68a63ef7bb1dd1683f7573045ead616a
    steps:
      - name: Checkout exact Q0 target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 2

      - name: Assert exact target and restore manifest coverage
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ProfHepta/hepta-private-ci"
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/verify_cargo_workspace_manifests.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def cargo_manifests() -> list[Path]:\n')
          end = text.index('\ndef manifests_to_verify() -> list[Path]:\n', start)
          old = text[start:end]
          if 'workspace_manifest = load_manifest' not in old:
              raise SystemExit('manifest scanner input drifted')
          new = '''def cargo_manifests() -> list[Path]:
              return sorted(
                  path
                  for path in CARGO_RS_ROOT.rglob("Cargo.toml")
                  if path != CARGO_RS_ROOT / "Cargo.toml"
                  and "third_party" not in path.relative_to(CARGO_RS_ROOT).parts
              )
          '''
          path.write_text(text[:start] + new + text[end:], encoding='utf-8')
          PY
          python3 -m py_compile .github/scripts/verify_cargo_workspace_manifests.py
          python3 .github/scripts/verify_cargo_workspace_manifests.py
          git diff --check

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply canonical workspace formatting
        shell: bash
        run: |
          set -euo pipefail
          (cd codex-rs && cargo fmt --all)
          (cd codex-rs && cargo fmt --all -- --check)
          git diff --check

      - name: Move every Bazel Windows lane to hosted Windows 2025
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/bazel.yml')
          text = path.read_text(encoding='utf-8')

          standalone = (
              '    runs-on:\n'
              '      group: ${{ github.event.repository.name }}-runners\n'
              '      labels: ${{ github.event.repository.name }}-windows-x64\n'
          )
          if text.count(standalone) != 2:
              raise SystemExit(
                  f'expected 2 standalone private Windows bindings, got {text.count(standalone)}'
              )
          text = text.replace(standalone, '    runs-on: windows-2025\n', 2)

          matrix = (
              '          - os: windows-latest\n'
              '            target: x86_64-pc-windows-gnullvm\n'
              '            runs_on:\n'
              '              group: ${{ github.event.repository.name }}-runners\n'
              '              labels: ${{ github.event.repository.name }}-windows-x64\n'
          )
          if text.count(matrix) != 2:
              raise SystemExit(
                  f'expected 2 matrix private Windows bindings, got {text.count(matrix)}'
              )
          text = text.replace(
              matrix,
              '          - os: windows-2025\n'
              '            target: x86_64-pc-windows-gnullvm\n',
              2,
          )

          dynamic = '    runs-on: ${{ matrix.runs_on || matrix.os }}\n'
          if text.count(dynamic) != 2:
              raise SystemExit(
                  f'expected 2 dynamic runs_on expressions, got {text.count(dynamic)}'
              )
          text = text.replace(dynamic, '    runs-on: ${{ matrix.os }}\n', 2)

          checkout = (
              '    steps:\n'
              '      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2\n'
          )
          if text.count(checkout) != 5:
              raise SystemExit(
                  f'expected 5 Bazel checkout anchors, got {text.count(checkout)}'
              )
          guarded = (
              '    steps:\n'
              '      - name: Enable long paths on hosted Windows\n'
              "        if: runner.os == 'Windows'\n"
              '        shell: pwsh\n'
              '        run: git config --global core.longpaths true\n'
              '\n'
              '      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2\n'
          )
          text = text.replace(checkout, guarded, 5)

          forbidden = (
              '${{ github.event.repository.name }}-runners',
              '${{ github.event.repository.name }}-windows-x64',
              'runs_on:',
              'matrix.runs_on',
          )
          remaining = [marker for marker in forbidden if marker in text]
          if remaining:
              raise SystemExit(f'private Windows runner bindings remain: {remaining}')
          if text.count('runs-on: windows-2025') != 2:
              raise SystemExit('standalone hosted Windows job count drifted')
          if text.count('- os: windows-2025') != 2:
              raise SystemExit('matrix hosted Windows lane count drifted')
          if text.count('Enable long paths on hosted Windows') != 5:
              raise SystemExit('pre-checkout long-path guards are incomplete')

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Retire stale carrier and validate governed delta
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hepta-q0-format-deny-diagnostic.yml
          rm -rf .github/scripts/__pycache__
          python3 .github/scripts/verify_cargo_workspace_manifests.py
          (cd codex-rs && cargo fmt --all -- --check)
          git diff --check
          python3 - <<'PY'
          import subprocess

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines()
          if len(changed) < 4:
              raise SystemExit(f'consolidated Q0 delta is incomplete: {changed}')
          exact = {
              '.github/scripts/verify_cargo_workspace_manifests.py',
              '.github/workflows/bazel.yml',
              '.github/workflows/hepta-q0-format-deny-diagnostic.yml',
          }
          unexpected = [
              path
              for path in changed
              if path not in exact
              and not (path.startswith('codex-rs/') and path.endswith('.rs'))
          ]
          if unexpected:
              raise SystemExit(f'unexpected consolidated Q0 paths: {unexpected}')
          print(f'Q0_CONSOLIDATED_CHANGED_FILES={len(changed)}')
          PY

      - name: Commit and publish exact repair
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_TARGET"
          git config user.name "Qian QI"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit --no-gpg-sign -m "fix(ci): consolidate Q0 format, manifest, and hosted Windows gates"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_TARGET}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
