name: Hepta UI ARM Remaining Blocker Remediation

on:
  push:
    branches: [maintenance/hepta-ui-v4-remediate-arm-20260829]
    paths: [.github/workflows/hepta-ui-v4-arm-remediation.yml]

permissions:
  contents: write

concurrency:
  group: hepta-ui-v4-arm-remediation
  cancel-in-progress: false

jobs:
  remediate:
    name: Remediate UI candidate on isolated ARM runner
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      TARGET_BRANCH: codex/ui-v4-executable-final-gap-closure-v3-20260829
      EXPECTED_TARGET_SHA: 42cdcce0f84fe71ec6617d626233acc8be5fa524
    steps:
      - name: Checkout exact target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"

      - name: Install Rust 1.95 rustfmt
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply bounded remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_toolchain(path: str) -> None:
              p = Path(path)
              text = p.read_text()
              p.write_text(text.replace('toolchain: 1.88.0', 'toolchain: 1.95.0'))

          def add_longpaths(path: str) -> None:
              p = Path(path)
              text = p.read_text()
              if 'Enable Windows long paths before checkout' in text:
                  return
              pattern = re.compile(r'(?m)^(?P<i>\s*)- (?:(?P<n>name: Checkout exact candidate)\n(?P=i)  )?uses: actions/checkout@v4\n')
              def repl(m: re.Match[str]) -> str:
                  i = m.group('i')
                  original = m.group(0)
                  return (f"{i}- name: Enable Windows long paths before checkout\n"
                          f"{i}  if: runner.os == 'Windows'\n"
                          f"{i}  shell: pwsh\n"
                          f"{i}  run: git config --global core.longpaths true\n" + original)
              updated, count = pattern.subn(repl, text)
              if count == 0:
                  raise SystemExit(f'no checkout anchor in {path}')
              p.write_text(updated)

          def harden_rust_served() -> None:
              p = Path('.github/workflows/hepta-ui-v4-rust-served.yml')
              text = p.read_text()
              if 'HEPTA_CANDIDATE_SHA:' not in text:
                  anchor = 'permissions:\n  contents: read\n'
                  if anchor not in text:
                      raise SystemExit('rust-served permissions anchor missing')
                  text = text.replace(anchor, anchor + '\nenv:\n  HEPTA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}\n', 1)
              pattern = re.compile(r'(?m)^(?P<i>\s*)- name: Checkout candidate\n(?P=i)  uses: actions/checkout@v4\n')
              def repl(m: re.Match[str]) -> str:
                  i = m.group('i')
                  return (f"{i}- name: Enable Windows long paths before checkout\n"
                          f"{i}  if: runner.os == 'Windows'\n"
                          f"{i}  shell: pwsh\n"
                          f"{i}  run: git config --global core.longpaths true\n"
                          f"{i}- name: Checkout exact candidate\n"
                          f"{i}  uses: actions/checkout@v4\n"
                          f"{i}  with:\n"
                          f"{i}    ref: ${{{{ env.HEPTA_CANDIDATE_SHA }}}}\n"
                          f"{i}    fetch-depth: 1\n"
                          f"{i}    persist-credentials: false\n"
                          f"{i}- name: Verify exact checkout\n"
                          f"{i}  shell: bash\n"
                          f"{i}  run: |\n"
                          f"{i}    set -euo pipefail\n"
                          f"{i}    test \"$(git rev-parse HEAD)\" = \"$HEPTA_CANDIDATE_SHA\"\n")
              text, count = pattern.subn(repl, text)
              if count == 0 and 'Checkout candidate' in text:
                  raise SystemExit('rust-served checkout replacement failed')
              text = text.replace('toolchain: 1.88.0', 'toolchain: 1.95.0')
              text = text.replace('${{ github.sha }}', '${{ env.HEPTA_CANDIDATE_SHA }}')
              p.write_text(text)

          add_longpaths('.github/workflows/hepta-ui-v4-final-gap-closure-v3.yml')
          for path in [
              '.github/workflows/hepta-ui-v4-global-platform-source-closure.yml',
              '.github/workflows/hepta-ui-v4-windows-product-host-safety-device-closure.yml',
          ]:
              replace_toolchain(path)
              add_longpaths(path)
          harden_rust_served()
          PY

          cargo fmt --manifest-path apps/hepta-native/Cargo.toml
          cargo fmt --manifest-path tools/hepta-ui-global-platform-source-closure/Cargo.toml
          cargo fmt --manifest-path tools/hepta-ui-windows-product-host-safety/Cargo.toml
          cargo fmt --manifest-path tools/hepta-ui-windows-product-host-device-drill/Cargo.toml

          git rm -f -- .github/workflows/hepta-ui-v4-remaining-remediation.yml .github/workflows/hepta-ui-v4-rustfmt-remediation.yml

          python3 <<'PY'
          import re, subprocess
          allowed = [
              r'^apps/hepta-native/.+\.rs$',
              r'^tools/hepta-ui-global-platform-source-closure/.+\.rs$',
              r'^tools/hepta-ui-windows-product-host-safety/.+\.rs$',
              r'^tools/hepta-ui-windows-product-host-device-drill/.+\.rs$',
              r'^\.github/workflows/hepta-ui-v4-(?:final-gap-closure-v3|global-platform-source-closure|windows-product-host-safety-device-closure|rust-served|rustfmt-remediation|remaining-remediation)\.yml$',
          ]
          changed = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          unexpected = [p for p in changed if not any(re.match(rule,p) for rule in allowed)]
          if unexpected or not changed:
              raise SystemExit(f'unexpected={unexpected}, changed={len(changed)}')
          PY

          ruby -e 'require "yaml"; ARGV.each { |p| YAML.parse_file(p) }' \
            .github/workflows/hepta-ui-v4-final-gap-closure-v3.yml \
            .github/workflows/hepta-ui-v4-global-platform-source-closure.yml \
            .github/workflows/hepta-ui-v4-windows-product-host-safety-device-closure.yml \
            .github/workflows/hepta-ui-v4-rust-served.yml
          git diff --check
          cargo fmt --manifest-path apps/hepta-native/Cargo.toml -- --check
          cargo fmt --manifest-path tools/hepta-ui-global-platform-source-closure/Cargo.toml -- --check
          cargo fmt --manifest-path tools/hepta-ui-windows-product-host-safety/Cargo.toml -- --check
          cargo fmt --manifest-path tools/hepta-ui-windows-product-host-device-drill/Cargo.toml -- --check

          git config user.name hepta-ci
          git config user.email hepta-ci@users.noreply.github.com
          git add -A
          git commit -m 'fix(ui): close executable formatting and workflow blockers'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
