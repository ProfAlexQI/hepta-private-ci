name: Hepta V4 source materializer (temporary)

on:
  push:
    branches:
      - "codex/hepta-architecture-v4-p0-7a-closure-20260830"
    paths:
      - ".github/workflows/hepta-architecture-v4-source-materialize.yml"

permissions:
  contents: write

concurrency:
  group: hepta-v4-source-materializer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'ProfHepta/hepta-private-ci' &&
      github.ref == 'refs/heads/codex/hepta-architecture-v4-p0-7a-closure-20260830'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact package branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/hepta-architecture-v4-p0-7a-closure-20260830
          persist-credentials: true
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = "codex/hepta-architecture-v4-p0-7a-closure-20260830"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Materialize Cargo lock, stable Rust format, and Bazel lock
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path codex-rs/Cargo.toml --format-version 1 >/dev/null
          (
            cd codex-rs
            cargo fmt --all
          )
          just bazel-lock-update
          rm .github/workflows/hepta-architecture-v4-source-materialize.yml

      - name: Reject scope escape and verify generated state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          allowed_exact = {
              "MODULE.bazel.lock",
              "codex-rs/Cargo.lock",
              ".github/workflows/hepta-architecture-v4-source-materialize.yml",
          }
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "-z"], text=False
          ).decode().split("\0")
          unexpected = [
              path
              for path in changed
              if path
              and path not in allowed_exact
              and not (path.startswith("codex-rs/") and path.endswith(".rs"))
          ]
          if unexpected:
              raise SystemExit("unexpected materializer paths: " + ", ".join(unexpected))
          untracked = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard", "-z"], text=False
          ).decode().split("\0")
          untracked = [path for path in untracked if path]
          if untracked:
              raise SystemExit("unexpected untracked paths: " + ", ".join(untracked))
          if not changed:
              raise SystemExit("materializer produced no tracked changes")
          PY
          git diff --check
          cargo metadata --locked --manifest-path codex-rs/Cargo.toml --no-deps --format-version 1 >/dev/null
          (
            cd codex-rs
            cargo fmt --all -- --check
          )
          just bazel-lock-check

      - name: Commit canonical generated state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --check
          git commit -m "chore(hepta): materialize P0.7a lock and format state"
          git push origin HEAD:refs/heads/codex/hepta-architecture-v4-p0-7a-closure-20260830