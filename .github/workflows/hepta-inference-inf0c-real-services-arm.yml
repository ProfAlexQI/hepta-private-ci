name: Hepta inference INF-0C real services ARM qualification v3

on:
  push:
    branches:
      - codex/hepta-inference-inf0c-real-services-arm-20260828
    paths:
      - ".github/workflows/hepta-inference-inf0c-real-services-arm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-inference-inf0c-real-services-arm
  cancel-in-progress: false

jobs:
  real-services:
    name: Provision fixed local services and execute all INF-0C evidence
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      CANDIDATE: 93bdd3245c2f3d0685ceae8e2ce1267c40a63685
      PREVIOUS_WORKFLOW_HEAD: 5c4cf0a84698a62d11579a468579cb3d2e39ff10
      CANCEL_BRANCH: codex/hepta-inference-inf0c-cancel-capability-v3-20260828
      CANCEL_SOURCE: cf8b448c4d09d1677519a674126fb7dc61452414
      CANCEL_RECEIPT: 6109b43cd303253d84c9ef0a16ae4592d9e96cd0
      SELF: .github/workflows/hepta-inference-inf0c-real-services-arm.yml
      OLLAMA_MODEL: granite4:1b
      LMSTUDIO_MODEL: ibm/granite-4-micro
      LMSTUDIO_DOWNLOAD: ibm/granite-4-micro@q4_k_m
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_CONTEXT_LENGTH: "2048"
      CI: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify isolated repair commit and detach exact protocol receipt head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only HEAD^ HEAD)" = "$SELF"
          test "$(git rev-parse HEAD^)" = "$PREVIOUS_WORKFLOW_HEAD"
          test "$(git rev-parse "$PREVIOUS_WORKFLOW_HEAD^")" = "8863b5f587ec255ea28519d8e0807ce9bdda4b46"
          test "$(git rev-parse "$CANDIDATE")" = "$CANDIDATE"
          test "$(git rev-parse "$CANDIDATE^")" = "7f29597d5ebc080320f62cb92d4c21bd6b5a008a"
          test "$(git rev-parse "$CANDIDATE^{tree}")" = "13bb618e3e017475a23a1585a3b690895f34d647"
          test "$(git diff --name-only "$CANDIDATE^" "$CANDIDATE")" =             "docs/hepta-vnext/inference/HEPTA_INFERENCE_INF0C_SOURCE_RECEIPT_2026-08-28.json"
          git checkout --detach "$CANDIDATE"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test -z "$(git status --porcelain)"

      - name: Materialize exact cancellation capability probe source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/heads/$CANCEL_BRANCH:refs/remotes/origin/hepta-inf0c-cancel-v3"
          test "$(git rev-parse refs/remotes/origin/hepta-inf0c-cancel-v3)" = "$CANCEL_RECEIPT"
          test "$(git rev-parse "$CANCEL_RECEIPT^")" = "$CANCEL_SOURCE"
          cancel_dir="$RUNNER_TEMP/hepta-inf0c-cancel-v3"
          install -d -m 700 "$cancel_dir"
          git show "$CANCEL_SOURCE:scripts/hepta-inference-inf0c-cancel-capability-v3.py" \
            > "$cancel_dir/hepta-inference-inf0c-cancel-capability-v3.py"
          cp scripts/hepta-inference-inf0c-real-e2e.py \
            "$cancel_dir/hepta-inference-inf0c-real-e2e.py"
          chmod 500 "$cancel_dir"/*.py
          python3 -m py_compile "$cancel_dir"/*.py
          sha256sum "$cancel_dir"/*.py \
            > "$RUNNER_TEMP/hepta-inf0c-cancel-v3-source-sha256.txt"

      - name: Prepare private qualification directories
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 \
            "$RUNNER_TEMP/hepta-inf0c" \
            "$HOME/.hepta-qualification" \
            "$HOME/.hepta-qualification/control"
          echo "$HOME/.lmstudio/bin" >> "$GITHUB_PATH"

      - name: Fetch and execute official installers with captured provenance
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://ollama.com/install.sh \
            -o "$RUNNER_TEMP/hepta-inf0c/ollama-install.sh"
          curl --proto '=https' --tlsv1.2 -fsSL https://lmstudio.ai/install.sh \
            -o "$RUNNER_TEMP/hepta-inf0c/lmstudio-install.sh"
          chmod 500 \
            "$RUNNER_TEMP/hepta-inf0c/ollama-install.sh" \
            "$RUNNER_TEMP/hepta-inference-inf0c/lmstudio-install.sh"
          sha256sum \
            "$RUNNER_TEMP/hepta-inf0c/ollama-install.sh" \
            "$RUNNER_TEMP/hepta-inference-inf0c/lmstudio-install.sh" \
            > "$RUNNER_TEMP/hepta-inf0c/installer-sha256.txt"
          sh "$RUNNER_TEMP/hepta-inf0c/ollama-install.sh"
          bash "$RUNNER_TEMP/hepta-inf0c/lmstudio-install.sh"
          command -v ollama
          test -x "$HOME/.lmstudio/bin/lms"
          lms_cli="$(realpath "$HOME/.lmstudio/bin/lms")"
          test -f "$lms_cli"
          test -x "$lms_cli"
          echo "LMS_CLI=$lms_cli" >> "$GITHUB_ENV"
          ollama --version | tee "$RUNNER_TEMP/hepta-inf0c/ollama-version.txt"
          "$lms_cli" --version | tee "$RUNNER_TEMP/hepta-inf0c/lms-version.txt"
          sha256sum "$lms_cli" > "$RUNNER_TEMP/hepta-inference-inf0c/lms-cli-sha256-before-daemon.txt"

      - name: Start loopback Ollama and explicitly provision fixed model
        shell: bash
        run: |
          set -euo pipefail
          nohup env OLLAMA_HOST="$OLLAMA_HOST" OLLAMA_CONTEXT_LENGTH="$OLLAMA_CONTEXT_LENGTH" \
            "$(command -v ollama)" serve \
            >"$RUNNER_TEMP/hepta-inf0c/ollama-service.log" 2>&1 &
          echo $! > "$HOME/.hepta-qualification/ollama.pid"
          for attempt in $(seq 1 120); do
            if curl --noproxy '*' -fsS http://127.0.0.1:11434/api/version >/dev/null; then
              break
            fi
            test "$attempt" -lt 120
            sleep 1
          done
          ollama pull "$OLLAMA_MODEL"
          curl --noproxy '*' -fsS http://127.0.0.1:11434/api/tags \
            > "$RUNNER_TEMP/hepta-inference-inf0c/ollama-inventory.json"

      - name: Start llmster and explicitly provision fixed LM Studio model
        shell: bash
        run: |
          set -euo pipefail
          test -x "$LMS_CLI"

          run_lms() {
            local limit="$1"
            shift
            local error_file="$RUNNER_TEMP/hepta-inf0c/lms-command-error.txt"
            local status=0
            for attempt in $(seq 1 90); do
              : > "$error_file"
              set +e
              timeout "$limit" "$LMS_CLI" "$@" 2>"$error_file"
              status=$?
              set -e
              if [[ "$status" -eq 0 ]]; then
                rm -f "$error_file"
                return 0
              fi
              cat "$error_file" >&2
              if [[ "$status" -ne 126 ]] || ! grep -Fq "Text file busy" "$error_file"; then
                return "$status"
              fi
              sleep 1
            done
            return "$status"
          }

          run_lms 5m daemon up --json \
            | tee "$RUNNER_TEMP/hepta-inf0c/lmstudio-daemon.json"
          run_lms 5m daemon status --json \
            > "$RUNNER_TEMP/hepta-inference-inf0c/lmstudio-daemon-status.json"

          previous_digest=""
          stable_count=0
          for attempt in $(seq 1 60); do
            current_digest="$(sha256sum "$LMS_CLI" | awk '{print $1}')"
            if [[ "$current_digest" == "$previous_digest" ]]; then
              stable_count=$((stable_count + 1))
            else
              stable_count=0
            fi
            if [[ "$stable_count" -ge 2 ]]; then
              break
            fi
            previous_digest="$current_digest"
            test "$attempt" -lt 60
            sleep 1
          done
          printf 'sha256:%s\n' "$current_digest" \
            > "$RUNNER_TEMP/hepta-inference-inf0c/lms-cli-stable-sha256.txt"

          run_lms 45m get "$LMSTUDIO_DOWNLOAD" --gguf
          run_lms 5m ls --json \
            > "$RUNNER_TEMP/hepta-inference-inf0c/lmstudio-inventory.json"
          run_lms 20m load "$LMSTUDIO_MODEL" \
            --identifier "$LMSTUDIO_MODEL" \
            --context-length 2048 \
            --gpu 0.0
          run_lms 5m ps --json \
            > "$RUNNER_TEMP/hepta-inference-inf0c/lmstudio-loaded.json"
          run_lms 5m server start --port 1234 --bind 127.0.0.1
          run_lms 5m server status --json --quiet \
            > "$RUNNER_TEMP/hepta-inference-inf0c/lmstudio-server-status.json"
          python3 - "$RUNNER_TEMP/hepta-inf0c/lmstudio-server-status.json" <<'PY'
          import json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if value.get("running") is not True or value.get("port") != 1234:
              raise SystemExit(f"LM Studio server status mismatch: {value!r}")
          PY
          for attempt in $(seq 1 180); do
            if curl --noproxy '*' -fsS http://127.0.0.1:1234/v1/models >/dev/null; then
              break
            fi
            test "$attempt" -lt 180
            sleep 1
          done

      - name: Build digest-pinned fixed-argv service-control helper
        shell: bash
        run: |
          set -euo pipefail
          helper_dir="$HOME/.hepta-qualification/control"
          helper="$helper_dir/service-control"
          ollama_bin="$(command -v ollama)"
          lms_bin="$LMS_CLI"
          test -x "$lms_bin"
          cat > "$helper" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          action="\${1:-}"
          service="\${2:-}"
          state_dir="\$HOME/.hepta-qualification"
          case "\$action:\$service" in
            stop:ollama)
              if [[ -s "\$state_dir/ollama.pid" ]]; then
                pid="\${cat "\$state_dir/ollama.pid"}"
                kill "\$pid" 2>/dev/null || true
                for _ in \${seq 1 60}; do
                  kill -0 "\$pid" 2>/dev/null || break
                  sleep 0.25
                done
                rm -f "\$state_dir/ollama.pid"
              fi
              ;;
            start:ollama)
              nohup env OLLAMA_HOST=127.0.0.1:11434 OLLAMA_CONTEXT_LENGTH=2048 \
                "$ollama_bin" serve >/dev/null 2>&1 &
              echo \$! > "\$state_dir/ollama.pid"
              ;;
            stop:lmstudio)
              "$lms_bin" server stop >/dev/null 2>&1 || true
              "$lms_bin" unload --all >/dev/null 2>&1 || true
              "$lms_bin" daemon down >/dev/null 2>&1 || true
              ;;
            start:lmstudio)
              "$lms_bin" daemon up --json >/dev/null
              "$lms_bin" load ibm/granite-4-micro \
                --identifier ibm/granite-4-micro \
                --context-length 2048 \
                --gpu 0.0 >/dev/null
              "$lms_bin" server start --port 1234 --bind 127.0.0.1 >/dev/null
              ;;
            *) exit 64 ;;
          esac
          EOF
          chmod 700 "$helper"
          helper="$(realpath "$helper")"
          digest="$(sha256sum "$helper" | awk '{print $1}')"
          echo "HEPTA_INF0C_SERVICE_CONTROL_HELPER=$helper" >> "$GITHUB_ENV"
          echo "HEPTA_INF0C_SERVICE_CONTROL_HELPER_SHA256=sha256:$digest" >> "$GITHUB_ENV"
          printf 'sha256:%s\n' "$digest" \
            > "$RUNNER_TEMP/hepta-inference-inf0c/control-helper-sha256.txt"

      - name: Execute fixed-model semantic qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-inference-inf0c-real-e2e.py \
            --execute \
            --timeout-seconds 180 \
            --ollama-model "$OLLAMA_MODEL" \
            --lS
