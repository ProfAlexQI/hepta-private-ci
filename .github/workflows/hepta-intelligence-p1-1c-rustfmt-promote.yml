name: hepta-intelligence-p1-1c-rustfmt-promote

on:
  push:
    branches:
      - "qualification/hepta-intelligence-p1-1c-rustfmt-promote-20260828"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-intelligence-p1-1c-rustfmt-promote
  cancel-in-progress: false

env:
  SOURCE_BRANCH: codex/hepta-intelligence-offline-efficacy-p1c-20260828
  OUTPUT_BRANCH: qualification/hepta-intelligence-p1-1c-rustfmt-output-20260828
  WRAPPER_PATH: .github/workflows/hepta-intelligence-p1-1c-rustfmt-promote.yml
  CRATE_ROOT: codex-rs/hepta-memory-p1-1c-qualification
  MANIFEST_PATH: codex-rs/hepta-memory-p1-1c-qualification/Cargo.toml
  VERIFIER_PATH: scripts/verify-hepta-intelligence-p1-1c-offline-efficacy.py
  ARTIFACT_DIR: artifacts/hepta-intelligence-p1-1c-rustfmt-promotion
  CARGO_NET_OFFLINE: "true"

jobs:
  promote:
    name: P1.1c exact rustfmt promotion
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout promotion wrapper
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Audit source lease and formatting candidate
        id: candidate
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          wrapper_parent="$(git rev-parse HEAD^)"
          test "$(git rev-list --count "$wrapper_parent"..HEAD)" = "1"
          test "$(git diff --name-only "$wrapper_parent"..HEAD)" = "$WRAPPER_PATH"

          git fetch --no-tags origin \
            "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH" \
            "+refs/heads/$OUTPUT_BRANCH:refs/remotes/origin/$OUTPUT_BRANCH"
          source_sha="$(git rev-parse "refs/remotes/origin/$SOURCE_BRANCH")"
          output_sha="$(git rev-parse "refs/remotes/origin/$OUTPUT_BRANCH")"
          test "$wrapper_parent" = "$source_sha"
          test "$(git rev-parse "$output_sha^")" = "$source_sha"
          test "$(git rev-list --count "$source_sha".."$output_sha")" = "1"

          python3 - "$source_sha" "$output_sha" <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          source, output = sys.argv[1:]
          allowed = {
              "codex-rs/hepta-memory-p1-1c-qualification/src/bin/p1_1c_receipt.rs",
              "codex-rs/hepta-memory-p1-1c-qualification/src/corpus.rs",
              "codex-rs/hepta-memory-p1-1c-qualification/src/digest.rs",
              "codex-rs/hepta-memory-p1-1c-qualification/src/evaluation.rs",
              "codex-rs/hepta-memory-p1-1c-qualification/src/kg.rs",
              "codex-rs/hepta-memory-p1-1c-qualification/src/lib.rs",
              "codex-rs/hepta-memory-p1-1c-qualification/src/metrics.rs",
              "codex-rs/hepta-memory-p1-1c-qualification/src/reranker.rs",
              "codex-rs/hepta-memory-p1-1c-qualification/tests/p1_1c.rs",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", f"{source}..{output}"], text=True
              ).splitlines()
          )
          if not actual or not actual.issubset(allowed):
              raise SystemExit(
                  json.dumps(
                      {"allowed": sorted(allowed), "actual": sorted(actual)},
                      indent=2,
                      sort_keys=True,
                  )
              )
          receipt = {
              "schema": "hepta.intelligence.p1_1c.rustfmt_candidate_audit.v1",
              "source_commit": source,
              "candidate_commit": output,
              "single_parent": True,
              "single_commit": True,
              "formatting_only": True,
              "changed_paths": sorted(actual),
              "runtime_wired": False,
              "production_authority": False,
          }
          (Path(os.environ["ARTIFACT_DIR"]) / "candidate-audit.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "output_sha=$output_sha" >> "$GITHUB_OUTPUT"
          git checkout --detach "$output_sha"

      - name: Isolate Cargo outputs
        run: |
          set -euo pipefail
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/hepta-p1-1c-rustfmt-promote-target" >> "$GITHUB_ENV"
          rm -f "$CRATE_ROOT/Cargo.lock"
          rm -rf "$CRATE_ROOT/target"

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt,clippy

      - name: Run exact candidate gate matrix
        run: |
          set -o pipefail
          rustc --version | tee "$ARTIFACT_DIR/rustc-version.txt"
          cargo --version | tee "$ARTIFACT_DIR/cargo-version.txt"
          rustfmt --version | tee "$ARTIFACT_DIR/rustfmt-version.txt"
          cargo clippy --version | tee "$ARTIFACT_DIR/clippy-version.txt"
          test "$(rustc --version | awk '{print $2}')" = "1.95.0"
          python3 "$VERIFIER_PATH" 2>&1 | tee "$ARTIFACT_DIR/source-gate.json"
          cargo fmt --manifest-path "$MANIFEST_PATH" --all -- --check \
            2>&1 | tee "$ARTIFACT_DIR/rustfmt.log"
          cargo test --manifest-path "$MANIFEST_PATH" --all-targets -- --nocapture \
            2>&1 | tee "$ARTIFACT_DIR/tests.log"
          cargo check --manifest-path "$MANIFEST_PATH" --all-targets \
            2>&1 | tee "$ARTIFACT_DIR/check.log"
          cargo clippy --manifest-path "$MANIFEST_PATH" --all-targets -- -D warnings \
            2>&1 | tee "$ARTIFACT_DIR/clippy.log"
          python3 - <<'PY'
          import re
          from pathlib import Path

          log = Path("artifacts/hepta-intelligence-p1-1c-rustfmt-promotion/tests.log").read_text(
              encoding="utf-8", errors="replace"
          )
          passed = sum(
              int(value)
              for value in re.findall(r"test result: ok\. (\d+) passed", log)
          )
          if passed != 13:
              raise SystemExit(f"expected 13 P1.1c tests, observed {passed}")
          PY

      - name: Reproduce and validate machine receipt
        run: |
          set -euo pipefail
          cargo run --quiet --manifest-path "$MANIFEST_PATH" --bin p1_1c_receipt \
            > "$ARTIFACT_DIR/evaluation-receipt-a.json"
          cargo run --quiet --manifest-path "$MANIFEST_PATH" --bin p1_1c_receipt \
            > "$ARTIFACT_DIR/evaluation-receipt-b.json"
          cmp \
            "$ARTIFACT_DIR/evaluation-receipt-a.json" \
            "$ARTIFACT_DIR/evaluation-receipt-b.json"
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path("artifacts/hepta-intelligence-p1-1c-rustfmt-promotion/evaluation-receipt-a.json")
              .read_text(encoding="utf-8")
          )
          assert receipt["status"] == "PASS_P1_1C_SEED_PIPELINE"
          assert receipt["case_count"] == 8
          assert len(receipt["locales"]) == 8
          assert len(receipt["lanes"]) == 7
          for key in [
              "network_access",
              "model_download",
              "runtime_wired",
              "production_authority",
              "efficacy_validation",
              "efficacy_claim",
              "promotion",
          ]:
              assert receipt[key] is False, key
          PY

      - name: Verify clean candidate source
        run: |
          set -euo pipefail
          rm -f "$CRATE_ROOT/Cargo.lock"
          rm -rf "$CRATE_ROOT/target"
          git diff --exit-code -- \
            "$CRATE_ROOT" \
            "$VERIFIER_PATH" \
            plans/hepta-intelligence/P1-1C_EXECUTION_STATUS.json \
            plans/hepta-intelligence/P1-1C_MULTILINGUAL_OFFLINE_EFFICACY_PLAN.md
          test -z "$(git ls-files --others --exclude-standard -- "$CRATE_ROOT")"

      - name: Recheck source lease and fast-forward without force
        env:
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          OUTPUT_SHA: ${{ steps.candidate.outputs.output_sha }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$OUTPUT_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          git push origin "HEAD:refs/heads/$SOURCE_BRANCH"

      - name: Write promotion receipt
        env:
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          OUTPUT_SHA: ${{ steps.candidate.outputs.output_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "schema": "hepta.intelligence.p1_1c.rustfmt_promotion.v1",
              "status": "PASS_P1_1C_RUSTFMT_FAST_FORWARD",
              "source_commit": os.environ["SOURCE_SHA"],
              "promoted_commit": os.environ["OUTPUT_SHA"],
              "source_branch": os.environ["SOURCE_BRANCH"],
              "tests_passed": 13,
              "gates": {
                  "candidate_ancestry": "success",
                  "formatting_path_allowlist": "success",
                  "source_gate": "success",
                  "rustfmt": "success",
                  "tests": "success",
                  "check": "success",
                  "clippy": "success",
                  "receipt_reproducibility": "success",
                  "clean_tree": "success",
                  "source_lease": "success",
                  "non_force_fast_forward": "success",
              },
              "runner": {
                  "name": os.environ["RUNNER_NAME"],
                  "os": os.environ["RUNNER_OS"],
                  "arch": os.environ["RUNNER_ARCH"],
              },
              "workflow": {
                  "run_id": int(os.environ["RUN_ID"]),
                  "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              },
              "source_qualified": True,
              "qualified": False,
              "efficacy_validation": False,
              "runtime_wired": False,
              "production_authority": False,
              "promotion": False,
          }
          path = Path(os.environ["ARTIFACT_DIR"]) / "promotion-receipt.json"
          path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-intelligence-p1-1c-rustfmt-promotion-${{ github.sha }}
          path: artifacts/hepta-intelligence-p1-1c-rustfmt-promotion
          if-no-files-found: warn
          retention-days: 14
