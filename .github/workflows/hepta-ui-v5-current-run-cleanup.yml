name: Hepta UI v5 current-run cleanup

on:
  push:
    branches:
      - ops/ui-v5-current-run-cleanup-20260830
    paths:
      - .github/workflows/hepta-ui-v5-current-run-cleanup.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: hepta-ui-v5-current-run-cleanup
  cancel-in-progress: false

jobs:
  cancel-known-bad:
    if: github.repository == 'ProfHepta/hepta-private-ci'
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel exact superseded v21 and v22 runs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
          }
          $runIds = @(
              33284464945,
              33284541737,
              33284820654,
              33284903165
          )
          foreach ($runId in $runIds) {
              $runUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$runId"
              $run = Invoke-RestMethod -Headers $headers -Uri $runUri -Method Get
              if ([string]$run.status -eq 'completed') {
                  Write-Host "Run $runId already completed as $($run.conclusion)."
                  continue
              }
              Write-Host "Cancelling superseded run=$runId branch=$($run.head_branch) name=$($run.name)"
              $cancelUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$runId/cancel"
              try {
                  Invoke-RestMethod -Headers $headers -Uri $cancelUri -Method Post | Out-Null
              }
              catch {
                  $response = $_.Exception.Response
                  if ($null -ne $response -and [int]$response.StatusCode -eq 409) {
                      Write-Host "Run $runId reached a terminal state during cleanup."
                      continue
                  }
                  throw
              }
          }
          Write-Host 'Persistent current-v23 lane was not selected and remains active.'
