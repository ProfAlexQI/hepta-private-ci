name: hepta architecture merge candidate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  merge-candidate:
    name: Architecture merge candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      EVIDENCE_DIR: /tmp/hepta-architecture-merge-candidate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Bind merge-candidate identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "schema=hepta.architecture_convergence.merge_candidate.v1"
            echo "evidence_identity=merge_candidate"
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "source_head_claim=false"
            echo "runtime_authority=false"
            echo "production_writer=false"
            echo "external_effect=false"
            echo "promotion=false"
            echo "qualified=false"
          } > "$EVIDENCE_DIR/receipt.txt"

      - name: Verify architecture, callers, and CI identities
        run: |
          set -euo pipefail
          python3 scripts/verify-hepta-architecture-convergence.py \
            | tee "$EVIDENCE_DIR/source-verifier.json"
          python3 scripts/verify-hepta-effect-dispatch-callers.py \
            | tee "$EVIDENCE_DIR/effect-caller-verifier.json"
          python3 scripts/verify-hepta-architecture-ci-contract.py \
            | tee "$EVIDENCE_DIR/ci-identity-verifier.json"
          echo "source_verifier=passed" >> "$EVIDENCE_DIR/receipt.txt"
          echo "effect_caller_ratchet=passed" >> "$EVIDENCE_DIR/receipt.txt"
          echo "ci_identity_contract=passed" >> "$EVIDENCE_DIR/receipt.txt"

      - name: Package-scoped format gate
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt \
            --package codex-hepta-contracts \
            --package codex-hepta-memory \
            --package codex-hepta-agentd \
            -- --check
          echo "format=passed" >> "$EVIDENCE_DIR/receipt.txt"

      - name: Merge-candidate tests and compilation
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked \
            -p codex-hepta-contracts \
            -p codex-hepta-memory \
            -p codex-hepta-agentd \
            --lib -- --nocapture 2>&1 | tee "$EVIDENCE_DIR/tests.log"
          cargo check --locked --all-targets \
            -p codex-hepta-contracts \
            -p codex-hepta-memory \
            -p codex-hepta-agentd 2>&1 | tee "$EVIDENCE_DIR/check.log"
          cargo check --locked --all-targets --no-default-features \
            -p codex-hepta-agentd \
            --features qualification-cognitive-write 2>&1 \
            | tee "$EVIDENCE_DIR/qualification-check.log"
          echo "tests_and_check=passed" >> "$EVIDENCE_DIR/receipt.txt"

      - name: Strict merge-candidate Clippy
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets \
            -p codex-hepta-contracts \
            -p codex-hepta-memory \
            -p codex-hepta-agentd \
            -- -D warnings 2>&1 | tee "$EVIDENCE_DIR/clippy.log"
          cargo clippy --locked --all-targets --no-default-features \
            -p codex-hepta-agentd \
            --features qualification-cognitive-write \
            -- -D warnings 2>&1 | tee "$EVIDENCE_DIR/qualification-clippy.log"
          echo "clippy=passed" >> "$EVIDENCE_DIR/receipt.txt"

      - name: Seal merge-candidate result
        run: |
          set -euo pipefail
          sed -i 's/^qualified=false$/qualified=true/' "$EVIDENCE_DIR/receipt.txt"
          echo "result=PASS_ARCHITECTURE_MERGE_CANDIDATE" >> "$EVIDENCE_DIR/receipt.txt"
          cat "$EVIDENCE_DIR/receipt.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Record terminal job status
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          echo "job_status=${{ job.status }}" >> "$EVIDENCE_DIR/receipt.txt"
          find "$EVIDENCE_DIR" -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$EVIDENCE_DIR/SHA256SUMS"

      - name: Upload merge-candidate evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-architecture-merge-candidate-${{ github.sha }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
