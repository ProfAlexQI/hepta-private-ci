name: hepta Servo exact source acceptance live review v2

on:
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [integration/vnext-main-20260811]
    paths:
      - "docs/hepta-vnext/browser/source-acceptance/**"
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: hepta-servo-source-acceptance-live-v2-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  live-review:
    name: Source-only accepted pointer live review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Determine source-acceptance applicability
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" =~ ^pull_request(_review)?$ ]] && \
             [[ "$HEAD_REF" == review/hepta-servo-source-acceptance-* ]]; then
            echo "applicable=true" >> "$GITHUB_OUTPUT"
          else
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            echo '{"status":"PASS_NOT_APPLICABLE","trusted_base_verifier":true,"exact_servo_source_accepted":false,"build_authorized":false,"authority":"all_false"}'
          fi

      - name: Check out trusted base verifier
        if: steps.scope.outputs.applicable == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Fetch bounded PR-head files and live GitHub evidence
        if: steps.scope.outputs.applicable == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/hepta-source-acceptance-live-review-v2"
          mkdir -p "$evidence"
          chmod 700 "$evidence"
          echo "HEPTA_SOURCE_ACCEPTANCE_LIVE_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          python3 - "$evidence" <<'PY'
          import base64
          import json
          import os
          import pathlib
          import sys
          import urllib.parse
          import urllib.request

          output = pathlib.Path(sys.argv[1]).resolve(strict=True)
          api = os.environ["GITHUB_API_URL"].rstrip("/")
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          pr_number = int(os.environ["PR_NUMBER"])
          head_sha = os.environ["HEAD_SHA"]
          max_bytes = 64 * 1024 * 1024

          def request_json(url: str):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "hepta-source-acceptance-live-review-v2",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  value = json.load(response)
                  link = response.headers.get("Link")
              return value, link

          def write_new(name: str, raw: bytes) -> pathlib.Path:
              if not raw or len(raw) > max_bytes:
                  raise SystemExit(f"{name} is empty or exceeds the byte bound")
              path = output / name
              descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(descriptor, "wb") as handle:
                  handle.write(raw)
                  handle.flush()
                  os.fsync(handle.fileno())
              return path

          def fetch_head_file(relative: str, local_name: str) -> pathlib.Path:
              pure = pathlib.PurePosixPath(relative)
              if pure.is_absolute() or any(part in {"", ".", ".."} for part in pure.parts):
                  raise SystemExit(f"unsafe PR-head path: {relative}")
              encoded = urllib.parse.quote(relative, safe="/")
              query = urllib.parse.urlencode({"ref": head_sha})
              value, _ = request_json(
                  f"{api}/repos/{repository}/contents/{encoded}?{query}"
              )
              if not isinstance(value, dict) or value.get("type") != "file":
                  raise SystemExit(f"PR-head object is not a file: {relative}")
              if value.get("encoding") != "base64" or not isinstance(value.get("content"), str):
                  raise SystemExit(f"PR-head file is not inline base64: {relative}")
              raw = base64.b64decode(value["content"], validate=True)
              if value.get("size") != len(raw):
                  raise SystemExit(f"PR-head file size drifted: {relative}")
              return write_new(local_name, raw)

          def paginated(path: str):
              url = f"{api}/repos/{repository}/{path}"
              items = []
              while url:
                  page, link = request_json(url)
                  if not isinstance(page, list):
                      raise SystemExit(f"expected list from {url}")
                  items.extend(page)
                  next_url = None
                  if link:
                      for part in link.split(","):
                          sections = [item.strip() for item in part.split(";")]
                          if len(sections) == 2 and sections[1] == 'rel="next"':
                              next_url = sections[0][1:-1]
                  url = next_url
              return items

          pointer_relative = (
              "docs/hepta-vnext/browser/source-acceptance/ACCEPTED_SOURCE_POINTER.json"
          )
          pointer_path = fetch_head_file(pointer_relative, "accepted-source-pointer.json")
          pointer = json.loads(pointer_path.read_text(encoding="utf-8"))
          candidate_relative = pointer.get("candidate", {}).get("snapshot_path")
          challenge_relative = pointer.get("challenge", {}).get("snapshot_path")
          candidate_prefix = "docs/hepta-vnext/browser/source-acceptance/candidates/"
          challenge_prefix = "docs/hepta-vnext/browser/source-acceptance/challenges/"
          if not isinstance(candidate_relative, str) or not candidate_relative.startswith(candidate_prefix):
              raise SystemExit("candidate snapshot is outside the governed prefix")
          if not isinstance(challenge_relative, str) or not challenge_relative.startswith(challenge_prefix):
              raise SystemExit("challenge snapshot is outside the governed prefix")
          fetch_head_file(candidate_relative, "source-review-candidate.json")
          fetch_head_file(challenge_relative, "source-review-challenge.json")

          values = {
              "pull-request.json": request_json(
                  f"{api}/repos/{repository}/pulls/{pr_number}"
              )[0],
              "reviews.json": {
                  "reviews": paginated(f"pulls/{pr_number}/reviews?per_page=100")
              },
              "files.json": {
                  "files": paginated(f"pulls/{pr_number}/files?per_page=100")
              },
              "head-commit.json": request_json(
                  f"{api}/repos/{repository}/commits/{urllib.parse.quote(head_sha)}"
              )[0],
          }
          for name, value in values.items():
              raw = json.dumps(value, sort_keys=True, separators=(",", ":")).encode()
              write_new(name, raw)
          PY

      - name: Verify live source-only review with trusted-base code
        if: steps.scope.outputs.applicable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-servo-exact-source-acceptance-pointer-v2.py verify-live-review \
            --candidate "$HEPTA_SOURCE_ACCEPTANCE_LIVE_EVIDENCE/source-review-candidate.json" \
            --policy "$GITHUB_WORKSPACE/docs/hepta-vnext/browser/SOURCE_ACCEPTANCE_REVIEW_POLICY_V1.json" \
            --challenge "$HEPTA_SOURCE_ACCEPTANCE_LIVE_EVIDENCE/source-review-challenge.json" \
            --pointer "$HEPTA_SOURCE_ACCEPTANCE_LIVE_EVIDENCE/accepted-source-pointer.json" \
            --pull-request "$HEPTA_SOURCE_ACCEPTANCE_LIVE_EVIDENCE/pull-request.json" \
            --reviews "$HEPTA_SOURCE_ACCEPTANCE_LIVE_EVIDENCE/reviews.json" \
            --files "$HEPTA_SOURCE_ACCEPTANCE_LIVE_EVIDENCE/files.json" \
            --head-commit "$HEPTA_SOURCE_ACCEPTANCE_LIVE_EVIDENCE/head-commit.json" \
            2>&1 | tee "$HEPTA_SOURCE_ACCEPTANCE_LIVE_EVIDENCE/verification.log"
          grep -F 'PASS_LIVE_REVIEW_SOURCE_ONLY' \
            "$HEPTA_SOURCE_ACCEPTANCE_LIVE_EVIDENCE/verification.log"

      - name: Record fail-closed result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Exact Servo source acceptance live review v2"
            echo
            echo "- applicable: ${{ steps.scope.outputs.applicable }}"
            echo "- job status: ${{ job.status }}"
            echo "- verifier checkout: trusted base SHA"
            echo "- PR-head code executed: false"
            echo "- exact source acceptance: live review evidence only"
            echo "- Worker topology accepted: false"
            echo "- build authorized: false"
            echo "- Servo built/runtime qualified: false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded live-review evidence
        if: always() && steps.scope.outputs.applicable == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hepta-servo-source-acceptance-live-review-v2
          path: ${{ env.HEPTA_SOURCE_ACCEPTANCE_LIVE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30

      - name: Check trusted-base worktree
        if: always() && !cancelled() && steps.scope.outputs.applicable == 'true'
        uses: ./.github/actions/check-clean-worktree
