name: Hepta inference historical INF-0C evidence v2

on:
  pull_request:
    paths:
      - "scripts/hepta-inference-inf0c-real-e2e.py"
      - "scripts/hepta-inference-inf0c-evidence-v2.py"
      - "scripts/hepta-inference-inf0c-evidence-v2-loopback-selftest.py"
      - "scripts/hepta-inference-inf0c-historical-receipt-gate.py"
      - "docs/hepta-vnext/inference/HEPTA_INFERENCE_INF0C_EVIDENCE_HARNESS_V2.md"
      - "docs/hepta-vnext/inference/HEPTA_INFERENCE_INF0C_SOURCE_RECEIPT_2026-08-28.json"
      - ".github/workflows/hepta-inference-inf0c-evidence-v2.yml"
  workflow_dispatch:
    inputs:
      run_real_software_e2e:
        description: "Run against pre-provisioned loopback Ollama and LM Studio services"
        required: false
        default: false
        type: boolean
      run_controlled_restart:
        description: "Use the runner-pinned helper to stop/start both providers"
        required: false
        default: false
        type: boolean
      ollama_model:
        description: "Exact pre-installed Ollama model ID"
        required: false
        type: string
      lmstudio_model:
        description: "Exact pre-installed LM Studio model ID"
        required: false
        type: string

permissions:
  contents: read

jobs:
  source-evidence:
    name: Historical evidence-v2 source and hermetic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify assigned runner and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNNER_NAME"
          test -n "$RUNNER_OS"
          test -n "$RUNNER_ARCH"
          test -z "$(git status --porcelain)"
          python3 -m py_compile \
            scripts/hepta-inference-inf0c-real-e2e.py \
            scripts/hepta-inference-inf0c-evidence-v2.py \
            scripts/hepta-inference-inf0c-evidence-v2-loopback-selftest.py \
            scripts/hepta-inference-inf0c-historical-receipt-gate.py

      - name: Self-test pinned helper trust boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-inference-inf0c-evidence-v2.py --self-test \
            | tee "$RUNNER_TEMP/hepta-inference-inf0c-evidence-helper-selftest.txt"

      - name: Self-test bounded loopback disconnect
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-inference-inf0c-evidence-v2-loopback-selftest.py \
            | tee "$RUNNER_TEMP/hepta-inference-inf0c-evidence-loopback-selftest.txt"

      - name: Verify immutable historical receipt and ancestry
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-inference-inf0c-historical-receipt-gate.py \
            | tee "$RUNNER_TEMP/hepta-inference-inf0c-historical-receipt.txt"

      - name: Record negative-authority posture
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Historical INF-0C evidence-v2 posture"
            echo
            echo "- exact descendant head: $(git rev-parse HEAD)"
            echo "- historical receipt validated: true"
            echo "- mutable current stage gate replayed: false"
            echo "- qualification_only: true"
            echo "- transport_disconnect_executed: false"
            echo "- controlled_restart_executed: false"
            echo "- backend_cancellation_acknowledged: false"
            echo "- real_provider_executed: false"
            echo "- operator/promotion/release authority: false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload historical source evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-inf0c-evidence-v2-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/hepta-inference-inf0c-*.txt
          if-no-files-found: error
          retention-days: 30

  real-software-evidence:
    name: Fixed-tuple disconnect and restart evidence
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_real_software_e2e }}
    needs: source-evidence
    runs-on: [self-hosted, hepta-inference-e2e]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact model inputs
        shell: bash
        env:
          OLLAMA_MODEL: ${{ inputs.ollama_model }}
          LMSTUDIO_MODEL: ${{ inputs.lmstudio_model }}
        run: |
          set -euo pipefail
          test -n "$OLLAMA_MODEL"
          test -n "$LMSTUDIO_MODEL"

      - name: Execute minimal no-download model smoke
        shell: bash
        env:
          OLLAMA_MODEL: ${{ inputs.ollama_model }}
          LMSTUDIO_MODEL: ${{ inputs.lmstudio_model }}
        run: |
          set -euo pipefail
          python3 scripts/hepta-inference-inf0c-real-e2e.py \
            --execute \
            --ollama-model "$OLLAMA_MODEL" \
            --lmstudio-model "$LMSTUDIO_MODEL" \
            --receipt "$RUNNER_TEMP/hepta-inference-inf0c-real-e2e.json"

      - name: Execute transport disconnect and optional controlled restart
        shell: bash
        env:
          OLLAMA_MODEL: ${{ inputs.ollama_model }}
          LMSTUDIO_MODEL: ${{ inputs.lmstudio_model }}
          RUN_CONTROLLED_RESTART: ${{ inputs.run_controlled_restart }}
        run: |
          set -euo pipefail
          args=(
            python3 scripts/hepta-inference-inf0c-evidence-v2.py
            --execute
            --ollama-model "$OLLAMA_MODEL"
            --lmstudio-model "$LMSTUDIO_MODEL"
            --receipt "$RUNNER_TEMP/hepta-inference-inf0c-evidence-v2.json"
          )
          if [[ "$RUN_CONTROLLED_RESTART" == "true" ]]; then
            test -n "${HEPTA_INF0C_SERVICE_CONTROL_HELPER:-}"
            test -n "${HEPTA_INF0C_SERVICE_CONTROL_HELPER_SHA256:-}"
            args+=(--run-controlled-restart)
          fi
          "${args[@]}"

      - name: Require both evidence receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/hepta-inference-inf0c-real-e2e.json"
          test -s "$RUNNER_TEMP/hepta-inference-inf0c-evidence-v2.json"

      - name: Upload real-software evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-inf0c-evidence-v2-real-software-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hepta-inference-inf0c-real-e2e.json
            ${{ runner.temp }}/hepta-inference-inf0c-evidence-v2.json
          if-no-files-found: error
          retention-days: 30

  source-summary:
    name: Historical evidence-v2 source aggregate
    if: always()
    needs: source-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce source result
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.source-evidence.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          echo PASS_HEPTA_INFERENCE_INF0C_HISTORICAL_EVIDENCE_V2_SOURCE_ONLY
          echo real_provider_executed=false
          echo backend_cancellation_acknowledged=false
          echo operator_accepted=false
          echo promoted=false
          echo released=false
