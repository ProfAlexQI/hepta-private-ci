name: Hepta Q0 versus A0 merge Clippy diagnostic

on:
  push:
    branches:
      - "automation/hepta-q0-clippy-baseline-diagnostic-20260830-0140"

permissions:
  contents: read

concurrency:
  group: hepta-q0-clippy-baseline-diagnostic-20260830-0140
  cancel-in-progress: true

env:
  Q0_SHA: c768bcbeb4c1168088d2499828c24da521a2a73a
  MERGE_SHA: bc5c63eccba3eacbf52b0353195d918b1cbe1a43
  TARGET: //codex-rs/hepta-uds-runtime-bootstrap-qualification:unit-tests_bin_clippy
  REPORT_ROOT: artifacts/hepta-q0-clippy-baseline

jobs:
  q0-base:
    name: Reproduce Clippy target on immutable Q0 base
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      exit_code: ${{ steps.clippy.outputs.exit_code }}
    steps:
      - name: Checkout immutable Q0 base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.Q0_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Q0 identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$Q0_SHA"
          git diff --check HEAD

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: aarch64-apple-darwin
          cache-scope: bazel-hepta-q0-clippy-diagnostic

      - name: Run exact failing target and retain diagnostics
        id: clippy
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          REPORT_DIR: artifacts/hepta-q0-clippy-baseline/q0
        run: |
          set -uo pipefail
          mkdir -p "$REPORT_DIR"
          git ls-tree -r --name-only HEAD \
            | grep -E 'hepta.*(uds|runtime).*bootstrap|runtime.*bootstrap.*hepta' \
            > "$REPORT_DIR/relevant-source-paths.txt" || true
          set +e
          bazel query "$TARGET" --output=label \
            > "$REPORT_DIR/target-query.stdout" \
            2> "$REPORT_DIR/target-query.stderr"
          query_rc=$?
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            -- \
            build \
            --config=clippy \
            --build_metadata=COMMIT_SHA=$Q0_SHA \
            --build_metadata=TAG_job=hepta_q0_clippy_baseline \
            -- \
            "$TARGET" \
            > >(tee "$REPORT_DIR/clippy.stdout") \
            2> >(tee "$REPORT_DIR/clippy.stderr" >&2)
          rc=$?
          set -e
          printf '%s\n' "$query_rc" > "$REPORT_DIR/query-exit-code.txt"
          printf '%s\n' "$rc" > "$REPORT_DIR/clippy-exit-code.txt"
          printf '%s\n' "$Q0_SHA" > "$REPORT_DIR/commit.txt"
          git rev-parse HEAD^{tree} > "$REPORT_DIR/tree.txt"
          git rev-parse HEAD:.github/workflows/bazel.yml > "$REPORT_DIR/bazel-workflow-blob.txt"
          git rev-parse HEAD:MODULE.bazel.lock > "$REPORT_DIR/module-lock-blob.txt"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

      - name: Upload Q0 diagnostic
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hepta-q0-clippy-diagnostic-${{ env.Q0_SHA }}
          path: artifacts/hepta-q0-clippy-baseline/q0/**
          if-no-files-found: error
          retention-days: 30

      - name: Preserve clean immutable checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD
          test -z "$(git status --porcelain --untracked-files=no)"

  merge-candidate:
    name: Reproduce Clippy target on immutable A0 merge candidate
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      exit_code: ${{ steps.clippy.outputs.exit_code }}
    steps:
      - name: Checkout immutable merge candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify merge identity and Q0 parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^1)" = "$Q0_SHA"
          git diff --check HEAD^1 HEAD^2

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: aarch64-apple-darwin
          cache-scope: bazel-hepta-merge-clippy-diagnostic

      - name: Run exact failing target and retain diagnostics
        id: clippy
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          REPORT_DIR: artifacts/hepta-q0-clippy-baseline/merge
        run: |
          set -uo pipefail
          mkdir -p "$REPORT_DIR"
          git ls-tree -r --name-only HEAD \
            | grep -E 'hepta.*(uds|runtime).*bootstrap|runtime.*bootstrap.*hepta' \
            > "$REPORT_DIR/relevant-source-paths.txt" || true
          set +e
          bazel query "$TARGET" --output=label \
            > "$REPORT_DIR/target-query.stdout" \
            2> "$REPORT_DIR/target-query.stderr"
          query_rc=$?
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            -- \
            build \
            --config=clippy \
            --build_metadata=COMMIT_SHA=$MERGE_SHA \
            --build_metadata=TAG_job=hepta_merge_clippy_diagnostic \
            -- \
            "$TARGET" \
            > >(tee "$REPORT_DIR/clippy.stdout") \
            2> >(tee "$REPORT_DIR/clippy.stderr" >&2)
          rc=$?
          set -e
          printf '%s\n' "$query_rc" > "$REPORT_DIR/query-exit-code.txt"
          printf '%s\n' "$rc" > "$REPORT_DIR/clippy-exit-code.txt"
          printf '%s\n' "$MERGE_SHA" > "$REPORT_DIR/commit.txt"
          git rev-parse HEAD^{tree} > "$REPORT_DIR/tree.txt"
          git rev-parse HEAD:.github/workflows/bazel.yml > "$REPORT_DIR/bazel-workflow-blob.txt"
          git rev-parse HEAD:MODULE.bazel.lock > "$REPORT_DIR/module-lock-blob.txt"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

      - name: Upload merge diagnostic
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hepta-merge-clippy-diagnostic-${{ env.MERGE_SHA }}
          path: artifacts/hepta-q0-clippy-baseline/merge/**
          if-no-files-found: error
          retention-days: 30

      - name: Preserve clean immutable checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^1 HEAD^2
          test -z "$(git status --porcelain --untracked-files=no)"

  classify:
    name: Classify Q0 versus merge Clippy result
    needs: [q0-base, merge-candidate]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Emit fail-closed attribution receipt
        shell: bash
        env:
          Q0_JOB_RESULT: ${{ needs.q0-base.result }}
          MERGE_JOB_RESULT: ${{ needs.merge-candidate.result }}
          Q0_EXIT: ${{ needs.q0-base.outputs.exit_code }}
          MERGE_EXIT: ${{ needs.merge-candidate.outputs.exit_code }}
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_ROOT/classification"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          q0_exit = os.environ.get('Q0_EXIT', '')
          merge_exit = os.environ.get('MERGE_EXIT', '')
          if not q0_exit.isdigit() or not merge_exit.isdigit():
              classification = 'UNKNOWN_FAIL_CLOSED'
          elif int(q0_exit) != 0 and int(merge_exit) != 0:
              classification = 'PRE_EXISTING_ON_BASE'
          elif int(q0_exit) == 0 and int(merge_exit) != 0:
              classification = 'MERGE_INTERACTION'
          elif int(q0_exit) != 0 and int(merge_exit) == 0:
              classification = 'PASS_ON_MERGE_BASE_FAILED'
          else:
              classification = 'PASS_TRANSIENT_PRIOR_FAILURE'

          receipt = {
              'schema': 'hepta_q0_clippy_attribution_receipt_v1',
              'repository': 'ProfHepta/hepta-private-ci',
              'target': os.environ['TARGET'],
              'q0': {
                  'commit': os.environ['Q0_SHA'],
                  'job_result': os.environ['Q0_JOB_RESULT'],
                  'exit_code': int(q0_exit) if q0_exit.isdigit() else None,
              },
              'merge': {
                  'commit': os.environ['MERGE_SHA'],
                  'job_result': os.environ['MERGE_JOB_RESULT'],
                  'exit_code': int(merge_exit) if merge_exit.isdigit() else None,
              },
              'classification': classification,
              'candidate_source_changed_target': False,
              'merge_authorized': False,
              'authority': {
                  'runtime': False,
                  'production': False,
                  'promotion': False,
                  'release': False,
              },
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()
          receipt['receipt_binding_sha256'] = hashlib.sha256(canonical).hexdigest()
          Path(os.environ['REPORT_ROOT'], 'classification', 'receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload attribution receipt
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hepta-q0-clippy-attribution-${{ env.Q0_SHA }}-${{ env.MERGE_SHA }}
          path: artifacts/hepta-q0-clippy-baseline/classification/**
          if-no-files-found: error
          retention-days: 30
