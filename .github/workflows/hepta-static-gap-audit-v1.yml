name: hepta static gap audit v1

on:
  push:
    branches:
      - codex/hepta-vnext-plan-browser-c0-c3-20260827
    paths:
      - ".github/workflows/hepta-static-gap-audit-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-static-gap-audit-v1-epoch-2
  cancel-in-progress: true

jobs:
  audit:
    name: Audit all repository-local Hepta gaps
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,cargo-shear@1.11.2,cargo-deny@0.18.5

      - name: Install pinned Python audit tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input \
            PyYAML==6.0.2 codespell==2.4.1

      - name: Parse all workflow YAML and Browser JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml

          workflows = sorted(Path('.github/workflows').glob('*.yml')) + sorted(Path('.github/workflows').glob('*.yaml'))
          for path in workflows:
              with path.open(encoding='utf-8') as handle:
                  yaml.safe_load(handle)
          browser_json = sorted(Path('docs/hepta-vnext/browser').glob('*.json'))
          for path in browser_json:
              json.loads(path.read_text(encoding='utf-8'))
          print(json.dumps({'workflows': len(workflows), 'browser_json': len(browser_json)}, sort_keys=True))
          PY

      - name: Compile Python and run canonical Hepta policy gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts
          python3 scripts/verify-hepta-required-contexts.py
          python3 scripts/verify-hepta-focused-gates.py
          python3 scripts/verify-hepta-legacy-workflow-retirement.py
          python3 scripts/verify-hepta-browser-plan-v2.py
          python3 scripts/verify-hepta-browser-runner-evidence.py
          python3 scripts/tests/test_hepta_browser_runner_evidence.py -v

      - name: Run all Browser and Servo Python contract regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_hepta_*.py' -v

      - name: Verify Rust 1.95 format, lock and manifest hygiene
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          (
            cd codex-rs
            cargo +1.95.0 metadata --locked --no-deps --format-version 1 >/dev/null
            cargo shear --deny-warnings
          )

      - name: Run locked qualification tests and strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          (
            cd codex-rs
            cargo +1.95.0 test --locked --no-default-features \
              -p codex-hepta-contracts \
              --features authbus-local-qualification \
              --tests -- --nocapture
            cargo +1.95.0 check --locked --no-default-features \
              -p codex-hepta-contracts \
              --features authbus-local-qualification \
              --all-targets
            cargo +1.95.0 test --locked \
              -p codex-hepta-contracts \
              -p codex-hepta-evidence \
              -p codex-hepta-governance \
              -p codex-hepta-memory \
              -p codex-hepta-memory-extension \
              -p codex-hepta-paths \
              -p codex-hepta-runtime \
              -p codex-hepta-native-gateway
            cargo +1.95.0 clippy --locked --all-targets \
              -p codex-hepta-contracts \
              -p codex-hepta-evidence \
              -p codex-hepta-governance \
              -p codex-hepta-memory \
              -p codex-hepta-memory-extension \
              -p codex-hepta-paths \
              -p codex-hepta-runtime \
              -p codex-hepta-native-gateway \
              -- -D warnings
          )

      - name: Run repository policy tools
        shell: bash
        run: |
          set -euo pipefail
          codespell
          (
            cd codex-rs
            cargo deny check
          )
          just bazel-lock-check
          git diff --check
          git status --short
          test -z "$(git status --porcelain)"
