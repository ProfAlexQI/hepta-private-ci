name: p034-qualified-publisher-cross-platform-v5

on:
  push:
    branches:
      - codex/p034-payload-helper-arm-v1-20260829
    paths:
      - .github/workflows/p034-publisher-cross-platform-v1.yml
      - ci/p034-qualified-publisher.py
      - ci/p034-qualified-publisher-v2.py
      - ci/p034-extract-full-payload.py
      - ci/p034-forward-compat.py

permissions:
  contents: write

concurrency:
  group: p034-qualified-publisher-cross-platform
  cancel-in-progress: true

jobs:
  qualify-and-publish:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-14
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      TARGET_BRANCH: codex/hepta-intelligence-legacy-governance-v2-20260829
      EXPECTED_TARGET: 35de548b07d3957679800f694ecf1a6f3e001c36
      P033_HEAD: eddcb59ca43a76ac83b64507983bd908f406ff48
      PAYLOAD_SHA256: bd21ef335c14fa2c78f6a2bb87b4c39d1a8937361c62ca80a92b5907a43617cd
    steps:
      - name: Checkout publisher helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: helper

      - name: Checkout immutable complete payload source
        uses: actions/checkout@v4
        with:
          ref: 4b3b78c7a059b335bcabb36d80958adfbe131078
          fetch-depth: 1
          path: payload-source

      - name: Checkout exact P0.3.4 staging branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          path: target

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Recover and validate complete payload
        run: >-
          python helper/ci/p034-extract-full-payload.py
          payload-source/.github/workflows/p034-payload-helper-arm-v1.yml
          helper/ci/p034-payload/part-00.b64

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Apply, qualify, repair predecessor gate, squash, and publish
        run: python helper/ci/p034-qualified-publisher-v2.py target

      - name: Upload fail-closed diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p034-cross-platform-${{ matrix.os }}-${{ github.sha }}
          path: target/artifacts/hepta-intelligence-legacy-grounding-governance-v1
          if-no-files-found: warn
          retention-days: 21
