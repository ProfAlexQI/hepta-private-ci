name: Hepta Intelligence Q0.49 ARM lock and shear diagnostic

on:
  pull_request:
    branches:
      - codex/hepta-intelligence-q0-48-release-target-executable-mode-20260830

permissions:
  contents: read

jobs:
  lock-shear-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source ancestry and diagnostic-only paths
        shell: bash
        run: |
          set -euo pipefail
          base=f2f200969fa0076178276bceab2eb21d23f0519e
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$base" HEAD
          mapfile -t changed < <(git diff --name-only --no-renames "$base" HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/hepta-intelligence-q0-49-lock-shear-diagnostic.yml|\
              .github/workflows/hepta-intelligence-q0-49-lock-shear-arm-diagnostic.yml|\
              plans/hepta-intelligence/HEPTA_INTELLIGENCE_Q0_49_LOCK_DIAGNOSTIC_TRIGGER.txt)
                ;;
              *)
                echo "unexpected diagnostic path: $path" >&2
                exit 1
                ;;
            esac
          done
          git diff --check "$base" HEAD

      - name: Install repository CI prerequisites
        uses: ./.github/actions/setup-ci

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt,clippy

      - name: Install pinned cargo-shear
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-shear@1.11.2

      - name: Generate Cargo lock and exercise exact dispositions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/q049-arm
          cp codex-rs/Cargo.lock artifacts/q049-arm/Cargo.lock.before

          set +e
          cargo +1.95.0 metadata \
            --manifest-path codex-rs/Cargo.toml \
            --format-version=1 \
            --locked \
            >artifacts/q049-arm/metadata-before.json \
            2>artifacts/q049-arm/metadata-before.stderr
          metadata_before_rc=$?
          set -e

          cargo +1.95.0 generate-lockfile \
            --manifest-path codex-rs/Cargo.toml \
            >artifacts/q049-arm/generate-lockfile.stdout \
            2>artifacts/q049-arm/generate-lockfile.stderr
          cp codex-rs/Cargo.lock artifacts/q049-arm/Cargo.lock.generated
          git diff -- codex-rs/Cargo.lock \
            >artifacts/q049-arm/Cargo.lock.diff

          set +e
          (
            cd codex-rs
            cargo +1.95.0 shear --deny-warnings
          ) >artifacts/q049-arm/shear-baseline.log 2>&1
          shear_baseline_rc=$?
          set -e

          python3 - <<'PY'
          from pathlib import Path

          dispositions = {
              Path("codex-rs/hepta-automation/Cargo.toml"): "sha2",
              Path("codex-rs/hepta-contracts/Cargo.toml"): "pretty_assertions",
              Path("codex-rs/hepta-fleet/Cargo.toml"): "pretty_assertions",
          }
          for path, dependency in dispositions.items():
              text = path.read_text(encoding="utf-8")
              if "[package.metadata.cargo-shear]" in text:
                  raise SystemExit(f"pre-existing cargo-shear metadata: {path}")
              path.write_text(
                  text.rstrip()
                  + "\n\n[package.metadata.cargo-shear]\n"
                  + f'ignored = ["{dependency}"]\n',
                  encoding="utf-8",
              )
          PY

          git diff -- \
            codex-rs/hepta-automation/Cargo.toml \
            codex-rs/hepta-contracts/Cargo.toml \
            codex-rs/hepta-fleet/Cargo.toml \
            >artifacts/q049-arm/shear-dispositions.diff

          set +e
          (
            cd codex-rs
            cargo +1.95.0 shear --deny-warnings
          ) >artifacts/q049-arm/shear-dispositions.log 2>&1
          shear_dispositions_rc=$?

          cargo +1.95.0 check \
            --manifest-path codex-rs/Cargo.toml \
            --locked \
            --all-targets \
            -p codex-hepta-automation \
            -p codex-hepta-contracts \
            -p codex-hepta-fleet \
            >artifacts/q049-arm/focused-check.log 2>&1
          focused_check_rc=$?

          cargo +1.95.0 test \
            --manifest-path codex-rs/Cargo.toml \
            --locked \
            --no-run \
            -p codex-hepta-automation \
            -p codex-hepta-contracts \
            -p codex-hepta-fleet \
            >artifacts/q049-arm/focused-test-no-run.log 2>&1
          focused_test_rc=$?
          set -e

          git restore --source="$SOURCE_SHA" -- \
            codex-rs/hepta-automation/Cargo.toml \
            codex-rs/hepta-contracts/Cargo.toml \
            codex-rs/hepta-fleet/Cargo.toml

          {
            echo "head=$SOURCE_SHA"
            echo "source_base=f2f200969fa0076178276bceab2eb21d23f0519e"
            echo "runner_arch=$RUNNER_ARCH"
            echo "metadata_locked_before_rc=$metadata_before_rc"
            echo "shear_baseline_rc=$shear_baseline_rc"
            echo "shear_dispositions_rc=$shear_dispositions_rc"
            echo "focused_check_rc=$focused_check_rc"
            echo "focused_test_no_run_rc=$focused_test_rc"
            echo "cargo_lock_sha256=$(sha256sum codex-rs/Cargo.lock | awk '{print $1}')"
          } >artifacts/q049-arm/summary.env

      - name: Set up Bazel for ARM lock regeneration
        uses: ./.github/actions/setup-bazel-ci
        with:
          target: aarch64-unknown-linux-gnu

      - name: Regenerate Bazel module lock
        shell: bash
        run: |
          set -euo pipefail
          set +e
          just bazel-lock-update \
            >artifacts/q049-arm/bazel-lock-update.log 2>&1
          bazel_lock_rc=$?
          set -e
          echo "$bazel_lock_rc" >artifacts/q049-arm/bazel-lock-update.rc
          cp MODULE.bazel.lock artifacts/q049-arm/MODULE.bazel.lock.generated
          git diff -- MODULE.bazel.lock \
            >artifacts/q049-arm/MODULE.bazel.lock.diff
          echo "bazel_lock_rc=$bazel_lock_rc" \
            >>artifacts/q049-arm/summary.env
          echo "module_bazel_lock_sha256=$(sha256sum MODULE.bazel.lock | awk '{print $1}')" \
            >>artifacts/q049-arm/summary.env
          cat artifacts/q049-arm/summary.env

      - name: Upload ARM Q0.49 diagnostic bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-intelligence-q0-49-arm-lock-shear-${{ github.event.pull_request.head.sha }}
          path: artifacts/q049-arm
          if-no-files-found: error
          retention-days: 30
