name: Hepta operation safety runner switch

on:
  push:
    branches:
      - codex/hepta-architecture-convergence-p0-2-20260828
    paths:
      - .github/workflows/hepta-operation-safety-runner-switch.yml

permissions:
  contents: write

concurrency:
  group: hepta-operation-safety-runner-switch
  cancel-in-progress: true

env:
  BRANCH_NAME: codex/hepta-architecture-convergence-p0-2-20260828
  EXPECTED_PARENT: 75e757d828ac20c1dfaf1305ec66c64698041e07
  TARGET: .github/workflows/hepta-automation-operation-repair-once.yml
  SELF: .github/workflows/hepta-operation-safety-runner-switch.yml

jobs:
  switch-and-retire:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Prove exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Switch one bounded repair job and retire self
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/hepta-automation-operation-repair-once.yml')
          text = path.read_text(encoding='utf-8')
          old = '    runs-on: ubuntu-24.04\n'
          new = '    runs-on: ubuntu-slim\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one standard runner marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm "$SELF"
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "$TARGET"
          test "${changed[1]}" = "$SELF"
          git diff --check

      - name: Fast-forward only
        shell: bash
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin "refs/heads/$BRANCH_NAME" | awk '{print $1}')
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET" "$SELF"
          git commit -m "ci(hepta): run bounded operation repair on ephemeral pool"
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
