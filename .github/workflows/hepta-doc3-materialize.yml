name: Hepta DOC-3 module documentation closure

on:
  push:
    branches:
      - integration/vnext-main-20260811

permissions:
  contents: write

concurrency:
  group: hepta-doc3-module-closure
  cancel-in-progress: true

env:
  CURRENT_DEFAULT: integration/vnext-main-20260811
  FUTURE_DEFAULT: main

jobs:
  materialize:
    if: "github.event.head_commit.message == 'ops(docs): materialize DOC-3 module closure'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Bind exact two-ref precondition
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          parent_sha="$(git rev-parse HEAD^)"
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse "refs/remotes/origin/$CURRENT_DEFAULT")" = "$GITHUB_SHA"
          test "$(git rev-parse "refs/remotes/origin/$FUTURE_DEFAULT")" = "$parent_sha"
          test "$(git ls-remote --heads origin | wc -l | tr -d ' ')" = "2"
          git config user.name "Hepta Module Documentation Closure"
          git config user.email "hepta-module-docs@users.noreply.github.com"
          printf '%s\n' "$parent_sha" > /tmp/hepta-doc3-parent

      - name: Materialize and verify DOC-3
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/hepta-doc3-materialize.py
          python3 scripts/hepta-module-docs.py self-test
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-docs.py self-test
          python3 scripts/hepta-docs.py inventory-legacy
          python3 scripts/hepta-docs.py generate-status
          git diff --exit-code -- docs/STATUS.md
          python3 scripts/hepta-docs.py verify
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          expected = {
              "README.md",
              "docs/DEVELOPMENT.md",
              "docs/STATUS.md",
              "docs/governance/DOCUMENT_SYSTEM.json",
              "docs/modules/MODULES.json",
              "docs/modules/MODULE_DOCS.json",
              "docs/modules/SOURCE_BINDINGS.json",
              "docs/modules/README.md",
              "docs/delivery/WORK_PACKAGES.json",
              "docs/delivery/DEVELOPMENT_DAG.json",
              "docs/delivery/ACTIVATION_DAG.json",
              "docs/delivery/EVIDENCE_DAG.json",
              "scripts/hepta-docs.py",
              "scripts/hepta-module-docs.py",
              ".github/workflows/hepta-development-docs.yml",
          }
          expected.update(
              f"docs/modules/{path.name}/TECHNICAL.md"
              for path in Path("docs/modules").iterdir()
              if path.is_dir()
          )
          import subprocess
          observed = set(
              subprocess.check_output(
                  ["git", "status", "--porcelain=v1", "-uall"], text=True
              ).splitlines()
          )
          paths = {line[3:] for line in observed}
          unexpected = sorted(paths - expected)
          missing = sorted(expected - paths)
          if unexpected or missing:
              raise SystemExit(
                  f"unexpected DOC-3 diff; unexpected={unexpected} missing={missing}"
              )
          PY

      - name: Commit closure and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm -r \
            .github/scripts/hepta-doc3-materialize.py \
            .github/scripts/hepta-doc3-materialize.parts \
            .github/workflows/hepta-doc3-materialize.yml
          git add -A
          git commit -s \
            -m "docs(modules): close DOC-3 module documentation gaps" \
            -m "Add one stable technical guide and exact source-binding record for all forty modules, enforce their closed-world coverage, and retain truthful source/activation authority states. Authority delta: none."
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-docs.py verify
          git diff --check
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > /tmp/hepta-doc3-final

      - name: Atomically publish exact final head
        shell: bash
        run: |
          set -euo pipefail
          parent_sha="$(cat /tmp/hepta-doc3-parent)"
          final_sha="$(cat /tmp/hepta-doc3-final)"
          git push --atomic \
            --force-with-lease="refs/heads/$CURRENT_DEFAULT:$GITHUB_SHA" \
            --force-with-lease="refs/heads/$FUTURE_DEFAULT:$parent_sha" \
            origin \
            "$final_sha:refs/heads/$CURRENT_DEFAULT" \
            "$final_sha:refs/heads/$FUTURE_DEFAULT"

      - name: Verify published closed world
        shell: bash
        run: |
          set -euo pipefail
          final_sha="$(cat /tmp/hepta-doc3-final)"
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse "refs/remotes/origin/$CURRENT_DEFAULT")" = "$final_sha"
          test "$(git rev-parse "refs/remotes/origin/$FUTURE_DEFAULT")" = "$final_sha"
          test "$(git ls-remote --heads origin | wc -l | tr -d ' ')" = "2"
          test ! -e .github/scripts/hepta-doc3-materialize.py
          test ! -e .github/scripts/hepta-doc3-materialize.parts
          test ! -e .github/workflows/hepta-doc3-materialize.yml
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-docs.py verify
          echo "DOC-3 module documentation closure published at $final_sha"
