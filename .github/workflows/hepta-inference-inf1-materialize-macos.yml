name: Hepta inference INF-1 macOS source materialization

on:
  push:
    branches:
      - codex/hepta-inference-inf1-source-20260829
    paths:
      - ".github/workflows/hepta-inference-inf1-materialize-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-inference-inf1-materialize-macos-${{ github.sha }}
  cancel-in-progress: false

jobs:
  materialize:
    name: Materialize exact digest-bound INF-1 source on macOS
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify isolated workflow commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/hepta-inference-inf1-materialize-macos.yml"

      - name: Materialize and verify digest-bound payload
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-inference-inf1-materialize.py
          python3 -m py_compile \
            scripts/hepta-inference-inf1-bootstrap.py \
            scripts/hepta-inference-inf1-source-gate.py
          test -f codex-rs/hepta-infer-core/Cargo.toml
          test -f codex-rs/hepta-inferd/Cargo.toml
          python3 scripts/hepta-inference-inf1-bootstrap.py --apply
          python3 scripts/hepta-inference-inf1-bootstrap.py --verify

      - name: Build deterministic materialized-source bundle
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/hepta-inference-inf1-materialized"
          mkdir -p \
            "$out/codex-rs" \
            "$out/docs/hepta-vnext/inference" \
            "$out/scripts"
          cp codex-rs/Cargo.toml "$out/codex-rs/Cargo.toml"
          cp -R codex-rs/hepta-infer-core "$out/codex-rs/hepta-infer-core"
          cp -R codex-rs/hepta-inferd "$out/codex-rs/hepta-inferd"
          cp docs/hepta-vnext/inference/HEPTA_INFERENCE_INF1_SOURCE_CONTRACT_V1.md \
            "$out/docs/hepta-vnext/inference/"
          cp docs/hepta-vnext/inference/HEPTA_INFERENCE_INF1_SOURCE_STATUS_V1.json \
            "$out/docs/hepta-vnext/inference/"
          cp scripts/hepta-inference-inf1-bootstrap.py \
            scripts/hepta-inference-inf1-source-gate.py \
            "$out/scripts/"
          python3 - "$out" <<'PY'
          import hashlib, json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          files = []
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.name in {"manifest.json", "SHA256SUMS"}:
                  continue
              payload = path.read_bytes()
              files.append({
                  "path": str(path.relative_to(root)),
                  "byte_length": len(payload),
                  "sha256": hashlib.sha256(payload).hexdigest(),
              })
          manifest = {
              "schema": "hepta.inference.inf1.materialized-source.v3",
              "input_head": os.environ["GITHUB_SHA"],
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "payload_digest_verified": True,
              "workspace_integration_verified": True,
              "files": files,
              "qualified": False,
              "inf1": "SOURCE_PRESENT_NOT_RUN",
              "production_authority": False,
          }
          root.joinpath("manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          find "$out" -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 shasum -a 256 > "$out/SHA256SUMS"

      - name: Upload exact materialized source
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-inf1-materialized-macos-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-inference-inf1-materialized
          if-no-files-found: error
          retention-days: 14
