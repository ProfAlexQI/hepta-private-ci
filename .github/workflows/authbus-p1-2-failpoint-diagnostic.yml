name: AuthBus P1.2 bounded failpoint rollback diagnostic

on:
  push:
    branches:
      - integration/vnext-main-full-ci-authbus-p1-2-20260828
    paths:
      - .github/workflows/authbus-p1-2-failpoint-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnostic:
    name: Materialize bounded failpoint rollback context
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Materialize reviewed P1.2 source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/authbus-p1-2-finalize.py | tee /tmp/authbus-p1-2-finalize.txt
          grep -q 'applied_sha256_digest_text_repairs=29' /tmp/authbus-p1-2-finalize.txt
          grep -q 'applied_exact_ttl_boundary_repairs=1' /tmp/authbus-p1-2-finalize.txt
          grep -q 'applied_canonical_sqlite_shim_repairs=1' /tmp/authbus-p1-2-finalize.txt
          grep -q 'applied_source_verifier_shim_repairs=1' /tmp/authbus-p1-2-finalize.txt

      - name: Print bounded failpoint and rollback source context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path("codex-rs/hepta-authbus-p1-2-qualification/tests/p1_2.rs")
          store_path = Path("codex-rs/hepta-authbus-p1-2-qualification/src/store.rs")

          def print_range(path: Path, first: int, last: int, marker: str) -> None:
              lines = path.read_text(encoding="utf-8").splitlines()
              print(f"BEGIN_{marker}")
              for line_number in range(max(first, 1), min(last, len(lines)) + 1):
                  print(f"{line_number:05d}:{lines[line_number - 1]}")
              print(f"END_{marker}")

          def print_matches(path: Path, patterns: tuple[str, ...], radius: int, marker: str) -> None:
              lines = path.read_text(encoding="utf-8").splitlines()
              selected: set[int] = set()
              for index, line in enumerate(lines):
                  if any(pattern in line for pattern in patterns):
                      selected.update(
                          range(max(0, index - radius), min(len(lines), index + radius + 1))
                      )
              print(f"BEGIN_{marker}")
              for index in sorted(selected):
                  print(f"{index + 1:05d}:{lines[index]}")
              print(f"END_{marker}")

          print_range(test_path, 730, 875, "P12_FAILPOINT_TEST_CONTEXT")
          print_matches(
              store_path,
              (
                  "StorageUnavailableBeforeCommit",
                  "StorageUnavailable",
                  "Failpoint",
                  "failpoint",
                  "ensure_current_writer",
                  "rollback",
                  "begin(",
                  "transaction",
                  "poison",
                  "closed",
              ),
              14,
              "P12_STORE_FAILPOINT_CONTEXT",
          )
          PY
