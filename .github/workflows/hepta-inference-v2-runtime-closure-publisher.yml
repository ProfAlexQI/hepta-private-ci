name: Hepta inference v2 runtime source publisher

on:
  push:
    branches:
      - automation/hepta-inference-v2-runtime-closure-publisher-20260829
    paths:
      - ".github/workflows/hepta-inference-v2-runtime-closure-publisher.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-inference-v2-runtime-source-publisher
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/hepta-inference-gap-closure-20260829
  EXPECTED_TARGET: 211948a45874890d69cb60b1bdafd946da2fc77f
  PAYLOAD_SHA256: fbc9c7cf4931f6c2a53dc448ac3089344ae0ee2ac7e6ce226d4c4950a7c3a590
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Verify Rust 1.95 source and fast-forward exact target
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reconstruct and verify immutable source payload
        shell: bash
        run: |
          set -euo pipefail
          publisher=tools/hepta-inference-v2-publisher
          test "$(wc -c < "$publisher/payload.part00" | tr -d ' ')" = 16000
          test "$(wc -c < "$publisher/payload.part01" | tr -d ' ')" = 8000
          test "$(wc -c < "$publisher/payload.part02" | tr -d ' ')" = 8000
          test "$(wc -c < "$publisher/payload.part03" | tr -d ' ')" = 8000
          test "$(wc -c < "$publisher/payload.part04" | tr -d ' ')" = 5264
          cat "$publisher"/payload.part* | base64 --decode > "$RUNNER_TEMP/hepta-inference-v2-runtime-source.tar.gz"
          echo "$PAYLOAD_SHA256  $RUNNER_TEMP/hepta-inference-v2-runtime-source.tar.gz" | sha256sum --check --strict
          python3 - "$RUNNER_TEMP/hepta-inference-v2-runtime-source.tar.gz" <<'PY'
          import pathlib
          import sys
          import tarfile

          archive = pathlib.Path(sys.argv[1])
          allowed_roots = {
              "codex-rs/hepta-infer-backend-v1",
              "codex-rs/hepta-infer-core/tests/terminal_receipt_query.rs",
              "codex-rs/hepta-infer-input-lease",
              "codex-rs/hepta-infer-model-registry",
              "codex-rs/hepta-infer-product-bridge",
              "codex-rs/hepta-infer-router",
              "codex-rs/hepta-infer-scheduler",
              "codex-rs/hepta-infer-semantic",
              "codex-rs/hepta-infer-worker-host",
          }
          with tarfile.open(archive, "r:gz") as handle:
              members = handle.getmembers()
              if not members:
                  raise SystemExit("empty runtime source payload")
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if not member.isdir() and not member.isfile():
                      raise SystemExit(f"unsupported archive member: {member.name}")
                  rendered = path.as_posix().rstrip("/")
                  if not any(rendered == root or rendered.startswith(root + "/") for root in allowed_roots):
                      raise SystemExit(f"out-of-scope archive member: {member.name}")
          print("PASS_HEPTA_INFERENCE_V2_RUNTIME_PAYLOAD_BOUND")
          PY

      - name: Bind exact target branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_TARGET"
          git checkout --detach "$EXPECTED_TARGET"
          test -z "$(git status --porcelain)"

      - name: Materialize eight runtime crates and workspace bindings
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/hepta-inference-v2-runtime-source.tar.gz"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/Cargo.toml")
          text = path.read_text(encoding="utf-8")
          old_members = '''    "hepta-infer-core",
              "hepta-infer-client",
              "hepta-inferd",'''
          new_members = '''    "hepta-infer-backend-v1",
              "hepta-infer-core",
              "hepta-infer-client",
              "hepta-infer-input-lease",
              "hepta-infer-model-registry",
              "hepta-infer-product-bridge",
              "hepta-infer-router",
              "hepta-infer-scheduler",
              "hepta-infer-semantic",
              "hepta-infer-worker-host",
              "hepta-inferd",'''
          old_dependencies = '''codex-hepta-infer-core = { path = "hepta-infer-core" }
          codex-hepta-infer-client = { path = "hepta-infer-client" }
          codex-hepta-inferd = { path = "hepta-inferd" }'''
          new_dependencies = '''codex-hepta-infer-backend-v1 = { path = "hepta-infer-backend-v1" }
          codex-hepta-infer-core = { path = "hepta-infer-core" }
          codex-hepta-infer-client = { path = "hepta-infer-client" }
          codex-hepta-infer-input-lease = { path = "hepta-infer-input-lease" }
          codex-hepta-infer-model-registry = { path = "hepta-infer-model-registry" }
          codex-hepta-infer-product-bridge = { path = "hepta-infer-product-bridge" }
          codex-hepta-infer-router = { path = "hepta-infer-router" }
          codex-hepta-infer-scheduler = { path = "hepta-infer-scheduler" }
          codex-hepta-infer-semantic = { path = "hepta-infer-semantic" }
          codex-hepta-infer-worker-host = { path = "hepta-infer-worker-host" }
          codex-hepta-inferd = { path = "hepta-inferd" }'''
          if old_members not in text or old_dependencies not in text:
              raise SystemExit("workspace insertion anchors drifted")
          text = text.replace(old_members, new_members, 1)
          text = text.replace(old_dependencies, new_dependencies, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Resolve only the new local workspace packages
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/hepta-inference-v2-metadata.json"
          python3 - "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock <<'PY'
          import pathlib
          import sys
          import tomllib

          before = tomllib.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          after = tomllib.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          new_names = {
              "codex-hepta-infer-backend-v1",
              "codex-hepta-infer-input-lease",
              "codex-hepta-infer-model-registry",
              "codex-hepta-infer-product-bridge",
              "codex-hepta-infer-router",
              "codex-hepta-infer-scheduler",
              "codex-hepta-infer-semantic",
              "codex-hepta-infer-worker-host",
          }
          before_external = {
              (p["name"], p["version"], p.get("source"), p.get("checksum"))
              for p in before.get("package", []) if p.get("source")
          }
          after_external = {
              (p["name"], p["version"], p.get("source"), p.get("checksum"))
              for p in after.get("package", []) if p.get("source")
          }
          if before_external != after_external:
              raise SystemExit("external Cargo.lock graph drifted")
          actual_new = {
              p["name"] for p in after.get("package", [])
              if p["name"] not in {q["name"] for q in before.get("package", [])}
          }
          if actual_new != new_names:
              raise SystemExit(f"unexpected new local packages: {sorted(actual_new)}")
          print("PASS_HEPTA_INFERENCE_V2_LOCAL_LOCK_EXTENSION")
          PY

      - name: Apply and verify Rust 1.95 formatting
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          packages=(
            codex-hepta-infer-core
            codex-hepta-infer-client
            codex-hepta-inferd
            codex-hepta-infer-backend-v1
            codex-hepta-infer-input-lease
            codex-hepta-infer-model-registry
            codex-hepta-infer-product-bridge
            codex-hepta-infer-router
            codex-hepta-infer-scheduler
            codex-hepta-infer-semantic
            codex-hepta-infer-worker-host
          )
          args=()
          for package in "${packages[@]}"; do args+=( -p "$package" ); done
          cargo fmt "${args[@]}"
          cargo fmt "${args[@]}" -- --check

      - name: Locked compile, tests, and strict Clippy
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          packages=(
            codex-hepta-infer-core
            codex-hepta-infer-client
            codex-hepta-inferd
            codex-hepta-infer-backend-v1
            codex-hepta-infer-input-lease
            codex-hepta-infer-model-registry
            codex-hepta-infer-product-bridge
            codex-hepta-infer-router
            codex-hepta-infer-scheduler
            codex-hepta-infer-semantic
            codex-hepta-infer-worker-host
          )
          args=()
          for package in "${packages[@]}"; do args+=( -p "$package" ); done
          cargo check --locked --all-targets "${args[@]}" |& tee "$RUNNER_TEMP/hepta-inference-v2-cargo-check.log"
          cargo test --locked --all-targets "${args[@]}" -- --test-threads=1 |& tee "$RUNNER_TEMP/hepta-inference-v2-cargo-test.log"
          cargo clippy --locked --all-targets --no-deps "${args[@]}" -- -D warnings |& tee "$RUNNER_TEMP/hepta-inference-v2-cargo-clippy.log"

      - name: Enforce exact source-commit path boundary
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python3 - <<'PY'
          import subprocess

          changed = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines()
          exact = {
              "codex-rs/Cargo.toml",
              "codex-rs/Cargo.lock",
              "codex-rs/hepta-infer-core/tests/terminal_receipt_query.rs",
          }
          prefixes = tuple(
              f"codex-rs/{name}/" for name in (
                  "hepta-infer-backend-v1",
                  "hepta-infer-input-lease",
                  "hepta-infer-model-registry",
                  "hepta-infer-product-bridge",
                  "hepta-infer-router",
                  "hepta-infer-scheduler",
                  "hepta-infer-semantic",
                  "hepta-infer-worker-host",
              )
          )
          unexpected = [path for path in changed if path not in exact and not path.startswith(prefixes)]
          if unexpected:
              raise SystemExit(f"publisher path escape: {unexpected}")
          required_prefixes = [prefix for prefix in prefixes if not any(path.startswith(prefix) for path in changed)]
          if required_prefixes:
              raise SystemExit(f"missing runtime crate payload: {required_prefixes}")
          for required in ("codex-rs/Cargo.toml", "codex-rs/Cargo.lock"):
              if required not in changed:
                  raise SystemExit(f"required workspace file unchanged: {required}")
          print("PASS_HEPTA_INFERENCE_V2_PUBLISH_PATH_BOUNDARY")
          PY
          git diff --cached --check

      - name: Commit and non-force fast-forward the target branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(inference): add bounded runtime closure foundations INF-2B through INF-5"
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_TARGET"
          git push origin HEAD:"refs/heads/$TARGET_BRANCH"
          {
            echo "source_sha=$source_sha"
            echo "source_tree=$source_tree"
            echo "source_parent=$EXPECTED_TARGET"
            echo "payload_sha256=$PAYLOAD_SHA256"
            echo "qualification_only=true"
            echo "native_llamacpp_inference=false"
            echo "hardware_performance=false"
            echo "product_default_route_changed=false"
            echo "operator_accepted=false"
            echo "promoted=false"
            echo "released=false"
          } | tee "$RUNNER_TEMP/hepta-inference-v2-publisher-receipt.txt"

      - name: Upload publisher evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-v2-runtime-source-publisher-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hepta-inference-v2-metadata.json
            ${{ runner.temp }}/hepta-inference-v2-cargo-check.log
            ${{ runner.temp }}/hepta-inference-v2-cargo-test.log
            ${{ runner.temp }}/hepta-inference-v2-cargo-clippy.log
            ${{ runner.temp }}/hepta-inference-v2-publisher-receipt.txt
          if-no-files-found: warn
          retention-days: 30
