# Human-authored exact-candidate trigger; no runtime or authority semantics changed.
name: Hepta Intelligence Q0 paired candidate v10

on:
  push:
    branches:
      - codex/hepta-intelligence-plan-v3-20260828
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-intelligence-q0-paired-v10-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_BRANCH: codex/hepta-intelligence-plan-v3-20260828
  EXPECTED_PARENT: 18c2af1563b863fc3cc4d4eede986a90884441d3
  Q0_WORKFLOW_PATH: .github/workflows/hepta-intelligence-q0-paired-candidate-v10.yml
  Q0_WORKFLOW_REF: ${{ github.workflow_ref }}
  Q0_WORKFLOW_SHA: ${{ github.workflow_sha }}
  Q0_REPOSITORY_ID: ${{ github.repository_id }}
  Q0_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_BUILD_JOBS: 4
  RUST_BACKTRACE: 1

jobs:
  prove-primary:
    name: E1 prove exact Q0 candidate on x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ARTIFACT_DIR: artifacts/hepta-intelligence-q0-paired-v10/e1-x64
      Q0_EXPECTED_UNAME: x86_64
      Q0_EXPECTED_RUST_HOST: x86_64-unknown-linux-gnu
      Q0_EVIDENCE_CLASS: E1_LOCAL_EXECUTABLE
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Execute exact-candidate E1 matrix
        shell: bash
        run: bash scripts/run-hepta-intelligence-q0-qualification.sh

      - name: Upload exact E1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q0-e1-${{ github.sha }}
          path: artifacts/hepta-intelligence-q0-paired-v10/e1-x64/**
          if-no-files-found: error
          retention-days: 30

  prove-independent:
    name: E2 independently prove exact Q0 candidate on ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      ARTIFACT_DIR: artifacts/hepta-intelligence-q0-paired-v10/e2-arm64
      Q0_EXPECTED_UNAME: aarch64
      Q0_EXPECTED_RUST_HOST: aarch64-unknown-linux-gnu
      Q0_EVIDENCE_CLASS: E2_INDEPENDENT_RUNNER
    steps:
      - name: Checkout exact candidate independently
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Install repository Rust toolchain independently
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Execute independent exact-candidate E2 matrix
        shell: bash
        run: bash scripts/run-hepta-intelligence-q0-qualification.sh

      - name: Upload exact E2 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q0-e2-${{ github.sha }}
          path: artifacts/hepta-intelligence-q0-paired-v10/e2-arm64/**
          if-no-files-found: error
          retention-days: 30

  pair-evidence:
    name: Pair E1 and E2 exact-source evidence
    needs:
      - prove-primary
      - prove-independent
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Download E1 evidence from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: q0-e1-${{ github.sha }}
          path: ${{ runner.temp }}/q0/e1

      - name: Download E2 evidence from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: q0-e2-${{ github.sha }}
          path: ${{ runner.temp }}/q0/e2

      - name: Verify canonical repository identity
        shell: bash
        run: python3 scripts/verify-hepta-intelligence-repository-identity.py

      - name: Verify canonical workflow consolidation
        shell: bash
        run: python3 scripts/verify-hepta-intelligence-q0-workflow-consolidation.py

      - name: Exercise fail-closed evidence-pair adversarial matrix
        shell: bash
        run: python3 scripts/verify-hepta-intelligence-q0-evidence-pair.py --self-test

      - name: Pair exact E1 and E2 receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/hepta-intelligence-q0-paired-v10/pair
          python3 scripts/verify-hepta-intelligence-q0-evidence-pair.py \
            --e1 "${RUNNER_TEMP}/q0/e1/e1-qualification-receipt.json" \
            --e1-root "${RUNNER_TEMP}/q0/e1" \
            --e2 "${RUNNER_TEMP}/q0/e2/e2-qualification-receipt.json" \
            --e2-root "${RUNNER_TEMP}/q0/e2" \
            --output artifacts/hepta-intelligence-q0-paired-v10/pair/q0-evidence-pair-receipt.json

      - name: Upload paired Q0 receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q0-pair-${{ github.sha }}
          path: artifacts/hepta-intelligence-q0-paired-v10/pair/**
          if-no-files-found: error
          retention-days: 30
