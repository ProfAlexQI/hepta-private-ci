name: hepta Servo worker source API topology contract

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/hepta-servo-worker-source-topology.py"
      - "scripts/verify-hepta-servo-worker-source-topology.py"
      - "scripts/tests/test_hepta_servo_worker_source_topology.py"
      - "docs/hepta-vnext/browser/SERVO_WORKER_SOURCE_TOPOLOGY_V1.json"
      - "docs/hepta-vnext/browser/C1_WORKER_SOURCE_TOPOLOGY*"
      - "docs/hepta-vnext/browser/ADR-0003-hepta-owned-servo-embedder.md"
      - "docs/hepta-vnext/browser/hepta.servo.worker_source_topology*.schema.json"
      - "docs/hepta-vnext/browser/C1_CURRENT_V4.json"
      - ".github/workflows/hepta-servo-worker-source-topology-contract.yml"
      - ".github/workflows/hepta-browser-next-required-v6.yml"
  push:
    branches:
      - integration/vnext-main-20260811
      - "codex/hepta-*"
    paths:
      - "scripts/hepta-servo-worker-source-topology.py"
      - "scripts/verify-hepta-servo-worker-source-topology.py"
      - "scripts/tests/test_hepta_servo_worker_source_topology.py"
      - "docs/hepta-vnext/browser/SERVO_WORKER_SOURCE_TOPOLOGY_V1.json"
      - "docs/hepta-vnext/browser/C1_WORKER_SOURCE_TOPOLOGY*"
      - "docs/hepta-vnext/browser/ADR-0003-hepta-owned-servo-embedder.md"
      - "docs/hepta-vnext/browser/hepta.servo.worker_source_topology*.schema.json"
      - "docs/hepta-vnext/browser/C1_CURRENT_V4.json"
      - ".github/workflows/hepta-servo-worker-source-topology-contract.yml"
      - ".github/workflows/hepta-browser-next-required-v6.yml"

permissions:
  contents: read

jobs:
  source-api-topology:
    name: Source/API topology (fixture only, no Servo build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize negative-authority posture
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/hepta-servo-worker-source-topology"
          mkdir -p "$evidence_dir"
          echo "HEPTA_SOURCE_TOPOLOGY_EVIDENCE=$evidence_dir" >> "$GITHUB_ENV"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "work_item=C1-minimal-worker-source-api-topology"
            echo "embedder_strategy=hepta_owned_out_of_tree"
            echo "servoshell_build_root=false"
            echo "servoshell_dependency=false"
            echo "webdriver_server_dependency=false"
            echo "exact_source_bundle_accepted=false"
            echo "source_topology_receipt_created=false"
            echo "build_recipe_created=false"
            echo "servo_built=false"
            echo "worker_artifact_created=false"
            echo "servo_runtime_qualified=false"
            echo "machine_authority=false"
            echo "runtime_authority=false"
            echo "production_caller=false"
            echo "production_writer=false"
            echo "effect_authority=false"
            echo "external_effect=false"
            echo "external_network_allowed=false"
            echo "credential_export_allowed=false"
            echo "operator_acceptance=false"
            echo "g5_allowed=false"
            echo "execute_allowed=false"
            echo "promotion=false"
            echo "release_qualified=false"
          } > "$evidence_dir/posture.txt"

      - name: Compile topology tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/hepta-servo-worker-source-topology.py \
            scripts/verify-hepta-servo-worker-source-topology.py \
            scripts/tests/test_hepta_servo_worker_source_topology.py \
            2>&1 | tee "$HEPTA_SOURCE_TOPOLOGY_EVIDENCE/py-compile.log"

      - name: Verify canonical topology contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-servo-worker-source-topology.py contract \
            2>&1 | tee "$HEPTA_SOURCE_TOPOLOGY_EVIDENCE/contract.log"
          python3 scripts/verify-hepta-servo-worker-source-topology.py \
            2>&1 | tee "$HEPTA_SOURCE_TOPOLOGY_EVIDENCE/static-verifier.log"
          python3 -m json.tool \
            docs/hepta-vnext/browser/SERVO_WORKER_SOURCE_TOPOLOGY_V1.json \
            >/dev/null
          python3 -m json.tool \
            docs/hepta-vnext/browser/hepta.servo.worker_source_topology.v1.schema.json \
            >/dev/null
          python3 -m json.tool \
            docs/hepta-vnext/browser/hepta.servo.worker_source_topology_verification.v1.schema.json \
            >/dev/null

      - name: Run fail-closed topology fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_hepta_servo_worker_source_topology.py -v \
            2>&1 | tee "$HEPTA_SOURCE_TOPOLOGY_EVIDENCE/tests.log"

      - name: Verify clean governed paths
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            scripts/hepta-servo-worker-source-topology.py \
            scripts/verify-hepta-servo-worker-source-topology.py \
            scripts/tests/test_hepta_servo_worker_source_topology.py \
            docs/hepta-vnext/browser/SERVO_WORKER_SOURCE_TOPOLOGY_V1.json \
            docs/hepta-vnext/browser/C1_WORKER_SOURCE_TOPOLOGY.md \
            docs/hepta-vnext/browser/C1_WORKER_SOURCE_TOPOLOGY_STATUS.json \
            docs/hepta-vnext/browser/ADR-0003-hepta-owned-servo-embedder.md \
            docs/hepta-vnext/browser/hepta.servo.worker_source_topology.v1.schema.json \
            docs/hepta-vnext/browser/hepta.servo.worker_source_topology_verification.v1.schema.json \
            docs/hepta-vnext/browser/C1_CURRENT_V4.json \
            .github/workflows/hepta-servo-worker-source-topology-contract.yml \
            .github/workflows/hepta-browser-next-required-v6.yml \
            2>&1 | tee "$HEPTA_SOURCE_TOPOLOGY_EVIDENCE/clean-worktree.log"

      - name: Record final status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "job_status=${{ job.status }}" >> "$HEPTA_SOURCE_TOPOLOGY_EVIDENCE/posture.txt"
          {
            echo "### Hepta Servo worker source/API topology"
            echo
            echo "This job validates a pinned file/API allowlist and local fixtures only."
            echo "It does not fetch, accept, build, link, launch, or execute Servo."
            echo
            sed 's/^/- /' "$HEPTA_SOURCE_TOPOLOGY_EVIDENCE/posture.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fixture-only evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hepta-servo-worker-source-api-topology
          path: ${{ env.HEPTA_SOURCE_TOPOLOGY_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
