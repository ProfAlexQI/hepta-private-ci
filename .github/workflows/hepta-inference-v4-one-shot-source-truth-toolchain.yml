name: Hepta inference one-shot V4 source-truth toolchain repair

on:
  push:
    branches:
      - codex/hepta-inference-gap-closure-20260829
    paths:
      - .github/workflows/hepta-inference-v4-one-shot-source-truth-toolchain.yml

permissions:
  contents: write

concurrency:
  group: hepta-inference-v4-source-truth-toolchain-repair
  cancel-in-progress: false

jobs:
  repair-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/hepta-inference-gap-closure-20260829
          persist-credentials: true
          fetch-depth: 0

      - name: Guard exact branch and parent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/hepta-inference-gap-closure-20260829
          test "$(git branch --show-current)" = "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 1cc1c7878c1b9b78da5f7f0f8725e506cf51a9bc
          test -z "$(git status --porcelain)"

      - name: Repair workspace toolchain path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/hepta-inference-v4-source-truth.py")
          source = path.read_text(encoding="utf-8")
          count = source.count("rust-toolchain.toml")
          if count < 3:
              raise SystemExit(f"unexpected toolchain marker count: {count}")
          source = source.replace("rust-toolchain.toml", "codex-rs/rust-toolchain.toml")
          path.write_text(source, encoding="utf-8")
          PY
          python3 -m py_compile scripts/hepta-inference-v4-source-truth.py
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          rm .github/workflows/hepta-inference-v4-one-shot-source-truth-toolchain.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/hepta-inference-v4-source-truth.py \
            .github/workflows/hepta-inference-v4-one-shot-source-truth-toolchain.yml
          git diff --cached --check
          git commit -m "fix(inference): bind V4 source truth to workspace toolchain"
          test -z "$(git status --porcelain)"

      - name: Verify repaired exact source truth
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-inference-v4-source-truth.py \
            > "$RUNNER_TEMP/hepta-inference-v4-source-truth-repaired.json"

      - name: Push repaired source truth
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
