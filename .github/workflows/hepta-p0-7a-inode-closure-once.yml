name: Hepta P0.7a immutable inode closure (one shot)

on:
  push:
    branches:
      - codex/hepta-architecture-v4-p0-7a-executable-closure-20260830
    paths:
      - .github/workflows/hepta-p0-7a-inode-closure-once.yml

permissions:
  contents: write

concurrency:
  group: hepta-p0-7a-inode-closure-once
  cancel-in-progress: false

jobs:
  repair:
    name: Repair and qualify immutable publication
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout exact repair source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Configure CI environment
        uses: ./.github/actions/setup-ci

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest@0.9.143

      - name: Apply stable inode identity repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-fleet/src/runtime_bootstrap_registry.rs")
          text = path.read_text(encoding="utf-8")

          linked_old = '''    if metadata_identity(&held) != metadata_identity(&linked) {
              return Err(FleetRegistryError::Corrupt(
                  "runtime bootstrap registry publication did not bind the fsynced inode".to_string(),
              ));
          }
          '''
          linked_new = '''    if stable_file_identity(&held) != stable_file_identity(&linked) {
              return Err(FleetRegistryError::Corrupt(
                  "runtime bootstrap registry publication did not bind the fsynced inode".to_string(),
              ));
          }
          '''
          published_old = '''    if metadata_identity(&held) != metadata_identity(&published) {
              return Err(FleetRegistryError::Corrupt(
                  "runtime bootstrap registry inode drifted after publication".to_string(),
              ));
          }
          '''
          published_new = '''    if stable_file_identity(&held) != stable_file_identity(&published) {
              return Err(FleetRegistryError::Corrupt(
                  "runtime bootstrap registry inode drifted after publication".to_string(),
              ));
          }
          '''
          anchor = '''#[cfg(unix)]
          fn metadata_identity(metadata: &std::fs::Metadata) -> (u64, u64, i64, i64, u64) {
          '''
          helper = '''#[cfg(unix)]
          fn stable_file_identity(metadata: &std::fs::Metadata) -> (u64, u64, u64) {
              use std::os::unix::fs::MetadataExt as _;
              (metadata.dev(), metadata.ino(), metadata.len())
          }

          #[cfg(not(unix))]
          fn stable_file_identity(
              metadata: &std::fs::Metadata,
          ) -> (u64, Option<std::time::SystemTime>) {
              metadata_identity(metadata)
          }

          #[cfg(unix)]
          fn metadata_identity(metadata: &std::fs::Metadata) -> (u64, u64, i64, i64, u64) {
          '''

          for old, new, label in (
              (linked_old, linked_new, "linked publication check"),
              (published_old, published_new, "post-unlink publication check"),
          ):
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one {label}, found {text.count(old)}")
              text = text.replace(old, new, 1)

          if text.count(anchor) != 1:
              raise SystemExit(f"expected one metadata identity anchor, found {text.count(anchor)}")
          text = text.replace(anchor, helper, 1)
          path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/hepta-p0-7a-inode-closure-once.yml

      - name: Check Rust 1.95 scoped format
        run: python3 scripts/verify-hepta-p0-7a-format.py --check

      - name: Run exact fleet package tests
        run: just test -p codex-hepta-fleet

      - name: Commit qualified repair to staging ref
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name "hepta-closure-bot"
          git config user.email "hepta-closure-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix(hepta): bind immutable publication by stable inode identity"
          repaired_sha="$(git rev-parse HEAD)"
          repaired_tree="$(git rev-parse 'HEAD^{tree}')"
          printf 'repaired_commit=%s\nrepaired_tree=%s\n' "$repaired_sha" "$repaired_tree" >> "$GITHUB_STEP_SUMMARY"
          git push origin HEAD:refs/heads/automation/hepta-p0-7a-inode-closure-20260830
