name: Hepta Intelligence canonical master plan

on:
  pull_request:
    paths:
      - plans/hepta-intelligence/AGENTS.md
      - plans/hepta-intelligence/HEPTA_INTELLIGENCE_MASTER_PLAN.md
      - plans/hepta-intelligence/HEPTA_INTELLIGENCE_CURRENT_PLAN.json
      - plans/hepta-intelligence/HEPTA_INTELLIGENCE_DOCUMENT_AUTHORITY_REGISTRY_V1.json
      - plans/hepta-intelligence/HEPTA_INTELLIGENCE_EVIDENCE_INDEX_V1.json
      - plans/hepta-intelligence/HEPTA_INTELLIGENCE_CLAIM_LADDER_V1.json
      - plans/hepta-intelligence/HEPTA_INTELLIGENCE_EXECUTION_STATUS_V2.json
      - plans/hepta-intelligence/HEPTA_INTELLIGENCE_EXECUTION_STATUS_V3.json
      - plans/hepta-intelligence/status-snapshots/**
      - plans/hepta-intelligence/HEPTA_INTELLIGENCE_DEVELOPMENT_PLAN_V2_2026-08-28.md
      - plans/hepta-intelligence/HEPTA_INTELLIGENCE_DEVELOPMENT_PLAN_V3_2026-08-28.md
      - scripts/verify-hepta-intelligence-master-plan.py
      - scripts/verify-hepta-intelligence-document-authority.py
      - scripts/hepta-intelligence-status-compat.py
      - .github/workflows/hepta-intelligence-master-plan.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-intelligence-master-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-plan-source:
    name: Canonical plan and document authority source-only gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout explicit candidate identity
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove checked-out commit and tree
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          actual_tree=$(git rev-parse HEAD^{tree})
          test "$actual_sha" = "$EXPECTED_SHA"
          printf 'PASS_EXPLICIT_CHECKOUT sha=%s tree=%s\n' "$actual_sha" "$actual_tree"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile plan, authority, and compatibility verifiers
        run: |
          python3 -m py_compile \
            scripts/verify-hepta-intelligence-master-plan.py \
            scripts/verify-hepta-intelligence-document-authority.py \
            scripts/hepta-intelligence-status-compat.py

      - name: Verify sole canonical plan and fail-closed claims
        run: python3 scripts/verify-hepta-intelligence-master-plan.py

      - name: Verify document authority and compatibility contracts
        run: python3 scripts/verify-hepta-intelligence-document-authority.py

      - name: Validate all immutable tranche snapshots without materialization
        run: |
          set -euo pipefail
          for tranche in P0.2 P0.3 P0.4a P0.4b P0.4c; do
            python3 scripts/hepta-intelligence-status-compat.py "$tranche" --check-only
          done

      - name: Parse machine registries
        run: |
          python3 -m json.tool plans/hepta-intelligence/HEPTA_INTELLIGENCE_CURRENT_PLAN.json >/dev/null
          python3 -m json.tool plans/hepta-intelligence/HEPTA_INTELLIGENCE_DOCUMENT_AUTHORITY_REGISTRY_V1.json >/dev/null
          python3 -m json.tool plans/hepta-intelligence/HEPTA_INTELLIGENCE_EVIDENCE_INDEX_V1.json >/dev/null

      - name: Assert plan-only authority boundary
        shell: python
        run: |
          import json
          from pathlib import Path

          data = json.loads(
              Path("plans/hepta-intelligence/HEPTA_INTELLIGENCE_CURRENT_PLAN.json")
              .read_text(encoding="utf-8")
          )
          assert all(value is False for value in data["authority"].values())
          assert data["active_phase"]["id"] == "Q0"
          assert data["active_phase"]["active_task"] == "DOC-Q0.1_RESTORE_FROZEN_QUALIFICATION_COMPATIBILITY"
          assert data["stack_budget"]["runtime_source_freeze"] is True
          assert data["session_bootstrap"]["legacy_machine_contracts_are_current_authority"] is False
          assert data["session_bootstrap"]["legacy_machine_contracts_must_remain_compatible_until_migrated"] is True
          print("PASS_PLAN_ONLY_NO_RUNTIME_AUTHORITY")

      - name: Assert read-only clean worktree
        run: git diff --exit-code

  bazel-runner-closure-carrier:
    name: Close Bazel hosted-runner checkout gaps
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/hepta-intelligence-plan-v3-20260828'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      LEASE_PARENT: 98ca9c235a93739307457cbe59e65b999fc48472
      RESTORE_SHA: 5bc538454a71612697e19b7948ae88a882427351
      CARRIER_SHA: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: codex/hepta-intelligence-plan-v3-20260828
      MASTER_WORKFLOW: .github/workflows/hepta-intelligence-master-plan.yml
      UNUSED_CARRIER: .github/workflows/hepta-q0-bazel-runner-closure-carrier.yml
      BAZEL_WORKFLOW: .github/workflows/bazel.yml
      Q0_WORKFLOW: .github/workflows/hepta-intelligence-q0-paired-candidate-v10.yml
    steps:
      - name: Checkout exact registered carrier commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CARRIER_SHA }}
          fetch-depth: 2

      - name: Verify exact carrier lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CARRIER_SHA"
          test "$(git rev-parse HEAD^)" = "$LEASE_PARENT"
          test "$(git diff --name-only "$LEASE_PARENT"..HEAD)" = "$MASTER_WORKFLOW"

      - name: Apply exact runner closure and retire carriers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          bazel_path = Path(os.environ["BAZEL_WORKFLOW"])
          text = bazel_path.read_text(encoding="utf-8")
          if text.count("macos-15-xlarge") != 4:
              raise SystemExit("unexpected macos-15-xlarge matrix count")
          text = text.replace("macos-15-xlarge", "macos-15")

          checkout = "      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2\n"
          preflight = (
              "      - name: Enable Windows long paths before checkout\n"
              "        if: runner.os == 'Windows'\n"
              "        shell: pwsh\n"
              "        run: git config --system core.longpaths true\n\n"
          )
          if text.count(checkout) != 5:
              raise SystemExit("unexpected Bazel checkout-site count")
          if "Enable Windows long paths before checkout" in text:
              raise SystemExit("long-path preflight already exists")
          bazel_path.write_text(text.replace(checkout, preflight + checkout), encoding="utf-8")

          q0_path = Path(os.environ["Q0_WORKFLOW"])
          q0 = q0_path.read_text(encoding="utf-8")
          matches = re.findall(r"(?m)^  EXPECTED_PARENT: ([0-9a-f]{40})$", q0)
          if matches != ["18c2af1563b863fc3cc4d4eede986a90884441d3"]:
              raise SystemExit(f"unexpected Q0 parent binding: {matches}")
          q0_path.write_text(
              re.sub(
                  r"(?m)^  EXPECTED_PARENT: [0-9a-f]{40}$",
                  f"  EXPECTED_PARENT: {os.environ['CARRIER_SHA']}",
                  q0,
                  count=1,
              ),
              encoding="utf-8",
          )
          PY

          git checkout "$RESTORE_SHA" -- "$MASTER_WORKFLOW"
          rm "$UNUSED_CARRIER"

          test "$(grep -c 'macos-15-xlarge' "$BAZEL_WORKFLOW" || true)" = "0"
          test "$(grep -c -- '- os: macos-15$' "$BAZEL_WORKFLOW")" = "4"
          test "$(grep -c 'Enable Windows long paths before checkout' "$BAZEL_WORKFLOW")" = "5"
          test "$(grep -c 'git config --system core.longpaths true' "$BAZEL_WORKFLOW")" = "5"
          test "$(grep -c "EXPECTED_PARENT: $CARRIER_SHA" "$Q0_WORKFLOW")" = "1"
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0))' "$BAZEL_WORKFLOW"
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0))' "$Q0_WORKFLOW"
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0))' "$MASTER_WORKFLOW"
          git diff --check

          python3 - <<'PY'
          import subprocess
          expected = [
              ".github/workflows/bazel.yml",
              ".github/workflows/hepta-intelligence-master-plan.yml",
              ".github/workflows/hepta-intelligence-q0-paired-candidate-v10.yml",
              ".github/workflows/hepta-q0-bazel-runner-closure-carrier.yml",
          ]
          actual = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          if actual != expected:
              raise SystemExit({"expected": expected, "actual": actual})
          PY

      - name: Commit and fast-forward the canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta Qualification Bot"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add -A -- "$BAZEL_WORKFLOW" "$Q0_WORKFLOW" "$MASTER_WORKFLOW" "$UNUSED_CARRIER"
          git commit -m "ci: close Bazel hosted-runner checkout gaps"
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$CARRIER_SHA"
          git fetch --no-tags origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")" = "$CARRIER_SHA"
          git push origin "$candidate:refs/heads/$TARGET_BRANCH"
