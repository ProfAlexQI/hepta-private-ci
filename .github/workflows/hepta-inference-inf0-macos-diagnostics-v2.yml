name: Hepta inference INF-0 macOS diagnostics retirement

on:
  push:
    branches:
      - codex/hepta-inference-inf0-macos-diagnostics-v2-20260828
    paths:
      - ".github/workflows/hepta-inference-inf0-macos-diagnostics-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-inference-inf0-macos-diagnostics-v2
  cancel-in-progress: true

jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record diagnostic retirement
        shell: bash
        run: |
          {
            echo "retired_run=33173718807"
            echo "reason=exact failures already isolated by fast diagnostics"
            echo "qualified=false"
            echo "INF-1=NOT_STARTED"
            echo "production/effect/model-NPU/remote/promotion authority=false"
          } >> "$GITHUB_STEP_SUMMARY"
