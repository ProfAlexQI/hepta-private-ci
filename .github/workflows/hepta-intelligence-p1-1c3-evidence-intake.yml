name: hepta-intelligence-p1-1c3-evidence-intake

on:
  push:
    branches:
      - "codex/p1c3-evidence-intake-20260829"
  pull_request:
    paths:
      - "codex-rs/hepta-memory-p1-1c3-qualification/**"
      - "plans/hepta-intelligence/P1-1C3_*"
      - "scripts/verify-hepta-intelligence-p1-1c3-evidence-intake.py"
      - ".github/workflows/hepta-intelligence-p1-1c3-evidence-intake.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-intelligence-p1-1c3-${{ github.sha }}
  cancel-in-progress: false

env:
  BASE_BRANCH: codex/hepta-p1c2-eval-20260828
  BASE_SHA: c3c42f60e5ca11fd49fe5d4d2013c5b21e183619
  CRATE_ROOT: codex-rs/hepta-memory-p1-1c3-qualification
  MANIFEST_PATH: codex-rs/hepta-memory-p1-1c3-qualification/Cargo.toml
  VERIFIER_PATH: scripts/verify-hepta-intelligence-p1-1c3-evidence-intake.py
  ARTIFACT_DIR: artifacts/hepta-intelligence-p1-1c3

jobs:
  qualify:
    name: P1.1c.3 trusted evidence intake qualification
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact stack and changed-path allowlist
        id: source
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          git fetch --no-tags origin \
            "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$BASE_BRANCH")" = "$BASE_SHA"
          test "$(git merge-base HEAD "refs/remotes/origin/$BASE_BRANCH")" = "$BASE_SHA"
          python3 - "$BASE_SHA" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          base = sys.argv[1]
          expected = {
              ".github/workflows/hepta-intelligence-p1-1c3-evidence-intake.yml",
              "codex-rs/hepta-memory-p1-1c3-qualification/Cargo.toml",
              "codex-rs/hepta-memory-p1-1c3-qualification/src/bin/p1_1c3_receipt.rs",
              "codex-rs/hepta-memory-p1-1c3-qualification/src/digest.rs",
              "codex-rs/hepta-memory-p1-1c3-qualification/src/intake.rs",
              "codex-rs/hepta-memory-p1-1c3-qualification/src/lib.rs",
              "codex-rs/hepta-memory-p1-1c3-qualification/src/qualification.rs",
              "codex-rs/hepta-memory-p1-1c3-qualification/src/review_trust.rs",
              "codex-rs/hepta-memory-p1-1c3-qualification/src/trust.rs",
              "codex-rs/hepta-memory-p1-1c3-qualification/tests/p1_1c3.rs",
              "plans/hepta-intelligence/P1-1C3_EXECUTION_STATUS.json",
              "plans/hepta-intelligence/P1-1C3_IMPLEMENTATION_RECEIPT.json",
              "plans/hepta-intelligence/P1-1C3_TRUSTED_EVIDENCE_INTAKE_PLAN.md",
              "scripts/verify-hepta-intelligence-p1-1c3-evidence-intake.py",
          }
          actual = set(subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}..HEAD"], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit(json.dumps({"expected": sorted(expected), "actual": sorted(actual)}, indent=2))
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          Path("artifacts/hepta-intelligence-p1-1c3/source-binding.json").write_text(
              json.dumps({
                  "schema": "hepta.intelligence.p1_1c3.source_binding.v1",
                  "base_commit": base,
                  "source_commit": source,
                  "source_tree": tree,
                  "changed_paths": sorted(actual),
                  "runtime_wired": False,
                  "production_authority": False,
              }, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify local workspace isolation
        run: |
          set -euo pipefail
          grep -Fx '[workspace]' "$MANIFEST_PATH"
          ! grep -F 'hepta-memory-p1-1c3-qualification' codex-rs/Cargo.toml

      - name: Run fail-closed source verifier
        run: |
          set -o pipefail
          python3 "$VERIFIER_PATH" 2>&1 | tee "$ARTIFACT_DIR/source-gate.json"

      - name: Isolate Cargo outputs
        run: |
          set -euo pipefail
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/hepta-p1-1c3-target" >> "$GITHUB_ENV"
          rm -f "$CRATE_ROOT/Cargo.lock"
          rm -rf "$CRATE_ROOT/target"

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt,clippy

      - name: Record pinned toolchain
        run: |
          set -euo pipefail
          rustc --version | tee "$ARTIFACT_DIR/rustc-version.txt"
          cargo --version | tee "$ARTIFACT_DIR/cargo-version.txt"
          rustfmt --version | tee "$ARTIFACT_DIR/rustfmt-version.txt"
          cargo clippy --version | tee "$ARTIFACT_DIR/clippy-version.txt"
          test "$(rustc --version | awk '{print $2}')" = "1.95.0"

      - name: Check Rust formatting
        run: |
          set -o pipefail
          cargo fmt --manifest-path "$MANIFEST_PATH" --all -- --check \
            2>&1 | tee "$ARTIFACT_DIR/rustfmt.log"

      - name: Run complete unit and integration matrix
        run: |
          set -o pipefail
          cargo test --manifest-path "$MANIFEST_PATH" --all-targets -- --nocapture \
            2>&1 | tee "$ARTIFACT_DIR/tests.log"
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("artifacts/hepta-intelligence-p1-1c3/tests.log").read_text(
              encoding="utf-8", errors="replace"
          )
          passed = sum(int(value) for value in re.findall(r"test result: ok\. (\d+) passed", text))
          if passed != 16:
              raise SystemExit(f"expected 16 P1.1c.3 tests, observed {passed}")
          PY

      - name: Check all Rust targets
        run: |
          set -o pipefail
          cargo check --manifest-path "$MANIFEST_PATH" --all-targets \
            2>&1 | tee "$ARTIFACT_DIR/check.log"

      - name: Run strict Clippy
        run: |
          set -o pipefail
          cargo clippy --manifest-path "$MANIFEST_PATH" --all-targets -- -D warnings \
            2>&1 | tee "$ARTIFACT_DIR/clippy.log"

      - name: Produce deterministic blocked fixture receipt twice
        run: |
          set -euo pipefail
          cargo run --quiet --manifest-path "$MANIFEST_PATH" --bin p1_1c3_receipt \
            > "$ARTIFACT_DIR/intake-a.json"
          cargo run --quiet --manifest-path "$MANIFEST_PATH" --bin p1_1c3_receipt \
            > "$ARTIFACT_DIR/intake-b.json"
          cmp "$ARTIFACT_DIR/intake-a.json" "$ARTIFACT_DIR/intake-b.json"
          cp "$ARTIFACT_DIR/intake-a.json" "$ARTIFACT_DIR/intake.json"
          sha256sum "$ARTIFACT_DIR/intake.json" > "$ARTIFACT_DIR/intake.json.sha256"

      - name: Validate blocked fixture and redaction boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/hepta-intelligence-p1-1c3/intake.json")
          text = path.read_text(encoding="utf-8")
          receipt = json.loads(text)
          assert receipt["status"] == "BLOCKED_P1_1C3_TRUSTED_CORPUS_INTAKE"
          assert receipt["external_evidence_complete"] is False
          assert receipt["mechanically_accepted"] is False
          assert receipt["blocked_reasons"] == sorted(set(receipt["blocked_reasons"]))
          for key in [
              "runtime_wired",
              "production_authority",
              "efficacy_validation",
              "efficacy_claim",
              "promotion",
          ]:
              assert receipt[key] is False, key
          for forbidden in [
              "reviewer-a",
              "reviewer-b",
              "public_key",
              "signature",
              "license-text",
              "source-manifest",
          ]:
              assert forbidden not in text, forbidden
          PY

      - name: Prove clean tracked source
        run: |
          set -euo pipefail
          rm -f "$CRATE_ROOT/Cargo.lock"
          rm -rf "$CRATE_ROOT/target"
          git diff --exit-code -- "$CRATE_ROOT" "$VERIFIER_PATH" plans/hepta-intelligence/P1-1C3_*
          test -z "$(git ls-files --others --exclude-standard -- "$CRATE_ROOT")"

      - name: Write exact-head qualification receipt
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = {
              "schema": "hepta.intelligence.p1_1c3.executable_qualification.v1",
              "status": "PASS_P1_1C3_EXECUTABLE_SOURCE_GATES_EXTERNAL_EVIDENCE_ABSENT",
              "source_commit": os.environ["SOURCE_SHA"],
              "tests_passed": 16,
              "gates": {
                  "stack_base": "success",
                  "changed_path_allowlist": "success",
                  "workspace_isolation": "success",
                  "source_gate": "success",
                  "rust_1_95_0": "success",
                  "rustfmt": "success",
                  "tests": "success",
                  "check": "success",
                  "clippy": "success",
                  "blocked_fixture_receipt_reproducibility": "success",
                  "receipt_redaction": "success",
                  "clean_tree": "success"
              },
              "source_qualified": True,
              "external_evidence_present": False,
              "trusted_corpus_accepted": False,
              "qualified": False,
              "runtime_wired": False,
              "production_authority": False,
              "efficacy_claim": False,
              "promotion": False,
              "runner": {
                  "name": os.environ["RUNNER_NAME"],
                  "os": os.environ["RUNNER_OS"],
                  "arch": os.environ["RUNNER_ARCH"]
              },
              "workflow": {
                  "run_id": int(os.environ["RUN_ID"]),
                  "run_attempt": int(os.environ["RUN_ATTEMPT"])
              }
          }
          Path("artifacts/hepta-intelligence-p1-1c3/qualification-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload P1.1c.3 qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-intelligence-p1-1c3-${{ github.sha }}
          path: artifacts/hepta-intelligence-p1-1c3
          if-no-files-found: warn
          retention-days: 14
