name: Hepta remediated candidate CI observer

on:
  push:
    branches:
      - codex/hepta-final-ci-observer-20260902
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: read

concurrency:
  group: hepta-remediated-ci-observer-20260902
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      HEAD_BRANCH: codex/hepta-v8-repository-closure-remediated-20260902
      REPORT_BRANCH: codex/hepta-remediated-ci-report-20260902
    steps:
      - name: Observe exact remediated PR and retry infrastructure-only failures
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p observation
          pr_json="$(gh api "/repos/${REPOSITORY}/pulls?state=open&head=TrillionniumFoundation:${HEAD_BRANCH}")"
          printf '%s\n' "$pr_json" > observation/pr.json
          test "$(jq 'length' <<<"$pr_json")" = "1"
          pr_number="$(jq -r '.[0].number' <<<"$pr_json")"
          head_sha="$(jq -r '.[0].head.sha' <<<"$pr_json")"
          head_tree="$(gh api "/repos/${REPOSITORY}/git/commits/${head_sha}" --jq '.tree.sha')"
          printf '{"pr":%s,"headBranch":"%s","headSha":"%s","headTree":"%s"}\n' "$pr_number" "$HEAD_BRANCH" "$head_sha" "$head_tree" > observation/identity.json

          deadline=$((SECONDS + 5400))
          infra_attempt=0
          while (( SECONDS < deadline )); do
            runs="$(gh api "/repos/${REPOSITORY}/actions/runs?head_sha=${head_sha}&event=pull_request&per_page=100" --jq '.workflow_runs')"
            printf '%s\n' "$runs" > observation/runs-current.json
            [[ "$(jq 'length' <<<"$runs")" != "0" ]] || { sleep 15; continue; }
            active="$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")"
            [[ "$active" = "0" ]] || { sleep 20; continue; }

            retried=0
            if (( infra_attempt < 3 )); then
              while read -r run_id; do
                [[ -n "$run_id" ]] || continue
                jobs="$(gh api "/repos/${REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" --jq '.jobs')"
                failed_count="$(jq '[.[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "startup_failure")] | length' <<<"$jobs")"
                [[ "$failed_count" != "0" ]] || continue
                started_steps="$(jq '[.[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "startup_failure") | (.steps // [])[] | select(.status == "completed" or .status == "in_progress")] | length' <<<"$jobs")"
                if [[ "$started_steps" = "0" ]]; then
                  gh api --method POST "/repos/${REPOSITORY}/actions/runs/${run_id}/rerun-failed-jobs"
                  retried=$((retried + 1))
                fi
              done < <(jq -r '.[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "startup_failure") | .id' <<<"$runs")
            fi
            if [[ "$retried" != "0" ]]; then
              infra_attempt=$((infra_attempt + 1))
              sleep 30
              continue
            fi
            break
          done

          runs="$(gh api "/repos/${REPOSITORY}/actions/runs?head_sha=${head_sha}&event=pull_request&per_page=100" --jq '.workflow_runs')"
          printf '%s\n' "$runs" > observation/runs-final.json
          gh api "/repos/${REPOSITORY}/commits/${head_sha}/check-runs?per_page=100" > observation/check-runs.json

          while read -r run_id; do
            [[ -n "$run_id" ]] || continue
            gh api "/repos/${REPOSITORY}/actions/runs/${run_id}" > "observation/run-${run_id}.json"
            gh api "/repos/${REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > "observation/jobs-${run_id}.json"
            gh run view "$run_id" --repo "$REPOSITORY" --log-failed > "observation/failed-${run_id}.log" 2>&1 || true
          done < <(jq -r '.[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | .id' <<<"$runs")

          jq -n --arg schema "hepta.remediated-ci-observation.v1" --argjson pr "$pr_number" --arg headBranch "$HEAD_BRANCH" --arg headSha "$head_sha" --arg headTree "$head_tree" --argjson runs "$runs" '{schema:$schema,pr:$pr,headBranch:$headBranch,headSha:$headSha,headTree:$headTree,workflows:[$runs[]|{id,name,status,conclusion,event,run_number,created_at,updated_at,html_url}],counts:{total:($runs|length),active:([$runs[]|select(.status!="completed")]|length),failed:([$runs[]|select(.conclusion=="failure" or .conclusion=="timed_out" or .conclusion=="startup_failure" or .conclusion=="action_required")]|length),successful:([$runs[]|select(.conclusion=="success")]|length),skipped:([$runs[]|select(.conclusion=="skipped")]|length),cancelled:([$runs[]|select(.conclusion=="cancelled")]|length)}}' > observation/summary.json

          {
            echo "# Remediated candidate CI observation"
            echo
            echo "- PR: #${pr_number}"
            echo "- Head branch: \`${HEAD_BRANCH}\`"
            echo "- Head SHA: \`${head_sha}\`"
            echo "- Head tree: \`${head_tree}\`"
            echo "- Workflows: $(jq -r '.counts.total' observation/summary.json)"
            echo "- Active: $(jq -r '.counts.active' observation/summary.json)"
            echo "- Failed: $(jq -r '.counts.failed' observation/summary.json)"
            echo "- Successful: $(jq -r '.counts.successful' observation/summary.json)"
            echo "- Skipped: $(jq -r '.counts.skipped' observation/summary.json)"
            echo "- Cancelled: $(jq -r '.counts.cancelled' observation/summary.json)"
          } > observation/README.md

          report_worktree="$(mktemp -d)"
          git clone --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "$report_worktree/repo"
          cd "$report_worktree/repo"
          git checkout --orphan report
          git rm -rf . >/dev/null 2>&1 || true
          cp -R "$GITHUB_WORKSPACE/observation/." .
          git add .
          git config user.name "Hepta remediated CI observer"
          git config user.email "hepta-remediated-ci-observer@users.noreply.github.com"
          git commit -m "chore(ci): publish immutable remediated-candidate observation"
          git push --force origin "HEAD:refs/heads/${REPORT_BRANCH}"

          cd "$GITHUB_WORKSPACE"
          test "$(jq -r '.counts.active' observation/summary.json)" = "0"
          test "$(jq -r '.counts.failed' observation/summary.json)" = "0"

      - name: Retain observation artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hepta-remediated-ci-observation
          path: observation
          if-no-files-found: error
          retention-days: 30
