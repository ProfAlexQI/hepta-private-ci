name: Hepta Automation operation fixture materializer

on:
  push:
    branches:
      - codex/hepta-architecture-convergence-p0-2-20260828
    paths:
      - .github/workflows/hepta-automation-operation-materialize-macos.yml

permissions:
  contents: write

concurrency:
  group: hepta-automation-operation-materialize-macos
  cancel-in-progress: false

jobs:
  materialize:
    name: Materialize operation-bound Automation fixtures
    runs-on: macos-15-arm64
    timeout-minutes: 30
    env:
      BRANCH: codex/hepta-architecture-convergence-p0-2-20260828
      TRANSFORM_SOURCE: b52dba0e4e131dd6005bdc0303f26caf818877b9
      STALE_BLOB: 45e9da6fad70fb0bdcb85eaedc723e21c25667e3
      EXPECTED_BLOB: 8a4776f4644bea3bd1a0f47e45496b66e1d616b1
      TARGET: codex-rs/hepta-automation/tests/automation.rs
      SELF: .github/workflows/hepta-automation-operation-materialize-macos.yml
    steps:
      - name: Checkout exact branch head with history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/hepta-architecture-convergence-p0-2-20260828
          fetch-depth: 0

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Replay audited deterministic transformer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$TARGET")" = "$STALE_BLOB"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output(
              [
                  "git",
                  "show",
                  "b52dba0e4e131dd6005bdc0303f26caf818877b9:.github/workflows/hepta-automation-operation-tests-finalize-v3.yml",
              ],
              text=True,
          )
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          script_lines = []
          for line in source[start:end].splitlines():
              if line.startswith("          "):
                  line = line[10:]
              script_lines.append(line)
          script = "\n".join(script_lines) + "\n"
          exec(compile(script, "audited-automation-transformer", "exec"), {})
          PY
          (
            cd codex-rs/hepta-automation
            rustfmt --edition 2024 tests/automation.rs
          )
          test "$(git hash-object "$TARGET")" = "$EXPECTED_BLOB"

      - name: Commit transformed source and retire materializer
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          rm "$SELF"
          git config user.name "Hepta CI"
          git config user.email "hepta-ci@users.noreply.github.com"
          git add "$TARGET" "$SELF"
          git diff --cached --check
          git commit -m "test(hepta): bind automation fixtures to durable operations"
          git push origin "HEAD:refs/heads/$BRANCH"
