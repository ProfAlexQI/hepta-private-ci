name: Hepta V6 document migration preview

on:
  push:
    branches:
      - codex/hepta-development-docs-v6-consolidation-20260831
    paths:
      - ".hepta-v6-bootstrap/**"
      - ".github/workflows/hepta-v6-migration-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-v6-document-migration-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_COMMIT: b621768b70a09d56626bb8a2c331e3dc424e6a4d
  PAYLOAD_SHA256: 02fd9e992ad31ae40df2b346a502b7105ce4df918e23cd236c7097de11548214

jobs:
  migrate-and-package:
    name: Clean legacy development docs and package exact tree delta
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout exact bootstrap head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact branch and clean bootstrap input
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "codex/hepta-development-docs-v6-consolidation-20260831"
          test "$(git rev-parse "$BASE_COMMIT^{commit}")" = "$BASE_COMMIT"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'

      - name: Reconstruct and verify V6 migration payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, pathlib, tarfile
          root = pathlib.Path.cwd()
          payload = pathlib.Path.home() / "hepta-v6-bootstrap.tar.xz"
          kit = pathlib.Path.home() / "hepta-v6-kit"
          encoded = "".join(
              p.read_text(encoding="utf-8")
              for p in sorted((root / ".hepta-v6-bootstrap").glob("part-*.b64"))
          )
          raw = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(raw).hexdigest() == "02fd9e992ad31ae40df2b346a502b7105ce4df918e23cd236c7097de11548214"
          payload.write_bytes(raw)
          kit.mkdir(parents=True, exist_ok=True)
          with tarfile.open(payload, "r:xz") as archive:
              for member in archive.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  assert not path.is_absolute() and ".." not in path.parts
                  assert not member.issym() and not member.islnk()
              archive.extractall(kit, filter="data")
          assert (kit / "migration/clean_legacy.py").is_file()
          assert (kit / "overlay/docs/DEVELOPMENT.md").is_file()
          assert (kit / "overlay/scripts/hepta-docs.py").is_file()
          PY

      - name: Inventory and apply fail-closed legacy cleanup
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          kit="$HOME/hepta-v6-kit"
          report="$RUNNER_TEMP/hepta-v6-cleanup-report.json"
          python3 "$kit/migration/clean_legacy.py" \
            --repo "$GITHUB_WORKSPACE" \
            --apply \
            --report "$report" \
            > "$RUNNER_TEMP/hepta-v6-cleanup.log"
          python3 - "$report" <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert report["blockers"] == [], report["blockers"]
          print(f"legacy_documents={len(report['legacyDocuments'])}")
          print(f"obsolete_support={len(report['obsoleteSupportFiles'])}")
          print(f"safe_rewrites={len(report['safeRewrites'])}")
          PY

      - name: Install canonical V6 document system
        shell: bash
        run: |
          set -euo pipefail
          kit="$HOME/hepta-v6-kit"
          cp -a "$kit/overlay/." "$GITHUB_WORKSPACE/"
          rm -rf scripts/__pycache__ .hepta-v6-bootstrap
          rm -f .github/workflows/hepta-v6-migration-preview.yml
          chmod 0755 scripts/hepta-docs.py
          python3 scripts/hepta-docs.py generate-status
          git add -A

      - name: Verify canonical documents, DAGs, ownership and anti-legacy rules
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-docs.py verify
          python3 scripts/hepta-docs.py inventory-legacy \
            > "$RUNNER_TEMP/hepta-v6-post-cleanup-inventory.json"
          git diff --cached --check
          test -z "$(git status --porcelain --untracked-files=all | grep '^??' || true)"

      - name: Package exact staged delta
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/hepta-v6-migration-result"
          mkdir -p "$artifact"
          cp "$RUNNER_TEMP/hepta-v6-cleanup-report.json" "$artifact/cleanup-report.json"
          cp "$RUNNER_TEMP/hepta-v6-cleanup.log" "$artifact/cleanup.log"
          cp "$RUNNER_TEMP/hepta-v6-post-cleanup-inventory.json" "$artifact/post-cleanup-inventory.json"
          git diff --cached --no-renames --name-status "$BASE_COMMIT" > "$artifact/name-status.txt"
          git diff --cached --no-renames --name-only --diff-filter=D "$BASE_COMMIT" > "$artifact/deleted-paths.txt"
          git ls-files -s > "$artifact/full-index.txt"
          git diff --cached --binary --no-renames "$BASE_COMMIT" > "$artifact/delta.patch"
          python3 - "$BASE_COMMIT" "$artifact" <<'PY'
          import hashlib, pathlib, subprocess, sys, tarfile
          base, artifact_arg = sys.argv[1], sys.argv[2]
          artifact = pathlib.Path(artifact_arg)
          raw = subprocess.check_output([
              "git", "diff", "--cached", "--no-renames", "--name-only", "--diff-filter=AM", "-z", base
          ])
          paths = [pathlib.Path(x.decode("utf-8")) for x in raw.split(b"\0") if x]
          with tarfile.open(artifact / "changed-files.tar.gz", "w:gz") as archive:
              for path in paths:
                  archive.add(path, arcname=path.as_posix(), recursive=False)
          deleted = (artifact / "deleted-paths.txt").read_text(encoding="utf-8").splitlines()
          changed = subprocess.check_output([
              "git", "diff", "--cached", "--no-renames", "--name-only", base
          ], text=True).splitlines()
          posture = [
              f"base_commit={base}",
              f"bootstrap_head={subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()}",
              f"result_tree={subprocess.check_output(['git','write-tree'], text=True).strip()}",
              f"changed_paths={len(changed)}",
              f"deleted_paths={len(deleted)}",
              "authority_runtime=false",
              "authority_production=false",
              "authority_effect=false",
              "operator_acceptance=false",
              "promotion=false",
              "release=false",
          ]
          (artifact / "posture.txt").write_text("\n".join(posture) + "\n", encoding="utf-8")
          entries = []
          for path in sorted(p for p in artifact.iterdir() if p.name != "SHA256SUMS"):
              entries.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          (artifact / "SHA256SUMS").write_text("\n".join(entries) + "\n", encoding="utf-8")
          PY

      - name: Upload exact migration result
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-v6-document-migration-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-v6-migration-result
          if-no-files-found: error
          retention-days: 14
