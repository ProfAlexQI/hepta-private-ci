name: Hepta V6 document migration finalizer

on:
  push:
    branches:
      - codex/hepta-development-docs-v6-consolidation-20260831
    paths:
      - ".hepta-v6-bootstrap/**"
      - ".github/workflows/hepta-v6-migration-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-v6-document-migration-finalizer-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_COMMIT: b621768b70a09d56626bb8a2c331e3dc424e6a4d
  PAYLOAD_SHA256: 02fd9e992ad31ae40df2b346a502b7105ce4df918e23cd236c7097de11548214
  TARGET_BRANCH: codex/hepta-development-docs-v6-consolidation-20260831

jobs:
  finalize:
    name: Build, verify, commit, and publish canonical V6 document tree
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout exact finalizer head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact branch and clean input
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test "$(git rev-parse "$BASE_COMMIT^{commit}")" = "$BASE_COMMIT"
          test "$(git merge-base "$BASE_COMMIT" HEAD)" = "$BASE_COMMIT"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'

      - name: Reconstruct and verify migration kit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, pathlib, tarfile
          root = pathlib.Path.cwd()
          payload = pathlib.Path.home() / "hepta-v6-bootstrap.tar.xz"
          kit = pathlib.Path.home() / "hepta-v6-kit"
          parts = sorted((root / ".hepta-v6-bootstrap").glob("part-*.b64"))
          assert parts, "missing payload parts"
          encoded = "".join(p.read_text(encoding="utf-8") for p in parts)
          raw = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(raw).hexdigest() == "02fd9e992ad31ae40df2b346a502b7105ce4df918e23cd236c7097de11548214"
          payload.write_bytes(raw)
          kit.mkdir(parents=True, exist_ok=True)
          with tarfile.open(payload, "r:xz") as archive:
              for member in archive.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  assert not path.is_absolute() and ".." not in path.parts
                  assert not member.issym() and not member.islnk()
              archive.extractall(kit, filter="data")
          for required in (
              "migration/clean_legacy.py",
              "overlay/docs/DEVELOPMENT.md",
              "overlay/docs/CURRENT.json",
              "overlay/scripts/hepta-docs.py",
              "overlay/.github/workflows/hepta-development-docs.yml",
          ):
              assert (kit / required).is_file(), required
          PY

      - name: Apply reviewed cleanup-scanner correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path.home() / "hepta-v6-kit/migration/clean_legacy.py"
          text = path.read_text(encoding="utf-8")
          if '"readme.txt"' not in text.lower():
              old = "        if basename_counts[basename] == 1:\n"
              new = (
                  "        if (\n"
                  "            basename_counts[basename] == 1\n"
                  "            and basename.casefold() not in {\n"
                  "                \"readme\", \"readme.md\", \"readme.rst\", \"readme.txt\",\n"
                  "                \"current.json\", \"status.md\", \"development.md\"\n"
                  "            }\n"
                  "        ):\n"
              )
              assert text.count(old) == 1, "unexpected cleanup scanner shape"
              text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          assert '"readme.txt"' in path.read_text(encoding="utf-8").lower()
          PY
          python3 -m py_compile "$HOME/hepta-v6-kit/migration/clean_legacy.py"

      - name: Remove legacy development documents fail closed
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/hepta-v6-cleanup-report.json"
          python3 "$HOME/hepta-v6-kit/migration/clean_legacy.py" \
            --repo "$GITHUB_WORKSPACE" \
            --apply \
            --report "$report"
          python3 - "$report" <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["blockers"] == [], report["blockers"]
          assert len(report["legacyDocuments"]) == 138, len(report["legacyDocuments"])
          assert report["obsoleteSupportFiles"] == []
          assert report["safeRewrites"] == []
          print("legacy_documents_removed=138")
          PY

      - name: Install canonical V6 document system
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$HOME/hepta-v6-kit/overlay/." "$GITHUB_WORKSPACE/"
          rm -rf scripts/__pycache__ .hepta-v6-bootstrap
          rm -f .github/workflows/hepta-v6-migration-preview.yml
          chmod 0755 scripts/hepta-docs.py
          python3 scripts/hepta-docs.py generate-status
          git add -A

      - name: Verify canonical documents and exact migration delta
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-docs.py verify
          python3 scripts/hepta-docs.py inventory-legacy > "$RUNNER_TEMP/post-cleanup-inventory.json"
          python3 - "$RUNNER_TEMP/post-cleanup-inventory.json" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert data.get("legacyPaths") == [], data
          PY
          test -f docs/DEVELOPMENT.md
          test -f docs/CURRENT.json
          test -f docs/modules/MODULES.json
          test -f docs/delivery/WORK_PACKAGES.json
          test -f docs/control-plane/OBJECTIVES.json
          test ! -e docs/hepta-vnext/dropbox-current-2026-08-27
          test ! -e docs/architecture/HEPTA_VNEXT_LIVE_SHELL.md
          git diff --cached --check
          test -z "$(git status --porcelain --untracked-files=all | grep '^??' || true)"

      - name: Commit and push canonical V6 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(hepta): consolidate V6 development system and remove legacy plans"
          final_commit="$(git rev-parse HEAD)"
          final_tree="$(git rev-parse 'HEAD^{tree}')"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          {
            echo "final_commit=$final_commit"
            echo "final_tree=$final_tree"
            echo "legacy_documents_removed=138"
            echo "runtime_authority=false"
            echo "production_authority=false"
            echo "effect_authority=false"
            echo "operator_acceptance=false"
            echo "promotion=false"
            echo "release=false"
          } | tee "$RUNNER_TEMP/hepta-v6-final-result.txt"

      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-v6-finalizer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hepta-v6-cleanup-report.json
            ${{ runner.temp }}/post-cleanup-inventory.json
            ${{ runner.temp }}/hepta-v6-final-result.txt
          if-no-files-found: warn
          retention-days: 30
