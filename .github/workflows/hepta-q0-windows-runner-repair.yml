name: Hepta Q0 Windows hosted-runner repair

on:
  push:
    branches:
      - codex/hepta-intelligence-plan-v3-20260828
    paths:
      - .github/workflows/hepta-q0-windows-runner-repair.yml

permissions:
  contents: write

concurrency:
  group: hepta-q0-windows-runner-repair
  cancel-in-progress: true

jobs:
  repair:
    name: Replace unavailable Windows runner labels
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout exact carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Assert exact carrier identity
        shell: bash
        env:
          EXPECTED_BRANCH: codex/hepta-intelligence-plan-v3-20260828
          EXPECTED_PARENT: 4e41e182c89807e2d1c91c31b44987f6e400641c
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ProfHepta/hepta-private-ci"
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - name: Apply exact Windows runner repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/bazel.yml")
          text = path.read_text(encoding="utf-8")

          custom_job_runner = '''    runs-on:
              group: ${{ github.event.repository.name }}-runners
              labels: ${{ github.event.repository.name }}-windows-x64
          '''
          if text.count(custom_job_runner) != 2:
              raise AssertionError(
                  f"expected two job-level custom Windows runners, found {text.count(custom_job_runner)}"
              )
          text = text.replace(custom_job_runner, "    runs-on: windows-latest\n", 2)

          custom_matrix_runner = '''            runs_on:
                        group: ${{ github.event.repository.name }}-runners
                        labels: ${{ github.event.repository.name }}-windows-x64
          '''
          if text.count(custom_matrix_runner) != 2:
              raise AssertionError(
                  f"expected two matrix custom Windows runners, found {text.count(custom_matrix_runner)}"
              )
          text = text.replace(custom_matrix_runner, "", 2)

          dynamic_runner = "    runs-on: ${{ matrix.runs_on || matrix.os }}\n"
          if text.count(dynamic_runner) != 2:
              raise AssertionError(
                  f"expected two dynamic runner selectors, found {text.count(dynamic_runner)}"
              )
          text = text.replace(dynamic_runner, "    runs-on: ${{ matrix.os }}\n", 2)

          for forbidden in (
              "${{ github.event.repository.name }}-runners",
              "${{ github.event.repository.name }}-windows-x64",
              "matrix.runs_on",
          ):
              if forbidden in text:
                  raise AssertionError(f"unavailable runner selector remains: {forbidden}")

          path.write_text(text, encoding="utf-8")
          PY

          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/bazel.yml")'
          git diff --check
          test "$(git diff --name-only)" = ".github/workflows/bazel.yml"

      - name: Commit verified repair and retire carrier
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hepta-q0-windows-runner-repair.yml
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/bazel.yml")'
          git diff --check

          mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
          expected=(
            .github/workflows/bazel.yml
            .github/workflows/hepta-q0-windows-runner-repair.yml
          )
          test "${#changed[@]}" = "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done

          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "hepta-q0-bot"
          git config user.email "hepta-q0-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ci): run Windows Bazel gates on hosted runners"
          git push origin "HEAD:${GITHUB_REF_NAME}"
