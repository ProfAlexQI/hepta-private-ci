name: hepta-ui-v4-final-gap-closure-v3

on:
  push:
    branches: ["codex/ui-v4-executable-final-gap-closure-v3-*"]
  pull_request:
    paths:
      - "apps/hepta-control-ui/**"
      - "apps/hepta-native/src/shared/**"
      - "codex-rs/hepta-core/**"
      - "codex-rs/hepta-native-gateway/**"
      - "tools/hepta-ui-global-platform-source-closure/**"
      - "tools/hepta-ui-windows-product-host-safety/**"
      - "tools/hepta-ui-windows-product-host-device-drill/**"
      - "scripts/hepta-ui-v4-final-gap-closure-index-v3"
      - "scripts/hepta-ui-v4-executable-final-gap-closure-v3-gate"
      - "docs/ui/HEPTA_UI_EXECUTABLE_FINAL_GAP_CLOSURE_V3.json"
      - "docs/ui/HEPTA_UI_REMAINING_EXTERNAL_BLOCKERS_V7.json"
      - "docs/ui/schemas/hepta.ui.v4.final-gap-closure-index.v3.schema.json"
      - "docs/ui/HEPTA_UI_V4_TRANCHE_28_EXECUTABLE_FINAL_GAP_CLOSURE_2026-08-29.md"
      - ".github/workflows/hepta-ui-v4.yml"
      - ".github/workflows/hepta-ui-v4-final-gap-closure-v3.yml"
  workflow_dispatch:
    inputs:
      windows_device_artifact_id: {required: false, default: "", type: string}
      operator_acceptance_artifact_id: {required: false, default: "", type: string}
      macos_device_artifact_id: {required: false, default: "", type: string}
      ios_device_artifact_id: {required: false, default: "", type: string}
      android_device_artifact_id: {required: false, default: "", type: string}
      cross_browser_runtime_artifact_id: {required: false, default: "", type: string}
      browser_human_acceptance_artifact_id: {required: false, default: "", type: string}

permissions:
  contents: read
  actions: read

env:
  HEPTA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  HEPTA_RUST_TOOLCHAIN: "1.95.0"

concurrency:
  group: hepta-ui-v4-final-gap-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Final gap v3 source contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate exact source and contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_CANDIDATE_SHA"
          ruby -c scripts/hepta-ui-v4-final-gap-closure-index-v3
          ruby -c scripts/hepta-ui-v4-executable-final-gap-closure-v3-gate
          ruby -rjson -e 'ARGV.each { |p| JSON.parse(File.read(p)) }' \
            docs/ui/HEPTA_UI_EXECUTABLE_FINAL_GAP_CLOSURE_V3.json \
            docs/ui/HEPTA_UI_REMAINING_EXTERNAL_BLOCKERS_V7.json \
            docs/ui/schemas/hepta.ui.v4.final-gap-closure-index.v3.schema.json
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/hepta-ui-v4.yml"); YAML.parse_file(".github/workflows/hepta-ui-v4-final-gap-closure-v3.yml")'
          mkdir -p artifacts/source
          ruby scripts/hepta-ui-v4-final-gap-closure-index-v3 --self-test \
            | tee artifacts/source/index-self-test.json
          ruby scripts/hepta-ui-v4-executable-final-gap-closure-v3-gate \
            | tee artifacts/source/source-gate.json
          ruby -rjson -e '
            receipt=JSON.parse(File.read("artifacts/source/source-gate.json"))
            abort "source gate" unless receipt.fetch("status") == "PASS_EXECUTABLE_FINAL_GAP_CLOSURE_V3_SOURCE_ONLY"
            abort "authority escaped" unless %w[production_authority effect_authority live_adapter_authority operator_acceptance promotion release].all? { |key| receipt.fetch(key) == false }
          '
          printf '%s\n' "$HEPTA_CANDIDATE_SHA" > artifacts/source/candidate-commit.txt
          git rev-parse 'HEAD^{tree}' > artifacts/source/candidate-tree.txt
      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-ui-v4-final-gap-v3-source-${{ env.HEPTA_CANDIDATE_SHA }}
          path: artifacts/source
          if-no-files-found: error
          retention-days: 14

  served-native-contract:
    name: Final gap v3 served and Native contracts
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_CANDIDATE_SHA"
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Compile Rust-served bundle and Native contracts
        shell: bash
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail
          cargo check --manifest-path codex-rs/Cargo.toml -p hepta-core
          cargo check --manifest-path codex-rs/Cargo.toml -p hepta-native-gateway
          cargo test --manifest-path codex-rs/Cargo.toml -p hepta-core --test control_ui_v4_bundle
          cargo fmt --manifest-path apps/hepta-native/Cargo.toml -- --check
          cargo test --manifest-path apps/hepta-native/Cargo.toml --lib \
            shared::hepta_v4::tests::v4_contract_is_fail_closed_and_readable -- --exact
          cargo test --manifest-path apps/hepta-native/Cargo.toml --lib \
            shared::hepta_platform_material::tests::platform_profiles_are_bounded_and_fail_closed -- --exact
          cargo test --manifest-path apps/hepta-native/Cargo.toml --lib \
            shared::hepta_platform_material_runtime::tests::runtime_material_resolution_is_bounded_and_fail_closed -- --exact
      - name: Write served and Native receipt
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/served-native
          printf '{"schema":"hepta.ui.v4.served-native-executable.v1","candidate":{"commit":"%s","tree":"%s"},"rustToolchain":"%s","productBound":false,"systemMaterialBound":false,"authority":{"network":false,"mutation":false,"effect":false,"liveAdapter":false,"production":false,"operatorAcceptance":false,"promotion":false,"release":false}}\n' \
            "$HEPTA_CANDIDATE_SHA" "$(git rev-parse 'HEAD^{tree}')" "$HEPTA_RUST_TOOLCHAIN" \
            > artifacts/served-native/receipt.json
      - name: Upload served and Native receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-ui-v4-final-gap-v3-served-native-${{ env.HEPTA_CANDIDATE_SHA }}
          path: artifacts/served-native/receipt.json
          if-no-files-found: warn
          retention-days: 14

  platform-contract:
    name: Final gap v3 platform contracts (${{ matrix.os }})
    needs: source-contract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_CANDIDATE_SHA"
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Compile and test converged platform contracts
        shell: bash
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail
          global_manifest=tools/hepta-ui-global-platform-source-closure/Cargo.toml
          safety_manifest=tools/hepta-ui-windows-product-host-safety/Cargo.toml
          device_manifest=tools/hepta-ui-windows-product-host-device-drill/Cargo.toml

          cargo fmt --manifest-path "$global_manifest" -- --check
          cargo check --manifest-path "$global_manifest" --all-targets
          cargo test --manifest-path "$global_manifest" -- --nocapture

          cargo fmt --manifest-path "$safety_manifest" -- --check
          cargo check --manifest-path "$safety_manifest" --all-targets --no-default-features
          cargo test --manifest-path "$safety_manifest" --no-default-features -- --nocapture
          cargo check --manifest-path "$safety_manifest" --all-targets \
            --no-default-features --features hepta_ui_windows_system_material_v4
          cargo test --manifest-path "$safety_manifest" \
            --no-default-features --features hepta_ui_windows_system_material_v4 -- --nocapture

          cargo fmt --manifest-path "$device_manifest" -- --check
          cargo check --manifest-path "$device_manifest" --all-targets --no-default-features
          cargo check --manifest-path "$device_manifest" --all-targets \
            --no-default-features --features hepta_ui_windows_system_material_v4
      - name: Write platform executable receipt
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/platform
          printf '{"schema":"hepta.ui.v4.platform-executable.v1","candidate":{"commit":"%s","tree":"%s"},"platform":"%s","rustToolchain":"%s","productBound":false,"systemMaterialBound":false,"authority":{"network":false,"mutation":false,"effect":false,"liveAdapter":false,"production":false,"operatorAcceptance":false,"promotion":false,"release":false}}\n' \
            "$HEPTA_CANDIDATE_SHA" "$(git rev-parse 'HEAD^{tree}')" "${{ matrix.os }}" "$HEPTA_RUST_TOOLCHAIN" \
            > artifacts/platform/receipt.json
      - name: Upload platform executable receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-ui-v4-final-gap-v3-platform-${{ matrix.os }}-${{ env.HEPTA_CANDIDATE_SHA }}
          path: artifacts/platform/receipt.json
          if-no-files-found: warn
          retention-days: 14

  mobile-target-contract:
    name: Final gap v3 mobile target (${{ matrix.target }})
    needs: source-contract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, target: aarch64-apple-ios}
          - {os: ubuntu-latest, target: aarch64-linux-android}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_CANDIDATE_SHA"
      - name: Install Rust 1.95 target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - name: Compile target-specific platform contract
        shell: bash
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail
          cargo check \
            --manifest-path tools/hepta-ui-global-platform-source-closure/Cargo.toml \
            --lib --target "${{ matrix.target }}"
      - name: Write mobile target receipt
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/mobile
          printf '{"schema":"hepta.ui.v4.mobile-target-executable.v1","candidate":{"commit":"%s","tree":"%s"},"target":"%s","rustToolchain":"%s","productBound":false,"systemMaterialBound":false,"authority":{"network":false,"mutation":false,"effect":false,"liveAdapter":false,"production":false,"operatorAcceptance":false,"promotion":false,"release":false}}\n' \
            "$HEPTA_CANDIDATE_SHA" "$(git rev-parse 'HEAD^{tree}')" "${{ matrix.target }}" "$HEPTA_RUST_TOOLCHAIN" \
            > artifacts/mobile/receipt.json
      - name: Upload mobile target receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-ui-v4-final-gap-v3-mobile-${{ matrix.target }}-${{ env.HEPTA_CANDIDATE_SHA }}
          path: artifacts/mobile/receipt.json
          if-no-files-found: warn
          retention-days: 14

  final-index:
    name: Final UI executable gap closure index v3
    if: always()
    needs: [source-contract, served-native-contract, platform-contract, mobile-target-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      WINDOWS_ID: ${{ inputs.windows_device_artifact_id || '' }}
      OPERATOR_ID: ${{ inputs.operator_acceptance_artifact_id || '' }}
      MACOS_ID: ${{ inputs.macos_device_artifact_id || '' }}
      IOS_ID: ${{ inputs.ios_device_artifact_id || '' }}
      ANDROID_ID: ${{ inputs.android_device_artifact_id || '' }}
      BROWSER_RUNTIME_ID: ${{ inputs.cross_browser_runtime_artifact_id || '' }}
      BROWSER_HUMAN_ID: ${{ inputs.browser_human_acceptance_artifact_id || '' }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_CANDIDATE_SHA"
      - name: Produce same-run executable runner receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/input artifacts/output
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            > artifacts/output/jobs.json
          ruby -rjson -e '
            jobs=JSON.parse(File.read("artifacts/output/jobs.json")).fetch("jobs")
            candidate=ENV.fetch("HEPTA_CANDIDATE_SHA")
            required={
              "Final gap v3 source contract"=>["ubuntu-latest","Validate exact source and contracts"],
              "Final gap v3 served and Native contracts"=>["ubuntu-latest","Compile Rust-served bundle and Native contracts"],
              "Final gap v3 platform contracts (ubuntu-latest)"=>["ubuntu-latest","Compile and test converged platform contracts"],
              "Final gap v3 platform contracts (windows-latest)"=>["windows-latest","Compile and test converged platform contracts"],
              "Final gap v3 platform contracts (macos-latest)"=>["macos-latest","Compile and test converged platform contracts"],
              "Final gap v3 mobile target (aarch64-apple-ios)"=>["macos-latest","Compile target-specific platform contract"],
              "Final gap v3 mobile target (aarch64-linux-android)"=>["ubuntu-latest","Compile target-specific platform contract"]
            }
            selected=required.map do |name,(label,step_name)|
              matches=jobs.select { |job| job["name"] == name }
              if matches.length != 1
                next {"name"=>name,"qualified"=>false,"reason"=>"job count #{matches.length}","jobId"=>0,"runnerId"=>0,"runnerName"=>"","labels"=>[],"stepCount"=>0}
              end
              job=matches.fetch(0)
              steps=Array(job["steps"])
              step=steps.find { |entry| entry["name"] == step_name }
              qualified=job["head_sha"] == candidate &&
                job["status"] == "completed" &&
                job["conclusion"] == "success" &&
                job["runner_id"].to_i > 0 &&
                !job["runner_name"].to_s.empty? &&
                Array(job["labels"]).include?(label) &&
                !steps.empty? &&
                steps.all? { |entry| %w[success skipped].include?(entry["conclusion"]) } &&
                step && step["conclusion"] == "success"
              {
                "name"=>name,
                "jobId"=>job["id"],
                "runnerId"=>job["runner_id"].to_i,
                "runnerName"=>job["runner_name"].to_s,
                "labels"=>Array(job["labels"]),
                "stepCount"=>steps.length,
                "qualified"=>!!qualified
              }
            end
            pass=selected.length == 7 && selected.all? { |job| job["qualified"] }
            payload={
              "schema"=>"hepta.ui.v4.executable-runner-matrix.v1",
              "status"=>pass ? "PASS_EXACT_HEAD_EXECUTABLE_RUNNER_MATRIX" : "FAIL_EXACT_HEAD_EXECUTABLE_RUNNER_MATRIX",
              "candidate"=>{"commit"=>candidate,"tree"=>`git rev-parse HEAD^{tree}`.strip},
              "jobs"=>selected,
              "allRequiredJobsExecuted"=>pass,
              "allRequiredStepsSuccessful"=>pass,
              "exactHeadCheckedOut"=>pass,
              "servedBundleCompiled"=>pass,
              "nativeContractsTested"=>pass,
              "globalPlatformHarnessTested"=>pass,
              "windowsSafetyHarnessTested"=>pass,
              "iosTargetCompiled"=>pass,
              "androidTargetCompiled"=>pass,
              "boundary"=>{"productWired"=>false,"productCargoFeatureDeclared"=>false,"productModuleRegistered"=>false,"productLifecycleWired"=>false,"automaticBindingAllowed"=>false,"productHostMayBind"=>false,"productBound"=>false,"systemMaterialBound"=>false,"nativeProductRuntime"=>false,"deviceValidation"=>false},
              "authority"=>{"network"=>false,"mutation"=>false,"effect"=>false,"liveAdapter"=>false,"production"=>false,"operatorAcceptance"=>false,"promotion"=>false,"release"=>false},
              "failures"=>pass ? [] : ["one or more exact-head executable jobs lack successful non-empty assigned-runner execution"]
            }
            File.write("artifacts/input/runnerExecution.json",JSON.pretty_generate(payload)+"\n")
          '
      - name: Download explicit evidence by artifact ID
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/input archives artifacts/output
          download_one() {
            local slot="$1" id="$2"
            [[ -z "$id" ]] && return 0
            [[ "$id" =~ ^[1-9][0-9]*$ ]]
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id" \
              > "archives/$slot.metadata.json"
            ARTIFACT_ID="$id" ruby -rjson -e '
              m=JSON.parse(File.read(ARGV[0]))
              abort "artifact id drift" unless m.fetch("id").to_i == ENV.fetch("ARTIFACT_ID").to_i
              abort "expired" if m.fetch("expired")
              abort "unsafe artifact name" unless m.fetch("name").match?(/\A[A-Za-z0-9_.-]+\z/)
              url=m.fetch("archive_download_url")
              abort "unsafe url" unless url.start_with?("https://api.github.com/")
              puts url
            ' "archives/$slot.metadata.json" > "archives/$slot.url"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$(cat "archives/$slot.url")" > "archives/$slot.zip"
            unzip -Z1 "archives/$slot.zip" > "archives/$slot.entries"
            SLOT="$slot" ruby -e '
              entries=File.readlines("archives/#{ENV.fetch("SLOT")}.entries",chomp:true)
              abort "empty archive" if entries.empty?
              entries.each do |entry|
                abort "unsafe entry" if entry.empty? ||
                  entry.start_with?("/","\\") ||
                  entry.match?(/\A[A-Za-z]:/) ||
                  entry.tr("\\","/").split("/").include?("..")
              end
            '
            mkdir -p "artifacts/input/$slot"
            unzip -q "archives/$slot.zip" -d "artifacts/input/$slot"
            mapfile -t matches < <(find "artifacts/input/$slot" -type f -name '*.json' -print)
            [[ "${#matches[@]}" -eq 1 ]]
            cp "${matches[0]}" "artifacts/input/$slot.json"
          }
          download_one windowsDevice "$WINDOWS_ID"
          download_one operatorAcceptance "$OPERATOR_ID"
          download_one macosDevice "$MACOS_ID"
          download_one iosDevice "$IOS_ID"
          download_one androidDevice "$ANDROID_ID"
          download_one crossBrowserRuntime "$BROWSER_RUNTIME_ID"
          download_one browserHumanAcceptance "$BROWSER_HUMAN_ID"
      - name: Produce bounded final index
        id: index
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          args=(--candidate-commit "$HEPTA_CANDIDATE_SHA" --candidate-tree "$(git rev-parse 'HEAD^{tree}')" --evaluated-at-unix "$(date +%s)" --output artifacts/output/final-gap-closure.json)
          for slot in runnerExecution windowsDevice operatorAcceptance macosDevice iosDevice androidDevice crossBrowserRuntime browserHumanAcceptance; do
            path="artifacts/input/$slot.json"
            [[ -f "$path" ]] || continue
            flag="$(printf '%s' "$slot" | sed -E 's/([A-Z])/-\L\1/g')"
            args+=("--$flag" "$path")
          done
          ruby scripts/hepta-ui-v4-final-gap-closure-index-v3 "${args[@]}"
      - name: Enforce canonical result
        if: always()
        shell: bash
        env:
          INDEX_OUTCOME: ${{ steps.index.outcome }}
        run: |
          set -euo pipefail
          jq -e '.schema == "hepta.ui.v4.final-gap-closure-index.v3" and ([.authority[]] | all(. == false)) and ([.boundary[]] | all(. == false))' artifacts/output/final-gap-closure.json
          if [[ "$INDEX_OUTCOME" == "success" ]]; then
            jq -e '.status == "PASS_ALL_UI_GAPS_CLOSED" or .status == "BLOCKED_EXTERNAL_EVIDENCE_REQUIRED"' artifacts/output/final-gap-closure.json
          else
            jq -e '.status == "FAIL_UI_GAP_CLOSURE" and (.failures|length>0)' artifacts/output/final-gap-closure.json
            exit 1
          fi
      - name: Upload final executable gap index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-ui-v4-final-gap-v3-${{ env.HEPTA_CANDIDATE_SHA }}
          path: artifacts/output
          if-no-files-found: error
          retention-days: 14
