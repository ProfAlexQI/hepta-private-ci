name: Hepta inference V4 historical private-contract payload export

on:
  push:
    branches:
      - codex/hepta-inference-v4-closure-20260830
    paths:
      - .github/workflows/hepta-inference-v4-historical-payload-export.yml

permissions:
  contents: read

concurrency:
  group: hepta-inference-v4-historical-payload-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Export read-only historical payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git show \
            244acd51114f683809225b7fd2199c9ca8f9eff4:.github/qualification/hepta-inference-v4-private-contracts.patch.gz \
            > "$RUNNER_TEMP/hepta-inference-v4-private-contracts.patch.gz"
          gzip --test "$RUNNER_TEMP/hepta-inference-v4-private-contracts.patch.gz"
          gzip --decompress --stdout \
            "$RUNNER_TEMP/hepta-inference-v4-private-contracts.patch.gz" \
            > "$RUNNER_TEMP/hepta-inference-v4-private-contracts.patch"
          sha256sum \
            "$RUNNER_TEMP/hepta-inference-v4-private-contracts.patch.gz" \
            "$RUNNER_TEMP/hepta-inference-v4-private-contracts.patch" \
            > "$RUNNER_TEMP/SHA256SUMS"

      - name: Upload read-only payload
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-v4-historical-private-contracts-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hepta-inference-v4-private-contracts.patch.gz
            ${{ runner.temp }}/hepta-inference-v4-private-contracts.patch
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
