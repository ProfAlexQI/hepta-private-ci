name: Hepta Q0 exact E2 Clippy repair

on:
  push:
    branches:
      - codex/hepta-intelligence-plan-v3-20260828
    paths:
      - .github/workflows/hepta-q0-e2-clippy-repair.yml

permissions:
  contents: write

concurrency:
  group: hepta-q0-e2-clippy-repair
  cancel-in-progress: true

jobs:
  repair:
    name: Close exact E2 Clippy blockers
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout exact repair carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Assert exact carrier identity
        shell: bash
        env:
          EXPECTED_BRANCH: codex/hepta-intelligence-plan-v3-20260828
          EXPECTED_PARENT: 7357e84165962639c2382dea4550be482bf90d68
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ProfHepta/hepta-private-ci"
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - name: Install exact Rust formatter
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply exact ownership and source repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise AssertionError(
                      f"{path}: expected {expected} copies, found {count}: {old[:160]!r}"
                  )
              file.write_text(text.replace(old, new, expected), encoding="utf-8")

          matrix = "scripts/q0-qualification/20-rust-matrix.sh"
          for package in (
              "codex-hepta-memory",
              "codex-hepta-agent-protocol",
              "codex-hepta-supervisor",
              "codex-hepta-memory-extension",
              "codex-hepta-agentd",
          ):
              replace_exact(
                  matrix,
                  f"cargo clippy --locked -p {package} --all-targets -- -D warnings",
                  f"cargo clippy --locked -p {package} --all-targets --no-deps -- -D warnings",
              )
          replace_exact(
              matrix,
              "  cargo clippy --locked -p codex-hepta-agentd \\\n"
              "    --features qualification-intelligence-mutation-shadow \\\n"
              "    --all-targets -- -D warnings",
              "  cargo clippy --locked -p codex-hepta-agentd \\\n"
              "    --features qualification-intelligence-mutation-shadow \\\n"
              "    --all-targets --no-deps -- -D warnings",
          )

          replace_exact(
              "codex-rs/hepta-agent-protocol/src/lib.rs",
              "                binding.lease_head_sha256.clone(),",
              "                binding.lease_head_sha256,",
          )
          replace_exact(
              "codex-rs/hepta-supervisor/src/main.rs",
              ".ok_or_else(|| anyhow::anyhow!(\"missing value for {:?}\", flag))?;",
              ".ok_or_else(|| anyhow::anyhow!(\"missing value for {flag:?}\"))?;",
          )
          replace_exact(
              "codex-rs/hepta-supervisor/src/signed_authority.rs",
              "        let mut tampered = grant.clone();",
              "        let mut tampered = grant;",
          )
          replace_exact(
              "codex-rs/hepta-supervisor/src/signed_intent.rs",
              "            grant.clone(),",
              "            grant,",
          )

          replace_exact(
              "codex-rs/hepta-agentd/src/app_runtime.rs",
              "pub(crate) fn app_server_runtime_options(\n",
              "#[expect(\n"
              "    dead_code,\n"
              "    reason = \"the read-only constructor remains a qualification and regression seam\"\n"
              ")]\n"
              "pub(crate) fn app_server_runtime_options(\n",
          )
          replace_exact(
              "codex-rs/hepta-agentd/src/automation.rs",
              ".map_err(|error| QueueFailure::BeforeAdmission(error))?",
              ".map_err(QueueFailure::BeforeAdmission)?",
              expected=2,
          )
          replace_exact(
              "codex-rs/hepta-agentd/examples/h4_persistent_writer.rs",
              "        .filter_map(|entry| {\n"
              "            let name = entry.file_name().to_string_lossy().to_string();\n"
              "            let root = entry.path();\n"
              "            Some(CacheDeviceEvidence {\n"
              "                name,\n"
              "                model: read_trimmed(root.join(\"device/model\")),\n"
              "                write_cache: read_trimmed(root.join(\"queue/write_cache\")),\n"
              "                fua: read_trimmed(root.join(\"queue/fua\")),\n"
              "                rotational: read_trimmed(root.join(\"queue/rotational\")),\n"
              "                state: read_trimmed(root.join(\"device/state\")),\n"
              "            })\n"
              "        })",
              "        .map(|entry| {\n"
              "            let name = entry.file_name().to_string_lossy().to_string();\n"
              "            let root = entry.path();\n"
              "            CacheDeviceEvidence {\n"
              "                name,\n"
              "                model: read_trimmed(root.join(\"device/model\")),\n"
              "                write_cache: read_trimmed(root.join(\"queue/write_cache\")),\n"
              "                fua: read_trimmed(root.join(\"queue/fua\")),\n"
              "                rotational: read_trimmed(root.join(\"queue/rotational\")),\n"
              "                state: read_trimmed(root.join(\"device/state\")),\n"
              "            }\n"
              "        })",
          )
          replace_exact(
              "codex-rs/hepta-agentd/tests/two_agent_turn_recovery.rs",
              "            .lock()\n"
              "            .expect(\"request capture lock poisoned\")\n"
              "            .push(request.clone());",
              "            .lock()\n"
              "            .unwrap_or_else(std::sync::PoisonError::into_inner)\n"
              "            .push(request.clone());",
              expected=2,
          )
          replace_exact(
              "codex-rs/hepta-agentd/tests/cognitive_product_e2e.rs",
              "        .last()\n"
              "        .context(\"thread/read omitted the completed assistant message\")?;",
              "        .next_back()\n"
              "        .context(\"thread/read omitted the completed assistant message\")?;",
          )
          replace_exact(
              "codex-rs/hepta-agentd/tests/cognitive_product_e2e.rs",
              "        .last()\n"
              "        .context(\"external-provider turn omitted an assistant message\")?;",
              "        .next_back()\n"
              "        .context(\"external-provider turn omitted an assistant message\")?;",
          )
          replace_exact(
              "codex-rs/hepta-agentd/tests/cognitive_product_e2e.rs",
              "    Ok(matching.into_iter().next().expect(\"length checked\"))",
              "    matching\n"
              "        .into_iter()\n"
              "        .next()\n"
              "        .context(\"attached memory disappeared after exact-cardinality check\")",
          )
          PY

          rust_files=(
            codex-rs/hepta-agent-protocol/src/lib.rs
            codex-rs/hepta-supervisor/src/main.rs
            codex-rs/hepta-supervisor/src/signed_authority.rs
            codex-rs/hepta-supervisor/src/signed_intent.rs
            codex-rs/hepta-agentd/src/app_runtime.rs
            codex-rs/hepta-agentd/src/automation.rs
            codex-rs/hepta-agentd/examples/h4_persistent_writer.rs
            codex-rs/hepta-agentd/tests/two_agent_turn_recovery.rs
            codex-rs/hepta-agentd/tests/cognitive_product_e2e.rs
          )
          rustfmt --edition 2024 "${rust_files[@]}"
          rustfmt --edition 2024 --check "${rust_files[@]}"
          bash -n scripts/q0-qualification/20-rust-matrix.sh
          git diff --check

          mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
          expected=(
            codex-rs/hepta-agent-protocol/src/lib.rs
            codex-rs/hepta-agentd/examples/h4_persistent_writer.rs
            codex-rs/hepta-agentd/src/app_runtime.rs
            codex-rs/hepta-agentd/src/automation.rs
            codex-rs/hepta-agentd/tests/cognitive_product_e2e.rs
            codex-rs/hepta-agentd/tests/two_agent_turn_recovery.rs
            codex-rs/hepta-supervisor/src/main.rs
            codex-rs/hepta-supervisor/src/signed_authority.rs
            codex-rs/hepta-supervisor/src/signed_intent.rs
            scripts/q0-qualification/20-rust-matrix.sh
          )
          test "${#changed[@]}" = "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "hepta-q0-bot"
          git config user.email "hepta-q0-bot@users.noreply.github.com"
          git add \
            codex-rs/hepta-agent-protocol/src/lib.rs \
            codex-rs/hepta-agentd/examples/h4_persistent_writer.rs \
            codex-rs/hepta-agentd/src/app_runtime.rs \
            codex-rs/hepta-agentd/src/automation.rs \
            codex-rs/hepta-agentd/tests/cognitive_product_e2e.rs \
            codex-rs/hepta-agentd/tests/two_agent_turn_recovery.rs \
            codex-rs/hepta-supervisor/src/main.rs \
            codex-rs/hepta-supervisor/src/signed_authority.rs \
            codex-rs/hepta-supervisor/src/signed_intent.rs \
            scripts/q0-qualification/20-rust-matrix.sh
          git diff --cached --check
          git commit -m "fix(ci): isolate Q0 Clippy ownership and close E2 lints"
          git push origin "HEAD:${GITHUB_REF_NAME}"
