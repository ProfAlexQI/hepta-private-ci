name: Hepta UI v5 remediation v22 diagnostic

on:
  push:
    branches:
      - ops/ui-v5-remediation-v22-diagnostic-20260830
    paths:
      - .github/workflows/hepta-ui-v5-remediation-v22-diagnostic.yml

permissions:
  contents: write

concurrency:
  group: hepta-ui-v5-remediation-v22-diagnostic
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'ProfHepta/hepta-private-ci'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      BRANCH: codex/ui-v5-plan-and-repo-gap-closure-20260829
      EXPECTED_PARENT: 3f2d8192439e8fcc5cb030011202a4f58ceda082
      BOOTSTRAP_PATH: .github/workflows/hepta-ui-v5-remediation-v22-diagnostic.yml
      UPSTREAM_URL: https://github.com/openai/codex.git
      UPSTREAM_PREVIOUS: 61a44880a85d2fd0d8770908dea5733495e571c8
      UPSTREAM_ROLE: current_r12
      UPSTREAM_FROZEN_REF: refs/remotes/upstream/hepta-intake-20260830-r12
      UPSTREAM_INTAKE_PATH: docs/architecture/HEPTA_UPSTREAM_CODEX_CURRENT_INTAKE_2026-08-30_R12.json
      UPSTREAM_RECORD_PATH: docs/architecture/HEPTA_UPSTREAM_CODEX_R12_SEMANTIC_ABSORPTION_RECORD_2026-08-30.json
      V12_DRIVER_COMMIT: 554d710f6a561166553f3c01fafc5b27cd8c28b9
      V14_DRIVER_COMMIT: 3f2d8192439e8fcc5cb030011202a4f58ceda082
      V18_DRIVER_COMMIT: 022b91a04f443d7fe4ca2bce853bc26bccf99f84
      V20_DRIVER_COMMIT: 781c237dbc81f49d3f22432b341d904aaa929291
      V21_DRIVER_COMMIT: 628b014c4471c9b8d3bbd6cf38b9920112173697
      EVIDENCE_DIR: artifacts/ui-v5-remediation-v22
    steps:
      - name: Check out exact v22 diagnostic driver commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install deterministic remediation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes jq ripgrep ruby patch
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --no-self-update

      - name: Execute exact v21 logic and retain original exit status
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"

          source_workflow="$RUNNER_TEMP/hepta-ui-v5-remediation-v21.yml"
          generated_driver="$RUNNER_TEMP/hepta-ui-v5-remediation-v22-driver.sh"
          if ! git cat-file -e "$V21_DRIVER_COMMIT^{commit}"; then
            git fetch --no-tags origin "$V21_DRIVER_COMMIT"
          fi
          git show "$V21_DRIVER_COMMIT:.github/workflows/hepta-ui-v5-remediation-v21.yml" > "$source_workflow"
          awk '
            /      - name: Execute v20 remediation with exact duplicate payload semantics/ { found=1; next }
            found && /        shell: bash/ { next }
            found && /        run: \|/ { in_run=1; next }
            in_run { sub(/^          /, ""); print }
          ' "$source_workflow" > "$generated_driver"
          test -s "$generated_driver"
          bash -n "$generated_driver"
          cp "$source_workflow" "$EVIDENCE_DIR/hepta-ui-v5-remediation-v21.yml"
          cp "$generated_driver" "$EVIDENCE_DIR/hepta-ui-v5-remediation-v22-driver.sh"

          set +e
          bash -x "$generated_driver" > "$EVIDENCE_DIR/execution.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$EVIDENCE_DIR/exit-code.txt"
          printf 'exit_code=%s\n' "$rc" >> "$GITHUB_OUTPUT"
          tail -n 300 "$EVIDENCE_DIR/execution.log"

      - name: Capture exact candidate state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          git rev-parse HEAD > "$EVIDENCE_DIR/head.txt"
          git rev-parse HEAD^{tree} > "$EVIDENCE_DIR/tree.txt"
          git log --oneline --decorate -n 12 > "$EVIDENCE_DIR/log.txt"
          git status --short > "$EVIDENCE_DIR/status.txt"
          git diff --check > "$EVIDENCE_DIR/diff-check.txt" 2>&1 || true
          git diff --binary "$GITHUB_SHA" > "$EVIDENCE_DIR/candidate.patch"
          git diff --stat "$GITHUB_SHA" > "$EVIDENCE_DIR/candidate.stat"
          git diff --name-status "$GITHUB_SHA" > "$EVIDENCE_DIR/candidate.names"
          if ! git diff --quiet "$GITHUB_SHA"; then
            mapfile -d '' paths < <(git diff --name-only -z "$GITHUB_SHA")
            if [[ "${#paths[@]}" -gt 0 ]]; then
              tar -czf "$EVIDENCE_DIR/changed-files.tar.gz" -- "${paths[@]}"
            fi
          fi
          find "$RUNNER_TEMP" -maxdepth 1 -type f -name 'hepta-ui-v5-*' -print0 \
            | xargs -0 -r -I{} cp {} "$EVIDENCE_DIR/"
          (
            cd "$EVIDENCE_DIR"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 shasum -a 256 > SHA256SUMS
          )

      - name: Upload candidate and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-ui-v5-remediation-v22-${{ github.sha }}
          path: artifacts/ui-v5-remediation-v22/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve fail-closed result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rc="$(cat "$EVIDENCE_DIR/exit-code.txt" 2>/dev/null || printf '1')"
          exit "$rc"
