name: Hepta inference INF-2A adapter contract repair macOS

on:
  push:
    branches:
      - codex/hepta-inference-inf2a-adapter-contract-20260829
    paths:
      - ".github/workflows/hepta-inference-inf2a-adapter-contract-repair-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    name: Repair and qualify adapter contract on macOS
    runs-on: macos-15
    timeout-minutes: 45
    env:
      EXPECTED_PARENT: b3ad1ec159ced05617813502192a73623954108b
      SELF: .github/workflows/hepta-inference-inf2a-adapter-contract-repair-macos.yml
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify isolated workflow commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = "$SELF"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy
      - name: Repair and execute all exact gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-inference-inf2a-adapter-contract-repair.py
          cargo fmt --manifest-path codex-rs/hepta-infer-adapter/Cargo.toml
          cargo generate-lockfile --manifest-path codex-rs/hepta-infer-adapter/Cargo.toml
          python3 scripts/hepta-inference-inf2a-adapter-contract-source-gate.py
          cargo fmt --manifest-path codex-rs/hepta-infer-adapter/Cargo.toml -- --check
          cargo test --manifest-path codex-rs/hepta-infer-adapter/Cargo.toml --locked
          cargo clippy --manifest-path codex-rs/hepta-infer-adapter/Cargo.toml \
            --all-targets --locked -- -D warnings
      - name: Export corrected source and receipt
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/hepta-inference-inf2a-adapter-contract-repair"
          mkdir -p "$out/codex-rs/hepta-infer-adapter/src"
          cp codex-rs/hepta-infer-adapter/Cargo.toml "$out/codex-rs/hepta-infer-adapter/"
          cp codex-rs/hepta-infer-adapter/Cargo.lock "$out/codex-rs/hepta-infer-adapter/"
          cp codex-rs/hepta-infer-adapter/src/lib.rs "$out/codex-rs/hepta-infer-adapter/src/"
          {
            echo "parent=$EXPECTED_PARENT"
            echo "runner=macos-15"
            echo "source_gate=PASS"
            echo "cargo_fmt=PASS"
            echo "cargo_test=PASS"
            echo "strict_clippy=PASS"
            echo "duplicate_registration_preserves_original=PASS"
            echo "product_wiring=false"
            echo "production_qualified=false"
          } > "$out/receipt.txt"
          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 > "$out/SHA256SUMS"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-inf2a-adapter-contract-repair-macos-${{ env.EXPECTED_PARENT }}
          path: ${{ runner.temp }}/hepta-inference-inf2a-adapter-contract-repair
          if-no-files-found: error
          retention-days: 14
