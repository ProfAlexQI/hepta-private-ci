name: Hepta inference v2 bounded runtime source publisher v2

on:
  push:
    branches:
      - automation/hepta-inference-v2-runtime-closure-publisher-20260829
    paths:
      - ".github/workflows/hepta-inference-v2-runtime-closure-publisher-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-inference-v2-bounded-runtime-source-publisher-v2
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/hepta-inference-gap-closure-20260829
  EXPECTED_TARGET: 211948a45874890d69cb60b1bdafd946da2fc77f
  PAYLOAD_SHA256: fbc9c7cf4931f6c2a53dc448ac3089344ae0ee2ac7e6ce226d4c4950a7c3a590
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Qualify and fast-forward eight runtime crates
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reconstruct immutable payload and enforce archive boundary
        shell: bash
        run: |
          set -euo pipefail
          root=tools/hepta-inference-v2-publisher
          expected_sizes=(16000 8000 8000 8000 5264)
          for index in 0 1 2 3 4; do
            file="$root/payload.part0$index"
            test "$(wc -c < "$file" | tr -d ' ')" = "${expected_sizes[$index]}"
          done
          cat "$root"/payload.part* | base64 --decode > "$RUNNER_TEMP/runtime-source.tar.gz"
          echo "$PAYLOAD_SHA256  $RUNNER_TEMP/runtime-source.tar.gz" | sha256sum --check --strict
          python3 - "$RUNNER_TEMP/runtime-source.tar.gz" <<'PY'
          import pathlib
          import sys
          import tarfile

          archive = pathlib.Path(sys.argv[1])
          roots = {
              "codex-rs/hepta-infer-backend-v1",
              "codex-rs/hepta-infer-core/tests/terminal_receipt_query.rs",
              "codex-rs/hepta-infer-input-lease",
              "codex-rs/hepta-infer-model-registry",
              "codex-rs/hepta-infer-product-bridge",
              "codex-rs/hepta-infer-router",
              "codex-rs/hepta-infer-scheduler",
              "codex-rs/hepta-infer-semantic",
              "codex-rs/hepta-infer-worker-host",
          }
          with tarfile.open(archive, "r:gz") as handle:
              members = handle.getmembers()
              if not members:
                  raise SystemExit("empty source payload")
              for member in members:
                  raw = pathlib.PurePosixPath(member.name)
                  if raw.is_absolute() or ".." in raw.parts:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  rendered = raw.as_posix().removeprefix("./").rstrip("/")
                  if not rendered:
                      if member.isdir():
                          continue
                      raise SystemExit(f"invalid archive root member: {member.name}")
                  if member.isdir():
                      if rendered == "codex-rs" or any(
                          root == rendered or root.startswith(rendered + "/") for root in roots
                      ):
                          continue
                      raise SystemExit(f"out-of-scope archive directory: {member.name}")
                  if not member.isfile():
                      raise SystemExit(f"non-regular archive member: {member.name}")
                  if not any(rendered == root or rendered.startswith(root + "/") for root in roots):
                      raise SystemExit(f"out-of-scope archive file: {member.name}")
          print("PASS_HEPTA_INFERENCE_V2_ARCHIVE_BOUNDARY")
          PY

      - name: Bind exact target head and materialize source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_TARGET"
          git checkout --detach "$EXPECTED_TARGET"
          test -z "$(git status --porcelain)"
          tar -xzf "$RUNNER_TEMP/runtime-source.tar.gz"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/Cargo.toml")
          text = path.read_text(encoding="utf-8")
          old_members = '''    "hepta-infer-core",
              "hepta-infer-client",
              "hepta-inferd",'''
          new_members = '''    "hepta-infer-backend-v1",
              "hepta-infer-core",
              "hepta-infer-client",
              "hepta-infer-input-lease",
              "hepta-infer-model-registry",
              "hepta-infer-product-bridge",
              "hepta-infer-router",
              "hepta-infer-scheduler",
              "hepta-infer-semantic",
              "hepta-infer-worker-host",
              "hepta-inferd",'''
          old_dependencies = '''codex-hepta-infer-core = { path = "hepta-infer-core" }
          codex-hepta-infer-client = { path = "hepta-infer-client" }
          codex-hepta-inferd = { path = "hepta-inferd" }'''
          new_dependencies = '''codex-hepta-infer-backend-v1 = { path = "hepta-infer-backend-v1" }
          codex-hepta-infer-core = { path = "hepta-infer-core" }
          codex-hepta-infer-client = { path = "hepta-infer-client" }
          codex-hepta-infer-input-lease = { path = "hepta-infer-input-lease" }
          codex-hepta-infer-model-registry = { path = "hepta-infer-model-registry" }
          codex-hepta-infer-product-bridge = { path = "hepta-infer-product-bridge" }
          codex-hepta-infer-router = { path = "hepta-infer-router" }
          codex-hepta-infer-scheduler = { path = "hepta-infer-scheduler" }
          codex-hepta-infer-semantic = { path = "hepta-infer-semantic" }
          codex-hepta-infer-worker-host = { path = "hepta-infer-worker-host" }
          codex-hepta-inferd = { path = "hepta-inferd" }'''
          if old_members not in text or old_dependencies not in text:
              raise SystemExit("workspace insertion anchors drifted")
          path.write_text(
              text.replace(old_members, new_members, 1).replace(
                  old_dependencies, new_dependencies, 1
              ),
              encoding="utf-8",
          )
          PY

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Extend lock graph without external dependency drift
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/runtime-metadata.json"
          python3 - "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock <<'PY'
          import pathlib
          import sys
          import tomllib

          before = tomllib.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          after = tomllib.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          before_packages = before.get("package", [])
          after_packages = after.get("package", [])
          expected_new = {
              "codex-hepta-infer-backend-v1",
              "codex-hepta-infer-input-lease",
              "codex-hepta-infer-model-registry",
              "codex-hepta-infer-product-bridge",
              "codex-hepta-infer-router",
              "codex-hepta-infer-scheduler",
              "codex-hepta-infer-semantic",
              "codex-hepta-infer-worker-host",
          }
          external_before = {
              (item["name"], item["version"], item.get("source"), item.get("checksum"))
              for item in before_packages if item.get("source")
          }
          external_after = {
              (item["name"], item["version"], item.get("source"), item.get("checksum"))
              for item in after_packages if item.get("source")
          }
          if external_before != external_after:
              raise SystemExit("external Cargo.lock graph drifted")
          names_before = {item["name"] for item in before_packages}
          names_after = {item["name"] for item in after_packages}
          if names_after - names_before != expected_new:
              raise SystemExit(f"unexpected local packages: {sorted(names_after - names_before)}")
          print("PASS_HEPTA_INFERENCE_V2_LOCK_BOUNDARY")
          PY

      - name: Rust 1.95 formatting, check, test, and strict Clippy
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          packages=(
            codex-hepta-infer-core
            codex-hepta-infer-client
            codex-hepta-inferd
            codex-hepta-infer-backend-v1
            codex-hepta-infer-input-lease
            codex-hepta-infer-model-registry
            codex-hepta-infer-product-bridge
            codex-hepta-infer-router
            codex-hepta-infer-scheduler
            codex-hepta-infer-semantic
            codex-hepta-infer-worker-host
          )
          args=()
          for package in "${packages[@]}"; do args+=( -p "$package" ); done
          cargo fmt "${args[@]}"
          cargo fmt "${args[@]}" -- --check
          cargo check --locked --all-targets "${args[@]}" |& tee "$RUNNER_TEMP/runtime-cargo-check.log"
          cargo test --locked --all-targets "${args[@]}" -- --test-threads=1 |& tee "$RUNNER_TEMP/runtime-cargo-test.log"
          cargo clippy --locked --all-targets --no-deps "${args[@]}" -- -D warnings |& tee "$RUNNER_TEMP/runtime-cargo-clippy.log"

      - name: Enforce exact changed-path boundary
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python3 - <<'PY'
          import subprocess

          changed = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines()
          exact = {
              "codex-rs/Cargo.toml",
              "codex-rs/Cargo.lock",
              "codex-rs/hepta-infer-core/tests/terminal_receipt_query.rs",
          }
          crate_roots = (
              "hepta-infer-backend-v1",
              "hepta-infer-input-lease",
              "hepta-infer-model-registry",
              "hepta-infer-product-bridge",
              "hepta-infer-router",
              "hepta-infer-scheduler",
              "hepta-infer-semantic",
              "hepta-infer-worker-host",
          )
          prefixes = tuple(f"codex-rs/{name}/" for name in crate_roots)
          unexpected = [path for path in changed if path not in exact and not path.startswith(prefixes)]
          if unexpected:
              raise SystemExit(f"changed-path escape: {unexpected}")
          missing = [prefix for prefix in prefixes if not any(path.startswith(prefix) for path in changed)]
          if missing:
              raise SystemExit(f"missing crate source: {missing}")
          if "codex-rs/Cargo.toml" not in changed or "codex-rs/Cargo.lock" not in changed:
              raise SystemExit("workspace binding or lockfile is missing")
          print("PASS_HEPTA_INFERENCE_V2_CHANGED_PATH_BOUNDARY")
          PY
          git diff --cached --check

      - name: Create source commit and non-force fast-forward target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(inference): add bounded runtime closure foundations INF-2B through INF-5"
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_TARGET"
          git push origin HEAD:"refs/heads/$TARGET_BRANCH"
          {
            echo "source_sha=$source_sha"
            echo "source_tree=$source_tree"
            echo "source_parent=$EXPECTED_TARGET"
            echo "payload_sha256=$PAYLOAD_SHA256"
            echo "qualification_only=true"
            echo "native_llamacpp_inference=false"
            echo "hardware_performance=false"
            echo "product_default_route_changed=false"
            echo "operator_accepted=false"
            echo "promoted=false"
            echo "released=false"
          } | tee "$RUNNER_TEMP/runtime-publisher-receipt.txt"

      - name: Upload deterministic publisher evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-v2-runtime-source-publisher-v2-${{ github.sha }}
          path: |
            ${{ runner.temp }}/runtime-metadata.json
            ${{ runner.temp }}/runtime-cargo-check.log
            ${{ runner.temp }}/runtime-cargo-test.log
            ${{ runner.temp }}/runtime-cargo-clippy.log
            ${{ runner.temp }}/runtime-publisher-receipt.txt
          if-no-files-found: warn
          retention-days: 30
