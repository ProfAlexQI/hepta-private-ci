name: Hepta UI v5 remediation v14

on:
  push:
    branches:
      - ops/ui-v5-remediation-v14-20260830
    paths:
      - .github/workflows/hepta-ui-v5-remediation-v14.yml

permissions:
  contents: write

concurrency:
  group: hepta-ui-v5-remediation-v14
  cancel-in-progress: true

jobs:
  remediate:
    if: github.repository == 'ProfHepta/hepta-private-ci'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BRANCH: codex/ui-v5-plan-and-repo-gap-closure-20260829
      EXPECTED_PARENT: 3f2d8192439e8fcc5cb030011202a4f58ceda082
      BOOTSTRAP_PATH: .github/workflows/hepta-ui-v5-remediation-v14.yml
      UPSTREAM_URL: https://github.com/openai/codex.git
      UPSTREAM_PREVIOUS: 61a44880a85d2fd0d8770908dea5733495e571c8
      UPSTREAM_ROLE: current_r12
      UPSTREAM_FROZEN_REF: refs/remotes/upstream/hepta-intake-20260830-r12
      UPSTREAM_INTAKE_PATH: docs/architecture/HEPTA_UPSTREAM_CODEX_CURRENT_INTAKE_2026-08-30_R12.json
      UPSTREAM_RECORD_PATH: docs/architecture/HEPTA_UPSTREAM_CODEX_R12_SEMANTIC_ABSORPTION_RECORD_2026-08-30.json
      V12_DRIVER_COMMIT: 554d710f6a561166553f3c01fafc5b27cd8c28b9
    steps:
      - name: Check out exact v14 driver commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install deterministic remediation tools
        shell: bash
        run: |
          set -euo pipefail
          brew install jq ripgrep gnu-sed
          printf '%s\n' "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --no-self-update

      - name: Execute v12 remediation with canonical route regeneration
        shell: bash
        run: |
          set -euo pipefail

          source_workflow="$RUNNER_TEMP/hepta-ui-v5-remediation-v12.yml"
          generated_driver="$RUNNER_TEMP/hepta-ui-v5-remediation-v14-driver.sh"
          git cat-file -e "$V12_DRIVER_COMMIT^{commit}"
          git show "$V12_DRIVER_COMMIT:.github/workflows/hepta-ui-v5-remediation-v12.yml" > "$source_workflow"
          awk '
            /      - name: Extend, verify, and publish the exact remediation/ { found=1; next }
            found && /        shell: bash/ { next }
            found && /        run: \|/ { in_run=1; next }
            in_run { sub(/^          /, ""); print }
          ' "$source_workflow" > "$generated_driver"
          test -s "$generated_driver"

          export GENERATED_DRIVER="$generated_driver"
          python3 <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          path = Path(os.environ["GENERATED_DRIVER"])
          text = path.read_text(encoding="utf-8")
          anchor = 'bash -n "$generated_script"\nbash -x "$generated_script"\n'
          if text.count(anchor) != 1:
              raise SystemExit(
                  f"v14 generated-script execution anchor: expected 1 match, found {text.count(anchor)}"
              )
          patched = r'''bash -n "$generated_script"
          export FINAL_GENERATED_SCRIPT="$generated_script"
          python3 <<'ROUTE'
          from __future__ import annotations

          import os
          from pathlib import Path

          path = Path(os.environ["FINAL_GENERATED_SCRIPT"])
          text = path.read_text(encoding="utf-8")
          anchor = 'ruby -c scripts/hepta-ui-v4-exact-candidate-materialization-gate\n'
          if text.count(anchor) != 1:
              raise SystemExit(
                  f"route-catalog apply anchor: expected 1 match, found {text.count(anchor)}"
              )
          text = text.replace(
              anchor,
              'scripts/hepta-native-route-catalog apply\n' + anchor,
              1,
          )
          path.write_text(text, encoding="utf-8")
          ROUTE
          bash -n "$generated_script"
          bash -x "$generated_script"
          '''
          text = text.replace(anchor, patched, 1)
          path.write_text(text, encoding="utf-8")
          PY

          bash -n "$generated_driver"
          bash -x "$generated_driver"
