name: Temporary transport cleanup

on:
  push:
    branches:
      - codex/tmp-generate-cargo-lock-20260902

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Cancel only the stale known carrier run
        shell: bash
        run: |
          set -euo pipefail
          run_id=33621399122
          status="$(gh api "/repos/${REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || true)"
          if [[ "$status" == "queued" || "$status" == "in_progress" || "$status" == "waiting" || "$status" == "requested" || "$status" == "pending" ]]; then
            gh api --method POST "/repos/${REPOSITORY}/actions/runs/${run_id}/cancel"
          fi

      - name: Close only exact temporary audit PRs
        shell: bash
        run: |
          set -euo pipefail
          for number in 292 293; do
            state="$(gh api "/repos/${REPOSITORY}/pulls/${number}" --jq '.state' 2>/dev/null || true)"
            if [[ "$state" == "open" ]]; then
              gh api --method PATCH "/repos/${REPOSITORY}/pulls/${number}" -f state=closed >/dev/null
            fi
          done

      - name: Close exact accidental diagnostic sentinel issue
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${REPOSITORY}/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null and .title == "DO NOT CREATE - CI sentinel") | .number' \
            | while read -r number; do
                [[ -n "$number" ]] || continue
                gh api --method PATCH "/repos/${REPOSITORY}/issues/${number}" -f state=closed >/dev/null
              done
