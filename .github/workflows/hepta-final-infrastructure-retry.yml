name: Hepta final infrastructure-only retry

on:
  push:
    branches:
      - codex/hepta-final-ci-observer-20260902
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: hepta-final-infrastructure-retry-20260902
  cancel-in-progress: true

jobs:
  retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      HEAD_BRANCH: codex/hepta-v8-repository-closure-final-20260902
    steps:
      - name: Retry only failed jobs that never started source execution
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(gh api "/repos/${REPOSITORY}/pulls?state=open&head=TrillionniumFoundation:${HEAD_BRANCH}")"
          test "$(jq 'length' <<<"$pr_json")" = "1"
          head_sha="$(jq -r '.[0].head.sha' <<<"$pr_json")"

          deadline=$((SECONDS + 3600))
          for attempt in 1 2 3; do
            while (( SECONDS < deadline )); do
              runs="$(gh api "/repos/${REPOSITORY}/actions/runs?head_sha=${head_sha}&event=pull_request&per_page=100" --jq '.workflow_runs')"
              [[ "$(jq 'length' <<<"$runs")" != "0" ]] || { sleep 15; continue; }
              active="$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")"
              [[ "$active" = "0" ]] && break
              sleep 20
            done

            retried=0
            while read -r run_id; do
              [[ -n "$run_id" ]] || continue
              jobs="$(gh api "/repos/${REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" --jq '.jobs')"
              failed_count="$(jq '[.[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "startup_failure")] | length' <<<"$jobs")"
              [[ "$failed_count" != "0" ]] || continue
              started_step_count="$(jq '[.[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "startup_failure") | (.steps // [])[] | select(.status == "completed" or .status == "in_progress")] | length' <<<"$jobs")"
              if [[ "$started_step_count" = "0" ]]; then
                gh api --method POST "/repos/${REPOSITORY}/actions/runs/${run_id}/rerun-failed-jobs"
                retried=$((retried + 1))
              fi
            done < <(jq -r '.[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "startup_failure") | .id' <<<"$runs")

            [[ "$retried" != "0" ]] || break
            sleep 30
          done
