name: Hepta architecture P0.2 portability bootstrap

on:
  push:
    branches:
      - codex/hepta-architecture-convergence-p0-2-20260828
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-architecture-p0-2-portability-bootstrap
  cancel-in-progress: true

jobs:
  harden-and-verify:
    name: Apply bounded portability hardening
    if: ${{ !contains(github.event.head_commit.message || '', '[hepta-portability-bootstrap]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout latest exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/hepta-architecture-convergence-p0-2-20260828
          fetch-depth: 2
          persist-credentials: true

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Apply deterministic portability patch
        run: python3 scripts/hepta-architecture-p0-2-portability-bootstrap.py

      - name: Format exact fault source
        working-directory: codex-rs
        run: cargo fmt -p codex-hepta-contracts

      - name: Enforce changed-path allowlist
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if test -z "$changed"; then
            echo "No portability delta."
            exit 0
          fi
          test "$changed" = "codex-rs/hepta-contracts/tests/cross_owner_fault_matrix.rs"
          git diff --check

      - name: Execute fault matrix
        working-directory: codex-rs
        run: cargo test --locked -p codex-hepta-contracts --test cross_owner_fault_matrix -- --nocapture

      - name: Strict fault-matrix Clippy
        working-directory: codex-rs
        run: cargo clippy --locked -p codex-hepta-contracts --test cross_owner_fault_matrix -- -D warnings

      - name: Commit exact hardening only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Hepta qualification bootstrap"
          git config user.email "102159240+ProfAlexQI@users.noreply.github.com"
          git add codex-rs/hepta-contracts/tests/cross_owner_fault_matrix.rs
          git diff --cached --check
          git commit -m "fix(hepta): make durable journal test portable [hepta-portability-bootstrap]"
          git push origin HEAD:refs/heads/codex/hepta-architecture-convergence-p0-2-20260828
