name: Hepta UI v5 remediation v18

on:
  push:
    branches:
      - ops/ui-v5-remediation-v18-20260830
    paths:
      - .github/workflows/hepta-ui-v5-remediation-v18.yml

permissions:
  contents: write

concurrency:
  group: hepta-ui-v5-remediation-v18
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'ProfHepta/hepta-private-ci'
    runs-on: macos-15
    timeout-minutes: 75
    env:
      BRANCH: codex/ui-v5-plan-and-repo-gap-closure-20260829
      EXPECTED_PARENT: 3f2d8192439e8fcc5cb030011202a4f58ceda082
      BOOTSTRAP_PATH: .github/workflows/hepta-ui-v5-remediation-v18.yml
      UPSTREAM_URL: https://github.com/openai/codex.git
      UPSTREAM_PREVIOUS: 61a44880a85d2fd0d8770908dea5733495e571c8
      UPSTREAM_ROLE: current_r12
      UPSTREAM_FROZEN_REF: refs/remotes/upstream/hepta-intake-20260830-r12
      UPSTREAM_INTAKE_PATH: docs/architecture/HEPTA_UPSTREAM_CODEX_CURRENT_INTAKE_2026-08-30_R12.json
      UPSTREAM_RECORD_PATH: docs/architecture/HEPTA_UPSTREAM_CODEX_R12_SEMANTIC_ABSORPTION_RECORD_2026-08-30.json
      V12_DRIVER_COMMIT: 554d710f6a561166553f3c01fafc5b27cd8c28b9
      V14_DRIVER_COMMIT: 3f2d8192439e8fcc5cb030011202a4f58ceda082
    steps:
      - name: Check out exact v18 driver commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install deterministic remediation tools
        shell: bash
        run: |
          set -euo pipefail
          brew install jq ripgrep gnu-sed
          printf '%s\n' "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --no-self-update

      - name: Execute v14 remediation with truthful scripts-budget semantics
        shell: bash
        run: |
          set -euo pipefail

          source_workflow="$RUNNER_TEMP/hepta-ui-v5-remediation-v14.yml"
          generated_v14_driver="$RUNNER_TEMP/hepta-ui-v5-remediation-v18-driver.sh"
          git cat-file -e "$V14_DRIVER_COMMIT^{commit}"
          git show "$V14_DRIVER_COMMIT:.github/workflows/hepta-ui-v5-remediation-v14.yml" > "$source_workflow"
          awk '
            /      - name: Execute v12 remediation with canonical route regeneration/ { found=1; next }
            found && /        shell: bash/ { next }
            found && /        run: \|/ { in_run=1; next }
            in_run { sub(/^          /, ""); print }
          ' "$source_workflow" > "$generated_v14_driver"
          test -s "$generated_v14_driver"

          export GENERATED_V14_DRIVER="$generated_v14_driver"
          python3 <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          path = Path(os.environ["GENERATED_V14_DRIVER"])
          text = path.read_text(encoding="utf-8")
          anchor = 'bash -n "$generated_driver"\nbash -x "$generated_driver"\n'
          if text.count(anchor) != 1:
              raise SystemExit(
                  f"v18 v14-driver execution anchor: expected 1 match, found {text.count(anchor)}"
              )

          payload = ""
          replacement = (
              'bash -n "$generated_driver"\n'
              'export V18_GENERATED_DRIVER="$generated_driver"\n'
              "python3 <<'PATCH_DRIVER'\n"
              "from __future__ import annotations\n"
              "\n"
              "import os\n"
              "from pathlib import Path\n"
              "\n"
              'driver_path = Path(os.environ["V18_GENERATED_DRIVER"])\n'
              'driver_text = driver_path.read_text(encoding="utf-8")\n'
              'inner_anchor = \'bash -n "$generated_script"\\nbash -x "$generated_script"\\n\'\n'
              "if driver_text.count(inner_anchor) != 1:\n"
              "    raise SystemExit(\n"
              '        f"v18 final-script execution anchor: expected 1 match, found {driver_text.count(inner_anchor)}"\n'
              "    )\n"
              f'payload = ""\n'
              "inner_replacement = (\n"
              '    \'bash -n "$generated_script"\\n\'\n'
              '    \'python3 - "$generated_script" <<\\\'V18_PATCH\\\'\\n\'\n'
              '    \'import base64, sys, zlib\\n\'\n'
              '    f\'exec(compile(zlib.decompress(base64.b64decode("{payload}")).decode("utf-8"), "<hepta-ui-v18-patcher>", "exec"))\\n\'\n'
              '    \'V18_PATCH\\n\'\n'
              '    \'bash -n "$generated_script"\\n\'\n'
              '    \'bash -x "$generated_script"\\n\'\n'
              ")\n"
              "driver_text = driver_text.replace(inner_anchor, inner_replacement, 1)\n"
              'driver_path.write_text(driver_text, encoding="utf-8")\n'
              "PATCH_DRIVER\n"
              'bash -n "$generated_driver"\n'
              'bash -x "$generated_driver"\n'
          )
          text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY

          bash -n "$generated_v14_driver"
          bash -x "$generated_v14_driver"
