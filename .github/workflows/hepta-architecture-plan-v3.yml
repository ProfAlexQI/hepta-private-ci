name: Hepta V3 architecture plan (historical)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-integrity:
    name: V3 historical integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify immutable historical inputs remain readable
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/architecture/HEPTA_ARCHITECTURE_CONVERGENCE_PLAN_V3.md
          test -f docs/architecture/HEPTA_ARCHITECTURE_GAP_LEDGER_V3.json
          python3 - <<'PY'
          import json
          import pathlib
          path = pathlib.Path("docs/architecture/HEPTA_ARCHITECTURE_GAP_LEDGER_V3.json")
          value = json.loads(path.read_text(encoding="utf-8"))
          assert value["schema"] == "hepta.architecture-gap-ledger.v3"
          PY
          git diff --exit-code
          git diff --cached --exit-code
