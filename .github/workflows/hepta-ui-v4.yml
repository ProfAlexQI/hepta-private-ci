name: hepta-ui-v4

on:
  push:
    branches:
      - "codex/ui-light-glass-v4-*"
      - "codex/ui-v4-*"
      - "ui/**"
  pull_request:
    paths:
      - "apps/hepta-control-ui/**"
      - "apps/hepta-native/src/shared/**"
      - "codex-rs/hepta-core/Cargo.toml"
      - "codex-rs/hepta-core/build.rs"
      - "codex-rs/hepta-core/src/control_ui_static_assets.rs"
      - "codex-rs/hepta-core/tests/control_ui_v4_bundle.rs"
      - "codex-rs/hepta-native-gateway/src/ui_domain/generated_control_ui_assets.rs"
      - "design-tokens/**"
      - "docs/ui/**"
      - "tools/hepta-ui-*/**"
      - "scripts/hepta-ui-v4-*"
      - "scripts/hepta-ui-light-glass-token-sync.rb"
      - ".github/workflows/hepta-ui-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-ui-v4-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  HEPTA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  static-contract:
    name: UI v4 source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_CANDIDATE_SHA"

      - name: Validate Ruby and JavaScript sources
        run: |
          ruby -c scripts/hepta-ui-v4-static-gate
          ruby -c scripts/hepta-ui-v4-next-source-gate
          ruby -c scripts/hepta-ui-v4-tranche3-source-gate
          ruby -c scripts/hepta-ui-v4-served-bundle-gate
          ruby -c scripts/hepta-ui-light-glass-token-sync.rb
          node --check apps/hepta-control-ui/control-ui-v4-runtime.js
          node --check scripts/hepta-ui-v4-browser-qualification.cjs

      - name: Validate JSON contracts
        run: |
          ruby -rjson -e 'JSON.parse(File.read("design-tokens/hepta-material-v4.contract.json"))'
          ruby -rjson -e 'JSON.parse(File.read("docs/ui/HEPTA_UI_STATE_AUTHORITY_MATRIX_V1.json"))'
          ruby -rjson -e 'JSON.parse(File.read("docs/ui/HEPTA_VISUAL_QUALIFICATION_MATRIX_V1.json"))'
          ruby -rjson -e 'JSON.parse(File.read("docs/ui/schemas/hepta.ui.v4.browser-qualification-receipt.v1.schema.json"))'

      - name: Verify generated v3 compatibility outputs
        run: ruby scripts/hepta-ui-light-glass-token-sync.rb --check

      - name: Run fail-closed UI v4 gates
        run: |
          mkdir -p artifacts/ui-v4
          ruby scripts/hepta-ui-v4-static-gate | tee artifacts/ui-v4/static-gate-result.json
          ruby scripts/hepta-ui-v4-next-source-gate | tee artifacts/ui-v4/next-source-gate-result.json
          ruby scripts/hepta-ui-v4-tranche3-source-gate | tee artifacts/ui-v4/tranche3-source-gate-result.json
          ruby scripts/hepta-ui-v4-served-bundle-gate | tee artifacts/ui-v4/served-bundle-gate-result.json

      - name: Verify source-only authority boundary
        run: |
          ruby -rjson -e '
            expected = {
              "static-gate-result.json" => "PASS_STATIC_CONTRACT_ONLY",
              "next-source-gate-result.json" => "PASS_NEXT_SOURCE_CONTRACT_ONLY",
              "tranche3-source-gate-result.json" => "PASS_TRANCHE3_SOURCE_CONTRACT_ONLY",
              "served-bundle-gate-result.json" => "PASS_SERVED_BUNDLE_SOURCE_CONTRACT_ONLY",
            }
            expected.each do |name, status|
              result = JSON.parse(File.read(File.join("artifacts/ui-v4", name)))
              abort "#{name}: unexpected status" unless result.fetch("status") == status
              %w[production_authority effect_authority operator_acceptance promotion].each do |key|
                abort "#{name}: #{key} must remain false" unless result.fetch(key) == false
              end
            end
            tranche = JSON.parse(File.read("artifacts/ui-v4/tranche3-source-gate-result.json"))
            abort "tranche 3 must remain an historical unbound receipt" unless tranche.fetch("rust_served_runtime_asset_bound") == false
            served = JSON.parse(File.read("artifacts/ui-v4/served-bundle-gate-result.json"))
            abort "compile-time served bundle must be source-bound" unless served.fetch("rust_served_runtime_asset_bound") == true
            abort "compile validation must remain separate" unless served.fetch("rust_compile_validation") == false
            abort "runtime validation must remain separate" unless served.fetch("rust_runtime_validation") == false
            abort "browser validation must remain separate" unless served.fetch("browser_validation") == false
            abort "device validation must remain unclaimed" unless served.fetch("device_validation") == false
          '

      - name: Upload source-bound gate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-ui-v4-source-${{ env.HEPTA_CANDIDATE_SHA }}
          path: artifacts/ui-v4/*.json
          if-no-files-found: error
          retention-days: 14

  native-contract:
    name: Rust and Native v4 contract compile
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_CANDIDATE_SHA"

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Install Linux Native build dependencies
        id: deps
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            pkg-config \
            clang \
            ca-certificates \
            libssl-dev \
            libx11-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libasound2-dev \
            libpulse-dev \
            libwayland-dev \
            wayland-protocols \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libglx-dev \
            libdrm-dev \
            libgbm-dev

      - name: Compile digest-bound served bundle path
        id: served
        continue-on-error: true
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail
          cargo check --manifest-path codex-rs/Cargo.toml -p hepta-core
          cargo check --manifest-path codex-rs/Cargo.toml -p hepta-native-gateway
          cargo test --manifest-path codex-rs/Cargo.toml -p hepta-core --test control_ui_v4_bundle

      - name: Check Native formatting
        id: format
        continue-on-error: true
        run: cargo fmt --manifest-path apps/hepta-native/Cargo.toml -- --check

      - name: Compile and test fail-closed Native v4 contracts
        id: native
        continue-on-error: true
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail
          cargo test --manifest-path apps/hepta-native/Cargo.toml --lib \
            shared::hepta_v4::tests::v4_contract_is_fail_closed_and_readable -- --exact
          cargo test --manifest-path apps/hepta-native/Cargo.toml --lib \
            shared::hepta_platform_material::tests::platform_profiles_are_bounded_and_fail_closed -- --exact
          cargo test --manifest-path apps/hepta-native/Cargo.toml --lib \
            shared::hepta_platform_material_runtime::tests::runtime_material_resolution_is_bounded_and_fail_closed -- --exact

      - name: Write exact compile receipt
        if: always()
        shell: bash
        env:
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          SERVED_OUTCOME: ${{ steps.served.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/ui-v4-native
          ruby -rjson -e '
            checks = {
              "linuxNativeDependencies" => ENV.fetch("DEPS_OUTCOME"),
              "servedBundle" => ENV.fetch("SERVED_OUTCOME"),
              "nativeFormatting" => ENV.fetch("FORMAT_OUTCOME"),
              "nativeContracts" => ENV.fetch("NATIVE_OUTCOME")
            }
            pass = checks.values.all? { |value| value == "success" }
            payload = {
              "schema" => "hepta.ui.v4.generic-native-compile.v2",
              "status" => pass ? "PASS_GENERIC_NATIVE_COMPILE" : "FAIL_GENERIC_NATIVE_COMPILE",
              "candidate" => {
                "commit" => ENV.fetch("HEPTA_CANDIDATE_SHA"),
                "tree" => `git rev-parse HEAD^{tree}`.strip
              },
              "rustToolchain" => "1.95.0",
              "checks" => checks,
              "productBound" => false,
              "systemMaterialBound" => false,
              "authority" => {
                "network" => false,
                "mutation" => false,
                "effect" => false,
                "liveAdapter" => false,
                "production" => false,
                "operatorAcceptance" => false,
                "promotion" => false,
                "release" => false
              }
            }
            File.write("artifacts/ui-v4-native/receipt.json", JSON.pretty_generate(payload) + "\n")
          '

      - name: Upload exact compile receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-ui-v4-native-compile-${{ env.HEPTA_CANDIDATE_SHA }}
          path: artifacts/ui-v4-native/receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce exact compile result
        if: always()
        shell: bash
        env:
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          SERVED_OUTCOME: ${{ steps.served.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: |
          set -euo pipefail
          test "$DEPS_OUTCOME" = success
          test "$SERVED_OUTCOME" = success
          test "$FORMAT_OUTCOME" = success
          test "$NATIVE_OUTCOME" = success

  browser-fixture-qualification:
    name: Chromium fixture visual qualification
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEPTA_CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_CANDIDATE_SHA"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Playwright in an isolated prefix
        env:
          PLAYWRIGHT_PREFIX: ${{ runner.temp }}/hepta-ui-v4-playwright
        run: |
          mkdir -p "$PLAYWRIGHT_PREFIX"
          npm install --prefix "$PLAYWRIGHT_PREFIX" --no-save --no-audit --no-fund playwright@1.55.0
          node "$PLAYWRIGHT_PREFIX/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Capture fixture browser qualification
        env:
          PLAYWRIGHT_PREFIX: ${{ runner.temp }}/hepta-ui-v4-playwright
          HEPTA_UI_V4_BROWSER_OUT: artifacts/ui-v4-browser
        run: |
          export NODE_PATH="$PLAYWRIGHT_PREFIX/node_modules"
          export HEPTA_CANDIDATE_COMMIT="$HEPTA_CANDIDATE_SHA"
          export HEPTA_CANDIDATE_TREE="$(git rev-parse 'HEAD^{tree}')"
          node scripts/hepta-ui-v4-browser-qualification.cjs \
            | tee artifacts/ui-v4-browser/stdout-receipt.json

      - name: Verify fixture-only receipt boundary
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('artifacts/ui-v4-browser/HEPTA_UI_V4_BROWSER_QUALIFICATION_RECEIPT.json', 'utf8'));
          if (receipt.status !== 'PASS_FIXTURE_VISUAL_CONTRACT_ONLY') throw new Error('fixture qualification failed');
          if (!receipt.fixture || !receipt.browserValidation) throw new Error('fixture/browser flags invalid');
          if (receipt.rustServedRuntimeAssetBound || receipt.rustRuntimeValidation || receipt.deviceValidation) throw new Error('runtime/device claim escaped fixture boundary');
          if (receipt.productionAuthority || receipt.effectAuthority || receipt.operatorAcceptance || receipt.promotion) throw new Error('authority escaped fixture boundary');
          if (receipt.results.length !== 8 || receipt.failures.length !== 0) throw new Error('unexpected scenario result');
          NODE

      - name: Upload fixture screenshots and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-ui-v4-browser-fixture-${{ env.HEPTA_CANDIDATE_SHA }}
          path: artifacts/ui-v4-browser
          if-no-files-found: error
          retention-days: 14
