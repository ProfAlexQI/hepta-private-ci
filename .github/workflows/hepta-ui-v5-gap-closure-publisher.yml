name: Hepta UI V5 exact-head gap-closure publisher

on:
  push:
    branches:
      - "codex/ui-v5-plan-and-repo-gap-closure-20260829"
    paths:
      - ".github/workflows/hepta-ui-v5-gap-closure-publisher.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-ui-v5-gap-closure-publisher
  cancel-in-progress: true

env:
  HEPTA_REQUIRED_ANCESTOR_SHA: 1e6f7cf3db498153fd52250dee1112f89489e094
  HEPTA_TARGET_BRANCH: codex/ui-v5-plan-and-repo-gap-closure-20260829
  HEPTA_PUBLISHER_PATH: .github/workflows/hepta-ui-v5-gap-closure-publisher.yml

jobs:
  publish:
    name: Close canonical CSS binding and retire publisher
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out current target branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.HEPTA_TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify ancestry and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$HEPTA_REQUIRED_ANCESTOR_SHA" HEAD
          test -z "$(git status --porcelain)"

      - name: Bind the V4 CSS overlay into the Rust-served cascade
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-core/src/control_ui.rs")
          old = (
              '    include_str!("../../../apps/hepta-control-ui/styles.responsive.css"),\n'
              '    "\\n",\n'
              '    include_str!("../../../apps/hepta-control-ui/styles.accessibility.css"),'
          )
          new = (
              '    include_str!("../../../apps/hepta-control-ui/styles.responsive.css"),\n'
              '    "\\n",\n'
              '    include_str!("../../../apps/hepta-control-ui/styles.v4.css"),\n'
              '    "\\n",\n'
              '    include_str!("../../../apps/hepta-control-ui/styles.accessibility.css"),'
          )
          text = path.read_text(encoding="utf-8")
          if new in text:
              pass
          elif text.count(old) == 1:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8", newline="\n")
          else:
              raise SystemExit("control_ui.rs canonical CSS insertion point mismatch")
          PY

      - name: Verify repository-controlled source closure
        shell: bash
        run: |
          set -euo pipefail
          ruby scripts/hepta-ui-v4-served-bundle-gate | tee /tmp/hepta-ui-v4-served-bundle-gate.json
          ruby -rjson -e '
            result = JSON.parse(File.read("/tmp/hepta-ui-v4-served-bundle-gate.json"))
            abort result.inspect unless result.fetch("status") == "PASS_SERVED_BUNDLE_SOURCE_CONTRACT_ONLY"
            abort result.inspect unless result.fetch("rust_served_runtime_asset_bound") == true
          '
          node --check apps/hepta-control-ui/control-ui-v4-runtime.js
          grep -F 'include_str!("../../../apps/hepta-control-ui/styles.v4.css")' \
            codex-rs/hepta-core/src/control_ui.rs >/dev/null
          grep -F 'control_ui_bundle_metadata.rs' \
            codex-rs/hepta-core/src/control_ui_static_assets.rs >/dev/null
          grep -F 'control-ui.bundle.js' \
            codex-rs/hepta-core/src/control_ui_static_assets.rs >/dev/null
          grep -F 'etag: hepta_core::control_ui::CONTROL_UI_JS_ETAG' \
            codex-rs/hepta-native-gateway/src/ui_domain/generated_control_ui_assets.rs >/dev/null
          grep -F 'sudo apt-get install --yes --no-install-recommends ripgrep' \
            .github/workflows/scripts/setup-rusty-v8.sh >/dev/null
          git diff --check

      - name: Publish source closure and remove the one-shot publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-gap-closure[bot]"
          git config user.email "hepta-gap-closure[bot]@users.noreply.github.com"
          git rm -- "$HEPTA_PUBLISHER_PATH"
          git add -- codex-rs/hepta-core/src/control_ui.rs
          git diff --cached --check
          git commit -m "fix(ui): complete generated V4 bundle and CSS binding"
          git push origin "HEAD:$HEPTA_TARGET_BRANCH"
