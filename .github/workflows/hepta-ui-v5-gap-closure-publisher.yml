name: Hepta UI V5 architecture-boundary repair publisher

on:
  push:
    branches:
      - "codex/ui-v5-plan-and-repo-gap-closure-20260829"
    paths:
      - ".github/workflows/hepta-ui-v5-gap-closure-publisher.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-ui-v5-gap-closure-publisher
  cancel-in-progress: true

env:
  HEPTA_REQUIRED_ANCESTOR_SHA: 1d755e24dc77e387441ff1d02dbf014db3f26cb6
  HEPTA_TARGET_BRANCH: codex/ui-v5-plan-and-repo-gap-closure-20260829
  HEPTA_PUBLISHER_PATH: .github/workflows/hepta-ui-v5-gap-closure-publisher.yml

jobs:
  publish:
    name: Repair portable architecture test inventory and retire publisher
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Check out current target branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.HEPTA_TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify ancestry and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$HEPTA_REQUIRED_ANCESTOR_SHA" HEAD
          test -z "$(git status --porcelain)"

      - name: Install bounded gate tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends jq ripgrep

      - name: Repair macOS-portable runtime test source enumeration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/lib/hepta-v2-architecture-boundary-v1.sh")
          text = path.read_text(encoding="utf-8")
          old_decl = '  local test_sources=("$ROOT/codex-rs/hepta-runtime/src/runtime_kernel/tests.rs" "$ROOT/codex-rs/hepta-runtime/src/runtime_kernel/tests/"part_0{1,2,3}.rs)'
          new_decl = '''  local test_sources=(
            "$ROOT/codex-rs/hepta-runtime/src/runtime_kernel/tests.rs"
            "$ROOT/codex-rs/hepta-runtime/src/runtime_kernel/tests/part_01.rs"
            "$ROOT/codex-rs/hepta-runtime/src/runtime_kernel/tests/part_02.rs"
            "$ROOT/codex-rs/hepta-runtime/src/runtime_kernel/tests/part_03.rs"
          )'''
          old_probe = '    grep -Fq "$requirement" "$ROOT/$source" "${test_sources[@]}" || {'
          new_probe = '    rg -Fq -- "$requirement" "$ROOT/$source" "${test_sources[@]}" || {'

          if new_decl not in text:
              if text.count(old_decl) != 1:
                  raise SystemExit("runtime test source declaration predecessor mismatch")
              text = text.replace(old_decl, new_decl, 1)
          if new_probe not in text:
              if text.count(old_probe) != 1:
                  raise SystemExit("runtime test source probe predecessor mismatch")
              text = text.replace(old_probe, new_probe, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Verify fail-closed architecture boundary
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/lib/hepta-v2-architecture-boundary-v1.sh
          scripts/hepta-v2-architecture-boundary verify
          scripts/hepta-v2-architecture-boundary self-test
          git diff --check
          test "$(git diff --name-only)" = "scripts/lib/hepta-v2-architecture-boundary-v1.sh"

      - name: Publish repair and remove one-shot publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-gap-closure[bot]"
          git config user.email "hepta-gap-closure[bot]@users.noreply.github.com"
          git rm -- "$HEPTA_PUBLISHER_PATH"
          git add -- scripts/lib/hepta-v2-architecture-boundary-v1.sh
          git diff --cached --check
          git commit -m "fix(architecture): make runtime test inventory portable"
          git push origin "HEAD:$HEPTA_TARGET_BRANCH"
