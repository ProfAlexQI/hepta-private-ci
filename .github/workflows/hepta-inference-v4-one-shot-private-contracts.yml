name: Hepta inference V4 one-shot private contracts tranche

on:
  push:
    branches:
      - codex/hepta-inference-v4-closure-20260830
    paths:
      - .github/workflows/hepta-inference-v4-one-shot-private-contracts.yml

permissions:
  contents: write

concurrency:
  group: hepta-inference-v4-one-shot-private-contracts
  cancel-in-progress: true

jobs:
  integrate-qualify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: ./.github/actions/setup-ci

      - name: Guard exact successor parent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/hepta-inference-v4-closure-20260830
          test "$(git rev-parse HEAD^)" = c450e6629157eb0fd5b3f2b344a74b445b9f8760
          test -z "$(git status --porcelain)"

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Apply exact private-contract source payload
        shell: bash
        run: |
          set -euo pipefail
          gzip --decompress --stdout \
            .github/qualification/hepta-inference-v4-private-contracts.patch.gz \
            > "$RUNNER_TEMP/tranche.patch"
          git apply --check "$RUNNER_TEMP/tranche.patch"
          git apply "$RUNNER_TEMP/tranche.patch"
          rm \
            .github/workflows/hepta-inference-v4-one-shot-private-contracts.yml \
            .github/qualification/hepta-inference-v4-private-contracts.patch.gz
          git diff --check

      - name: Format exact inference source
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd

      - name: Enforce exact source scope
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(cat <<'EOF' | LC_ALL=C sort
          .github/qualification/hepta-inference-v4-private-contracts.patch.gz
          .github/workflows/hepta-inference-v4-one-shot-private-contracts.yml
          codex-rs/hepta-infer-core/src/capability.rs
          codex-rs/hepta-infer-core/src/lib.rs
          codex-rs/hepta-infer-core/src/private_protocol.rs
          codex-rs/hepta-infer-core/src/scheduler.rs
          scripts/hepta-inference-v4-source-truth.py
          EOF
          )"
          test "$actual" = "$expected"
          git diff --check

      - name: Rust 1.95 locked qualification
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 \
            > "$RUNNER_TEMP/hepta-inference-v4-private-contracts-metadata.json"
          cargo check --locked --all-targets \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd
          cargo test --locked --all-targets \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd -- --test-threads=1
          cargo clippy --locked --all-targets --no-deps \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd -- -D warnings

      - name: Commit clean qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          git add \
            .github/qualification/hepta-inference-v4-private-contracts.patch.gz \
            .github/workflows/hepta-inference-v4-one-shot-private-contracts.yml \
            codex-rs/hepta-infer-core/src/capability.rs \
            codex-rs/hepta-infer-core/src/lib.rs \
            codex-rs/hepta-infer-core/src/private_protocol.rs \
            codex-rs/hepta-infer-core/src/scheduler.rs \
            scripts/hepta-inference-v4-source-truth.py
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat(inference): close private capability and scheduler source"

      - name: Verify V4 truth against clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python3 -m py_compile scripts/hepta-inference-v4-source-truth.py
          python3 scripts/hepta-inference-v4-source-truth.py \
            | tee "$RUNNER_TEMP/hepta-inference-v4-private-contracts-source-truth.json"

      - name: Push qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:codex/hepta-inference-v4-closure-20260830
