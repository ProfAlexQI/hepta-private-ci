name: Hepta inference V4 retired mutation helper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse branch mutation
        shell: bash
        run: |
          set -euo pipefail
          echo "This workflow is retained only as an auditable retirement marker."
          echo "Inference source must be committed as ordinary reviewable files; CI may only verify it."
