name: retired Hepta legacy workflow (manual provenance only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Retired legacy workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record immutable retirement posture
        shell: bash
        env:
          RETIREMENT_POLICY: docs/hepta-vnext/browser/CI_LEGACY_WORKFLOW_RETIREMENT_V1.json
        run: |
          set -euo pipefail
          {
            echo "### Retired Hepta workflow"
            echo
            echo "- legacy_workflow_ref=$GITHUB_WORKFLOW_REF"
            echo "- retirement_policy=$RETIREMENT_POLICY"
            echo "- canonical_replacement=see_retirement_policy"
            echo "- automatic_trigger=false"
            echo "- workflow_call=false"
            echo "- manual_provenance_only=true"
            echo "- exact_servo_source_accepted=false"
            echo "- worker_source_topology_accepted=false"
            echo "- build_authorized=false"
            echo "- servo_build_run=false"
            echo "- servo_runtime_qualified=false"
            echo "- runtime_authority=false"
            echo "- production_caller=false"
            echo "- production_writer=false"
            echo "- effect_authority=false"
            echo "- external_effect=false"
            echo "- external_network_allowed=false"
            echo "- credential_export_allowed=false"
            echo "- operator_acceptance=false"
            echo "- promotion=false"
            echo "- release_qualified=false"
          } >> "$GITHUB_STEP_SUMMARY"
