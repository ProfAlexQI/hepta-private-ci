name: Hepta P0.7a deterministic materialization

on:
  push:
    branches:
      - codex/hepta-architecture-v4-p0-7a-source-closure-20260830
    paths:
      - .github/workflows/hepta-p0-7a-materialize.yml

permissions:
  contents: write

concurrency:
  group: hepta-p0-7a-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    name: Materialize committed locks and scoped format
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/hepta-architecture-v4-p0-7a-source-closure-20260830
          fetch-depth: 0
          persist-credentials: true

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Install scoped P0.7a format verifier
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/verify-hepta-p0-7a-format.py <<'PY'
          #!/usr/bin/env python3
          """Format or verify only the source-owned P0.7a runtime-bootstrap package."""
          from __future__ import annotations

          import pathlib
          import subprocess
          import sys

          ROOT = pathlib.Path(__file__).resolve().parents[1]
          FILES = (
              "codex-rs/hepta-contracts/src/runtime_bootstrap.rs",
              "codex-rs/hepta-fleet/src/runtime_bootstrap_registry.rs",
              "codex-rs/hepta-fleet/src/runtime_bootstrap_registry_tests.rs",
              "codex-rs/hepta-supervisor/src/runtime_bootstrap.rs",
              "codex-rs/hepta-supervisor/src/runtime_bootstrap_tests.rs",
              "codex-rs/hepta-agentd/src/runtime_bootstrap.rs",
              "codex-rs/hepta-agentd/src/runtime_bootstrap_tests.rs",
          )

          def main() -> int:
              check = sys.argv[1:] == ["--check"]
              if sys.argv[1:] not in ([], ["--check"]):
                  raise SystemExit("usage: verify-hepta-p0-7a-format.py [--check]")
              missing = [path for path in FILES if not (ROOT / path).is_file()]
              if missing:
                  raise SystemExit(f"missing P0.7a source files: {missing}")
              command = [
                  "rustfmt",
                  "--edition",
                  "2024",
                  "--config-path",
                  str(ROOT / "codex-rs/rustfmt.toml"),
              ]
              if check:
                  command.append("--check")
              command.extend(str(ROOT / path) for path in FILES)
              return subprocess.run(command, cwd=ROOT, check=False).returncode

          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          chmod +x scripts/verify-hepta-p0-7a-format.py

      - name: Bind the recovery contract to O_NOFOLLOW
        shell: bash
        run: |
          set -euo pipefail
          recovery=docs/architecture/HEPTA_RUNTIME_BOOTSTRAP_RECOVERY_MATRIX_V1.md
          if ! grep -Fq 'O_NOFOLLOW' "$recovery"; then
            cat >> "$recovery" <<'EOF'

          ## POSIX secure-open implementation binding

          Every fallback handoff file is reopened with `O_NOFOLLOW` (or the
          platform-equivalent no-follow primitive) before any byte is trusted.
          The open file descriptor is then revalidated for expected owner UID,
          exact regular-file type and mode, link count `nlink == 1`, stable
          device/inode identity and unchanged digest. A symlink, hardlink,
          owner/mode mismatch, identity drift or unsupported platform primitive
          fails closed before claim, cleanup or authority attachment.
          EOF
          fi

      - name: Replace workspace-wide format debt with package-scoped gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/hepta-runtime-bootstrap-p0-7a.yml')
          source = path.read_text(encoding='utf-8')
          old = "      - name: Format\n        run: cargo fmt --all -- --check\n"
          new = (
              "      - name: P0.7a scoped format\n"
              "        working-directory: .\n"
              "        run: python3 scripts/verify-hepta-p0-7a-format.py --check\n"
          )
          if old in source:
              path.write_text(source.replace(old, new, 1), encoding='utf-8')
          elif new not in source:
              raise SystemExit('P0.7a format step shape drifted')
          PY

      - name: Format the exact P0.7a package
        run: python3 scripts/verify-hepta-p0-7a-format.py

      - name: Materialize Cargo lock
        working-directory: codex-rs
        run: cargo metadata --no-deps --format-version 1 >/dev/null

      - name: Materialize Bazel lock
        run: just bazel-lock-update

      - name: Advance source truth after deterministic lock closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          marker = "neither source presence nor qualification activates authority"
          if marker not in readme:
              readme = readme.rstrip() + (
                  "\n\n## Authority activation boundary\n\n"
                  "The governing invariant is: **neither source presence nor qualification "
                  "activates authority**. Runtime, production caller, writer, model, provider, "
                  "tool, network, fleet, operator, promotion and release authority remain "
                  "false until their separately bound acceptance receipts exist.\n"
              )
              readme_path.write_text(readme, encoding="utf-8")

          ledger_path = Path("docs/architecture/HEPTA_ARCHITECTURE_GAP_LEDGER_V4.json")
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          lock = ledger["sourceControlledBlockers"]["A-LOCK-01"]
          if lock["state"] not in {"open", "source_in_progress", "source_implemented"}:
              raise SystemExit(f"unexpected A-LOCK-01 state: {lock['state']}")
          lock["state"] = "source_implemented"
          lock["sourceEvidence"] = ["codex-rs/Cargo.lock", "MODULE.bazel.lock"]
          package = ledger["sourcePackages"]["P0.7a_signedRuntimeBootstrapClosure"]
          package["state"] = "source_implemented"
          package["blockedBy"] = [value for value in package.get("blockedBy", []) if value != "A-LOCK-01"]
          pending = package.setdefault("implementedPendingQualification", [])
          for value in ("A-LOCK-01", "A-TRANSPORT-01", "A-RECOVERY-01"):
              if value not in pending:
                  pending.append(value)
          ledger_path.write_text(json.dumps(ledger, indent=2) + "\n", encoding="utf-8")

          status_path = Path("docs/architecture/HEPTA_QUALIFICATION_STATUS_V3.json")
          status = json.loads(status_path.read_text(encoding="utf-8"))
          closure = status["sourceClosure"]
          closure["currentBlockers"] = [
              value for value in closure.get("currentBlockers", []) if value != "A-LOCK-01"
          ]
          pending = closure.setdefault("implementedPendingQualification", [])
          for value in ("A-LOCK-01", "A-TRANSPORT-01", "A-RECOVERY-01"):
              if value not in pending:
                  pending.append(value)
          status_path.write_text(json.dumps(status, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Verify deterministic source result
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-hepta-p0-7a-format.py --check
          cargo metadata --manifest-path codex-rs/Cargo.toml --locked --no-deps --format-version 1 >/dev/null
          just bazel-lock-check
          python3 scripts/verify-hepta-architecture-plan-v4.py
          git diff --check

      - name: Commit generated source closure and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/hepta-p0-7a-materialize.yml
          git add -A -- \
            .github/workflows/hepta-p0-7a-materialize.yml \
            .github/workflows/hepta-runtime-bootstrap-p0-7a.yml \
            MODULE.bazel.lock \
            README.md \
            codex-rs/Cargo.lock \
            codex-rs/hepta-contracts/src/runtime_bootstrap.rs \
            codex-rs/hepta-fleet/src/runtime_bootstrap_registry.rs \
            codex-rs/hepta-fleet/src/runtime_bootstrap_registry_tests.rs \
            codex-rs/hepta-supervisor/src/runtime_bootstrap.rs \
            codex-rs/hepta-supervisor/src/runtime_bootstrap_tests.rs \
            codex-rs/hepta-agentd/src/runtime_bootstrap.rs \
            codex-rs/hepta-agentd/src/runtime_bootstrap_tests.rs \
            docs/architecture/HEPTA_ARCHITECTURE_GAP_LEDGER_V4.json \
            docs/architecture/HEPTA_QUALIFICATION_STATUS_V3.json \
            docs/architecture/HEPTA_RUNTIME_BOOTSTRAP_RECOVERY_MATRIX_V1.md \
            scripts/verify-hepta-p0-7a-format.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No materialized changes were required.'
            exit 0
          fi
          git commit -m 'fix(hepta): close deterministic P0.7a source gaps'
          git push origin HEAD:codex/hepta-architecture-v4-p0-7a-source-closure-20260830
