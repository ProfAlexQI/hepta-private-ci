name: AuthBus P1.1 one-shot lock and rustfmt bootstrap

on:
  push:
    branches:
      - integration/vnext-main-full-ci-authbus-p1-1-20260828
    paths:
      - .github/workflows/authbus-p1-1-bootstrap.yml

permissions:
  contents: write

env:
  MANIFEST: codex-rs/hepta-authbus-p1-qualification/Cargo.toml
  PACKAGE: codex-hepta-authbus-p1-qualification
  CRATE_ROOT: codex-rs/hepta-authbus-p1-qualification
  EXPECTED_PARENT: 68ba4f58c340759f1ae236d03e546fc8f420160f
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  bootstrap:
    name: Qualify and commit Rust 1.95 lock and package rustfmt
    runs-on: ubuntu-slim
    timeout-minutes: 60
    steps:
      - name: Checkout exact bootstrap candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Verify branch, head, and exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "integration/vnext-main-full-ci-authbus-p1-1-20260828"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"

      - name: Verify source and negative authority
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-authbus-p1-1.py | tee authbus-p1-1-bootstrap-source.json
          grep -q 'PASS_AUTHBUS_P1_1_SOURCE_ONLY' authbus-p1-1-bootstrap-source.json

      - name: Apply deterministic Rust 1.95 Clippy closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-authbus-p1-qualification/tests/p1_1.rs")
          source = path.read_text(encoding="utf-8")
          before = '''    assert!(AUTHBUS_P1_1_QUALIFICATION_ONLY);
              assert!(!AUTHBUS_P1_1_AUTHORITY);
              assert!(!AUTHBUS_P1_1_EFFECT_AUTHORITY);
              assert!(!AUTHBUS_P1_1_PRODUCTION_CALLER);
              assert!(!AUTHBUS_P1_1_PRODUCTION_WRITER);
              assert!(!AUTHBUS_P1_1_OPERATOR_ACCEPTANCE);
              assert!(!AUTHBUS_P1_1_PROMOTION);
              assert!(!AUTHBUS_P1_1_G5_ALLOWED);
              assert!(!AUTHBUS_P1_1_EXECUTE_ALLOWED);
              assert!(!AUTHBUS_P1_1_PRIVATE_KEY_STORAGE);
          '''.replace("              ", "    ")
          after = '''    const {
                  assert!(AUTHBUS_P1_1_QUALIFICATION_ONLY);
                  assert!(!AUTHBUS_P1_1_AUTHORITY);
                  assert!(!AUTHBUS_P1_1_EFFECT_AUTHORITY);
                  assert!(!AUTHBUS_P1_1_PRODUCTION_CALLER);
                  assert!(!AUTHBUS_P1_1_PRODUCTION_WRITER);
                  assert!(!AUTHBUS_P1_1_OPERATOR_ACCEPTANCE);
                  assert!(!AUTHBUS_P1_1_PROMOTION);
                  assert!(!AUTHBUS_P1_1_G5_ALLOWED);
                  assert!(!AUTHBUS_P1_1_EXECUTE_ALLOWED);
                  assert!(!AUTHBUS_P1_1_PRIVATE_KEY_STORAGE);
              }
          '''.replace("              ", "    ")
          if source.count(before) != 1:
              raise SystemExit("expected exactly one P1.1 authority assertion block")
          path.write_text(source.replace(before, after), encoding="utf-8")
          PY
          git diff --check -- "${CRATE_ROOT}/tests/p1_1.rs"

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Generate deterministic lock and format package
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc -V | awk '{print $2}')" = "1.95.0"
          cargo generate-lockfile --manifest-path "${MANIFEST}"
          cargo fmt --manifest-path "${MANIFEST}" --package "${PACKAGE}"
          cargo fmt --manifest-path "${MANIFEST}" --package "${PACKAGE}" -- --check
          test -s "${CRATE_ROOT}/Cargo.lock"
          cargo metadata --manifest-path "${MANIFEST}" --locked --format-version 1 --no-deps >/dev/null

      - name: Check default-off authority posture
        shell: bash
        run: cargo test --manifest-path "${MANIFEST}" --locked --no-default-features --lib -- --nocapture

      - name: Run signed identity and evidence matrix
        shell: bash
        run: cargo test --manifest-path "${MANIFEST}" --locked --features p1-qualification --tests -- --nocapture

      - name: Check all targets
        shell: bash
        run: cargo check --manifest-path "${MANIFEST}" --locked --features p1-qualification --all-targets

      - name: Run strict Clippy
        shell: bash
        run: cargo clippy --manifest-path "${MANIFEST}" --locked --features p1-qualification --all-targets -- -D warnings

      - name: Commit only deterministic qualified outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "${CRATE_ROOT}/Cargo.lock" \
            "${CRATE_ROOT}/src/lib.rs" \
            "${CRATE_ROOT}/src/model.rs" \
            "${CRATE_ROOT}/src/verifier.rs" \
            "${CRATE_ROOT}/tests/p1_1.rs"

          allowed='^codex-rs/hepta-authbus-p1-qualification/(Cargo.lock|src/(lib|model|verifier)[.]rs|tests/p1_1[.]rs)$'
          changed="$(git diff --cached --name-only)"
          test -n "${changed}"
          while IFS= read -r path; do
            test -n "${path}"
            echo "${path}" | grep -Eq "${allowed}"
          done <<<"${changed}"

          git diff --cached --check
          git commit -m "chore(authbus): pin qualified P1.1 Rust 1.95 lock and rustfmt"
          git push origin "HEAD:${GITHUB_REF_NAME}" \
            --force-with-lease="refs/heads/${GITHUB_REF_NAME}:${GITHUB_SHA}"
