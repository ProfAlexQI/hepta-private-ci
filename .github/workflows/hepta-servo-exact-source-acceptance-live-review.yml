name: hepta Servo exact source acceptance live review

on:
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [integration/vnext-main-20260811]
    paths:
      - "docs/hepta-vnext/browser/source-acceptance/**"
      - "docs/hepta-vnext/browser/SOURCE_ACCEPTANCE_REVIEW_POLICY_V1.json"
      - "scripts/hepta-servo-exact-source-acceptance-pointer-v2.py"
      - ".github/workflows/hepta-servo-exact-source-acceptance-live-review.yml"
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: hepta-servo-source-acceptance-live-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  live-review:
    name: Source-only accepted pointer live review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Determine source-acceptance applicability
        id: scope
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" == review/hepta-servo-source-acceptance-* ]]; then
            echo "applicable=true" >> "$GITHUB_OUTPUT"
          else
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            echo '{"status":"PASS_NOT_APPLICABLE","exact_servo_source_accepted":false,"build_authorized":false,"authority":"all_false"}'
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.scope.outputs.applicable == 'true'
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve immutable pointer inputs
        id: inputs
        if: steps.scope.outputs.applicable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import pathlib

          root = pathlib.Path.cwd().resolve(strict=True)
          pointer_relative = pathlib.PurePosixPath(
              "docs/hepta-vnext/browser/source-acceptance/ACCEPTED_SOURCE_POINTER.json"
          )
          pointer = root / pointer_relative
          value = json.loads(pointer.read_text(encoding="utf-8"))
          for key, field in (("candidate", "candidate"), ("challenge", "challenge")):
              relative = pathlib.PurePosixPath(value[key]["snapshot_path"])
              if relative.is_absolute() or ".." in relative.parts:
                  raise SystemExit(f"unsafe {key} snapshot path")
              target = (root / relative).resolve(strict=True)
              target.relative_to(root)
              if not target.is_file() or target != root / relative:
                  raise SystemExit(f"non-canonical {key} snapshot path")
              print(f"{field}={target}")
          print(f"pointer={pointer.resolve(strict=True)}")
          print(
              "policy="
              + str(
                  (
                      root
                      / "docs/hepta-vnext/browser/SOURCE_ACCEPTANCE_REVIEW_POLICY_V1.json"
                  ).resolve(strict=True)
              )
          )
          PY

      - name: Fetch raw current-head GitHub review evidence
        if: steps.scope.outputs.applicable == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/hepta-source-acceptance-live-review"
          mkdir -p "$evidence"
          chmod 700 "$evidence"
          echo "HEPTA_SOURCE_ACCEPTANCE_LIVE_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          python3 - "$evidence" <<'PY'
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          import sys

          output = pathlib.Path(sys.argv[1]).resolve(strict=True)
          api = os.environ["GITHUB_API_URL"].rstrip("/")
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          pr_number = int(os.environ["PR_NUMBER"])
          head_sha = os.environ["HEAD_SHA"]

          def request_json(url: str):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "hepta-source-acceptance-review-v1",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
                  link = response.headers.get("Link")
              return data, link

          def paginated(path: str):
              url = f"{api}/repos/{repository}/{path}"
              items = []
              while url:
                  page, link = request_json(url)
                  if not isinstance(page, list):
                      raise SystemExit(f"expected list from {url}")
                  items.extend(page)
                  next_url = None
                  if link:
                      for part in link.split(","):
                          section = part.strip().split(";")
                          if len(section) == 2 and section[1].strip() == 'rel="next"':
                              next_url = section[0].strip()[1:-1]
                  url = next_url
              return items

          values = {
              "pull-request.json": request_json(
                  f"{api}/repos/{repository}/pulls/{pr_number}"
              )[0],
              "reviews.json": {
                  "reviews": paginated(f"pulls/{pr_number}/reviews?per_page=100")
              },
              "files.json": {
                  "files": paginated(f"pulls/{pr_number}/files?per_page=100")
              },
              "head-commit.json": request_json(
                  f"{api}/repos/{repository}/commits/{urllib.parse.quote(head_sha)}"
              )[0],
          }
          for name, value in values.items():
              path = output / name
              descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
                  json.dump(value, handle, sort_keys=True, separators=(",", ":"))
                  handle.flush()
                  os.fsync(handle.fileno())
          PY

      - name: Verify live source-only review
        if: steps.scope.outputs.applicable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-servo-exact-source-acceptance-pointer-v2.py verify-live-review \
            --candidate "${{ steps.inputs.outputs.candidate }}" \
            --policy "${{ steps.inputs.outputs.policy }}" \
            --challenge "${{ steps.inputs.outputs.challenge }}" \
            --pointer "${{ steps.inputs.outputs.pointer }}" \
            --pull-request "$HEPTA_SOURCE_ACCEPTANCE_LIVE_EVIDENCE/pull-request.json" \
            --reviews "$HEPTA_SOURCE_ACCEPTANCE_LIVE_EVIDENCE/reviews.json" \
            --files "$HEPTA_SOURCE_ACCEPTANCE_LIVE_EVIDENCE/files.json" \
            --head-commit "$HEPTA_SOURCE_ACCEPTANCE_LIVE_EVIDENCE/head-commit.json" \
            2>&1 | tee "$HEPTA_SOURCE_ACCEPTANCE_LIVE_EVIDENCE/verification.log"
          grep -F 'PASS_LIVE_REVIEW_SOURCE_ONLY' \
            "$HEPTA_SOURCE_ACCEPTANCE_LIVE_EVIDENCE/verification.log"

      - name: Record fail-closed result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Exact Servo source acceptance live review"
            echo
            echo "- applicable: ${{ steps.scope.outputs.applicable }}"
            echo "- job status: ${{ job.status }}"
            echo "- source-only decision: review evidence only"
            echo "- Worker topology accepted: false"
            echo "- build authorized: false"
            echo "- Servo built/runtime qualified: false"
            echo "- operator acceptance/promotion/release: false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded live-review evidence
        if: always() && steps.scope.outputs.applicable == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hepta-servo-source-acceptance-live-review
          path: ${{ env.HEPTA_SOURCE_ACCEPTANCE_LIVE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30

      - name: Check clean worktree
        if: always() && !cancelled() && steps.scope.outputs.applicable == 'true'
        uses: ./.github/actions/check-clean-worktree
