name: AuthBus P1.3 capacity supersession helper

on:
  push:
    branches:
      - ops/authbus-p1-3-bounded-queue-drain-v1-20260830
    paths:
      - .github/workflows/hepta-ui-v5-bounded-queue-drain.yml

permissions:
  contents: read

# PR #87 v8-canary already contains failed matrix jobs and cannot become green.
# Reuse its repository-scoped concurrency key to terminate only that doomed run.
concurrency:
  group: v8-canary::pr-87
  cancel-in-progress: true

jobs:
  supersede:
    if: ${{ false }}
    runs-on: ubuntu-slim
    steps:
      - run: echo unreachable
