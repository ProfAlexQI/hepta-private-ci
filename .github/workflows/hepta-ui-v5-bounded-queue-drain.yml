name: AuthBus P1.3 exact-head bounded queue drain

on:
  push:
    branches:
      - ops/authbus-p1-3-bounded-queue-drain-v1-20260830
    paths:
      - .github/workflows/hepta-ui-v5-bounded-queue-drain.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: authbus-p1-3-bounded-queue-drain
  cancel-in-progress: true

jobs:
  drain:
    if: github.repository == 'ProfHepta/hepta-private-ci'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CURRENT_RUN_ID: ${{ github.run_id }}
      KEEP_BRANCH: codex/authbus-p1-3-clean-replay-v6-format-scope-20260830
      KEEP_HEAD: e4166a92a3643d35572129233f496e9d5040879e
      CLEANUP_BRANCH: ops/authbus-p1-3-bounded-queue-drain-v1-20260830
    steps:
      - name: Cancel only superseded AuthBus P1.3 runs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          keep_branch = os.environ["KEEP_BRANCH"]
          keep_head = os.environ["KEEP_HEAD"]
          cleanup_branch = os.environ["CLEANUP_BRANCH"]
          api_root = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "hepta-authbus-p1-3-bounded-queue-drain",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request_json(url: str) -> dict:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def branch_sha(branch: str) -> str:
              encoded = urllib.parse.quote(branch, safe="")
              payload = request_json(f"{api_root}/git/ref/heads/{encoded}")
              return str(payload["object"]["sha"])

          before_keep_sha = branch_sha(keep_branch)
          if before_keep_sha != keep_head:
              raise SystemExit(
                  f"keep branch drifted before drain: expected {keep_head}, got {before_keep_sha}"
              )

          candidates: dict[int, dict] = {}
          retained_current: list[dict] = []
          observed_authbus: list[dict] = []
          for status in ("queued", "in_progress"):
              for page in range(1, 31):
                  query = urllib.parse.urlencode(
                      {"status": status, "per_page": 100, "page": page}
                  )
                  payload = request_json(f"{api_root}/actions/runs?{query}")
                  runs = payload.get("workflow_runs", [])
                  for run in runs:
                      run_id = int(run["id"])
                      branch = run.get("head_branch") or ""
                      head_sha = run.get("head_sha") or ""
                      if run_id == current_run_id:
                          continue

                      is_authbus_branch = (
                          branch.startswith("codex/authbus-p1-3-")
                          or branch.startswith("ops/authbus-p1-3-")
                      )
                      if not is_authbus_branch:
                          continue

                      observed_authbus.append(
                          {
                              "id": run_id,
                              "branch": branch,
                              "head_sha": head_sha,
                              "status": run.get("status"),
                              "name": run.get("name"),
                          }
                      )

                      if branch == keep_branch and head_sha == keep_head:
                          retained_current.append(
                              {
                                  "id": run_id,
                                  "name": run.get("name"),
                                  "status": run.get("status"),
                                  "head_sha": head_sha,
                              }
                          )
                          continue

                      stale_source_or_helper = branch.startswith(
                          "codex/authbus-p1-3-"
                      )
                      stale_cleanup = branch == cleanup_branch
                      stale_other_helper = (
                          branch.startswith("ops/authbus-p1-3-")
                          and branch != cleanup_branch
                      )
                      if not (
                          stale_source_or_helper
                          or stale_cleanup
                          or stale_other_helper
                      ):
                          continue

                      candidates[run_id] = {
                          "id": run_id,
                          "branch": branch,
                          "head_sha": head_sha,
                          "status": run.get("status"),
                          "name": run.get("name"),
                          "reason": (
                              "superseded_authbus_source_or_helper"
                              if stale_source_or_helper
                              else "prior_cleanup_run"
                              if stale_cleanup
                              else "superseded_authbus_ops_helper"
                          ),
                      }
                  if len(runs) < 100:
                      break

          if not retained_current:
              raise SystemExit("no queued or in-progress run found for the exact keep head")
          if any(item["head_sha"] != keep_head for item in retained_current):
              raise SystemExit("retained run set contains a non-current head")

          cancelled: list[dict] = []
          raced: list[dict] = []
          for run_id in sorted(candidates):
              item = candidates[run_id]
              request = urllib.request.Request(
                  f"{api_root}/actions/runs/{run_id}/cancel",
                  data=b"{}",
                  headers=headers,
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status != 202:
                          raise RuntimeError(
                              f"unexpected cancellation status {response.status} for {run_id}"
                          )
                  cancelled.append(item)
              except urllib.error.HTTPError as error:
                  if error.code in {409, 422}:
                      raced.append({**item, "http_status": error.code})
                      continue
                  body = error.read().decode("utf-8", errors="replace")
                  print(
                      json.dumps(
                          {
                              "error": "cancel_failed",
                              "run": item,
                              "http_status": error.code,
                              "body": body,
                          },
                          sort_keys=True,
                      ),
                      file=sys.stderr,
                  )
                  raise

          # Let the cancellation requests become visible, then prove that the
          # exact source branch itself did not move during the drain.
          time.sleep(3)
          after_keep_sha = branch_sha(keep_branch)
          if after_keep_sha != keep_head:
              raise SystemExit(
                  f"keep branch drifted during drain: expected {keep_head}, got {after_keep_sha}"
              )

          print(
              json.dumps(
                  {
                      "schema": "hepta_authbus_p1_3_exact_head_queue_drain_receipt_v1",
                      "status": "ready",
                      "keep_branch": keep_branch,
                      "keep_head": keep_head,
                      "keep_branch_unchanged": True,
                      "selected_count": len(candidates),
                      "selected": [candidates[key] for key in sorted(candidates)],
                      "cancelled_count": len(cancelled),
                      "cancelled": cancelled,
                      "raced_count": len(raced),
                      "raced": raced,
                      "retained_current_count": len(retained_current),
                      "retained_current": sorted(
                          retained_current, key=lambda item: int(item["id"])
                      ),
                      "observed_authbus_count": len(observed_authbus),
                      "unrelated_runs_touched": 0,
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY
