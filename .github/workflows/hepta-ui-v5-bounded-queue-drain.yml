name: Hepta UI v5 bounded queue drain

on:
  push:
    branches:
      - ops/ui-v5-queue-drain-v1-20260830
    paths:
      - .github/workflows/hepta-ui-v5-bounded-queue-drain.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: hepta-ui-v5-bounded-queue-drain
  cancel-in-progress: false

jobs:
  drain:
    if: github.repository == 'ProfHepta/hepta-private-ci'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CURRENT_RUN_ID: ${{ github.run_id }}
      KEEP_BRANCHES_JSON: '["ops/ui-v5-remediation-v25-x64-20260830","ops/ui-v5-remediation-v28-macos-20260830"]'
    steps:
      - name: Cancel only stale UI remediation runs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          keep_branches = set(json.loads(os.environ["KEEP_BRANCHES_JSON"]))
          api_root = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "hepta-ui-v5-bounded-queue-drain",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request_json(url: str) -> dict:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          candidates: dict[int, dict] = {}
          for status in ("queued", "in_progress"):
              for page in range(1, 11):
                  query = urllib.parse.urlencode(
                      {"status": status, "per_page": 100, "page": page}
                  )
                  payload = request_json(f"{api_root}/actions/runs?{query}")
                  runs = payload.get("workflow_runs", [])
                  for run in runs:
                      branch = run.get("head_branch") or ""
                      run_id = int(run["id"])
                      if run_id == current_run_id:
                          continue
                      if not branch.startswith("ops/ui-v5-remediation-"):
                          continue
                      if branch in keep_branches:
                          continue
                      candidates[run_id] = {
                          "id": run_id,
                          "branch": branch,
                          "status": run.get("status"),
                          "name": run.get("name"),
                      }
                  if len(runs) < 100:
                      break

          cancelled: list[dict] = []
          raced: list[dict] = []
          for run_id in sorted(candidates):
              item = candidates[run_id]
              request = urllib.request.Request(
                  f"{api_root}/actions/runs/{run_id}/cancel",
                  data=b"{}",
                  headers=headers,
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status != 202:
                          raise RuntimeError(
                              f"unexpected cancellation status {response.status} for {run_id}"
                          )
                  cancelled.append(item)
              except urllib.error.HTTPError as error:
                  if error.code in {409, 422}:
                      raced.append({**item, "http_status": error.code})
                      continue
                  body = error.read().decode("utf-8", errors="replace")
                  print(
                      json.dumps(
                          {
                              "error": "cancel_failed",
                              "run": item,
                              "http_status": error.code,
                              "body": body,
                          },
                          sort_keys=True,
                      ),
                      file=sys.stderr,
                  )
                  raise

          retained = []
          for branch in sorted(keep_branches):
              query = urllib.parse.urlencode(
                  {"branch": branch, "per_page": 10}
              )
              payload = request_json(f"{api_root}/actions/runs?{query}")
              retained.append(
                  {
                      "branch": branch,
                      "runs": [
                          {
                              "id": run["id"],
                              "status": run["status"],
                              "conclusion": run.get("conclusion"),
                          }
                          for run in payload.get("workflow_runs", [])
                      ],
                  }
              )

          print(
              json.dumps(
                  {
                      "schema": "hepta_ui_v5_bounded_queue_drain_receipt_v1",
                      "status": "ready",
                      "scope_prefix": "ops/ui-v5-remediation-",
                      "cancelled_count": len(cancelled),
                      "cancelled": cancelled,
                      "raced_count": len(raced),
                      "raced": raced,
                      "retained": retained,
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY
