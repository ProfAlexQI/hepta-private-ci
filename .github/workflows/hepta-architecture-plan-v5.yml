name: Hepta V5 architecture and source closure

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "README.md"
      - "ARCHITECTURE.md"
      - "docs/architecture/**"
      - "docs/governance/**"
      - "scripts/generate-hepta-architecture-projections.py"
      - "scripts/verify-hepta-*.py"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/hepta-*/**"
      - "codex-rs/app-server/**"
      - "codex-rs/cli/**"
      - "MODULE.bazel.lock"
      - ".github/workflows/hepta-architecture-plan-v5.yml"
      - ".github/workflows/hepta-runtime-bootstrap-p0-7a.yml"
  push:
    branches:
      - "integration/vnext-main-20260811"
      - "codex/hepta-architecture-v5-*"
      - "codex/architecture-v2-blocker-closure-20260830"
    paths:
      - "README.md"
      - "ARCHITECTURE.md"
      - "docs/architecture/**"
      - "docs/governance/**"
      - "scripts/generate-hepta-architecture-projections.py"
      - "scripts/verify-hepta-*.py"
      - "codex-rs/Cargo.toml"
      - "codex-rs/Cargo.lock"
      - "codex-rs/hepta-*/**"
      - "codex-rs/app-server/**"
      - "codex-rs/cli/**"
      - "MODULE.bazel.lock"
      - ".github/workflows/hepta-architecture-plan-v5.yml"
      - ".github/workflows/hepta-runtime-bootstrap-p0-7a.yml"

permissions:
  contents: read

concurrency:
  group: hepta-v5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: V5 exact source-head contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity and clean candidate
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
          git diff --cached --exit-code

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Compile source verifiers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/generate-hepta-architecture-projections.py \
            scripts/verify-hepta-architecture-plan-v5.py \
            scripts/verify-hepta-dependency-policy.py \
            scripts/verify-hepta-p0-5-gap-closure.py \
            scripts/verify-hepta-cross-owner-operation-wiring.py \
            scripts/verify-hepta-p0-6-runtime-authority.py

      - name: Verify architecture and dependency authority
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-hepta-architecture-projections.py --check
          python3 scripts/verify-hepta-p0-5-gap-closure.py
          python3 scripts/verify-hepta-cross-owner-operation-wiring.py
          python3 scripts/verify-hepta-p0-6-runtime-authority.py
          python3 scripts/verify-hepta-architecture-plan-v5.py
          python3 scripts/verify-hepta-dependency-policy.py

      - name: Verify committed Cargo and Bazel locks
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path codex-rs/Cargo.toml \
            --locked --no-deps --format-version 1 >/dev/null
          just bazel-lock-check
          git diff --exit-code
          git diff --cached --exit-code

      - name: Format
        working-directory: codex-rs
        run: cargo fmt --all -- --check

      - name: Package tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked \
            -p codex-hepta-contracts \
            -p codex-hepta-fleet \
            -p codex-hepta-supervisor \
            -p codex-hepta-agentd

      - name: Package check
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets \
            -p codex-hepta-contracts \
            -p codex-hepta-fleet \
            -p codex-hepta-supervisor \
            -p codex-hepta-agentd

      - name: Strict package Clippy
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets \
            -p codex-hepta-contracts \
            -p codex-hepta-fleet \
            -p codex-hepta-supervisor \
            -p codex-hepta-agentd \
            -- -D warnings

      - name: Confirm qualification was read-only
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

  merge-candidate:
    name: V5 synthetic merge-candidate contract
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout synthetic merge candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify merge identity and source ancestry
        shell: bash
        env:
          MERGE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git merge-base --is-ancestor "$HEAD_SHA" HEAD
          git diff --exit-code
          git diff --cached --exit-code

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Verify merge-candidate contracts and locks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-hepta-architecture-projections.py --check
          python3 scripts/verify-hepta-architecture-plan-v5.py
          python3 scripts/verify-hepta-dependency-policy.py
          cargo metadata --manifest-path codex-rs/Cargo.toml \
            --locked --no-deps --format-version 1 >/dev/null
          just bazel-lock-check

      - name: Verify merge-candidate Rust package set
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked \
            -p codex-hepta-contracts \
            -p codex-hepta-fleet \
            -p codex-hepta-supervisor \
            -p codex-hepta-agentd
          cargo check --locked --all-targets \
            -p codex-hepta-contracts \
            -p codex-hepta-fleet \
            -p codex-hepta-supervisor \
            -p codex-hepta-agentd
          cargo clippy --locked --all-targets \
            -p codex-hepta-contracts \
            -p codex-hepta-fleet \
            -p codex-hepta-supervisor \
            -p codex-hepta-agentd \
            -- -D warnings

      - name: Confirm merge qualification was read-only
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

  required:
    name: Hepta V5 required
    if: ${{ always() && !cancelled() }}
    needs:
      - source-contract
      - merge-candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Require all applicable V5 jobs
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.source-contract.result }}
          MERGE_RESULT: ${{ needs.merge-candidate.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = "success"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test "$MERGE_RESULT" = "success"
          else
            test "$MERGE_RESULT" = "skipped"
          fi
