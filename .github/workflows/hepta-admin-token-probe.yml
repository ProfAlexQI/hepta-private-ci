name: Hepta administrator token capability probe

on:
  push:
    branches:
      - integration/vnext-main-20260811
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE_ADMIN_TOKEN: ${{ secrets.WINGET_PUBLISH_PAT }}
      REPOSITORY_FULL_NAME: TrillionniumFoundation/hepta-private-ci
    steps:
      - name: Verify token presence and repository permission without mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get('CANDIDATE_ADMIN_TOKEN', '')
          if not token:
              print(json.dumps({'tokenPresent': False, 'admin': False}, sort_keys=True))
              raise SystemExit(3)

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY_FULL_NAME']}",
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'hepta-admin-capability-probe',
              },
              method='GET',
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              repository = json.loads(response.read())
              scopes = response.headers.get('X-OAuth-Scopes', '')
          permissions = repository.get('permissions') or {}
          result = {
              'tokenPresent': True,
              'admin': bool(permissions.get('admin')),
              'maintain': bool(permissions.get('maintain')),
              'push': bool(permissions.get('push')),
              'defaultBranch': repository.get('default_branch'),
              'oauthScopes': sorted(scope.strip() for scope in scopes.split(',') if scope.strip()),
          }
          print(json.dumps(result, sort_keys=True))
          if not result['admin']:
              raise SystemExit(4)
          PY
