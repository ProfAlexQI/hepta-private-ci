name: Temporary exact Prettier materialization for PR 295

on:
  push:
    branches:
      - admin/format-pr295-bee6217-20260902
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-format-pr295-bee6217
  cancel-in-progress: true

jobs:
  format:
    runs-on:
      - self-hosted
      - linux
      - x64
    timeout-minutes: 20
    steps:
      - name: Check out exact immutable candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: bee6217a0083f7368e477c6768bca285dabb1545
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: pnpm

      - name: Format bounded paths and retain exact bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bee6217a0083f7368e477c6768bca285dabb1545
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            docs/STATUS.md \
            .github/workflows/hepta-algorithm-docs.yml \
            .github/workflows/hepta-cns-embodiment.yml \
            .github/workflows/hepta-repository-integrity.yml
          pnpm exec prettier --check \
            docs/STATUS.md \
            .github/workflows/hepta-algorithm-docs.yml \
            .github/workflows/hepta-cns-embodiment.yml \
            .github/workflows/hepta-repository-integrity.yml
          cat > "$RUNNER_TEMP/expected" <<'EOF'
          .github/workflows/hepta-algorithm-docs.yml
          .github/workflows/hepta-cns-embodiment.yml
          .github/workflows/hepta-repository-integrity.yml
          docs/STATUS.md
          EOF
          git diff --name-only | sort > "$RUNNER_TEMP/actual"
          sort -o "$RUNNER_TEMP/expected" "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          git diff --check
          mkdir -p "$RUNNER_TEMP/pr295-prettier/.github/workflows" "$RUNNER_TEMP/pr295-prettier/docs"
          cp .github/workflows/hepta-algorithm-docs.yml "$RUNNER_TEMP/pr295-prettier/.github/workflows/"
          cp .github/workflows/hepta-cns-embodiment.yml "$RUNNER_TEMP/pr295-prettier/.github/workflows/"
          cp .github/workflows/hepta-repository-integrity.yml "$RUNNER_TEMP/pr295-prettier/.github/workflows/"
          cp docs/STATUS.md "$RUNNER_TEMP/pr295-prettier/docs/"
          git diff --binary > "$RUNNER_TEMP/pr295-prettier/prettier.patch"
          sha256sum \
            "$RUNNER_TEMP/pr295-prettier/.github/workflows/hepta-algorithm-docs.yml" \
            "$RUNNER_TEMP/pr295-prettier/.github/workflows/hepta-cns-embodiment.yml" \
            "$RUNNER_TEMP/pr295-prettier/.github/workflows/hepta-repository-integrity.yml" \
            "$RUNNER_TEMP/pr295-prettier/docs/STATUS.md" \
            > "$RUNNER_TEMP/pr295-prettier/SHA256SUMS"

      - name: Upload bounded Prettier output
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pr295-prettier-bee6217
          path: ${{ runner.temp }}/pr295-prettier
          if-no-files-found: error
          retention-days: 1
