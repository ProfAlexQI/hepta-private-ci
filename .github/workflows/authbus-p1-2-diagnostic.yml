name: AuthBus P1.2 exact source-verifier diagnostic

on:
  push:
    branches:
      - integration/vnext-main-full-ci-authbus-p1-2-20260828
    paths:
      - .github/workflows/authbus-p1-2-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnostic:
    name: Print the exact P1.2 verifier and canonical shim
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout exact diagnostic candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact parent and finalizer
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "integration/vnext-main-full-ci-authbus-p1-2-20260828"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "3e9bd694459b9e2ba0246f63bcd29f3b430b322a"
          python3 -m py_compile scripts/authbus-p1-2-finalize.py

      - name: Materialize the reviewed source and print bounded verifier context
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/authbus-p1-2-finalize.py >/tmp/authbus-p1-2-finalize.txt
          echo '--- scripts/verify-authbus-p1-2.py ---'
          nl -ba scripts/verify-authbus-p1-2.py | sed -n '1,520p'
          echo '--- codex-state durable evidence shim ---'
          nl -ba codex-rs/state/src/sqlite.rs | sed -n '275,335p'
