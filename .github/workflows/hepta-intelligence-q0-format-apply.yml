name: Hepta Intelligence Q0 frozen rustfmt apply

on:
  push:
    branches:
      - codex/hepta-intelligence-plan-v3-20260828
    paths:
      - .github/workflows/hepta-intelligence-q0-format-apply.yml

permissions:
  contents: write

concurrency:
  group: hepta-intelligence-q0-format-apply-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_BRANCH: codex/hepta-intelligence-plan-v3-20260828
  EXPECTED_PARENT: 55d2929b05de602116c778e294c96af4b73b1430
  APPLY_WORKFLOW: .github/workflows/hepta-intelligence-q0-format-apply.yml

jobs:
  apply-frozen-rustfmt:
    name: Apply Rust 1.95 formatting to the frozen Q0 tranche only
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout exact applier candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Prove branch, head, parent and ARM64 identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(uname -m)" = "aarch64"
          test -f "$APPLY_WORKFLOW"

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Verify toolchain and repository pin
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          expected=$(python3 - <<'PY'
          import pathlib
          import tomllib
          value = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())
          print(value["toolchain"]["channel"])
          PY
          )
          test "$(rustc --version | awk '{print $2}')" = "$expected"
          test "$expected" = "1.95.0"
          test "$(rustc -vV | awk '/^host:/ {print $2}')" = "aarch64-unknown-linux-gnu"

      - name: Apply rustfmt to the exact frozen Q0 file set
        shell: bash
        run: |
          set -euo pipefail
          files=(
            codex-rs/hepta-memory/src/framing.rs
            codex-rs/hepta-memory/src/fact_grounding/durable.rs
            codex-rs/hepta-memory/src/fact_grounding/durable/grounding.rs
            codex-rs/hepta-memory/src/fact_grounding/durable/grounding/prepare.rs
            codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger.rs
            codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger/insert.rs
            codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger/support.rs
            codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger/verify.rs
            codex-rs/hepta-memory/src/fact_grounding/durable/schema.rs
            codex-rs/hepta-memory/src/fact_grounding/durable/tests.rs
            codex-rs/hepta-memory/src/fact_grounding/shadow_projection_gate.rs
            codex-rs/hepta-memory/src/intelligence_mutation_state.rs
            codex-rs/hepta-memory/src/intelligence_mutation_journal_v3.rs
            codex-rs/hepta-memory/src/intelligence_mutation_journal_v3/digest.rs
            codex-rs/hepta-memory/src/intelligence_mutation_journal_v3/replay.rs
            codex-rs/hepta-memory/src/intelligence_mutation_journal_v3/schema.rs
            codex-rs/hepta-memory/src/intelligence_mutation_journal_v3/tests.rs
            codex-rs/hepta-memory/src/intelligence_mutation_shadow_host.rs
            codex-rs/ext/hepta-memory/src/framing.rs
            codex-rs/ext/hepta-memory/src/cognitive/grounding_v3.rs
            codex-rs/hepta-agentd/src/lib.rs
            codex-rs/hepta-agentd/src/shadow_intelligence_mutation_host.rs
          )
          rustfmt --edition 2024 --config skip_children=true "${files[@]}"
          rustfmt --edition 2024 --check --config skip_children=true "${files[@]}"
          git diff --check

      - name: Assert the mechanical diff matches the hosted artifact exactly
        shell: python
        run: |
          import subprocess

          expected = {
              "codex-rs/hepta-memory/src/framing.rs",
              "codex-rs/hepta-memory/src/fact_grounding/durable.rs",
              "codex-rs/hepta-memory/src/fact_grounding/durable/grounding.rs",
              "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/prepare.rs",
              "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger/support.rs",
              "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger/verify.rs",
              "codex-rs/hepta-memory/src/fact_grounding/durable/schema.rs",
              "codex-rs/hepta-memory/src/fact_grounding/durable/tests.rs",
              "codex-rs/hepta-memory/src/fact_grounding/shadow_projection_gate.rs",
              "codex-rs/hepta-memory/src/intelligence_mutation_state.rs",
              "codex-rs/hepta-memory/src/intelligence_mutation_journal_v3.rs",
              "codex-rs/hepta-memory/src/intelligence_mutation_journal_v3/digest.rs",
              "codex-rs/hepta-memory/src/intelligence_mutation_journal_v3/replay.rs",
              "codex-rs/hepta-memory/src/intelligence_mutation_journal_v3/schema.rs",
              "codex-rs/hepta-memory/src/intelligence_mutation_journal_v3/tests.rs",
              "codex-rs/hepta-memory/src/intelligence_mutation_shadow_host.rs",
              "codex-rs/ext/hepta-memory/src/cognitive/grounding_v3.rs",
              "codex-rs/hepta-agentd/src/lib.rs",
              "codex-rs/hepta-agentd/src/shadow_intelligence_mutation_host.rs",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True
              ).splitlines()
          )
          assert actual == expected, {
              "missing": sorted(expected - actual),
              "unexpected": sorted(actual - expected),
          }

      - name: Re-run all frozen source and SQLite contracts after formatting
        shell: bash
        run: |
          set -euo pipefail
          status=plans/hepta-intelligence/HEPTA_INTELLIGENCE_EXECUTION_STATUS_V2.json
          canonical=$(mktemp)
          cp "$status" "$canonical"
          restore_status() { cp "$canonical" "$status"; rm -f "$canonical"; }
          trap restore_status EXIT

          test "$(python3 scripts/verify-hepta-intelligence-master-plan.py)" = \
            "PASS_HEPTA_INTELLIGENCE_MASTER_PLAN_V4_SOURCE_ONLY"
          python3 scripts/hepta-intelligence-status-compat.py P0.2 >/dev/null
          python3 scripts/verify-hepta-intelligence-grounding-ledger.py >/dev/null
          python3 scripts/hepta-intelligence-status-compat.py P0.3 >/dev/null
          python3 scripts/verify-hepta-intelligence-grounding-gate.py >/dev/null
          python3 scripts/hepta-intelligence-status-compat.py P0.4a >/dev/null
          python3 scripts/verify-hepta-intelligence-mutation-state.py >/dev/null
          python3 scripts/hepta-intelligence-status-compat.py P0.4b >/dev/null
          python3 scripts/hepta-intelligence-mutation-journal-sqlite-selftest.py >/dev/null
          python3 scripts/verify-hepta-intelligence-mutation-journal.py >/dev/null
          python3 scripts/hepta-intelligence-status-compat.py P0.4c >/dev/null
          python3 scripts/verify-hepta-intelligence-shadow-host.py >/dev/null

          restore_status
          trap - EXIT

      - name: Commit the exact formatted file set and self-delete the applier
        shell: bash
        run: |
          set -euo pipefail
          formatted=(
            codex-rs/hepta-memory/src/framing.rs
            codex-rs/hepta-memory/src/fact_grounding/durable.rs
            codex-rs/hepta-memory/src/fact_grounding/durable/grounding.rs
            codex-rs/hepta-memory/src/fact_grounding/durable/grounding/prepare.rs
            codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger/support.rs
            codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger/verify.rs
            codex-rs/hepta-memory/src/fact_grounding/durable/schema.rs
            codex-rs/hepta-memory/src/fact_grounding/durable/tests.rs
            codex-rs/hepta-memory/src/fact_grounding/shadow_projection_gate.rs
            codex-rs/hepta-memory/src/intelligence_mutation_state.rs
            codex-rs/hepta-memory/src/intelligence_mutation_journal_v3.rs
            codex-rs/hepta-memory/src/intelligence_mutation_journal_v3/digest.rs
            codex-rs/hepta-memory/src/intelligence_mutation_journal_v3/replay.rs
            codex-rs/hepta-memory/src/intelligence_mutation_journal_v3/schema.rs
            codex-rs/hepta-memory/src/intelligence_mutation_journal_v3/tests.rs
            codex-rs/hepta-memory/src/intelligence_mutation_shadow_host.rs
            codex-rs/ext/hepta-memory/src/cognitive/grounding_v3.rs
            codex-rs/hepta-agentd/src/lib.rs
            codex-rs/hepta-agentd/src/shadow_intelligence_mutation_host.rs
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${formatted[@]}"
          git rm "$APPLY_WORKFLOW"

          python3 - <<'PY'
          import os
          import subprocess

          expected = {
              "codex-rs/hepta-memory/src/framing.rs",
              "codex-rs/hepta-memory/src/fact_grounding/durable.rs",
              "codex-rs/hepta-memory/src/fact_grounding/durable/grounding.rs",
              "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/prepare.rs",
              "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger/support.rs",
              "codex-rs/hepta-memory/src/fact_grounding/durable/grounding/ledger/verify.rs",
              "codex-rs/hepta-memory/src/fact_grounding/durable/schema.rs",
              "codex-rs/hepta-memory/src/fact_grounding/durable/tests.rs",
              "codex-rs/hepta-memory/src/fact_grounding/shadow_projection_gate.rs",
              "codex-rs/hepta-memory/src/intelligence_mutation_state.rs",
              "codex-rs/hepta-memory/src/intelligence_mutation_journal_v3.rs",
              "codex-rs/hepta-memory/src/intelligence_mutation_journal_v3/digest.rs",
              "codex-rs/hepta-memory/src/intelligence_mutation_journal_v3/replay.rs",
              "codex-rs/hepta-memory/src/intelligence_mutation_journal_v3/schema.rs",
              "codex-rs/hepta-memory/src/intelligence_mutation_journal_v3/tests.rs",
              "codex-rs/hepta-memory/src/intelligence_mutation_shadow_host.rs",
              "codex-rs/ext/hepta-memory/src/cognitive/grounding_v3.rs",
              "codex-rs/hepta-agentd/src/lib.rs",
              "codex-rs/hepta-agentd/src/shadow_intelligence_mutation_host.rs",
              os.environ["APPLY_WORKFLOW"],
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
          )
          assert actual == expected, {
              "missing": sorted(expected - actual),
              "unexpected": sorted(actual - expected),
          }
          PY

          git diff --cached --check
          git commit -m "style(intelligence): format frozen Q0 tranche sources"
          git fetch origin "$EXPECTED_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:$EXPECTED_BRANCH"
