name: hepta-intelligence-p1-1b-rustfmt-macos-v2

on:
  push:
    branches:
      - "qualification/hepta-intelligence-p1-1b-rustfmt-macos-v2-c804ce2-20260828"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-intelligence-p1-1b-rustfmt-macos-v2-c804ce2
  cancel-in-progress: true

env:
  SOURCE_SHA: c804ce200e3eccec96e90b867de31c5cacfdf82f
  WRAPPER_PATH: .github/workflows/hepta-intelligence-p1-1b-rustfmt-macos-v2.yml
  OUTPUT_BRANCH: qualification/hepta-intelligence-p1-1b-rustfmt-output-c804ce2-20260828
  CRATE_ROOT: codex-rs/hepta-memory-p1-1b-qualification
  MANIFEST_PATH: codex-rs/hepta-memory-p1-1b-qualification/Cargo.toml
  ARTIFACT_DIR: artifacts/hepta-intelligence-p1-1b-rustfmt-macos-v2
  CARGO_NET_OFFLINE: "true"

jobs:
  materialize:
    name: P1.1b macOS rustfmt materialization v2
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact source plus wrapper
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact source binding and wrapper-only commit
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          source = os.environ["SOURCE_SHA"]
          wrapper = os.environ["WRAPPER_PATH"]
          head = git("rev-parse", "HEAD")
          parent = git("rev-parse", "HEAD^")
          commit_count = int(git("rev-list", "--count", f"{source}..HEAD"))
          changed = git("diff", "--name-only", f"{source}..HEAD").splitlines()

          assert parent == source, (parent, source)
          assert commit_count == 1, commit_count
          assert changed == [wrapper], changed

          receipt = {
              "schema": "hepta.intelligence.p1_1b.rustfmt_source_binding.v2",
              "source_commit": source,
              "source_tree": git("rev-parse", f"{source}^{{tree}}"),
              "wrapper_commit": head,
              "wrapper_tree": git("rev-parse", "HEAD^{tree}"),
              "wrapper_path": wrapper,
              "wrapper_only_diff": True,
              "runtime_wired": False,
              "production_authority": False,
          }
          artifact_dir = Path(os.environ["ARTIFACT_DIR"])
          (artifact_dir / "source-binding.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (artifact_dir / "wrapper-changed-paths.txt").write_text(
              "\n".join(changed) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt,clippy

      - name: Verify pinned Rust toolchain
        run: |
          set -euo pipefail
          rustc --version | tee "$ARTIFACT_DIR/rustc-version.txt"
          cargo --version | tee "$ARTIFACT_DIR/cargo-version.txt"
          rustfmt --version | tee "$ARTIFACT_DIR/rustfmt-version.txt"
          cargo clippy --version | tee "$ARTIFACT_DIR/clippy-version.txt"
          test "$(rustc --version | awk '{print $2}')" = "1.95.0"

      - name: Materialize canonical Rust 1.95 formatting
        run: |
          set -euo pipefail
          cargo fmt --manifest-path "$MANIFEST_PATH" --all
          cargo fmt --manifest-path "$MANIFEST_PATH" --all -- --check

      - name: Enforce exact six-file formatting delta
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          expected = [
              "codex-rs/hepta-memory-p1-1b-qualification/src/digest.rs",
              "codex-rs/hepta-memory-p1-1b-qualification/src/embedding.rs",
              "codex-rs/hepta-memory-p1-1b-qualification/src/lib.rs",
              "codex-rs/hepta-memory-p1-1b-qualification/src/route.rs",
              "codex-rs/hepta-memory-p1-1b-qualification/src/tokenizer.rs",
              "codex-rs/hepta-memory-p1-1b-qualification/tests/p1_1b.rs",
          ]
          actual = subprocess.check_output(
              ["git", "diff", "--name-only", "--", os.environ["CRATE_ROOT"]],
              text=True,
          ).splitlines()
          outside = subprocess.check_output(
              ["git", "diff", "--name-only", "--", ".", f":(exclude){os.environ['CRATE_ROOT']}/**"],
              text=True,
          ).splitlines()
          if actual != expected or outside:
              raise SystemExit(
                  json.dumps(
                      {"expected": expected, "actual": actual, "outside": outside},
                      indent=2,
                      sort_keys=True,
                  )
              )
          artifact_dir = Path(os.environ["ARTIFACT_DIR"])
          (artifact_dir / "formatted-changed-paths.txt").write_text(
              "\n".join(actual) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run fail-closed source gate on formatted source
        run: |
          set -o pipefail
          python3 scripts/verify-hepta-intelligence-local-embedding-index.py \
            2>&1 | tee "$ARTIFACT_DIR/source-gate.log"

      - name: Run all formatted unit and integration tests
        run: |
          set -o pipefail
          cargo test \
            --manifest-path "$MANIFEST_PATH" \
            --all-targets -- --nocapture \
            2>&1 | tee "$ARTIFACT_DIR/tests.log"

      - name: Check all formatted targets
        run: |
          set -o pipefail
          cargo check \
            --manifest-path "$MANIFEST_PATH" \
            --all-targets \
            2>&1 | tee "$ARTIFACT_DIR/check.log"

      - name: Run strict Clippy on formatted source
        run: |
          set -o pipefail
          cargo clippy \
            --manifest-path "$MANIFEST_PATH" \
            --all-targets -- -D warnings \
            2>&1 | tee "$ARTIFACT_DIR/clippy.log"

      - name: Create and push exact six-file output commit
        id: output_commit
        run: |
          set -euo pipefail
          git diff --binary -- "$CRATE_ROOT" > /tmp/p1-1b-rustfmt.patch
          test -s /tmp/p1-1b-rustfmt.patch

          git checkout -B "$OUTPUT_BRANCH" "$SOURCE_SHA"
          git apply /tmp/p1-1b-rustfmt.patch
          git diff --check

          python3 - <<'PY'
          import json
          import os
          import subprocess

          expected = [
              "codex-rs/hepta-memory-p1-1b-qualification/src/digest.rs",
              "codex-rs/hepta-memory-p1-1b-qualification/src/embedding.rs",
              "codex-rs/hepta-memory-p1-1b-qualification/src/lib.rs",
              "codex-rs/hepta-memory-p1-1b-qualification/src/route.rs",
              "codex-rs/hepta-memory-p1-1b-qualification/src/tokenizer.rs",
              "codex-rs/hepta-memory-p1-1b-qualification/tests/p1_1b.rs",
          ]
          actual = subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines()
          if actual != expected:
              raise SystemExit(json.dumps({"expected": expected, "actual": actual}, indent=2))
          PY

          git add "$CRATE_ROOT"
          git config user.name "Hepta Qualification Bot"
          git config user.email "102159240+ProfAlexQI@users.noreply.github.com"
          git commit -m "style(intelligence): apply exact P1.1b Rust 1.95 rustfmt"
          output_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          echo "sha=$output_sha" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH"

      - name: Write materialization receipt
        env:
          OUTPUT_SHA: ${{ steps.output_commit.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          changed_paths = (
              Path(os.environ["ARTIFACT_DIR"]) / "formatted-changed-paths.txt"
          ).read_text(encoding="utf-8").splitlines()
          receipt = {
              "schema": "hepta.intelligence.p1_1b.rustfmt_materialization.v2",
              "status": "PASS_P1_1B_RUSTFMT_MATERIALIZATION",
              "source_commit": os.environ["SOURCE_SHA"],
              "output_commit": os.environ["OUTPUT_SHA"],
              "output_branch": os.environ["OUTPUT_BRANCH"],
              "changed_paths": changed_paths,
              "gates": {
                  "source_binding": "success",
                  "toolchain_1_95_0": "success",
                  "rustfmt": "success",
                  "source_gate": "success",
                  "tests": "success",
                  "check": "success",
                  "clippy": "success",
                  "output_commit": "success",
              },
              "runner": {
                  "name": os.environ["RUNNER_NAME"],
                  "os": os.environ["RUNNER_OS"],
                  "arch": os.environ["RUNNER_ARCH"],
              },
              "workflow": {
                  "run_id": int(os.environ["RUN_ID"]),
                  "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              },
              "formatting_only": True,
              "qualified": False,
              "runtime_wired": False,
              "default_recall_changed": False,
              "federation_recall_changed": False,
              "context_attachment": False,
              "physical_send": False,
              "external_effects": False,
              "production_authority": False,
              "operator_acceptance": False,
              "promotion": False,
              "callers_ratchet": False,
          }
          path = Path(os.environ["ARTIFACT_DIR"]) / "materialization-receipt.json"
          path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload exact formatting evidence
        uses: actions/upload-artifact@v4
        with:
          name: hepta-intelligence-p1-1b-rustfmt-macos-v2-${{ github.sha }}
          path: artifacts/hepta-intelligence-p1-1b-rustfmt-macos-v2
          if-no-files-found: error
          retention-days: 14
