name: hepta-ci repair apply

on:
  push:
    branches:
      - codex/hepta-vnext-plan-browser-c0-c3-20260827
    paths:
      - ".github/workflows/hepta-ci-repair-export.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-ci-repair-apply-v2
  cancel-in-progress: true

jobs:
  apply:
    name: Apply verified Rust 1.95 repair artifact
    runs-on: macos-15
    timeout-minutes: 120
    env:
      BRANCH: codex/hepta-vnext-plan-browser-c0-c3-20260827
      REPAIR_ARTIFACT_ID: "9695404341"
      REPAIR_ARTIFACT_SHA256: "74c923d4eb0e1d174307977e17123b2e2c1cff6119592787ec8c0af1f438232b"
      REPAIR_SOURCE_HEAD: "369b7827387a752f813962e9ae28f11973e1d9e5"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          ref: codex/hepta-vnext-plan-browser-c0-c3-20260827
          fetch-depth: 10

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Verify exact base delta and download retained repair artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$REPAIR_SOURCE_HEAD" HEAD
          mapfile -t intervening < <(git diff --name-only "$REPAIR_SOURCE_HEAD"..HEAD)
          if [[ ${#intervening[@]} -ne 1 || "${intervening[0]}" != ".github/workflows/hepta-ci-repair-export.yml" ]]; then
            printf 'unexpected changes after retained repair source:\n%s\n' "${intervening[*]}" >&2
            exit 1
          fi

          repair="$RUNNER_TEMP/hepta-ci-repair"
          mkdir -p "$repair"
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REPAIR_ARTIFACT_ID}/zip" \
            --output "$repair/artifact.zip"

          python3 - "$repair/artifact.zip" "$REPAIR_ARTIFACT_SHA256" <<'PY'
          import hashlib
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          expected = sys.argv[2]
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"artifact digest mismatch: {actual} != {expected}")
          PY
          unzip -q "$repair/artifact.zip" -d "$repair/archive"

      - name: Verify and apply exact regular-file repair tree
        shell: bash
        run: |
          set -euo pipefail
          repair="$RUNNER_TEMP/hepta-ci-repair/archive"
          python3 - "$repair" "$GITHUB_WORKSPACE" "$REPAIR_SOURCE_HEAD" <<'PY'
          import hashlib
          import pathlib
          import shutil
          import sys
          import tarfile

          repair = pathlib.Path(sys.argv[1]).resolve()
          root = pathlib.Path(sys.argv[2]).resolve()
          expected_source = sys.argv[3]

          source_head = (repair / "source-head.txt").read_text(encoding="utf-8-sig").strip()
          if source_head != expected_source:
              raise SystemExit(f"repair source mismatch: {source_head} != {expected_source}")
          for name in ("repair.patch", "repair-tree.tar"):
              expected = (repair / f"{name}.sha256").read_text(encoding="ascii").split()[0]
              actual = hashlib.sha256((repair / name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"repair digest mismatch for {name}: {actual} != {expected}")

          expected_names = [
              line.strip()
              for line in (repair / "changed-files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          if not expected_names or len(expected_names) != len(set(expected_names)):
              raise SystemExit("repair path list is empty or contains duplicates")

          with tarfile.open(repair / "repair-tree.tar", "r:") as archive:
              members = archive.getmembers()
              names = [member.name for member in members]
              if names != expected_names:
                  raise SystemExit("repair tar path order/set does not match changed-files.txt")
              for member in members:
                  pure = pathlib.PurePosixPath(member.name)
                  if (
                      not member.isfile()
                      or pure.is_absolute()
                      or ".." in pure.parts
                      or member.issym()
                      or member.islnk()
                  ):
                      raise SystemExit(f"unsafe repair member: {member.name}")
                  target = root.joinpath(*pure.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f"cannot read repair member: {member.name}")
                  with source, target.open("wb") as output:
                      shutil.copyfileobj(source, output)
          PY

      - name: Verify original locked gates against applied repair
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          (
            cd codex-rs
            cargo +1.95.0 metadata --locked --no-deps --format-version 1 >/dev/null
            cargo +1.95.0 check --locked --no-default-features \
              -p codex-hepta-contracts \
              --features authbus-local-qualification \
              --all-targets
            cargo +1.95.0 test --locked --no-default-features \
              -p codex-hepta-contracts \
              --features authbus-local-qualification \
              --tests -- --nocapture
          )
          git diff --check

      - name: Enforce exact repair boundary and push non-force
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "remote branch moved during repair: $remote_head != $GITHUB_SHA" >&2
            exit 1
          fi

          python3 - <<'PY'
          import pathlib
          import subprocess

          names = [
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True, encoding="utf-8"
              ).splitlines()
              if line.strip()
          ]
          allowed_workflows = {
              ".github/workflows/bazel.yml",
              ".github/workflows/blob-size-policy.yml",
              ".github/workflows/cargo-deny.yml",
              ".github/workflows/codespell.yml",
              ".github/workflows/hepta-browser-c1-artifact-gate.yml",
              ".github/workflows/hepta-browser-c1-protocol.yml",
              ".github/workflows/hepta-browser-c1-startup-bridge.yml",
              ".github/workflows/hepta-browser-ci.yml",
              ".github/workflows/hepta-servo-artifact-contract.yml",
              ".github/workflows/hepta-servo-build-input-contract-v3.yml",
              ".github/workflows/hepta-servo-build-preflight-contract.yml",
              ".github/workflows/hepta-servo-exact-source-acceptance-live-review-v2.yml",
              ".github/workflows/hepta-servo-exact-source-acceptance-pointer-v1-contract.yml",
              ".github/workflows/hepta-servo-exact-source-review-candidate-v2-contract.yml",
              ".github/workflows/hepta-servo-independent-source-contract-v3.yml",
              ".github/workflows/hepta-servo-independent-source-qualification-v3.yml",
              ".github/workflows/hepta-servo-worker-source-topology-acceptance-live-review-v1.yml",
              ".github/workflows/hepta-servo-worker-source-topology-acceptance-pointer-v1-contract.yml",
              ".github/workflows/hepta-servo-worker-source-topology-contract.yml",
              ".github/workflows/hepta-vnext-qualification.yml",
              ".github/workflows/repo-checks.yml",
              ".github/workflows/rust-ci.yml",
              ".github/workflows/sdk.yml",
          }
          rejected = []
          for name in names:
              path = pathlib.PurePosixPath(name)
              if name in allowed_workflows or name == "codex-rs/Cargo.lock":
                  continue
              if path.suffix == ".rs" and path.parts and path.parts[0] == "codex-rs":
                  continue
              rejected.append(name)
          if rejected:
              raise SystemExit(f"repair tree changed paths outside the boundary: {rejected}")
          PY

          rm .github/workflows/hepta-ci-repair-export.yml
          git diff --check
          git config user.name "hepta-ci-repair-bot"
          git config user.email "102159240+ProfAlexQI@users.noreply.github.com"
          git add --all
          git commit -m "fix(ci): apply verified Rust 1.95 repair artifact"
          git push origin "HEAD:refs/heads/$BRANCH"
