name: hepta-ci repair apply

on:
  push:
    branches:
      - codex/hepta-vnext-plan-browser-c0-c3-20260827
    paths:
      - ".github/workflows/hepta-ci-repair-export.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-ci-repair-apply-v1
  cancel-in-progress: true

jobs:
  apply:
    name: Apply deterministic CI repair tree
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Configure Git long paths before checkout
        shell: pwsh
        working-directory: .
        run: git config --global core.longpaths true

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          ref: codex/hepta-vnext-plan-browser-c0-c3-20260827
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Generate exact Rust 1.95 repair tree
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path

          runner_files = [
              ".github/workflows/blocking-ci.yml",
              ".github/workflows/bazel.yml",
              ".github/workflows/blob-size-policy.yml",
              ".github/workflows/cargo-deny.yml",
              ".github/workflows/codespell.yml",
              ".github/workflows/hepta-browser-c1-artifact-gate.yml",
              ".github/workflows/hepta-servo-artifact-contract.yml",
              ".github/workflows/repo-checks.yml",
              ".github/workflows/rust-ci.yml",
              ".github/workflows/sdk.yml",
              ".github/workflows/hepta-browser-ci.yml",
              ".github/workflows/hepta-browser-c1-protocol.yml",
              ".github/workflows/hepta-browser-c1-startup-bridge.yml",
              ".github/workflows/hepta-servo-independent-source-contract-v3.yml",
              ".github/workflows/hepta-servo-exact-source-review-candidate-v2-contract.yml",
              ".github/workflows/hepta-servo-worker-source-topology-contract.yml",
              ".github/workflows/hepta-servo-exact-source-acceptance-pointer-v1-contract.yml",
              ".github/workflows/hepta-servo-worker-source-topology-acceptance-pointer-v1-contract.yml",
              ".github/workflows/hepta-servo-build-input-contract-v3.yml",
              ".github/workflows/hepta-servo-build-preflight-contract.yml",
              ".github/workflows/hepta-servo-independent-source-qualification-v3.yml",
              ".github/workflows/hepta-servo-exact-source-acceptance-live-review-v2.yml",
              ".github/workflows/hepta-servo-worker-source-topology-acceptance-live-review-v1.yml",
          ]
          for name in runner_files:
              path = Path(name)
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"missing or unsafe required workflow: {name}")
              text = path.read_text(encoding="utf-8")
              text = text.replace("runs-on: ubuntu-24.04", "runs-on: ubuntu-22.04")
              text = text.replace("runs-on: ubuntu-latest", "runs-on: ubuntu-22.04")
              with path.open("w", encoding="utf-8", newline="\n") as handle:
                  handle.write(text)

          workflow = Path(".github/workflows/hepta-vnext-qualification.yml")
          text = workflow.read_text(encoding="utf-8")
          needle = "        shell: pwsh\n        run: git config --global core.longpaths true\n"
          replacement = (
              "        shell: pwsh\n"
              "        working-directory: .\n"
              "        run: git config --global core.longpaths true\n"
          )
          if needle not in text and replacement not in text:
              raise SystemExit("Windows long-path pre-checkout step shape drifted")
          with workflow.open("w", encoding="utf-8", newline="\n") as handle:
              handle.write(text.replace(needle, replacement, 1))
          '@ | python -

          cargo +1.95.0 fmt --manifest-path codex-rs/Cargo.toml --all
          Push-Location codex-rs
          try {
            cargo +1.95.0 check --no-default-features -p codex-hepta-contracts --features authbus-local-qualification --all-targets
          } finally {
            Pop-Location
          }

      - name: Verify original locked gates against generated tree
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo +1.95.0 fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          Push-Location codex-rs
          try {
            cargo +1.95.0 metadata --locked --no-deps --format-version 1 | Out-Null
            cargo +1.95.0 check --locked --no-default-features -p codex-hepta-contracts --features authbus-local-qualification --all-targets
            cargo +1.95.0 test --locked --no-default-features -p codex-hepta-contracts --features authbus-local-qualification --tests -- --nocapture
          } finally {
            Pop-Location
          }
          git diff --check

      - name: Enforce changed-path boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import pathlib
          import subprocess

          allowed_workflows = {
              ".github/workflows/bazel.yml",
              ".github/workflows/blob-size-policy.yml",
              ".github/workflows/blocking-ci.yml",
              ".github/workflows/cargo-deny.yml",
              ".github/workflows/codespell.yml",
              ".github/workflows/hepta-browser-c1-artifact-gate.yml",
              ".github/workflows/hepta-browser-c1-protocol.yml",
              ".github/workflows/hepta-browser-c1-startup-bridge.yml",
              ".github/workflows/hepta-browser-ci.yml",
              ".github/workflows/hepta-servo-artifact-contract.yml",
              ".github/workflows/hepta-servo-build-input-contract-v3.yml",
              ".github/workflows/hepta-servo-build-preflight-contract.yml",
              ".github/workflows/hepta-servo-exact-source-acceptance-live-review-v2.yml",
              ".github/workflows/hepta-servo-exact-source-acceptance-pointer-v1-contract.yml",
              ".github/workflows/hepta-servo-exact-source-review-candidate-v2-contract.yml",
              ".github/workflows/hepta-servo-independent-source-contract-v3.yml",
              ".github/workflows/hepta-servo-independent-source-qualification-v3.yml",
              ".github/workflows/hepta-servo-worker-source-topology-acceptance-live-review-v1.yml",
              ".github/workflows/hepta-servo-worker-source-topology-acceptance-pointer-v1-contract.yml",
              ".github/workflows/hepta-servo-worker-source-topology-contract.yml",
              ".github/workflows/hepta-vnext-qualification.yml",
              ".github/workflows/repo-checks.yml",
              ".github/workflows/rust-ci.yml",
              ".github/workflows/sdk.yml",
          }
          names = [
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True, encoding="utf-8"
              ).splitlines()
              if line.strip()
          ]
          if not names:
              raise SystemExit("repair tree unexpectedly contains no changes")
          rejected = []
          for name in names:
              path = pathlib.PurePosixPath(name)
              if name in allowed_workflows or name == "codex-rs/Cargo.lock":
                  continue
              if path.suffix == ".rs" and path.parts and path.parts[0] == "codex-rs":
                  continue
              rejected.append(name)
          if rejected:
              raise SystemExit(f"repair tree changed paths outside the boundary: {rejected}")
          print("\n".join(names))
          '@ | python -

      - name: Commit exact repair and remove one-shot workflow
        shell: pwsh
        env:
          BRANCH: codex/hepta-vnext-plan-browser-c0-c3-20260827
        run: |
          $ErrorActionPreference = "Stop"
          $remoteLine = git ls-remote origin "refs/heads/$env:BRANCH"
          if ([string]::IsNullOrWhiteSpace($remoteLine)) { throw "remote branch is missing" }
          $remoteHead = ($remoteLine -split "`t")[0]
          if ($remoteHead -ne $env:GITHUB_SHA) {
            throw "remote branch moved during repair: $remoteHead != $env:GITHUB_SHA"
          }
          Remove-Item -LiteralPath ".github/workflows/hepta-ci-repair-export.yml"
          git diff --check
          git config user.name "hepta-ci-repair-bot"
          git config user.email "102159240+ProfAlexQI@users.noreply.github.com"
          git add --all
          git commit -m "fix(ci): apply deterministic Rust 1.95 repair tree"
          git push origin "HEAD:refs/heads/$env:BRANCH"
