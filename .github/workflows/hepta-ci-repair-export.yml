name: hepta-ci repair export

on:
  pull_request:
    paths:
      - ".github/workflows/hepta-ci-repair-export.yml"
      - ".github/workflows/hepta-vnext-qualification.yml"
      - ".github/workflows/hepta-browser-*.yml"
      - ".github/workflows/hepta-servo-*.yml"
      - ".github/workflows/blocking-ci.yml"
      - ".github/workflows/bazel.yml"
      - ".github/workflows/blob-size-policy.yml"
      - ".github/workflows/cargo-deny.yml"
      - ".github/workflows/codespell.yml"
      - ".github/workflows/repo-checks.yml"
      - ".github/workflows/rust-ci.yml"
      - ".github/workflows/sdk.yml"
      - "codex-rs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: true

jobs:
  export:
    name: Generate deterministic CI repair patch
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Generate deterministic repair tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runner_files = [
              ".github/workflows/blocking-ci.yml",
              ".github/workflows/bazel.yml",
              ".github/workflows/blob-size-policy.yml",
              ".github/workflows/cargo-deny.yml",
              ".github/workflows/codespell.yml",
              ".github/workflows/hepta-browser-c1-artifact-gate.yml",
              ".github/workflows/hepta-servo-artifact-contract.yml",
              ".github/workflows/repo-checks.yml",
              ".github/workflows/rust-ci.yml",
              ".github/workflows/sdk.yml",
              ".github/workflows/hepta-browser-ci.yml",
              ".github/workflows/hepta-browser-c1-protocol.yml",
              ".github/workflows/hepta-browser-c1-startup-bridge.yml",
              ".github/workflows/hepta-servo-independent-source-contract-v3.yml",
              ".github/workflows/hepta-servo-exact-source-review-candidate-v2-contract.yml",
              ".github/workflows/hepta-servo-worker-source-topology-contract.yml",
              ".github/workflows/hepta-servo-exact-source-acceptance-pointer-v1-contract.yml",
              ".github/workflows/hepta-servo-worker-source-topology-acceptance-pointer-v1-contract.yml",
              ".github/workflows/hepta-servo-build-input-contract-v3.yml",
              ".github/workflows/hepta-servo-build-preflight-contract.yml",
          ]
          for name in runner_files:
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"missing required workflow: {name}")
              text = path.read_text(encoding="utf-8")
              text = text.replace("runs-on: ubuntu-24.04", "runs-on: ubuntu-22.04")
              text = text.replace("runs-on: ubuntu-latest", "runs-on: ubuntu-22.04")
              path.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/hepta-vnext-qualification.yml")
          text = workflow.read_text(encoding="utf-8")
          needle = "        shell: pwsh\n        run: git config --global core.longpaths true\n"
          replacement = (
              "        shell: pwsh\n"
              "        working-directory: .\n"
              "        run: git config --global core.longpaths true\n"
          )
          if needle not in text and replacement not in text:
              raise SystemExit("Windows long-path pre-checkout step shape drifted")
          workflow.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          PY

          cargo +1.95.0 fmt --manifest-path codex-rs/Cargo.toml --all
          (
            cd codex-rs
            cargo +1.95.0 metadata --no-deps --format-version 1 >/dev/null
          )

          mkdir -p "$RUNNER_TEMP/hepta-ci-repair"
          git diff --binary --full-index --no-ext-diff > "$RUNNER_TEMP/hepta-ci-repair/repair.patch"
          git diff --name-only > "$RUNNER_TEMP/hepta-ci-repair/changed-files.txt"
          git status --short > "$RUNNER_TEMP/hepta-ci-repair/status.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/hepta-ci-repair/source-head.txt"
          test -s "$RUNNER_TEMP/hepta-ci-repair/repair.patch"
          cat "$RUNNER_TEMP/hepta-ci-repair/status.txt"

      - name: Verify generated repair inputs
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          (
            cd codex-rs
            cargo +1.95.0 metadata --locked --no-deps --format-version 1 >/dev/null
          )
          git diff --check

      - name: Upload deterministic repair patch
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-ci-repair-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/hepta-ci-repair
          if-no-files-found: error
          retention-days: 1
