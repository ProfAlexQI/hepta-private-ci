name: Hepta Intelligence Q0.1 cargo-deny exact evidence

on:
  push:
    branches:
      - "automation/hepta-q0-1-cargo-deny-evidence-20260830-0115"

permissions:
  contents: read

concurrency:
  group: hepta-q0-1-cargo-deny-evidence-20260830-0115
  cancel-in-progress: true

env:
  REPOSITORY: ProfHepta/hepta-private-ci
  BASE_SHA: c768bcbeb4c1168088d2499828c24da521a2a73a
  HEAD_SHA: 99b2b44c00bf7b50b588fffddc299bf55fac698a
  HEAD_TREE: 381ed770be51883db94b717e21a96277de726238
  MERGE_SHA: 06661355415a257f19dcae1d23c3914a850eb2c2

jobs:
  exact-head:
    name: Q0.1 exact-head cargo-deny policy
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact Q0.1 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact head identity and topology
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPOSITORY"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" = 1
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/cargo-deny.yml"
          git diff --check HEAD^ HEAD

      - name: Run cargo-deny with checked-in repository policy
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246
        with:
          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml
          arguments: --all-features
          command-arguments: --config ./codex-rs/deny.toml

      - name: Emit exact-head receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/q0-1-head
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          workflow = pathlib.Path('.github/workflows/cargo-deny.yml')
          receipt = {
              'schema': 'hepta_intelligence_q0_1_cargo_deny_evidence_v1',
              'status': 'PASS_HEPTA_INTELLIGENCE_Q0_1_CARGO_DENY_EXACT_HEAD',
              'candidate': {
                  'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                  'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                  'parent': subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip(),
              },
              'cargo_deny_workflow_blob': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD:.github/workflows/cargo-deny.yml'], text=True
              ).strip(),
              'cargo_deny_workflow_sha256': hashlib.sha256(workflow.read_bytes()).hexdigest(),
              'policy_path': 'codex-rs/deny.toml',
              'policy_sha256': hashlib.sha256(pathlib.Path('codex-rs/deny.toml').read_bytes()).hexdigest(),
              'source_writeback': False,
              'runtime_authority': False,
              'production_authority': False,
          }
          pathlib.Path('artifacts/q0-1-head/receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload exact-head receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-q0-1-cargo-deny-head-${{ env.HEAD_SHA }}
          path: artifacts/q0-1-head/**
          if-no-files-found: error
          retention-days: 30

  synthetic-merge:
    name: Q0.1 synthetic-merge cargo-deny policy
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact synthetic merge candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 3
          persist-credentials: false

      - name: Verify exact merge identity and topology
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPOSITORY"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$HEAD_SHA"
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" = 3
          git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Run cargo-deny with checked-in repository policy
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246
        with:
          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml
          arguments: --all-features
          command-arguments: --config ./codex-rs/deny.toml

      - name: Emit synthetic-merge receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/q0-1-merge
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          workflow = pathlib.Path('.github/workflows/cargo-deny.yml')
          receipt = {
              'schema': 'hepta_intelligence_q0_1_cargo_deny_evidence_v1',
              'status': 'PASS_HEPTA_INTELLIGENCE_Q0_1_CARGO_DENY_SYNTHETIC_MERGE',
              'candidate': {
                  'merge': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                  'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                  'base': subprocess.check_output(['git', 'rev-parse', 'HEAD^1'], text=True).strip(),
                  'head': subprocess.check_output(['git', 'rev-parse', 'HEAD^2'], text=True).strip(),
              },
              'cargo_deny_workflow_blob': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD:.github/workflows/cargo-deny.yml'], text=True
              ).strip(),
              'cargo_deny_workflow_sha256': hashlib.sha256(workflow.read_bytes()).hexdigest(),
              'policy_path': 'codex-rs/deny.toml',
              'policy_sha256': hashlib.sha256(pathlib.Path('codex-rs/deny.toml').read_bytes()).hexdigest(),
              'source_writeback': False,
              'runtime_authority': False,
              'production_authority': False,
          }
          pathlib.Path('artifacts/q0-1-merge/receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload synthetic-merge receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-q0-1-cargo-deny-merge-${{ env.MERGE_SHA }}
          path: artifacts/q0-1-merge/**
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Q0.1 cargo-deny exact evidence aggregate
    needs: [exact-head, synthetic-merge]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Enforce both immutable candidates passed
        shell: bash
        env:
          HEAD_RESULT: ${{ needs.exact-head.result }}
          MERGE_RESULT: ${{ needs.synthetic-merge.result }}
        run: |
          set -euo pipefail
          test "$HEAD_RESULT" = success
          test "$MERGE_RESULT" = success
          mkdir -p artifacts/q0-1-aggregate
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          receipt = {
              'schema': 'hepta_intelligence_q0_1_cargo_deny_pair_v1',
              'status': 'PASS_HEPTA_INTELLIGENCE_Q0_1_CARGO_DENY_PAIR',
              'repository': os.environ['REPOSITORY'],
              'base': os.environ['BASE_SHA'],
              'head': os.environ['HEAD_SHA'],
              'head_tree': os.environ['HEAD_TREE'],
              'synthetic_merge': os.environ['MERGE_SHA'],
              'exact_head_result': os.environ['HEAD_RESULT'],
              'synthetic_merge_result': os.environ['MERGE_RESULT'],
              'source_writeback': False,
              'runtime_authority': False,
              'production_authority': False,
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()
          receipt['receipt_binding_sha256'] = hashlib.sha256(canonical).hexdigest()
          pathlib.Path('artifacts/q0-1-aggregate/receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload aggregate receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-q0-1-cargo-deny-pair-${{ env.HEAD_SHA }}
          path: artifacts/q0-1-aggregate/**
          if-no-files-found: error
          retention-days: 30
