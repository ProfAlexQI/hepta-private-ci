name: Hepta Q0 Bazel runner closure carrier

on:
  push:
    branches:
      - codex/hepta-intelligence-plan-v3-20260828

permissions:
  contents: read

concurrency:
  group: hepta-q0-bazel-runner-closure-carrier
  cancel-in-progress: true

env:
  SOURCE_SHA: 53e62c7b19b277bf2284b1959154a42352e148dd
  TARGET_BRANCH: codex/hepta-intelligence-plan-v3-20260828
  CARRIER_PATH: .github/workflows/hepta-q0-bazel-runner-closure-carrier.yml
  BAZEL_WORKFLOW: .github/workflows/bazel.yml
  ARTIFACT_DIR: artifacts/hepta-q0-bazel-runner-closure

jobs:
  close:
    name: Materialize exact Bazel hosted-runner closure
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout exact carrier commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify carrier lease
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git diff --name-only "$SOURCE_SHA"..HEAD)" = "$CARRIER_PATH"

      - name: Materialize exact Bazel workflow closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          bazel_path = Path(os.environ["BAZEL_WORKFLOW"])
          text = bazel_path.read_text(encoding="utf-8")

          old_macos = "macos-15-xlarge"
          if text.count(old_macos) != 4:
              raise SystemExit(
                  f"expected four macos-15-xlarge entries, found {text.count(old_macos)}"
              )
          text = text.replace(old_macos, "macos-15")

          checkout = (
              "      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2\n"
          )
          long_paths = (
              "      - name: Enable Windows long paths before checkout\n"
              "        if: runner.os == 'Windows'\n"
              "        shell: pwsh\n"
              "        run: git config --system core.longpaths true\n\n"
          )
          if text.count(checkout) != 5:
              raise SystemExit(
                  f"expected five Bazel checkout sites, found {text.count(checkout)}"
              )
          if "Enable Windows long paths before checkout" in text:
              raise SystemExit("unexpected pre-existing long-path preflight")
          text = text.replace(checkout, long_paths + checkout)
          bazel_path.write_text(text, encoding="utf-8")
          PY

          test "$(grep -c 'macos-15-xlarge' "$BAZEL_WORKFLOW" || true)" = "0"
          test "$(grep -c -- '- os: macos-15$' "$BAZEL_WORKFLOW")" = "4"
          test "$(grep -c 'Enable Windows long paths before checkout' "$BAZEL_WORKFLOW")" = "5"
          test "$(grep -c 'git config --system core.longpaths true' "$BAZEL_WORKFLOW")" = "5"
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0))' "$BAZEL_WORKFLOW"
          git diff --check

          mkdir -p "$ARTIFACT_DIR/.github/workflows"
          cp "$BAZEL_WORKFLOW" "$ARTIFACT_DIR/$BAZEL_WORKFLOW"
          git diff --binary -- "$BAZEL_WORKFLOW" > "$ARTIFACT_DIR/bazel-closure.patch"
          sha256sum "$ARTIFACT_DIR/$BAZEL_WORKFLOW" \
            > "$ARTIFACT_DIR/bazel.yml.sha256"

      - name: Upload exact Bazel closure artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-q0-bazel-runner-closure-${{ github.sha }}
          path: artifacts/hepta-q0-bazel-runner-closure/**
          if-no-files-found: error
          retention-days: 14
