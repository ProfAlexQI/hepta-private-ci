name: Hepta Q0 Bazel runner closure carrier

on:
  push:
    branches:
      - codex/hepta-intelligence-plan-v3-20260828

permissions:
  contents: write

concurrency:
  group: hepta-q0-bazel-runner-closure-carrier
  cancel-in-progress: true

env:
  SOURCE_SHA: 830a26b9b086ba22d0ad45b1edca74221d8b5b74
  TARGET_BRANCH: codex/hepta-intelligence-plan-v3-20260828
  CARRIER_PATH: .github/workflows/hepta-q0-bazel-runner-closure-carrier.yml
  BAZEL_WORKFLOW: .github/workflows/bazel.yml
  Q0_WORKFLOW: .github/workflows/hepta-intelligence-q0-paired-candidate-v10.yml

jobs:
  close:
    name: Close Bazel hosted-runner checkout gaps
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout exact carrier commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify carrier lease
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git diff --name-only "$SOURCE_SHA"..HEAD)" = "$CARRIER_PATH"

      - name: Apply exact Bazel runner closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          bazel_path = Path(os.environ["BAZEL_WORKFLOW"])
          text = bazel_path.read_text(encoding="utf-8")

          old_macos = "macos-15-xlarge"
          if text.count(old_macos) != 4:
              raise SystemExit(
                  f"expected four macos-15-xlarge matrix entries, found {text.count(old_macos)}"
              )
          text = text.replace(old_macos, "macos-15")

          checkout = (
              "      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2\n"
          )
          long_paths = (
              "      - name: Enable Windows long paths before checkout\n"
              "        if: runner.os == 'Windows'\n"
              "        shell: pwsh\n"
              "        run: git config --system core.longpaths true\n\n"
          )
          if text.count(checkout) != 5:
              raise SystemExit(
                  f"expected five Bazel checkout sites, found {text.count(checkout)}"
              )
          if "Enable Windows long paths before checkout" in text:
              raise SystemExit("Bazel workflow already contains an unexpected long-path preflight")
          text = text.replace(checkout, long_paths + checkout)
          bazel_path.write_text(text, encoding="utf-8")

          q0_path = Path(os.environ["Q0_WORKFLOW"])
          q0 = q0_path.read_text(encoding="utf-8")
          matches = re.findall(r"(?m)^  EXPECTED_PARENT: ([0-9a-f]{40})$", q0)
          if matches != ["18c2af1563b863fc3cc4d4eede986a90884441d3"]:
              raise SystemExit(f"unexpected Q0 expected-parent state: {matches}")
          q0 = re.sub(
              r"(?m)^  EXPECTED_PARENT: [0-9a-f]{40}$",
              f"  EXPECTED_PARENT: {os.environ['GITHUB_SHA']}",
              q0,
              count=1,
          )
          q0_path.write_text(q0, encoding="utf-8")
          PY

          rm "$CARRIER_PATH"

          test "$(grep -c 'macos-15-xlarge' "$BAZEL_WORKFLOW" || true)" = "0"
          test "$(grep -c -- '- os: macos-15$' "$BAZEL_WORKFLOW")" = "4"
          test "$(grep -c 'Enable Windows long paths before checkout' "$BAZEL_WORKFLOW")" = "5"
          test "$(grep -c 'git config --system core.longpaths true' "$BAZEL_WORKFLOW")" = "5"
          test "$(grep -c 'uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd' "$BAZEL_WORKFLOW")" = "5"
          test "$(grep -c "EXPECTED_PARENT: $GITHUB_SHA" "$Q0_WORKFLOW")" = "1"
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0))' "$BAZEL_WORKFLOW"
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0))' "$Q0_WORKFLOW"
          git diff --check

          mapfile -t paths < <(git diff --name-only | LC_ALL=C sort)
          expected=(
            .github/workflows/bazel.yml
            .github/workflows/hepta-intelligence-q0-paired-candidate-v10.yml
            .github/workflows/hepta-q0-bazel-runner-closure-carrier.yml
          )
          test "${paths[*]}" = "${expected[*]}"

      - name: Commit and fast-forward the canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta Qualification Bot"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add -A -- "$BAZEL_WORKFLOW" "$Q0_WORKFLOW" "$CARRIER_PATH"
          git commit -m "ci: close Bazel hosted-runner checkout gaps"
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          git fetch --no-tags origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")" = "$GITHUB_SHA"
          git push origin "$candidate:refs/heads/$TARGET_BRANCH"
