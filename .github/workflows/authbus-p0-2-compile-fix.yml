name: AuthBus P0.2 one-shot compile-fix qualification

on:
  push:
    branches:
      - integration/vnext-main-full-ci-authbus-p0-2-20260828
    paths:
      - .github/workflows/authbus-p0-2-compile-fix.yml

permissions:
  contents: write

env:
  MANIFEST: codex-rs/hepta-authbus-qualification/Cargo.toml
  PACKAGE: codex-hepta-authbus-qualification
  CRATE_ROOT: codex-rs/hepta-authbus-qualification
  EXPECTED_PARENT: d9797cc9c74cab34b33f088dea31f7f9466ac7f8

jobs:
  fix-and-qualify:
    name: Apply exact compile fixes and pass the full P0.2 matrix
    runs-on: ubuntu-slim
    timeout-minutes: 45
    steps:
      - name: Checkout exact one-shot candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Verify branch, head, and exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "integration/vnext-main-full-ci-authbus-p0-2-20260828"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"

      - name: Apply deterministic compile fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fix-authbus-p0-2-compile.py
          python3 scripts/verify-authbus-p0-2.py | tee authbus-p0-2-source-receipt.json
          grep -q 'PASS_AUTHBUS_P0_2_SOURCE_ONLY' authbus-p0-2-source-receipt.json
          git diff --check

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Verify compiler and committed lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc -V | awk '{print $2}')" = "1.95.0"
          test -s "${CRATE_ROOT}/Cargo.lock"
          cargo metadata --manifest-path "${MANIFEST}" --locked --format-version 1 --no-deps >/dev/null
          git diff --exit-code -- "${CRATE_ROOT}/Cargo.lock"

      - name: Format only the P0.2 package
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path "${MANIFEST}" --package "${PACKAGE}"
          git diff --check

      - name: Check default-off posture
        shell: bash
        run: cargo test --manifest-path "${MANIFEST}" --locked --no-default-features --lib -- --nocapture

      - name: Run SQLite WAL recovery matrix
        shell: bash
        run: cargo test --manifest-path "${MANIFEST}" --locked --features sqlite-qualification --tests -- --nocapture

      - name: Check all targets
        shell: bash
        run: cargo check --manifest-path "${MANIFEST}" --locked --features sqlite-qualification --all-targets

      - name: Run strict Clippy
        shell: bash
        run: cargo clippy --manifest-path "${MANIFEST}" --locked --features sqlite-qualification --all-targets -- -D warnings

      - name: Commit only qualified source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "${CRATE_ROOT}/src/model.rs" \
            "${CRATE_ROOT}/src/store.rs"

          allowed='^codex-rs/hepta-authbus-qualification/src/(model|store)[.]rs$'
          changed="$(git diff --cached --name-only)"
          test -n "${changed}"
          while IFS= read -r path; do
            test -n "${path}"
            echo "${path}" | grep -Eq "${allowed}"
          done <<<"${changed}"

          git diff --cached --check
          git commit -m "fix(authbus): compile P0.2 against exact contracts and SQLx 0.9"
          git push origin "HEAD:${GITHUB_REF_NAME}" \
            --force-with-lease="refs/heads/${GITHUB_REF_NAME}:${GITHUB_SHA}"
