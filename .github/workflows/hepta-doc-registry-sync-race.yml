name: Hepta DOC-REGISTRY-CLOSED-WORLD runner race

on:
  push:
    branches:
      - integration/vnext-main-20260811
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-doc-registry-runner-race
  cancel-in-progress: false

env:
  REPOSITORY_FULL_NAME: TrillionniumFoundation/hepta-private-ci
  CURRENT_DEFAULT: integration/vnext-main-20260811
  FUTURE_DEFAULT: main

jobs:
  synchronize:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            lane: arm-linux
          - runner: macos-15
            lane: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out exact mirrored repository tip
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Bind exact two-ref repository state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name "Hepta Repository Consolidation"
          git config user.email "hepta-repository-consolidation@users.noreply.github.com"
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse refs/remotes/origin/$CURRENT_DEFAULT)" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/$FUTURE_DEFAULT)" = "$GITHUB_SHA"
          test "$(git ls-remote --heads origin | wc -l | tr -d ' ')" = "2"
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['REPOSITORY_FULL_NAME']
          token = os.environ['GH_TOKEN']
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/pulls?state=open&per_page=1',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'hepta-doc-registry-runner-race',
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              pulls = json.loads(response.read())
          if pulls:
              raise SystemExit(f"open pull requests remain: {[pull['number'] for pull in pulls]}")
          print(json.dumps({'openPullRequests': 0}, sort_keys=True))
          PY

      - name: Synchronize and verify the closed-world document registries
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/hepta-doc-registry-sync.py
          python3 scripts/hepta-docs.py generate-status
          python3 scripts/hepta-docs.py self-test
          python3 scripts/hepta-docs.py inventory-legacy
          python3 scripts/hepta-docs.py verify
          git diff --check
          python3 - <<'PY'
          import subprocess

          expected = {
              'docs/CURRENT.json',
              'docs/DEVELOPMENT.md',
              'docs/STATUS.md',
              'docs/delivery/WORK_PACKAGES.json',
          }
          observed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if observed != expected:
              raise SystemExit(f'unexpected document diff: {sorted(observed)}')
          PY

      - name: Commit documents and remove all transient synchronization tooling
        shell: bash
        run: |
          set -euo pipefail
          git add docs/CURRENT.json docs/DEVELOPMENT.md docs/STATUS.md docs/delivery/WORK_PACKAGES.json
          git commit -s \
            -m "docs(repo): synchronize DOC-REGISTRY-CLOSED-WORLD" \
            -m "Record the completed ancestry/ref consolidation and the exact remaining repository-administration gate. DOC-2 stays blocked until GitHub selects the existing main ref as default. Authority delta: none."
          python3 scripts/hepta-docs.py verify
          git rm \
            .github/workflows/hepta-doc-registry-sync-slim.yml \
            .github/workflows/hepta-doc-registry-sync-race.yml \
            .github/scripts/hepta-doc-registry-sync.py
          git commit -s \
            -m "ops(repo): remove transient consolidation tooling" \
            -m "The ancestry, pull-request and branch-reference consolidation is complete. Retain no reusable branch-management or one-shot document-sync mechanism in the selected tree. Authority delta: none."
          python3 scripts/hepta-docs.py verify
          git diff --check

      - name: Atomically publish only if both retained refs still equal the trigger SHA
        shell: bash
        run: |
          set -euo pipefail
          git push --atomic \
            --force-with-lease="refs/heads/$CURRENT_DEFAULT:$GITHUB_SHA" \
            --force-with-lease="refs/heads/$FUTURE_DEFAULT:$GITHUB_SHA" \
            origin \
            HEAD:refs/heads/$CURRENT_DEFAULT \
            HEAD:refs/heads/$FUTURE_DEFAULT
          git rev-parse HEAD > /tmp/final-head

      - name: Verify published state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          final_head="$(cat /tmp/final-head)"
          test "$(git rev-parse refs/remotes/origin/$CURRENT_DEFAULT)" = "$final_head"
          test "$(git rev-parse refs/remotes/origin/$FUTURE_DEFAULT)" = "$final_head"
          test "$(git ls-remote --heads origin | wc -l | tr -d ' ')" = "2"
          test ! -e .github/workflows/hepta-doc-registry-sync-slim.yml
          test ! -e .github/workflows/hepta-doc-registry-sync-race.yml
          test ! -e .github/scripts/hepta-doc-registry-sync.py
          python3 scripts/hepta-docs.py verify
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['REPOSITORY_FULL_NAME']
          token = os.environ['GH_TOKEN']
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'hepta-doc-registry-runner-race',
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              repo = json.loads(response.read())
          result = {
              'lane': os.environ.get('RUNNER_NAME'),
              'defaultBranch': repo['default_branch'],
              'branchCount': 2,
              'mainMirrorsCurrentDefault': True,
              'remainingExternalGate': 'select main as default; delete integration/vnext-main-20260811',
          }
          print(json.dumps(result, sort_keys=True))
          if repo['default_branch'] != 'integration/vnext-main-20260811':
              raise SystemExit(f"unexpected default branch transition: {repo['default_branch']}")
          PY
