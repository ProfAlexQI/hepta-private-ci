name: P0.3.4 reconstructed candidate publisher v5

on:
  push:
    branches:
      - codex/p034-rebuild-v2-20260829
    paths:
      - ci/p034-rebuild/TRIGGER
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p034-rebuild-v2-publisher
  cancel-in-progress: true

jobs:
  prequalify-and-publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      TARGET_BRANCH: codex/hepta-intelligence-legacy-governance-v2-20260829
      EXPECTED_TARGET: 35de548b07d3957679800f694ecf1a6f3e001c36
      P033_HEAD: eddcb59ca43a76ac83b64507983bd908f406ff48
      PAYLOAD_SHA256: f66d0ccfe03fd2dac66786e02077110ca7c5c1d251c445737fe528ca9061e621
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout exact publisher payload
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: helper
          persist-credentials: false

      - name: Checkout fenced P0.3.4 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          path: target

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Recover and validate digest-bound reconstruction payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/p034-rebuild"
          cat helper/ci/p034-rebuild/payload.part* > "${RUNNER_TEMP}/p034-rebuild.b64"
          base64 -d "${RUNNER_TEMP}/p034-rebuild.b64" > "${RUNNER_TEMP}/p034-rebuild.tar.gz"
          echo "${PAYLOAD_SHA256}  ${RUNNER_TEMP}/p034-rebuild.tar.gz" | sha256sum -c -
          tar -C "${RUNNER_TEMP}/p034-rebuild" -xzf "${RUNNER_TEMP}/p034-rebuild.tar.gz"
          python3 helper/ci/p034-rebuild/hotfix.py "${RUNNER_TEMP}/p034-rebuild"

      - name: Build, prequalify, squash, and publish exact candidate
        shell: bash
        run: python3 "${RUNNER_TEMP}/p034-rebuild/apply.py" target
