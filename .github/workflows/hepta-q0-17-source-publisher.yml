name: Hepta Intelligence Q0.17 exact-parent source publisher

on:
  push:
    branches:
      - codex/hepta-intelligence-q0-17-gnullvm-contract-closure-20260830
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-intelligence-q0-17-source-publisher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_SHA: 8d6412cb0925cf68e8b9505594d46c99db38277e
      BRANCH_NAME: codex/hepta-intelligence-q0-17-gnullvm-contract-closure-20260830
      BOOTSTRAP_SHA: ${{ github.sha }}
      WORKFLOW_PATH: .github/workflows/hepta-q0-17-source-publisher.yml
    steps:
      - name: Checkout exact bootstrap commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact-parent bootstrap surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${BOOTSTRAP_SHA}"
          test "$(git merge-base HEAD "${BASE_SHA}")" = "${BASE_SHA}"
          test "$(git rev-list --count "${BASE_SHA}..HEAD")" -ge 1

          mapfile -t changed < <(git diff --name-only "${BASE_SHA}" "${BOOTSTRAP_SHA}" | LC_ALL=C sort)
          expected=(
            ".github/scripts/run-bazel-ci.sh"
            ".github/scripts/test_run_bazel_local_windows_gnullvm.py"
            ".github/workflows/hepta-q0-17-source-publisher.yml"
            "patches/rules_cc_rusty_v8_custom_libcxx.patch"
            "scripts/verify-windows-gnullvm-qualification-contract.py"
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Set up Bazel and repository tools
        uses: ./.github/actions/setup-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu

      - name: Validate Q0.17 source before lock regeneration
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/run-bazel-ci.sh
          python3 -m py_compile \
            .github/scripts/test_run_bazel_local_windows_gnullvm.py \
            scripts/verify-windows-gnullvm-qualification-contract.py
          python3 .github/scripts/test_run_bazel_local_windows_gnullvm.py
          python3 scripts/verify-windows-gnullvm-qualification-contract.py

      - name: Regenerate the committed Bazel module lock
        shell: bash
        run: |
          set -euo pipefail
          just bazel-lock-update
          ./scripts/check-module-bazel-lock.sh
          test -s MODULE.bazel.lock

      - name: Revalidate exact final source and lock
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/run-bazel-ci.sh
          python3 .github/scripts/test_run_bazel_local_windows_gnullvm.py
          python3 scripts/verify-windows-gnullvm-qualification-contract.py
          ./scripts/check-module-bazel-lock.sh

      - name: Mint one direct Q0.17 child and remove the publisher
        id: mint
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${WORKFLOW_PATH}"

          git reset --soft "${BASE_SHA}"
          git add -A

          python3 - <<'PY'
          import subprocess

          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"],
                  text=True,
              ).splitlines()
          )
          required = {
              ".github/scripts/run-bazel-ci.sh",
              ".github/scripts/test_run_bazel_local_windows_gnullvm.py",
              "patches/rules_cc_rusty_v8_custom_libcxx.patch",
              "scripts/verify-windows-gnullvm-qualification-contract.py",
          }
          allowed = required | {"MODULE.bazel.lock"}
          missing = sorted(required - changed)
          unexpected = sorted(changed - allowed)
          if missing or unexpected:
              raise SystemExit(
                  f"invalid final Q0.17 surface: missing={missing}, "
                  f"unexpected={unexpected}"
              )
          PY
          git diff --cached --check

          git config user.name "Hepta governed Q0 source publisher"
          git config user.email "hepta-q0-source-publisher@users.noreply.github.com"
          git commit -m "fix(ci): close Q0.17 Windows gnullvm qualification gaps" -m "Normalize protected Bazel options across equals and split forms, fail closed on competing toolchains and non-local strategies, restore the canonical gnullvm test exclusions, remove generic local_config_cc auto-registration while retaining explicit ABI-constrained MSVC exec tooling, and regenerate the committed Bazel module lock."

          final_head="$(git rev-parse HEAD)"
          final_tree="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^)" = "${BASE_SHA}"
          test "$(git rev-list --count "${BASE_SHA}..HEAD")" = "1"

          {
            echo "final_head=${final_head}"
            echo "final_tree=${final_tree}"
          } >> "${GITHUB_OUTPUT}"

          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          receipt = {
              "schema": "hepta_intelligence_q0_17_source_publisher_receipt_v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "branch": os.environ["BRANCH_NAME"],
              "base": os.environ["BASE_SHA"],
              "bootstrap": os.environ["BOOTSTRAP_SHA"],
              "final_head": git("rev-parse", "HEAD"),
              "final_tree": git("rev-parse", "HEAD^{tree}"),
              "changed_paths": git(
                  "diff", "--name-only", os.environ["BASE_SHA"], "HEAD"
              ).splitlines(),
              "source_tests": 19,
              "module_lock_regenerated": True,
              "publisher_workflow_retained": False,
              "runtime_authority": False,
              "production_authority": False,
              "operator_acceptance": False,
              "canonical_selection": False,
              "a0_candidate_qualified": False,
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "q0-17-source-publisher-receipt.json"
          path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish exact-parent replacement
        shell: bash
        run: |
          set -euo pipefail
          git push \
            --force-with-lease="refs/heads/${BRANCH_NAME}:${BOOTSTRAP_SHA}" \
            origin "HEAD:refs/heads/${BRANCH_NAME}"
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | cut -f1)"
          test "${remote_head}" = "${{ steps.mint.outputs.final_head }}"

      - name: Upload publisher receipt
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4.6.2
        with:
          name: hepta-intelligence-q0-17-source-publisher-${{ steps.mint.outputs.final_head }}
          path: ${{ runner.temp }}/q0-17-source-publisher-receipt.json
          if-no-files-found: error
          retention-days: 30
