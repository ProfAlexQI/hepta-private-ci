name: Hepta repository rustfmt remediation once

on:
  push:
    branches:
      - codex/hepta-architecture-convergence-p0-2-20260828
    paths:
      - .github/workflows/hepta-runtime-strict-remediation-once.yml

permissions:
  contents: write

concurrency:
  group: hepta-repository-rustfmt-remediation-once
  cancel-in-progress: true

jobs:
  remediate:
    if: "${{ github.event.head_commit.message == 'ci: bootstrap repository rustfmt remediation' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_PARENT: bd52e4c3285eda256351a24cf27e9508b75f1231
      BRANCH: codex/hepta-architecture-convergence-p0-2-20260828
      WORKFLOW_PATH: .github/workflows/hepta-runtime-strict-remediation-once.yml
      LEGACY_WORKFLOW: .github/workflows/hepta-strict-clippy-remediation-once.yml
      BOOTSTRAP_MESSAGE: "ci: bootstrap repository rustfmt remediation"
    steps:
      - name: Checkout guarded bootstrap commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify immutable bootstrap boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git log -1 --pretty=%s)" = "$BOOTSTRAP_MESSAGE"
          test "$GITHUB_REF" = "refs/heads/$BRANCH"
          test -z "$(git status --porcelain)"

      - name: Set up CI environment
        uses: ./.github/actions/setup-ci

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Apply repository-wide Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$WORKFLOW_PATH" "$LEGACY_WORKFLOW"
          (
            cd codex-rs
            cargo fmt --all
            cargo fmt --all -- --check
          )

      - name: Verify bounded mechanical mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -d '' changed < <(git diff --name-only -z)
          test "${#changed[@]}" -gt 0
          rust_changed=false
          for path in "${changed[@]}"; do
            case "$path" in
              codex-rs/*.rs)
                rust_changed=true
                ;;
              "$WORKFLOW_PATH"|"$LEGACY_WORKFLOW")
                ;;
              *)
                echo "unexpected rustfmt remediation path: $path" >&2
                exit 1
                ;;
            esac
          done
          test "$rust_changed" = true
          test ! -e "$WORKFLOW_PATH"
          test ! -e "$LEGACY_WORKFLOW"

      - name: Run source and authority ratchets
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_cargo_workspace_manifests.py
          python3 scripts/verify-hepta-architecture-convergence-p0-2.py
          python3 scripts/verify-hepta-authority-callers-p0-1.py
          python3 scripts/verify-hepta-memory-runtime-extraction-p0-1.py
          python3 scripts/verify-hepta-cross-owner-operation-wiring.py
          python3 scripts/verify-hepta-architecture-gap-ledger.py

      - name: Commit and push exact mechanical closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-ci-remediation"
          git config user.email "hepta-ci-remediation@users.noreply.github.com"
          git add -A
          git diff --cached --check
          mapfile -d '' staged < <(git diff --cached --name-only -z)
          test "${#staged[@]}" -gt 0
          rust_staged=false
          for path in "${staged[@]}"; do
            case "$path" in
              codex-rs/*.rs)
                rust_staged=true
                ;;
              "$WORKFLOW_PATH"|"$LEGACY_WORKFLOW")
                ;;
              *)
                echo "unexpected staged rustfmt path: $path" >&2
                exit 1
                ;;
            esac
          done
          test "$rust_staged" = true
          git commit -m "style: normalize Rust workspace formatting"
          git fetch --no-tags origin "refs/heads/$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Record non-authoritative remediation receipt
        if: always()
        shell: bash
        run: |
          {
            echo "schema=hepta_repository_rustfmt_remediation_once_v1"
            echo "bootstrap_head=$GITHUB_SHA"
            echo "expected_parent=$EXPECTED_PARENT"
            echo "job_status=${{ job.status }}"
            echo "source_mutation_scope=rustfmt_only"
            echo "workflow_retired=${{ job.status == 'success' }}"
            echo "production_authority=false"
            echo "effect_authority=false"
            echo "model_invocation_authority=false"
            echo "operator_acceptance=false"
            echo "promotion=false"
            echo "release=false"
          } >> "$GITHUB_STEP_SUMMARY"
