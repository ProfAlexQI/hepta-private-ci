name: Hepta Intelligence Q0.1 cargo-deny macOS evidence

on:
  push:
    branches:
      - "automation/hepta-q0-1-cargo-deny-evidence-macos-20260830-r2"

permissions:
  contents: read

concurrency:
  group: hepta-q0-1-cargo-deny-evidence-macos-20260830-r2
  cancel-in-progress: true

env:
  REPOSITORY: ProfHepta/hepta-private-ci
  BASE_SHA: c768bcbeb4c1168088d2499828c24da521a2a73a
  HEAD_SHA: 99b2b44c00bf7b50b588fffddc299bf55fac698a
  HEAD_TREE: 381ed770be51883db94b717e21a96277de726238
  MERGE_SHA: 06661355415a257f19dcae1d23c3914a850eb2c2
  MERGE_TREE: 381ed770be51883db94b717e21a96277de726238
  CARGO_DENY_VERSION: "0.19.0"
  CARGO_DENY_ARCHIVE_SHA256: a22f2023c06f3eefd099a5d42dd828fd4fa74d1e1c167bd1dbc3cf59ad62ded0
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always

jobs:
  exact-pair:
    name: Q0.1 exact-head and synthetic-merge cargo-deny
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Checkout exact Q0.1 head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 3
          persist-credentials: false

      - name: Install Rust 1.95 and verified cargo-deny 0.19.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          test "$(rustc -V | awk '{print $2}')" = "1.95.0"

          archive=/tmp/cargo-deny.tar.gz
          install_dir=/tmp/cargo-deny-bin
          curl --fail --location --silent --show-error \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-aarch64-apple-darwin.tar.gz" \
            --output "${archive}"
          actual="$(shasum -a 256 "${archive}" | awk '{print $1}')"
          test "${actual}" = "${CARGO_DENY_ARCHIVE_SHA256}"
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}" --strip-components=1
          chmod +x "${install_dir}/cargo-deny"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/cargo-deny" --version | grep -F "cargo-deny ${CARGO_DENY_VERSION}"

      - name: Verify and qualify exact Q0.1 head
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "${REPOSITORY}"
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "${HEAD_TREE}"
          test "$(git rev-parse HEAD^)" = "${BASE_SHA}"
          test "$(git rev-list --count "${BASE_SHA}"..HEAD)" = "1"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/cargo-deny.yml"
          grep -Fq 'arguments: --all-features' .github/workflows/cargo-deny.yml
          grep -Fq 'command-arguments: --config ./codex-rs/deny.toml' .github/workflows/cargo-deny.yml
          git diff --check HEAD^ HEAD

          cargo-deny --log-level warn \
            --manifest-path ./codex-rs/Cargo.toml \
            --all-features \
            check \
            --config ./codex-rs/deny.toml
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Fetch exact synthetic merge candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=3 origin "${MERGE_SHA}"
          git checkout --detach "${MERGE_SHA}"

      - name: Verify and qualify exact Q0.1 synthetic merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${MERGE_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "${MERGE_TREE}"
          test "$(git rev-parse HEAD^1)" = "${BASE_SHA}"
          test "$(git rev-parse HEAD^2)" = "${HEAD_SHA}"
          test "$(git rev-list --parents -n 1 HEAD | wc -w | tr -d ' ')" = "3"
          grep -Fq 'arguments: --all-features' .github/workflows/cargo-deny.yml
          grep -Fq 'command-arguments: --config ./codex-rs/deny.toml' .github/workflows/cargo-deny.yml
          git diff --check "${BASE_SHA}" "${HEAD_SHA}"

          cargo-deny --log-level warn \
            --manifest-path ./codex-rs/Cargo.toml \
            --all-features \
            check \
            --config ./codex-rs/deny.toml
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Emit immutable Q0.1 pair receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir=/tmp/hepta-q0-1-cargo-deny-evidence
          mkdir -p "${receipt_dir}"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/cargo-deny.yml')
          policy = Path('codex-rs/deny.toml')
          receipt = {
              'schema': 'hepta_intelligence_q0_1_cargo_deny_pair_v2',
              'status': 'PASS_HEPTA_INTELLIGENCE_Q0_1_CARGO_DENY_EXACT_PAIR',
              'repository': os.environ['REPOSITORY'],
              'base': os.environ['BASE_SHA'],
              'head': os.environ['HEAD_SHA'],
              'head_tree': os.environ['HEAD_TREE'],
              'synthetic_merge': os.environ['MERGE_SHA'],
              'synthetic_merge_tree': os.environ['MERGE_TREE'],
              'observed_checkout': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'cargo_deny_action_commit': '82eb9f621fbc699dd0918f3ea06864c14cc84246',
              'cargo_deny_version': os.environ['CARGO_DENY_VERSION'],
              'cargo_deny_archive_sha256': os.environ['CARGO_DENY_ARCHIVE_SHA256'],
              'cargo_deny_workflow_blob': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD:.github/workflows/cargo-deny.yml'],
                  text=True,
              ).strip(),
              'cargo_deny_workflow_sha256': hashlib.sha256(workflow.read_bytes()).hexdigest(),
              'policy_path': str(policy),
              'policy_sha256': hashlib.sha256(policy.read_bytes()).hexdigest(),
              'command': [
                  'cargo-deny', '--log-level', 'warn',
                  '--manifest-path', './codex-rs/Cargo.toml',
                  '--all-features', 'check',
                  '--config', './codex-rs/deny.toml',
              ],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow_job': os.environ['GITHUB_JOB'],
              'source_writeback': False,
              'runtime_authority': False,
              'production_authority': False,
              'selected': False,
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()
          receipt['receipt_binding_sha256'] = hashlib.sha256(canonical).hexdigest()
          Path('/tmp/hepta-q0-1-cargo-deny-evidence/receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          cat "${receipt_dir}/receipt.json" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload immutable Q0.1 pair receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-q0-1-cargo-deny-pair-${{ env.HEAD_SHA }}
          path: /tmp/hepta-q0-1-cargo-deny-evidence/receipt.json
          if-no-files-found: error
          retention-days: 30
