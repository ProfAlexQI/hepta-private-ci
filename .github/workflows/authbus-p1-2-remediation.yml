name: AuthBus P1.2 deterministic remediation and qualification

on:
  push:
    branches:
      - integration/vnext-main-full-ci-authbus-p1-2-20260828
    paths:
      - .github/workflows/authbus-p1-2-remediation.yml

permissions:
  contents: write

env:
  EXPECTED_PARENT: 454aa50a47a0df55cfa8df748656a5d2f845cec5
  ARCHIVE_SHA256: 1a5570e79a842c389b9af929926030f5ce9d98b3f46e2f35d7f639d8a1aaa8fc
  MANIFEST: codex-rs/hepta-authbus-p1-2-qualification/Cargo.toml
  PACKAGE: codex-hepta-authbus-p1-2-qualification
  CRATE_ROOT: codex-rs/hepta-authbus-p1-2-qualification
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  remediate-and-qualify:
    name: Close observed failures and pass the complete P1.2 matrix
    runs-on: ubuntu-slim
    timeout-minutes: 90
    steps:
      - name: Checkout exact remediation candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Verify branch, exact head, and diagnostic parent
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "integration/vnext-main-full-ci-authbus-p1-2-20260828"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test -s docs/hepta-vnext/authbus/AUTHBUS_P1_2_TEST_FAILURE_2026-08-28.txt
          grep -q '29 previous errors; 1 warning emitted' \
            docs/hepta-vnext/authbus/AUTHBUS_P1_2_TEST_FAILURE_2026-08-28.txt

      - name: Materialize the exact reviewed P1.2 source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          chunk_paths = [
              Path(f"scripts/authbus-p1-2-source-seed.part-{index:02d}.b64")
              for index in range(8)
          ]
          present_chunks = sorted(
              Path("scripts").glob("authbus-p1-2-source-seed.part-*.b64")
          )
          if present_chunks != chunk_paths:
              raise SystemExit(f"unexpected source archive chunk set: {present_chunks}")

          encoded = "".join(
              "".join(path.read_text(encoding="ascii").split())
              for path in chunk_paths
          )
          archive = base64.b64decode(encoded, validate=True)
          expected_sha256 = "1a5570e79a842c389b9af929926030f5ce9d98b3f46e2f35d7f639d8a1aaa8fc"
          actual_sha256 = hashlib.sha256(archive).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(f"source archive digest mismatch: {actual_sha256}")

          expected = {
              ".github/workflows/authbus-p1-2-qualification.yml",
              "codex-rs/hepta-authbus-p1-2-qualification/Cargo.toml",
              "codex-rs/hepta-authbus-p1-2-qualification/README.md",
              "codex-rs/hepta-authbus-p1-2-qualification/migrations/0001_authbus_p1_2.sql",
              "codex-rs/hepta-authbus-p1-2-qualification/src/lib.rs",
              "codex-rs/hepta-authbus-p1-2-qualification/src/model.rs",
              "codex-rs/hepta-authbus-p1-2-qualification/src/store.rs",
              "codex-rs/hepta-authbus-p1-2-qualification/tests/p1_2.rs",
              "docs/hepta-vnext/authbus/AUTHBUS_P1_2_DEVELOPMENT_PLAN_2026-08-28.md",
              "docs/hepta-vnext/authbus/AUTHBUS_P1_2_IMPLEMENTATION_STATUS_2026-08-28.json",
              "docs/hepta-vnext/authbus/AUTHBUS_P1_2_IMPLEMENTATION_STATUS_2026-08-28.md",
              "scripts/verify-authbus-p1-2.py",
          }
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as bundle:
              members = bundle.getmembers()
              names = {member.name for member in members}
              if names != expected or len(members) != len(expected):
                  raise SystemExit(f"unexpected archive paths: {sorted(names ^ expected)}")
              for member in members:
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or not member.isfile()
                      or member.size > 512_000
                  ):
                      raise SystemExit(f"unsafe archive member: {member.name}")
                  destination = Path(member.name)
                  if destination.exists():
                      raise SystemExit(f"archive destination already exists: {member.name}")
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit(f"missing archive bytes: {member.name}")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with destination.open("wb") as output:
                      shutil.copyfileobj(source, output)
                  destination.chmod(member.mode & 0o777)
          PY
          test -s "${CRATE_ROOT}/src/store.rs"
          test -s "${CRATE_ROOT}/tests/p1_2.rs"
          python3 scripts/verify-authbus-p1-2.py | tee /tmp/authbus-p1-2-source.json
          grep -q 'PASS_AUTHBUS_P1_2_SOURCE_ONLY' /tmp/authbus-p1-2-source.json
          git diff --check

      - name: Apply bounded digest, TTL, and canonical SQLite shim repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          cargo_path = Path("codex-rs/hepta-authbus-p1-2-qualification/Cargo.toml")
          cargo = cargo_path.read_text(encoding="utf-8")
          feature_before = '''    "dep:codex-hepta-contracts",
              "dep:serde",
          '''.replace("              ", "    ")
          feature_after = '''    "dep:codex-hepta-contracts",
              "dep:codex-state",
              "dep:codex-utils-absolute-path",
              "dep:serde",
          '''.replace("              ", "    ")
          if cargo.count(feature_before) != 1:
              raise SystemExit("expected exactly one P1.2 feature dependency anchor")
          cargo = cargo.replace(feature_before, feature_after)

          dependency_before = '''codex-hepta-contracts = { path = "../hepta-contracts", optional = true }
          serde = { version = "1.0.228", features = ["derive"], optional = true }
          '''.replace("          ", "")
          dependency_after = '''codex-hepta-contracts = { path = "../hepta-contracts", optional = true }
          codex-state = { path = "../state", optional = true }
          codex-utils-absolute-path = { path = "../utils/absolute-path", optional = true }
          serde = { version = "1.0.228", features = ["derive"], optional = true }
          '''.replace("          ", "")
          if cargo.count(dependency_before) != 1:
              raise SystemExit("expected exactly one P1.2 dependency table anchor")
          cargo = cargo.replace(dependency_before, dependency_after)
          cargo_path.write_text(cargo, encoding="utf-8")

          store_path = Path("codex-rs/hepta-authbus-p1-2-qualification/src/store.rs")
          store = store_path.read_text(encoding="utf-8")

          removals = [
              "use std::time::Duration;\n",
              "use serde::Deserialize;\n",
              "use sqlx::sqlite::SqliteConnectOptions;\n",
              "use sqlx::sqlite::SqliteJournalMode;\n",
              "use sqlx::sqlite::SqlitePoolOptions;\n",
              "use sqlx::sqlite::SqliteSynchronous;\n",
          ]
          for removal in removals:
              if store.count(removal) != 1:
                  raise SystemExit(f"expected exactly one import to remove: {removal!r}")
              store = store.replace(removal, "")

          import_anchor = "use codex_hepta_contracts::Sha256Digest;\n"
          import_replacement = (
              import_anchor
              + "use codex_state::SqliteConfig;\n"
              + "use codex_utils_absolute_path::AbsolutePathBuf;\n"
          )
          if store.count(import_anchor) != 1:
              raise SystemExit("expected exactly one canonical SQLite import anchor")
          store = store.replace(import_anchor, import_replacement)

          patterns = (
              re.compile(
                  r"(?P<expr>(?:(?:[A-Za-z_][A-Za-z0-9_]*)\.)*"
                  r"[A-Za-z_][A-Za-z0-9_]*_sha256)\.to_string\(\)"
              ),
              re.compile(
                  r"(?P<expr>(?:(?:[A-Za-z_][A-Za-z0-9_]*)\.)*"
                  r"(?:[A-Za-z_][A-Za-z0-9_]*_digest|digest)\(\)\?)"
                  r"\.to_string\(\)"
              ),
          )

          digest_repairs = 0
          for pattern in patterns:
              store, count = pattern.subn(
                  lambda match: f"{match.group('expr')}.as_str().to_owned()",
                  store,
              )
              digest_repairs += count

          if digest_repairs != 29:
              raise SystemExit(
                  f"expected exactly 29 Sha256Digest text repairs, got {digest_repairs}"
              )

          pool_before = '''        let database_path = root.join(DATABASE_FILE);
                  let options = SqliteConnectOptions::new()
                      .filename(&database_path)
                      .create_if_missing(true)
                      .journal_mode(SqliteJournalMode::Wal)
                      .synchronous(SqliteSynchronous::Full)
                      .foreign_keys(true)
                      .busy_timeout(Duration::from_secs(5));
                  let pool = SqlitePoolOptions::new()
                      .max_connections(1)
                      .connect_with(options)
                      .await
                      .map_err(map_sqlx)?;
          '''.replace("                  ", "        ")
          pool_after = '''        let absolute_root = AbsolutePathBuf::try_from(root.clone())
                      .map_err(|_| P12Error::StorageUnavailable)?;
                  let database_path = root.join(DATABASE_FILE);
                  let pool = SqliteConfig::from_sqlite_home(absolute_root)
                      .open_durable_evidence_pool(&database_path)
                      .await
                      .map_err(map_sqlx)?;
          '''.replace("                  ", "        ")
          if store.count(pool_before) != 1:
              raise SystemExit("expected exactly one direct SQLite pool construction block")
          store = store.replace(pool_before, pool_after)

          suspicious = [
              (line_number, line)
              for line_number, line in enumerate(store.splitlines(), start=1)
              if ".to_string()" in line
              and ("_sha256" in line or "digest()?" in line)
          ]
          if suspicious:
              raise SystemExit(f"unrepaired digest text conversions: {suspicious}")
          if "connect_with" in store or "SqlitePoolOptions" in store:
              raise SystemExit("direct SQLite pool construction survived remediation")
          store_path.write_text(store, encoding="utf-8")

          test_path = Path("codex-rs/hepta-authbus-p1-2-qualification/tests/p1_2.rs")
          tests = test_path.read_text(encoding="utf-8")
          ttl_before = '''        "nonce-two",
                  NOW + 300,
          '''.replace("                  ", "        ")
          ttl_after = '''        "nonce-two",
                  // `issued_at` is `NOW - 2`; this exercises the exact 300-second TTL limit.
                  NOW + 298,
          '''.replace("                  ", "        ")
          if tests.count(ttl_before) != 1:
              raise SystemExit("expected exactly one nonce-two TTL fixture")
          tests = tests.replace(ttl_before, ttl_after)
          test_path.write_text(tests, encoding="utf-8")

          print(f"applied_sha256_digest_text_repairs={digest_repairs}")
          print("applied_exact_ttl_boundary_repairs=1")
          print("applied_canonical_sqlite_shim_repairs=1")
          PY
          grep -q 'dep:codex-state' "${MANIFEST}"
          grep -q 'dep:codex-utils-absolute-path' "${MANIFEST}"
          grep -q 'use codex_state::SqliteConfig;' "${CRATE_ROOT}/src/store.rs"
          grep -q 'open_durable_evidence_pool' "${CRATE_ROOT}/src/store.rs"
          ! grep -q 'connect_with' "${CRATE_ROOT}/src/store.rs"
          ! grep -q 'SqlitePoolOptions' "${CRATE_ROOT}/src/store.rs"
          grep -q 'NOW + 298' "${CRATE_ROOT}/tests/p1_2.rs"
          ! grep -A2 '"nonce-two"' "${CRATE_ROOT}/tests/p1_2.rs" | grep -q 'NOW + 300'
          git diff --check -- \
            "${MANIFEST}" \
            "${CRATE_ROOT}/src/store.rs" \
            "${CRATE_ROOT}/tests/p1_2.rs"

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Pin lockfile, format, and reverify source
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc -V | awk '{print $2}')" = "1.95.0"
          cargo generate-lockfile --manifest-path "${MANIFEST}"
          cargo fmt --manifest-path "${MANIFEST}" --all
          cargo fmt --manifest-path "${MANIFEST}" --all -- --check
          test -s "${CRATE_ROOT}/Cargo.lock"
          cargo metadata --manifest-path "${MANIFEST}" --locked \
            --format-version 1 --no-deps >/dev/null
          python3 scripts/verify-authbus-p1-2.py | tee /tmp/authbus-p1-2-formatted.json
          grep -q 'PASS_AUTHBUS_P1_2_SOURCE_ONLY' /tmp/authbus-p1-2-formatted.json
          git diff --check

      - name: Check default-off authority posture
        shell: bash
        run: |
          cargo test --manifest-path "${MANIFEST}" --locked \
            --no-default-features --lib -- --nocapture

      - name: Run restart, replay, failpoint, GC, and corruption matrix
        shell: bash
        run: |
          cargo test --manifest-path "${MANIFEST}" --locked \
            --features p1-2-qualification --tests -- --nocapture

      - name: Check all P1.2 targets
        shell: bash
        run: |
          cargo check --manifest-path "${MANIFEST}" --locked \
            --features p1-2-qualification --all-targets

      - name: Run strict P1.2 Clippy
        shell: bash
        run: |
          cargo clippy --manifest-path "${MANIFEST}" --locked \
            --features p1-2-qualification --all-targets -- -D warnings

      - name: Commit only the fully qualified P1.2 source set
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/__pycache__ "${CRATE_ROOT}/target"

          rm .github/workflows/authbus-p1-2-diagnostic.yml
          rm .github/workflows/authbus-p1-2-remediation.yml
          rm .github/workflows/authbus-p1-2-source-seed.yml
          rm scripts/authbus-p1-2-source-seed.part-00.b64
          rm scripts/authbus-p1-2-source-seed.part-01.b64
          rm scripts/authbus-p1-2-source-seed.part-02.b64
          rm scripts/authbus-p1-2-source-seed.part-03.b64
          rm scripts/authbus-p1-2-source-seed.part-04.b64
          rm scripts/authbus-p1-2-source-seed.part-05.b64
          rm scripts/authbus-p1-2-source-seed.part-06.b64
          rm scripts/authbus-p1-2-source-seed.part-07.b64

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          final_paths=(
            .github/workflows/authbus-p1-2-qualification.yml
            codex-rs/hepta-authbus-p1-2-qualification/Cargo.toml
            codex-rs/hepta-authbus-p1-2-qualification/Cargo.lock
            codex-rs/hepta-authbus-p1-2-qualification/README.md
            codex-rs/hepta-authbus-p1-2-qualification/migrations/0001_authbus_p1_2.sql
            codex-rs/hepta-authbus-p1-2-qualification/src/lib.rs
            codex-rs/hepta-authbus-p1-2-qualification/src/model.rs
            codex-rs/hepta-authbus-p1-2-qualification/src/store.rs
            codex-rs/hepta-authbus-p1-2-qualification/tests/p1_2.rs
            docs/hepta-vnext/authbus/AUTHBUS_P1_2_DEVELOPMENT_PLAN_2026-08-28.md
            docs/hepta-vnext/authbus/AUTHBUS_P1_2_IMPLEMENTATION_STATUS_2026-08-28.json
            docs/hepta-vnext/authbus/AUTHBUS_P1_2_IMPLEMENTATION_STATUS_2026-08-28.md
            scripts/verify-authbus-p1-2.py
          )
          git add -- "${final_paths[@]}"
          git add -u -- \
            .github/workflows/authbus-p1-2-diagnostic.yml \
            .github/workflows/authbus-p1-2-remediation.yml \
            .github/workflows/authbus-p1-2-source-seed.yml \
            scripts/authbus-p1-2-source-seed.part-00.b64 \
            scripts/authbus-p1-2-source-seed.part-01.b64 \
            scripts/authbus-p1-2-source-seed.part-02.b64 \
            scripts/authbus-p1-2-source-seed.part-03.b64 \
            scripts/authbus-p1-2-source-seed.part-04.b64 \
            scripts/authbus-p1-2-source-seed.part-05.b64 \
            scripts/authbus-p1-2-source-seed.part-06.b64 \
            scripts/authbus-p1-2-source-seed.part-07.b64

          cat > /tmp/authbus-p1-2-expected-paths.txt <<'EOF'
          .github/workflows/authbus-p1-2-diagnostic.yml
          .github/workflows/authbus-p1-2-qualification.yml
          .github/workflows/authbus-p1-2-remediation.yml
          .github/workflows/authbus-p1-2-source-seed.yml
          codex-rs/hepta-authbus-p1-2-qualification/Cargo.lock
          codex-rs/hepta-authbus-p1-2-qualification/Cargo.toml
          codex-rs/hepta-authbus-p1-2-qualification/README.md
          codex-rs/hepta-authbus-p1-2-qualification/migrations/0001_authbus_p1_2.sql
          codex-rs/hepta-authbus-p1-2-qualification/src/lib.rs
          codex-rs/hepta-authbus-p1-2-qualification/src/model.rs
          codex-rs/hepta-authbus-p1-2-qualification/src/store.rs
          codex-rs/hepta-authbus-p1-2-qualification/tests/p1_2.rs
          docs/hepta-vnext/authbus/AUTHBUS_P1_2_DEVELOPMENT_PLAN_2026-08-28.md
          docs/hepta-vnext/authbus/AUTHBUS_P1_2_IMPLEMENTATION_STATUS_2026-08-28.json
          docs/hepta-vnext/authbus/AUTHBUS_P1_2_IMPLEMENTATION_STATUS_2026-08-28.md
          scripts/authbus-p1-2-source-seed.part-00.b64
          scripts/authbus-p1-2-source-seed.part-01.b64
          scripts/authbus-p1-2-source-seed.part-02.b64
          scripts/authbus-p1-2-source-seed.part-03.b64
          scripts/authbus-p1-2-source-seed.part-04.b64
          scripts/authbus-p1-2-source-seed.part-05.b64
          scripts/authbus-p1-2-source-seed.part-06.b64
          scripts/authbus-p1-2-source-seed.part-07.b64
          scripts/verify-authbus-p1-2.py
          EOF
          sed -i 's/^          //' /tmp/authbus-p1-2-expected-paths.txt
          LC_ALL=C sort -o /tmp/authbus-p1-2-expected-paths.txt \
            /tmp/authbus-p1-2-expected-paths.txt
          git diff --cached --name-only | LC_ALL=C sort \
            > /tmp/authbus-p1-2-actual-paths.txt
          diff -u /tmp/authbus-p1-2-expected-paths.txt \
            /tmp/authbus-p1-2-actual-paths.txt
          git diff --cached --check

          git commit -m "feat(authbus): persist identity and evidence replay state P1.2"
          git push origin "HEAD:${GITHUB_REF_NAME}" \
            --force-with-lease="refs/heads/${GITHUB_REF_NAME}:${GITHUB_SHA}"
