name: p0-3-2-a038-repair-v2

on:
  push:
    branches:
      - "codex/hepta-intelligence-p032-a038-linux-diagnostic-20260828"
    paths:
      - ".github/workflows/p0-3-2-a038-linux-diagnostic.yml"
      - "scripts/p032-bounded-repair-v1.py"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: p0-3-2-a038-repair-v2
  cancel-in-progress: true

jobs:
  repair:
    name: P0.3.2 bounded test and Clippy repair v2
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout repair controller
        uses: actions/checkout@v4
        with:
          ref: codex/hepta-intelligence-p032-a038-linux-diagnostic-20260828
          path: control
          fetch-depth: 1

      - name: Checkout exact canonical candidate
        uses: actions/checkout@v4
        with:
          ref: codex/hepta-intelligence-shared-projection-planner-v5-20260828
          path: source
          fetch-depth: 1

      - name: Fetch exact P0.3 base
        working-directory: source
        run: git fetch --no-tags --depth=1 origin 256a47d882413ac1f80892a80177419bb5d12c70

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Build, qualify, and CAS-publish bounded repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/scripts/p032-bounded-repair-v1.py source

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p032-bounded-repair-v2-${{ github.sha }}
          path: |
            source/artifacts/hepta-intelligence-shared-projection-planner-v7
            source/repair-controller-result.json
          if-no-files-found: warn
          retention-days: 21
