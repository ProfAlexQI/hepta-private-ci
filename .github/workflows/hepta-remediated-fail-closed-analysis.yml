name: Hepta remediated fail-closed analysis

on:
  push:
    branches:
      - codex/hepta-remediated-auto-analysis-20260902
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: hepta-remediated-fail-closed-analysis-20260902
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SOURCE_BRANCH: codex/hepta-v8-repository-closure-remediated-20260902
      REPORT_BRANCH: codex/hepta-remediated-final-report-20260902
      OUTPUT_BRANCH: codex/hepta-v8-repository-closure-remediated-v2-20260902
    steps:
      - name: Check out exact remediated source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/hepta-v8-repository-closure-remediated-20260902
          fetch-depth: 0
          persist-credentials: true

      - name: Wait for matching immutable CI report
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          deadline=$((SECONDS + 6900))
          while (( SECONDS < deadline )); do
            rm -rf "${RUNNER_TEMP}/report"
            if git clone --depth=1 --branch "$REPORT_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "${RUNNER_TEMP}/report" 2>/dev/null; then
              if [[ -f "${RUNNER_TEMP}/report/summary.json" ]] && [[ "$(jq -r '.headSha' "${RUNNER_TEMP}/report/summary.json")" = "$source_sha" ]]; then
                break
              fi
            fi
            sleep 20
          done
          test -f "${RUNNER_TEMP}/report/summary.json"
          test "$(jq -r '.headSha' "${RUNNER_TEMP}/report/summary.json")" = "$source_sha"
          cp -R "${RUNNER_TEMP}/report" "${RUNNER_TEMP}/matched-report"

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          report = Path(__import__("os").environ["RUNNER_TEMP"]) / "matched-report"
          summary = json.loads((report / "summary.json").read_text(encoding="utf-8"))
          corpus_parts: list[str] = []
          for path in sorted(report.glob("failed-*.log")):
              corpus_parts.append(path.read_text(encoding="utf-8", errors="replace"))
          for path in sorted(report.glob("jobs-*.json")):
              corpus_parts.append(path.read_text(encoding="utf-8", errors="replace"))
          if (report / "check-runs.json").exists():
              corpus_parts.append((report / "check-runs.json").read_text(encoding="utf-8", errors="replace"))
          corpus = "\n".join(corpus_parts)

          patterns = {
              "format": r"(?i)(not formatted|formatting check|ruff format|cargo fmt|prettier|just fmt|diff --check)",
              "bazel_lock": r"(?i)(MODULE\.bazel\.lock is out of date|bazel-lock-update|module.*lock)",
              "generated_status": r"(?i)(generated status|generate-status|docs/STATUS\.md.*differ|status.*out of date)",
              "runner_startup": r"(?i)(startup_failure|no runner matching|waiting for a runner|steps\"?:null|runner.*offline|runner.*unavailable)",
              "workflow_config": r"(?i)(workflow is not valid|invalid workflow file|unexpected value|reusable workflow.*invalid|matrix.*invalid)",
              "rust_compile": r"(?m)^error\[E[0-9]+\]|could not compile|linking with .* failed",
              "test_failure": r"(?i)(test result: FAILED|tests? failed|failures:|pytest.*failed)",
              "bazel_failure": r"(?i)(ERROR: .*BUILD|bazel.*failed|build did NOT complete successfully|FAILED: Build did NOT complete)",
              "sdk_failure": r"(?i)(python-sdk|sdk /|maturin|wheel build|twine|sdks?)",
              "policy_failure": r"(?i)(cargo-deny|cargo shear|license.*denied|advisory.*denied|forbidden dependency)",
          }
          categories = {name: bool(re.search(pattern, corpus)) for name, pattern in patterns.items()}
          result = {
              "schema": "hepta.fail-closed-classification.v1",
              "headSha": summary.get("headSha"),
              "counts": summary.get("counts"),
              "categories": categories,
              "safeDeterministicReplayPermitted": any(
                  categories[name]
                  for name in ("format", "bazel_lock", "generated_status", "runner_startup", "workflow_config")
              ),
              "semanticFailureDetected": any(
                  categories[name]
                  for name in ("rust_compile", "test_failure", "bazel_failure", "sdk_failure", "policy_failure")
              ),
          }
          (report / "classification.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          PY

          if [[ "$(jq -r '.counts.failed' "${RUNNER_TEMP}/matched-report/summary.json")" = "0" ]] && [[ "$(jq -r '.counts.active' "${RUNNER_TEMP}/matched-report/summary.json")" = "0" ]]; then
            echo "Candidate already green; no remediation branch required."
            echo "green=true" >> "$GITHUB_ENV"
          else
            echo "green=false" >> "$GITHUB_ENV"
          fi

      - name: Set up deterministic repository tools
        if: env.green != 'true'
        uses: ./.github/actions/setup-ci

      - name: Install repository-pinned uv
        if: env.green != 'true'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3

      - name: Install exact Rust toolchain
        if: env.green != 'true'
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Set up repository Bazel toolchain
        if: env.green != 'true'
        uses: ./.github/actions/setup-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu

      - name: Replay only safe deterministic transformations
        if: env.green != 'true'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable || true
          just fmt
          python3 scripts/hepta-cns.py generate-status --check || python3 scripts/hepta-cns.py generate-status
          python3 scripts/hepta-algorithm-docs.py generate-status --check || python3 scripts/hepta-algorithm-docs.py generate-status
          python3 scripts/hepta-docs.py generate-status
          just bazel-lock-update

          python3 - <<'PY'
          from pathlib import Path
          import re

          markers = ("self-hosted", "xlarge", "-large", "32-core", "16-core", "8-core")
          keys = "runs-on|runner|os|runner-label|runner_label"

          def hosted(value: str) -> str:
              value = value.lower()
              if "windows" in value:
                  return "windows-latest"
              if "macos" in value or "darwin" in value:
                  return "macos-15"
              return "ubuntu-24.04"

          for filename in (".github/workflows/bazel.yml", ".github/workflows/sdk.yml"):
              path = Path(filename)
              lines = path.read_text(encoding="utf-8").splitlines()
              out: list[str] = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  scalar = re.match(rf"^(\s*)({keys}):\s*(.*?)\s*$", line)
                  if scalar and scalar.group(3) and "${{" not in scalar.group(3):
                      value = scalar.group(3)
                      if any(marker in value.lower() for marker in markers):
                          line = f"{scalar.group(1)}{scalar.group(2)}: {hosted(value)}"
                      out.append(line)
                      i += 1
                      continue
                  block = re.match(r"^(\s*)runs-on:\s*$", line)
                  if block:
                      indent = len(block.group(1))
                      j = i + 1
                      body: list[str] = []
                      while j < len(lines):
                          candidate = lines[j]
                          stripped = candidate.strip()
                          current = len(candidate) - len(candidate.lstrip())
                          if stripped and current <= indent:
                              break
                          body.append(candidate)
                          j += 1
                      joined = " ".join(item.strip() for item in body)
                      if any(marker in joined.lower() for marker in markers):
                          out.append(f"{' ' * indent}runs-on: {hosted(joined)}")
                      else:
                          out.append(line)
                          out.extend(body)
                      i = j
                      continue
                  timeout = re.match(r"^(\s*)timeout-minutes:\s*(\d+)\s*$", line)
                  if timeout and int(timeout.group(2)) < 90:
                      line = f"{timeout.group(1)}timeout-minutes: 90"
                  out.append(line)
                  i += 1
              path.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY
          git diff --check

      - name: Verify deterministic replay before publication
        if: env.green != 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --project scripts ruff format --check scripts
          python3 -m compileall -q scripts
          cargo fmt --all --manifest-path codex-rs/Cargo.toml -- --check
          for manifest in qualification/hnmf-reference/Cargo.toml qualification/hnmf-contract-reference/Cargo.toml qualification/hnmf-adversarial-reference/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" -- --check
            cargo check --manifest-path "$manifest" --all-targets --locked
            cargo test --manifest-path "$manifest" --locked
          done
          python3 scripts/hepta-paper-evidence.py verify
          python3 scripts/hepta-hnmf.py self-test
          python3 scripts/hepta-hnmf.py verify
          python3 scripts/hepta-cns.py self-test
          python3 scripts/hepta-cns.py generate-status --check
          python3 scripts/hepta-cns.py verify
          python3 scripts/hepta-module-docs.py self-test
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-algorithm-docs.py self-test
          python3 scripts/hepta-algorithm-docs.py verify-sources
          python3 scripts/hepta-algorithm-docs.py generate-status --check
          python3 scripts/hepta-algorithm-docs.py verify
          python3 scripts/hepta-docs.py self-test
          python3 scripts/hepta-docs.py generate-status
          git diff --exit-code -- docs/STATUS.md
          python3 scripts/hepta-docs.py verify
          python3 scripts/hepta-repository-integrity.py self-test
          python3 scripts/hepta-repository-integrity.py verify
          ./scripts/check-module-bazel-lock.sh
          if find .github/workflows -maxdepth 1 -type f -name 'tmp-*.yml' -print -quit | grep -q .; then
            exit 1
          fi
          git diff --check

      - name: Publish v2 only when deterministic replay changed source
        if: env.green != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta fail-closed remediator"
          git config user.email "hepta-fail-closed-remediator@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No safe deterministic source change can address the observed failures."
            exit 1
          fi
          git commit -m "fix(ci): apply evidence-bound deterministic remediation v2"
          git push --force origin "HEAD:refs/heads/${OUTPUT_BRANCH}"

      - name: Retain failure classification
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hepta-remediated-fail-closed-classification
          path: ${{ runner.temp }}/matched-report
          if-no-files-found: warn
          retention-days: 30
