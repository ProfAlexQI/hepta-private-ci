name: AuthBus P1.3 ARM compile diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - codex/authbus-p1-3-arm-diagnostic-20260829
    paths:
      - .github/workflows/authbus-p1-3-arm-diagnostic.yml

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"

jobs:
  p0-2:
    name: ARM P0.2 durable coordinator compile
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout exact diagnostic seed
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Materialize and repair canonical source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/authbus-p1-3-finalize.py
          sed -i 's/request_sha256\.to_string()/request_sha256.as_str().to_owned()/' \
            codex-rs/hepta-authbus-p0-3-qualification/src/scheduler.rs
          python3 scripts/authbus-p1-3-semantic-completion.py
          python3 scripts/authbus-p1-3-gap-closure.py
          python3 scripts/verify-authbus-p1-3.py
          git diff --check
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Compile P0.2 all targets
        shell: bash
        env:
          CARGO_TARGET_DIR: /tmp/authbus-p0-2-arm-target
        run: |
          set -euo pipefail
          cargo fmt --manifest-path codex-rs/hepta-authbus-qualification/Cargo.toml --all -- --check
          cargo check --manifest-path codex-rs/hepta-authbus-qualification/Cargo.toml \
            --locked --features sqlite-qualification --all-targets

  p0-3-p1-3:
    name: ARM P0.3 and P1.3 registry compile
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout exact diagnostic seed
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Materialize and repair canonical source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/authbus-p1-3-finalize.py
          sed -i 's/request_sha256\.to_string()/request_sha256.as_str().to_owned()/' \
            codex-rs/hepta-authbus-p0-3-qualification/src/scheduler.rs
          python3 scripts/authbus-p1-3-semantic-completion.py
          python3 scripts/authbus-p1-3-gap-closure.py
          python3 scripts/verify-authbus-p1-3.py
          git diff --check
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Generate P1.3 lock and compile registry stack
        shell: bash
        env:
          CARGO_TARGET_DIR: /tmp/authbus-p1-3-arm-target
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path \
            codex-rs/hepta-authbus-p1-3-qualification/Cargo.toml
          cargo fmt --manifest-path codex-rs/hepta-authbus-p0-3-qualification/Cargo.toml --all -- --check
          cargo fmt --manifest-path codex-rs/hepta-authbus-p1-3-qualification/Cargo.toml --all -- --check
          cargo check --manifest-path codex-rs/hepta-authbus-p0-3-qualification/Cargo.toml \
            --locked --features p0-3-qualification --all-targets
          cargo check --manifest-path codex-rs/hepta-authbus-p1-3-qualification/Cargo.toml \
            --locked --features p1-3-qualification --all-targets
