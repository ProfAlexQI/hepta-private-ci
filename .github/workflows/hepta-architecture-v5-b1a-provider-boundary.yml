name: Hepta V5 B1a provider verified-use boundary

on:
  workflow_dispatch:
  push:
    branches:
      - codex/hepta-architecture-v5-b1a-restack-eb8adb-20260831
    paths:
      - "codex-rs/hepta-contracts/src/lib.rs"
      - "codex-rs/hepta-contracts/src/checked_provider_operation.rs"
      - "codex-rs/hepta-contracts/src/checked_provider_operation_parts/**"
      - "codex-rs/hepta-contracts/tests/provider_verified_use_boundary.rs"
      - "codex-rs/hepta-contracts/tests/provider_verified_use_boundary_parts/**"
      - "docs/architecture/HEPTA_P0_7B_B1A_*"
      - "docs/architecture/HEPTA_V5_B1A_PROVIDER_CALLSITE_INVENTORY.json"
      - "scripts/verify-hepta-v5-b1a-*.py"
      - ".github/workflows/hepta-architecture-v5-b1a-provider-boundary.yml"
  pull_request:
    paths:
      - "codex-rs/hepta-contracts/src/lib.rs"
      - "codex-rs/hepta-contracts/src/checked_provider_operation.rs"
      - "codex-rs/hepta-contracts/src/checked_provider_operation_parts/**"
      - "codex-rs/hepta-contracts/tests/provider_verified_use_boundary.rs"
      - "codex-rs/hepta-contracts/tests/provider_verified_use_boundary_parts/**"
      - "docs/architecture/HEPTA_P0_7B_B1A_*"
      - "docs/architecture/HEPTA_V5_B1A_PROVIDER_CALLSITE_INVENTORY.json"
      - "scripts/verify-hepta-v5-b1a-*.py"
      - ".github/workflows/hepta-architecture-v5-b1a-provider-boundary.yml"

permissions:
  contents: read

concurrency:
  group: hepta-v5-b1a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  qualification:
    name: Hepta V5 B1a required
    runs-on: macos-14-arm64
    timeout-minutes: 90
    steps:
      - name: Checkout exact event identity
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Initialize exact-candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/hepta-v5-b1a"
          mkdir -p "$evidence_dir"
          {
            echo "event=$GITHUB_EVENT_NAME"
            echo "ref=$GITHUB_REF"
            echo "github_sha=$GITHUB_SHA"
            echo "checked_out_commit=$(git rev-parse HEAD)"
            echo "checked_out_tree=$(git rev-parse 'HEAD^{tree}')"
            echo "parent_count=$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')"
            echo "pr_head=${{ github.event.pull_request.head.sha || '' }}"
            echo "pr_base=${{ github.event.pull_request.base.sha || '' }}"
            echo "package=P0.7b/B1a_provider_verified_use_boundary"
            echo "runtime_registered=false"
            echo "production_caller=false"
            echo "production_writer=false"
            echo "model_invocation=false"
            echo "provider_dispatch=false"
            echo "external_effect=false"
            echo "operator_acceptance=false"
            echo "promotion=false"
            echo "release=false"
          } > "$evidence_dir/posture.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Compile-check B1a verifiers
        id: verifier_compile
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/verify-hepta-v5-b1a-provider-boundary.py \
            scripts/verify-hepta-v5-b1a-format.py \
            2>&1 | tee "$RUNNER_TEMP/hepta-v5-b1a/verifier-compile.log"

      - name: Verify exact B1a source contract
        id: source_contract
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            python3 scripts/verify-hepta-v5-b1a-provider-boundary.py --require-direct-parent
          else
            python3 scripts/verify-hepta-v5-b1a-provider-boundary.py
          fi 2>&1 | tee "$RUNNER_TEMP/hepta-v5-b1a/source-verifier.log"
          git diff --check

      - name: Verify source formatting
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-hepta-v5-b1a-format.py --check \
            2>&1 | tee "$RUNNER_TEMP/hepta-v5-b1a/source-format.log"
          cd codex-rs
          cargo fmt -p codex-hepta-contracts -- --check \
            2>&1 | tee "$RUNNER_TEMP/hepta-v5-b1a/rustfmt.log"

      - name: Locked metadata
        id: metadata
        continue-on-error: true
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 \
            2>&1 | tee "$RUNNER_TEMP/hepta-v5-b1a/metadata.log" >/dev/null

      - name: Focused provider boundary tests
        id: focused
        continue-on-error: true
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-contracts \
            --test provider_verified_use_boundary -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/hepta-v5-b1a/focused-tests.log"

      - name: Complete contracts tests
        id: package
        continue-on-error: true
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-contracts \
            2>&1 | tee "$RUNNER_TEMP/hepta-v5-b1a/package-tests.log"

      - name: All-target check
        id: check
        continue-on-error: true
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p codex-hepta-contracts --all-targets \
            2>&1 | tee "$RUNNER_TEMP/hepta-v5-b1a/check.log"

      - name: Strict Clippy
        id: clippy
        continue-on-error: true
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p codex-hepta-contracts --all-targets -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/hepta-v5-b1a/clippy.log"

      - name: Bazel lock
        id: bazel_lock
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          just bazel-lock-check \
            2>&1 | tee "$RUNNER_TEMP/hepta-v5-b1a/bazel-lock.log"

      - name: Require all B1a diagnostics
        if: always() && !cancelled()
        shell: bash
        env:
          VERIFIER_COMPILE_OUTCOME: ${{ steps.verifier_compile.outcome }}
          SOURCE_OUTCOME: ${{ steps.source_contract.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          BAZEL_LOCK_OUTCOME: ${{ steps.bazel_lock.outcome }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/hepta-v5-b1a"
          {
            echo "verifier_compile_outcome=$VERIFIER_COMPILE_OUTCOME"
            echo "source_outcome=$SOURCE_OUTCOME"
            echo "format_outcome=$FORMAT_OUTCOME"
            echo "metadata_outcome=$METADATA_OUTCOME"
            echo "focused_outcome=$FOCUSED_OUTCOME"
            echo "package_outcome=$PACKAGE_OUTCOME"
            echo "check_outcome=$CHECK_OUTCOME"
            echo "clippy_outcome=$CLIPPY_OUTCOME"
            echo "bazel_lock_outcome=$BAZEL_LOCK_OUTCOME"
          } >> "$evidence_dir/posture.txt"
          test "$VERIFIER_COMPILE_OUTCOME" = success
          test "$SOURCE_OUTCOME" = success
          test "$FORMAT_OUTCOME" = success
          test "$METADATA_OUTCOME" = success
          test "$FOCUSED_OUTCOME" = success
          test "$PACKAGE_OUTCOME" = success
          test "$CHECK_OUTCOME" = success
          test "$CLIPPY_OUTCOME" = success
          test "$BAZEL_LOCK_OUTCOME" = success
          echo "All B1a diagnostics passed."

      - name: Record job result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/hepta-v5-b1a"
          mkdir -p "$evidence_dir"
          echo "job_status=${{ job.status }}" >> "$evidence_dir/posture.txt"
          {
            echo "### Hepta V5 B1a provider boundary"
            echo
            sed 's/^/- /' "$evidence_dir/posture.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact-candidate evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-v5-b1a-${{ github.event_name }}-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-v5-b1a
          if-no-files-found: error
          retention-days: 14

      - name: Clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
