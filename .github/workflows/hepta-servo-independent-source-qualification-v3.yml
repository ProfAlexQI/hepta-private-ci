name: hepta-servo independent source qualification v3

on:
  workflow_dispatch:
    inputs:
      acknowledge_source_only:
        description: Type SOURCE_ONLY_NO_RUNTIME_AUTHORITY
        required: true
        type: string

concurrency:
  group: hepta-servo-independent-source-v3-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  exact-source-v3:
    name: Exact source, deterministic archive, Git-order tree reconstruction
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Require explicit source-only acknowledgement
        shell: bash
        env:
          ACKNOWLEDGEMENT: ${{ inputs.acknowledge_source_only }}
        run: |
          set -euo pipefail
          test "$ACKNOWLEDGEMENT" = "SOURCE_ONLY_NO_RUNTIME_AUTHORITY"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize immutable source-only posture
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/hepta-servo-independent-source-v3-evidence"
          mkdir -p "$evidence_dir"
          {
            echo "hepta_commit=$(git rev-parse HEAD)"
            echo "hepta_tree=$(git rev-parse 'HEAD^{tree}')"
            echo "servo_commit=0a48e298482659817eb50097df23841f2b8e3044"
            echo "servo_tree=b04d2f75b3217374d079d579c270177b57fa1389"
            echo "generator=scripts/hepta-servo-independent-source-v2.py"
            echo "offline_verifier=scripts/hepta-servo-source-bundle-verify-v2.py"
            echo "git_tree_ordering=base_name_compare"
            echo "acquisition_network=true"
            echo "runtime_external_network=false"
            echo "servo_built=false"
            echo "servo_runtime_qualified=false"
            echo "production_caller=false"
            echo "production_writer=false"
            echo "effect_authority=false"
            echo "operator_acceptance=false"
            echo "promotion=false"
            echo "release_qualified=false"
          } > "$evidence_dir/posture.txt"
          df -h . "$RUNNER_TEMP" > "$evidence_dir/disk-before.txt"

      - name: Verify v3 tooling before network access
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/hepta-servo-independent-source-v3-evidence"
          python3 -m py_compile \
            scripts/hepta-servo-independent-source.py \
            scripts/hepta-servo-independent-source-v2.py \
            scripts/hepta-servo-source-bundle-verify.py \
            scripts/hepta-servo-source-bundle-verify-v2.py \
            scripts/tests/test_hepta_servo_independent_source_v2.py \
            scripts/tests/test_hepta_servo_source_bundle_verify_v2.py
          python3 scripts/tests/test_hepta_servo_independent_source_v2.py \
            2>&1 | tee "$evidence_dir/source-v2-fixtures.log"
          python3 scripts/tests/test_hepta_servo_source_bundle_verify_v2.py \
            2>&1 | tee "$evidence_dir/verifier-v2-fixtures.log"
          echo "pre_network_contract=passed" >> "$evidence_dir/posture.txt"

      - name: Acquire exact Servo source twice and create deterministic bundle
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/hepta-servo-independent-source-v3"
          python3 scripts/hepta-servo-independent-source-v2.py \
            --output-dir "$output_dir" \
            2>&1 | tee "$RUNNER_TEMP/hepta-servo-independent-source-v3-evidence/pipeline.log"
          for file in \
            independent-source-bundle.receipt.json \
            servo-source-a.tar \
            servo-source-a.tar.gz \
            fetch-a.receipt.json \
            fetch-b.receipt.json \
            license-packet.json; do
            test -f "$output_dir/$file"
          done

      - name: Reconstruct the exact Git tree using canonical Git ordering
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/hepta-servo-independent-source-v3"
          verification="$output_dir/source-bundle.verification.json"
          python3 scripts/hepta-servo-source-bundle-verify-v2.py \
            --bundle-dir "$output_dir" \
            --output "$verification" \
            2>&1 | tee "$RUNNER_TEMP/hepta-servo-independent-source-v3-evidence/offline-verification.log"
          test -f "$verification"
          echo "offline_git_tree_reconstruction=passed" >> "$RUNNER_TEMP/hepta-servo-independent-source-v3-evidence/posture.txt"

      - name: Assert exact source-only negative authority
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/hepta-servo-independent-source-v3"
          evidence_dir="$RUNNER_TEMP/hepta-servo-independent-source-v3-evidence"
          python3 - "$output_dir" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          bundle = json.loads((root / "independent-source-bundle.receipt.json").read_text(encoding="utf-8"))
          verification = json.loads((root / "source-bundle.verification.json").read_text(encoding="utf-8"))
          expected_commit = "0a48e298482659817eb50097df23841f2b8e3044"
          expected_tree = "b04d2f75b3217374d079d579c270177b57fa1389"
          assert bundle["canonical"] is True
          assert bundle["source"]["commit"] == expected_commit
          assert bundle["source"]["tree"] == expected_tree
          assert verification["source"]["tree"] == expected_tree
          assert verification["source"]["recomputed_tree"] == expected_tree
          assert verification["verification"]["git_tree_recomputed"] is True
          assert verification["verification"]["pinned_tree_matched"] is True
          assert bundle["qualification"]["servo_built"] is False
          assert bundle["qualification"]["servo_runtime_qualified"] is False
          assert verification["verification"]["servo_built"] is False
          assert verification["verification"]["servo_runtime_qualified"] is False
          assert bundle["runtime_external_network"] is False
          assert all(value is False for value in bundle["authority"].values())
          assert all(value is False for value in verification["authority"].values())
          for path in root.glob("*.json"):
              text = path.read_text(encoding="utf-8")
              assert "/home/runner/work" not in text
              assert str(pathlib.Path.home()) not in text
          PY
          rm "$output_dir/servo-source-a.tar"
          python3 - "$output_dir" "$evidence_dir/SHA256SUMS" <<'PY'
          import hashlib
          import os
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1]).resolve(strict=True)
          output = pathlib.Path(sys.argv[2])
          required = {
              "fetch-a.receipt.json",
              "fetch-b.receipt.json",
              "independent-source-bundle.receipt.json",
              "license-packet.json",
              "servo-source-a.tar.gz",
              "source-bundle.verification.json",
          }
          actual = {path.name for path in root.iterdir() if path.is_file()}
          if actual != required:
              raise SystemExit(
                  f"exact-source retained file set drifted: missing={sorted(required - actual)} "
                  f"extra={sorted(actual - required)}"
              )
          lines = []
          for path in sorted(root.iterdir(), key=lambda item: item.name.encode("utf-8")):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(block)
              lines.append(f"{digest.hexdigest()}  {path.name}")
          temporary = output.with_name(output.name + ".tmp")
          descriptor = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "w", encoding="ascii", newline="\n") as handle:
              handle.write("\n".join(lines) + "\n")
              handle.flush()
              os.fsync(handle.fileno())
          os.replace(temporary, output)
          PY
          df -h . "$RUNNER_TEMP" > "$evidence_dir/disk-after.txt"
          echo "sha256sums_portable_basenames=true" >> "$evidence_dir/posture.txt"
          echo "source_bundle=passed" >> "$evidence_dir/posture.txt"

      - name: Upload canonical source-only receipts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-servo-independent-source-v3-receipts
          path: |
            ${{ runner.temp }}/hepta-servo-independent-source-v3/*.json
            ${{ runner.temp }}/hepta-servo-independent-source-v3-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Upload deterministic compressed source archive
        if: success()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: servo-0a48e298482659817eb50097df23841f2b8e3044-source-v3
          path: ${{ runner.temp }}/hepta-servo-independent-source-v3/servo-source-a.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Final source-only summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/hepta-servo-independent-source-v3-evidence"
          echo "job_status=${{ job.status }}" >> "$evidence_dir/posture.txt"
          {
            echo "### Canonical exact Servo source qualification v3"
            echo
            echo "This run qualifies source acquisition, deterministic distribution archive,"
            echo "and Git-order-correct offline tree reconstruction only."
            echo "It never builds or executes Servo."
            echo
            sed 's/^/- /' "$evidence_dir/posture.txt"
          } >> "$GITHUB_STEP_SUMMARY"
