name: Hepta Intelligence Q0.49 lock reconstruction

on:
  push:
    branches:
      - diagnostic/hepta-intelligence-q0-49-macos-lock-20260830

permissions:
  contents: read

concurrency:
  group: hepta-intelligence-q0-49-lock-reconstruction
  cancel-in-progress: true

jobs:
  reconstruct-q049:
    name: reconstruct Q0.49 on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            bazel_target: x86_64-unknown-linux-gnu
          - name: macos-aarch64
            runner: macos-15
            bazel_target: aarch64-apple-darwin
    env:
      SOURCE_SHA: f2f200969fa0076178276bceab2eb21d23f0519e
      SOURCE_TREE: e6d9a631345927a8c0817080a2f8cab150c516f3
      BYTES_VERSION: 1.12.1
      BYTES_CHECKSUM: fc652a48c352aef3ea3aed32080501cf3ef6ed5da78602a020c991775b0aff04
      ARTIFACT_DIR: artifacts/q049-${{ matrix.name }}

    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify diagnostic isolation and select Q0.48
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          changed=()
          while IFS= read -r path; do
            changed+=("$path")
          done < <(git diff --name-only --no-renames "$SOURCE_SHA" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = \
            ".github/workflows/hepta-intelligence-q0-49-macos-lock-diagnostic.yml"
          git diff --check "$SOURCE_SHA" HEAD
          git switch --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git show -s --format=%T HEAD)" = "$SOURCE_TREE"
          test -z "$(git status --porcelain)"

      - name: Install repository CI prerequisites
        uses: ./.github/actions/setup-ci

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt,clippy

      - name: Install pinned cargo-shear and cargo-deny
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-shear@1.11.2,cargo-deny@0.19.0

      - name: Apply exact dependency-policy repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          cp codex-rs/Cargo.lock "$ARTIFACT_DIR/Cargo.lock.before"
          cp MODULE.bazel.lock "$ARTIFACT_DIR/MODULE.bazel.lock.before"

          set +e
          cargo +1.95.0 shear \
            --manifest-path codex-rs/Cargo.toml \
            --locked \
            --deny-warnings \
            --format=json \
            >"$ARTIFACT_DIR/shear-before.json" \
            2>"$ARTIFACT_DIR/shear-before.stderr"
          shear_before_rc=$?
          set -e
          echo "$shear_before_rc" >"$ARTIFACT_DIR/shear-before.rc"

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(
                      f"expected one token in {path}: {old!r}; "
                      f"count={text.count(old)}"
                  )
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "codex-rs/Cargo.toml",
              'bytes = "1.10.1"',
              'bytes = "1.12.1"',
          )
          replace_once(
              ".github/workflows/rust-ci.yml",
              "        run: cargo shear --deny-warnings\n",
              "        run: cargo shear --locked --deny-warnings\n",
          )
          replace_once(
              "codex-rs/hepta-automation/Cargo.toml",
              "publish = false\n\n[lib]\n",
              "publish = false\n\n[package.metadata.cargo-shear]\n"
              "# sha2 is used by the unconditionally linked path module "
              "src/taskflow.rs.\n"
              'ignored = ["sha2"]\n\n[lib]\n',
          )
          replace_once(
              "codex-rs/hepta-contracts/Cargo.toml",
              "version.workspace = true\n\n[lib]\n",
              "version.workspace = true\n\n[package.metadata.cargo-shear]\n"
              "# The path-mounted agent_id_tests module imports "
              "pretty_assertions.\n"
              'ignored = ["pretty_assertions"]\n\n[lib]\n',
          )
          replace_once(
              "codex-rs/hepta-fleet/Cargo.toml",
              "publish = false\n\n[lib]\n",
              "publish = false\n\n[package.metadata.cargo-shear]\n"
              "# The path-mounted registry_tests module imports "
              "pretty_assertions.\n"
              'ignored = ["pretty_assertions"]\n\n[lib]\n',
          )

          old = """      - name: Run cargo-deny
                  uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
                  with:
                    rust-version: 1.95.0
                    manifest-path: ./codex-rs/Cargo.toml
                    # Docker actions do not inherit defaults.run.working-directory. Keep
                    # global flags before `check`, but pass `--config` as a command flag;
                    # cargo-deny 0.19 rejects `--config` in the global argument position.
                    arguments: --all-features
                    command-arguments: --config ./codex-rs/deny.toml
          """
          new = """      - name: Install pinned cargo-deny
                  uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
                  with:
                    tool: cargo-deny@0.19.0

                - name: Run cargo-deny
                  run: cargo +1.95.0 deny --all-features check --config deny.toml
          """
          replace_once(".github/workflows/cargo-deny.yml", old, new)
          PY

          cargo +1.95.0 update \
            --manifest-path codex-rs/Cargo.toml \
            -p bytes \
            --precise "$BYTES_VERSION"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          lock = Path("codex-rs/Cargo.lock").read_text(encoding="utf-8")
          blocks = re.findall(
              r'\[\[package\]\]\nname = "bytes"\nversion = "([^"]+)"\n'
              r'source = "registry\+https://github.com/rust-lang/crates.io-index"\n'
              r'checksum = "([0-9a-f]{64})"',
              lock,
          )
          expected = [(os.environ["BYTES_VERSION"], os.environ["BYTES_CHECKSUM"])]
          if blocks != expected:
              raise SystemExit(
                  f"unexpected bytes lock block: {blocks!r} != {expected!r}"
              )
          PY

          cargo +1.95.0 metadata \
            --manifest-path codex-rs/Cargo.toml \
            --locked \
            --no-deps \
            >"$ARTIFACT_DIR/cargo-metadata.json"

          cargo +1.95.0 shear \
            --manifest-path codex-rs/Cargo.toml \
            --locked \
            --deny-warnings \
            --format=json \
            >"$ARTIFACT_DIR/shear-after.json"

          cargo +1.95.0 check \
            --manifest-path codex-rs/Cargo.toml \
            --locked \
            --all-targets \
            -p codex-hepta-automation \
            -p codex-hepta-contracts \
            -p codex-hepta-fleet \
            >"$ARTIFACT_DIR/focused-check.log" 2>&1

          cargo +1.95.0 test \
            --manifest-path codex-rs/Cargo.toml \
            --locked \
            --no-run \
            -p codex-hepta-automation \
            -p codex-hepta-contracts \
            -p codex-hepta-fleet \
            >"$ARTIFACT_DIR/focused-test-no-run.log" 2>&1

          (
            cd codex-rs
            cargo +1.95.0 deny --all-features check --config deny.toml
          ) >"$ARTIFACT_DIR/cargo-deny.log" 2>&1

      - name: Set up Bazel for module-lock regeneration
        uses: ./.github/actions/setup-bazel-ci
        with:
          target: ${{ matrix.bazel_target }}

      - name: Regenerate and classify Bazel module lock
        shell: bash
        run: |
          set -euo pipefail
          just bazel-lock-update \
            >"$ARTIFACT_DIR/bazel-lock-update.log" 2>&1
          cp codex-rs/Cargo.lock "$ARTIFACT_DIR/Cargo.lock.generated"
          cp MODULE.bazel.lock "$ARTIFACT_DIR/MODULE.bazel.lock.generated"
          git diff --binary "$SOURCE_SHA" -- \
            >"$ARTIFACT_DIR/q049.patch"
          git diff --stat "$SOURCE_SHA" -- \
            >"$ARTIFACT_DIR/q049.diff-stat"
          git diff --name-only --no-renames "$SOURCE_SHA" -- \
            >"$ARTIFACT_DIR/q049.changed-paths"
          git diff --check "$SOURCE_SHA" --

          paths=()
          while IFS= read -r path; do
            paths+=("$path")
          done <"$ARTIFACT_DIR/q049.changed-paths"
          required=(
            .github/workflows/cargo-deny.yml
            .github/workflows/rust-ci.yml
            codex-rs/Cargo.lock
            codex-rs/Cargo.toml
            codex-rs/hepta-automation/Cargo.toml
            codex-rs/hepta-contracts/Cargo.toml
            codex-rs/hepta-fleet/Cargo.toml
          )
          for required_path in "${required[@]}"; do
            printf '%s\n' "${paths[@]}" | grep -Fx "$required_path"
          done
          for path in "${paths[@]}"; do
            case "$path" in
              .github/workflows/cargo-deny.yml|\
              .github/workflows/rust-ci.yml|\
              codex-rs/Cargo.lock|\
              codex-rs/Cargo.toml|\
              codex-rs/hepta-automation/Cargo.toml|\
              codex-rs/hepta-contracts/Cargo.toml|\
              codex-rs/hepta-fleet/Cargo.toml|\
              MODULE.bazel.lock)
                ;;
              *)
                echo "unexpected generated path: $path" >&2
                exit 1
                ;;
            esac
          done

          module_lock_changed=false
          if printf '%s\n' "${paths[@]}" | grep -Fxq MODULE.bazel.lock; then
            module_lock_changed=true
          fi

          git config user.name "Hepta Q0.49 diagnostic"
          git config user.email "q049-diagnostic@invalid"
          git add -- "${paths[@]}"
          tree=$(git write-tree)
          commit=$(
            printf '%s\n' \
              "fix(ci): close Q0.49 locked dependency policy blockers" \
              "" \
              "Diagnostic-created immutable object only; no ref moved." |
              git commit-tree "$tree" -p "$SOURCE_SHA"
          )

          python3 - "$ARTIFACT_DIR/summary.env" <<'PY'
          import hashlib
          import os
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          cargo = Path("codex-rs/Cargo.lock").read_bytes()
          module = Path("MODULE.bazel.lock").read_bytes()
          lines = [
              f"source_sha={os.environ['SOURCE_SHA']}",
              f"source_tree={os.environ['SOURCE_TREE']}",
              f"diagnostic_head={os.environ['GITHUB_SHA']}",
              f"runner_os={os.environ['RUNNER_OS']}",
              f"runner_arch={os.environ['RUNNER_ARCH']}",
              f"bytes_version={os.environ['BYTES_VERSION']}",
              f"bytes_checksum={os.environ['BYTES_CHECKSUM']}",
              f"cargo_lock_sha256={hashlib.sha256(cargo).hexdigest()}",
              f"module_lock_sha256={hashlib.sha256(module).hexdigest()}",
          ]
          output.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          {
            echo "module_lock_changed=$module_lock_changed"
            echo "candidate_tree=$tree"
            echo "candidate_commit=$commit"
          } >>"$ARTIFACT_DIR/summary.env"
          cat "$ARTIFACT_DIR/summary.env"

      - name: Upload Q0.49 reconstruction
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-intelligence-q0-49-${{ matrix.name }}-${{ github.sha }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 30
