name: hepta hosted runner allocation canary

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/hepta-runner-allocation-canary.yml"
  push:
    branches:
      - "codex/hepta-*"
    paths:
      - ".github/workflows/hepta-runner-allocation-canary.yml"

permissions:
  contents: read

# This workflow deliberately performs no checkout and invokes no third-party
# action. A job that still completes with zero recorded steps proves failure
# occurred before repository code or an action was executed.
jobs:
  ubuntu-latest:
    name: ubuntu-latest allocation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record allocation
        shell: bash
        run: |
          set -euo pipefail
          printf 'status=RUNNER_ALLOCATED\n'
          printf 'runner_os=%s\n' "$RUNNER_OS"
          printf 'runner_arch=%s\n' "$RUNNER_ARCH"
          printf 'image_os=%s\n' "${ImageOS:-unknown}"
          printf 'image_version=%s\n' "${ImageVersion:-unknown}"
          test -n "$RUNNER_TEMP"
          test -d "$RUNNER_TEMP"

  ubuntu-22-04:
    name: ubuntu-22.04 allocation
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Record allocation
        shell: bash
        run: |
          set -euo pipefail
          printf 'status=RUNNER_ALLOCATED\n'
          printf 'runner_os=%s\n' "$RUNNER_OS"
          printf 'runner_arch=%s\n' "$RUNNER_ARCH"
          printf 'image_os=%s\n' "${ImageOS:-unknown}"
          printf 'image_version=%s\n' "${ImageVersion:-unknown}"
          test -n "$RUNNER_TEMP"
          test -d "$RUNNER_TEMP"

  ubuntu-24-04:
    name: ubuntu-24.04 allocation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record allocation
        shell: bash
        run: |
          set -euo pipefail
          printf 'status=RUNNER_ALLOCATED\n'
          printf 'runner_os=%s\n' "$RUNNER_OS"
          printf 'runner_arch=%s\n' "$RUNNER_ARCH"
          printf 'image_os=%s\n' "${ImageOS:-unknown}"
          printf 'image_version=%s\n' "${ImageVersion:-unknown}"
          test -n "$RUNNER_TEMP"
          test -d "$RUNNER_TEMP"
