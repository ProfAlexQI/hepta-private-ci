name: hepta-ui-v5-repository-gap-closure-bootstrap

on:
  push:
    branches:
      - codex/ui-v5-plan-and-repo-gap-closure-20260829
    paths:
      - .github/workflows/hepta-ui-v5-repository-gap-closure-bootstrap.yml
      - scripts/.hepta-ui-v5-gap-closure-parts/**
  workflow_dispatch:

permissions:
  contents: write

env:
  HEPTA_V5_BASE_COMMIT: 304143bf362e6cc8369158309b7b9c7c9c3d3868
  HEPTA_V5_BASE_TREE: a28c7808e64e2cfa21a8ed3fcbc5525cbbfbac3f
  HEPTA_V5_BRANCH: codex/ui-v5-plan-and-repo-gap-closure-20260829
  HEPTA_V5_BOOTSTRAP_WORKFLOW: .github/workflows/hepta-ui-v5-repository-gap-closure-bootstrap.yml
  HEPTA_V5_BOOTSTRAP_PARTS: scripts/.hepta-ui-v5-gap-closure-parts

concurrency:
  group: hepta-ui-v5-repository-gap-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-stage:
    if: github.repository == 'ProfHepta/hepta-private-ci'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out exact bootstrap candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact bootstrap identity and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$HEPTA_V5_BASE_COMMIT^{tree}")" = "$HEPTA_V5_BASE_TREE"
          git merge-base --is-ancestor "$HEPTA_V5_BASE_COMMIT" HEAD
          test "$GITHUB_REF_NAME" = "$HEPTA_V5_BRANCH"
          while IFS= read -r path; do
            test "$path" = "$HEPTA_V5_BOOTSTRAP_WORKFLOW" || [[ "$path" == "$HEPTA_V5_BOOTSTRAP_PARTS/"* ]]
          done < <(git diff --name-only "$HEPTA_V5_BASE_COMMIT..HEAD")
          test "$(git diff --name-only "$HEPTA_V5_BASE_COMMIT..HEAD" | wc -l | tr -d ' ')" -ge 2

      - name: Reconstruct and apply exact-base repository gap closure
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ui-v5-gap-closure/patched-workflows
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          parts = Path(os.environ["HEPTA_V5_BOOTSTRAP_PARTS"])
          encoded = b"".join(path.read_bytes() for path in sorted(parts.glob("part-*")))
          output = Path(os.environ["RUNNER_TEMP"]) / "apply-hepta-ui-v5-gap-closure.py"
          output.write_bytes(base64.b64decode(encoded, validate=True))
          PY
          python3 -m py_compile "$RUNNER_TEMP/apply-hepta-ui-v5-gap-closure.py"
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "apply-hepta-ui-v5-gap-closure.py"
          text = path.read_text(encoding="utf-8")
          prefix = """async fn remote_installed_cache_adds_plugin_skill_roots_without_remote_plugin_flag() {
              let codex_home = TempDir::new().unwrap();
              let plugin_base = codex_home
                  .path()
                  .join(\"plugins/cache/chatgpt-global/linear\");
              write_plugin(&plugin_base, \"local\", \"linear\");
              write_file(
                  &codex_home.path().join(CONFIG_TOML_FILE),
                  r#\"[features]
          plugins = true
          \"#,
              );

          """
          config_line = "    let config = load_config(codex_home.path(), codex_home.path()).await;\n"
          edits = [
              (
                  "needle",
                  "    needle = '''" + config_line,
                  "    needle = '''" + prefix + config_line,
              ),
              (
                  "replacement",
                  "    replacement = '''" + config_line,
                  "    replacement = '''" + prefix + config_line,
              ),
          ]
          for label, old, new in edits:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one {label} applicator anchor, found {count}"
                  )
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          python3 -m py_compile "$RUNNER_TEMP/apply-hepta-ui-v5-gap-closure.py"
          set +e
          python3 "$RUNNER_TEMP/apply-hepta-ui-v5-gap-closure.py" "$GITHUB_WORKSPACE" \
            > artifacts/ui-v5-gap-closure/bootstrap.log 2>&1
          rc=$?
          set -e
          cat artifacts/ui-v5-gap-closure/bootstrap.log
          if [[ "$rc" -ne 0 ]]; then
            exit "$rc"
          fi

          workflow_paths=(
            .github/workflows/hepta-ui-v4-windows-dwm-ack-producer.yml
            .github/workflows/hepta-ui-v4-windows-material-profile-aggregate.yml
            .github/workflows/windows-msvc-bazel.yml
          )
          for path in "${workflow_paths[@]}"; do
            cp "$path" "artifacts/ui-v5-gap-closure/patched-workflows/$(basename "$path")"
          done
          shasum -a 256 "${workflow_paths[@]}" \
            > artifacts/ui-v5-gap-closure/patched-workflows/SHA256SUMS

          # The Actions token cannot publish workflow changes. Restore every workflow
          # byte before staging; the workflow-capable GitHub connector publishes the
          # three retained files atomically after this source/docs commit succeeds.
          git checkout "$GITHUB_SHA" -- .github/workflows
          test -z "$(git diff --name-only -- .github/workflows)"

      - name: Commit non-workflow implementation staging
        id: staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hepta-gap-closure-bot"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          test -z "$(git diff --name-only -- .github/workflows)"
          git add -A -- ':!.github/workflows/**'
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "workflow path escaped into the non-workflow staging commit" >&2
            exit 1
          fi
          git commit -m "fix(ui): stage non-workflow repository blockers for v5"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Push linear non-workflow staging commit
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          git push origin "HEAD:refs/heads/$HEPTA_V5_BRANCH"

      - name: Upload bootstrap validation and patched workflows
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hepta-ui-v5-repository-gap-closure-bootstrap-${{ github.sha }}
          path: artifacts/ui-v5-gap-closure/
          if-no-files-found: error
          retention-days: 30
