name: hnmf-materialize

on:
  push:
    branches:
      - "codex/hnmf-blocker-closure-20260902"
    paths:
      - "scripts/materialize-hnmf-product.py"
      - ".github/workflows/hnmf-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: "${{ github.event.head_commit.message == 'chore(hnmf): materialize product crates' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact materializer commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/hnmf-blocker-closure-20260902
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact trigger commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name "Hepta HNMF Product Materializer"
          git config user.email "hepta-hnmf@users.noreply.github.com"

      - name: Materialize and verify product-source closure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/materialize-hnmf-product.py

      - name: Commit verified product-source closure
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "feat(hnmf): close product-source memory fabric gaps"
          git push origin HEAD:codex/hnmf-blocker-closure-20260902
