name: Hepta canonical development documents

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - integration/vnext-main-20260811

permissions:
  contents: read

concurrency:
  group: hepta-development-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Canonical docs, no history pollution, closed authority
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact event identity
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify assigned runner and exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNNER_NAME"
          test -n "$RUNNER_OS"
          test -n "$RUNNER_ARCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse 'HEAD^{tree}'

      - name: Compile verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/hepta-docs.py

      - name: Require zero historical development paths
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-docs.py inventory-legacy \
            | tee "$RUNNER_TEMP/hepta-development-docs-legacy-inventory.json"

      - name: Require generated status to be exact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-docs.py generate-status
          git diff --exit-code -- docs/STATUS.md

      - name: Verify complete canonical document system
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-docs.py verify \
            | tee "$RUNNER_TEMP/hepta-development-docs-verification.txt"

      - name: Record non-authority evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "documentation_only=true"
            echo "runtime_authority=false"
            echo "production_caller=false"
            echo "production_writer=false"
            echo "effect_authority=false"
            echo "operator_acceptance=false"
            echo "promotion=false"
            echo "release=false"
          } > "$RUNNER_TEMP/hepta-development-docs-posture.txt"

      - name: Upload exact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-development-docs-${{ github.event_name }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hepta-development-docs-legacy-inventory.json
            ${{ runner.temp }}/hepta-development-docs-verification.txt
            ${{ runner.temp }}/hepta-development-docs-posture.txt
          if-no-files-found: error
          retention-days: 30

      - name: Require clean worktree and stable identity
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
