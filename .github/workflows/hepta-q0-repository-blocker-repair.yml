name: Hepta Q0 repository blocker repair

on:
  push:
    branches:
      - codex/hepta-intelligence-plan-v3-20260828
    paths:
      - .github/workflows/hepta-q0-repository-blocker-repair.yml

permissions:
  contents: write

concurrency:
  group: hepta-q0-repository-blocker-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Repair repository qualification blockers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact repair carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Assert exact carrier identity
        shell: bash
        env:
          EXPECTED_REPOSITORY: ProfHepta/hepta-private-ci
          EXPECTED_BRANCH: codex/hepta-intelligence-plan-v3-20260828
          EXPECTED_PARENT: e4610e5acc608be86c45e73ba6e19d2e6cc215d2
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - name: Apply exact repository policy repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise AssertionError(
                      f"{path}: expected {expected} copies, found {count}: {old[:160]!r}"
                  )
              file.write_text(text.replace(old, new, expected), encoding="utf-8")

          replace_exact(
              ".github/scripts/verify_cargo_workspace_manifests.py",
              '''MANIFEST_FEATURE_EXCEPTIONS = {
              "codex-rs/code-mode/Cargo.toml": {"sandbox": ("v8/v8_enable_sandbox",)},
              "codex-rs/v8-poc/Cargo.toml": {"sandbox": ("v8/v8_enable_sandbox",)},
          }
          OPTIONAL_DEPENDENCY_EXCEPTIONS = set()
          INTERNAL_DEPENDENCY_FEATURE_EXCEPTIONS = {}
          ''',
              '''# Exact, temporary migrations whose feature gates carry qualification or
          # production-authority separation.  The verifier below rejects both drift and
          # stale entries, so this remains a closed enumeration rather than a wildcard.
          MANIFEST_FEATURE_EXCEPTIONS = {
              "codex-rs/hepta-agentd/Cargo.toml": {
                  "default": (),
                  "qualification-cognitive-write": (),
                  "qualification-intelligence-mutation-shadow": (),
              },
              "codex-rs/hepta-automation/Cargo.toml": {
                  "default": (),
                  "taskflow-structural-qualification": (),
              },
              "codex-rs/hepta-contracts/Cargo.toml": {
                  "authbus-local-qualification": ("dep:zeroize",),
                  "default": (),
              },
              "codex-rs/hepta-matrix-sdk/Cargo.toml": {
                  "default": (),
                  "qualification-failpoints": (),
              },
              "codex-rs/hepta-matrixd/Cargo.toml": {
                  "default": (),
                  "real-synapse-e2e": (
                      "codex-hepta-matrix-sdk/qualification-failpoints",
                  ),
              },
              "codex-rs/hepta-supervisor/Cargo.toml": {
                  "default": (),
                  "production-authority": (),
              },
              "codex-rs/v8-poc/Cargo.toml": {
                  "sandbox": ("v8/v8_enable_sandbox",),
              },
          }
          OPTIONAL_DEPENDENCY_EXCEPTIONS = {
              ("codex-rs/hepta-contracts/Cargo.toml", "dependencies", "zeroize"),
          }
          INTERNAL_DEPENDENCY_FEATURE_EXCEPTIONS = {}
          ''',
          )

          replace_exact(
              ".github/scripts/verify_cargo_workspace_manifests.py",
              '''def cargo_manifests() -> list[Path]:
              return sorted(
                  path
                  for path in CARGO_RS_ROOT.rglob("Cargo.toml")
                  if path != CARGO_RS_ROOT / "Cargo.toml"
              )
          ''',
              '''def cargo_manifests() -> list[Path]:
              workspace_manifest = load_manifest(CARGO_RS_ROOT / "Cargo.toml")
              workspace = workspace_manifest.get("workspace")
              members = workspace.get("members") if isinstance(workspace, dict) else None
              if not isinstance(members, list) or not all(
                  isinstance(member, str) for member in members
              ):
                  raise ValueError(
                      "codex-rs/Cargo.toml must define a list of string workspace members"
                  )

              manifests: set[Path] = set()
              for member in members:
                  if not member or Path(member).is_absolute() or ".." in Path(member).parts:
                      raise ValueError(f"invalid Cargo workspace member: {member!r}")
                  matches = sorted(CARGO_RS_ROOT.glob(f"{member}/Cargo.toml"))
                  if not matches:
                      raise ValueError(
                          f"Cargo workspace member {member!r} has no matching manifest"
                      )
                  manifests.update(matches)
              return sorted(manifests)
          ''',
          )

          replace_exact(
              ".codespellignore",
              "iTerm\niTerm2\nnumer\npsuedo\nSOM\nte\nTE",
              "iTerm\niTerm2\nnumer\npsuedo\nSOM\nte\nTE\nANE\nWIT\nWRONLY\n",
          )
          replace_exact(
              "codex-rs/hepta-memory/src/local_lease_outbox.rs",
              "// and re-use a newer generation.",
              "// and reuse a newer generation.",
          )
          PY

          python3 .github/scripts/verify_cargo_workspace_manifests.py
          python3 -m py_compile .github/scripts/verify_cargo_workspace_manifests.py
          git diff --check

      - name: Verify spelling with the blocking-ci implementation
        uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579
        with:
          ignore_words_file: .codespellignore
          skip: ./.git

      - name: Prepare the repository Bazel environment
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: hepta-q0-repository-blocker-repair

      - name: Regenerate and verify MODULE.bazel.lock
        shell: bash
        run: |
          set -euo pipefail
          bazel mod deps --lockfile_mode=update
          ./scripts/check-module-bazel-lock.sh
          just test-github-scripts
          git diff --check

          mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
          expected=(
            .codespellignore
            .github/scripts/verify_cargo_workspace_manifests.py
            MODULE.bazel.lock
            codex-rs/hepta-memory/src/local_lease_outbox.rs
          )
          test "${#changed[@]}" = "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done

      - name: Commit verified repairs and retire carrier
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hepta-q0-repository-blocker-repair.yml

          mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
          expected=(
            .codespellignore
            .github/scripts/verify_cargo_workspace_manifests.py
            .github/workflows/hepta-q0-repository-blocker-repair.yml
            MODULE.bazel.lock
            codex-rs/hepta-memory/src/local_lease_outbox.rs
          )
          test "${#changed[@]}" = "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done

          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"

          git config user.name "hepta-q0-bot"
          git config user.email "hepta-q0-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ci): close repository qualification blockers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
