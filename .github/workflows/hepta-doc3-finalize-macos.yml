name: Hepta DOC-3 final module documentation closure macOS

on:
  push:
    branches:
      - integration/vnext-main-20260811

permissions:
  contents: write

concurrency:
  group: hepta-doc3-final-module-closure-macos
  cancel-in-progress: false

env:
  CURRENT_DEFAULT: integration/vnext-main-20260811
  FUTURE_DEFAULT: main

jobs:
  finalize:
    if: "github.event.head_commit.message == 'ops(docs): execute macos DOC-3 closure'"
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Bind exact repository state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse "refs/remotes/origin/$CURRENT_DEFAULT")" = "$GITHUB_SHA"
          main_sha="$(git rev-parse "refs/remotes/origin/$FUTURE_DEFAULT")"
          git merge-base --is-ancestor "$main_sha" "$GITHUB_SHA"
          test "$(git ls-remote --heads origin | wc -l | tr -d ' ')" = "2"
          printf '%s\n' "$main_sha" > /tmp/hepta-doc3-main
          git config user.name "Hepta Module Documentation Closure"
          git config user.email "hepta-module-docs@users.noreply.github.com"

      - name: Materialize and verify closed world
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/hepta-doc3-materialize.py
          python3 scripts/hepta-module-docs.py self-test
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-docs.py self-test
          python3 scripts/hepta-docs.py inventory-legacy
          python3 scripts/hepta-docs.py generate-status
          cp docs/STATUS.md /tmp/hepta-doc3-status
          python3 scripts/hepta-docs.py generate-status
          cmp -s docs/STATUS.md /tmp/hepta-doc3-status
          python3 scripts/hepta-docs.py verify
          git diff --check

      - name: Commit final bounded closure
        shell: bash
        run: |
          set -euo pipefail
          git rm -r \
            .github/scripts/hepta-doc3-materialize.py \
            .github/scripts/hepta-doc3-materialize.parts \
            .github/workflows/hepta-doc3-finalize.yml \
            .github/workflows/hepta-doc3-finalize-macos.yml
          git add -A
          git commit -s \
            -m "docs(modules): close DOC-3 module documentation gaps" \
            -m "Add one stable technical guide and exact source-binding record for all forty modules, enforce their closed-world coverage, and retain truthful source and activation authority states. Authority delta: none."
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-docs.py verify
          git diff --check
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > /tmp/hepta-doc3-final

      - name: Publish both retained refs atomically
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(cat /tmp/hepta-doc3-main)"
          final_sha="$(cat /tmp/hepta-doc3-final)"
          git push --atomic \
            --force-with-lease="refs/heads/$CURRENT_DEFAULT:$GITHUB_SHA" \
            --force-with-lease="refs/heads/$FUTURE_DEFAULT:$main_sha" \
            origin \
            "$final_sha:refs/heads/$CURRENT_DEFAULT" \
            "$final_sha:refs/heads/$FUTURE_DEFAULT"

      - name: Verify published closure
        shell: bash
        run: |
          set -euo pipefail
          final_sha="$(cat /tmp/hepta-doc3-final)"
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse "refs/remotes/origin/$CURRENT_DEFAULT")" = "$final_sha"
          test "$(git rev-parse "refs/remotes/origin/$FUTURE_DEFAULT")" = "$final_sha"
          test "$(git ls-remote --heads origin | wc -l | tr -d ' ')" = "2"
          test ! -e .github/scripts/hepta-doc3-materialize.py
          test ! -e .github/scripts/hepta-doc3-materialize.parts
          test ! -e .github/workflows/hepta-doc3-finalize.yml
          test ! -e .github/workflows/hepta-doc3-finalize-macos.yml
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-docs.py verify
