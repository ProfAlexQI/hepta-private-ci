name: AuthBus P1.3 exact canonical quota registry qualification

on:
  workflow_dispatch:
  push:
    branches:
      - codex/authbus-p1-3-clean-replay-20260830
    paths:
      - .github/workflows/authbus-p1-3-materialize.yml
      - .github/workflows/authbus-p1-3-qualification.yml
      - codex-rs/hepta-contracts/src/authbus_b4.rs
      - codex-rs/hepta-contracts/src/lib.rs
      - codex-rs/hepta-contracts/src/quota_registry.rs
      - codex-rs/hepta-authbus-qualification/src/model.rs
      - codex-rs/hepta-authbus-p0-3-qualification/src/lib.rs
      - codex-rs/hepta-authbus-p0-3-qualification/src/scheduler.rs
      - codex-rs/hepta-authbus-p0-3-qualification/tests/p0_3.rs
      - codex-rs/hepta-authbus-p1-3-qualification/**
      - scripts/authbus-p1-3-finalize.py
      - scripts/verify-authbus-p1-3.py
      - docs/hepta-vnext/authbus/AUTHBUS_P1_3_**

permissions:
  contents: read
  actions: read

env:
  P02: codex-rs/hepta-authbus-qualification/Cargo.toml
  P03: codex-rs/hepta-authbus-p0-3-qualification/Cargo.toml
  P13: codex-rs/hepta-authbus-p1-3-qualification/Cargo.toml
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"

jobs:
  source:
    name: Exact registry, cleanup, receipt, and negative-authority contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.mode.outputs.ready }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Detect final clean candidate
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if test ! -e scripts/authbus-p1-3-finalize.py \
            && test ! -e .github/workflows/authbus-p1-3-materialize.yml
          then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify exact source and optional receipt
        if: steps.mode.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 scripts/verify-authbus-p1-2.py | tee p1-2-source.json
          grep -q PASS_AUTHBUS_P1_2_SOURCE_ONLY p1-2-source.json
          python3 scripts/verify-authbus-p1-3.py | tee p1-3-source.json
          grep -q PASS_AUTHBUS_P1_3_SOURCE_ONLY p1-3-source.json
          ! grep -q 'pub struct CanonicalQuotaVector' \
            codex-rs/hepta-authbus-p0-3-qualification/src/scheduler.rs
          ! grep -q 'pub struct CanonicalQuotaLimits' \
            codex-rs/hepta-authbus-p0-3-qualification/src/scheduler.rs
          git diff --check
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          p = Path("docs/hepta-vnext/authbus/AUTHBUS_P1_3_EXECUTABLE_QUALIFICATION_2026-08-29.json")
          if p.exists():
              r = json.loads(p.read_text())
              assert r["schema"] == "hepta.authbus.p1.3.executable-qualification.v1"
              assert r["qualified"] is True and r["qualification_only"] is True
              assert r["registry_sha256"] == "dfcab028e1a135a0895b3f9eddec9f5f99cf5f392701b98ad14180058a284bf1"
              for k in ("authority","effect_authority","production_caller","production_writer",
                        "operator_acceptance","promotion","g5_allowed","execute_allowed",
                        "listener_enabled","provider_call_enabled","openbao_enabled",
                        "parent_workspace_wired","private_key_storage","raw_signature_storage",
                        "secret_storage"):
                  assert r[k] is False, k
              head, run_id = r["source_head"], int(r["qualification_run_id"])
              ids = {int(x) for x in r["qualification_job_ids"]}
              assert len(head) == 40 and run_id > 0 and len(ids) == 4
              changed = set(subprocess.check_output(
                  ["git","diff","--name-only",f"{head}..HEAD"], text=True
              ).splitlines())
              assert changed <= {str(p), str(p.with_suffix(".md"))}, changed
              token, repo = os.environ["GH_TOKEN"], os.environ["GITHUB_REPOSITORY"]
              def api(path):
                  q = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}{path}",
                      headers={"Accept":"application/vnd.github+json",
                               "Authorization":f"Bearer {token}",
                               "X-GitHub-Api-Version":"2022-11-28"})
                  with urllib.request.urlopen(q, timeout=30) as response:
                      return json.load(response)
              run = api(f"/actions/runs/{run_id}")
              assert run["head_sha"] == head and run["conclusion"] == "success"
              jobs = api(f"/actions/runs/{run_id}/jobs?filter=latest&per_page=100")["jobs"]
              by_id = {int(j["id"]): j for j in jobs}
              assert ids <= set(by_id)
              for job_id in ids:
                  j = by_id[job_id]
                  assert j["status"] == "completed" and j["conclusion"] == "success"
                  assert int(j.get("runner_id") or 0) > 0 and (j.get("steps") or [])
                  assert all(s.get("conclusion") in {"success","skipped"} for s in j["steps"])
          Path("p1-3-source-contract.json").write_text(json.dumps({
              "schema":"hepta.authbus.p1.3.source-contract.v1",
              "commit":os.environ["GITHUB_SHA"],
              "registry_sha256":"dfcab028e1a135a0895b3f9eddec9f5f99cf5f392701b98ad14180058a284bf1",
              "dimensions":6,"projection_surfaces":6,"legacy_adapter_count":2,
              "qualification_only":True,"authority":False,"effect_authority":False,
              "production_caller":False,"production_writer":False
          }, sort_keys=True, separators=(",",":")) + "\n")
          PY

      - name: Upload source receipt
        if: steps.mode.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authbus-p1-3-source-${{ github.run_id }}
          path: |
            p1-2-source.json
            p1-3-source.json
            p1-3-source-contract.json
          retention-days: 14

  contracts-p0-3:
    name: Contract registry and inherited P0.3 scheduler matrix
    needs: source
    if: needs.source.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: /tmp/p13-contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Run contract and P0.3 gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(rustc -V | awk '{print $2}')" = "1.95.0"
          cargo fmt --manifest-path codex-rs/Cargo.toml -p codex-hepta-contracts -- --check
          cargo fmt --manifest-path "${P03}" --all -- --check
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-contracts --features authbus-local-qualification --lib
          cargo test --manifest-path "${P03}" --locked --no-default-features --lib
          cargo test --manifest-path "${P03}" --locked --features p0-3-qualification --tests
          cargo check --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-contracts --features authbus-local-qualification --all-targets
          cargo check --manifest-path "${P03}" --locked \
            --features p0-3-qualification --all-targets
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-contracts --features authbus-local-qualification \
            --all-targets -- -D warnings
          cargo clippy --manifest-path "${P03}" --locked \
            --features p0-3-qualification --all-targets -- -D warnings
          printf '%s\n' \
            '{"schema":"hepta.authbus.p1.3.contracts-p0.3-rust-receipt.v1","qualified":true,"qualification_only":true,"authority":false,"effect_authority":false,"production_caller":false,"production_writer":false}' \
            > contracts-p0-3.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authbus-p1-3-contracts-p0-3-${{ github.run_id }}
          path: contracts-p0-3.json
          retention-days: 14

  p0-2:
    name: Inherited P0.2 SQLite WAL compatibility matrix
    needs: source
    if: needs.source.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: /tmp/p13-p02
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Run P0.2 gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(rustc -V | awk '{print $2}')" = "1.95.0"
          cargo metadata --manifest-path "${P02}" --locked --format-version 1 --no-deps >/dev/null
          cargo fmt --manifest-path "${P02}" --all -- --check
          cargo test --manifest-path "${P02}" --locked --no-default-features --lib
          cargo test --manifest-path "${P02}" --locked --features sqlite-qualification --tests
          cargo check --manifest-path "${P02}" --locked \
            --features sqlite-qualification --all-targets
          cargo clippy --manifest-path "${P02}" --locked \
            --features sqlite-qualification --all-targets -- -D warnings
          printf '%s\n' \
            '{"schema":"hepta.authbus.p1.3.p0.2-rust-receipt.v1","qualified":true,"qualification_only":true,"authority":false,"effect_authority":false,"production_caller":false,"production_writer":false}' \
            > p0-2.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authbus-p1-3-p0-2-${{ github.run_id }}
          path: p0-2.json
          retention-days: 14

  p1-3:
    name: AuthBus P1.3 registry and adapter qualification
    needs:
      - source
      - contracts-p0-3
      - p0-2
    if: needs.source.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: /tmp/p13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Run P1.3 gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(rustc -V | awk '{print $2}')" = "1.95.0"
          cargo metadata --manifest-path "${P13}" --locked --format-version 1 --no-deps >/dev/null
          cargo fmt --manifest-path "${P13}" --all -- --check
          cargo test --manifest-path "${P13}" --locked --no-default-features --lib
          cargo test --manifest-path "${P13}" --locked --features p1-3-qualification --tests
          cargo check --manifest-path "${P13}" --locked \
            --features p1-3-qualification --all-targets
          cargo clippy --manifest-path "${P13}" --locked \
            --features p1-3-qualification --all-targets -- -D warnings
          printf '%s\n' \
            '{"schema":"hepta.authbus.p1.3.rust-receipt.v1","qualified":true,"qualification_only":true,"registry_sha256":"dfcab028e1a135a0895b3f9eddec9f5f99cf5f392701b98ad14180058a284bf1","dimensions":6,"projection_surfaces":6,"legacy_adapter_count":2,"p0_3_duplicate_removed":true,"missing_request_count_default":"reject","lossy_downgrade_rejected":true,"authority":false,"effect_authority":false,"production_caller":false,"production_writer":false,"listener_enabled":false,"provider_call_enabled":false,"openbao_enabled":false}' \
            > p1-3.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authbus-p1-3-rust-${{ github.run_id }}
          path: p1-3.json
          retention-days: 14
