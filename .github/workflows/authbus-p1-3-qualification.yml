name: AuthBus P1.3 exact canonical quota registry qualification

on:
  workflow_dispatch:
  push:
    branches:
      - codex/authbus-p1-3-clean-replay-v4-macos-20260830
    paths:
      - .github/workflows/authbus-p1-3-qualification.yml
      - codex-rs/hepta-contracts/src/authbus_b1.rs
      - codex-rs/hepta-contracts/src/authbus_b1_tests.rs
      - codex-rs/hepta-contracts/src/authbus_b2.rs
      - codex-rs/hepta-contracts/src/authbus_b3.rs
      - codex-rs/hepta-contracts/src/authbus_b3_adapter.rs
      - codex-rs/hepta-contracts/src/authbus_b4.rs
      - codex-rs/hepta-contracts/src/authbus_tests.rs
      - codex-rs/hepta-contracts/src/lib.rs
      - codex-rs/hepta-contracts/src/quota_registry.rs
      - codex-rs/hepta-contracts/tests/authbus_b3_p0_1.rs
      - codex-rs/hepta-authbus-qualification/src/model.rs
      - codex-rs/hepta-authbus-qualification/src/store.rs
      - codex-rs/hepta-authbus-p0-3-qualification/src/lib.rs
      - codex-rs/hepta-authbus-p0-3-qualification/src/scheduler.rs
      - codex-rs/hepta-authbus-p0-3-qualification/tests/p0_3.rs
      - codex-rs/hepta-authbus-p1-3-qualification/**
      - scripts/verify-authbus-p1-3.py
      - docs/hepta-vnext/authbus/AUTHBUS_P1_3_**

concurrency:
  group: authbus-p1-3-v4-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  BASE_SHA: 6b7aa91d7702a92a50297b1b1bd8170ffb7cb184
  REGISTRY_SHA256: dfcab028e1a135a0895b3f9eddec9f5f99cf5f392701b98ad14180058a284bf1
  P02: codex-rs/hepta-authbus-qualification/Cargo.toml
  P03: codex-rs/hepta-authbus-p0-3-qualification/Cargo.toml
  P11: codex-rs/hepta-authbus-p1-qualification/Cargo.toml
  P12: codex-rs/hepta-authbus-p1-2-qualification/Cargo.toml
  P13: codex-rs/hepta-authbus-p1-3-qualification/Cargo.toml
  RECEIPT_JSON: docs/hepta-vnext/authbus/AUTHBUS_P1_3_EXECUTABLE_QUALIFICATION_2026-08-29.json
  RECEIPT_MD: docs/hepta-vnext/authbus/AUTHBUS_P1_3_EXECUTABLE_QUALIFICATION_2026-08-29.md
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_TARGET_DIR: /tmp/authbus-p1-3-v4-target
  RUST_BACKTRACE: "1"

jobs:
  qualify:
    name: Exact source, inherited matrices, strict lint, and receipt verification
    runs-on: macos-15-arm64
    timeout-minutes: 180
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false

      - name: Bind exact source or receipt-only child
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test ! -e scripts/authbus-p1-3-finalize.py
          test ! -e scripts/authbus-p1-3-semantic-completion.py
          test ! -e .github/workflows/authbus-p1-3-materialize.yml
          if test -f "${RECEIPT_JSON}"; then
            test -f "${RECEIPT_MD}"
            echo "receipt=true" >> "${GITHUB_OUTPUT}"
          else
            test ! -e "${RECEIPT_MD}"
            test "$(git rev-parse HEAD^)" = "${BASE_SHA}"
            echo "receipt=false" >> "${GITHUB_OUTPUT}"
          fi
          git diff --check

      - name: Verify source contracts and authority posture
        shell: bash
        run: |
          set -euo pipefail
          for phase in p0-2 p0-3 p1-1 p1-2 p1-3; do
            python3 "scripts/verify-authbus-${phase}.py" | tee "${phase}-source.json"
          done
          grep -q PASS_AUTHBUS_P1_2_SOURCE_ONLY p1-2-source.json
          grep -q PASS_AUTHBUS_P1_3_SOURCE_ONLY p1-3-source.json
          ! grep -q 'pub struct CanonicalQuotaVector' codex-rs/hepta-authbus-p0-3-qualification/src/scheduler.rs
          ! grep -q 'pub struct CanonicalQuotaLimits' codex-rs/hepta-authbus-p0-3-qualification/src/scheduler.rs
          python3 - <<'PY'
          import json
          value = json.load(open("p1-3-source.json"))
          assert value["qualification_only"] is True
          assert value["dimensions"] == 6 and value["projection_surfaces"] == 6
          for key in ("authority","effect_authority","production_caller","production_writer","provider_call_enabled","listener_enabled","openbao_enabled","wired"):
              assert value[key] is False, key
          PY
          git diff --check

      - name: Verify receipt against prior hosted run
        if: steps.mode.outputs.receipt == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          p, md = Path(os.environ["RECEIPT_JSON"]), Path(os.environ["RECEIPT_MD"])
          r = json.loads(p.read_text())
          assert r["schema"] == "hepta.authbus.p1.3.executable-qualification.v1"
          assert r["qualified"] is True and r["qualification_only"] is True
          assert r["registry_sha256"] == os.environ["REGISTRY_SHA256"]
          for k in ("authority","effect_authority","production_caller","production_writer","operator_acceptance","promotion","g5_allowed","execute_allowed","listener_enabled","provider_call_enabled","openbao_enabled","parent_workspace_wired","private_key_storage","raw_signature_storage","secret_storage"):
              assert r[k] is False, k
          head, tree = r["source_head"], r["source_tree"]
          run_id = int(r["qualification_run_id"])
          ids = {int(x) for x in r["qualification_job_ids"]}
          assert len(head) == 40 and len(tree) == 40 and run_id > 0 and len(ids) == 1
          assert subprocess.check_output(["git","rev-parse","HEAD^"], text=True).strip() == head
          assert subprocess.check_output(["git","rev-parse","HEAD^^"], text=True).strip() == os.environ["BASE_SHA"]
          changed = set(subprocess.check_output(["git","diff","--name-only",f"{head}..HEAD"], text=True).splitlines())
          assert changed == {str(p), str(md)}, changed
          token, repo = os.environ["GH_TOKEN"], os.environ["GITHUB_REPOSITORY"]
          def api(path):
              request = urllib.request.Request(f"https://api.github.com/repos/{repo}{path}", headers={"Accept":"application/vnd.github+json","Authorization":f"Bearer {token}","X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          commit = api(f"/git/commits/{head}")
          assert commit["tree"]["sha"] == tree and commit["parents"][0]["sha"] == os.environ["BASE_SHA"]
          run = api(f"/actions/runs/{run_id}")
          assert run["head_sha"] == head and run["event"] == "push" and run["status"] == "completed" and run["conclusion"] == "success"
          assert run["path"] == ".github/workflows/authbus-p1-3-qualification.yml"
          jobs = api(f"/actions/runs/{run_id}/jobs?filter=latest&per_page=100")["jobs"]
          by_id = {int(j["id"]): j for j in jobs}
          assert ids <= set(by_id)
          for job_id in ids:
              job = by_id[job_id]
              assert job["head_sha"] == head and job["status"] == "completed" and job["conclusion"] == "success"
              assert int(job.get("runner_id") or 0) > 0 and (job.get("steps") or [])
              assert all(s.get("conclusion") in {"success","skipped"} for s in job["steps"])
          PY

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Run exact full-stack gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc -V | awk '{print $2}')" = "1.95.0"
          cargo metadata --manifest-path "${P13}" --locked --format-version 1 --no-deps >/dev/null
          cargo fmt --manifest-path codex-rs/Cargo.toml --package codex-hepta-contracts -- --check
          for manifest in "${P02}" "${P03}" "${P11}" "${P12}" "${P13}"; do cargo fmt --manifest-path "${manifest}" --all -- --check; done

          cargo test --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-contracts --features authbus-local-qualification --lib -- --nocapture
          cargo test --manifest-path "${P02}" --locked --no-default-features --lib -- --nocapture
          cargo test --manifest-path "${P02}" --locked --features sqlite-qualification --tests -- --nocapture
          cargo test --manifest-path "${P03}" --locked --no-default-features --lib -- --nocapture
          cargo test --manifest-path "${P03}" --locked --features p0-3-qualification --tests -- --nocapture
          cargo test --manifest-path "${P11}" --locked --no-default-features --lib -- --nocapture
          cargo test --manifest-path "${P11}" --locked --features p1-qualification --tests -- --nocapture
          cargo test --manifest-path "${P12}" --locked --no-default-features --lib -- --nocapture
          cargo test --manifest-path "${P12}" --locked --features p1-2-qualification --tests -- --nocapture
          cargo test --manifest-path "${P13}" --locked --no-default-features --lib -- --nocapture
          cargo test --manifest-path "${P13}" --locked --features p1-3-qualification --tests -- --nocapture

          cargo check --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-contracts --features authbus-local-qualification --all-targets
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked -p codex-hepta-contracts --features authbus-local-qualification --all-targets -- -D warnings
          check_lint() { cargo check --manifest-path "$1" --locked --features "$2" --all-targets; cargo clippy --manifest-path "$1" --locked --features "$2" --all-targets -- -D warnings; }
          check_lint "${P02}" sqlite-qualification
          check_lint "${P03}" p0-3-qualification
          check_lint "${P11}" p1-qualification
          check_lint "${P12}" p1-2-qualification
          check_lint "${P13}" p1-3-qualification

          for phase in p0-2 p0-3 p1-1 p1-2 p1-3; do python3 "scripts/verify-authbus-${phase}.py"; done
          git diff --check
          cat > authbus-p1-3-gate-summary.json <<EOF
          {"schema":"hepta.authbus.p1.3.aggregate-gate.v1","head":"${GITHUB_SHA}","qualified":true,"qualification_only":true,"registry_sha256":"${REGISTRY_SHA256}","authority":false,"effect_authority":false,"production_caller":false,"production_writer":false,"provider_call_enabled":false,"listener_enabled":false,"openbao_enabled":false}
          EOF

      - name: Upload aggregate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authbus-p1-3-aggregate-${{ github.run_id }}
          path: |
            p0-2-source.json
            p0-3-source.json
            p1-1-source.json
            p1-2-source.json
            p1-3-source.json
            authbus-p1-3-gate-summary.json
          if-no-files-found: error
          retention-days: 14
