name: AuthBus P1.3 exact canonical quota registry qualification

on:
  workflow_dispatch:
  push:
    branches:
      - codex/authbus-p1-3-clean-replay-v7-exact-rustfmt-20260830
    paths:
      - .github/workflows/authbus-p1-3-qualification.yml
      - codex-rs/hepta-contracts/src/authbus_b1.rs
      - codex-rs/hepta-contracts/src/authbus_b1_tests.rs
      - codex-rs/hepta-contracts/src/authbus_b2.rs
      - codex-rs/hepta-contracts/src/authbus_b3.rs
      - codex-rs/hepta-contracts/src/authbus_b3_adapter.rs
      - codex-rs/hepta-contracts/src/authbus_b4.rs
      - codex-rs/hepta-contracts/src/authbus_tests.rs
      - codex-rs/hepta-contracts/src/lib.rs
      - codex-rs/hepta-contracts/src/quota_registry.rs
      - codex-rs/hepta-contracts/tests/authbus_b3_p0_1.rs
      - codex-rs/hepta-authbus-qualification/src/model.rs
      - codex-rs/hepta-authbus-qualification/src/store.rs
      - codex-rs/hepta-authbus-p0-3-qualification/src/lib.rs
      - codex-rs/hepta-authbus-p0-3-qualification/src/scheduler.rs
      - codex-rs/hepta-authbus-p0-3-qualification/tests/p0_3.rs
      - codex-rs/hepta-authbus-p1-3-qualification/**
      - scripts/verify-authbus-p1-3.py
      - docs/hepta-vnext/authbus/AUTHBUS_P1_3_**

concurrency:
  group: authbus-p1-3-v7-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  BASE_SHA: 6b7aa91d7702a92a50297b1b1bd8170ffb7cb184
  REGISTRY_SHA256: dfcab028e1a135a0895b3f9eddec9f5f99cf5f392701b98ad14180058a284bf1
  P02: codex-rs/hepta-authbus-qualification/Cargo.toml
  P03: codex-rs/hepta-authbus-p0-3-qualification/Cargo.toml
  P11: codex-rs/hepta-authbus-p1-qualification/Cargo.toml
  P12: codex-rs/hepta-authbus-p1-2-qualification/Cargo.toml
  P13: codex-rs/hepta-authbus-p1-3-qualification/Cargo.toml
  RECEIPT_JSON: docs/hepta-vnext/authbus/AUTHBUS_P1_3_EXECUTABLE_QUALIFICATION_2026-08-29.json
  RECEIPT_MD: docs/hepta-vnext/authbus/AUTHBUS_P1_3_EXECUTABLE_QUALIFICATION_2026-08-29.md
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_TARGET_DIR: /tmp/authbus-p1-3-v7-target
  RUST_BACKTRACE: "1"

jobs:
  qualify:
    name: Exact source, inherited matrices, strict lint, and receipt verification
    runs-on: ubuntu-slim
    timeout-minutes: 180
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false

      - name: Bind exact source or receipt-only child
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test ! -e scripts/authbus-p1-3-finalize.py
          test ! -e scripts/authbus-p1-3-semantic-completion.py
          test ! -e .github/workflows/authbus-p1-3-materialize.yml
          if test -f "${RECEIPT_JSON}"; then
            test -f "${RECEIPT_MD}"
            echo "receipt=true" >> "${GITHUB_OUTPUT}"
          else
            test ! -e "${RECEIPT_MD}"
            test "$(git rev-parse HEAD^)" = "${BASE_SHA}"
            echo "receipt=false" >> "${GITHUB_OUTPUT}"
          fi
          git diff --check

      - name: Verify source contracts and fail-closed authority posture
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-authbus-p0-2.py | tee p0-2-source.json
          python3 scripts/verify-authbus-p0-3.py | tee p0-3-source.json
          python3 scripts/verify-authbus-p1-1.py | tee p1-1-source.json
          python3 scripts/verify-authbus-p1-2.py | tee p1-2-source.json
          python3 scripts/verify-authbus-p1-3.py | tee p1-3-source.json
          grep -q PASS_AUTHBUS_P1_2_SOURCE_ONLY p1-2-source.json
          grep -q PASS_AUTHBUS_P1_3_SOURCE_ONLY p1-3-source.json
          ! grep -q 'pub struct CanonicalQuotaVector' \
            codex-rs/hepta-authbus-p0-3-qualification/src/scheduler.rs
          ! grep -q 'pub struct CanonicalQuotaLimits' \
            codex-rs/hepta-authbus-p0-3-qualification/src/scheduler.rs
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("p1-3-source.json").read_text())
          assert value["qualification_only"] is True
          for key in (
              "authority", "effect_authority", "production_caller",
              "production_writer", "provider_call_enabled", "listener_enabled",
              "openbao_enabled", "wired",
          ):
              assert value[key] is False, key
          assert value["dimensions"] == 6
          assert value["projection_surfaces"] == 6
          PY
          git diff --check

      - name: Verify executable receipt against prior exact-head run
        if: steps.mode.outputs.receipt == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          receipt_path = Path(os.environ["RECEIPT_JSON"])
          markdown_path = Path(os.environ["RECEIPT_MD"])
          receipt = json.loads(receipt_path.read_text())
          assert receipt["schema"] == "hepta.authbus.p1.3.executable-qualification.v1"
          assert receipt["qualified"] is True
          assert receipt["qualification_only"] is True
          assert receipt["registry_sha256"] == os.environ["REGISTRY_SHA256"]
          for key in (
              "authority", "effect_authority", "production_caller",
              "production_writer", "operator_acceptance", "promotion",
              "g5_allowed", "execute_allowed", "listener_enabled",
              "provider_call_enabled", "openbao_enabled",
              "parent_workspace_wired", "private_key_storage",
              "raw_signature_storage", "secret_storage",
          ):
              assert receipt[key] is False, key

          source_head = receipt["source_head"]
          source_tree = receipt["source_tree"]
          run_id = int(receipt["qualification_run_id"])
          job_ids = {int(value) for value in receipt["qualification_job_ids"]}
          assert len(source_head) == 40
          assert len(source_tree) == 40
          assert run_id > 0
          assert len(job_ids) == 1
          assert subprocess.check_output(
              ["git", "rev-parse", "HEAD^"], text=True
          ).strip() == source_head
          assert subprocess.check_output(
              ["git", "rev-parse", "HEAD^^"], text=True
          ).strip() == os.environ["BASE_SHA"]
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", f"{source_head}..HEAD"], text=True
          ).splitlines())
          assert changed == {str(receipt_path), str(markdown_path)}, changed

          token = os.environ["GH_TOKEN"]
          repository = os.environ["GITHUB_REPOSITORY"]

          def api(path: str):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          source_commit = api(f"/git/commits/{source_head}")
          assert source_commit["tree"]["sha"] == source_tree
          assert source_commit["parents"][0]["sha"] == os.environ["BASE_SHA"]
          run = api(f"/actions/runs/{run_id}")
          assert run["head_sha"] == source_head
          assert run["event"] == "push"
          assert run["status"] == "completed"
          assert run["conclusion"] == "success"
          assert run["path"] == ".github/workflows/authbus-p1-3-qualification.yml"
          jobs = api(f"/actions/runs/{run_id}/jobs?filter=latest&per_page=100")["jobs"]
          by_id = {int(job["id"]): job for job in jobs}
          assert job_ids <= set(by_id)
          for job_id in job_ids:
              job = by_id[job_id]
              assert job["head_sha"] == source_head
              assert job["status"] == "completed"
              assert job["conclusion"] == "success"
              assert int(job.get("runner_id") or 0) > 0
              steps = job.get("steps") or []
              assert steps
              assert all(
                  step.get("conclusion") in {"success", "skipped"}
                  for step in steps
              )
          PY

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Verify lock graph and exact-delta formatting
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc -V | awk '{print $2}')" = "1.95.0"
          cargo metadata --manifest-path "${P13}" --locked \
            --format-version 1 --no-deps >/dev/null

          # The canonical parent contains unrelated historical formatting debt.
          # Bind rustfmt to this exact AuthBus source delta and disable recursive
          # child traversal so the gate neither hides changed files nor sweeps
          # untouched workspace modules.
          mapfile -t rust_sources < <(
            git diff --name-only --diff-filter=ACMR "${BASE_SHA}...HEAD" \
              | grep -E '^codex-rs/(hepta-contracts|hepta-authbus-qualification|hepta-authbus-p0-3-qualification|hepta-authbus-p1-3-qualification)/.*\.rs$' \
              | sort -u
          )
          test "${#rust_sources[@]}" -gt 0
          for source in "${rust_sources[@]}"; do
            test -f "${source}"
          done
          rustfmt --check --edition 2024 \
            --config-path codex-rs/rustfmt.toml \
            --config skip_children=true \
            "${rust_sources[@]}"
          git diff --check

      - name: Run P0.2 through P1.3 executable matrices
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-contracts --features authbus-local-qualification \
            --lib -- --nocapture

          cargo test --manifest-path "${P02}" --locked \
            --no-default-features --lib -- --nocapture
          cargo test --manifest-path "${P02}" --locked \
            --features sqlite-qualification --tests -- --nocapture

          cargo test --manifest-path "${P03}" --locked \
            --no-default-features --lib -- --nocapture
          cargo test --manifest-path "${P03}" --locked \
            --features p0-3-qualification --tests -- --nocapture

          cargo test --manifest-path "${P11}" --locked \
            --no-default-features --lib -- --nocapture
          cargo test --manifest-path "${P11}" --locked \
            --features p1-qualification --tests -- --nocapture

          cargo test --manifest-path "${P12}" --locked \
            --no-default-features --lib -- --nocapture
          cargo test --manifest-path "${P12}" --locked \
            --features p1-2-qualification --tests -- --nocapture

          cargo test --manifest-path "${P13}" --locked \
            --no-default-features --lib -- --nocapture
          cargo test --manifest-path "${P13}" --locked \
            --features p1-3-qualification --tests -- --nocapture

      - name: Run all-target checks and strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-contracts --features authbus-local-qualification \
            --all-targets
          cargo clippy --manifest-path codex-rs/Cargo.toml --locked \
            -p codex-hepta-contracts --features authbus-local-qualification \
            --all-targets -- -D warnings

          cargo check --manifest-path "${P02}" --locked \
            --features sqlite-qualification --all-targets
          cargo clippy --manifest-path "${P02}" --locked \
            --features sqlite-qualification --all-targets -- -D warnings

          cargo check --manifest-path "${P03}" --locked \
            --features p0-3-qualification --all-targets
          cargo clippy --manifest-path "${P03}" --locked \
            --features p0-3-qualification --all-targets -- -D warnings

          cargo check --manifest-path "${P11}" --locked \
            --features p1-qualification --all-targets
          cargo clippy --manifest-path "${P11}" --locked \
            --features p1-qualification --all-targets -- -D warnings

          cargo check --manifest-path "${P12}" --locked \
            --features p1-2-qualification --all-targets
          cargo clippy --manifest-path "${P12}" --locked \
            --features p1-2-qualification --all-targets -- -D warnings

          cargo check --manifest-path "${P13}" --locked \
            --features p1-3-qualification --all-targets
          cargo clippy --manifest-path "${P13}" --locked \
            --features p1-3-qualification --all-targets -- -D warnings

      - name: Revalidate final source and write gate summary
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-authbus-p0-2.py
          python3 scripts/verify-authbus-p0-3.py
          python3 scripts/verify-authbus-p1-1.py
          python3 scripts/verify-authbus-p1-2.py
          python3 scripts/verify-authbus-p1-3.py
          git diff --check
          cat > authbus-p1-3-gate-summary.json <<EOF
          {"schema":"hepta.authbus.p1.3.aggregate-gate.v1","head":"${GITHUB_SHA}","qualified":true,"qualification_only":true,"registry_sha256":"${REGISTRY_SHA256}","authority":false,"effect_authority":false,"production_caller":false,"production_writer":false,"provider_call_enabled":false,"listener_enabled":false,"openbao_enabled":false}
          EOF

      - name: Upload aggregate gate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authbus-p1-3-aggregate-${{ github.run_id }}
          path: |
            p0-2-source.json
            p0-3-source.json
            p1-1-source.json
            p1-2-source.json
            p1-3-source.json
            authbus-p1-3-gate-summary.json
          if-no-files-found: error
          retention-days: 14
