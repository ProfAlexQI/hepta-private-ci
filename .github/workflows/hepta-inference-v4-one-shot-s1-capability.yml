name: Hepta inference one-shot INF-S1 capability integration

on:
  push:
    branches:
      - codex/hepta-inference-gap-closure-20260829
    paths:
      - .github/workflows/hepta-inference-v4-one-shot-s1-capability.yml

permissions:
  contents: write

concurrency:
  group: hepta-inference-v4-one-shot-s1-capability
  cancel-in-progress: false

jobs:
  integrate-and-qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Guard exact parent and clean branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/hepta-inference-gap-closure-20260829
          test "$(git rev-parse HEAD^)" = b008516f78a60ebcf46cc038d2236c9316c71c7e
          test -z "$(git status --porcelain)"
          test -f codex-rs/hepta-infer-core/src/capability.rs

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Integrate capability module and error surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-infer-core/src/lib.rs")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global source
              if source.count(old) != 1:
                  raise SystemExit(f"expected exactly one lib.rs marker: {old!r}")
              source = source.replace(old, new, 1)

          replace_once(
              "mod adapter;\nmod controller;",
              "mod adapter;\nmod capability;\nmod controller;",
          )
          replace_once(
              "pub use adapter::QualifiedController;\npub use controller::AcceptedEvent;",
              "pub use adapter::QualifiedController;\n"
              "pub use capability::CAPABILITY_KEY_BYTES;\n"
              "pub use capability::CapabilityKey;\n"
              "pub use capability::PRIVATE_AUTH_TAG_BYTES;\n"
              "pub use capability::RequestGrant;\n"
              "pub use capability::RequestGrantFence;\n"
              "pub use capability::WorkerAuthenticationTag;\n"
              "pub use capability::WorkerHandshakeFence;\n"
              "pub use controller::AcceptedEvent;",
          )
          replace_once(
              "    AuthorityEscalation,\n    DeadlineExpired,",
              "    AuthorityEscalation,\n"
              "    InvalidCapability,\n"
              "    InvalidCapabilityKey,\n"
              "    DeadlineExpired,",
          )
          replace_once(
              "            Self::AuthorityEscalation => \"INF_AUTHORITY_ESCALATION\",\n"
              "            Self::DeadlineExpired => \"INF_DEADLINE_EXPIRED\",",
              "            Self::AuthorityEscalation => \"INF_AUTHORITY_ESCALATION\",\n"
              "            Self::InvalidCapability => \"INF_INVALID_CAPABILITY\",\n"
              "            Self::InvalidCapabilityKey => \"INF_INVALID_CAPABILITY_KEY\",\n"
              "            Self::DeadlineExpired => \"INF_DEADLINE_EXPIRED\",",
          )
          path.write_text(source, encoding="utf-8")
          PY

      - name: Format and qualify core capability source
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt -p codex-hepta-infer-core
          cargo check --locked --all-targets -p codex-hepta-infer-core
          cargo test --locked --all-targets -p codex-hepta-infer-core
          cargo clippy --locked --all-targets --no-deps \
            -p codex-hepta-infer-core -- -D warnings

      - name: Enforce exact integration change set
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="codex-rs/hepta-infer-core/src/lib.rs"
          test "$actual" = "$expected"
          git diff --check

      - name: Commit qualified integration and remove one-shot workflow
        shell: bash
        env:
          TARGET_BRANCH: codex/hepta-inference-gap-closure-20260829
        run: |
          set -euo pipefail
          rm .github/workflows/hepta-inference-v4-one-shot-s1-capability.yml
          git add \
            codex-rs/hepta-infer-core/src/lib.rs \
            .github/workflows/hepta-inference-v4-one-shot-s1-capability.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat(inference): add daemon-bound capability primitives"
          git push origin "HEAD:${TARGET_BRANCH}"
