name: Temporary final blocker convergence v2

on:
  push:
    branches:
      - codex/tmp-final-converge-v2-20260902

permissions:
  contents: write

concurrency:
  group: hepta-final-blocker-convergence-v2-20260902
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_BRANCH: codex/hepta-v8-final-gap-closure-20260902
    steps:
      - name: Check out exact convergence target
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Install repository-pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3

      - name: Set up repository Bazel toolchain
        uses: ./.github/actions/setup-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu

      - name: Apply deterministic repository-owned fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"

          uv run --frozen --project scripts ruff format scripts
          cargo fmt --all --manifest-path codex-rs/Cargo.toml
          for manifest in \
            qualification/hnmf-reference/Cargo.toml \
            qualification/hnmf-contract-reference/Cargo.toml \
            qualification/hnmf-adversarial-reference/Cargo.toml; do
            cargo fmt --manifest-path "$manifest"
          done

          just bazel-lock-update

          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          CUSTOM = (
              "self-hosted",
              "xlarge",
              "-large",
              "32-core",
              "16-core",
              "8-core",
              "arm64-large",
          )
          KEYS = "runs-on|runner|os|runner-label|runner_label"

          def hosted(value: str) -> str:
              lowered = value.lower()
              if "windows" in lowered:
                  return "windows-latest"
              if "macos" in lowered or "darwin" in lowered:
                  return "macos-15"
              return "ubuntu-24.04"

          def normalize(path: Path) -> None:
              source = path.read_text(encoding="utf-8").splitlines()
              result: list[str] = []
              index = 0
              while index < len(source):
                  line = source[index]
                  scalar = re.match(rf"^(\s*)({KEYS}):\s*(.*?)\s*$", line)
                  if scalar and scalar.group(3) and "${{" not in scalar.group(3):
                      value = scalar.group(3)
                      if any(marker in value.lower() for marker in CUSTOM):
                          line = f"{scalar.group(1)}{scalar.group(2)}: {hosted(value)}"
                      result.append(line)
                      index += 1
                      continue

                  block = re.match(r"^(\s*)runs-on:\s*$", line)
                  if not block:
                      timeout = re.match(r"^(\s*)timeout-minutes:\s*(\d+)\s*$", line)
                      if timeout and int(timeout.group(2)) < 60:
                          line = f"{timeout.group(1)}timeout-minutes: 60"
                      result.append(line)
                      index += 1
                      continue

                  indent = len(block.group(1))
                  end = index + 1
                  values: list[str] = []
                  while end < len(source):
                      candidate = source[end]
                      stripped = candidate.strip()
                      current_indent = len(candidate) - len(candidate.lstrip())
                      if stripped and current_indent <= indent:
                          break
                      values.append(candidate)
                      end += 1
                  joined = " ".join(item.strip() for item in values)
                  if any(marker in joined.lower() for marker in CUSTOM):
                      result.append(f"{' ' * indent}runs-on: {hosted(joined)}")
                  else:
                      result.append(line)
                      result.extend(values)
                  index = end

              text = "\n".join(result) + "\n"
              unresolved = re.compile(
                  rf"(?im)^\s*(?:{KEYS}):.*(?:self-hosted|xlarge|-large|32-core|16-core|8-core)"
              )
              if unresolved.search(text):
                  raise SystemExit(f"unresolved unavailable runner label in {path}")
              path.write_text(text, encoding="utf-8")

          for filename in (".github/workflows/bazel.yml", ".github/workflows/sdk.yml"):
              normalize(Path(filename))
          PY

          git diff --check

      - name: Verify deterministic closure before publication
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --project scripts ruff format --check scripts
          cargo fmt --all --manifest-path codex-rs/Cargo.toml -- --check
          for manifest in \
            qualification/hnmf-reference/Cargo.toml \
            qualification/hnmf-contract-reference/Cargo.toml \
            qualification/hnmf-adversarial-reference/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" -- --check
            cargo check --manifest-path "$manifest" --all-targets --locked
            cargo test --manifest-path "$manifest" --locked
          done

          python3 scripts/hepta-paper-evidence.py verify
          python3 scripts/hepta-hnmf.py self-test
          python3 scripts/hepta-hnmf.py verify
          python3 scripts/hepta-cns.py self-test
          python3 scripts/hepta-cns.py generate-status --check
          python3 scripts/hepta-cns.py verify
          python3 scripts/hepta-module-docs.py self-test
          python3 scripts/hepta-module-docs.py verify
          python3 scripts/hepta-algorithm-docs.py self-test
          python3 scripts/hepta-algorithm-docs.py verify-sources
          python3 scripts/hepta-algorithm-docs.py generate-status --check
          python3 scripts/hepta-algorithm-docs.py verify
          python3 scripts/hepta-docs.py self-test
          python3 scripts/hepta-docs.py generate-status
          git diff --exit-code -- docs/STATUS.md
          python3 scripts/hepta-docs.py verify
          python3 scripts/hepta-repository-integrity.py self-test
          python3 scripts/hepta-repository-integrity.py verify
          ./scripts/check-module-bazel-lock.sh
          git diff --check
          test ! -e .github/workflows/tmp-final-converge-v2.yml
          test ! -e .github/workflows/tmp-generate-cargo-lock.yml

      - name: Publish ordinary source convergence commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta deterministic convergence"
          git config user.email "hepta-convergence@users.noreply.github.com"
          git add -- \
            MODULE.bazel.lock \
            .github/workflows/bazel.yml \
            .github/workflows/sdk.yml \
            scripts \
            qualification/hnmf-reference \
            qualification/hnmf-contract-reference \
            qualification/hnmf-adversarial-reference
          if git diff --cached --quiet; then
            echo "Target already contains all deterministic fixes."
            exit 0
          fi
          git commit -m "fix(ci): close deterministic format, lock and runner blockers"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
