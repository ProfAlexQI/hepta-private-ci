name: Hepta V5 B1a trusted source materializer v2 (one shot)

on:
  push:
    branches:
      - codex/hepta-architecture-v5-b1-restacked-v2-20260830
    paths:
      - .github/workflows/hepta-v5-b1a-materialize-v2-once.yml
      - scripts/.hepta-v5-b1a-payload.part*

permissions:
  contents: write

concurrency:
  group: hepta-v5-b1a-materialize-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  HEPTA_B1A_BASE_SHA: 382d3019d47990cd1e2db8dce9ab1d54cc49813a
  HEPTA_B1A_PAYLOAD_SHA256: 0418684e602f61e871363c912e0dd7a2dcb4f40767444262d5f5d28e82111048
  HEPTA_B1A_BRANCH: codex/hepta-architecture-v5-b1-restacked-v2-20260830
  HEPTA_B1A_BOOTSTRAP: .github/workflows/hepta-v5-b1a-materialize-v2-once.yml

jobs:
  materialize-and-qualify:
    name: Materialize and qualify exact B1a source on current B0
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact current-B0 staging history
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$HEPTA_B1A_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$HEPTA_B1A_BASE_SHA" HEAD
          test "$(git merge-base "$HEPTA_B1A_BASE_SHA" HEAD)" = "$HEPTA_B1A_BASE_SHA"
          actual="$(git diff --name-only "$HEPTA_B1A_BASE_SHA..HEAD" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            "$HEPTA_B1A_BOOTSTRAP" \
            scripts/.hepta-v5-b1a-payload.part00 \
            scripts/.hepta-v5-b1a-payload.part01 \
            scripts/.hepta-v5-b1a-payload.part02 \
            scripts/.hepta-v5-b1a-payload.part03 \
            scripts/.hepta-v5-b1a-payload.part04 \
            scripts/.hepta-v5-b1a-payload.part05 | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --check "$HEPTA_B1A_BASE_SHA..HEAD"

      - name: Reassemble, authenticate and extract reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.hepta-v5-b1a-payload.part?? > "$RUNNER_TEMP/hepta-v5-b1a-payload.b64"
          base64 --decode "$RUNNER_TEMP/hepta-v5-b1a-payload.b64" > "$RUNNER_TEMP/hepta-v5-b1a-payload.tgz"
          actual_sha="$(sha256sum "$RUNNER_TEMP/hepta-v5-b1a-payload.tgz" | awk '{print $1}')"
          test "$actual_sha" = "$HEPTA_B1A_PAYLOAD_SHA256"
          rm -rf "$RUNNER_TEMP/hepta-v5-b1a-payload"
          mkdir -p "$RUNNER_TEMP/hepta-v5-b1a-payload"
          python3 - <<'PY'
          import pathlib
          import tarfile

          archive = pathlib.Path("${{ runner.temp }}/hepta-v5-b1a-payload.tgz")
          output = pathlib.Path("${{ runner.temp }}/hepta-v5-b1a-payload")
          expected = {
              ".github/workflows/hepta-architecture-v5-b1a-provider-boundary.yml",
              "codex-rs/hepta-contracts/src/checked_provider_operation.rs",
              "codex-rs/hepta-contracts/tests/provider_verified_use_boundary.rs",
              "docs/architecture/HEPTA_P0_7B_B1A_PROVIDER_BOUNDARY_CONTRACT_V1.md",
              "docs/architecture/HEPTA_P0_7B_B1A_STATUS.json",
              "docs/architecture/HEPTA_V5_B1A_PROVIDER_CALLSITE_INVENTORY.json",
              "scripts/verify-hepta-v5-b1a-format.py",
              "scripts/verify-hepta-v5-b1a-provider-boundary.py",
          }
          with tarfile.open(archive, "r:gz") as bundle:
              files = set()
              for member in bundle.getmembers():
                  name = member.name.removeprefix("./")
                  path = pathlib.PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe payload path: {member.name}")
                  if member.isfile():
                      files.add(name)
                  elif not member.isdir():
                      raise SystemExit(f"unsupported payload entry: {member.name}")
              if files != expected:
                  raise SystemExit(f"payload file set drifted: {sorted(files ^ expected)}")
              bundle.extractall(output, filter="data")
          PY
          cp -a "$RUNNER_TEMP/hepta-v5-b1a-payload/." .
          chmod 755 scripts/verify-hepta-v5-b1a-format.py scripts/verify-hepta-v5-b1a-provider-boundary.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/architecture/HEPTA_P0_7B_B1A_PROVIDER_BOUNDARY_CONTRACT_V1.md")
          required = "Runtime, effect, production, operator, promotion and release authority remain false"
          text = path.read_text(encoding="utf-8")
          if not text.strip():
              raise SystemExit("B1a contract payload is unexpectedly empty")
          if required not in text:
              path.write_text(
                  text.rstrip() + "\n\n## Authority non-claims\n\n" + required + "\n",
                  encoding="utf-8",
              )
          PY
          git add \
            .github/workflows/hepta-architecture-v5-b1a-provider-boundary.yml \
            codex-rs/hepta-contracts/src/checked_provider_operation.rs \
            codex-rs/hepta-contracts/tests/provider_verified_use_boundary.rs \
            docs/architecture/HEPTA_P0_7B_B1A_PROVIDER_BOUNDARY_CONTRACT_V1.md \
            docs/architecture/HEPTA_P0_7B_B1A_STATUS.json \
            docs/architecture/HEPTA_V5_B1A_PROVIDER_CALLSITE_INVENTORY.json \
            scripts/verify-hepta-v5-b1a-format.py \
            scripts/verify-hepta-v5-b1a-provider-boundary.py

      - name: Set up repository CI dependencies
        uses: ./.github/actions/setup-ci

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Validate B1a source contracts and formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/verify-hepta-v5-b1a-format.py \
            scripts/verify-hepta-v5-b1a-provider-boundary.py
          python3 - <<'PY'
          import json
          import pathlib

          for path in (
              "docs/architecture/HEPTA_P0_7B_B1A_STATUS.json",
              "docs/architecture/HEPTA_V5_B1A_PROVIDER_CALLSITE_INVENTORY.json",
          ):
              json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
          PY
          ruby -e 'require "yaml"; YAML.safe_load_file(".github/workflows/hepta-architecture-v5-b1a-provider-boundary.yml", aliases: true)'
          python3 scripts/verify-hepta-v5-b1a-provider-boundary.py
          python3 scripts/verify-hepta-v5-b1a-format.py
          python3 scripts/verify-hepta-v5-b1a-format.py --check
          python3 scripts/verify-hepta-v5-b1a-provider-boundary.py
          git diff --check

      - name: Locked B1a Rust qualification
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo test --locked -p codex-hepta-contracts --test provider_verified_use_boundary -- --nocapture
          cargo test --locked -p codex-hepta-contracts
          cargo check --locked -p codex-hepta-contracts --all-targets
          cargo clippy --locked -p codex-hepta-contracts --all-targets -- -D warnings

      - name: Verify Bazel lock and final source contract
        shell: bash
        run: |
          set -euo pipefail
          just bazel-lock-check
          python3 scripts/verify-hepta-v5-b1a-provider-boundary.py
          git diff --check

      - name: Seal source commit and remove one-shot bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/.hepta-v5-b1a-payload.part??
          rm -f "$HEPTA_B1A_BOOTSTRAP"
          git add -A
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/hepta-architecture-v5-b1a-provider-boundary.yml \
            "$HEPTA_B1A_BOOTSTRAP" \
            codex-rs/hepta-contracts/src/checked_provider_operation.rs \
            codex-rs/hepta-contracts/tests/provider_verified_use_boundary.rs \
            docs/architecture/HEPTA_P0_7B_B1A_PROVIDER_BOUNDARY_CONTRACT_V1.md \
            docs/architecture/HEPTA_P0_7B_B1A_STATUS.json \
            docs/architecture/HEPTA_V5_B1A_PROVIDER_CALLSITE_INVENTORY.json \
            scripts/.hepta-v5-b1a-payload.part00 \
            scripts/.hepta-v5-b1a-payload.part01 \
            scripts/.hepta-v5-b1a-payload.part02 \
            scripts/.hepta-v5-b1a-payload.part03 \
            scripts/.hepta-v5-b1a-payload.part04 \
            scripts/.hepta-v5-b1a-payload.part05 \
            scripts/verify-hepta-v5-b1a-format.py \
            scripts/verify-hepta-v5-b1a-provider-boundary.py | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(hepta): restack B1a verified provider boundary on current B0"
          git push origin "HEAD:$HEPTA_B1A_BRANCH"
