name: hepta-ui-v4-build-remediation-commit-once

on:
  push:
    branches:
      - "ops/hepta-ui-v4-commit-builder-20260829"

permissions:
  contents: write
  actions: read

concurrency:
  group: hepta-ui-v4-build-remediation-commit-once
  cancel-in-progress: true

jobs:
  build:
    name: Build validated exact-head remediation commit object
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: f9f362c8c0eb2fa6e28ded8cb141e4d4e8a02a2d
      TARGET_TREE: 1d0b228bd5d389d3b94d35b257ac4439bb38f121
    steps:
      - name: Checkout remediation driver
        uses: actions/checkout@v4
        with:
          ref: ops/hepta-ui-v4-commit-builder-20260829
          path: driver
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Transform and validate exact candidate
        shell: bash
        env:
          HEPTA_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          HEPTA_MODIFIED_PATHS_OUT: ${{ github.workspace }}/artifacts/modified-paths.json
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          python3 -m py_compile driver/ops/hepta-ui-v4-build-remediation.py
          python3 driver/ops/hepta-ui-v4-build-remediation.py \
            | tee artifacts/transformed-paths.txt
          ruby -c candidate/scripts/hepta-ui-v4-exact-candidate-materialization-gate
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' \
            candidate/.github/workflows/hepta-ui-v4-rust-served-cross-browser-final.yml \
            candidate/.github/workflows/hepta-ui-v4-windows-material-profile-runtime.yml \
            candidate/.github/workflows/hepta-ui-v4-windows-material-profile-aggregate.yml \
            candidate/.github/workflows/hepta-ui-v4-windows-material-profile-exact.yml \
            candidate/.github/workflows/hepta-ui-v4-windows-dwm-ack-producer.yml
          git -C candidate diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {
              '.gitattributes',
              'codex-rs/hepta-core/build.rs',
              '.github/workflows/hepta-ui-v4-rust-served-cross-browser-final.yml',
              'apps/hepta-native/src/shared/hepta_material_app_lifecycle.rs',
              'scripts/hepta-ui-v4-exact-candidate-materialization-gate',
              '.github/workflows/hepta-ui-v4-windows-material-profile-runtime.yml',
              '.github/workflows/hepta-ui-v4-windows-material-profile-aggregate.yml',
              '.github/workflows/hepta-ui-v4-windows-material-profile-exact.yml',
              '.github/workflows/hepta-ui-v4-windows-dwm-ack-producer.yml',
          }
          actual = set(json.loads(Path('artifacts/modified-paths.json').read_text()))
          if actual != expected:
              raise SystemExit(f'modified path drift: {sorted(actual ^ expected)}')
          for path in expected:
              data = Path('candidate', path).read_bytes()
              if b'\r' in data or not data.endswith(b'\n'):
                  raise SystemExit(f'non-canonical UTF-8 text: {path}')
          PY
          (
            cd candidate
            git check-attr eol -- \
              apps/hepta-control-ui/index.html \
              apps/hepta-control-ui/styles.css \
              apps/hepta-control-ui/control-ui.js \
              apps/hepta-control-ui/control-ui-v4-runtime.js \
              | tee ../artifacts/eol-attributes.txt
            grep -c 'eol: lf$' ../artifacts/eol-attributes.txt | grep -qx 4
            ruby scripts/hepta-ui-v4-exact-candidate-materialization-gate \
              | tee ../artifacts/exact-source-gate.json
            cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
            cargo check --manifest-path codex-rs/Cargo.toml -p hepta-core
            cargo fmt --manifest-path apps/hepta-native/Cargo.toml -- --check
            cargo check --manifest-path apps/hepta-native/Cargo.toml --lib --no-default-features
          )

      - name: Create remote Git blobs, tree, and commit object
        shell: bash
        env:
          COMMIT_MESSAGE: "ci(ui): close exact-head Native, Windows checkout, and browser determinism gaps"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          target = os.environ['TARGET_SHA']
          base_tree = os.environ['TARGET_TREE']
          root = Path('candidate')
          paths = json.loads(Path('artifacts/modified-paths.json').read_text())

          def request(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{endpoint}',
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                      'User-Agent': 'hepta-ui-v4-remediation-builder',
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          entries = []
          blobs = {}
          for path in paths:
              content = base64.b64encode((root / path).read_bytes()).decode()
              blob = request('POST', '/git/blobs', {'content': content, 'encoding': 'base64'})
              mode = subprocess.check_output(
                  ['git', '-C', str(root), 'ls-tree', target, '--', path], text=True
              ).split()[0]
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
              blobs[path] = blob['sha']

          tree = request('POST', '/git/trees', {'base_tree': base_tree, 'tree': entries})
          commit = request('POST', '/git/commits', {
              'message': os.environ['COMMIT_MESSAGE'],
              'tree': tree['sha'],
              'parents': [target],
          })
          resolved = request('GET', f"/git/commits/{commit['sha']}")
          if resolved['tree']['sha'] != tree['sha']:
              raise SystemExit('remote commit tree mismatch')
          payload = {
              'schema': 'hepta.ui.v4.remediation-commit-object.v1',
              'parent': target,
              'baseTree': base_tree,
              'tree': tree['sha'],
              'commit': commit['sha'],
              'blobs': blobs,
              'authority': {
                  'refUpdated': False,
                  'targetBranchUpdated': False,
                  'production': False,
                  'operatorAcceptance': False,
                  'promotion': False,
                  'release': False,
              },
          }
          Path('artifacts/commit-object.json').write_text(json.dumps(payload, indent=2) + '\n')
          print(json.dumps(payload, indent=2))
          PY

      - name: Upload commit-object evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-ui-v4-remediation-commit-object-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14
