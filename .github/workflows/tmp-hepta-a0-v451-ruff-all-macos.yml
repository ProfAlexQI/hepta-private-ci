name: Temporary Hepta A0 V4.5.1 exact Ruff formatter macOS

on:
  push:
    branches:
      - tmp/hepta-intelligence-a0-v451-ruff-all-macos-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout exact temporary formatter head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install locked uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3
      - name: Format exact A0 candidate-owned Python scope
        run: |
          set -euo pipefail
          uv run --frozen --project scripts ruff format \
            scripts/hepta-intelligence-current-truth.py \
            scripts/verify-hepta-intelligence-a0-authority.py \
            scripts/verify-hepta-intelligence-document-authority.py \
            scripts/verify-hepta-intelligence-master-plan.py
          uv run --frozen --project scripts ruff format --check \
            scripts/hepta-intelligence-current-truth.py \
            scripts/verify-hepta-intelligence-a0-authority.py \
            scripts/verify-hepta-intelligence-document-authority.py \
            scripts/verify-hepta-intelligence-master-plan.py
      - name: Assert exact formatter scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess
          expected = [
              "scripts/hepta-intelligence-current-truth.py",
              "scripts/verify-hepta-intelligence-a0-authority.py",
              "scripts/verify-hepta-intelligence-document-authority.py",
              "scripts/verify-hepta-intelligence-master-plan.py",
          ]
          observed = sorted(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          print("\n".join(observed))
          if observed != expected:
              raise SystemExit(f"unexpected formatter scope: {observed}")
          PY
          git diff --check
      - name: Stage exact formatted artifact
        run: |
          set -euo pipefail
          mkdir -p formatted/scripts
          cp scripts/hepta-intelligence-current-truth.py formatted/scripts/
          cp scripts/verify-hepta-intelligence-a0-authority.py formatted/scripts/
          cp scripts/verify-hepta-intelligence-document-authority.py formatted/scripts/
          cp scripts/verify-hepta-intelligence-master-plan.py formatted/scripts/
          shasum -a 256 formatted/scripts/*.py | sort > formatted/SHA256SUMS
      - name: Upload exact formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-a0-v451-exact-ruff-formatted-macos
          path: formatted
          if-no-files-found: error
          retention-days: 7
