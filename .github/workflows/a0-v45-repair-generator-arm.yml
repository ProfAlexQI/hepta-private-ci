name: Hepta Intelligence A0 V4.5 repair generator ARM

on:
  push:
    branches: ["codex/hepta-intelligence-a0-v45-repair-generator-20260830"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a0-v45-repair-generator-arm
  cancel-in-progress: true

env:
  Q0_HEAD: c768bcbeb4c1168088d2499828c24da521a2a73a
  CANONICAL_A0_BRANCH: codex/hepta-intelligence-a0-authority-gap-closure-20260829
  GENERATOR_SHA256: 50909f010ca32cd513e94c6088b861ea61bad6c17a2417cce1e44d647a37ace2

jobs:
  validate:
    name: Validate V4.5 exact-parent replacement on ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout scratch source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct authenticated generator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          payload=''.join(p.read_text() for p in sorted(Path('scripts/a0-v45-generator').glob('payload.*')))
          code=gzip.decompress(base64.b64decode(payload))
          assert hashlib.sha256(code).hexdigest() == '50909f010ca32cd513e94c6088b861ea61bad6c17a2417cce1e44d647a37ace2'
          Path('/tmp/a0_v45_generator.py').write_bytes(code)
          PY
          python3 -m py_compile /tmp/a0_v45_generator.py
      - name: Generate and validate replacement
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/a0-v45
          python3 /tmp/a0_v45_generator.py --root "$GITHUB_WORKSPACE" --output /tmp/a0-v45
          git checkout --detach "$Q0_HEAD"
          cp -a /tmp/a0-v45/generated/. "$GITHUB_WORKSPACE"/
          chmod +x scripts/hepta-intelligence-current-truth.py scripts/verify-hepta-intelligence-a0-authority.py scripts/verify-hepta-intelligence-document-authority.py scripts/verify-hepta-intelligence-master-plan.py
          git add -A
          git diff --cached --check
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          m=json.loads(Path('/tmp/a0-v45/repair-manifest.json').read_text())
          observed=sorted(x for x in subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines() if x)
          assert observed == [x['path'] for x in m['files']]
          assert len(observed)==17 and m['source_writeback'] is False and m['a0_candidate_qualified'] is False
          assert m['authority'] and all(v is False for v in m['authority'].values())
          PY
          git -c user.name='A0 V4.5 ARM validation' -c user.email='a0-v45-arm@invalid.example' commit -m 'test(intelligence): validate V4.5 exact-parent replacement on ARM'
          test "$(git rev-parse HEAD^)" = "$Q0_HEAD"
          test "$(git rev-list --count "$Q0_HEAD"..HEAD)" = 1
          python3 -m py_compile scripts/hepta-intelligence-current-truth.py scripts/verify-hepta-intelligence-a0-authority.py scripts/verify-hepta-intelligence-document-authority.py scripts/verify-hepta-intelligence-master-plan.py
          python3 scripts/verify-hepta-intelligence-master-plan.py
          python3 scripts/verify-hepta-intelligence-document-authority.py
          python3 scripts/hepta-intelligence-current-truth.py --verify
          python3 scripts/hepta-intelligence-current-truth.py --compact >/tmp/truth-a.json
          python3 scripts/hepta-intelligence-current-truth.py --compact >/tmp/truth-b.json
          cmp /tmp/truth-a.json /tmp/truth-b.json
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_REPOSITORY="ProfHepta/hepta-private-ci" GITHUB_REF_NAME="$CANONICAL_A0_BRANCH" python3 scripts/verify-hepta-intelligence-a0-authority.py >/tmp/a0-v45/a0-source-evidence-receipt.json
          for tranche in P0.2 P0.3 P0.4a P0.4b P0.4c; do python3 scripts/hepta-intelligence-status-compat.py "$tranche" --check-only; done
          git diff --binary "$Q0_HEAD" HEAD >/tmp/a0-v45/a0-v45-replacement.patch
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Finalize receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          out=Path('/tmp/a0-v45'); m=json.loads((out/'repair-manifest.json').read_text())
          m.update({'validation_architecture':'aarch64-unknown-linux-gnu','validation_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'validation_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'validation_parent':subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip(),'generator_sha256':'50909f010ca32cd513e94c6088b861ea61bad6c17a2417cce1e44d647a37ace2','patch_sha256':hashlib.sha256((out/'a0-v45-replacement.patch').read_bytes()).hexdigest(),'status':'PASS_LOCAL_EXACT_PARENT_V4_5_REPLACEMENT_VALIDATION_ARM'})
          (out/'repair-manifest.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          PY
      - name: Upload replacement artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-intelligence-a0-v45-repair-arm-${{ github.sha }}
          path: /tmp/a0-v45/**
          if-no-files-found: error
          retention-days: 30
