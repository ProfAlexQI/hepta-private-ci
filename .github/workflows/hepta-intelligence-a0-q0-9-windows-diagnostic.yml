name: Hepta Intelligence A0 + Q0.9 Windows exact diagnostic

on:
  push:
    branches:
      - "diagnostic/hepta-intelligence-a0-q0-9-windows-20260830"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-intelligence-a0-q0-9-windows-${{ github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_REPOSITORY: ProfHepta/hepta-private-ci
  EXPECTED_HEAD_SHA: c3b75b88e7ef5288a7b5f2d4ba364586e7d10ae6
  EXPECTED_TREE_SHA: bc690dd528c4941bd73b16db7ee3d731cb332a2f
  A0_SOURCE_HEAD: 73a636867dbebc2dd4bdf957c9c6ff3eb0ea9358
  Q0_9_SECOND_PARENT: 12918473936b0fd5ebcbdf0eed6de753bb24f8de

jobs:
  windows-argument-comment-lint:
    name: Exact c3b75b8 Windows checkout and argument lint
    runs-on: windows-latest
    timeout-minutes: 45
    environment:
      name: bazel
      deployment: false
    steps:
      - name: Enable Windows long paths before checkout
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Checkout exact integration candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact immutable identity and Q0.9 source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE_SHA"
          read -r first_parent second_parent extra <<< "$(git show -s --format=%P HEAD)"
          test "$first_parent" = "$A0_SOURCE_HEAD"
          test "$second_parent" = "$Q0_9_SECOND_PARENT"
          test -z "${extra:-}"

          python3 - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/rust-ci.yml').read_text(encoding='utf-8')
          marker = '''      - name: Enable Windows long paths before checkout
                if: runner.os == 'Windows'
                shell: pwsh
                run: git config --system core.longpaths true
              - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2'''
          normalized = '\n'.join(line.rstrip() for line in text.splitlines())
          expected = '\n'.join(line.rstrip() for line in marker.splitlines())
          if expected not in normalized:
              raise SystemExit('Q0.9 long-path step is not immediately before conditional checkout')
          print('PASS_Q0_9_WINDOWS_PRECHECKOUT_ORDER')
          PY

          mkdir -p "$RUNNER_TEMP/hepta-intelligence-a0-q0-9-windows"
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "parents=$(git show -s --format=%P HEAD)"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
          } > "$RUNNER_TEMP/hepta-intelligence-a0-q0-9-windows/identity.txt"

      - name: Run argument comment lint on codex-rs via Bazel
        uses: ./.github/actions/run-argument-comment-lint
        with:
          target: ${{ runner.os }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Verify clean worktree and record negative authority
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=normal --ignore-submodules=none)"
          {
            echo "completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "job_status=${{ job.status }}"
            echo "source_writeback=false"
            echo "a0_candidate_qualified=false"
            echo "selected=false"
            echo "runtime_authority=false"
            echo "production_authority=false"
          } > "$RUNNER_TEMP/hepta-intelligence-a0-q0-9-windows/outcome.txt"

      - name: Upload Windows diagnostic evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4
        with:
          name: hepta-intelligence-a0-q0-9-windows-c3b75b8-${{ github.run_id }}
          path: ${{ runner.temp }}/hepta-intelligence-a0-q0-9-windows/**
          if-no-files-found: error
          retention-days: 30
