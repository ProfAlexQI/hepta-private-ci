name: Diagnostic Hepta V6 hardening inventory

on:
  push:
    branches:
      - diagnostic/hepta-v6-hardening-inventory-gpt56-20260831

permissions:
  contents: read
  pull-requests: read

env:
  BASE_COMMIT: b621768b70a09d56626bb8a2c331e3dc424e6a4d

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build bounded hardening inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import subprocess
          import urllib.request

          root = Path.cwd()
          base = os.environ["BASE_COMMIT"]
          out = Path(os.environ["RUNNER_TEMP"]) / "hepta-v6-hardening-inventory.json"

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          def api(path: str) -> dict:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/TrillionniumFoundation/hepta-private-ci/{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "hepta-v6-hardening-inventory",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.length is not None and response.length > 4_000_000:
                      raise RuntimeError("GitHub response exceeds bound")
                  return json.load(response)

          modules_doc = json.loads((root / "docs/modules/MODULES.json").read_text(encoding="utf-8"))
          current_doc = json.loads((root / "docs/CURRENT.json").read_text(encoding="utf-8"))
          evidence_doc = json.loads((root / "docs/evidence/INDEX.json").read_text(encoding="utf-8"))

          roots = []
          for module in modules_doc["modules"]:
              for path in module["roots"]:
                  p = root / path
                  roots.append({
                      "module": module["id"],
                      "path": path,
                      "exists": p.exists(),
                      "isDirectory": p.is_dir(),
                  })

          discovered = []
          patterns = ["codex-rs/hepta-*", "apps/hepta-*", "tools/hepta-*", "external/HeptaBao", "third_party/servo-patches"]
          for pattern in patterns:
              for p in root.glob(pattern):
                  if p.is_dir():
                      discovered.append(p.relative_to(root).as_posix())
          discovered = sorted(set(discovered))
          declared = {entry["path"] for entry in roots}

          deleted = []
          raw = subprocess.check_output(
              ["git", "diff", "--name-status", "--no-renames", base, "HEAD"],
              text=True,
          )
          for line in raw.splitlines():
              status, path = line.split("\t", 1)
              if status != "D":
                  continue
              deleted.append({
                  "path": path,
                  "baseBlob": git("rev-parse", f"{base}:{path}"),
              })

          tracked = git("ls-files", "-z").split("\0")
          exact_refs = []
          broken_links = []
          link_re = re.compile(r"!?\[[^\]]*\]\(([^)]+)\)")
          deleted_paths = {item["path"] for item in deleted}
          for rel in tracked:
              if not rel:
                  continue
              path = root / rel
              try:
                  if path.stat().st_size > 2_000_000:
                      continue
                  text = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              for deleted_path in deleted_paths:
                  if deleted_path in text:
                      exact_refs.append({"referencingPath": rel, "deletedPath": deleted_path})
              if path.suffix.lower() not in {".md", ".markdown"}:
                  continue
              for match in link_re.finditer(text):
                  target = match.group(1).strip().split("#", 1)[0].split("?", 1)[0]
                  if not target or target.startswith(("http://", "https://", "mailto:", "data:")):
                      continue
                  resolved = (PurePosixPath(rel).parent / target)
                  normalized_parts = []
                  for part in resolved.parts:
                      if part in ("", "."):
                          continue
                      if part == "..":
                          if normalized_parts:
                              normalized_parts.pop()
                          continue
                      normalized_parts.append(part)
                  normalized = PurePosixPath(*normalized_parts).as_posix()
                  if normalized and not (root / normalized).exists():
                      broken_links.append({"referencingPath": rel, "target": target, "normalized": normalized})

          prs = sorted({
              int(candidate["pullRequest"])
              for candidate in current_doc.get("activeCandidates", [])
              if candidate.get("pullRequest")
          } | {
              int(observation["pullRequest"])
              for observation in evidence_doc.get("observations", [])
              if observation.get("pullRequest")
          } | {285})
          live = []
          for number in prs:
              pr = api(f"pulls/{number}")
              commit = api(f"git/commits/{pr['head']['sha']}")
              live.append({
                  "number": number,
                  "id": pr["id"],
                  "state": pr["state"],
                  "draft": pr["draft"],
                  "updatedAt": pr["updated_at"],
                  "headRef": pr["head"]["ref"],
                  "headSha": pr["head"]["sha"],
                  "headTree": commit["tree"]["sha"],
                  "baseRef": pr["base"]["ref"],
                  "baseSha": pr["base"]["sha"],
              })

          manifest_proc = subprocess.run(
              ["python3", ".github/scripts/verify_cargo_workspace_manifests.py"],
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
          )

          inventory = {
              "schema": "hepta.v6.hardening-inventory.v1",
              "commit": git("rev-parse", "HEAD"),
              "tree": git("rev-parse", "HEAD^{tree}"),
              "baseCommit": base,
              "moduleRoots": roots,
              "discoveredHeptaRoots": discovered,
              "uncoveredDiscoveredRoots": sorted(set(discovered) - declared),
              "declaredMissingRoots": sorted(entry["path"] for entry in roots if not entry["exists"]),
              "deletedPaths": deleted,
              "exactDeletedPathReferences": sorted(exact_refs, key=lambda x: (x["referencingPath"], x["deletedPath"])),
              "brokenMarkdownLinks": sorted(broken_links, key=lambda x: (x["referencingPath"], x["normalized"])),
              "livePullRequests": live,
              "cargoManifestVerifier": {
                  "returnCode": manifest_proc.returncode,
                  "output": manifest_proc.stdout,
              },
          }
          out.write_text(json.dumps(inventory, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"inventory={out}")
          print(f"declared_roots={len(roots)}")
          print(f"missing_roots={len(inventory['declaredMissingRoots'])}")
          print(f"discovered_hepta_roots={len(discovered)}")
          print(f"uncovered_roots={len(inventory['uncoveredDiscoveredRoots'])}")
          print(f"deleted_paths={len(deleted)}")
          print(f"exact_deleted_refs={len(exact_refs)}")
          print(f"broken_markdown_links={len(broken_links)}")
          print(f"live_prs={len(live)}")
          print(f"cargo_manifest_verifier_rc={manifest_proc.returncode}")
          PY

      - name: Upload bounded inventory
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-v6-hardening-inventory-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-v6-hardening-inventory.json
          if-no-files-found: error
          retention-days: 7
