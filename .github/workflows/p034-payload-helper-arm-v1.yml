name: p034-payload-helper-arm-v1

on:
  push:
    branches:
      - "codex/p034-payload-helper-arm-v1-20260829"
    paths:
      - ".github/workflows/p034-payload-helper-arm-v1.yml"

permissions:
  contents: write

jobs:
  qualify-and-publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      TARGET_BRANCH: codex/hepta-intelligence-legacy-governance-v1-20260829
      EXPECTED_TARGET: be80b97a06dbbe60237f65e3b79c8aae0fff010a
      PAYLOAD_SHA256: bd21ef335c14fa2c78f6a2bb87b4c39d1a8937361c62ca80a92b5907a43617cd
    steps:
      - name: Checkout exact P0.3.4 target
        uses: actions/checkout@v4
        with:
          ref: codex/hepta-intelligence-legacy-governance-v1-20260829
          fetch-depth: 0

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Decode and apply exact payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
          mkdir -p /tmp/p034-payload
          cat > /tmp/p034-payload.b64 <<'EOF'
[... ELLIPSIZATION ...]
EOF
          base64 -d /tmp/p034-payload.b64 > /tmp/p034-payload.tar.gz
          echo "$PAYLOAD_SHA256  /tmp/p034-payload.tar.gz" | sha256sum -c -
          tar -C /tmp/p034-payload -xzf /tmp/p034-payload.tar.gz
          python3 /tmp/p034-payload/p034_apply_patch.py

      - name: Format exact governed Rust files
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          rustfmt --edition 2024 \
            hepta-memory/src/fact_grounding/legacy_governance.rs \
            hepta-memory/src/fact_grounding/durable/backfill.rs \
            hepta-memory/src/fact_grounding/durable.rs \
            hepta-memory/src/framing.rs \
            hepta-memory/src/lib.rs

      - name: Execute P0.3.4 source and Rust gates
        shell: bash
        run: |
          set +e
          python3 scripts/run-hepta-intelligence-legacy-grounding-governance-v1.py
          RUNNER=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('artifacts/hepta-intelligence-legacy-grounding-governance-v1/qualification-receipt.json').read_text())
          failed=[c['id'] for c in receipt['checks'] if not c['passed']]
          if failed:
              raise SystemExit(f'P0.3.4 source candidate gates failed: {failed}')
          assert receipt['source_receipt']['status']=='PASS_P0_3_4_LEGACY_GOVERNANCE_SOURCE_ONLY'
          for key in ('wired','production_projection_gate','production_authority','external_effects','operator_accepted','promoted','callers_ratchet'):
              assert receipt[key] is False, key
          PY
          exit $RUNNER

      - name: Upload P0.3.4 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p034-development-${{ github.sha }}
          path: artifacts/hepta-intelligence-legacy-grounding-governance-v1
          if-no-files-found: warn
          retention-days: 21

      - name: Publish source candidate only when every Rust gate is green
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "Qian QI"
          git config user.email "102159240+ProfAlexQI@users.noreply.github.com"
          git add -A
          git commit --no-gpg-sign -m "feat(memory): add legacy grounding governance P0.3.4"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_TARGET}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
