name: p034-payload-inspect-macos-v2

on:
  push:
    branches:
      - codex/p034-payload-helper-arm-v1-20260829
    paths:
      - .github/workflows/p034-payload-helper-arm-v1.yml
      - ci/p034-payload/part-00.b64

permissions:
  contents: read

concurrency:
  group: p034-payload-inspect-macos-v2
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PAYLOAD_SHA256: bd21ef335c14fa2c78f6a2bb87b4c39d1a8937361c62ca80a92b5907a43617cd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Decode, verify, and safely extract payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          out = root / "artifacts/p034-payload"
          tree = out / "tree"
          out.mkdir(parents=True, exist_ok=True)
          tree.mkdir(parents=True, exist_ok=True)

          encoded = (root / "ci/p034-payload/part-00.b64").read_text(
              encoding="ascii"
          )
          payload = base64.b64decode("".join(encoded.split()), validate=True)
          actual = hashlib.sha256(payload).hexdigest()
          expected = os.environ["PAYLOAD_SHA256"]
          if actual != expected:
              raise SystemExit(
                  f"P0.3.4 payload digest mismatch: expected {expected}, got {actual}"
              )

          archive = out / "payload.tar.gz"
          archive.write_bytes(payload)
          members = []
          with tarfile.open(archive, mode="r:gz") as tar:
              for member in tar.getmembers():
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or member.issym()
                      or member.islnk()
                      or member.isdev()
                  ):
                      raise SystemExit(f"unsafe P0.3.4 payload entry: {member.name}")
                  members.append(
                      {
                          "name": member.name,
                          "size": member.size,
                          "type": member.type.decode("latin1")
                          if isinstance(member.type, bytes)
                          else str(member.type),
                      }
                  )
              tar.extractall(tree)

          files = []
          for path in sorted(tree.rglob("*")):
              if path.is_file():
                  data = path.read_bytes()
                  files.append(
                      {
                          "path": path.relative_to(tree).as_posix(),
                          "bytes": len(data),
                          "sha256": hashlib.sha256(data).hexdigest(),
                      }
                  )
          receipt = {
              "schema": "hepta_intelligence_p0_3_4_payload_inspection_v2",
              "payload_sha256": actual,
              "member_count": len(members),
              "file_count": len(files),
              "members": members,
              "files": files,
              "target_branch_written": False,
              "wired": False,
              "production_projection_gate": False,
              "production_authority": False,
              "external_effects": False,
          }
          (out / "inspection-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (out / "file-list.txt").write_text(
              "\n".join(item["path"] for item in files) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload exact P0.3.4 payload evidence
        uses: actions/upload-artifact@v4
        with:
          name: hepta-p0-3-4-payload-${{ github.sha }}
          path: artifacts/p034-payload
          if-no-files-found: error
          retention-days: 7
