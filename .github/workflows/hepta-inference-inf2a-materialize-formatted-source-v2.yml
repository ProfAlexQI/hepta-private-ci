name: Hepta inference INF-2A materialize qualified source blobs v2

on:
  push:
    branches:
      - codex/hepta-inference-inf2a-adapter-contract-20260829
    paths:
      - ".github/workflows/hepta-inference-inf2a-materialize-formatted-source-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    name: Commit only qualified adapter source and lockfile v2
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BRANCH: codex/hepta-inference-inf2a-adapter-contract-20260829
      EXPECTED_PARENT: a173caec113bf5e711ab0795da81b7edb85bdb67
      SELF: .github/workflows/hepta-inference-inf2a-materialize-formatted-source-v2.yml
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify exact one-file trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = "$SELF"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy
      - name: Reproduce exact qualified source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-inference-inf2a-adapter-contract-repair.py
          cargo fmt --manifest-path codex-rs/hepta-infer-adapter/Cargo.toml
          cargo generate-lockfile --manifest-path codex-rs/hepta-infer-adapter/Cargo.toml
          python3 scripts/hepta-inference-inf2a-adapter-contract-source-gate.py
          cargo fmt --manifest-path codex-rs/hepta-infer-adapter/Cargo.toml -- --check
          cargo test --manifest-path codex-rs/hepta-infer-adapter/Cargo.toml --locked
          cargo clippy --manifest-path codex-rs/hepta-infer-adapter/Cargo.toml \
            --all-targets --locked -- -D warnings
      - name: Stage only bounded source payload
        shell: bash
        run: |
          set -euo pipefail
          git add codex-rs/hepta-infer-adapter/Cargo.lock codex-rs/hepta-infer-adapter/src/lib.rs
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' codex-rs/hepta-infer-adapter/Cargo.lock codex-rs/hepta-infer-adapter/src/lib.rs | sort)"
          test "$staged" = "$expected"
          test -z "$(git diff --name-only)"
          git diff --cached --check
      - name: Commit qualified source blobs and fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(inference): materialize qualified INF-2A adapter source"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          git fetch --no-tags origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:"$BRANCH"
      - name: Record materialized blobs
        shell: bash
        run: |
          {
            echo "source_commit=$SOURCE_COMMIT"
            echo "source_tree=$SOURCE_TREE"
            echo "source_gate=PASS"
            echo "cargo_test=PASS_6"
            echo "strict_clippy=PASS"
            echo "product_wiring=false"
            echo "production_qualified=false"
          } >> "$GITHUB_STEP_SUMMARY"
