name: Hepta source export

on:
  push:
    branches:
      - codex/hepta-architecture-convergence-p0-2-20260828
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export exact source tree
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and archive source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          printf '%s\n' "$GITHUB_SHA" > SOURCE_HEAD
          printf '%s\n' "$(git rev-parse 'HEAD^{tree}')" > SOURCE_TREE
          tar --exclude=.git --exclude=hepta-source.tar.gz -czf hepta-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-source-${{ github.sha }}
          path: hepta-source.tar.gz
          if-no-files-found: error
          retention-days: 1
