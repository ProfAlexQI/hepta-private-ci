name: Hepta close superseded candidates

on:
  push:
    branches:
      - codex/hepta-remediated-observer-final-20260902

permissions:
  contents: read
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Close exact superseded head branches without merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          superseded='[
            "codex/hepta-v8-final-gap-closure-20260902",
            "codex/hepta-v8-final-gap-closure-output-20260902",
            "codex/hepta-v8-repository-closure-final-20260902"
          ]'
          gh api --paginate "/repos/${REPOSITORY}/pulls?state=open&per_page=100" \
            --jq ".[] | select(.head.ref as \$ref | ${superseded} | index(\$ref)) | .number" \
            | while read -r number; do
                [[ -n "$number" ]] || continue
                gh api --method PATCH "/repos/${REPOSITORY}/pulls/${number}" -f state=closed >/dev/null
              done
