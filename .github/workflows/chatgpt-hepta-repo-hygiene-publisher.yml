name: ChatGPT Hepta repository hygiene publisher

on:
  push:
    branches:
      - "automation/chatgpt-hepta-repo-hygiene-publisher-20260830-0122"

permissions:
  contents: write

concurrency:
  group: chatgpt-hepta-repo-hygiene-publisher-20260830-0122
  cancel-in-progress: false

env:
  Q0_HEAD: c768bcbeb4c1168088d2499828c24da521a2a73a
  REPAIR_BRANCH: repair/hepta-a0-repository-hygiene-20260830-0122

jobs:
  publish:
    name: Format Q0 sources and repair cargo-deny invocation
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout exact Q0 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.Q0_HEAD }}
          fetch-depth: 1
          persist-credentials: true

      - name: Install locked uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply deterministic formatting and cargo-deny repair
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --project scripts ruff format scripts
          cargo fmt --manifest-path codex-rs/Cargo.toml -- --config imports_granularity=Item
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/cargo-deny.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml
'''
          new = '''          rust-version: 1.95.0
          manifest-path: ./codex-rs/Cargo.toml
          # Docker actions do not inherit defaults.run.working-directory. Keep
          # global flags before `check`, but pass `--config` as a command flag;
          # cargo-deny 0.19 rejects `--config` in the global argument position.
          arguments: --all-features
          command-arguments: --config ./codex-rs/deny.toml
'''
          if old not in text:
              if 'command-arguments: --config ./codex-rs/deny.toml' not in text:
                  raise SystemExit('cargo-deny insertion point missing')
          else:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify repair output
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --project scripts ruff format --check scripts
          cargo fmt --manifest-path codex-rs/Cargo.toml -- --config imports_granularity=Item --check
          grep -F 'command-arguments: --config ./codex-rs/deny.toml' .github/workflows/cargo-deny.yml
          git diff --check
          git status --short

      - name: Publish immutable repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Hepta repository hygiene publisher'
          git config user.email 'hepta-hygiene-publisher@users.noreply.github.com'
          git switch -c "$REPAIR_BRANCH"
          git add .github/workflows/cargo-deny.yml scripts codex-rs
          if git diff --cached --quiet; then
            echo 'No repository hygiene changes required.'
            exit 0
          fi
          git commit -m 'chore(ci): normalize Hepta formatting and cargo-deny config'
          git push --force-with-lease origin "HEAD:refs/heads/$REPAIR_BRANCH"
