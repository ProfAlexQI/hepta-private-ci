name: Hepta architecture H7 expiry remediation

on:
  push:
    branches:
      - codex/hepta-architecture-convergence-p0-2-20260828

permissions:
  contents: write

concurrency:
  group: hepta-architecture-h7-expiry-remediation
  cancel-in-progress: true

jobs:
  remediate-h7-expiry-test:
    name: Stabilize exact H7 expiry qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      EXPECTED_PARENT: 81a7de21c92fd7607c31b95dcf24cade84a6bdf9
      EXPECTED_BRANCH: codex/hepta-architecture-convergence-p0-2-20260828
      WORKFLOW_PATH: .github/workflows/hepta-architecture-h7-expiry-remediation.yml
      TARGET_PATH: codex-rs/hepta-memory/src/h7_trajectory_store_tests.rs
    steps:
      - name: Checkout exact remediation trigger
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify immutable remediation boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          mapfile -t trigger_paths < <(git diff --name-only "$EXPECTED_PARENT" HEAD | sort)
          test "${#trigger_paths[@]}" -eq 1
          test "${trigger_paths[0]}" = "$WORKFLOW_PATH"
          git diff --exit-code
          git diff --cached --exit-code

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Apply exact test-only remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-memory/src/h7_trajectory_store_tests.rs")
          source = path.read_text(encoding="utf-8")

          digest_old = r'''fn digest(label: &str) -> Sha256Digest {
              Sha256Digest::for_bytes(label.as_bytes())
          }

          fn compact_checkpoint'''
          digest_new = r'''fn digest(label: &str) -> Sha256Digest {
              Sha256Digest::for_bytes(label.as_bytes())
          }

          fn unix_seconds_now() -> u64 {
              SystemTime::now()
                  .duration_since(UNIX_EPOCH)
                  .expect("clock")
                  .as_secs()
          }

          async fn wait_until_after_unix_second(unix_second: u64) {
              while unix_seconds_now() <= unix_second {
                  tokio::time::sleep(Duration::from_millis(100)).await;
              }
          }

          fn compact_checkpoint'''
          if source.count(digest_old) != 1:
              raise SystemExit("unexpected digest helper source shape")
          source = source.replace(digest_old, digest_new, 1)

          expiry_old = r'''    let expires_at = SystemTime::now()
                  .duration_since(UNIX_EPOCH)
                  .expect("clock")
                  .as_secs()
                  + ttl_seconds;'''
          expiry_new = r'''    let expires_at = unix_seconds_now()
                  .checked_add(ttl_seconds)
                  .and_then(|expiry| expiry.checked_add(1))
                  .expect("lease expiry overflow");'''
          if source.count(expiry_old) != 1:
              raise SystemExit("unexpected expiring lease source shape")
          source = source.replace(expiry_old, expiry_new, 1)

          if source.count("prepared_with_ttl(1).await;") != 2:
              raise SystemExit("unexpected one-second TTL fixture count")
          source = source.replace("prepared_with_ttl(1).await;", "prepared_with_ttl(10).await;")

          recovery_sleep_old = r'''    let before = lease.snapshot_counts().await.expect("counts before expiry");
              tokio::time::sleep(Duration::from_secs(2)).await;
          '''
          recovery_sleep_new = r'''    let before = lease.snapshot_counts().await.expect("counts before expiry");
              let expiry = lease
                  .binding()
                  .expect("binding")
                  .lease_expires_at_unix_seconds;
              wait_until_after_unix_second(expiry).await;
          '''
          if source.count(recovery_sleep_old) != 1:
              raise SystemExit("unexpected recovery expiry wait source shape")
          source = source.replace(recovery_sleep_old, recovery_sleep_new, 1)

          reopen_sleep_old = r'''    drop(executor);
              drop(lease);
              drop(store);
              tokio::time::sleep(Duration::from_secs(2)).await;
          '''
          reopen_sleep_new = r'''    drop(executor);
              drop(lease);
              drop(store);
              wait_until_after_unix_second(expiry).await;
          '''
          if source.count(reopen_sleep_old) != 1:
              raise SystemExit("unexpected reopen expiry wait source shape")
          source = source.replace(reopen_sleep_old, reopen_sleep_new, 1)

          path.write_text(source, encoding="utf-8")
          PY
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$TARGET_PATH"

      - name: Format and verify H7 expiry qualification
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -p codex-hepta-memory
          git diff --check
          cargo fmt -p codex-hepta-memory -- --check
          cargo test --locked -p codex-hepta-memory \
            h7_trajectory_store_tests::recovery_read_observes_expired_terminal_without_appending_h7_rows \
            -- --exact --nocapture
          cargo test --locked -p codex-hepta-memory \
            h7_trajectory_store_tests::head_scoped_expired_terminal_gate_survives_store_reopen \
            -- --exact --nocapture
          cargo check --locked -p codex-hepta-memory

      - name: Commit verified test-only remediation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git status --short | sed 's/^...//' | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$TARGET_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET_PATH"
          git commit -m "test(memory): stabilize H7 lease-expiry qualification"
          git push origin "HEAD:$EXPECTED_BRANCH"
