name: Hepta final default-alias retirement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hepta-branch-consolidation.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hepta-verified-branch-retirement
  cancel-in-progress: true

jobs:
  retire-default-alias:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Freeze the final two byte-identical refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hepta-final-alias"
          mkdir -p "$root"
          git fetch --prune --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t rows < <(git ls-remote --heads origin)
          [[ ${#rows[@]} -eq 2 ]]
          main_sha="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          [[ "$default_branch" != main ]]
          default_sha="$(git ls-remote --heads origin "refs/heads/$default_branch" | awk '{print $1}')"
          [[ -n "$main_sha" && "$default_sha" == "$main_sha" ]]
          git cat-file -e "$main_sha^{commit}"
          git merge-base --is-ancestor "$GITHUB_SHA" "$main_sha"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9967303182" > "$root/external-backup.json"
          jq -e '.expired == false and .digest == "sha256:f93b0efabf9c8db7a50ae8381c2995f9f6ab2f439e7b235bc83ef48541759211"' "$root/external-backup.json" >/dev/null
          jq -n --arg main "$main_sha" --arg default "$default_branch" --arg defaultSha "$default_sha" \
            '{schema:"hepta.final-default-alias-freeze.v1",main:$main,defaultBranch:$default,defaultSha:$defaultSha,branchCount:2,byteIdentical:true,externalRecoveryBundleVerified:true}' \
            > "$root/pre-attempt.json"
          printf 'MAIN_SHA=%s\nDEFAULT_BRANCH=%s\n' "$main_sha" "$default_branch" >> "$GITHUB_ENV"

      - name: Retain the final pre-attempt receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-final-alias-pre-attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-final-alias
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Ask GitHub to delete the byte-identical current default alias
        id: deletion
        shell: bash
        run: |
          set -uo pipefail
          root="$RUNNER_TEMP/hepta-final-alias"
          set +e
          git push --porcelain \
            --force-with-lease="refs/heads/$DEFAULT_BRANCH:$MAIN_SHA" \
            origin ":refs/heads/$DEFAULT_BRANCH" \
            >"$root/delete-default.stdout" 2>"$root/delete-default.stderr"
          rc=$?
          set -e
          status=rejected
          [[ $rc -eq 0 ]] && status=deleted
          jq -n --arg status "$status" --argjson exitCode "$rc" --arg main "$MAIN_SHA" --arg alias "$DEFAULT_BRANCH" \
            '{schema:"hepta.final-default-alias-attempt.v1",status:$status,exitCode:$exitCode,main:$main,alias:$alias}' \
            > "$root/delete-default-result.json"
          printf 'delete_rc=%s\n' "$rc" >> "$GITHUB_OUTPUT"

      - name: Verify single-main result when deletion is accepted
        if: steps.deletion.outputs.delete_rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hepta-final-alias"
          mapfile -t remaining < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}')
          [[ ${#remaining[@]} -eq 1 && "${remaining[0]}" == main ]]
          live_main="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          [[ "$live_main" == "$MAIN_SHA" ]]
          live_default="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          jq -n --arg main "$live_main" --arg default "$live_default" \
            '{singleMainRefVerified:true,main:$main,reportedDefaultBranch:$default,remainingRefs:["main"]}' \
            > "$root/final-receipt.json"

      - name: Retain the server decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-final-alias-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-final-alias
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Fail truthfully when GitHub protects the current default
        if: steps.deletion.outputs.delete_rc != '0'
        run: |
          cat "$RUNNER_TEMP/hepta-final-alias/delete-default.stderr" >&2
          exit 1
