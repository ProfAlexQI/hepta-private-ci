name: Hepta final single-main consolidation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hepta-branch-consolidation.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hepta-verified-branch-retirement
  cancel-in-progress: true

jobs:
  consolidate-to-single-main:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Freeze live refs and prove every non-main head is retained
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hepta-single-main"
          mkdir -p "$root"
          git fetch --prune --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          main_sha="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          test -n "$main_sha"
          git cat-file -e "$main_sha^{commit}"
          git merge-base --is-ancestor "$GITHUB_SHA" "$main_sha"
          default_before="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          export MAIN_SHA="$main_sha" DEFAULT_BEFORE="$default_before" OUT="$root/refs.json"
          python3 - <<'PY'
          import json, os, subprocess
          main = os.environ['MAIN_SHA']
          raw = subprocess.check_output(['git','ls-remote','--heads','origin'], text=True)
          rows = []
          for line in raw.splitlines():
              sha, ref = line.split('\t', 1)
              name = ref.removeprefix('refs/heads/')
              retained = subprocess.run(['git','merge-base','--is-ancestor',sha,main]).returncode == 0
              if name != 'main' and not retained:
                  raise SystemExit(f'unretained live branch: {name} {sha}')
              rows.append({'name': name, 'sha': sha, 'retainedByMain': retained})
          if not rows or sum(r['name']=='main' for r in rows) != 1:
              raise SystemExit('main ref inventory mismatch')
          payload = {
              'schema':'hepta.single-main-live-ref-freeze.v1',
              'repository':os.environ['GITHUB_REPOSITORY'],
              'workflowHead':os.environ['GITHUB_SHA'],
              'main':main,
              'defaultBefore':os.environ['DEFAULT_BEFORE'],
              'branchCount':len(rows),
              'allNonMainHeadsRetainedByMain':True,
              'branches':rows,
          }
          with open(os.environ['OUT'],'w') as f:
              json.dump(payload,f,indent=2,sort_keys=True); f.write('\n')
          print(json.dumps({'branchCount':len(rows),'main':main,'defaultBefore':os.environ['DEFAULT_BEFORE']}))
          PY

      - name: Verify retained external recovery bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hepta-single-main"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9967303182" > "$root/external-backup.json"
          jq -e '.expired == false' "$root/external-backup.json" >/dev/null
          jq -e '.digest == "sha256:f93b0efabf9c8db7a50ae8381c2995f9f6ab2f439e7b235bc83ef48541759211"' "$root/external-backup.json" >/dev/null

      - name: Retain frozen refs before mutation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-pre-delete-ref-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-single-main
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Make main the live default, with reversible rename fallback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hepta-single-main"
          default_before="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          main_sha="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          test -n "$main_sha"
          method=already_main

          if [[ "$default_before" != main ]]; then
            default_sha="$(git ls-remote --heads origin "refs/heads/$default_before" | awk '{print $1}')"
            [[ -n "$default_sha" && "$default_sha" == "$main_sha" ]]
            if gh api --method PATCH "repos/$GITHUB_REPOSITORY" -f default_branch=main >"$root/default-api.json" 2>"$root/default-api.err"; then
              method=repository_patch
            else
              git push --porcelain --force-with-lease="refs/heads/main:$main_sha" origin :refs/heads/main
              encoded_default="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1],safe=""))' "$default_before")"
              set +e
              gh api --method POST "repos/$GITHUB_REPOSITORY/branches/$encoded_default/rename" -f new_name=main >"$root/default-api.json" 2>>"$root/default-api.err"
              rename_rc=$?
              set -e
              if [[ $rename_rc -ne 0 ]]; then
                git push --porcelain origin "$main_sha:refs/heads/main"
                echo 'Default-branch change was refused; main restored and deletion aborted.' >&2
                exit 1
              fi
              method=default_branch_rename
            fi
          fi

          for _ in $(seq 1 40); do
            live_default="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
            live_main="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
            if [[ "$live_default" == main && "$live_main" == "$main_sha" ]]; then
              jq -n --arg method "$method" --arg prior "$default_before" --arg default "$live_default" --arg sha "$live_main" \
                '{method:$method,priorDefault:$prior,defaultBranch:$default,main:$sha}' > "$root/default-result.json"
              exit 0
            fi
            sleep 3
          done
          echo 'GitHub did not converge to default=main at the reviewed commit.' >&2
          exit 1

      - name: Delete every non-main ref with exact leases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hepta-single-main"
          [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)" == main ]]
          git fetch --prune --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          main_sha="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          test -n "$main_sha"
          git cat-file -e "$main_sha^{commit}"
          git merge-base --is-ancestor "$GITHUB_SHA" "$main_sha"

          leases=()
          deletes=()
          while IFS=$'\t' read -r sha ref; do
            name="${ref#refs/heads/}"
            [[ "$name" == main ]] && continue
            git cat-file -e "$sha^{commit}"
            git merge-base --is-ancestor "$sha" "$main_sha"
            leases+=("--force-with-lease=refs/heads/$name:$sha")
            deletes+=(":refs/heads/$name")
          done < <(git ls-remote --heads origin)

          if ((${#deletes[@]})); then
            git push --atomic --porcelain "${leases[@]}" origin "${deletes[@]}"
          fi

          remaining=()
          while IFS= read -r name; do
            [[ -n "$name" ]] && remaining+=("$name")
          done < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}')
          [[ ${#remaining[@]} -eq 1 && "${remaining[0]}" == main ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)" == main ]]
          jq -n --arg main "$main_sha" --argjson deleted "${#deletes[@]}" \
            '{singleMainRefVerified:true,main:$main,defaultBranch:"main",deletedBranchCount:$deleted}' \
            > "$root/final-receipt.json"

      - name: Retain final receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-single-main-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-single-main
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
