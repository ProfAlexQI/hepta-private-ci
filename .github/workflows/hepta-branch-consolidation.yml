name: Hepta retire all non-default duplicate branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hepta-branch-consolidation.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hepta-verified-branch-retirement
  cancel-in-progress: true

jobs:
  retire-duplicate-branches:
    if: github.repository == 'TrillionniumFoundation/hepta-private-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Freeze and verify all live refs
        id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hepta-branch-retirement"
          mkdir -p "$root"
          git fetch --prune --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          main_sha="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          default_sha="$(git ls-remote --heads origin "refs/heads/$default_branch" | awk '{print $1}')"
          test -n "$main_sha"
          test -n "$default_sha"
          [[ "$default_sha" == "$main_sha" ]]
          git cat-file -e "$main_sha^{commit}"
          git merge-base --is-ancestor "$GITHUB_SHA" "$main_sha"
          export MAIN_SHA="$main_sha" DEFAULT_BRANCH="$default_branch" OUT="$root/frozen-refs.json"
          python3 - <<'PY'
          import json, os, subprocess
          main = os.environ['MAIN_SHA']
          default = os.environ['DEFAULT_BRANCH']
          rows = []
          raw = subprocess.check_output(['git','ls-remote','--heads','origin'], text=True)
          for line in raw.splitlines():
              sha, ref = line.split('\t', 1)
              name = ref.removeprefix('refs/heads/')
              retained = subprocess.run(['git','merge-base','--is-ancestor',sha,main]).returncode == 0
              if name != 'main' and not retained:
                  raise SystemExit(f'unretained live branch: {name} {sha}')
              rows.append({'name':name,'sha':sha,'retainedByMain':retained,'protectedFromThisPass':name in {'main',default}})
          if sum(row['name']=='main' for row in rows) != 1 or sum(row['name']==default for row in rows) != 1:
              raise SystemExit('main/default inventory mismatch')
          payload={
              'schema':'hepta.duplicate-branch-retirement-freeze.v1',
              'repository':os.environ['GITHUB_REPOSITORY'],
              'workflowHead':os.environ['GITHUB_SHA'],
              'main':main,
              'defaultBranch':default,
              'branchCount':len(rows),
              'allNonMainHeadsRetainedByMain':True,
              'branches':rows,
          }
          with open(os.environ['OUT'],'w') as f:
              json.dump(payload,f,indent=2,sort_keys=True); f.write('\n')
          print(json.dumps({'branchCount':len(rows),'main':main,'defaultBranch':default}))
          PY
          printf 'main_sha=%s\n' "$main_sha" >> "$GITHUB_OUTPUT"
          printf 'default_branch=%s\n' "$default_branch" >> "$GITHUB_OUTPUT"

      - name: Verify retained external all-branch recovery bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hepta-branch-retirement"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9967303182" > "$root/external-backup.json"
          jq -e '.expired == false' "$root/external-backup.json" >/dev/null
          jq -e '.digest == "sha256:f93b0efabf9c8db7a50ae8381c2995f9f6ab2f439e7b235bc83ef48541759211"' "$root/external-backup.json" >/dev/null

      - name: Retain exact pre-delete ref inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-pre-delete-duplicate-refs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-branch-retirement
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Delete all refs except main and the live default
        env:
          MAIN_SHA: ${{ steps.freeze.outputs.main_sha }}
          DEFAULT_BRANCH: ${{ steps.freeze.outputs.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hepta-branch-retirement"
          git fetch --prune --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          live_main="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          [[ "$live_main" == "$MAIN_SHA" ]]

          leases=()
          deletes=()
          deleted_names=()
          while IFS=$'\t' read -r sha ref; do
            name="${ref#refs/heads/}"
            [[ "$name" == main || "$name" == "$DEFAULT_BRANCH" ]] && continue
            git cat-file -e "$sha^{commit}"
            git merge-base --is-ancestor "$sha" "$MAIN_SHA"
            leases+=("--force-with-lease=refs/heads/$name:$sha")
            deletes+=(":refs/heads/$name")
            deleted_names+=("$name")
          done < <(git ls-remote --heads origin)

          if ((${#deletes[@]})); then
            git push --atomic --porcelain "${leases[@]}" origin "${deletes[@]}" | tee "$root/delete-output.txt"
          fi
          printf '%s\n' "${deleted_names[@]}" > "$root/deleted-branches.txt"

          mapfile -t remaining < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort)
          mapfile -t expected < <(printf '%s\n' main "$DEFAULT_BRANCH" | sort -u)
          [[ ${#remaining[@]} -eq ${#expected[@]} ]]
          [[ "${remaining[*]}" == "${expected[*]}" ]]
          remaining_main="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          remaining_default="$(git ls-remote --heads origin "refs/heads/$DEFAULT_BRANCH" | awk '{print $1}')"
          [[ "$remaining_main" == "$MAIN_SHA" && "$remaining_default" == "$MAIN_SHA" ]]

          jq -n \
            --arg main "$MAIN_SHA" \
            --arg default "$DEFAULT_BRANCH" \
            --argjson deleted "${#deleted_names[@]}" \
            --argjson remaining "${#remaining[@]}" \
            '{singleWorkingTreeVerified:true,main:$main,defaultBranch:$default,deletedBranchCount:$deleted,remainingBranchCount:$remaining,remainingRefs:["main",$default],defaultBranchAdministrativeRenameStillRequired:($default != "main")}' \
            > "$root/final-receipt.json"

      - name: Retain final deletion receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-duplicate-ref-retirement-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hepta-branch-retirement
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
