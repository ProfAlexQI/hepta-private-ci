name: Hepta Intelligence Q0.1 cargo-deny Windows evidence

on:
  push:
    branches:
      - "automation/hepta-q0-1-cargo-deny-evidence-windows-20260830-r1"

permissions:
  contents: read

concurrency:
  group: hepta-q0-1-cargo-deny-evidence-windows-20260830-r1
  cancel-in-progress: true

env:
  REPOSITORY: ProfHepta/hepta-private-ci
  BASE_SHA: c768bcbeb4c1168088d2499828c24da521a2a73a
  HEAD_SHA: 99b2b44c00bf7b50b588fffddc299bf55fac698a
  HEAD_TREE: 381ed770be51883db94b717e21a96277de726238
  MERGE_SHA: 06661355415a257f19dcae1d23c3914a850eb2c2
  MERGE_TREE: 381ed770be51883db94b717e21a96277de726238
  CARGO_DENY_VERSION: "0.19.0"
  CARGO_DENY_ARCHIVE_SHA256: 413f0e2ce780d0d14ba8e9339f9fb033419a8a971ec7714faec518e4a664bdb0
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always

jobs:
  exact-pair:
    name: Q0.1 exact-head and synthetic-merge cargo-deny (Windows)
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - name: Checkout exact Q0.1 head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 3
          persist-credentials: false

      - name: Install Rust 1.95 and verified cargo-deny 0.19.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          $rustVersion = ((rustc -V) -split ' ')[1]
          if ($rustVersion -ne '1.95.0') { throw "unexpected rustc: $rustVersion" }

          $archive = Join-Path $env:RUNNER_TEMP 'cargo-deny.tar.gz'
          $installDir = Join-Path $env:RUNNER_TEMP 'cargo-deny-bin'
          $url = "https://github.com/EmbarkStudios/cargo-deny/releases/download/$env:CARGO_DENY_VERSION/cargo-deny-$env:CARGO_DENY_VERSION-x86_64-pc-windows-msvc.tar.gz"
          curl.exe --fail --location --silent --show-error $url --output $archive
          if ($LASTEXITCODE -ne 0) { throw 'cargo-deny download failed' }
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:CARGO_DENY_ARCHIVE_SHA256) {
            throw "cargo-deny digest mismatch: $actual"
          }
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          tar -xzf $archive -C $installDir --strip-components=1
          if ($LASTEXITCODE -ne 0) { throw 'cargo-deny extraction failed' }
          $env:PATH = "$installDir;$env:PATH"
          $installDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $versionOutput = (& cargo-deny --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $versionOutput -notmatch '^cargo-deny 0\.19\.0') {
            throw "unexpected cargo-deny version: $versionOutput"
          }

      - name: Verify and qualify exact Q0.1 head
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne $env:REPOSITORY) { throw 'repository mismatch' }
          if ((git rev-parse HEAD).Trim() -ne $env:HEAD_SHA) { throw 'head mismatch' }
          if ((git rev-parse 'HEAD^{tree}').Trim() -ne $env:HEAD_TREE) { throw 'head tree mismatch' }
          if ((git rev-parse 'HEAD^').Trim() -ne $env:BASE_SHA) { throw 'base mismatch' }
          if ((git rev-list --count "$env:BASE_SHA..HEAD").Trim() -ne '1') { throw 'head is not one commit above base' }
          $changed = @(git diff --name-only HEAD^ HEAD)
          if ($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/cargo-deny.yml') {
            throw "unexpected changed paths: $($changed -join ',')"
          }
          $workflow = Get-Content -Raw '.github/workflows/cargo-deny.yml'
          if (-not $workflow.Contains('arguments: --all-features')) { throw 'missing arguments binding' }
          if (-not $workflow.Contains('command-arguments: --config ./codex-rs/deny.toml')) { throw 'missing policy binding' }
          git diff --check HEAD^ HEAD
          if ($LASTEXITCODE -ne 0) { throw 'diff check failed' }

          & cargo-deny --log-level warn `
            --manifest-path ./codex-rs/Cargo.toml `
            --all-features `
            check `
            --config ./codex-rs/deny.toml
          if ($LASTEXITCODE -ne 0) { throw 'exact-head cargo-deny failed' }
          $dirty = @(git status --porcelain --untracked-files=no)
          if ($dirty.Count -gt 0) { throw "tracked worktree dirty: $($dirty -join ',')" }

      - name: Fetch exact synthetic merge candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --no-tags --depth=3 origin $env:MERGE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'merge fetch failed' }
          git checkout --detach $env:MERGE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'merge checkout failed' }

      - name: Verify and qualify exact Q0.1 synthetic merge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:MERGE_SHA) { throw 'merge mismatch' }
          if ((git rev-parse 'HEAD^{tree}').Trim() -ne $env:MERGE_TREE) { throw 'merge tree mismatch' }
          if ((git rev-parse 'HEAD^1').Trim() -ne $env:BASE_SHA) { throw 'merge parent 1 mismatch' }
          if ((git rev-parse 'HEAD^2').Trim() -ne $env:HEAD_SHA) { throw 'merge parent 2 mismatch' }
          $parents = ((git rev-list --parents -n 1 HEAD).Trim() -split '\s+')
          if ($parents.Count -ne 3) { throw 'candidate is not a two-parent merge' }
          $workflow = Get-Content -Raw '.github/workflows/cargo-deny.yml'
          if (-not $workflow.Contains('arguments: --all-features')) { throw 'missing arguments binding' }
          if (-not $workflow.Contains('command-arguments: --config ./codex-rs/deny.toml')) { throw 'missing policy binding' }
          git diff --check $env:BASE_SHA $env:HEAD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'diff check failed' }

          & cargo-deny --log-level warn `
            --manifest-path ./codex-rs/Cargo.toml `
            --all-features `
            check `
            --config ./codex-rs/deny.toml
          if ($LASTEXITCODE -ne 0) { throw 'synthetic-merge cargo-deny failed' }
          $dirty = @(git status --porcelain --untracked-files=no)
          if ($dirty.Count -gt 0) { throw "tracked worktree dirty: $($dirty -join ',')" }

      - name: Emit immutable Q0.1 pair receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receiptDir = Join-Path $env:RUNNER_TEMP 'hepta-q0-1-cargo-deny-evidence'
          New-Item -ItemType Directory -Force -Path $receiptDir | Out-Null
          $env:RECEIPT_PATH = Join-Path $receiptDir 'receipt.json'
          @'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/cargo-deny.yml')
          policy = Path('codex-rs/deny.toml')
          receipt = {
              'schema': 'hepta_intelligence_q0_1_cargo_deny_pair_v2',
              'status': 'PASS_HEPTA_INTELLIGENCE_Q0_1_CARGO_DENY_EXACT_PAIR',
              'repository': os.environ['REPOSITORY'],
              'base': os.environ['BASE_SHA'],
              'head': os.environ['HEAD_SHA'],
              'head_tree': os.environ['HEAD_TREE'],
              'synthetic_merge': os.environ['MERGE_SHA'],
              'synthetic_merge_tree': os.environ['MERGE_TREE'],
              'observed_checkout': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'cargo_deny_action_commit': '82eb9f621fbc699dd0918f3ea06864c14cc84246',
              'cargo_deny_version': os.environ['CARGO_DENY_VERSION'],
              'cargo_deny_archive_sha256': os.environ['CARGO_DENY_ARCHIVE_SHA256'],
              'cargo_deny_workflow_blob': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD:.github/workflows/cargo-deny.yml'],
                  text=True,
              ).strip(),
              'cargo_deny_workflow_sha256': hashlib.sha256(workflow.read_bytes()).hexdigest(),
              'policy_path': str(policy),
              'policy_sha256': hashlib.sha256(policy.read_bytes()).hexdigest(),
              'command': [
                  'cargo-deny', '--log-level', 'warn',
                  '--manifest-path', './codex-rs/Cargo.toml',
                  '--all-features', 'check',
                  '--config', './codex-rs/deny.toml',
              ],
              'runner_os': os.environ['RUNNER_OS'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow_job': os.environ['GITHUB_JOB'],
              'source_writeback': False,
              'runtime_authority': False,
              'production_authority': False,
              'selected': False,
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()
          receipt['receipt_binding_sha256'] = hashlib.sha256(canonical).hexdigest()
          Path(os.environ['RECEIPT_PATH']).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'receipt generation failed' }
          Get-Content -Raw $env:RECEIPT_PATH | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload immutable Q0.1 pair receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-q0-1-cargo-deny-pair-windows-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/hepta-q0-1-cargo-deny-evidence/receipt.json
          if-no-files-found: error
          retention-days: 30
