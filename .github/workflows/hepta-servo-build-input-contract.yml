name: hepta-servo build input contract

on:
  workflow_call:
  pull_request:
    paths:
      - "scripts/hepta-servo-build-input-seal.py"
      - "scripts/verify-hepta-servo-build-input-contract.py"
      - "scripts/verify-hepta-servo-build-input-contract-v2.py"
      - "scripts/tests/test_hepta_servo_build_input_seal.py"
      - "docs/hepta-vnext/browser/C1_BUILD_INPUT_CONTRACT.md"
      - "docs/hepta-vnext/browser/C1_004B_PROGRESS.json"
      - "docs/hepta-vnext/browser/hepta.servo.worker_build_recipe.v1.schema.json"
      - "docs/hepta-vnext/browser/hepta.servo.build_input_manifest.v1.schema.json"
      - ".github/workflows/hepta-servo-build-input-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Build-input sealing contract (no build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize negative-authority posture
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/hepta-servo-build-input-contract"
          mkdir -p "$evidence_dir"
          {
            echo "hepta_commit=$(git rev-parse HEAD)"
            echo "hepta_tree=$(git rev-parse 'HEAD^{tree}')"
            echo "external_network=false"
            echo "actual_source_receipt=false"
            echo "actual_build_recipe=false"
            echo "build_run=false"
            echo "artifact_created=false"
            echo "sbom_created=false"
            echo "servo_runtime_qualified=false"
            echo "production_caller=false"
            echo "production_writer=false"
            echo "effect_authority=false"
            echo "operator_acceptance=false"
            echo "promotion=false"
            echo "release_qualified=false"
          } > "$evidence_dir/posture.txt"

      - name: Compile build-input tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/hepta-servo-build-input-seal.py \
            scripts/verify-hepta-servo-build-input-contract.py \
            scripts/verify-hepta-servo-build-input-contract-v2.py \
            scripts/tests/test_hepta_servo_build_input_seal.py

      - name: Run isolated build-input fixture tests
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/hepta-servo-build-input-contract"
          python3 scripts/tests/test_hepta_servo_build_input_seal.py 2>&1 | tee "$evidence_dir/unit-tests.log"
          echo "unit_tests=passed" >> "$evidence_dir/posture.txt"

      - name: Verify repository-native build-input contract
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/hepta-servo-build-input-contract"
          python3 scripts/verify-hepta-servo-build-input-contract-v2.py 2>&1 | tee "$evidence_dir/static-contract.log"
          echo "static_contract=passed" >> "$evidence_dir/posture.txt"

      - name: Record result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/hepta-servo-build-input-contract"
          echo "job_status=${{ job.status }}" >> "$evidence_dir/posture.txt"
          {
            echo "### Servo build-input sealing contract"
            echo
            echo "This job validates only schemas, canonicalization, rejections and fixture receipts."
            echo "It does not accept a real recipe, invoke Cargo, or create a Servo artifact."
            echo
            sed 's/^/- /' "$evidence_dir/posture.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build-input contract evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-servo-build-input-contract
          path: ${{ runner.temp }}/hepta-servo-build-input-contract
          if-no-files-found: error

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
