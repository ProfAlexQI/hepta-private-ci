name: AuthBus P1.2 one-shot source materialization and qualification

on:
  push:
    branches:
      - integration/vnext-main-full-ci-authbus-p1-2-20260828
    paths:
      - .github/workflows/authbus-p1-2-source-seed.yml
      - scripts/authbus-p1-2-source-seed.part-*.b64

permissions:
  contents: write

env:
  EXPECTED_PARENT: 0be01b7b5063066794731e545cf304e4c07c1fc5
  ARCHIVE_SHA256: 1a5570e79a842c389b9af929926030f5ce9d98b3f46e2f35d7f639d8a1aaa8fc
  MANIFEST: codex-rs/hepta-authbus-p1-2-qualification/Cargo.toml
  PACKAGE: codex-hepta-authbus-p1-2-qualification
  CRATE_ROOT: codex-rs/hepta-authbus-p1-2-qualification
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  materialize-and-qualify:
    name: Materialize exact P1.2 source and pass the complete Rust matrix
    runs-on: ubuntu-slim
    timeout-minutes: 90
    steps:
      - name: Checkout exact seed candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Verify branch, head, and exact P1.1 parent
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "integration/vnext-main-full-ci-authbus-p1-2-20260828"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"

      - name: Verify and materialize the deterministic source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          chunk_paths = [Path(f"scripts/authbus-p1-2-source-seed.part-{index:02d}.b64") for index in range(8)]
          present_chunks = sorted(Path("scripts").glob("authbus-p1-2-source-seed.part-*.b64"))
          if present_chunks != chunk_paths:
              raise SystemExit(f"unexpected source archive chunk set: {present_chunks}")
          encoded = "".join(
              "".join(path.read_text(encoding="ascii").split()) for path in chunk_paths
          )
          archive = base64.b64decode(encoded, validate=True)
          expected_sha256 = "1a5570e79a842c389b9af929926030f5ce9d98b3f46e2f35d7f639d8a1aaa8fc"
          actual_sha256 = hashlib.sha256(archive).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(f"source archive digest mismatch: {actual_sha256}")

          expected = {
              ".github/workflows/authbus-p1-2-qualification.yml",
              "codex-rs/hepta-authbus-p1-2-qualification/Cargo.toml",
              "codex-rs/hepta-authbus-p1-2-qualification/README.md",
              "codex-rs/hepta-authbus-p1-2-qualification/migrations/0001_authbus_p1_2.sql",
              "codex-rs/hepta-authbus-p1-2-qualification/src/lib.rs",
              "codex-rs/hepta-authbus-p1-2-qualification/src/model.rs",
              "codex-rs/hepta-authbus-p1-2-qualification/src/store.rs",
              "codex-rs/hepta-authbus-p1-2-qualification/tests/p1_2.rs",
              "docs/hepta-vnext/authbus/AUTHBUS_P1_2_DEVELOPMENT_PLAN_2026-08-28.md",
              "docs/hepta-vnext/authbus/AUTHBUS_P1_2_IMPLEMENTATION_STATUS_2026-08-28.json",
              "docs/hepta-vnext/authbus/AUTHBUS_P1_2_IMPLEMENTATION_STATUS_2026-08-28.md",
              "scripts/verify-authbus-p1-2.py",
          }
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as bundle:
              members = bundle.getmembers()
              names = {member.name for member in members}
              if names != expected or len(members) != len(expected):
                  raise SystemExit(f"unexpected archive paths: {sorted(names ^ expected)}")
              for member in members:
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or not member.isfile()
                      or member.size > 512_000
                  ):
                      raise SystemExit(f"unsafe archive member: {member.name}")
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit(f"missing archive bytes: {member.name}")
                  destination = Path(member.name)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with destination.open("wb") as output:
                      shutil.copyfileobj(source, output)
                  destination.chmod(member.mode & 0o777)

          Path(".github/workflows/authbus-p1-2-source-seed.yml").unlink()
          for chunk_path in chunk_paths:
              chunk_path.unlink()
          PY
          test ! -e .github/workflows/authbus-p1-2-source-seed.yml
          test -z "$(find scripts -maxdepth 1 -name 'authbus-p1-2-source-seed.part-*.b64' -print -quit)"
          python3 scripts/verify-authbus-p1-2.py | tee /tmp/authbus-p1-2-source-receipt.json
          grep -q 'PASS_AUTHBUS_P1_2_SOURCE_ONLY' /tmp/authbus-p1-2-source-receipt.json
          git diff --check

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Generate the Rust 1.95 lock and format the isolated workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc -V | awk '{print $2}')" = "1.95.0"
          cargo generate-lockfile --manifest-path "${MANIFEST}"
          cargo fmt --manifest-path "${MANIFEST}" --all
          cargo fmt --manifest-path "${MANIFEST}" --all -- --check
          test -s "${CRATE_ROOT}/Cargo.lock"
          cargo metadata --manifest-path "${MANIFEST}" --locked --format-version 1 --no-deps >/dev/null
          python3 scripts/verify-authbus-p1-2.py | tee /tmp/authbus-p1-2-formatted-source-receipt.json
          grep -q 'PASS_AUTHBUS_P1_2_SOURCE_ONLY' /tmp/authbus-p1-2-formatted-source-receipt.json
          git diff --check

      - name: Check default-off authority posture
        shell: bash
        run: cargo test --manifest-path "${MANIFEST}" --locked --no-default-features --lib -- --nocapture

      - name: Run restart, replay, failpoint, GC, and corruption matrix
        shell: bash
        run: cargo test --manifest-path "${MANIFEST}" --locked --features p1-2-qualification --tests -- --nocapture

      - name: Check all targets
        shell: bash
        run: cargo check --manifest-path "${MANIFEST}" --locked --features p1-2-qualification --all-targets

      - name: Run strict Clippy
        shell: bash
        run: cargo clippy --manifest-path "${MANIFEST}" --locked --features p1-2-qualification --all-targets -- -D warnings

      - name: Commit only the fully qualified P1.2 source set
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          final_paths=(
            .github/workflows/authbus-p1-2-qualification.yml
            codex-rs/hepta-authbus-p1-2-qualification/Cargo.toml
            codex-rs/hepta-authbus-p1-2-qualification/Cargo.lock
            codex-rs/hepta-authbus-p1-2-qualification/README.md
            codex-rs/hepta-authbus-p1-2-qualification/migrations/0001_authbus_p1_2.sql
            codex-rs/hepta-authbus-p1-2-qualification/src/lib.rs
            codex-rs/hepta-authbus-p1-2-qualification/src/model.rs
            codex-rs/hepta-authbus-p1-2-qualification/src/store.rs
            codex-rs/hepta-authbus-p1-2-qualification/tests/p1_2.rs
            docs/hepta-vnext/authbus/AUTHBUS_P1_2_DEVELOPMENT_PLAN_2026-08-28.md
            docs/hepta-vnext/authbus/AUTHBUS_P1_2_IMPLEMENTATION_STATUS_2026-08-28.json
            docs/hepta-vnext/authbus/AUTHBUS_P1_2_IMPLEMENTATION_STATUS_2026-08-28.md
            scripts/verify-authbus-p1-2.py
          )
          git add -- "${final_paths[@]}"
          git add -u -- \
            .github/workflows/authbus-p1-2-source-seed.yml \
            scripts/authbus-p1-2-source-seed.part-00.b64 \
            scripts/authbus-p1-2-source-seed.part-01.b64 \
            scripts/authbus-p1-2-source-seed.part-02.b64 \
            scripts/authbus-p1-2-source-seed.part-03.b64 \
            scripts/authbus-p1-2-source-seed.part-04.b64 \
            scripts/authbus-p1-2-source-seed.part-05.b64 \
            scripts/authbus-p1-2-source-seed.part-06.b64 \
            scripts/authbus-p1-2-source-seed.part-07.b64

          cat > /tmp/authbus-p1-2-expected-paths.txt <<'EOF'
          .github/workflows/authbus-p1-2-qualification.yml
          .github/workflows/authbus-p1-2-source-seed.yml
          codex-rs/hepta-authbus-p1-2-qualification/Cargo.lock
          codex-rs/hepta-authbus-p1-2-qualification/Cargo.toml
          codex-rs/hepta-authbus-p1-2-qualification/README.md
          codex-rs/hepta-authbus-p1-2-qualification/migrations/0001_authbus_p1_2.sql
          codex-rs/hepta-authbus-p1-2-qualification/src/lib.rs
          codex-rs/hepta-authbus-p1-2-qualification/src/model.rs
          codex-rs/hepta-authbus-p1-2-qualification/src/store.rs
          codex-rs/hepta-authbus-p1-2-qualification/tests/p1_2.rs
          docs/hepta-vnext/authbus/AUTHBUS_P1_2_DEVELOPMENT_PLAN_2026-08-28.md
          docs/hepta-vnext/authbus/AUTHBUS_P1_2_IMPLEMENTATION_STATUS_2026-08-28.json
          docs/hepta-vnext/authbus/AUTHBUS_P1_2_IMPLEMENTATION_STATUS_2026-08-28.md
          scripts/authbus-p1-2-source-seed.part-00.b64
          scripts/authbus-p1-2-source-seed.part-01.b64
          scripts/authbus-p1-2-source-seed.part-02.b64
          scripts/authbus-p1-2-source-seed.part-03.b64
          scripts/authbus-p1-2-source-seed.part-04.b64
          scripts/authbus-p1-2-source-seed.part-05.b64
          scripts/authbus-p1-2-source-seed.part-06.b64
          scripts/authbus-p1-2-source-seed.part-07.b64
          scripts/verify-authbus-p1-2.py
          EOF
          LC_ALL=C sort -o /tmp/authbus-p1-2-expected-paths.txt /tmp/authbus-p1-2-expected-paths.txt
          git diff --cached --name-only | LC_ALL=C sort > /tmp/authbus-p1-2-actual-paths.txt
          diff -u /tmp/authbus-p1-2-expected-paths.txt /tmp/authbus-p1-2-actual-paths.txt
          git diff --cached --check

          git commit -m "feat(authbus): persist identity and evidence replay state P1.2"
          git push origin "HEAD:${GITHUB_REF_NAME}" \
            --force-with-lease="refs/heads/${GITHUB_REF_NAME}:${GITHUB_SHA}"
