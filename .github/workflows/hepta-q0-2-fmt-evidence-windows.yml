name: Hepta Intelligence Q0.2 exact format Windows evidence

on:
  push:
    branches:
      - "automation/hepta-q0-2-fmt-evidence-windows-20260830-r1"

permissions:
  contents: read

concurrency:
  group: hepta-q0-2-fmt-evidence-windows-20260830-r1
  cancel-in-progress: true

env:
  REPOSITORY: ProfHepta/hepta-private-ci
  BASE_SHA: 99b2b44c00bf7b50b588fffddc299bf55fac698a
  HEAD_SHA: be4e5675bd2f7142cca5a141f3c050547f9a8bd6
  HEAD_TREE: c8c0104acfb69346bb6f8b6c639f6bbb3d94cb9a
  MERGE_SHA: cf0526139d1361e31960fefb09b9f844a8687b89
  MERGE_TREE: c8c0104acfb69346bb6f8b6c639f6bbb3d94cb9a
  SOURCE_FORMATTER_COMMIT: 705133f90f6fcff7bd3c77b3831f66bd3dc4d071
  SOURCE_FORMATTER_RUN: "33282599691"
  SOURCE_FORMATTER_JOB: "99180176886"
  CARGO_INCREMENTAL: "0"

jobs:
  exact-pair:
    name: Q0.2 exact-head and synthetic-merge full fmt-check (Windows)
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout exact Q0.2 head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 3
          persist-credentials: false

      - name: Prepare locked repository formatting toolchain
        uses: ./.github/actions/setup-ci

      - name: Set up locked uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.3

      - name: Install Rust 1.95 formatter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup default 1.95.0
          $rustVersion = ((rustc -V) -split ' ')[1]
          if ($rustVersion -ne '1.95.0') { throw "unexpected rustc: $rustVersion" }
          just --version
          if ($LASTEXITCODE -ne 0) { throw 'just unavailable' }
          uv --version
          if ($LASTEXITCODE -ne 0) { throw 'uv unavailable' }
          dotslash --version
          if ($LASTEXITCODE -ne 0) { throw 'dotslash unavailable' }

      - name: Verify exact Q0.2 head and formatter-only surface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne $env:REPOSITORY) { throw 'repository mismatch' }
          if ((git rev-parse HEAD).Trim() -ne $env:HEAD_SHA) { throw 'head mismatch' }
          if ((git rev-parse 'HEAD^{tree}').Trim() -ne $env:HEAD_TREE) { throw 'head tree mismatch' }
          if ((git rev-parse 'HEAD^').Trim() -ne $env:BASE_SHA) { throw 'base mismatch' }
          if ((git rev-list --count "$env:BASE_SHA..HEAD").Trim() -ne '1') { throw 'head is not one commit above base' }
          git diff --check $env:BASE_SHA $env:HEAD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'diff check failed' }

          @'
          import os
          import subprocess

          base = os.environ['BASE_SHA']
          head = os.environ['HEAD_SHA']
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', base, head], text=True
          ).splitlines()
          assert len(changed) == 42, {'expected': 42, 'actual': len(changed)}
          assert len(set(changed)) == 42
          unexpected = [
              path
              for path in changed
              if not (
                  (path.startswith('codex-rs/') and path.endswith('.rs'))
                  or (path.startswith('scripts/') and path.endswith('.py'))
              )
          ]
          assert not unexpected, {'unexpected': unexpected}
          forbidden = {
              '.github/workflows/hepta-q0-format-once.yml',
              'scripts/verify-hepta-intelligence-document-authority.py',
              'scripts/verify-hepta-intelligence-master-plan.py',
          }
          overlap = sorted(forbidden.intersection(changed))
          assert not overlap, {'forbidden_overlap': overlap}
          print('\n'.join(changed))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'formatter-only surface validation failed' }

      - name: Run exact-head complete repository fmt-check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          just fmt-check
          if ($LASTEXITCODE -ne 0) { throw 'exact-head fmt-check failed' }
          $dirty = @(git status --porcelain --untracked-files=no)
          if ($dirty.Count -gt 0) { throw "tracked worktree dirty: $($dirty -join ',')" }

      - name: Fetch exact Q0.2 synthetic merge candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --no-tags --depth=3 origin $env:MERGE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'merge fetch failed' }
          git checkout --detach $env:MERGE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'merge checkout failed' }

      - name: Verify exact merge topology and run complete fmt-check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:MERGE_SHA) { throw 'merge mismatch' }
          if ((git rev-parse 'HEAD^{tree}').Trim() -ne $env:MERGE_TREE) { throw 'merge tree mismatch' }
          if ((git rev-parse 'HEAD^1').Trim() -ne $env:BASE_SHA) { throw 'merge parent 1 mismatch' }
          if ((git rev-parse 'HEAD^2').Trim() -ne $env:HEAD_SHA) { throw 'merge parent 2 mismatch' }
          $parents = ((git rev-list --parents -n 1 HEAD).Trim() -split '\s+')
          if ($parents.Count -ne 3) { throw 'candidate is not a two-parent merge' }
          git diff --check $env:BASE_SHA $env:HEAD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'diff check failed' }
          just fmt-check
          if ($LASTEXITCODE -ne 0) { throw 'synthetic-merge fmt-check failed' }
          $dirty = @(git status --porcelain --untracked-files=no)
          if ($dirty.Count -gt 0) { throw "tracked worktree dirty: $($dirty -join ',')" }

      - name: Emit immutable Q0.2 pair receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receiptDir = Join-Path $env:RUNNER_TEMP 'hepta-q0-2-fmt-evidence'
          New-Item -ItemType Directory -Force -Path $receiptDir | Out-Null
          $env:RECEIPT_PATH = Join-Path $receiptDir 'receipt.json'
          @'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          format_script = Path('scripts/format.py')
          justfile = Path('justfile')
          receipt = {
              'schema': 'hepta_intelligence_q0_2_fmt_pair_v1',
              'status': 'PASS_HEPTA_INTELLIGENCE_Q0_2_FMT_EXACT_PAIR',
              'repository': os.environ['REPOSITORY'],
              'base': os.environ['BASE_SHA'],
              'head': os.environ['HEAD_SHA'],
              'head_tree': os.environ['HEAD_TREE'],
              'synthetic_merge': os.environ['MERGE_SHA'],
              'synthetic_merge_tree': os.environ['MERGE_TREE'],
              'observed_checkout': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'changed_path_count': 42,
              'gate': ['just', 'fmt-check'],
              'gate_components': [
                  'Just', 'Rust', 'Bazel/Starlark', 'Python SDK', 'Python scripts'
              ],
              'justfile_blob': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD:justfile'], text=True
              ).strip(),
              'justfile_sha256': hashlib.sha256(justfile.read_bytes()).hexdigest(),
              'format_script_blob': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD:scripts/format.py'], text=True
              ).strip(),
              'format_script_sha256': hashlib.sha256(format_script.read_bytes()).hexdigest(),
              'source_formatter_commit': os.environ['SOURCE_FORMATTER_COMMIT'],
              'source_formatter_run': os.environ['SOURCE_FORMATTER_RUN'],
              'source_formatter_job': os.environ['SOURCE_FORMATTER_JOB'],
              'runner_os': os.environ['RUNNER_OS'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow_job': os.environ['GITHUB_JOB'],
              'candidate_source_writeback': True,
              'evidence_workflow_writeback': False,
              'formatter_only': True,
              'runtime_behavior_change': False,
              'runtime_authority': False,
              'production_authority': False,
              'selected': False,
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()
          receipt['receipt_binding_sha256'] = hashlib.sha256(canonical).hexdigest()
          Path(os.environ['RECEIPT_PATH']).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'receipt generation failed' }
          Get-Content -Raw $env:RECEIPT_PATH | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload immutable Q0.2 pair receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-q0-2-fmt-pair-windows-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/hepta-q0-2-fmt-evidence/receipt.json
          if-no-files-found: error
          retention-days: 30
