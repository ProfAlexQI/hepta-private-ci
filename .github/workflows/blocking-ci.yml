name: blocking-ci

# This is the single entrypoint for checks that block a PR merge. It also runs
# after pushes to the active main branches so the same check family stays grouped
# in the Actions UI.
on:
  pull_request: {}
  push:
    branches: [main, integration/vnext-main-20260811]

jobs:
  runner-preflight:
    name: Runner preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm hosted runner execution
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          echo "event=$GITHUB_EVENT_NAME"
          echo "sha=$GITHUB_SHA"
          test -n "$RUNNER_TEMP"
          test -d "$RUNNER_TEMP"

  # Keep reusable workflow calls alphabetized. The `required` job below is the
  # version-controlled list that the main-branch ruleset should require.
  bazel:
    name: Bazel
    needs: runner-preflight
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    needs: runner-preflight
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    needs: runner-preflight
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    name: Codespell
    needs: runner-preflight
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  hepta-browser-c0-c3:
    name: Hepta Browser C0-C3 qualification
    needs: runner-preflight
    uses: ./.github/workflows/hepta-browser-c0-c3.yml
    secrets: inherit

  hepta-browser-c1-protocol:
    name: Hepta Browser C1 private protocol
    needs: runner-preflight
    uses: ./.github/workflows/hepta-browser-c1-protocol.yml
    secrets: inherit

  hepta-servo-artifact-contract:
    name: Hepta Servo artifact contract
    needs: runner-preflight
    uses: ./.github/workflows/hepta-servo-artifact-contract.yml
    secrets: inherit

  hepta-servo-build-manifest-contract:
    name: Hepta Servo build manifest contract
    needs: runner-preflight
    uses: ./.github/workflows/hepta-servo-build-manifest-contract.yml
    secrets: inherit

  hepta-servo-source-bundle-contract:
    name: Hepta Servo source bundle contract
    needs: runner-preflight
    uses: ./.github/workflows/hepta-servo-source-bundle-contract.yml
    secrets: inherit

  hepta-servo-source-contract:
    name: Hepta Servo source receipt contract
    needs: runner-preflight
    uses: ./.github/workflows/hepta-servo-source-contract.yml
    secrets: inherit

  hepta-vnext:
    name: Hepta vNext qualification
    needs: runner-preflight
    uses: ./.github/workflows/hepta-vnext-qualification.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    needs: runner-preflight
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  rust-ci:
    name: rust-ci
    needs: runner-preflight
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    needs: runner-preflight
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  required:
    name: CI required
    # Without `always()`, GitHub skips this job after a failed dependency and a
    # required check can appear successful instead of reporting the failure.
    if: ${{ always() }}
    needs:
      - runner-preflight
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - hepta-browser-c0-c3
      - hepta-browser-c1-protocol
      - hepta-servo-artifact-contract
      - hepta-servo-build-manifest-contract
      - hepta-servo-source-bundle-contract
      - hepta-servo-source-contract
      - hepta-vnext
      - repo-checks
      - rust-ci
      - sdk
    runs-on: ubuntu-24.04
    steps:
      # Keep the helper on the same combined revision as the child workflows so
      # the merge gate evaluates the exact candidate they validated.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
