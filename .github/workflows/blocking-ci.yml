name: blocking-ci

# This is the single entrypoint for checks that block a PR merge. It also runs
# after pushes to the integration default branch so the same check family stays
# grouped in the Actions UI.
on:
  pull_request: {}
  push:
    branches: [integration/vnext-main-20260811]

# Keep at most one blocking graph per PR/ref. Architecture work on this branch
# lands in small, independently reviewed commits; retaining every superseded
# graph starves the exact-head qualification that can still be authoritative.
concurrency:
  group: blocking-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Keep reusable workflow calls alphabetized. The `required` job below is the
  # version-controlled list that the integration-branch ruleset should require.
  bazel:
    name: Bazel
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  hepta-architecture-convergence:
    name: Hepta architecture convergence
    uses: ./.github/workflows/hepta-architecture-convergence-p0-2.yml
    secrets: inherit

  hepta-gap-closure:
    name: Hepta gap closure P0.5
    uses: ./.github/workflows/hepta-gap-closure-p0-5.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  rust-ci:
    name: rust-ci
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  required:
    name: CI required
    # Preserve failure aggregation, but do not leave a superseded workflow's
    # required job queued after concurrency cancellation.
    if: ${{ always() && !cancelled() }}
    needs:
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - hepta-architecture-convergence
      - hepta-gap-closure
      - repo-checks
      - rust-ci
      - sdk
    runs-on: ubuntu-24.04
    steps:
      # Keep the helper on the same combined revision as the child workflows so
      # the merge gate evaluates the exact candidate they validated.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
