name: blocking-ci

on:
  pull_request: {}
  push:
    branches: [main, integration/vnext-main-20260811]

jobs:
  runner-preflight:
    name: Runner preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm hosted runner execution
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          echo "event=$GITHUB_EVENT_NAME"
          echo "sha=$GITHUB_SHA"
          test -n "$RUNNER_TEMP"
          test -d "$RUNNER_TEMP"

  bazel:
    name: Bazel
    needs: runner-preflight
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    needs: runner-preflight
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    needs: runner-preflight
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    name: Codespell
    needs: runner-preflight
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  hepta-required-context-policy:
    name: Hepta required-context policy
    needs: runner-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify independent required checks
        run: python3 scripts/verify-hepta-required-contexts.py

      - name: Verify retired legacy workflow trigger surface
        run: python3 scripts/verify-hepta-legacy-workflow-retirement.py

  hepta-browser-c1-artifact-gate:
    name: Hepta Browser C1 artifact launch gate
    needs: runner-preflight
    uses: ./.github/workflows/hepta-browser-c1-artifact-gate.yml
    secrets: inherit

  hepta-servo-artifact-contract:
    name: Hepta Servo artifact contract
    needs: runner-preflight
    uses: ./.github/workflows/hepta-servo-artifact-contract.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    needs: runner-preflight
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  rust-ci:
    name: rust-ci
    needs: runner-preflight
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    needs: runner-preflight
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  required:
    name: CI required
    if: ${{ always() }}
    needs:
      - runner-preflight
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - hepta-required-context-policy
      - hepta-browser-c1-artifact-gate
      - hepta-servo-artifact-contract
      - repo-checks
      - rust-ci
      - sdk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
