  generated-and-locks:
    name: Generated artifacts and locks
    runs-on: hepta-vnext-linux-x64-09e9
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate 09e9
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 09e9e9ff7fa6b6c1d129d0c7a858979823e13ae8
          persist-credentials: false

      - name: Verify exact candidate source preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$HEPTA_EXPECTED_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Format
        working-directory: codex-rs
        run: cargo fmt --all -- --check

      - name: App Server schemas are current
        run: |
          set -euo pipefail
          just write-app-server-schema --experimental
          git diff --exit-code

      - name: Bazel lock is current
        run: just bazel-lock-check

      - name: Clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

      - name: Verify exact candidate source postflight
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEPTA_EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$HEPTA_EXPECTED_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
