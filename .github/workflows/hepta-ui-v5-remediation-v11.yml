name: Hepta UI v5 remediation v11

on:
  push:
    branches:
      - ops/ui-v5-remediation-v11-20260830
    paths:
      - .github/workflows/hepta-ui-v5-remediation-v11.yml

permissions:
  contents: write

concurrency:
  group: hepta-ui-v5-remediation-v11
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'ProfHepta/hepta-private-ci'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      BRANCH: codex/ui-v5-plan-and-repo-gap-closure-20260829
      EXPECTED_PARENT: 3e0cf14de1d3a441295d1825a0299e48c8bbfb14
      BOOTSTRAP_PATH: .github/workflows/hepta-ui-v5-remediation-v11.yml
      UPSTREAM_URL: https://github.com/openai/codex.git
      UPSTREAM_PREVIOUS: 61a44880a85d2fd0d8770908dea5733495e571c8
      UPSTREAM_ROLE: current_r12
      UPSTREAM_FROZEN_REF: refs/remotes/upstream/hepta-intake-20260830-r12
      UPSTREAM_INTAKE_PATH: docs/architecture/HEPTA_UPSTREAM_CODEX_CURRENT_INTAKE_2026-08-30_R12.json
      UPSTREAM_RECORD_PATH: docs/architecture/HEPTA_UPSTREAM_CODEX_R12_SEMANTIC_ABSORPTION_RECORD_2026-08-30.json
      V10_DRIVER_COMMIT: bb8e40e70ce3c8121e8edc7f3274ed2e4a1665ec
    steps:
      - name: Check out exact v11 driver commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install deterministic remediation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes jq ripgrep ruby patch
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --no-self-update

      - name: Execute the exact v10 remediation logic on ARM
        shell: bash
        run: |
          set -euo pipefail
          source_workflow="$RUNNER_TEMP/hepta-ui-v5-remediation-v10.yml"
          generated_driver="$RUNNER_TEMP/hepta-ui-v5-remediation-v11-driver.sh"
          git cat-file -e "$V10_DRIVER_COMMIT^{commit}"
          git show "$V10_DRIVER_COMMIT:.github/workflows/hepta-ui-v5-remediation-v10.yml" > "$source_workflow"
          awk '
            /      - name: Extend, verify, and publish the exact remediation/ { found=1; next }
            found && /        shell: bash/ { next }
            found && /        run: \|/ { in_run=1; next }
            in_run { sub(/^          /, ""); print }
          ' "$source_workflow" > "$generated_driver"
          test -s "$generated_driver"
          bash -n "$generated_driver"
          bash -x "$generated_driver"
