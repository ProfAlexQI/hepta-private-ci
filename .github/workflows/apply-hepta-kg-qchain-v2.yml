name: apply-hepta-kg-qchain-v2

on:
  push:
    branches:
      - "codex/hepta-kg-qchain-v2-orchestrator-20260828"
    paths:
      - ".github/workflows/apply-hepta-kg-qchain-v2.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: apply-hepta-kg-qchain-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      REPO: ProfAlexQI/hepta-private-ci
      ORCH_BRANCH: codex/hepta-kg-qchain-v2-orchestrator-20260828
      P032_BRANCH: codex/hepta-intelligence-shared-projection-planner-v5-20260828
      P033_BRANCH: codex/hepta-intelligence-evidence-resolver-v4-20260828
      BUNDLE_SHA256: 9d7b97cbd4f6a5d990d30cbf548ae5b60fe6e7c2fcf70a4651f6f1135c2a697e
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact orchestration branch
        uses: actions/checkout@v4
        with:
          ref: codex/hepta-kg-qchain-v2-orchestrator-20260828
          fetch-depth: 0

      - name: Reassemble and verify qualification-chain bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          import tarfile
          from pathlib import Path

          chunks = sorted(Path('.qchain-v2').glob('chunk-*.txt'))
          assert [p.name for p in chunks] == [f'chunk-{i:02d}.txt' for i in range(8)]
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in chunks)
          payload = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(payload).hexdigest()
          assert actual == os.environ['BUNDLE_SHA256'], (actual, os.environ['BUNDLE_SHA256'])
          archive = Path('/tmp/hepta-qchain-v2.tar.gz')
          archive.write_bytes(payload)
          target = Path('/tmp/hepta-qchain-v2')
          target.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive, 'r:gz') as bundle:
              bundle.extractall(target, filter='data')
          assert (target / 'hepta_kg_p0_3_3_qualification_v2' / 'apply_qualification_chain_v2.py').is_file()
          PY

      - name: Apply both governed branch patches atomically
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "Qian QI"
          git config --global user.email "102159240+ProfAlexQI@users.noreply.github.com"
          python3 /tmp/hepta-qchain-v2/hepta_kg_p0_3_3_qualification_v2/apply_qualification_chain_v2.py "$PWD" --push \
            | tee /tmp/hepta-qchain-v2-apply.json

      - name: Verify remote refs and Draft authority boundary
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/git/ref/heads/$P032_BRANCH" > /tmp/p032-ref.json
          gh api "repos/$REPO/git/ref/heads/$P033_BRANCH" > /tmp/p033-ref.json
          gh api "repos/$REPO/pulls/40" > /tmp/pr40.json
          gh api "repos/$REPO/pulls/30" > /tmp/pr30.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/hepta-qchain-v2-apply.json').read_text())
          p032 = json.loads(Path('/tmp/p032-ref.json').read_text())['object']['sha']
          p033 = json.loads(Path('/tmp/p033-ref.json').read_text())['object']['sha']
          pr40 = json.loads(Path('/tmp/pr40.json').read_text())
          pr30 = json.loads(Path('/tmp/pr30.json').read_text())
          assert result['pushed'] is True
          assert result['qualified'] is False
          assert result['production_authority'] is False
          assert p032 == result['p0_3_2_new_head']
          assert p033 == result['p0_3_3_new_head']
          for pr in (pr40, pr30):
              assert pr['state'] == 'open'
              assert pr['draft'] is True
              assert pr['merged'] is False
          receipt = {
              'schema': 'hepta_kg_qchain_v2_atomic_publish_receipt',
              'p0_3_2_head': p032,
              'p0_3_3_head': p033,
              'p0_3_2_pr_draft': pr40['draft'],
              'p0_3_3_pr_draft': pr30['draft'],
              'qualified': False,
              'production_authority': False,
              'tool_v4_registered': False,
              'p0_3_4_started': False,
          }
          Path('/tmp/hepta-qchain-v2-publish-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Upload atomic publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-kg-qchain-v2-${{ github.sha }}
          path: |
            /tmp/hepta-qchain-v2-apply.json
            /tmp/hepta-qchain-v2-publish-receipt.json
          if-no-files-found: warn
          retention-days: 21

      - name: Remove successful orchestration branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete "$ORCH_BRANCH"
