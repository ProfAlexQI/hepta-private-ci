name: Hepta observer self-clean

on:
  push:
    branches:
      - codex/hepta-final-ci-observer-20260902

permissions:
  contents: write

concurrency:
  group: hepta-observer-self-clean-20260902
  cancel-in-progress: true

jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out observer branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/hepta-final-ci-observer-20260902
          fetch-depth: 0
          persist-credentials: true

      - name: Remove all observer-side source writers
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/hepta-final-ci-observer.yml \
            .github/workflows/hepta-final-infrastructure-retry.yml \
            .github/workflows/hepta-final-deterministic-remediator.yml \
            .github/workflows/hepta-remediated-ci-observer.yml \
            .github/workflows/hepta-observer-self-clean.yml
          git config user.name "Hepta observer cleanup"
          git config user.email "hepta-observer-cleanup@users.noreply.github.com"
          git add -A .github/workflows
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(ci): retire observer-side source writers"
          git push origin HEAD:refs/heads/codex/hepta-final-ci-observer-20260902
