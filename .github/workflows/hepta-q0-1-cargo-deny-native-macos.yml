name: Hepta Intelligence Q0.1 cargo-deny native macOS evidence

on:
  push:
    branches:
      - "automation/hepta-q0-1-cargo-deny-evidence-20260830-0115"

permissions:
  contents: read

concurrency:
  group: hepta-q0-1-cargo-deny-evidence-20260830-0115
  cancel-in-progress: true

env:
  EXPECTED_REPOSITORY: ProfHepta/hepta-private-ci
  BASE_SHA: c768bcbeb4c1168088d2499828c24da521a2a73a
  HEAD_SHA: 99b2b44c00bf7b50b588fffddc299bf55fac698a
  HEAD_TREE: 381ed770be51883db94b717e21a96277de726238
  MERGE_SHA: 06661355415a257f19dcae1d23c3914a850eb2c2
  CARGO_DENY_VERSION: 0.19.0
  ARTIFACT_DIR: artifacts/hepta-q0-1-cargo-deny

jobs:
  qualify:
    name: Q0.1 exact-head and synthetic-merge cargo-deny on macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout evidence workflow identity
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: evidence
          persist-credentials: false

      - name: Checkout exact Q0.1 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          path: head
          fetch-depth: 2
          persist-credentials: false

      - name: Checkout exact signed synthetic merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.MERGE_SHA }}
          path: merge
          fetch-depth: 3
          persist-credentials: false

      - name: Verify immutable candidate identities and topology
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$(git -C evidence rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C head rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git -C head rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test "$(git -C head rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git -C head rev-list --count "$BASE_SHA"..HEAD)" = 1
          test "$(git -C head diff --name-only HEAD^ HEAD)" = ".github/workflows/cargo-deny.yml"
          test "$(git -C merge rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git -C merge rev-parse HEAD^{tree})" = "$HEAD_TREE"
          test "$(git -C merge rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git -C merge rev-parse HEAD^2)" = "$HEAD_SHA"
          test "$(git -C merge rev-list --parents -n 1 HEAD | wc -w | tr -d ' ')" = 3
          test "$(git -C head rev-parse HEAD:.github/workflows/cargo-deny.yml)" = \
               "$(git -C merge rev-parse HEAD:.github/workflows/cargo-deny.yml)"
          git -C head diff --check HEAD^ HEAD
          git -C merge diff --check HEAD^1 HEAD^2

      - name: Download and verify official cargo-deny release
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              target="aarch64-apple-darwin"
              expected="a22f2023c06f3eefd099a5d42dd828fd4fa74d1e1c167bd1dbc3cf59ad62ded0"
              ;;
            x86_64)
              target="x86_64-apple-darwin"
              expected="c42163655413f7e872638cd8c4345a327b512ef0ab99109e9cced691b95af5fb"
              ;;
            *)
              echo "unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          install_dir="$RUNNER_TEMP/cargo-deny-install"
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-${target}.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 "$url" --output "$archive"
          observed="$(shasum -a 256 "$archive" | awk '{print $1}')"
          test "$observed" = "$expected"
          python3 - "$archive" "$install_dir" <<'PY'
          from pathlib import Path, PurePosixPath
          import stat
          import sys
          import tarfile

          archive = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          destination.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive, "r:gz") as tf:
              members = tf.getmembers()
              assert 0 < len(members) <= 16
              seen = set()
              total = 0
              for member in members:
                  pure = PurePosixPath(member.name)
                  assert not pure.is_absolute() and ".." not in pure.parts
                  normalized = pure.as_posix().rstrip("/")
                  assert normalized and normalized not in seen
                  seen.add(normalized)
                  assert not member.issym() and not member.islnk()
                  assert not member.ischr() and not member.isblk() and not member.isfifo()
                  total += max(member.size, 0)
                  assert total <= 64 * 1024 * 1024
                  target = destination / pure
                  target.resolve().relative_to(destination.resolve())
              tf.extractall(destination, filter="data")
          PY
          binary="$(find "$install_dir" -type f -name cargo-deny -perm -111 -print)"
          test -n "$binary"
          test "$(printf '%s\n' "$binary" | wc -l | tr -d ' ')" = 1
          "$binary" --version | tee "$RUNNER_TEMP/cargo-deny-version.txt"
          grep -F "cargo-deny ${CARGO_DENY_VERSION}" "$RUNNER_TEMP/cargo-deny-version.txt"
          printf '%s\n' "$binary" > "$RUNNER_TEMP/cargo-deny-path.txt"
          printf '%s\n' "$target" > "$RUNNER_TEMP/cargo-deny-target.txt"
          printf '%s\n' "$expected" > "$RUNNER_TEMP/cargo-deny-archive-sha256.txt"

      - name: Run exact-head cargo-deny policy
        shell: bash
        run: |
          set -euo pipefail
          binary="$(cat "$RUNNER_TEMP/cargo-deny-path.txt")"
          (
            cd head
            "$binary" \
              --manifest-path ./codex-rs/Cargo.toml \
              --all-features \
              check \
              --config ./codex-rs/deny.toml
          ) 2>&1 | tee "$RUNNER_TEMP/exact-head-cargo-deny.log"

      - name: Run synthetic-merge cargo-deny policy
        shell: bash
        run: |
          set -euo pipefail
          binary="$(cat "$RUNNER_TEMP/cargo-deny-path.txt")"
          (
            cd merge
            "$binary" \
              --manifest-path ./codex-rs/Cargo.toml \
              --all-features \
              check \
              --config ./codex-rs/deny.toml
          ) 2>&1 | tee "$RUNNER_TEMP/synthetic-merge-cargo-deny.log"

      - name: Emit exact candidate pair receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          cp "$RUNNER_TEMP/exact-head-cargo-deny.log" "$ARTIFACT_DIR/"
          cp "$RUNNER_TEMP/synthetic-merge-cargo-deny.log" "$ARTIFACT_DIR/"
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          def git(directory: str, *args: str) -> str:
              return subprocess.check_output(
                  ["git", "-C", directory, *args], text=True
              ).strip()

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          workflow_rel = ".github/workflows/hepta-q0-1-cargo-deny-native-macos.yml"
          workflow = Path("evidence") / workflow_rel
          cargo_workflow = Path("head/.github/workflows/cargo-deny.yml")
          policy = Path("head/codex-rs/deny.toml")
          binary = Path(Path(os.environ["RUNNER_TEMP"]) / "cargo-deny-install")
          binaries = [p for p in binary.rglob("cargo-deny") if p.is_file()]
          assert len(binaries) == 1

          receipt = {
              "schema": "hepta_intelligence_q0_1_cargo_deny_pair_v2",
              "status": "PASS_HEPTA_INTELLIGENCE_Q0_1_CARGO_DENY_PAIR",
              "repository": os.environ["EXPECTED_REPOSITORY"],
              "candidate": {
                  "base": os.environ["BASE_SHA"],
                  "head": os.environ["HEAD_SHA"],
                  "head_tree": os.environ["HEAD_TREE"],
                  "synthetic_merge": os.environ["MERGE_SHA"],
                  "synthetic_merge_tree": git("merge", "rev-parse", "HEAD^{tree}"),
                  "merge_parent_1": git("merge", "rev-parse", "HEAD^1"),
                  "merge_parent_2": git("merge", "rev-parse", "HEAD^2"),
              },
              "evidence_workflow": {
                  "commit": os.environ["GITHUB_SHA"],
                  "path": workflow_rel,
                  "blob_sha": git("evidence", "rev-parse", f"HEAD:{workflow_rel}"),
                  "content_sha256": sha(workflow),
                  "run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              },
              "cargo_deny": {
                  "version": os.environ["CARGO_DENY_VERSION"],
                  "release_target": Path(os.environ["RUNNER_TEMP"], "cargo-deny-target.txt")
                      .read_text(encoding="utf-8").strip(),
                  "release_archive_sha256": Path(
                      os.environ["RUNNER_TEMP"], "cargo-deny-archive-sha256.txt"
                  ).read_text(encoding="utf-8").strip(),
                  "binary_sha256": sha(binaries[0]),
                  "candidate_workflow_blob": git(
                      "head", "rev-parse", "HEAD:.github/workflows/cargo-deny.yml"
                  ),
                  "candidate_workflow_sha256": sha(cargo_workflow),
                  "policy_path": "codex-rs/deny.toml",
                  "policy_sha256": sha(policy),
                  "arguments": [
                      "--manifest-path", "./codex-rs/Cargo.toml",
                      "--all-features", "check",
                      "--config", "./codex-rs/deny.toml",
                  ],
              },
              "checks": {
                  "exact_head": {
                      "passed": True,
                      "log_sha256": sha(Path(os.environ["RUNNER_TEMP"], "exact-head-cargo-deny.log")),
                  },
                  "synthetic_merge": {
                      "passed": True,
                      "log_sha256": sha(Path(os.environ["RUNNER_TEMP"], "synthetic-merge-cargo-deny.log")),
                  },
              },
              "source_writeback": False,
              "runtime_authority": False,
              "production_authority": False,
              "promotion": False,
              "release": False,
              "merge_authorized": False,
          }
          encoded = json.dumps(
              receipt, sort_keys=True, separators=(",", ":"), ensure_ascii=False
          ).encode()
          receipt["receipt_binding_sha256"] = hashlib.sha256(encoded).hexdigest()
          Path(os.environ["ARTIFACT_DIR"], "receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git -C head diff --check HEAD^ HEAD
          git -C merge diff --check HEAD^1 HEAD^2
          test -z "$(git -C head status --porcelain --untracked-files=no)"
          test -z "$(git -C merge status --porcelain --untracked-files=no)"

      - name: Upload Q0.1 candidate pair evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-q0-1-cargo-deny-pair-${{ env.HEAD_SHA }}-${{ github.sha }}
          path: artifacts/hepta-q0-1-cargo-deny/**
          if-no-files-found: error
          retention-days: 30
