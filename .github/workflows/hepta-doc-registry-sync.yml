name: Hepta DOC-REGISTRY-CLOSED-WORLD synchronization

on:
  push:
    branches:
      - integration/vnext-main-20260811
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hepta-doc-registry-closed-world-sync
  cancel-in-progress: false

env:
  REPOSITORY_FULL_NAME: TrillionniumFoundation/hepta-private-ci
  CURRENT_DEFAULT: integration/vnext-main-20260811
  FUTURE_DEFAULT: main
  SELF_PATH: .github/workflows/hepta-doc-registry-sync.yml
  STALE_WORKFLOW: .github/workflows/hepta-branch-deletion-selfhosted.yml

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact mirrored repository tip
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact two-ref repository state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name "Hepta Repository Consolidation"
          git config user.email "hepta-repository-consolidation@users.noreply.github.com"
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse refs/remotes/origin/$CURRENT_DEFAULT)" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/$FUTURE_DEFAULT)" = "$GITHUB_SHA"
          test "$(git ls-remote --heads origin | wc -l | tr -d ' ')" = "2"
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['REPOSITORY_FULL_NAME']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'hepta-doc-registry-sync',
          }
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/pulls?state=open&per_page=1',
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              pulls = json.loads(response.read())
          if pulls:
              raise SystemExit(f"open pull requests remain: {[pull['number'] for pull in pulls]}")
          print(json.dumps({'openPullRequests': 0}, sort_keys=True))
          PY

      - name: Apply truthful DOC-REGISTRY-CLOSED-WORLD synchronization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path('.')
          current_default = 'integration/vnext-main-20260811'

          current_path = root / 'docs/CURRENT.json'
          current = json.loads(current_path.read_text(encoding='utf-8'))
          current['repository']['defaultBranch'] = current_default
          current['candidate'].update(
              {
                  'pullRequest': 286,
                  'targetBranch': 'main',
                  'sourceHead': 'resolved_by_exact_main_default_mirror_receipt',
                  'sourceTree': 'resolved_by_exact_main_default_mirror_receipt',
                  'mergeCandidate': 'not_applicable_after_ancestry_consolidation',
                  'relationship': 'main_and_current_default_same_tip_pending_repository_admin_switch',
              }
          )
          current['currentWorkPackage'] = 'DOC-2-DEFAULT-BRANCH-SELECTION'
          supersedes = current.setdefault('supersedes', [])
          marker = 'pre-consolidation multi-branch repository ref surface'
          if marker not in supersedes:
              supersedes.append(marker)
          current_path.write_text(
              json.dumps(current, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          packages_path = root / 'docs/delivery/WORK_PACKAGES.json'
          packages = json.loads(packages_path.read_text(encoding='utf-8'))
          packages['currentPackage'] = 'DOC-2-DEFAULT-BRANCH-SELECTION'
          states = {
              'DOC-0-CANONICAL-DOCUMENT-CONSOLIDATION': 'source_implemented',
              'DOC-1-V8-SEMANTIC-UPGRADE': 'source_implemented',
              'DOC-2-DEFAULT-BRANCH-SELECTION': 'blocked_external',
              'DOC-REGISTRY-CLOSED-WORLD': 'source_implemented',
          }
          observed = set()
          for package in packages['packages']:
              if package['id'] in states:
                  package['state'] = states[package['id']]
                  observed.add(package['id'])
          if observed != set(states):
              raise SystemExit(f'missing document packages: {sorted(set(states) - observed)}')
          packages_path.write_text(
              json.dumps(packages, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          development_path = root / 'docs/DEVELOPMENT.md'
          development = development_path.read_text(encoding='utf-8')
          development, substitutions = re.subn(
              r"\*\*Status:\*\*[^\n]*",
              "**Status:** canonical V8 content is mirrored on `main`; GitHub still names `integration/vnext-main-20260811` as the default branch, so default-branch selection remains an external repository-administration gate.",
              development,
              count=1,
          )
          if substitutions != 1:
              raise SystemExit('unable to update DEVELOPMENT status')

          old_cleanup = (
              "The exact default baseline contains a 138-file Dropbox development snapshot, four direct historical "
              "`docs/hepta-vnext` documents, and one superseded global live-shell narrative. V8.1 must delete the "
              "entire `docs/hepta-vnext` tree plus `the retired live-shell note`, for an exact minimum of 143 tracked "
              "paths in the same single commit that installs this document set. It must not add a V6/V8 side-by-side "
              "archive or retain a migration-only helper in the final tree. Code-consumed APIs, schemas, policies, "
              "migrations, tests and implementation contracts outside the historical development surface remain protected."
          )
          new_cleanup = (
              "The pre-selection baseline contained 143 historical development paths. V8 deleted that complete set in "
              "the same commit that installed the canonical document system. Git ancestry now preserves every "
              "pre-consolidation branch tip without overlaying an obsolete branch tree or reintroducing an in-tree "
              "historical plan. Code-consumed APIs, schemas, policies, migrations, tests and implementation contracts "
              "remain protected."
          )
          if old_cleanup in development:
              development = development.replace(old_cleanup, new_cleanup, 1)
          elif new_cleanup not in development:
              raise SystemExit('unable to update completed historical cleanup statement')

          section_start = development.index('## 3. Current truthful baseline')
          section_end = development.index(
              '## 4. Immutable execution, authority and data invariants',
              section_start,
          )
          section = (
              '## 3. Current truthful baseline\n\n'
              'The selected V8 content is present on both `main` and `integration/vnext-main-20260811` at the same '
              'exact tip. Every one of the 789 pre-consolidation branch tips is reachable from that line as Git '
              'ancestry; obsolete branch trees were not overlaid. All 64 outstanding pull requests were closed as '
              'superseded, and all 787 other branch refs were removed by a bounded operation after exact ancestry '
              'verification.\n\n'
              'GitHub still reports `integration/vnext-main-20260811` as the repository default because the Actions '
              'integration is not permitted to mutate repository administration settings. Therefore '
              '`DOC-2-DEFAULT-BRANCH-SELECTION` remains `blocked_external`. The final administrative transition is to '
              'select the existing `main` ref as default and then delete the old default ref. Until that observable '
              'state exists, canonical registries must not claim that `main` is already the GitHub default branch.\n\n'
              'Exact live head, tree, CI, review and operator facts remain dynamic evidence and must be resolved from '
              'current external receipts. This consolidation grants no runtime, model, provider, tool, network, '
              'filesystem, secret, Matrix, fleet, operator, promotion or release authority.\n\n'
          )
          development = development[:section_start] + section + development[section_end:]
          development_path.write_text(development, encoding='utf-8')
          PY

      - name: Generate and verify the synchronized canonical document system
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-docs.py generate-status
          python3 scripts/hepta-docs.py self-test
          python3 scripts/hepta-docs.py inventory-legacy
          python3 scripts/hepta-docs.py verify
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no | grep -Ev '^( M|M |MM) docs/(CURRENT.json|DEVELOPMENT.md|STATUS.md|delivery/WORK_PACKAGES.json)$' || true)"

      - name: Commit the bounded document work package
        shell: bash
        run: |
          set -euo pipefail
          git add \
            docs/CURRENT.json \
            docs/DEVELOPMENT.md \
            docs/STATUS.md \
            docs/delivery/WORK_PACKAGES.json
          git commit -s \
            -m "docs(repo): synchronize DOC-REGISTRY-CLOSED-WORLD" \
            -m "Record the completed ancestry/ref consolidation and the exact remaining repository-administration gate. DOC-2 stays blocked until GitHub selects the existing main ref as default. Authority delta: none."
          python3 scripts/hepta-docs.py verify

      - name: Remove transient consolidation workflows in a separate operations commit
        shell: bash
        run: |
          set -euo pipefail
          git rm "$SELF_PATH" "$STALE_WORKFLOW"
          git commit -s \
            -m "ops(repo): remove transient consolidation workflows" \
            -m "The bounded ancestry and reference consolidation has completed. Retain no reusable branch-deletion mechanism in the selected tree. Authority delta: none."
          python3 scripts/hepta-docs.py verify
          git diff --check

      - name: Publish the exact synchronized tip to both retained refs
        shell: bash
        run: |
          set -euo pipefail
          git push --atomic origin \
            HEAD:refs/heads/$CURRENT_DEFAULT \
            HEAD:refs/heads/$FUTURE_DEFAULT
          git rev-parse HEAD > /tmp/final-head

      - name: Verify the final truthful repository state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          final_head="$(cat /tmp/final-head)"
          test "$(git rev-parse refs/remotes/origin/$CURRENT_DEFAULT)" = "$final_head"
          test "$(git rev-parse refs/remotes/origin/$FUTURE_DEFAULT)" = "$final_head"
          test "$(git ls-remote --heads origin | wc -l | tr -d ' ')" = "2"
          test ! -e "$SELF_PATH"
          test ! -e "$STALE_WORKFLOW"
          python3 scripts/hepta-docs.py verify
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['REPOSITORY_FULL_NAME']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'hepta-doc-registry-sync',
          }
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}',
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              repo = json.loads(response.read())
          result = {
              'defaultBranch': repo['default_branch'],
              'branchCount': 2,
              'mainMirrorsCurrentDefault': True,
              'remainingExternalGate': 'select main as default; delete integration/vnext-main-20260811',
          }
          print(json.dumps(result, sort_keys=True))
          if repo['default_branch'] != 'integration/vnext-main-20260811':
              raise SystemExit(f"unexpected default branch transition: {repo['default_branch']}")
          PY
