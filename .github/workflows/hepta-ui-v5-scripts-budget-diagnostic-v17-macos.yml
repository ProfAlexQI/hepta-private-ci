name: Hepta UI v5 scripts budget diagnostic v17 macOS

on:
  push:
    branches:
      - ops/ui-v5-remediation-v17-macos-20260830
    paths:
      - .github/workflows/hepta-ui-v5-scripts-budget-diagnostic-v17-macos.yml

permissions:
  contents: read

concurrency:
  group: hepta-ui-v5-scripts-budget-diagnostic-v17-macos
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.repository == 'ProfHepta/hepta-private-ci'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Measure exact scripts budget semantics and contributors
        shell: bash
        env:
          BASE_SHA: 304143bf362e6cc8369158309b7b9c7c9c3d3868
          BUDGET: '408307'
        run: |
          set -euo pipefail
          base_root="$RUNNER_TEMP/hepta-ui-v5-base"
          git worktree add --detach "$base_root" "$BASE_SHA" >/dev/null
          export BASE_ROOT="$base_root"

          python3 <<'PY'
          from __future__ import annotations

          from collections import defaultdict
          from hashlib import sha256
          import os
          from pathlib import Path

          budget = int(os.environ['BUDGET'])
          roots = {
              'base': Path(os.environ['BASE_ROOT']) / 'scripts',
              'head': Path.cwd() / 'scripts',
          }

          def included_files(root: Path):
              for path in root.rglob('*'):
                  if not path.is_file() or path.is_symlink():
                      continue
                  relative = path.relative_to(root).as_posix()
                  if relative in {
                      'lib/hepta-gate-pair-compat-v2/payloads.bundle.gz',
                      'lib/hepta-gate-pair-compat-v2/templates.jsonl',
                      'lib/hepta-gate-pair-compat-v2/parameters.jsonl',
                  } or relative.startswith('lib/hepta-gate-pair-compat-v2/family-state-v1/'):
                      continue
                  data = path.read_bytes()
                  yield path, relative, data, data.count(b'\n')

          snapshots = {name: list(included_files(root)) for name, root in roots.items()}
          for name, records in snapshots.items():
              total = sum(lines for _, _, _, lines in records)
              archive = sum(lines for _, rel, _, lines in records if rel.startswith('archive/'))
              fixture = sum(
                  lines for _, rel, _, lines in records
                  if rel.startswith('fixtures/') or rel.startswith('testdata/')
              )
              binary = 0
              non_utf8 = 0
              nul = 0
              for _, _, data, lines in records:
                  if b'\0' in data:
                      nul += lines
                  try:
                      data.decode('utf-8')
                  except UnicodeDecodeError:
                      non_utf8 += lines
                  if b'\0' in data:
                      binary += lines
                  else:
                      try:
                          data.decode('utf-8')
                      except UnicodeDecodeError:
                          binary += lines
              text_non_archive = sum(
                  lines for _, rel, data, lines in records
                  if not rel.startswith('archive/')
                  and b'\0' not in data
                  and _is_utf8(data)
              ) if False else 0
              # Keep the predicate explicit instead of relying on platform `file` output.
              text_non_archive = 0
              text_total = 0
              for _, rel, data, lines in records:
                  try:
                      data.decode('utf-8')
                      is_text = b'\0' not in data
                  except UnicodeDecodeError:
                      is_text = False
                  if is_text:
                      text_total += lines
                      if not rel.startswith('archive/'):
                          text_non_archive += lines
              print(f'{name.upper()}_TOTAL={total}')
              print(f'{name.upper()}_OVERAGE={total - budget}')
              print(f'{name.upper()}_ARCHIVE_LINES={archive}')
              print(f'{name.upper()}_FIXTURE_LINES={fixture}')
              print(f'{name.upper()}_BINARY_LINES={binary}')
              print(f'{name.upper()}_NUL_LINES={nul}')
              print(f'{name.upper()}_NON_UTF8_LINES={non_utf8}')
              print(f'{name.upper()}_UTF8_TEXT_LINES={text_total}')
              print(f'{name.upper()}_UTF8_TEXT_NON_ARCHIVE_LINES={text_non_archive}')
              print(f'{name.upper()}_HEADROOM_EXCLUDING_ARCHIVE={budget - (total - archive)}')
              print(f'{name.upper()}_HEADROOM_TEXT_NON_ARCHIVE={budget - text_non_archive}')

          print(f'PR_DELTA={sum(r[3] for r in snapshots["head"]) - sum(r[3] for r in snapshots["base"])}')

          records = snapshots['head']
          by_root = defaultdict(int)
          by_family = defaultdict(int)
          by_suffix = defaultdict(int)
          for _, rel, _, lines in records:
              parts = rel.split('/')
              by_root[parts[0] if len(parts) > 1 else '<root-files>'] += lines
              name = parts[-1]
              if name.endswith('-gate-specs-v1.json'):
                  by_family['gate-specs-v1-json'] += lines
              elif name.endswith('-route-gate-specs-v1.json'):
                  by_family['route-gate-specs-v1-json'] += lines
              elif name.startswith('i3-') and name.endswith('.sh'):
                  by_family['i3-long-path-materializations'] += lines
              elif name.endswith('.json'):
                  by_family['other-json'] += lines
              elif name.endswith('.sh'):
                  by_family['shell'] += lines
              else:
                  by_family['other'] += lines
              suffix = ''.join(Path(name).suffixes) or '<none>'
              by_suffix[suffix] += lines

          print('\n=== TOP-LEVEL SCRIPT LINE GROUPS ===')
          for key, value in sorted(by_root.items(), key=lambda item: (-item[1], item[0])):
              print(f'{value:9d}  {key}')
          print('\n=== SEMANTIC FILE FAMILIES ===')
          for key, value in sorted(by_family.items(), key=lambda item: (-item[1], item[0])):
              print(f'{value:9d}  {key}')
          print('\n=== SUFFIX GROUPS ===')
          for key, value in sorted(by_suffix.items(), key=lambda item: (-item[1], item[0]))[:40]:
              print(f'{value:9d}  {key}')

          print('\n=== LARGEST INCLUDED FILES ===')
          for _, rel, data, lines in sorted(records, key=lambda row: (-row[3], row[1]))[:180]:
              try:
                  data.decode('utf-8')
                  kind = 'text' if b'\0' not in data else 'binary-nul'
              except UnicodeDecodeError:
                  kind = 'binary-nonutf8'
              print(f'{lines:9d}  {kind:14s}  {rel}')

          groups = defaultdict(list)
          for _, rel, data, lines in records:
              groups[sha256(data).hexdigest()].append((rel, lines))
          duplicates = []
          for members in groups.values():
              if len(members) < 2:
                  continue
              lines = max(value for _, value in members)
              duplicates.append((lines * (len(members) - 1), lines, members))
          print('\n=== EXACT DUPLICATE CONTENT GROUPS ===')
          for redundant, lines, members in sorted(duplicates, key=lambda row: (-row[0], row[2][0]))[:100]:
              print(f'redundant={redundant:7d} each={lines:6d} copies={len(members):3d}')
              for rel, _ in members[:20]:
                  print(f'  {rel}')
              if len(members) > 20:
                  print(f'  ... {len(members) - 20} more')
          PY

          printf '\n=== Architecture gate first failure on unmodified PR head ===\n'
          set +e
          scripts/hepta-architecture-budget verify
          status=$?
          set -e
          printf 'ARCHITECTURE_GATE_EXIT=%s\n' "$status"
          test "$status" -ne 0
