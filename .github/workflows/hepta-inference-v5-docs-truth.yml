name: Hepta inference V5 documentation truth qualification

on:
  push:
    branches:
      - codex/hepta-inference-v5-runtime-integration-20260830
    paths:
      - .github/workflows/hepta-inference-v5-docs-truth.yml

permissions:
  contents: read

concurrency:
  group: hepta-inference-v5-docs-truth
  cancel-in-progress: false

jobs:
  docs-truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'

      - name: Compile and run V5 source truth
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/hepta-inference-v5-source-truth.py
          rm -rf scripts/__pycache__
          python3 scripts/hepta-inference-v5-source-truth.py \
            | tee "$RUNNER_TEMP/hepta-inference-v5-source-truth.json"
          python3 - "$RUNNER_TEMP/hepta-inference-v5-source-truth.json" <<'PY'
          import json
          import pathlib
          import sys

          receipt = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert receipt["plan_id"] == "HEPTA-INFERENCE-RUNTIME-V5"
          assert receipt["source_components_present"] is True
          assert receipt["source_runtime_integrated"] is False
          assert receipt["source_candidate_qualified"] is False
          assert receipt["real_provider_executed"] is False
          assert receipt["real_native_model_executed"] is False
          assert receipt["hardware_qualified"] is False
          assert receipt["product_shadow_wired"] is False
          assert receipt["operator_accepted"] is False
          assert receipt["promoted"] is False
          assert receipt["released"] is False
          PY
          test -z "$(git status --porcelain)"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-v5-docs-truth-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-inference-v5-source-truth.json
          if-no-files-found: error
          retention-days: 30
