name: AuthBus P1.3 exact source publisher slim fallback

on:
  push:
    branches:
      - codex/authbus-p1-3-gap-closure-20260829
    paths:
      - .github/workflows/authbus-p1-3-final-closure-slim.yml

concurrency:
  group: authbus-p1-3-exact-source-publisher-slim
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish exact 29-path source on slim fallback
    runs-on: ubuntu-slim
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      CARGO_TARGET_DIR: /tmp/authbus-p1-3-source-publisher-target
    steps:
      - name: Checkout exact publisher seed
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Install Rust 1.95 for lockfile and rustfmt
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Rebind publisher and defer executable gates to source head
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/authbus-p1-3-final-closure.sh")
          source = path.read_text(encoding="utf-8")
          replacements = (
              (
                  "EXPECTED_PARENT=3c44c4d1ee9faaf66a1bd81a7cb2f676974a9f74",
                  "EXPECTED_PARENT=86d12beb13ec361e10105d189774ccd7360f1540",
                  1,
                  "exact publisher parent",
              ),
              (
                  "codex/authbus-p1-3-clean-replay-20260830",
                  "codex/authbus-p1-3-clean-replay-v2-20260830",
                  2,
                  "isolated target branch",
              ),
              (
                  "('runs-on: ubuntu-slim', 'runs-on: macos-15-arm64', 4, 'hosted runner'),",
                  "('runs-on: ubuntu-slim', 'runs-on: ubuntu-slim', 4, 'hosted runner'),",
                  1,
                  "qualification hosted runner",
              ),
          )
          for before, after, expected, label in replacements:
              count = source.count(before)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} anchors, found {count}")
              source = source.replace(before, after)

          runner_anchor = "    ('runs-on: ubuntu-slim', 'runs-on: ubuntu-slim', 4, 'hosted runner'),\n"
          trigger_insertion = (
              runner_anchor
              + "    ('      - codex-rs/hepta-authbus-p0-3-qualification/src/scheduler.rs',\n"
              + "     '      - codex-rs/hepta-authbus-p0-3-qualification/src/lib.rs\\n"
              + "      - codex-rs/hepta-authbus-p0-3-qualification/src/scheduler.rs',\n"
              + "     1, 'P0.3 inline assertion trigger path'),\n"
          )
          if source.count(runner_anchor) != 1:
              raise SystemExit("P0.3 trigger insertion: hosted-runner anchor is not unique")
          source = source.replace(runner_anchor, trigger_insertion)

          start_marker = 'log "run P0.2 through P1.3 executable matrices"\n'
          end_marker = 'log "revalidate inherited source contracts"\n'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit("source-publisher gate-defer anchors are not unique")
          start = source.index(start_marker)
          end = source.index(end_marker)
          if end <= start:
              raise SystemExit("source-publisher gate-defer anchors are reversed")
          source = (
              source[:start]
              + 'log "defer executable matrices and strict Clippy to exact source-head qualification"\n'
              + source[end:]
          )
          path.write_text(source, encoding="utf-8")
          PY
          bash -n scripts/authbus-p1-3-final-closure.sh
          grep -Fq 'EXPECTED_PARENT=86d12beb13ec361e10105d189774ccd7360f1540' \
            scripts/authbus-p1-3-final-closure.sh
          grep -Fq 'TARGET_BRANCH=codex/authbus-p1-3-clean-replay-v2-20260830' \
            scripts/authbus-p1-3-final-closure.sh
          grep -Fq 'defer executable matrices and strict Clippy to exact source-head qualification' \
            scripts/authbus-p1-3-final-closure.sh

      - name: Materialize, format, verify, and publish source-only candidate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/authbus-p1-3-final-closure.sh
