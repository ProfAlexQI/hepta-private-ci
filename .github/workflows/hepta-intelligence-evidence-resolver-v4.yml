name: hepta-intelligence-evidence-resolver-v5

on:
  push:
    branches:
      - "codex/hepta-intelligence-evidence-resolver-v4-*"
    paths:
      - "codex-rs/ext/hepta-memory/src/cognitive/evidence_resolver_v4.rs"
      - "codex-rs/ext/hepta-memory/src/cognitive/evidence_resolver_v4/**"
      - "codex-rs/ext/hepta-memory/src/framing.rs"
      - "scripts/verify-hepta-intelligence-evidence-resolver-v4.py"
      - "scripts/check-hepta-intelligence-p0-3-3-clippy.py"
      - "scripts/run-hepta-intelligence-evidence-resolver-v5.py"
      - "plans/hepta-intelligence/HEPTA_INTELLIGENCE_KG_DEVELOPMENT_PLAN_V3_2_2026-08-28.md"
      - "plans/hepta-intelligence/HEPTA_INTELLIGENCE_KG_EXECUTION_STATUS_V3_2.json"
      - "plans/hepta-intelligence/HEPTA_INTELLIGENCE_P0_3_3_HOST_EVIDENCE_RESOLVER_2026-08-28.md"
      - ".github/workflows/hepta-intelligence-evidence-resolver-v4.yml"
  pull_request:
    paths:
      - "codex-rs/ext/hepta-memory/src/cognitive/evidence_resolver_v4.rs"
      - "codex-rs/ext/hepta-memory/src/cognitive/evidence_resolver_v4/**"
      - "codex-rs/ext/hepta-memory/src/framing.rs"
      - "scripts/verify-hepta-intelligence-evidence-resolver-v4.py"
      - "scripts/check-hepta-intelligence-p0-3-3-clippy.py"
      - "scripts/run-hepta-intelligence-evidence-resolver-v5.py"
      - "plans/hepta-intelligence/HEPTA_INTELLIGENCE_KG_DEVELOPMENT_PLAN_V3_2_2026-08-28.md"
      - "plans/hepta-intelligence/HEPTA_INTELLIGENCE_KG_EXECUTION_STATUS_V3_2.json"
      - "plans/hepta-intelligence/HEPTA_INTELLIGENCE_P0_3_3_HOST_EVIDENCE_RESOLVER_2026-08-28.md"
      - ".github/workflows/hepta-intelligence-evidence-resolver-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-intelligence-evidence-resolver-v5-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  exact-head-qualification:
    name: P0.3.3 exact-head host evidence resolver qualification v5
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Run every fail-closed gate
        shell: bash
        run: python3 scripts/run-hepta-intelligence-evidence-resolver-v5.py

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-intelligence-p0-3-3-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: artifacts/hepta-intelligence-evidence-resolver-v5
          if-no-files-found: error
          retention-days: 21

      - name: Enforce exact-head receipt
        if: always()
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path(
              "artifacts/hepta-intelligence-evidence-resolver-v5/qualification-receipt.json"
          ).read_text(encoding="utf-8"))
          assert receipt["repository"] == "ProfHepta/hepta-private-ci"
          assert receipt["head"] == os.environ["EXPECTED_HEAD"]
          assert receipt["p0_3_2_dependency_qualified"] is True
          assert receipt["host_resolves_offsets"] is True
          assert receipt["host_computes_digests"] is True
          assert receipt["qualified"] is True
          assert receipt["qualification_platform"] == "linux_exact_head"
          assert receipt["checks"]
          assert all(
              check["passed"] is True and check["exit_code"] == 0
              for check in receipt["checks"]
          )
          for key in (
              "wired",
              "tool_v4_registered",
              "default_projection_pointer_changed",
              "default_recall_query_changed",
              "production_projection_gate",
              "production_authority",
              "external_effects",
              "operator_accepted",
              "promoted",
              "callers_ratchet",
          ):
              assert receipt[key] is False, key
          PY
