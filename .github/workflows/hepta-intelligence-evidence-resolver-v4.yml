name: hepta-intelligence-evidence-resolver-v4

on:
  push:
    branches:
      - "codex/hepta-intelligence-evidence-resolver-v4-*"
  pull_request:
    paths:
      - "codex-rs/ext/hepta-memory/src/cognitive/evidence_resolver_v4.rs"
      - "codex-rs/ext/hepta-memory/src/cognitive/evidence_resolver_v4/**"
      - "codex-rs/ext/hepta-memory/src/framing.rs"
      - "scripts/verify-hepta-intelligence-evidence-resolver-v4.py"
      - "plans/hepta-intelligence/HEPTA_INTELLIGENCE_KG_DEVELOPMENT_PLAN_V3_2_2026-08-28.md"
      - "plans/hepta-intelligence/HEPTA_INTELLIGENCE_KG_EXECUTION_STATUS_V3_2.json"
      - "plans/hepta-intelligence/HEPTA_INTELLIGENCE_P0_3_3_HOST_EVIDENCE_RESOLVER_2026-08-28.md"
      - ".github/workflows/hepta-intelligence-evidence-resolver-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-intelligence-evidence-resolver-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: P0.3.3 host evidence resolver source contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate Python and machine documents
        run: |
          python3 -m py_compile \
            scripts/verify-hepta-intelligence-evidence-resolver-v4.py
          python3 -m json.tool \
            plans/hepta-intelligence/HEPTA_INTELLIGENCE_KG_EXECUTION_STATUS_V3_2.json \
            >/dev/null

      - name: Run fail-closed P0.3.3 source gate
        run: |
          set -o pipefail
          mkdir -p artifacts/hepta-intelligence-evidence-resolver-v4
          python3 scripts/verify-hepta-intelligence-evidence-resolver-v4.py \
            | tee artifacts/hepta-intelligence-evidence-resolver-v4/source-gate.json

      - name: Verify source-only authority boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path(
                  "artifacts/hepta-intelligence-evidence-resolver-v4/source-gate.json"
              ).read_text(encoding="utf-8")
          )
          assert receipt["status"] == (
              "PASS_P0_3_3_HOST_EVIDENCE_RESOLVER_SOURCE_ONLY"
          )
          assert receipt["host_resolves_offsets"] is True
          assert receipt["host_computes_digests"] is True
          for key in (
              "model_supplies_offsets",
              "model_supplies_digests",
              "tool_v4_registered",
              "p0_3_2_dependency_qualified",
              "production_projection_gate",
              "production_authority",
              "external_effects",
              "operator_acceptance",
              "promotion",
              "callers_ratchet",
          ):
              assert receipt[key] is False, key
          PY

      - name: Upload source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepta-intelligence-evidence-resolver-v4-source-${{ github.sha }}
          path: artifacts/hepta-intelligence-evidence-resolver-v4/source-gate.json
          if-no-files-found: error
          retention-days: 14

  rust-qualification:
    name: P0.3.3 host evidence resolver Rust qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Check P0.3.3 candidate formatting
        working-directory: codex-rs
        run: |
          rustfmt --edition 2024 --check \
            ext/hepta-memory/src/framing.rs \
            ext/hepta-memory/src/cognitive/evidence_resolver_v4.rs \
            ext/hepta-memory/src/cognitive/evidence_resolver_v4/receipt.rs \
            ext/hepta-memory/src/cognitive/evidence_resolver_v4/resolver.rs \
            ext/hepta-memory/src/cognitive/evidence_resolver_v4/schema.rs \
            ext/hepta-memory/src/cognitive/evidence_resolver_v4/support.rs \
            ext/hepta-memory/src/cognitive/evidence_resolver_v4/tests.rs

      - name: Run host evidence resolver tests
        working-directory: codex-rs
        env:
          CARGO_TERM_COLOR: always
        run: cargo test -p codex-hepta-memory-extension evidence_resolver_v4 -- --nocapture

      - name: Run core grounding compatibility tests
        working-directory: codex-rs
        env:
          CARGO_TERM_COLOR: always
        run: cargo test -p codex-hepta-memory fact_grounding -- --nocapture

      - name: Run full memory-extension tests
        working-directory: codex-rs
        env:
          CARGO_TERM_COLOR: always
        run: cargo test -p codex-hepta-memory-extension

      - name: Run full hepta-memory tests
        working-directory: codex-rs
        env:
          CARGO_TERM_COLOR: always
        run: cargo test -p codex-hepta-memory

      - name: Run strict extension clippy
        working-directory: codex-rs
        env:
          CARGO_TERM_COLOR: always
        run: cargo clippy -p codex-hepta-memory-extension --all-targets -- -D warnings

      - name: Run strict core clippy
        working-directory: codex-rs
        env:
          CARGO_TERM_COLOR: always
        run: cargo clippy -p codex-hepta-memory --all-targets -- -D warnings
