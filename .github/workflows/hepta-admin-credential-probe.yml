name: Hepta admin credential wiring probe

on:
  push:
    branches:
      - integration/vnext-main-20260811
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: List referenced secret names and app-token actions
        shell: bash
        run: |
          set -euo pipefail
          echo '=== REFERENCED SECRET NAMES ==='
          grep -RhoE 'secrets\.[A-Za-z0-9_]+' .github/workflows .github/actions 2>/dev/null | sort -u || true
          echo '=== APP TOKEN ACTIONS ==='
          grep -RniE 'create-github-app-token|tibdex/github-app-token|github-app-token|APP_ID|PRIVATE_KEY|PAT|ADMIN_TOKEN|BOT_TOKEN' .github/workflows .github/actions 2>/dev/null || true
