name: Hepta inference V4 agent S1a materialize

on:
  push:
    branches:
      - agent/hepta-inference-v4-s1-staging-20260830
    paths:
      - .github/workflows/hepta-inference-v4-agent-s1a-materialize.yml

permissions:
  contents: write

concurrency:
  group: hepta-inference-v4-agent-s1a-materialize
  cancel-in-progress: false

jobs:
  materialize-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/hepta-inference-v4-s1-staging-20260830
          persist-credentials: true
          fetch-depth: 0

      - name: Guard exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 521d910b818ac447a5f7ba71695b8714ec0bb818
          test "$(git branch --show-current)" = agent/hepta-inference-v4-s1-staging-20260830
          test -z "$(git status --porcelain)"

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Apply deterministic S1a source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/hepta-inference-v4-agent-s1a-materialize.py \
            scripts/hepta-inference-v4-agent-s1a-fix.py
          python3 scripts/hepta-inference-v4-agent-s1a-materialize.py
          python3 scripts/hepta-inference-v4-agent-s1a-fix.py
          git diff --check

      - name: Materialize lock and execute core gates
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 > "$RUNNER_TEMP/s1a-metadata-unlocked.json"
          cargo fmt -p codex-hepta-infer-core
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/s1a-metadata-locked.json"
          cargo check --locked --all-targets -p codex-hepta-infer-core
          cargo test --locked --all-targets -p codex-hepta-infer-core -- --test-threads=1
          cargo clippy --locked --all-targets --no-deps \
            -p codex-hepta-infer-core -- -D warnings

      - name: Enforce scope and create ordinary source commit
        shell: bash
        run: |
          set -euo pipefail
          rm \
            scripts/hepta-inference-v4-agent-s1a-materialize.py \
            scripts/hepta-inference-v4-agent-s1a-fix.py \
            .github/workflows/hepta-inference-v4-agent-s1a-materialize.yml \
            .github/workflows/hepta-inference-v4-agent-source-export.yml
          python3 - <<'PY'
          import subprocess

          allowed = {
              "codex-rs/Cargo.toml",
              "codex-rs/Cargo.lock",
              "codex-rs/hepta-infer-core/Cargo.toml",
              ".github/workflows/hepta-inference-v4-agent-s1a-materialize.yml",
              ".github/workflows/hepta-inference-v4-agent-source-export.yml",
              "scripts/hepta-inference-v4-agent-s1a-materialize.py",
              "scripts/hepta-inference-v4-agent-s1a-fix.py",
          }
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "-z"], text=False
          ).decode().split("\0")
          unexpected = [
              path for path in changed
              if path
              and path not in allowed
              and not path.startswith("codex-rs/hepta-infer-core/src/")
          ]
          if unexpected:
              raise SystemExit("unexpected S1a paths: " + ", ".join(unexpected))
          required = {
              "codex-rs/hepta-infer-core/src/capability.rs",
              "codex-rs/hepta-infer-core/src/private_protocol.rs",
              "codex-rs/hepta-infer-core/src/lib.rs",
              "codex-rs/hepta-infer-core/Cargo.toml",
              "codex-rs/Cargo.toml",
              "codex-rs/Cargo.lock",
          }
          missing = sorted(required - set(path for path in changed if path))
          if missing:
              raise SystemExit("missing required S1a changes: " + ", ".join(missing))
          PY
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name "Qian QI"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git commit -m "feat(inference): add replay-safe grants and private protocol"

      - name: Re-run clean locked source gates
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          (
            cd codex-rs
            cargo fmt -p codex-hepta-infer-core -- --check
            cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/s1a-final-metadata.json"
            cargo check --locked --all-targets -p codex-hepta-infer-core
            cargo test --locked --all-targets -p codex-hepta-infer-core -- --test-threads=1
            cargo clippy --locked --all-targets --no-deps \
              -p codex-hepta-infer-core -- -D warnings
          )
          test -z "$(git status --porcelain)"

      - name: Push qualified source commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/agent/hepta-inference-v4-s1-staging-20260830
