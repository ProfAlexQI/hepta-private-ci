name: Hepta inference V4 unified source export x64

on:
  push:
    branches:
      - ops/hepta-inference-v4-unified-source-export-x64-20260830
    paths:
      - .github/workflows/hepta-inference-v4-unified-source-export-x64.yml

permissions:
  contents: read

concurrency:
  group: hepta-inference-v4-unified-source-export-x64
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: e9f0442e8da3b8d18cdbc11ed0aae4fdb5e291aa
          persist-credentials: false
          fetch-depth: 2

      - name: Verify and archive exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e9f0442e8da3b8d18cdbc11ed0aae4fdb5e291aa
          test "$(git rev-parse 'HEAD^{tree}')" = d8d70040fe12766c0a40dcf7707066bbfb6451dc
          test -z "$(git status --porcelain)"
          git archive --format=tar.gz \
            --output="$RUNNER_TEMP/hepta-private-ci-e9f0442.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/hepta-private-ci-e9f0442.tar.gz" \
            > "$RUNNER_TEMP/hepta-private-ci-e9f0442.tar.gz.sha256"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-v4-unified-source-e9f0442-x64
          path: |
            ${{ runner.temp }}/hepta-private-ci-e9f0442.tar.gz
            ${{ runner.temp }}/hepta-private-ci-e9f0442.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3
