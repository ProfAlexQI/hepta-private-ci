name: Hepta automation operation tests finalize once

on:
  push:
    branches:
      - codex/hepta-architecture-convergence-p0-2-20260828
    paths:
      - .github/workflows/hepta-automation-operation-tests-finalize-once.yml

permissions:
  contents: write

concurrency:
  group: hepta-automation-operation-tests-finalize-once
  cancel-in-progress: false

jobs:
  finalize:
    name: Bind Automation integration fixtures to operation receipts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/hepta-architecture-convergence-p0-2-20260828
          fetch-depth: 2

      - name: Verify expected stale integration-test blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object codex-rs/hepta-automation/tests/automation.rs)" = "45e9da6fad70fb0bdcb85eaedc723e21c25667e3"

      - name: Materialize operation-bound Automation test fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-automation/tests/automation.rs")
          text = path.read_text()

          def replace_exact(old: str, new: str, expected: int = 1) -> None:
              global text
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(
                      f"expected {expected} occurrences, found {actual}: {old[:120]!r}"
                  )
              text = text.replace(old, new)

          replace_exact(
              "use codex_hepta_automation::AutomationFuture;\n",
              "use codex_hepta_automation::AutomationFuture;\n"
              "use codex_hepta_automation::AutomationLease;\n"
              "use codex_hepta_automation::AutomationOperationContext;\n"
              "use codex_hepta_automation::AutomationTask;\n",
          )
          replace_exact(
              "use codex_hepta_contracts::AgentId;\n",
              "use codex_hepta_contracts::AgentId;\n"
              "use codex_hepta_contracts::DestinationAcknowledgement;\n"
              "use codex_hepta_contracts::Sha256Digest;\n",
          )

          replace_exact(
              '''            Ok(AutomationQueueReceipt {
                  queued_submission_id: format!(
                      "queue-{}-{}",
                      admission.task_id, admission.occurrence
                  ),
                  client_user_message_id: admission.client_user_message_id,
              })''',
              '''            queue_receipt(
                  &admission,
                  format!("queue-{}-{}", admission.task_id, admission.occurrence),
              )''',
              expected=2,
          )
          replace_exact(
              '''            Ok(AutomationQueueReceipt {
                  queued_submission_id: format!(
                      "accepted-{}-{}",
                      admission.task_id, admission.occurrence
                  ),
                  client_user_message_id: admission.client_user_message_id,
              })''',
              '''            queue_receipt(
                  &admission,
                  format!("accepted-{}-{}", admission.task_id, admission.occurrence),
              )''',
          )

          scheduler_calls = text.count("AutomationScheduler::new(")
          if scheduler_calls != 11:
              raise SystemExit(f"expected 11 stale scheduler constructors, found {scheduler_calls}")
          text = text.replace("AutomationScheduler::new(", "test_scheduler(")

          replace_exact(
              '''    restarted
                  .mark_submitted(
                      &lease,
                      &AutomationQueueReceipt {
                          queued_submission_id: "retry-after-abort".to_string(),
                          client_user_message_id: lease.client_user_message_id.clone(),
                      },
                      102,
                  )
                  .await
                  .expect("complete retry");''',
              '''    persist_submitted(&restarted, &lease, "retry-after-abort", 102)
                  .await
                  .expect("complete retry");''',
          )
          replace_exact(
              '''    store
                  .mark_submitted(
                      &lease,
                      &AutomationQueueReceipt {
                          queued_submission_id: "negative-proof-retry-receipt".to_string(),
                          client_user_message_id: lease.client_user_message_id.clone(),
                      },
                      101,
                  )
                  .await
                  .expect("retry submission");''',
              '''    persist_submitted(&store, &lease, "negative-proof-retry-receipt", 101)
                  .await
                  .expect("retry submission");''',
          )
          replace_exact(
              '''    migrated
                  .mark_submitted(
                      &lease,
                      &AutomationQueueReceipt {
                          queued_submission_id: "migration-receipt".to_string(),
                          client_user_message_id: lease.client_user_message_id.clone(),
                      },
                      101,
                  )
                  .await
                  .expect("write migrated outcome");''',
              '''    persist_submitted(&migrated, &lease, "migration-receipt", 101)
                  .await
                  .expect("write migrated outcome");''',
          )
          replace_exact(
              '''    let submitted = store
                  .mark_submitted(
                      &lease,
                      &AutomationQueueReceipt {
                          queued_submission_id: "queue-in-flight".to_string(),
                          client_user_message_id: lease.client_user_message_id.clone(),
                      },
                      103,
                  )
                  .await
                  .expect("finish admitted occurrence");''',
              '''    let submitted = persist_submitted(&store, &lease, "queue-in-flight", 103)
                  .await
                  .expect("finish admitted occurrence");''',
          )

          replace_exact(
              '''    let receipt = AutomationQueueReceipt {
                  queued_submission_id: "provider-receipt-unknown-recovered".to_string(),
                  client_user_message_id: uncertain[0].client_user_message_id.clone(),
              };''',
              '''    let admission = queue
                  .admissions()
                  .await
                  .into_iter()
                  .next()
                  .expect("captured uncertain admission");
              let receipt = queue_receipt(
                  &admission,
                  "provider-receipt-unknown-recovered".to_string(),
              )
              .expect("operation-bound reconciliation receipt");''',
          )

          replace_exact(
              '''    let receipt = |lease: &codex_hepta_automation::AutomationLease| AutomationQueueReceipt {
                  queued_submission_id: "provider-receipt-shared".to_string(),
                  client_user_message_id: lease.client_user_message_id.clone(),
              };
              store
                  .mark_submitted(&first_lease, &receipt(&first_lease), 101)
                  .await
                  .expect("first receipt");
              assert_eq!(
                  store
                      .mark_submitted(&second_lease, &receipt(&second_lease), 102)
                      .await,
                  Err(AutomationError::Conflict)
              );''',
              '''    persist_submitted(&store, &first_lease, "provider-receipt-shared", 101)
                  .await
                  .expect("first receipt");
              assert_eq!(
                  persist_submitted(&store, &second_lease, "provider-receipt-shared", 102).await,
                  Err(AutomationError::Conflict)
              );''',
          )

          replace_exact("assert_eq!(schema, 3);", "assert_eq!(schema, 4);")
          replace_exact("admissions[0].agent_id", "admissions[0].owner_agent_id")

          if "AutomationQueueReceipt {" in text:
              raise SystemExit("stale AutomationQueueReceipt literal remains")
          if ".mark_submitted(" in text:
              raise SystemExit("stale direct mark_submitted call remains")
          if "AutomationScheduler::new(" in text:
              raise SystemExit("stale scheduler constructor remains")

          helper_marker = "\n#[tokio::test]\nasync fn one_shot_periodic_disable_and_cancel_are_durable()"
          helpers = r'''

          #[allow(
              clippy::expect_used,
              reason = "operation-bound integration fixtures must fail loudly"
          )]
          fn operation_context(generation: u64) -> AutomationOperationContext {
              let fence = format!("hepta:test:automation-operation-fence:v1:{generation}");
              AutomationOperationContext::new(
                  1,
                  generation,
                  generation,
                  Sha256Digest::for_bytes(fence.as_bytes()),
              )
              .expect("valid operation context")
          }

          fn queue_receipt(
              admission: &AutomationAdmission,
              queued_submission_id: String,
          ) -> Result<AutomationQueueReceipt, AutomationError> {
              let destination_receipt_sha256 = Sha256Digest::for_bytes(
                  format!(
                      "hepta:app-server-queue-receipt:v1\\0{}\\0{}",
                      queued_submission_id, admission.client_user_message_id
                  )
                  .as_bytes(),
              );
              let acknowledgement = DestinationAcknowledgement::committed(
                  &admission.operation,
                  destination_receipt_sha256,
              )
              .map_err(|_| AutomationError::Conflict)?;
              Ok(AutomationQueueReceipt {
                  queued_submission_id,
                  client_user_message_id: admission.client_user_message_id.clone(),
                  acknowledgement,
              })
          }

          fn test_scheduler<Q>(
              store: AutomationStore,
              queue: Arc<Q>,
              generation: u64,
              lease_duration: Duration,
              dispatch_timeout: Duration,
          ) -> Result<AutomationScheduler<Q>, AutomationError>
          where
              Q: AutomationTurnQueue,
          {
              AutomationScheduler::new(
                  store,
                  queue,
                  generation,
                  operation_context(generation),
                  lease_duration,
                  dispatch_timeout,
              )
          }

          async fn persist_submitted(
              store: &AutomationStore,
              lease: &AutomationLease,
              queued_submission_id: &str,
              submitted_at_ms: u64,
          ) -> Result<AutomationTask, AutomationError> {
              let admission = lease.admission(&operation_context(lease.lease_generation))?;
              store
                  .record_dispatch_uncertain(lease, &admission.operation, submitted_at_ms)
                  .await?;
              let receipt = queue_receipt(&admission, queued_submission_id.to_string())?;
              store
                  .mark_submitted(lease, &admission.operation, &receipt, submitted_at_ms)
                  .await
          }
          '''
          if text.count(helper_marker) != 1:
              raise SystemExit("one-shot test marker drifted")
          text = text.replace(helper_marker, helpers + helper_marker)
          path.write_text(text)
          PY

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Format and execute Automation integration closure
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -p codex-hepta-automation
          cargo test --locked -p codex-hepta-automation --test automation -- --nocapture
          cargo clippy --locked -p codex-hepta-automation --all-targets -- -D warnings

      - name: Commit tested fixture closure and retire finalizer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hepta-automation-operation-tests-finalize-once.yml
          allowed='^codex-rs/hepta-automation/tests/automation.rs$|^\.github/workflows/hepta-automation-operation-tests-finalize-once.yml$'
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { printf 'unexpected paths:\n%s\n' "$unexpected" >&2; exit 1; }
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codex-rs/hepta-automation/tests/automation.rs .github/workflows/hepta-automation-operation-tests-finalize-once.yml
          git commit -m 'test(hepta): bind automation fixtures to operation receipts'
          git push origin HEAD:codex/hepta-architecture-convergence-p0-2-20260828
