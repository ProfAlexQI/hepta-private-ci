name: Hepta inference V4 unified repository-source closure

on:
  push:
    branches:
      - codex/hepta-inference-v4-full-closure-chatgpt-20260830
    paths:
      - .github/workflows/hepta-inference-v4-full-closure-chatgpt.yml

permissions:
  contents: write

concurrency:
  group: hepta-inference-v4-full-closure-chatgpt
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  materialize-qualify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact isolated closure branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/hepta-inference-v4-full-closure-chatgpt-20260830
          persist-credentials: true
          fetch-depth: 2

      - name: Guard exact branch, head, parent, and clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/hepta-inference-v4-full-closure-chatgpt-20260830
          test "$(git branch --show-current)" = "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 5743dd9daedff4f883bfa5b101711e827b61c1eb
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Verify immutable payload and staged-source identities
        shell: bash
        run: |
          set -euo pipefail
          verify_blob() {
            local expected="$1"
            local path="$2"
            local actual
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "blob drift: $path expected=$expected actual=$actual" >&2
              exit 1
            }
          }
          verify_blob e8cfe121a9bfb4922b2569eeb43145f5409b892b tools/hepta-inference-v4-payloads/inf-s1.yml
          verify_blob 3a67a0304309f2c9a5012821f7e609a34d569382 tools/hepta-inference-v4-payloads/inf-s2.yml
          verify_blob d93b5e1ddd02a18bbd594a1391914f71b2f9d821 tools/hepta-inference-v4-payloads/inf-s3.yml
          verify_blob 44d2873103661bdc09ca5a104f759ecbd434c096 tools/hepta-inference-v4-payloads/inf-s4.yml
          verify_blob ffd33e5e0026392145c1b907a71f277bebfc62b1 tools/hepta-inference-v4-payloads/inf-r1.yml
          verify_blob ad61f35edc9ca7ab9e6189984f2fe5c16a653811 tools/hepta-inference-v4-payloads/inf-r2-chain.yml
          verify_blob 2999218118c07a348449662bcf6a731be01d66c1 tools/hepta-inference-v4-payloads/inf-r3.yml
          verify_blob a2d7676a68e13f388a1445348b418328b8ccde61 codex-rs/hepta-infer-worker-host/Cargo.toml
          verify_blob 41d1c53dc472dc271067a68f7de63c133fd877fe codex-rs/hepta-infer-worker-host/src/lib.rs
          verify_blob a992fc9070927a8e01d06a4fb23330cec7d558ac codex-rs/hepta-infer-client/src/shadow_bridge.rs
          python3 -m py_compile tools/hepta-inference-v4-payloads/apply_payload_steps.py

      - name: Materialize only allow-listed package source steps
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/hepta-inference-v4-payloads/apply_payload_steps.py

      - name: Harden sequence arithmetic and cross-package invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          host = Path("codex-rs/hepta-infer-worker-host/src/lib.rs")
          source = host.read_text(encoding="utf-8")

          token_marker = """        self.write(&WorkerFrame::Submit {
              request_id: request_id.clone(),
          """
          token_insert = """        let expected_token_sequence = initial_sequence
              .checked_add(1)
              .ok_or(WorkerHostError::Config)?;
              self.write(&WorkerFrame::Submit {
              request_id: request_id.clone(),
          """
          if source.count(token_marker) != 1:
              raise SystemExit("unexpected worker submit marker")
          source = source.replace(token_marker, token_insert, 1)
          old = "sequence == initial_sequence.saturating_add(1)"
          if source.count(old) != 1:
              raise SystemExit("unexpected worker token sequence marker")
          source = source.replace(old, "sequence == expected_token_sequence", 1)

          result_marker = """        let expected_result_digest = next_token_chain_digest(
          """
          result_insert = """        let expected_complete_sequence = token_sequence
              .checked_add(1)
              .ok_or(WorkerHostError::ProtocolFence)?;
              let expected_result_digest = next_token_chain_digest(
          """
          if source.count(result_marker) != 1:
              raise SystemExit("unexpected worker result marker")
          source = source.replace(result_marker, result_insert, 1)
          old = "sequence == token_sequence.saturating_add(1)"
          if source.count(old) != 1:
              raise SystemExit("unexpected worker complete sequence marker")
          source = source.replace(old, "sequence == expected_complete_sequence", 1)
          if ".saturating_add(1)" in source:
              raise SystemExit("saturating sequence arithmetic remains in worker host")
          host.write_text(source, encoding="utf-8")

          tests = Path("codex-rs/hepta-infer-worker-host/tests/process.rs")
          source = tests.read_text(encoding="utf-8")
          test_name = "initial_sequence_overflow_is_rejected_before_worker_dispatch"
          if test_name not in source:
              source += r'''

          #[tokio::test]
          async fn initial_sequence_overflow_is_rejected_before_worker_dispatch() {
              let mut worker = spawn("success", Duration::from_secs(2)).await;
              assert_eq!(
                  worker
                      .submit_fixture(
                          must(RequestId::parse("request-worker-sequence-overflow")),
                          2,
                          u64::MAX,
                          digest('e'),
                          digest('b'),
                          digest('c'),
                          8,
                      )
                      .await,
                  Err(WorkerHostError::Config)
              );
              must(worker.shutdown().await);
          }
          '''
          tests.write_text(source, encoding="utf-8")

          required_files = (
              "codex-rs/hepta-infer-core/src/capability.rs",
              "codex-rs/hepta-infer-core/src/scheduler.rs",
              "codex-rs/hepta-infer-core/tests/running_cancel.rs",
              "codex-rs/hepta-infer-client/src/shadow_bridge.rs",
              "codex-rs/hepta-inferd/src/private_control.rs",
              "codex-rs/hepta-inferd/src/cancel_supervisor.rs",
              "codex-rs/hepta-inferd/src/receipt_retention.rs",
              "codex-rs/hepta-inferd/src/provider_host.rs",
              "codex-rs/hepta-infer-worker-host/src/protocol.rs",
              "codex-rs/hepta-infer-worker-host/src/abi.rs",
          )
          for required in required_files:
              if not Path(required).is_file():
                  raise SystemExit(f"required materialized source missing: {required}")

          structural_markers = {
              "codex-rs/hepta-infer-core/src/lib.rs": (
                  "mod capability;",
                  "mod scheduler;",
                  "pub use controller::RunningCancelPhase;",
                  "pub use controller::initial_token_chain_digest;",
                  "pub use scheduler::DeterministicScheduler;",
              ),
              "codex-rs/hepta-infer-client/src/lib.rs": (
                  "mod shadow_bridge;",
                  "pub use shadow_bridge::ProductShadowBridge;",
              ),
              "codex-rs/hepta-inferd/src/lib.rs": (
                  "mod cancel_supervisor;",
                  "mod private_control;",
                  "mod provider_host;",
                  "mod receipt_retention;",
              ),
              "codex-rs/Cargo.toml": (
                  '"hepta-infer-worker-host"',
                  'codex-hepta-infer-worker-host = { path = "hepta-infer-worker-host" }',
                  'libloading = "0.8.9"',
              ),
          }
          for path, markers in structural_markers.items():
              text = Path(path).read_text(encoding="utf-8")
              for marker in markers:
                  if text.count(marker) != 1:
                      raise SystemExit(f"structural marker drift: {path}: {marker!r}")
          PY

      - name: Enforce closed authority and non-production source shape
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          roots = [
              Path("codex-rs/hepta-infer-core"),
              Path("codex-rs/hepta-infer-client"),
              Path("codex-rs/hepta-inferd"),
              Path("codex-rs/hepta-infer-worker-host"),
          ]
          text = "\n".join(
              path.read_text(encoding="utf-8")
              for root in roots
              for path in root.rglob("*.rs")
          )
          forbidden_true = (
              "remote_fallback: true",
              "remote_fallback_attempted: true",
              "automatic_model_install: true",
              "model_switch: true",
              "memory_write: true",
              "shared_kg_write: true",
              "effect_write: true",
              "route_write: true",
              "fleet_write: true",
              "shadow_output_authoritative: true",
          )
          for marker in forbidden_true:
              if marker in text:
                  raise SystemExit(f"forbidden authority marker: {marker}")
          required = (
              "RouteMode::ShadowCompareOnly",
              "primary_output_authoritative: true",
              "shadow_output_authoritative: false",
              "real_native_model_executed: false",
              "remote_fallback_attempted: false",
          )
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"required closed-authority marker missing: {marker}")
          PY
          if test -f scripts/hepta-inference-v4-source-truth.py; then
            python3 scripts/hepta-inference-v4-source-truth.py \
              > "$RUNNER_TEMP/hepta-inference-v4-source-truth.json"
          else
            echo '{"source_truth_gate":"V4_SCRIPT_ABSENT_AT_BASE","qualified":false}' \
              > "$RUNNER_TEMP/hepta-inference-v4-source-truth.json"
          fi

      - name: Materialize Cargo and Bazel lock state
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path codex-rs/Cargo.toml --format-version 1 \
            > "$RUNNER_TEMP/hepta-inference-v4-metadata-unlocked.json"
          just bazel-lock-update
          cargo metadata --locked --manifest-path codex-rs/Cargo.toml --no-deps --format-version 1 \
            > "$RUNNER_TEMP/hepta-inference-v4-metadata-locked.json"
          just bazel-lock-check

      - name: Format all owned inference packages
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd \
            -p codex-hepta-infer-worker-host
          cargo fmt \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd \
            -p codex-hepta-infer-worker-host -- --check

      - name: Locked all-target compile
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo check --locked --all-targets \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd \
            -p codex-hepta-infer-worker-host

      - name: Locked deterministic tests and fault fixtures
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo test --locked --all-targets \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd \
            -p codex-hepta-infer-worker-host -- --test-threads=1

      - name: Strict owned-source Clippy
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets --no-deps \
            -p codex-hepta-infer-core \
            -p codex-hepta-infer-client \
            -p codex-hepta-inferd \
            -p codex-hepta-infer-worker-host -- -D warnings

      - name: Reject scope escape before source commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          changed = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=normal"],
              text=True,
          ).splitlines()
          paths = []
          for line in changed:
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              paths.append(path)
          allowed_exact = {
              "MODULE.bazel.lock",
              "codex-rs/Cargo.lock",
              "codex-rs/Cargo.toml",
          }
          allowed_prefixes = (
              "codex-rs/hepta-infer-core/",
              "codex-rs/hepta-infer-client/",
              "codex-rs/hepta-inferd/",
              "codex-rs/hepta-infer-worker-host/",
          )
          unexpected = [
              path
              for path in paths
              if path not in allowed_exact
              and not any(path.startswith(prefix) for prefix in allowed_prefixes)
          ]
          if unexpected:
              raise SystemExit("unexpected materialized paths: " + ", ".join(unexpected))
          required = {
              "codex-rs/Cargo.lock",
              "codex-rs/Cargo.toml",
          }
          missing = sorted(required - set(paths))
          if missing:
              raise SystemExit("required generated paths missing: " + ", ".join(missing))
          PY
          git diff --check

      - name: Commit qualified repository-source candidate and remove materializers
        shell: bash
        env:
          TARGET_BRANCH: codex/hepta-inference-v4-full-closure-chatgpt-20260830
        run: |
          set -euo pipefail
          rm .github/workflows/hepta-inference-v4-full-closure-chatgpt.yml
          rm -rf tools/hepta-inference-v4-payloads
          git add -A \
            .github/workflows/hepta-inference-v4-full-closure-chatgpt.yml \
            tools/hepta-inference-v4-payloads \
            MODULE.bazel.lock \
            codex-rs/Cargo.lock \
            codex-rs/Cargo.toml \
            codex-rs/hepta-infer-core \
            codex-rs/hepta-infer-client \
            codex-rs/hepta-inferd \
            codex-rs/hepta-infer-worker-host
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat(inference): close V4 repository-source runtime candidate"
          git push origin "HEAD:${TARGET_BRANCH}"
          test -z "$(git status --porcelain)"

      - name: Emit final candidate identity and qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/hepta-inference-v4-unified-source-receipt.json"
          python3 - "$receipt" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          receipt = {
              "schema": "hepta.inference.v4.unified_repository_source_receipt.v1",
              "head": git("rev-parse", "HEAD"),
              "tree": git("rev-parse", "HEAD^{tree}"),
              "parent": git("rev-parse", "HEAD^"),
              "runner_os": __import__("os").environ.get("RUNNER_OS"),
              "runner_arch": __import__("os").environ.get("RUNNER_ARCH"),
              "rustc": subprocess.check_output(["rustc", "--version"], text=True).strip(),
              "cargo": subprocess.check_output(["cargo", "--version"], text=True).strip(),
              "packages": [
                  "codex-hepta-infer-core",
                  "codex-hepta-infer-client",
                  "codex-hepta-inferd",
                  "codex-hepta-infer-worker-host",
              ],
              "metadata_locked": "PASS",
              "bazel_lock": "PASS",
              "fmt": "PASS",
              "check_all_targets": "PASS",
              "test_all_targets_single_thread": "PASS",
              "clippy_all_targets_no_deps_D_warnings": "PASS",
              "repository_source_packages_linux_qualified": True,
              "multi_platform_exact_head_qualified": False,
              "real_provider_executed": False,
              "real_native_model_executed": False,
              "hardware_qualified": False,
              "product_default_route_changed": False,
              "operator_accepted": False,
              "promoted": False,
              "released": False,
          }
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload unified source evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-v4-unified-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hepta-inference-v4-unified-source-receipt.json
            ${{ runner.temp }}/hepta-inference-v4-source-truth.json
            ${{ runner.temp }}/hepta-inference-v4-metadata-locked.json
          if-no-files-found: error
          retention-days: 30
