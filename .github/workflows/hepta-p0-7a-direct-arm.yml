name: Hepta P0.7a supervisor gap controller

on:
  push:
    branches:
      - "codex/hepta-architecture-v4-p0-7a-supervisor-gap-controller-20260830"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}::${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-and-qualify:
    name: qualify (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout exact controller generation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest@0.9.143

      - name: Verify and apply exact fail-closed closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object codex-rs/hepta-fleet/src/registry.rs)" = a95f8402f50792f9d00182202e083656a2bbb125
          test "$(git hash-object codex-rs/hepta-fleet/src/registry_tests.rs)" = 6943d7ea341237867d683eecca551b050ba847cd
          test "$(git hash-object codex-rs/hepta-supervisor/src/supervisor_tests.rs)" = e8e996e74721f43e31c88b86a81e56494e0e7aa3
          test "$(git hash-object codex-rs/.config/nextest.toml)" = f3f3ca2607190b6c7f4568fbcb365519250c7803
          python3 -m py_compile .github/scripts/hepta-p0-7a-supervisor-gap-closure-v2.py
          python3 .github/scripts/hepta-p0-7a-supervisor-gap-closure-v2.py
          rustfmt --edition 2024 --config-path codex-rs/rustfmt.toml \
            codex-rs/hepta-fleet/src/registry.rs \
            codex-rs/hepta-fleet/src/registry_tests.rs \
            codex-rs/hepta-supervisor/src/supervisor_tests.rs
          rustfmt --edition 2024 --config-path codex-rs/rustfmt.toml --check \
            codex-rs/hepta-fleet/src/registry.rs \
            codex-rs/hepta-fleet/src/registry_tests.rs \
            codex-rs/hepta-supervisor/src/supervisor_tests.rs
          git diff --check
          expected=$'codex-rs/.config/nextest.toml\ncodex-rs/hepta-fleet/src/registry.rs\ncodex-rs/hepta-fleet/src/registry_tests.rs\ncodex-rs/hepta-supervisor/src/supervisor_tests.rs'
          test "$(git diff --name-only)" = "$expected"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --stat

      - name: Run Fleet security regression closure
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-fleet --lib -- --test-threads=1

      - name: Run Supervisor unit closure
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-supervisor --lib -- --test-threads=1

      - name: Run real paired-process closure serially
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          subprocess.run(
              [
                  "cargo",
                  "test",
                  "--locked",
                  "-p",
                  "codex-hepta-supervisor",
                  "--test",
                  "paired_process_product",
                  "--",
                  "--nocapture",
                  "--test-threads=1",
              ],
              check=True,
              timeout=300,
          )
          PY

      - name: Prove nextest process-level serialization
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          just test -p codex-hepta-supervisor

      - name: Check and lint exact candidate
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets \
            -p codex-hepta-fleet -p codex-hepta-supervisor
          cargo clippy --locked --all-targets \
            -p codex-hepta-fleet -p codex-hepta-supervisor -- -D warnings

      - name: Verify clean bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          expected=$'codex-rs/.config/nextest.toml\ncodex-rs/hepta-fleet/src/registry.rs\ncodex-rs/hepta-fleet/src/registry_tests.rs\ncodex-rs/hepta-supervisor/src/supervisor_tests.rs'
          test "$(git diff --name-only)" = "$expected"
          test -z "$(git ls-files --others --exclude-standard)"
