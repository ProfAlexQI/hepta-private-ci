name: Hepta P0.7a direct qualification ARM

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "codex-rs/hepta-contracts/**"
      - "codex-rs/hepta-fleet/**"
      - "codex-rs/hepta-supervisor/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/Cargo.lock"
      - "MODULE.bazel.lock"
      - "docs/architecture/**"
      - "scripts/verify-hepta-selected-architecture-plan.py"
      - "scripts/verify-hepta-architecture-plan-v4.py"
      - "scripts/verify-hepta-architecture-plan-v5.py"
      - "scripts/verify-hepta-p0-7a-format.py"
      - ".github/workflows/hepta-p0-7a-direct-arm.yml"
  push:
    branches:
      - "codex/hepta-architecture-v4-p0-7a-*"
      - "codex/hepta-architecture-v5-*"
    paths:
      - "codex-rs/hepta-contracts/**"
      - "codex-rs/hepta-fleet/**"
      - "codex-rs/hepta-supervisor/**"
      - "codex-rs/hepta-agentd/**"
      - "codex-rs/Cargo.lock"
      - "MODULE.bazel.lock"
      - "docs/architecture/**"
      - "scripts/verify-hepta-selected-architecture-plan.py"
      - "scripts/verify-hepta-architecture-plan-v4.py"
      - "scripts/verify-hepta-architecture-plan-v5.py"
      - "scripts/verify-hepta-p0-7a-format.py"
      - ".github/workflows/hepta-p0-7a-direct-arm.yml"

permissions:
  contents: read

jobs:
  qualify:
    name: P0.7a exact candidate direct qualification
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout exact event identity
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest@0.9.143

      - name: Verify exact identity and clean input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          printf 'commit=%s\ntree=%s\n' \
            "$(git rev-parse HEAD)" \
            "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify committed locks and package format
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path codex-rs/Cargo.toml --locked --no-deps --format-version 1 >/dev/null
          python3 scripts/verify-hepta-p0-7a-format.py --check
          just bazel-lock-check

      - name: Run hepta-contracts tests
        id: test_contracts
        continue-on-error: true
        working-directory: codex-rs
        shell: bash
        run: |
          set -uo pipefail
          evidence_dir="$RUNNER_TEMP/p0-7a-package-tests"
          mkdir -p "$evidence_dir"
          rm -f junit.xml
          set +e
          just test -p codex-hepta-contracts 2>&1 | tee "$evidence_dir/hepta-contracts.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ -f junit.xml ]]; then
            mv junit.xml "$evidence_dir/hepta-contracts-junit.xml"
          fi
          exit "$status"

      - name: Run hepta-fleet tests
        id: test_fleet
        continue-on-error: true
        working-directory: codex-rs
        shell: bash
        run: |
          set -uo pipefail
          evidence_dir="$RUNNER_TEMP/p0-7a-package-tests"
          mkdir -p "$evidence_dir"
          rm -f junit.xml
          set +e
          just test -p codex-hepta-fleet 2>&1 | tee "$evidence_dir/hepta-fleet.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ -f junit.xml ]]; then
            mv junit.xml "$evidence_dir/hepta-fleet-junit.xml"
          fi
          exit "$status"

      - name: Run hepta-supervisor tests
        id: test_supervisor
        continue-on-error: true
        working-directory: codex-rs
        shell: bash
        run: |
          set -uo pipefail
          evidence_dir="$RUNNER_TEMP/p0-7a-package-tests"
          mkdir -p "$evidence_dir"
          rm -f junit.xml
          set +e
          just test -p codex-hepta-supervisor 2>&1 | tee "$evidence_dir/hepta-supervisor.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ -f junit.xml ]]; then
            mv junit.xml "$evidence_dir/hepta-supervisor-junit.xml"
          fi
          exit "$status"

      - name: Run hepta-agentd tests
        id: test_agentd
        continue-on-error: true
        working-directory: codex-rs
        shell: bash
        run: |
          set -uo pipefail
          evidence_dir="$RUNNER_TEMP/p0-7a-package-tests"
          mkdir -p "$evidence_dir"
          rm -f junit.xml
          set +e
          just test -p codex-hepta-agentd 2>&1 | tee "$evidence_dir/hepta-agentd.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ -f junit.xml ]]; then
            mv junit.xml "$evidence_dir/hepta-agentd-junit.xml"
          fi
          exit "$status"

      - name: Check all P0.7a targets
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets \
            -p codex-hepta-contracts \
            -p codex-hepta-fleet \
            -p codex-hepta-supervisor \
            -p codex-hepta-agentd

      - name: Run strict P0.7a Clippy
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets \
            -p codex-hepta-contracts \
            -p codex-hepta-fleet \
            -p codex-hepta-supervisor \
            -p codex-hepta-agentd \
            -- -D warnings

      - name: Verify selected architecture source truth
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-hepta-selected-architecture-plan.py
          git diff --check

      - name: Upload P0.7a package-test diagnostics
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: p0-7a-package-tests-${{ github.sha }}
          path: ${{ runner.temp }}/p0-7a-package-tests
          if-no-files-found: error

      - name: Require every P0.7a package test to pass
        if: always() && !cancelled()
        env:
          CONTRACTS: ${{ steps.test_contracts.outcome }}
          FLEET: ${{ steps.test_fleet.outcome }}
          SUPERVISOR: ${{ steps.test_supervisor.outcome }}
          AGENTD: ${{ steps.test_agentd.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'contracts=%s\nfleet=%s\nsupervisor=%s\nagentd=%s\n' \
            "$CONTRACTS" "$FLEET" "$SUPERVISOR" "$AGENTD"
          test "$CONTRACTS" = success
          test "$FLEET" = success
          test "$SUPERVISOR" = success
          test "$AGENTD" = success

      - name: Require clean output
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
