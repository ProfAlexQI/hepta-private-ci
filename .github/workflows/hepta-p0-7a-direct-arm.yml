name: Hepta P0.7a supervisor gap controller

on:
  push:
    branches:
      - "codex/hepta-architecture-v4-p0-7a-supervisor-gap-controller-20260830"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout controller branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Apply fail-closed supervisor fixture closure candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          registry = Path("codex-rs/hepta-fleet/src/registry.rs")
          s = registry.read_text()
          s = replace_once(
              s,
              '            validate_physical_directory(layout.agent_root())?;\n            migrate_private_directory(layout.agent_root(), "matrix")?;\n',
              '            validate_physical_directory(layout.agent_root())?;\n            set_private_directory_permissions(layout.run_root())?;\n            validate_private_directory(layout.run_root())?;\n            migrate_private_directory(layout.agent_root(), "matrix")?;\n',
              "legacy agent run-root migration",
          )
          s = replace_once(
              s,
              '        let matrix_secrets_root = staging_root.join("matrix/secrets");\n',
              '        let run_root = staging_root.join("run");\n        set_private_directory_permissions(&run_root)?;\n        let matrix_secrets_root = staging_root.join("matrix/secrets");\n',
              "new agent run-root permissions",
          )
          s = replace_once(
              s,
              '        validate_private_directory(layout.matrix_root())?;\n',
              '        validate_private_directory(layout.run_root())?;\n        validate_private_directory(layout.matrix_root())?;\n',
              "agent run-root reopen validation",
          )
          registry.write_text(s)

          tests = Path("codex-rs/hepta-supervisor/src/supervisor_tests.rs")
          s = tests.read_text()
          old_impl = (
              '        Ok(Self {\n'
              '            _temp: temp,\n'
              '            registry,\n'
              '            first,\n'
              '            second,\n'
              '        })\n'
              '    }\n'
              '}\n\n'
              'fn register_agent(\n'
          )
          new_impl = (
              '        Ok(Self {\n'
              '            _temp: temp,\n'
              '            registry,\n'
              '            first,\n'
              '            second,\n'
              '        })\n'
              '    }\n\n'
              '    fn test_program(&self, label: &str) -> Result<PathBuf, SupervisorError> {\n'
              '        let root = self._temp.path().join("programs");\n'
              '        std::fs::create_dir_all(&root)?;\n'
              '        let file_name: String = label\n'
              '            .as_bytes()\n'
              '            .iter()\n'
              '            .map(|byte| format!("{byte:02x}"))\n'
              '            .collect();\n'
              '        let path = root.join(file_name);\n'
              '        if !path.exists() {\n'
              '            std::fs::write(&path, b"#!/bin/sh\\nexit 0\\n")?;\n'
              '            #[cfg(unix)]\n'
              '            {\n'
              '                use std::os::unix::fs::PermissionsExt;\n'
              '                std::fs::set_permissions(&path, std::fs::Permissions::from_mode(0o700))?;\n'
              '            }\n'
              '        }\n'
              '        Ok(path.canonicalize()?)\n'
              '    }\n'
              '}\n\n'
              'fn register_agent(\n'
          )
          s = replace_once(s, old_impl, new_impl, "test program fixture")
          s = replace_once(
              s,
              'fn command() -> Result<AgentCommand, SupervisorError> {\n    AgentCommand::new("/fake/hepta-agentd", Vec::new())\n}\n\nfn release(identity: &str, program: &str) -> Result<AgentRelease, SupervisorError> {\n    AgentRelease::new(identity, AgentCommand::new(program, Vec::new())?)\n}\n',
              'fn command(fleet: &TestFleet) -> Result<AgentCommand, SupervisorError> {\n    AgentCommand::new(fleet.test_program("unversioned-hepta-agentd")?, Vec::new())\n}\n\nfn release(\n    fleet: &TestFleet,\n    identity: &str,\n    program: &str,\n) -> Result<AgentRelease, SupervisorError> {\n    AgentRelease::new(identity, AgentCommand::new(fleet.test_program(program)?, Vec::new())?)\n}\n',
              "command and release fixtures",
          )
          s = s.replace("command()?", "command(&fleet)?")
          s = s.replace('release("', 'release(&fleet, "')
          s = replace_once(
              s,
              '    control.reject_spawn_program("/fake/release-spawn-fails/hepta-agentd");\n',
              '    control.reject_spawn_program(\n        fleet.test_program("/fake/release-spawn-fails/hepta-agentd")?,\n    );\n',
              "rejected spawn fixture",
          )
          s = s.replace(
              'Path::new("/bin/sh")',
              'fleet.test_program("portable-shell")?.as_path()',
          )
          tests.write_text(s)
          PY

          python3 scripts/verify-hepta-p0-7a-format.py
          git diff --check
          git diff -- codex-rs/hepta-fleet/src/registry.rs codex-rs/hepta-supervisor/src/supervisor_tests.rs

      - name: Run exact supervisor unit closure
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p codex-hepta-supervisor --lib -- --test-threads=1

      - name: Run real paired-process diagnostics
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          timeout 240 cargo test --locked -p codex-hepta-supervisor --test paired_process_product -- --nocapture --test-threads=1

      - name: Check and lint candidate
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets -p codex-hepta-fleet -p codex-hepta-supervisor
          cargo clippy --locked --all-targets -p codex-hepta-fleet -p codex-hepta-supervisor -- -D warnings
