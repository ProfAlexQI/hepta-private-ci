name: p034-payload-inspect-windows-v6

on:
  push:
    branches:
      - codex/p034-payload-inspect-slim-v2-20260829
    paths:
      - .github/workflows/p034-payload-inspect-slim-v2.yml

permissions:
  contents: read

concurrency:
  group: p034-payload-inspect-windows-v6-${{ github.sha }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PAYLOAD_SHA256: 0a3c110310edaf463bd7fd4a31148e3cb8dcbdbebc9f38700d94bfcdd5059373
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            ci/p034-payload
          sparse-checkout-cone-mode: false

      - name: Decode, verify, and safely extract exact payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          out = root / "artifacts/p034-payload"
          tree = out / "tree"
          tree.mkdir(parents=True, exist_ok=True)
          encoded = (root / "ci/p034-payload/part-00.b64").read_text(
              encoding="ascii"
          )
          payload = base64.b64decode("".join(encoded.split()), validate=True)
          actual = hashlib.sha256(payload).hexdigest()
          expected = os.environ["PAYLOAD_SHA256"]
          if actual != expected:
              raise SystemExit(
                  f"payload digest mismatch: expected={expected} actual={actual}"
              )
          archive = out / "payload.tar.gz"
          archive.write_bytes(payload)
          members = []
          with tarfile.open(archive, "r:gz") as tar:
              for member in tar.getmembers():
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or member.issym()
                      or member.islnk()
                      or member.isdev()
                  ):
                      raise SystemExit(f"unsafe payload member: {member.name}")
                  members.append(
                      {
                          "name": member.name,
                          "bytes": member.size,
                          "type": member.type.decode("latin1")
                          if isinstance(member.type, bytes)
                          else str(member.type),
                      }
                  )
              tar.extractall(tree)
          files = []
          for path in sorted(tree.rglob("*")):
              if path.is_file():
                  data = path.read_bytes()
                  files.append(
                      {
                          "path": path.relative_to(tree).as_posix(),
                          "bytes": len(data),
                          "sha256": hashlib.sha256(data).hexdigest(),
                      }
                  )
          receipt = {
              "schema": "hepta_intelligence_p0_3_4_payload_inspection_v6",
              "payload_sha256": actual,
              "member_count": len(members),
              "file_count": len(files),
              "members": members,
              "files": files,
              "target_branch_written": False,
              "wired": False,
              "default_projection_pointer_changed": False,
              "default_recall_query_changed": False,
              "production_projection_gate": False,
              "production_authority": False,
              "external_effects": False,
              "operator_accepted": False,
              "promoted": False,
              "callers_ratchet": False,
          }
          (out / "inspection-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (out / "file-list.txt").write_text(
              "\n".join(item["path"] for item in files) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload exact P0.3.4 payload evidence
        uses: actions/upload-artifact@v4
        with:
          name: hepta-p0-3-4-payload-${{ github.sha }}-windows
          path: artifacts/p034-payload
          if-no-files-found: error
          retention-days: 7
