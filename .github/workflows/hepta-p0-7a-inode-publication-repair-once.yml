name: Hepta P0.7a inode publication repair (temporary)

on:
  push:
    branches:
      - "codex/hepta-architecture-v4-p0-7a-executable-closure-20260830"
    paths:
      - ".github/workflows/hepta-p0-7a-inode-publication-repair-once.yml"

permissions:
  contents: write

concurrency:
  group: hepta-p0-7a-inode-publication-repair-once
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.repository == 'ProfHepta/hepta-private-ci' &&
      github.ref == 'refs/heads/codex/hepta-architecture-v4-p0-7a-executable-closure-20260830'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout exact repair input
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Verify exact source blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object codex-rs/hepta-fleet/src/runtime_bootstrap_registry.rs)" = \
            "74abd3aa3ece1fc63f36a09acfe719b5a6f9528f"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Apply inode identity repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/hepta-fleet/src/runtime_bootstrap_registry.rs")
          text = path.read_text()
          replacements = (
              (
                  "    let linked = std::fs::symlink_metadata(path)?;\n",
                  "    let held_linked = file.metadata()?;\n"
                  "    validate_registry_metadata(&temp, &held_linked, &parent_metadata, 2)?;\n"
                  "    let linked = std::fs::symlink_metadata(path)?;\n",
              ),
              (
                  "    if metadata_identity(&held) != metadata_identity(&linked) {\n",
                  "    if metadata_identity(&held_linked) != metadata_identity(&linked) {\n",
              ),
              (
                  "    let published = std::fs::symlink_metadata(path)?;\n",
                  "    let held_published = file.metadata()?;\n"
                  "    validate_registry_metadata(path, &held_published, &parent_metadata, 1)?;\n"
                  "    let published = std::fs::symlink_metadata(path)?;\n",
              ),
              (
                  "    if metadata_identity(&held) != metadata_identity(&published) {\n",
                  "    if metadata_identity(&held_published) != metadata_identity(&published) {\n",
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected repair anchor exactly once: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Set up repository CI tools
        uses: ./.github/actions/setup-ci

      - name: Install Rust 1.95 with rustfmt and Clippy
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-nextest@0.9.143

      - name: Format repaired crate
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --package codex-hepta-fleet
          cargo fmt --package codex-hepta-fleet -- --check

      - name: Run repaired fleet tests
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          just test -p codex-hepta-fleet

      - name: Check all P0.7a targets
        id: check
        working-directory: codex-rs
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/hepta-p0-7a-check.log"
          compact="$RUNNER_TEMP/hepta-p0-7a-check.compact.log"
          set +e
          cargo check --locked --all-targets \
            -p codex-hepta-contracts \
            -p codex-hepta-fleet \
            -p codex-hepta-supervisor \
            -p codex-hepta-agentd \
            2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          python3 - "$log" "$compact" <<'PY'
          import re
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          ansi = re.compile(r"\x1b\[[0-9;]*[A-Za-z]")
          clean = [ansi.sub("", line) for line in source]
          selected = set()
          for index, line in enumerate(clean):
              if (
                  line.startswith("error")
                  or "error[" in line
                  or line.lstrip().startswith("-->")
                  or "could not compile" in line
              ):
                  selected.update(range(max(0, index - 4), min(len(clean), index + 12)))
          if not selected:
              selected.update(range(max(0, len(clean) - 200), len(clean)))
          Path(sys.argv[2]).write_text("\n".join(clean[index] for index in sorted(selected)) + "\n")
          PY
          printf 'exit_code=%s\n' "$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run strict P0.7a Clippy
        id: clippy
        if: steps.check.outputs.exit_code == '0'
        working-directory: codex-rs
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/hepta-p0-7a-clippy.log"
          compact="$RUNNER_TEMP/hepta-p0-7a-clippy.compact.log"
          set +e
          cargo clippy --locked --all-targets \
            -p codex-hepta-contracts \
            -p codex-hepta-fleet \
            -p codex-hepta-supervisor \
            -p codex-hepta-agentd \
            -- -D warnings \
            2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          python3 - "$log" "$compact" <<'PY'
          import re
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          ansi = re.compile(r"\x1b\[[0-9;]*[A-Za-z]")
          clean = [ansi.sub("", line) for line in source]
          selected = set()
          for index, line in enumerate(clean):
              if (
                  line.startswith("error")
                  or "error[" in line
                  or line.lstrip().startswith("-->")
                  or "could not compile" in line
              ):
                  selected.update(range(max(0, index - 4), min(len(clean), index + 12)))
          if not selected:
              selected.update(range(max(0, len(clean) - 200), len(clean)))
          Path(sys.argv[2]).write_text("\n".join(clean[index] for index in sorted(selected)) + "\n")
          PY
          printf 'exit_code=%s\n' "$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-p0-7a-compiler-diagnostic-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hepta-p0-7a-check.log
            ${{ runner.temp }}/hepta-p0-7a-check.compact.log
            ${{ runner.temp }}/hepta-p0-7a-clippy.log
            ${{ runner.temp }}/hepta-p0-7a-clippy.compact.log
          if-no-files-found: error
          retention-days: 3

      - name: Verify minimal clean repair
        if: >-
          steps.check.outputs.exit_code == '0' &&
          steps.clippy.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "codex-rs/hepta-fleet/src/runtime_bootstrap_registry.rs"
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Commit exact repaired source
        if: >-
          steps.check.outputs.exit_code == '0' &&
          steps.clippy.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs/hepta-fleet/src/runtime_bootstrap_registry.rs
          git commit -m "fix(hepta): refresh inode identity across publication links"
          git push origin HEAD:codex/hepta-architecture-v4-p0-7a-executable-closure-20260830
          git status --short

      - name: Preserve compiler failure status
        if: always()
        shell: bash
        env:
          CHECK_EXIT: ${{ steps.check.outputs.exit_code }}
          CLIPPY_EXIT: ${{ steps.clippy.outputs.exit_code }}
        run: |
          set -euo pipefail
          test -n "$CHECK_EXIT"
          if [[ "$CHECK_EXIT" != "0" ]]; then
            exit "$CHECK_EXIT"
          fi
          test -n "$CLIPPY_EXIT"
          exit "$CLIPPY_EXIT"
