name: Hepta PR53 bounded Rust diagnostics

on:
  push:
    branches:
      - codex/hepta-pr53-exact-rust-diagnostic-20260829

permissions:
  contents: read

env:
  TARGET_SOURCE: abb435c263c2967c6ba613c5b8554b4cb45e6153
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  memory-runtime:
    name: Bounded Memory/runtime failure diagnostic
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_SOURCE }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_SOURCE"
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest
          version: 0.9.103
      - name: Execute bounded Memory commands
        shell: bash
        run: |
          set -euo pipefail
          run_one() {
            local label="$1"
            shift
            local log="$RUNNER_TEMP/${label}.log"
            local status=0
            "$@" >"$log" 2>&1 || status=$?
            echo "::group::${label} tail"
            tail -n 240 "$log"
            echo "::endgroup::"
            if test "$status" -ne 0; then
              echo "FAILED_COMMAND=${label}"
              exit "$status"
            fi
          }
          run_one memory-tests just test -p codex-hepta-memory
          run_one memory-runtime-tests just test -p codex-hepta-memory-runtime
          run_one memory-clippy just clippy -p codex-hepta-memory --all-targets -- -D warnings
          run_one memory-runtime-clippy just clippy -p codex-hepta-memory-runtime --all-targets -- -D warnings

  contracts-automation:
    name: Bounded Contracts/Automation failure diagnostic
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_SOURCE }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_SOURCE"
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest
          version: 0.9.103
      - name: Execute bounded Contracts and Automation commands
        shell: bash
        run: |
          set -euo pipefail
          run_one() {
            local label="$1"
            shift
            local log="$RUNNER_TEMP/${label}.log"
            local status=0
            "$@" >"$log" 2>&1 || status=$?
            echo "::group::${label} tail"
            tail -n 240 "$log"
            echo "::endgroup::"
            if test "$status" -ne 0; then
              echo "FAILED_COMMAND=${label}"
              exit "$status"
            fi
          }
          run_one contracts-tests just test -p codex-hepta-contracts
          run_one automation-tests just test -p codex-hepta-automation
          run_one contracts-clippy just clippy -p codex-hepta-contracts --all-targets -- -D warnings
          run_one automation-clippy just clippy -p codex-hepta-automation --all-targets -- -D warnings

  agentd:
    name: Bounded Agentd failure diagnostic
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_SOURCE }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_SOURCE"
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest
          version: 0.9.103
      - name: Execute bounded Agentd commands
        shell: bash
        run: |
          set -euo pipefail
          run_one() {
            local label="$1"
            shift
            local log="$RUNNER_TEMP/${label}.log"
            local status=0
            "$@" >"$log" 2>&1 || status=$?
            echo "::group::${label} tail"
            tail -n 240 "$log"
            echo "::endgroup::"
            if test "$status" -ne 0; then
              echo "FAILED_COMMAND=${label}"
              exit "$status"
            fi
          }
          run_one agentd-tests just test -p codex-hepta-agentd
          run_one agentd-qualified-tests just test -p codex-hepta-agentd --features qualification-cognitive-write
          run_one agentd-clippy just clippy -p codex-hepta-agentd --all-targets -- -D warnings
          run_one agentd-qualified-clippy cargo clippy --manifest-path codex-rs/hepta-agentd/Cargo.toml --locked --all-targets --no-default-features --features qualification-cognitive-write -- -D warnings
