name: Hepta UI v5 current v23 generator preflight Windows

on:
  push:
    branches:
      - ops/ui-v5-current-v23-preflight-win-20260830
    paths:
      - .github/workflows/hepta-ui-v5-current-v23-preflight-win.yml

permissions:
  contents: read

concurrency:
  group: hepta-ui-v5-current-v23-preflight-win
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'ProfHepta/hepta-private-ci'
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      V20_DRIVER_COMMIT: 781c237dbc81f49d3f22432b341d904aaa929291
      EVIDENCE_DIR: artifacts/ui-v5-v23-generator-preflight
    steps:
      - name: Check out exact preflight commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify escape-correct v23 transformation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          source_workflow="$RUNNER_TEMP/hepta-ui-v5-remediation-v20.yml"
          generated_driver="$RUNNER_TEMP/hepta-ui-v5-current-v23-preflight-driver.sh"
          git cat-file -e "$V20_DRIVER_COMMIT^{commit}"
          git show "$V20_DRIVER_COMMIT:.github/workflows/hepta-ui-v5-remediation-v20.yml" > "$source_workflow"
          awk '
            /      - name: Execute v18 remediation with v20 closure patch/ { found=1; next }
            found && /        shell: bash/ { next }
            found && /        run: \|/ { in_run=1; next }
            in_run { sub(/^          /, ""); print }
          ' "$source_workflow" > "$generated_driver"
          test -s "$generated_driver"

          export V23_GENERATED_DRIVER="$generated_driver"
          python3 <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["V23_GENERATED_DRIVER"])
          text = path.read_text(encoding="utf-8")
          evidence = Path(os.environ["EVIDENCE_DIR"])

          old_guard = '''matches = re.findall(r'payload = "([A-Za-z0-9+/=]+)"', text)
          if len(matches) != 1:
              raise SystemExit(
                  f"v20 embedded patch payload: expected 1 match, found {len(matches)}"
              )

          old_payload = matches[0]
          '''
          new_guard = '''matches = re.findall(r'payload = "([A-Za-z0-9+/=]+)"', text)
          if len(matches) != 2 or len(set(matches)) != 1:
              raise SystemExit(
                  "v23 embedded patch payload: expected exactly two identical nested matches, "
                  f"found {len(matches)} matches and {len(set(matches))} distinct values"
              )

          old_payload = matches[0]
          '''
          old_write = '''if text.count(old_payload) != 1:
              raise SystemExit("v20 payload replacement was not unique")
          path.write_text(text.replace(old_payload, new_payload, 1), encoding="utf-8")
          '''
          new_write = '''if text.count(old_payload) != 2:
              raise SystemExit(
                  f"v23 payload replacement: expected 2 identical literals, found {text.count(old_payload)}"
              )
          path.write_text(text.replace(old_payload, new_payload, 2), encoding="utf-8")
          '''

          before = {
              "old_guard_count": text.count(old_guard),
              "old_write_count": text.count(old_write),
              "payload_literal_count": len(
                  re.findall(r'payload = "([A-Za-z0-9+/=]+)"', text)
              ),
          }
          if before != {
              "old_guard_count": 1,
              "old_write_count": 1,
              "payload_literal_count": 2,
          }:
              raise SystemExit(f"v23 generator preflight mismatch: {before}")

          text = text.replace(old_guard, new_guard, 1)
          text = text.replace(old_write, new_write, 1)
          path.write_text(text, encoding="utf-8")
          after = {
              "old_guard_count": text.count(old_guard),
              "new_guard_count": text.count(new_guard),
              "old_write_count": text.count(old_write),
              "new_write_count": text.count(new_write),
          }
          if after != {
              "old_guard_count": 0,
              "new_guard_count": 1,
              "old_write_count": 0,
              "new_write_count": 1,
          }:
              raise SystemExit(f"v23 generator postcondition mismatch: {after}")

          (evidence / "counts.json").write_text(
              json.dumps({"before": before, "after": after}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          bash -n "$generated_driver"
          cp "$source_workflow" "$EVIDENCE_DIR/hepta-ui-v5-remediation-v20.yml"
          cp "$generated_driver" "$EVIDENCE_DIR/hepta-ui-v5-current-v23-driver.sh"
          (
            cd "$EVIDENCE_DIR"
            sha256sum * > SHA256SUMS
          )
          cat "$EVIDENCE_DIR/counts.json"

      - name: Upload generator preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-ui-v5-current-v23-generator-preflight-${{ github.sha }}
          path: artifacts/ui-v5-v23-generator-preflight/
          if-no-files-found: error
          retention-days: 30
