name: Hepta UI v5 current v29 macOS xlarge appendix normalization

on:
  push:
    branches:
      - ops/ui-v5-current-v29-macos-xlarge-20260830
    paths:
      - .github/workflows/hepta-ui-v5-current-v29-macos-xlarge.yml

permissions:
  contents: write

concurrency:
  group: hepta-ui-v5-current-v29-macos-xlarge
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'ProfHepta/hepta-private-ci'
    runs-on: macos-15-xlarge
    timeout-minutes: 120
    env:
      BRANCH: codex/ui-v5-plan-and-repo-gap-closure-20260829
      EXPECTED_PARENT: 3f2d8192439e8fcc5cb030011202a4f58ceda082
      BOOTSTRAP_PATH: .github/workflows/hepta-ui-v5-current-v29-macos-xlarge.yml
      ORIGINAL_BOOTSTRAP_PATH: .github/workflows/hepta-ui-v5-blocker-remediation-bootstrap.yml
      UPSTREAM_URL: https://github.com/openai/codex.git
      UPSTREAM_PREVIOUS: 61a44880a85d2fd0d8770908dea5733495e571c8
      UPSTREAM_ROLE: current_r12
      UPSTREAM_FROZEN_REF: refs/remotes/upstream/hepta-intake-20260830-r12
      UPSTREAM_INTAKE_PATH: docs/architecture/HEPTA_UPSTREAM_CODEX_CURRENT_INTAKE_2026-08-30_R12.json
      UPSTREAM_RECORD_PATH: docs/architecture/HEPTA_UPSTREAM_CODEX_R12_SEMANTIC_ABSORPTION_RECORD_2026-08-30.json
      V12_DRIVER_COMMIT: 554d710f6a561166553f3c01fafc5b27cd8c28b9
      V14_DRIVER_COMMIT: 3f2d8192439e8fcc5cb030011202a4f58ceda082
      V18_DRIVER_COMMIT: 022b91a04f443d7fe4ca2bce853bc26bccf99f84
      V20_DRIVER_COMMIT: 781c237dbc81f49d3f22432b341d904aaa929291
      V24_X64_DRIVER_COMMIT: 9a1fc8005bab27e668e9cba98235fc21a3021a0d
      V25_X64_DRIVER_COMMIT: 3dbb216e9c03784f5e3175bccecd77ba808c54fc
    steps:
      - name: Check out exact current-v29 macOS xlarge driver commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install deterministic GNU remediation tools
        shell: bash
        run: |
          set -euo pipefail
          brew install bash coreutils findutils gnu-sed jq ripgrep
          printf '%s\n' \
            "$(brew --prefix bash)/bin" \
            "$(brew --prefix coreutils)/libexec/gnubin" \
            "$(brew --prefix findutils)/libexec/gnubin" \
            "$(brew --prefix gnu-sed)/libexec/gnubin" \
            >> "$GITHUB_PATH"
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --no-self-update

      - name: Patch the canonical bootstrap appendix writer fail closed
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix bash)/bin:$(brew --prefix coreutils)/libexec/gnubin:$(brew --prefix findutils)/libexec/gnubin:$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"

          test -f "$ORIGINAL_BOOTSTRAP_PATH"
          export V29_BOOTSTRAP_PATH="$ORIGINAL_BOOTSTRAP_PATH"
          python3 <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          path = Path(os.environ["V29_BOOTSTRAP_PATH"])
          text = path.read_text(encoding="utf-8")

          old_write = (
              '          plan_path.write_text(plan.rstrip() + appendix + "\\n", encoding="utf-8")\n'
          )
          new_write = '''          normalized_appendix = __import__("textwrap").dedent(appendix).strip()
                    if not normalized_appendix.startswith(
                        "## Remediation round 2 — exact-head failures observed on PR #78"
                    ):
                        raise SystemExit("remediation appendix heading normalization failed")
                    if any(line.startswith("          ") for line in normalized_appendix.splitlines()):
                        raise SystemExit("remediation appendix retained generator indentation")
                    plan_path.write_text(
                        plan.rstrip() + "\\n\\n" + normalized_appendix + "\\n",
                        encoding="utf-8",
                    )
          '''
          if text.count(old_write) != 1:
              raise SystemExit(
                  f"v29 appendix writer anchor: expected 1 match, found {text.count(old_write)}"
              )
          text = text.replace(old_write, new_write, 1)

          old_rm = '          git rm "$BOOTSTRAP_PATH"\n'
          new_rm = (
              '          git rm "$BOOTSTRAP_PATH" '
              '.github/workflows/hepta-ui-v5-blocker-remediation-bootstrap.yml\n'
          )
          if text.count(old_rm) != 1:
              raise SystemExit(
                  f"v29 bootstrap self-delete anchor: expected 1 match, found {text.count(old_rm)}"
              )
          text = text.replace(old_rm, new_rm, 1)

          old_external_anchor = (
              '          write_json(active_plan_path, active_plan)\n'
              '\n'
              '          ledger_path = root / "docs/ui/HEPTA_UI_REPOSITORY_GAP_LEDGER_V1.json"\n'
          )
          new_external_anchor = (
              '          write_json(active_plan_path, active_plan)\n'
              '\n'
              '          external_ledger_path = root / "docs/ui/HEPTA_UI_EXTERNAL_EVIDENCE_LEDGER_V1.json"\n'
              '          external_ledger = json.loads(external_ledger_path.read_text(encoding="utf-8"))\n'
              '          if external_ledger.get("schema") != "hepta.ui.external-evidence-ledger.v1":\n'
              '              raise SystemExit("unexpected external evidence ledger schema")\n'
              '          if external_ledger.get("syntheticEvidenceAllowed") is not False:\n'
              '              raise SystemExit("external evidence ledger must remain fail-closed")\n'
              '          expected_external_slots = {\n'
              '              "windowsDevice",\n'
              '              "macosDevice",\n'
              '              "iosDevice",\n'
              '              "androidDevice",\n'
              '              "browserHumanAcceptance",\n'
              '              "operatorAcceptance",\n'
              '          }\n'
              '          external_slots = external_ledger.get("slots")\n'
              '          if not isinstance(external_slots, list):\n'
              '              raise SystemExit("external evidence ledger slots must be a list")\n'
              '          external_slot_ids = [\n'
              '              slot.get("id") for slot in external_slots if isinstance(slot, dict)\n'
              '          ]\n'
              '          if (\n'
              '              len(external_slot_ids) != len(external_slots)\n'
              '              or len(external_slot_ids) != len(set(external_slot_ids))\n'
              '              or set(external_slot_ids) != expected_external_slots\n'
              '          ):\n'
              '              raise SystemExit("external evidence ledger slot set drift")\n'
              '          if any(\n'
              '              slot.get("state") != "REQUIRED_NOT_PRESENT" for slot in external_slots\n'
              '          ):\n'
              '              raise SystemExit(\n'
              '                  "external evidence must not be synthesized by repository remediation"\n'
              '              )\n'
              '          external_ledger["candidate"] = {\n'
              '              "commit": implementation_commit,\n'
              '              "tree": implementation_tree,\n'
              '              "branch": os.environ["BRANCH"],\n'
              '          }\n'
              '          external_ledger["status"] = "BLOCKED_EXTERNAL_EVIDENCE_REQUIRED"\n'
              '          external_ledger["externalEvidenceComplete"] = False\n'
              '          external_ledger["allGapsClosed"] = False\n'
              '          write_json(external_ledger_path, external_ledger)\n'
              '\n'
              '          ledger_path = root / "docs/ui/HEPTA_UI_REPOSITORY_GAP_LEDGER_V1.json"\n'
          )
          if text.count(old_external_anchor) != 1:
              raise SystemExit(
                  "v29 external evidence ledger anchor: expected 1 match, "
                  f"found {text.count(old_external_anchor)}"
              )
          text = text.replace(old_external_anchor, new_external_anchor, 1)

          old_external_json_gate = (
              '          python3 -m json.tool docs/ui/HEPTA_UI_REPOSITORY_GAP_LEDGER_V1.json >/dev/null\n'
          )
          new_external_json_gate = (
              '          python3 -m json.tool docs/ui/HEPTA_UI_EXTERNAL_EVIDENCE_LEDGER_V1.json >/dev/null\n'
              + old_external_json_gate
          )
          if text.count(old_external_json_gate) != 1:
              raise SystemExit(
                  "v29 external evidence JSON gate anchor: expected 1 match, "
                  f"found {text.count(old_external_json_gate)}"
              )
          text = text.replace(old_external_json_gate, new_external_json_gate, 1)

          old_external_stage_anchor = (
              '            docs/ui/HEPTA_UI_ACTIVE_PLAN_V5.json \\\n'
              '            docs/ui/HEPTA_UI_DEVELOPMENT_PLAN_V5_2026-08-29.md \\\n'
          )
          new_external_stage_anchor = (
              '            docs/ui/HEPTA_UI_ACTIVE_PLAN_V5.json \\\n'
              '            docs/ui/HEPTA_UI_EXTERNAL_EVIDENCE_LEDGER_V1.json \\\n'
              '            docs/ui/HEPTA_UI_DEVELOPMENT_PLAN_V5_2026-08-29.md \\\n'
          )
          if text.count(old_external_stage_anchor) != 1:
              raise SystemExit(
                  "v29 external evidence staging anchor: expected 1 match, "
                  f"found {text.count(old_external_stage_anchor)}"
              )
          text = text.replace(old_external_stage_anchor, new_external_stage_anchor, 1)

          if old_write in text or old_rm in text:
              raise SystemExit("v29 canonical bootstrap patch left a superseded anchor")
          if text.count("normalized_appendix =") != 1:
              raise SystemExit("v29 normalized appendix assignment is not unique")
          if text.count("hepta-ui-v5-blocker-remediation-bootstrap.yml") < 3:
              raise SystemExit("v29 original bootstrap identity unexpectedly disappeared")

          if text.count("HEPTA_UI_EXTERNAL_EVIDENCE_LEDGER_V1.json") != 3:
              raise SystemExit("v29 external evidence ledger binding is not exact")
          if text.count("external evidence must not be synthesized") != 1:
              raise SystemExit("v29 external evidence anti-synthesis guard is not unique")

          with path.open("w", encoding="utf-8", newline="\n") as output:
              output.write(text)
          PY

          ruby -e 'require "yaml"; YAML.load_file(ARGV.fetch(0), aliases: true)' "$ORIGINAL_BOOTSTRAP_PATH" >/dev/null
          git diff --check -- "$ORIGINAL_BOOTSTRAP_PATH"

          python3 <<'PY'
          from __future__ import annotations

          import textwrap

          appendix = f"""

          ## Remediation round 2 — exact-head failures observed on PR #78

          Implementation commit `candidate` / tree `tree` closes the
          deterministic repository-controlled failures exposed by assigned-runner execution:

          - exact source truth;
          - bounded architecture debt.

          These changes remain unqualified until exact-head jobs pass.
          """
          normalized = textwrap.dedent(appendix).strip()
          rendered = "# Existing plan\n".rstrip() + "\n\n" + normalized + "\n"
          if not rendered.endswith(b"\n".decode()):
              raise SystemExit("v29 fixture lost its final newline")
          if rendered.endswith("\n\n"):
              raise SystemExit("v29 fixture retained a blank line at EOF")
          if "\n## Remediation round 2" not in rendered:
              raise SystemExit("v29 fixture heading is not at Markdown column zero")
          if "\n- exact source truth;" not in rendered:
              raise SystemExit("v29 fixture bullet is not at Markdown column zero")
          if any(line.endswith((" ", "\t")) for line in rendered.splitlines()):
              raise SystemExit("v29 fixture contains trailing whitespace")
          compile(
              'normalized_appendix = __import__("textwrap").dedent(appendix).strip()',
              "<v29-appendix-normalizer>",
              "exec",
          )
          PY

      - name: Execute immutable v25 remediation with the corrected bootstrap source
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix bash)/bin:$(brew --prefix coreutils)/libexec/gnubin:$(brew --prefix findutils)/libexec/gnubin:$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"

          source_workflow="$RUNNER_TEMP/hepta-ui-v5-remediation-v25-x64.yml"
          generated_driver="$RUNNER_TEMP/hepta-ui-v5-current-v29-macos-xlarge.sh"
          if ! git cat-file -e "$V25_X64_DRIVER_COMMIT^{commit}"; then
            git fetch --no-tags origin "$V25_X64_DRIVER_COMMIT"
          fi
          git show "$V25_X64_DRIVER_COMMIT:.github/workflows/hepta-ui-v5-remediation-v25-x64.yml" > "$source_workflow"
          awk '
            /      - name: Execute v24 remediation with semantic addon self-test/ { found=1; next }
            found && /        shell: bash/ { next }
            found && /        run: \|/ { in_run=1; next }
            in_run { sub(/^          /, ""); print }
          ' "$source_workflow" > "$generated_driver"
          test -s "$generated_driver"

          bash --version
          sed --version | head -n 1
          sha256sum --version | head -n 1
          bash -n "$generated_driver"
          bash -x "$generated_driver"
