name: Temporary V8 final blocker materialization r1

on:
  push:
    branches:
      - codex/tmp-materialize-v8-final-blockers-20260902-r1
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: tmp-materialize-v8-final-blockers-r1
  cancel-in-progress: true

env:
  SOURCE_SHA: 5a8d22b2d38a8777756212554984b0aec6ebde42
  OUTPUT_BRANCH: codex/tmp-materialized-v8-final-output-20260902-r1
  BAZEL_ARTIFACT_ID: "9842068004"
  BAZEL_LOCK_SHA256: c03b95ff14a8c813ea4cbb27498437293057540d2374b7f9b6903c1a0a4749d4

jobs:
  materialize:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out temporary carrier with push credential
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install exact HNMF formatter toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --no-self-update
          rustc +1.98.0 --version --verbose
          cargo +1.98.0 --version --verbose
          rustfmt +1.98.0 --version
          cargo +1.98.0 clippy --version

      - name: Check out immutable final source candidate
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_SHA^{commit}"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')" = 1
          test "$(git rev-parse HEAD^)" = 70ef65a90a031ce0cc08b77b5596eb0d99edaa11

      - name: Apply exact HNMF quality fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("qualification/hnmf-adversarial-reference/src/tests.rs")
          source = path.read_text(encoding="utf-8")
          replacements = (
              (
                  "    let mut hardening = HardeningConfig::default();\n"
                  "    hardening.maximum_stored_events = 2;\n"
                  "    hardening.maximum_candidate_events = 1;\n",
                  "    let hardening = HardeningConfig {\n"
                  "        maximum_stored_events: 2,\n"
                  "        maximum_candidate_events: 1,\n"
                  "        ..HardeningConfig::default()\n"
                  "    };\n",
                  "bounded hardening configuration",
              ),
              (
                  "    assert!(!CURRENT_RUN_MUTATION_ALLOWED);\n"
                  "    assert!(!ONLINE_TOPOLOGY_ACTIVATION_ALLOWED);\n"
                  "    assert!(!PRODUCTION_AUTHORITY);\n"
                  "    assert!(!EXTERNAL_EFFECTS_ALLOWED);\n",
                  "    const {\n"
                  "        assert!(!CURRENT_RUN_MUTATION_ALLOWED);\n"
                  "        assert!(!ONLINE_TOPOLOGY_ACTIVATION_ALLOWED);\n"
                  "        assert!(!PRODUCTION_AUTHORITY);\n"
                  "        assert!(!EXTERNAL_EFFECTS_ALLOWED);\n"
                  "    };\n",
                  "compile-time negative authority assertions",
              ),
          )
          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label} anchor count is {count}, expected 1")
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Format and qualify adversarial HNMF reference
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --manifest-path qualification/hnmf-adversarial-reference/Cargo.toml
          cargo +1.98.0 fmt --manifest-path qualification/hnmf-adversarial-reference/Cargo.toml -- --check
          cargo +1.98.0 check --manifest-path qualification/hnmf-adversarial-reference/Cargo.toml --all-targets --locked
          cargo +1.98.0 clippy --manifest-path qualification/hnmf-adversarial-reference/Cargo.toml --all-targets --locked -- -D warnings
          cargo +1.98.0 test --manifest-path qualification/hnmf-adversarial-reference/Cargo.toml --locked

      - name: Replay verified Bazel lock artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bazel-lock-artifact"
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$BAZEL_ARTIFACT_ID/zip" \
            --output "$RUNNER_TEMP/bazel-lock.zip"
          unzip -q "$RUNNER_TEMP/bazel-lock.zip" -d "$RUNNER_TEMP/bazel-lock-artifact"
          test "$(cat "$RUNNER_TEMP/bazel-lock-artifact/bazel-lock-update.exit")" = 0
          test "$(cat "$RUNNER_TEMP/bazel-lock-artifact/bazel-lock-after.exit")" = 0
          test "$(shasum -a 256 "$RUNNER_TEMP/bazel-lock-artifact/MODULE.bazel.lock" | awk '{print $1}')" = "$BAZEL_LOCK_SHA256"
          cp "$RUNNER_TEMP/bazel-lock-artifact/MODULE.bazel.lock" MODULE.bazel.lock

      - name: Enforce bounded ordinary-source output
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              MODULE.bazel.lock|qualification/hnmf-adversarial-reference/src/*.rs) ;;
              *) echo "unexpected materialized path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          test "$(printf '%s\n' "$changed" | grep -c '^MODULE.bazel.lock$')" = 1
          mkdir -p "$RUNNER_TEMP/hepta-v8-final-materialization"
          git diff --stat > "$RUNNER_TEMP/hepta-v8-final-materialization/diff.stat"
          git diff --numstat > "$RUNNER_TEMP/hepta-v8-final-materialization/diff.numstat"
          printf 'source=%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/hepta-v8-final-materialization/identity.txt"
          printf 'bazelLockSha256=%s\n' "$BAZEL_LOCK_SHA256" >> "$RUNNER_TEMP/hepta-v8-final-materialization/identity.txt"

      - name: Publish ordinary Git output object
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta final blocker carrier"
          git config user.email "hepta-final-blocker-carrier@users.noreply.github.com"
          git add -- MODULE.bazel.lock qualification/hnmf-adversarial-reference/src
          git diff --cached --quiet && { echo "no materialized changes" >&2; exit 1; }
          git commit -m "fix(v8): format and lint HNMF reference and refresh Bazel lock"
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH" --force
          {
            printf 'outputCommit=%s\n' "$(git rev-parse HEAD)"
            printf 'outputTree=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'outputParent=%s\n' "$(git rev-parse HEAD^)"
          } >> "$RUNNER_TEMP/hepta-v8-final-materialization/identity.txt"

      - name: Retain exact materialization receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v8-final-materialization-r1
          path: ${{ runner.temp }}/hepta-v8-final-materialization
          if-no-files-found: error
          retention-days: 1
