name: Hepta inference INF-1 workspace bootstrap

on:
  push:
    branches:
      - codex/hepta-inference-inf1-source-20260829
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-inference-inf1-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Integrate, validate, and export INF-1 source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Materialize digest-pinned INF-1 source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-inference-inf1-materialize.py
          python3 -m py_compile \
            scripts/hepta-inference-inf1-bootstrap.py \
            scripts/hepta-inference-inf1-source-gate.py

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Integrate exact workspace members and dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hepta-inference-inf1-bootstrap.py --apply
          python3 scripts/hepta-inference-inf1-bootstrap.py --verify

      - name: Generate exact lockfile and format owned source
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt -p codex-hepta-infer-core -p codex-hepta-inferd
          cargo fmt -p codex-hepta-infer-core -p codex-hepta-inferd -- --check

      - name: Compile and test minimal controller
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo check -p codex-hepta-infer-core -p codex-hepta-inferd
          cargo test -p codex-hepta-infer-core -p codex-hepta-inferd

      - name: Strict owned-package Clippy
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo clippy --all-targets --no-deps \
            -p codex-hepta-infer-core \
            -p codex-hepta-inferd \
            -- -D warnings

      - name: Verify source and negative-authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/hepta-inference-inf1-bootstrap.py \
            scripts/hepta-inference-inf1-source-gate.py
          python3 scripts/hepta-inference-inf1-source-gate.py \
            | tee "$RUNNER_TEMP/hepta-inference-inf1-source-gate.txt"

      - name: Build deterministic workspace integration export
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/hepta-inference-inf1-bootstrap"
          mkdir -p "$out/files/codex-rs" "$out/files/docs/hepta-vnext/inference" "$out/files/scripts"
          cp codex-rs/Cargo.toml codex-rs/Cargo.lock "$out/files/codex-rs/"
          cp -R codex-rs/hepta-infer-core codex-rs/hepta-inferd "$out/files/codex-rs/"
          cp docs/hepta-vnext/inference/HEPTA_INFERENCE_INF1_SOURCE_STATUS_V1.json \
            "$out/files/docs/hepta-vnext/inference/"
          cp scripts/hepta-inference-inf1-bootstrap.py \
            scripts/hepta-inference-inf1-source-gate.py \
            scripts/hepta-inference-inf1-materialize.py \
            scripts/hepta-inference-inf1-payload-*.b85 \
            "$out/files/scripts/"
          cp "$RUNNER_TEMP/hepta-inference-inf1-source-gate.txt" "$out/"
          python3 - "$out" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          root = Path(sys.argv[1]); files = []
          for path in sorted(root.joinpath("files").rglob("*")):
              if not path.is_file(): continue
              payload = path.read_bytes()
              files.append({"path": str(path.relative_to(root / "files")), "byte_length": len(payload), "sha256": hashlib.sha256(payload).hexdigest()})
          manifest = {"schema":"hepta.inference.inf1.workspace-bootstrap.v2","input_head":os.environ["GITHUB_SHA"],"runner_os":os.environ["RUNNER_OS"],"runner_arch":os.environ["RUNNER_ARCH"],"rustc":os.popen("rustc --version").read().strip(),"rustfmt":os.popen("rustfmt --version").read().strip(),"source_gate":"PASS","workspace_integration":"PASS","cargo_lock_generated":True,"rust_fmt":"PASS","rust_check":"PASS","rust_test":"PASS","rust_clippy_all_targets_no_deps_d_warnings":"PASS","files":files,"activated":False,"qualified":False,"inf1":"SOURCE_PRESENT_NOT_RUN","authority":False}
          root.joinpath("manifest.json").write_text(json.dumps(manifest, indent=2)+"\n")
          PY
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS"

      - name: Upload exact integrated source payload
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hepta-inference-inf1-bootstrap-${{ github.sha }}
          path: ${{ runner.temp }}/hepta-inference-inf1-bootstrap
          if-no-files-found: error
          retention-days: 7
