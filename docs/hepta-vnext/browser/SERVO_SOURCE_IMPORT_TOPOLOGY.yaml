    "artifact_boundary": "hepta-servo-worker private process protocol",
    "source_checkout_requirement": "exact detached commit and tree with clean worktree",
    "release_requirement": "offline source bundle or independently retained mirror bound by SHA-256",
    "reason": "Servo is a large MPL-2.0 workspace with a distinct toolchain and native dependency graph. Keeping it outside the Codex Cargo workspace prevents lockfile, feature, license and failure-domain coupling."
  },
  "reviewed_upstream_files": [
    {
      "path": "Cargo.toml",
      "blob_sha": "de3665c8cf98337aa908ddacef906b4bea7832e5",
