    },
    {
      "path": "components/servo/Cargo.toml",
      "blob_sha": "d9dce354a8db17b95f2ef618d73a19b1438f08fc",
      "role": "engine feature and dependency boundary"
    },
    {
      "path": "ports/servoshell/Cargo.toml",
