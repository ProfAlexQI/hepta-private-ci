    },
    {
      "path": "components/webdriver_server/lib.rs",
      "blob_sha": "8341df151f04a214694dcf0d9ad675e7d1e7fe98",
      "role": "command conversion reference; network server entrypoint rejected"
    }
  ],
  "selected_initial_surface": [
    "one headed Servo WebView and its existing event loop",
    "create and close exactly one session",
    "local fixture navigation only",
    "bounded observe, click, type, clear and wait operations",
    "status, cancellation and teardown",
    "screenshot only after a separate redaction and evidence contract"
  ],
  "explicitly_excluded_initial_surface": [
    "components/webdriver_server::start_server",
    "TCP or WebSocket listener",
    "raw WebDriver command passthrough",
    "arbitrary JavaScript evaluation",
    "preference mutation",
    "cookie, storage or profile export",
    "download or upload",
    "external DNS, HTTP, HTTPS, UDP or WebSocket",
    "multiple WebViews or windows",
    "service workers, WebGPU, WebXR, Bluetooth and media backends unless independently admitted"
  ],
  "initial_feature_posture": {
    "default_features": false,
    "bundled_resources": true,
    "clipboard": false,
    "js_jit": "platform_qualified_only",
    "webgpu": false,
    "webxr": false,
    "webgl": false,
    "gamepad": false,
    "bluetooth": false,
    "media_gstreamer": false,
    "testbinding": false,
    "background_hang_monitor": true
  },
  "patch_queue": {
    "directory": "third_party/servo-patches",
    "format": "ordered git-format-patch files plus PATCH_INVENTORY.json",
    "maximum_initial_patches": 8,
    "required_fields": [
      "patch_id",
      "upstream_commit",
      "affected_files",
      "reason",
      "security_boundary",
      "upstream_issue_or_pr",
      "compatibility_tests",
      "deletion_condition",
      "patch_sha256"
    ],
    "first_expected_patch": "add Hepta private inherited-channel worker entrypoint without starting WebDriver HTTP server"
  },
  "build_outputs": [
    "hepta-servo-worker executable",
    "source receipt",
    "toolchain receipt",
    "Cargo.lock digest",
    "native dependency and license SBOM",
    "patch inventory",
    "artifact digest and platform identity"
  ],
  "negative_authority": {
    "runtime_authority": false,
    "production_caller": false,
    "production_writer": false,
    "external_network": false,
    "external_effect": false,
    "operator_acceptance": false,
    "promotion": false
  }
