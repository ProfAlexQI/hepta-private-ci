      - {id: normative-singleton, rule: "Exactly one stage set may have normative=true and execution_input=true; superseded overlays are false"}
      - {id: dag-phase-equality, rule: "dependency_dag IDs MUST equal phase_map IDs in order"}
      - {id: dependency-refs-resolve, rule: "Every phase_map.depends_on ID MUST resolve to an earlier phase_map entry"}
      - {id: active-stage-id-explicit, rule: "Every active stage_dod record MUST carry stage_id equal to its map key; phase_map records use id as their canonical key"}
      - {id: active-lane-projection-closed, rule: "Every active stage exposes explicit local/federated lane applicability and status where the lanes diverge; lane resolution MUST use the active lane selector"}
      - {id: hnl-gate0-binding, rule: "HNL-GATE0-DECISIONS plan/matrix/receipt refs and expected HNL-0 ID MUST resolve before B7 PASS or a federated B8/B9 PASS; local B8 loopback is not HNL-blocked"}
      - {id: source-toolchain-closure, rule: "B0 source/tree/archive/lock/toolchain/gitmodules/submodule fields and command results MUST be captured; research 1.94 is not a 1.98 build PASS"}
      - {id: basil-minimal-profile, rule: "Forbidden Basil services/key-generation paths MUST fail at compile, registration and runtime"}
      - {id: stage-dod-complete, rule: "Every B0-B10 stage MUST have owner, entry, exit, commands, rollback and status"}
      - {id: basil-route-crosswalk, rule: "B8 and B9 native Basil calls MUST resolve to exact FQ gRPC paths in basil_route_bindings; Hepta wrapper operations MUST be marked non-Basil and remain default-deny at Basil registration"}
      - {id: historical-terminal-guard, rule: "Historical statuses/aliases are decode-only in their legacy namespaces; current market Released/Refunded remain valid, while ManualRequired/ReconcileBlocked are non-terminal"}
      - {id: historical-decoder-guard, rule: "Any consumer selecting #/stages, #/implementation_overlay, #/contract_crosswalk_v1_2 or #/execution_closure_v1_3/stage_dod_historical without explicit decode_only=true and normative=false MUST fail closed"}
      - {id: b8-lane-separation, rule: "B8 local lane depends only on B4/B5; B8 federated lane additionally requires B7 and HNL-GATE0-DECISIONS"}
      - {id: b9-lane-separation, rule: "B9 local lane depends only on local B8; B9 federated lane additionally requires B7 and HNL-GATE0-DECISIONS"}
      - {id: b10-lane-separation, rule: "B10 local lane depends only on B6/B8/B9; B10 federated lane additionally requires B7 and HNL-GATE0-DECISIONS"}
      - {id: stage-digest-rule-location, rule: "stage_dod_digest_rule is the only per-stage digest rule; aggregate_digest_rule is the only receipt aggregate rule; stage_dod entries contain only stage records"}
      - {id: historical-stage-dod-excluded, rule: "stage_dod_historical is decode-only and cannot satisfy a normative stage digest"}
      - {id: cross-file-normative-singleton, rule: "Exactly AUTHBUS_CANONICAL_CONTRACT_REGISTRY_v1.yaml#/registry emits the v1.3 state/error/status projection; attachment crosswalks and narrow contracts are generated projections"}
      - {id: concrete-registry-projection-binding, rule: "Every active v1.3 crosswalk MUST list the canonical registry and applicable narrow contract refs; each narrow contract MUST declare source_registry_status=REQUIRED_AT_B2 until B2 binds a 64-hex registry digest"}
      - {id: domain-qualified-revision, rule: "A resolver must qualify AUTHBUS.11-v1.3 by domain and reject an unqualified global-index revision"}
      - {id: no-blind-retry, rule: "DispatchUnknownRef and response-lost refresh are lookup-only"}
      - {id: amendment-receipt-binds-post-files, rule: "v1.3 receipt binds exact post-amendment file digests; index/receipt are outside their own hash scope"}
      - {id: no-runtime-authority-change, rule: "E.41 prefix, runtime services and negative authority flags remain unchanged"}

