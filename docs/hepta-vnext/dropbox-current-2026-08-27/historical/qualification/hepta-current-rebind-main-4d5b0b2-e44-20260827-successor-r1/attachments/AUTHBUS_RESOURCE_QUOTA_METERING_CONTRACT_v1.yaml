schema: hepta.authbus.resource-quota-metering.v1
plan_id: AUTHBUS-PLAN-2026-08-26
status: PLANNING_ONLY
authority: false
source_status: STALE_SOURCE_BINDING
implementation_branch: not-created
source_binding:
  basil_repo: https://github.com/openbasil/basil
  basil_commit: 1fd29adb8e7356968eacbff9309e056cec9bafd7
  basil_version: 0.7.2-main-snapshot
  license: Apache-2.0
purpose: >-
  Typed implementation inputs for resource registration, quota observations, reservations,
  metering, and legacy auth-profile refresh. Values are scheduling facts, not release approval.

resource_kinds:
  AuthResource:
    admission_writer: authbusd
    capacity_owner: provider_or_account_owner
    capacity: provider_or_account_usage_right
    secret_surface: SecretRef_only
    transferable: false
  ComputeResource:
    admission_writer: authbusd
    capacity_owner: inferd_owner
    capacity: model_or_device_capacity_claim
    means: capacity_claim_not_execution_queue
    transferable: scoped_usage_right_only
  EgressResource:
    owner_authority: future_network_policy
    state: reserved_trait_not_P0

# Legacy v1 surface; decoders may read it, but v1.3 encoders use the generated
# usage_vector below.  request_count is explicit in the v1.3 registry.
quota_dimensions: [request_count, rpm, tpm, concurrency, day_budget, context]
quota_scopes: [provider, account, organization, ip, model, endpoint]
units_by_dimension:
  rpm: requests
  tpm: tokens
  concurrency: simultaneous_operations
  day_budget: integer_budget_units
  context: provider_defined_integer_units
quota_vector:
  type: non_negative_integer_or_unknown
  unknown_representation: explicit_unknown
  arithmetic: integer_minimum_units_only
  unknown_policy: conservative_no_new_unbounded_admission

quota_contract:
  required: [resource_id, domain_id, dimensions, window, policy_digest, revision]
  dimensions_shape:
    type: map
    key_enum: [request_count, rpm, tpm, concurrency, day_budget, context]
    value_type: non_negative_integer_or_explicit_unknown
  unit_required: true
  window_fields: [window_kind, starts_at, ends_at, timezone_or_offset]
  scope_binding: [provider_id, account_ref, organization_ref, ip_ref, model_ref, endpoint_ref]
  mutation_fence: [authority_epoch, owner_epoch, generation, fencing_token]

quota_snapshot:
  required: [resource_id, domain_id, observed_at, source, confidence, clock_uncertainty_ms, known]
  measurement_fields: [limit, used, remaining, window, reset_at, previous_revision]
  measurement_constraints: "remaining + used must not exceed limit within the same domain and window when all values are known."
  decode_only: true
  normative_source: "#/execution_closure_v1_3/quota_snapshot"
  source_enum: [provider_header, provider_status, owner_config, local_measurement, synthetic]
  confidence_enum: [unknown, low, medium, high, authoritative]
  monotonic_rules:
    - "Never increase available capacity solely because an observation is missing."
    - "Clamp contradictory observations and retain the source and previous revision."
    - "Retry-After is a lower-bound cooldown, not proof of terminal quota reset."
  clock: [wall_time, monotonic_time, clock_uncertainty_ms]

reservation:
  normative: false
  decode_only: true
  superseded_by: execution_closure_v1_3.local_reservation
  required:
    - command_id
    - idempotency_key
    - subject_ref
    - resource_digest
    - quota_domain
    - cost_estimate
    - safety_margin
    - owner_epoch
    - generation
    - fencing_token
    - expires_at
    - state
  states: [PROPOSED, HELD, DISPATCHED, PARTIAL, INDETERMINATE, RELEASED, REFUNDED, EXPIRED]
  rules:
    - "Reserve against every applicable aggregate domain; do not add incompatible windows."
    - "Estimate before dispatch and hold a configurable safety margin."
    - "A response timeout never releases or recreates a reservation without reconcile."
    - "The same idempotency key and payload digest returns the original reservation/receipt."
    - "A changed payload with the same key is a conflict, never a second dispatch."

usage_right_counter:
  normative: false
  decode_only: true
  superseded_by: execution_closure_v1_3.usage_counter
  owner: market-adapter
  authority: "The market adapter is the sole durable writer for UsageRight entitlement counters."
  fields: [right_id, max_uses, reserved_uses, consumed_uses, remaining_uses, counter_revision, counter_state_digest, owner_epoch, generation, fencing_token]
  invariant: "remaining_uses = max_uses - reserved_uses - consumed_uses and reserved_uses + consumed_uses <= max_uses."
  reserve_command: "AuthBus submits fenced ReserveUse(right_id, usage_id, idempotency_key, expected_revision); the adapter returns UseReservationRef with before/after counter digests."
  commit_command: "Only a verified terminal consumption commits one reserved use to consumed_uses; the same usage_id is idempotent."
  release_command: "A verified no-effect, pre-dispatch cancellation, or expired unstarted permit releases reserved_uses exactly once."
  unknown_rule: "Unknown or partial external outcomes keep reserved_uses held until ReconcileDecision; they never silently burn or recreate a use."
  mutable_counter_proof: [counter_revision, counter_state_digest, prior_counter_state_digest, usage_receipt_digest, owner_epoch, generation, fencing_token]

metering_contract:
  required: [unit, estimate_method, hold_rule, finalization_rule, rounding, cancel_partial_refund, receipt_digest]
  unit_policy: integer_minimum_units
  estimate_method: [declared_tokens, provider_estimate, local_model, fixed_request_unit]
  hold_rule: "Pre-authorize estimated cost before EffectIntent dispatch."
  finalization_rule: "Finalize only from terminal EffectAck or an explicit reconcile outcome."
  rounding: deterministic_integer_round_up
  cancel_partial_refund: explicit_by_bytes_or_tokens_consumed
  receipt_fields: [usage_id, resource_id, quantity_estimate, quantity_final, unit, policy_digest, operation_ref, timestamps]
  forbidden_fields: [raw_prompt, raw_token, authorization_header, private_key]

provider_status:
  required: [availability, source, observed_at, retry_after_ms, operation_ref_semantics]
  availability_enum: [AVAILABLE, DEGRADED, THROTTLED, UNAVAILABLE, SEALED, STANDBY, UNKNOWN]
  error_mapping:
    sealed: {decision: no_new_lease, class: BACKEND_SEALED, reconcile: true, indeterminate_reason: BackendSealed}
    standby: {decision: no_new_lease, class: BACKEND_MISCONFIGURED, reconcile: true, indeterminate_reason: StatusLookupUnavailable, note: "STANDBY is a role/reachability condition, not a sealed barrier; do not classify it as BACKEND_SEALED."}
    http_401: {decision: quarantine_or_reauth, class: AUTHENTICATION, reconcile: false}
    http_403: {decision: deny, class: AUTHORIZATION_OR_SCOPE, reconcile: false}
    http_404: {decision: distinguish, class: NOT_FOUND, misconfiguration_class: BACKEND_MISCONFIGURED, reconcile: operator_or_probe}
    http_429: {decision: cooldown, class: THROTTLED, reconcile: false}
    timeout_or_reset: {decision: indeterminate, class: TIMEOUT, secondary_class: CONNECTION_RESET, reconcile: true}
    http_202: {decision: accepted_not_terminal, status: DISPATCH_ACCEPTED, reconcile: true}
  not_found_rule: "A wrong mount or route must not be converted to a null secret or healthy status."
  operation_ref_shape:
    required: [provider_operation_id, provider_operation_id_sha256, effect_key]
    terminal_state_enum: [UNKNOWN, QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
    payload_binding: "payload_digest and effect_key are immutable for one operation."
  non_effect_health: "operation_ref, effect_key, and payload_digest may be null only when known=false and this is not an effect status."

effect_status:
  required: [effect_key, operation_ref, terminal_state, payload_digest]
  provider_terminal_state_enum: [UNKNOWN, QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
  effect_receipt_status_enum: [Queued, DispatchAccepted, Running, Succeeded, Failed, Cancelled, Indeterminate, Reconciled]
  operation_ref_shape:
    required: [provider_operation_id, provider_operation_id_sha256, effect_key]
  payload_binding: "The payload digest, effect key, and operation reference are immutable together."

auth_profile:
  fields:
    - profile_id
    - provider_id
    - secret_ref
    - scope_digest
    - quota_domain
    - max_concurrency
    - rpm_window
    - tpm_window
    - expires_at
    - last_good
    - cooldown_until
    - health
    - quarantine_reason
    - revision
    - authority_epoch
  secret_rule: "Only an opaque SecretRef is persisted in AuthBus projections."
  selection_inputs: [health, quota_snapshot, cooldown_until, deadline, fair_share, last_good, order]

refresh_attempt:
  fields: [profile_id, provider_id, token_family_id, command_id, run_id, aggregate_id, expected_revision, authority_epoch, owner_epoch, generation, fencing_token, logical_clock, causal_parent_event_id, payload_digest, policy_digest, resource_digest, idempotency_key, state, started_at, finished_at, error_class]
  states: [IDLE, CLAIMED, IN_FLIGHT, SUCCEEDED, INVALID_GRANT, TRANSIENT_FAILURE, INDETERMINATE, BACKOFF, QUARANTINED]
  singleflight_key: provider_id_and_profile_id
  cas_key: [profile_id, expected_revision, authority_epoch, owner_epoch, generation, fencing_token]
  decode_only_aliases: {owner_generation: generation}
  invalid_grant: "Quarantine token family and require explicit re-authorization; do not loop."
  normative_source: "AUTHBUS_CANONICAL_CONTRACT_REGISTRY_v1.yaml#/registry/contracts/oauth_secretref"

fairness_and_safety:
  scheduler_components: [per_resource_semaphore, token_bucket, WFQ, EDF, cooldown, deadline]
  oversell_definition: "No two active permits consume the same reserved unit."
  starvation_definition: "A continuously eligible subject waits no more than configured quanta."
  account_rotation: "Changing account/profile cannot bypass provider aggregate limits."

metrics_targets:
  oversell: 0
  duplicate_active_permit: 0
  duplicate_dispatch_for_same_idempotency_key: 0
  jain_fairness_min: 0.95
  starvation_max_quanta: 3
  p95_admission_ms_target: 100
  quota_unknown_admission: 0
  metering_conservation_error_units: 0

receipt_policy:
  authority: authbusd_dispatch_ref_wal_for_quota_and_permit
  canonical_effect_receipt_owner: taskflow_agent_db
  projection: basil_audit_and_agent_cursor
  content: digests_references_and_integer_usage_only
  status: implementation_metric_not_E41_release_gate

negative_authority_flags:
  authority: false
  production_caller: false
  production_writer: false
  effect_authority: false
  operator_acceptance: false
  promotion: false
  g5_allowed: false
  execute_allowed: false

# AUTHBUS.11 crosswalk amendment.  Existing v1 keys are retained for provenance;
# this v1.2 block is decode-only historical material.  The canonical registry projection map
# is normative, and the v1.3 execution_closure_v1_3 below is its generated domain projection.
contract_crosswalk_v1_2:
  id: AUTHBUS.11
  status: DECODE_ONLY_HISTORICAL
  normative: false
  decode_only: true
  superseded_by: contract_crosswalk_v1_3
  canonical_source: "codex-hepta-contracts.v1 + hepta-auth-contracts.v1"
  shared_contract_owner: codex-hepta-contracts.v1
  authbus_extension_owner: hepta-auth-contracts.v1
  wire_namespace: hepta.auth.v1
  base_contract_projection:
    owner: codex-hepta-contracts.v1.4_e21
    e21_effect_receipt_required: [effect_id, effect_intent_id, decision_id, run_id, schema_digest, status, terminal, reconciliation_required, idempotency_key, attempt, authority_scope, execution_scope, effect_authority, production_authority, snapshot_digest, graph_digest, policy_digest, provider_id, reconciliation_id, reconciles_receipt_id, external_state_digest, resolver_attempt, current_revision, cas]
    extension_rule: "Quota/resource fields extend the closed E21 effect receipt and cannot remove, rename, or add top-level receipt fields."
  no_parallel_enums: true
  canonical_encoding:
    authoritative: canonical_versioned_bytes_from_codex_hepta_contracts
    local_transport: basil_protobuf_length_delimited
    edge_projection: json_or_cbor
    digest: domain_separated_sha256
    unknown_fields: reject_in_authoritative_decode
  causal_lineage:
    public_wire_field: causal_parent_event_id
    internal_event_store_field: causal_parent_seq
    mapping_rule: "Resolve internal seq through immutable event_seq→event_id index; one serialization context emits one field; never cast a numeric sequence to an event id."
    public_schema: e21_v1_4
  base_mutation_fields: [schema_version, command_id, run_id, aggregate_id, expected_revision, authority_epoch, owner_epoch, generation, fencing_token, logical_clock, causal_parent_event_id, payload_digest, policy_digest, resource_digest]
  required_fence_fields:
    base_mutation: [schema_version, command_id, run_id, aggregate_id, expected_revision, authority_epoch, owner_epoch, generation, fencing_token, logical_clock, causal_parent_event_id, payload_digest, policy_digest, resource_digest]
    mutation: [schema_version, command_id, run_id, aggregate_id, expected_revision, authority_epoch, owner_epoch, generation, fencing_token, logical_clock, causal_parent_event_id, payload_digest, policy_digest, resource_digest]
    reservation: [reservation_id, command_id, run_id, aggregate_id, resource_id, quota_domain, idempotency_key, expires_at]
    usage: [usage_id, reservation_id, effect_id, operation_ref]
    refresh: [profile_id, provider_id, token_family_id, idempotency_key]
    inheritance_rule: "Object-specific lists are added to base_mutation; generators validate the union."
  mutation_idempotency_policy:
    required_for: [admission, reservation, dispatch, usage, refresh, market_order, settlement_reference]
    not_required_for: [health, ready, watch, verify]
    conflict_rule: "A reused idempotency_key with a different canonical payload_digest is Conflict and cannot create a second mutation."
  field_aliases:
    revision: expected_revision
    agent_generation: generation
    fence: fencing_token
    payload_sha256: payload_digest
    resource_sha256: resource_digest
    operation_id: provider_operation_id
    operation_id_sha256: provider_operation_id_sha256
    causal_parent_seq: internal_event_store_only
    tenant: tenant_id
    audience: aud
    issued_at: iat
    expires_at: exp
    not_before: nbf
  status_registry:
    effect_receipt:
      enum: [Queued, DispatchAccepted, Running, Succeeded, Failed, Cancelled, Indeterminate, Reconciled]
      terminal: [Succeeded, Failed, Cancelled, Reconciled]
      non_terminal: [Queued, DispatchAccepted, Running, Indeterminate]
      mapping_from_reservation:
        PROPOSED: Queued
        HELD: Queued
        DISPATCHED: DispatchAccepted
        PARTIAL: Running
        INDETERMINATE: Indeterminate
        RELEASED: null
        REFUNDED: null
        EXPIRED: null
    quota_reservation:
      enum: [Proposed, Held, DispatchAccepted, PartiallyConsumed, Indeterminate, Released, Refunded, Expired]
      internal_aliases:
        PROPOSED: Proposed
        HELD: Held
        DISPATCHED: DispatchAccepted
        PARTIAL: PartiallyConsumed
        INDETERMINATE: Indeterminate
        RELEASED: Released
        REFUNDED: Refunded
        EXPIRED: Expired
      terminal: [Released, Refunded, Expired]
      non_terminal: [Proposed, Held, DispatchAccepted, PartiallyConsumed, Indeterminate]
      reservation_is_not_effect_receipt: true
      release_refund_expiry_effect_projection: not_applicable_without_independent_effect_proof
    usage_metering:
      phase_enum: [Preauthorized, Held, Consumed, PartiallyConsumed, Finalized, Refunded, Indeterminate]
      effect_status_source: EffectReceipt.status
      terminal_usage_phases: [Finalized, Refunded]
      unknown_usage_phase: Indeterminate
    refresh_attempt:
      status: DECODE_ONLY_HISTORICAL
      canonical_source_ref: AUTHBUS_CANONICAL_CONTRACT_REGISTRY_v1.yaml#/registry/contracts/oauth_secretref
      projection_note: "This compact legacy summary is decode-only; active generators use execution_closure_v1_3/refresh_state."
      state_enum: [IDLE, CLAIMED, IN_FLIGHT, SUCCEEDED, TRANSIENT_FAILURE, INDETERMINATE, BACKOFF, QUARANTINED]
      terminal: [SUCCEEDED, QUARANTINED]
      legacy_state_aliases:
        INVALID_GRANT: QUARANTINED
      invalid_grant_failure_class: INVALID_GRANT
      invalid_grant_rule: "INVALID_GRANT is an event/error, not a parallel state; quarantine the token family and require explicit re-authorization."
  reservation_math:
    vector_dimensions: [rpm, tpm, concurrency, day_budget, context]
    per_domain_equation: "available_before_margin_d = max(0, limit_d - used_d - held_d)"
    admission_rule: "For every applicable domain d, estimate_d + safety_margin_d <= available_before_margin_d; commit all domain holds atomically or none."
    safety_margin_counted_once: true
    golden_vector:
      input: {limit: 100, used: 20, held: 30, estimate: 40, safety_margin: 5}
      available_before_margin: 50
      decision: admit
      boundary_reject: {estimate: 46, reason: SAFETY_MARGIN_EXCEEDED}
    hold_rule: "held_d increases only in the authbusd WAL transaction that creates the reservation."
    finalize_rule: "used_d increases by final_quantity_d and held_d decreases by held_quantity_d in one writer transaction."
    release_rule: "A release requires proof of no effect; unused held units return to availability exactly once."
    refund_rule: "Refund is a wallet/market outcome and never increases provider quota used; it requires a terminal reconcile outcome."
    partial_stream_rule: "Each usage delta is monotonic by usage_id and operation_ref; duplicate deltas are idempotent and overrun is rejected."
    rounding: integer_round_up_before_hold_and_integer_exact_on_finalize
    atomic_domains: true
  clock_contract:
    reservation_timestamps: [issued_at, expires_at, observed_at]
    expiry_basis: monotonic_time_with_wall_clock_snapshot
    remote_time: observation_only
    max_clock_uncertainty_ms: implementation_configured_positive
    clock_rollback: safe_stop_no_new_admission
  quota_observation_contract:
    canonical_fields: [resource_id, domain_id, observed_at, source, confidence, clock_uncertainty_ms, limit, used, remaining, reset_at, previous_revision]
    source_enum: [provider_header, provider_status, owner_config, local_measurement, synthetic]
    confidence_enum: [unknown, low, medium, high, authoritative]
    contradiction_rule: retain_previous_revision_and_mark_unknown
    retry_after_semantics: lower_bound_cooldown_only
    unknown_policy: conservative_no_new_unbounded_admission
  provider_feedback_contract:
    effect_key_binding: [effect_key, provider_operation_id, provider_operation_id_sha256, payload_digest]
    immutable_binding: true
    terminal_state_enum: [UNKNOWN, QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
    accepted_not_terminal: [http_202, DISPATCH_ACCEPTED]
    status_by_effect_key_required_for_reconcile: true
    provider_to_effect_receipt:
      UNKNOWN: {effect_status: Indeterminate, failure_class: LOST_RESPONSE}
      QUEUED: {effect_status: Queued, failure_class: null}
      RUNNING: {effect_status: Running, failure_class: null}
      SUCCEEDED: {effect_status: Succeeded, failure_class: null}
      FAILED:
        effect_status: Failed
        failure_class: provider_declared_canonical_or_PROVIDER_5XX_fallback
        failure_class_rule: "Use the provider-declared canonical FailureClass when present; use PROVIDER_5XX only as a fallback for an immutable terminal provider failure with no more specific class."
      CANCELLED: {effect_status: Cancelled, failure_class: null}
      STATUS_LOOKUP_UNAVAILABLE: {effect_status: Indeterminate, failure_class: LOST_RESPONSE, indeterminate_reason: StatusLookupUnavailable}
      UNKNOWN_DISPATCH: {effect_status: Indeterminate, failure_class: LOST_RESPONSE, indeterminate_reason: UnknownDispatch}
      DISPATCH_UNKNOWN: {effect_status: Indeterminate, failure_class: LOST_RESPONSE, indeterminate_reason: UnknownDispatch}
    terminal_ack_guard: "Only SUCCEEDED/FAILED/CANCELLED with immutable effect/operation/payload binding and current epoch/fence may produce a terminal EffectReceipt."
    dispatch_acceptance_guard:
      accepted_response_requires: [provider_operation_id, provider_operation_id_sha256, effect_key, payload_digest]
      missing_binding_projection: UNKNOWN_DISPATCH
      http_202_is_terminal: false
    reconciliation_projection:
      direct_terminal_ack:
        SUCCEEDED: {effect_status: Succeeded, outcome: Succeeded}
        FAILED: {effect_status: Failed, outcome: Failed}
        CANCELLED: {effect_status: Cancelled, outcome: Cancelled}
      reconciled_terminal_result:
        SUCCEEDED: {effect_status: Reconciled, outcome: Succeeded}
        FAILED: {effect_status: Reconciled, outcome: Failed}
        CANCELLED: {effect_status: Reconciled, outcome: Cancelled}
      reconciled_non_effect_proof: {effect_status: Reconciled, outcome: NoEffect}
      rule: "A terminal result obtained after Indeterminate/RECONCILING is Reconciled; terminal_outcome is carried by the existing TaskFlow-owned ReconcileDecision sidecar, while reservation release/refund alone is not an effect result."
      reconcile_decision_projection:
        owner: taskflow_agent_db
        authbus_record: ReconcileEvidenceRef
        required_fields: [reconciliation_id, effect_id, outcome, evidence_digest, provider_query_receipt_digest, decided_at, authority_epoch, owner_epoch, generation, fencing_token]
        no_parallel_status: true
    provider_status_projection:
      SEALED: {failure_class: BACKEND_SEALED, indeterminate_reason: BackendSealed}
      STANDBY: {failure_class: BACKEND_MISCONFIGURED, indeterminate_reason: StatusLookupUnavailable}
  error_registry:
    source: AUTHBUS_FAILURE_RECONCILE_STATE_MACHINE_v1.contract_crosswalk_v1_2.failure_class
    aliases_decode_only: true
    canonical_classes: [AUTHENTICATION, AUTHORIZATION_OR_SCOPE, BACKEND_MISCONFIGURED, NOT_FOUND, QUOTA_EXHAUSTED, BACKEND_SEALED, THROTTLED, TIMEOUT, CONNECTION_RESET, LOST_RESPONSE, LEASE_STALE, PARTITION, CLOCK_SKEW, INVALID_GRANT, DISK_FULL, WAL_CORRUPT, OOM, OWNER_EPOCH_MISMATCH, RESOURCE_REVOKED, PROVIDER_5XX, QUOTA_UNKNOWN]
    aliases:
      BACKEND_UNAVAILABLE: BACKEND_MISCONFIGURED
      TRANSPORT_UNKNOWN: LOST_RESPONSE
    ambiguous_404: NOT_FOUND_OR_BACKEND_MISCONFIGURED_REQUIRES_DISAMBIGUATION
    status_only_values: [DISPATCH_ACCEPTED]
    quota_denials: [QUOTA_EXHAUSTED, QUOTA_UNKNOWN]
    throttling: [THROTTLED]
    transport_indeterminate: [TIMEOUT, CONNECTION_RESET, LOST_RESPONSE, PARTITION]
    provider_5xx_rule: "PROVIDER_5XX is terminal Failed only when the provider supplies immutable effect/operation/payload binding; otherwise project Indeterminate with Provider5xx and reconcile."
  writer_and_fence:
    durable_writer: authbusd
    dispatch_ref_record: EffectDispatchRef
    canonical_effect_ledger_owner: taskflow_agent_db
    reconcile_decision_owner: taskflow_agent_db
    usage_right_counter_owner: market-adapter
    usage_right_counter_bridge: [ReserveUse, CommitUse, ReleaseUse, UseReservationRef]
    projection_authority: false
    owner_epoch: "Monotonic per writer claim; persisted before admission."
    generation: "agentd launch generation; stale generations cannot renew or report usage."
    fencing_token: "Fresh per owner_epoch/generation and checked on every mutation."
    stale_callback: reject_without_quota_mutation
  hnl_field_crosswalk:
    source_contract: hepta-net-node-link-plan-2026-08-26
    canonical_authbus_fields: [descriptor_node_id, issuer_node_id, local_node_id, remote_node_id, generation, capability_digest, intent_digest, nonce, aud, depth, scope_digest, expires_at, epoch, policy_digest, record_seq, key_id, signature, endpoint_id]
    source_path_mappings:
      NodeDescriptor.node_id: descriptor_node_id
      AgentDelegation.parent_node_id: issuer_node_id
      ConnectIntent.initiator_node: local_node_id
      ConnectIntent.remote_node: remote_node_id
      ConnectIntent.agent_generation: generation
      ConnectIntent.capability_hash: capability_digest
      ConnectIntent.purpose_digest: intent_digest
      ConnectIntent.session_nonce: nonce
      NodeDescriptor.audience: aud
      NodeDescriptor.max_depth: depth
      AgentDelegation.scope: scope_digest
      ConnectIntent.expiry: expires_at
      ConnectIntent.epoch: epoch
      ConnectIntent.policy_digest: policy_digest
      NodeDescriptor.record_seq: record_seq
      NodeDescriptor.key_id: key_id
      NodeDescriptor.signature: signature
      ConnectIntent.transport_endpoint_id: endpoint_id
    hash_preimage: "scope_digest = SHA-256(domain || canonical_scope_bytes); capability_digest and intent_digest preserve HNL canonical byte preimages."
    unmapped_field_policy: reject
    no_widening: true
  ci_rules:
    - reservation_state_mapping_matches_failure_crosswalk
    - effect_status_enum_matches_v14_schema
    - all_quota_domains_are_atomic
    - no_negative_or_fractional_integer_usage
    - usage_deltas_are_idempotent_and_monotonic
    - unknown_quota_never_grants_unbounded_admission
    - same_idempotency_key_changed_payload_is_conflict
    - every_reservation_mutation_has_required_fence_fields
