    invariant: "For consumable dimensions, consumed_vector + held_vector <= limit_vector componentwise whenever known; concurrency active holds <= limit and consumed_vector.concurrency is always zero; context is not aggregate spend without an explicit provider unit."
    dimension_lifecycle_ref: "#/execution_closure_v1_3/usage_vector/dimension_semantics/lifecycle"
    scalar_compatibility:
