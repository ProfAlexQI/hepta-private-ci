          operation_name: RefreshStatusByOperationKey
          request_required: [schema_version, operation_id, provider_id, profile_id, token_family_id, refresh_operation_key, idempotency_key, payload_digest, expected_secret_revision, authority_epoch, owner_epoch, generation, fencing_token, deadline_at, audience, expected_execution_mode, policy_digest]
          response_required: [schema_version, response_id, operation_id, provider_id, profile_id, token_family_id, refresh_operation_key, idempotency_key, payload_digest, expected_secret_revision, authority_epoch, owner_epoch, generation, fencing_token, outcome, secret_revision, response_digest, provider_status, status_revision, observed_at, binding_digest, evidence_profile, provider_query_receipt_digest, execution_mode, mode_attestation_digest, policy_digest, audience, key_epoch, issuer]
          response_nullable: [new_access_secret_ref, new_refresh_secret_ref, signature, key_id, issued_at, expires_at]
          operation_aliases_decode_only: {status_lookup: StatusByEffectKey}
          outcomes: [SUCCEEDED, TRANSIENT_FAILURE, INDETERMINATE, QUARANTINED]
          error_class: [NONE, INVALID_GRANT, UNAUTHORIZED, CONFLICT, TIMEOUT, UNAVAILABLE, SEALED, STALE_FENCE, SCHEMA_INVALID]
      states: [IDLE, CLAIMED, IN_FLIGHT, SUCCEEDED, TRANSIENT_FAILURE, INDETERMINATE, RECONCILING, BACKOFF, QUARANTINED, MANUAL_REQUIRED]
      transitions:
        - [IDLE, claim, CLAIMED]
        - [CLAIMED, dispatch, IN_FLIGHT]
        - [IN_FLIGHT, rotated, SUCCEEDED]
        - [IN_FLIGHT, invalid_grant, QUARANTINED]
        - [IN_FLIGHT, transient_failure, TRANSIENT_FAILURE]
        - [TRANSIENT_FAILURE, retry_scheduled, BACKOFF]
        - [TRANSIENT_FAILURE, retry_budget_exhausted, MANUAL_REQUIRED]
        - [IN_FLIGHT, response_unknown, INDETERMINATE]
        - [INDETERMINATE, lookup, RECONCILING]
        - [RECONCILING, lookup_rotated, SUCCEEDED]
        - [RECONCILING, lookup_invalid_grant, QUARANTINED]
        - [RECONCILING, lookup_transient_failure, BACKOFF]
        - [RECONCILING, lookup_retryable, BACKOFF]
        - [RECONCILING, manual_required, MANUAL_REQUIRED]
        - [MANUAL_REQUIRED, manual_evidence_submitted, RECONCILING]
        - [BACKOFF, claim_again, CLAIMED]
      decode_only_event_aliases:
        verified_rotation: rotated
        response_lost: response_unknown
        unavailable: manual_required
        verified_evidence: manual_evidence_submitted
        budget_remaining: retry_scheduled
        retryable: lookup_retryable
      status_lookup_classification_aliases_decode_only:
        ROTATED: SUCCEEDED
        INVALID_GRANT: QUARANTINED
        TRANSIENT_FAILURE: BACKOFF
        UNKNOWN: INDETERMINATE
      invalid_grant_policy: one_quarantine_then_reauthorize
      response_lost_policy: lookup_only_no_blind_retry
      claim_key: [provider_id, profile_id, token_family_id]
      token_family_writer: authbusd
      fixture_manifest:
        manifest: authbus_contract_vectors_v1/opaque_secret_operation
        positive: [refresh_success, rotate_success, invalid_grant_quarantine, transient_backoff, response_lost_indeterminate, status_lookup]
        negative: [raw_field, changed_digest, stale_fence, blind_retry, synthetic_external_signature]
      terminal: [SUCCEEDED, QUARANTINED]
      invariants: [operation_key_durable_before_call, one_token_family_singleflight, invalid_grant_quarantine_once, no_blind_retry_after_response_loss, old_fence_callback_rejected, no_raw_token_projection]
      compatibility: {deadline: decode_only, deadline_at: encode_only, invalid_grant: classification_only_alias, rotated: result_kind_alias, manual_required: nonterminal_hold_alias, raw_token_fields: reject}
    reconcile_e21:
      id: hepta.auth.reconcile-evidence.v1
      owner: TaskFlow
      public_contract_owner: codex-hepta-contracts.v1.4_e21
      decision_owner: TaskFlow
      authbus_role: proposal_only
      evidence_ref_required: [reconciliation_id, effect_id, effect_intent_id, reconciles_receipt_id, idempotency_key, attempt, operation_ref, outcome, evidence_kind, evidence_digest, external_state_digest, provider_query_receipt_digest, verified_at, decided_at, resolver_attempt, authority_epoch, owner_epoch, generation, fencing_token, payload_digest, policy_digest, current_revision, cas]
      no_effect_proof_required: [proof_id, proof_stage, reconciliation_id, provider_id, provider_namespace, effect_id, effect_intent_id, effect_key, attempt, idempotency_key, operation_ref, proof_kind, dispatch_attempted, dispatch_marker_state, dispatch_marker_digest, outbox_delivery_seq, writer_record_fsync_confirmed, writer_fsync_witness_digest, provider_query_receipt_digest, external_state_digest, evidence_digest, observed_at, verified_at, decided_at, taskflow_decision_id, taskflow_decision_digest, authority_epoch, owner_epoch, generation, fencing_token, payload_digest, current_revision, cas]
      e21_effect_receipt_required: [effect_id, effect_intent_id, decision_id, run_id, schema_digest, status, terminal, reconciliation_required, idempotency_key, attempt, authority_scope, execution_scope, effect_authority, production_authority, snapshot_digest, graph_digest, policy_digest, provider_id, reconciliation_id, reconciles_receipt_id, external_state_digest, resolver_attempt, current_revision, cas]
      reconciliation_id_rule: "recon:v1:<sha256(preimage_v1(domain=hepta.auth.reconciliation.v1; effect_id; effect_intent_id; idempotency_key; attempt; authority_epoch; owner_epoch; generation; fencing_token))>"
      initial_receipt_ref_rule: "receipt-ref:v1:na:<sha256(preimage_v1(domain=hepta.auth.receipt-ref.na.v1; effect_id; effect_intent_id; idempotency_key; attempt; authority_epoch; owner_epoch; generation; fencing_token))>"
      initial_decision_id_rule: "decision-ref:v1:na:<sha256(preimage_v1(domain=hepta.auth.decision-ref.na.v1; effect_id; effect_intent_id; idempotency_key; attempt; status; current_revision; authority_epoch; owner_epoch; generation; fencing_token))>"
      proof_stage: [PROPOSED, COMMITTED]
      proposed_proof_rule: authbusd_may_propose_with_pending_decision_sentinel
      committed_proof_rule: taskflow_decision_and_current_fence_required_before_release_or_refund
      manual_required_is_terminal: false
      manual_required_closes_indeterminate: false
      no_effect_requires: [canonical_no_query_marker, current_fence, taskflow_decision, durable_fsync_witness]
      direct_ack_path: DispatchAttemptStarted_to_DirectTerminalAckRef
      dispatch_paths:
        asynchronous: [DispatchAttemptStarted, DispatchAcceptedRef, EffectAckRef]
        direct_terminal: [DispatchAttemptStarted, DirectTerminalAckRef]
        unknown: [DispatchAttemptStarted, DispatchUnknownRef, Indeterminate, lookup_only_reconcile]
      status_lookup_operation: StatusByEffectKey
      status_lookup_operation_aliases_decode_only: [status_lookup]
      status_lookup_request: [schema_version, request_id, provider_id, provider_namespace, effect_key, payload_digest, idempotency_key, attempt, authority_epoch, owner_epoch, generation, fencing_token, audience, request_nonce, deadline_at, query_revision, retention_hint, expected_execution_mode, policy_digest]
      status_lookup_response: [schema_version, response_id, provider_id, provider_namespace, effect_key, payload_digest, terminal_state, operation_ref, provider_operation_id, provider_operation_id_sha256, ack_digest, observed_at, status_revision, binding_digest, provider_query_receipt_digest, not_found_kind, evidence_profile, execution_mode, mode_attestation_digest, policy_digest, signature, key_id, issued_at, expires_at]
      status_lookup_terminal_state_enum: [UNKNOWN, QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
      status_lookup_terminal_states: [SUCCEEDED, FAILED, CANCELLED]
      status_lookup_response_nullable: [operation_ref, provider_operation_id, provider_operation_id_sha256, ack_digest, signature, key_id, issued_at, expires_at]
      status_lookup_conditional_response:
        terminal: {when: "terminal_state in [SUCCEEDED, FAILED, CANCELLED] and not_found_kind=none", required_non_null: [operation_ref, provider_operation_id, provider_operation_id_sha256, ack_digest, evidence_profile], guard: immutable_terminal_binding}
        non_terminal: {when: "terminal_state in [UNKNOWN, QUEUED, RUNNING]", required_non_null: [observed_at, status_revision, binding_digest, provider_query_receipt_digest, evidence_profile], guard: lookup_only}
        not_found: {when: "not_found_kind in [verified, unavailable, expired]", required_non_null: [provider_query_receipt_digest, observed_at, evidence_profile, not_found_kind, terminal_state], terminal_state: UNKNOWN, forbidden: [operation_ref, provider_operation_id, provider_operation_id_sha256, ack_digest], guard: "verified_not_found_requires_no_effect_proof; unavailable_or_expired_never_closes_effect"}
      not_found_kind: [none, verified, unavailable, expired]
      nonterminal_holds: [ManualRequired, ReconcileBlocked, DispatchUnknownRef, Indeterminate]
      release_guard: verified_terminal_ack_or_canonical_no_effect_proof_and_current_fence
      forbidden: [manual_required_as_terminal, blind_retry_after_unknown, unscoped_404_as_evidence, raw_provider_body_projection, public_no_effect_status]
      not_found_policy:
        verified: no_effect_proof_only
        unavailable: indeterminate
        expired: indeterminate
        unscoped_404: reject_as_evidence
      fixture_manifest:
        manifest: authbus_contract_vectors_v1/reconcile_e21
        positive: [queued, running, direct_success, direct_failed, direct_cancelled, indeterminate, reconciled_success, pre_dispatch_no_effect, verified_not_found, manual_hold]
        negative: [missing_e21_field, wrong_digest, receipt_chain_mismatch, stale_fence, manual_terminal, unknown_release, forged_no_query, synthetic_external_signature]
