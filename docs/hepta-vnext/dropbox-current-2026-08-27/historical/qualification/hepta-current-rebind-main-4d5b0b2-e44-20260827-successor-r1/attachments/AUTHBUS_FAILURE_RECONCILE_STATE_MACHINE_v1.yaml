schema: hepta.authbus.failure-reconcile.v1
plan_id: AUTHBUS-PLAN-2026-08-26
status: PLANNING_ONLY
authority: false
source_status: STALE_SOURCE_BINDING
implementation_branch: not-created
source_binding:
  basil_repo: https://github.com/openbasil/basil
  basil_commit: 1fd29adb8e7356968eacbff9309e056cec9bafd7
  basil_version: 0.7.2-main-snapshot
  license: Apache-2.0
purpose: >-
  Deterministic state, fencing, WAL, and reconcile inputs for AuthBus. Unknown external outcomes
  remain unknown until a status-by-key or equivalent reconcile proves a terminal result.

canonical_protocol:
  reuse: [CommandEnvelope, EffectIntent, ActivityReceipt, EffectReceipt, ReconcileDecision, FailureClass, IndeterminateReason, CapabilityId]
  no_parallel_protocol: true

mutation_fence:
  required: [command_id, idempotency_key, expected_revision, authority_epoch, owner_epoch, generation, fencing_token, policy_digest, resource_digest]
  duplicate_rule: "Same key plus same digest returns the original receipt; same key plus changed digest is CONFLICT."
  stale_rule: "Any stale epoch, generation, or fence is denied without dispatch."

flows:
  source_semantics: "The v1 flow/state lists and transitions below are decode-only historical inputs; AUTHBUS_CANONICAL_CONTRACT_REGISTRY_v1.yaml#/registry/projection_contract_map is the sole semantic source for new code, with this file's execution_closure_v1_3 retained as a generated domain projection."
  effect:
    states: [REQUESTED, ADMITTED, RESERVED, EFFECT_INTENT_DURABLE, DISPATCH_ATTEMPT_DURABLE, DISPATCH_UNKNOWN, DISPATCH_ACCEPTED, ACKED, PARTIAL, INDETERMINATE, RECONCILING, FAILED, RELEASED, REFUNDED, CANCELLED]
    terminal: [ACKED, FAILED, RELEASED, REFUNDED, CANCELLED]
    state_semantics:
      EFFECT_INTENT_DURABLE: authbusd_dispatch_ref_only_not_taskflow_effect_ledger
      DISPATCH_ATTEMPT_DURABLE: internal_dispatch_attempt_subrecord
      DISPATCH_UNKNOWN: internal_unknown_dispatch_subrecord
      ACKED: taskflow_effect_receipt_projection_only
  lease:
    states: [PROPOSED, ACTIVE, RENEWED, REVOKED, EXPIRED, STALE_OWNER]
    terminal: [REVOKED, EXPIRED, STALE_OWNER]
  refresh:
    states: [IDLE, CLAIMED, IN_FLIGHT, SUCCEEDED, TRANSIENT_FAILURE, INDETERMINATE, BACKOFF, QUARANTINED]
    terminal: [SUCCEEDED, QUARANTINED]
  virtual_credential:
    states: [ISSUED, ACTIVE, PARTIAL, REVOKED, EXPIRED]
    terminal: [REVOKED, EXPIRED]
  usage_right:
    states: [OFFER, QUOTE, ORDER, ESCROW_HELD, RESERVED, ACTIVE, PARTIALLY_CONSUMED, SETTLED, REFUNDED, DISPUTED, CLOSED]
    terminal: [SETTLED, REFUNDED, CLOSED]
    source_semantics: decode_only_historical_projection

initial_states:
  effect: REQUESTED
  lease: PROPOSED
  refresh: IDLE
  virtual_credential: ISSUED
  usage_right: OFFER

entry_events:
  lease: {PROPOSED: resource_registered, ACTIVE: lease_granted}
  refresh: {IDLE: profile_loaded, TRANSIENT_FAILURE: transient_refresh_error, INDETERMINATE: refresh_response_unknown}
  virtual_credential: {ISSUED: capability_issued}
  usage_right: {OFFER: offer_created}

cross_file_flow:
  usage_right_transitions_owner: AUTHBUS_ABUSE_DISPUTE_POLICY_v1
  canonical_effect_ledger_owner: taskflow_agent_db
  authbus_dispatch_ref_owner: authbusd_wal
  shared_invariants: [terminal_immutable, idempotency_key, owner_epoch, generation, fencing_token]

transition_invariants:
  effect_intent_dispatch:
    external_dispatch: true
    precondition: intent_fsynced
    accepted_response_is_terminal: false
  terminal_ack:
    accepted_states: [SUCCEEDED, FAILED, CANCELLED]
    required_binding: [effect_id, effect_intent_id, idempotency_key, provider_operation_id, provider_operation_id_sha256, payload_digest]
    required_proof: immutable_provider_terminal_state_and_current_epoch_fence
    non_terminal_states: [UNKNOWN, QUEUED, RUNNING]
    non_terminal_action: remain_indeterminate_or_reconciling
  causal_lineage:
    public_wire_field: causal_parent_event_id
    internal_event_store_field: causal_parent_seq
    mapping_rule: "Resolve seq through the immutable event_seq→event_id index; never cast a numeric sequence to an event id."
    canonical_source: e21_v1_4_public_event_schema_plus_hepta_event_store
  reconcile_worker_unavailable:
    action: hold_and_bounded_retry_or_operator_review
    blind_retry: false
  refund:
    requires: [non_effect_proof, wallet_authorization_or_independent_adjudication]

transitions:
  - id: effect_admit
    flow: effect
    from: REQUESTED
    event: admission_accepted
    to: ADMITTED
    guard: policy_and_identity_valid
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: false
    idempotent: true
    recovery_action: replay_command
    terminal: false
  - id: effect_reserve
    flow: effect
    from: ADMITTED
    event: quota_held
    to: RESERVED
    guard: all_quota_domains_have_capacity
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: release_or_reconcile
    terminal: false
  - id: effect_intent
    flow: effect
    from: RESERVED
    event: intent_fsynced
    to: EFFECT_INTENT_DURABLE
    guard: wal_fsync_complete
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: dispatch_or_reconcile_by_operation_key
    authbus_record: EffectIntentDurable
    canonical_effect_owner: taskflow_agent_db
    terminal: false
  - id: dispatch_accept
    flow: effect
    from: DISPATCH_ATTEMPT_DURABLE
    event: provider_accepted
    to: DISPATCH_ACCEPTED
    guard: operation_ref_recorded
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: false
    idempotent: true
    recovery_action: lookup_operation
    terminal: false
  - id: dispatch_attempt_started
    flow: effect
    from: EFFECT_INTENT_DURABLE
    event: dispatch_attempt_started
    to: DISPATCH_ATTEMPT_DURABLE
    guard: intent_fsynced_and_current_fence
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: lookup_or_mark_unknown
    terminal: false
  - id: dispatch_unknown
    flow: effect
    from: DISPATCH_ATTEMPT_DURABLE
    event: dispatch_response_unknown
    to: DISPATCH_UNKNOWN
    guard: adapter_called_without_verified_response
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: reconcile_by_effect_key
    terminal: false
  - id: dispatch_unknown_to_indeterminate
    flow: effect
    from: DISPATCH_UNKNOWN
    event: reconcile_required
    to: INDETERMINATE
    guard: no_verified_terminal_ack
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: hold_and_reconcile
    terminal: false
  - id: effect_ack
    flow: effect
    from: [DISPATCH_ACCEPTED, RECONCILING]
    event: terminal_ack
    to: ACKED
    guard: verified_immutable_terminal_ack_succeeded
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: false
    idempotent: true
    recovery_action: finalize_usage
    terminal: true
  - id: effect_failed_ack
    flow: effect
    from: [DISPATCH_ACCEPTED, RECONCILING, PARTIAL]
    event: terminal_ack_failed
    to: FAILED
    guard: verified_immutable_terminal_ack_failed
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: false
    idempotent: true
    recovery_action: release_or_refund
    terminal: true
  - id: effect_cancelled_ack
    flow: effect
    from: [DISPATCH_ACCEPTED, RECONCILING, PARTIAL]
    event: terminal_ack_cancelled
    to: CANCELLED
    guard: verified_immutable_terminal_ack_cancelled
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: false
    idempotent: true
    recovery_action: release_or_refund
    terminal: true
  - id: effect_unknown_after_dispatch
    flow: effect
    from: DISPATCH_ACCEPTED
    event: timeout_or_lost_response
    to: INDETERMINATE
    guard: dispatch_attempted_and_no_verified_terminal_ack
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: false
    idempotent: true
    recovery_action: hold_and_reconcile
    terminal: false
  - id: effect_release_before_dispatch
    flow: effect
    from: EFFECT_INTENT_DURABLE
    event: dispatch_not_attempted_and_cancelled
    to: RELEASED
    guard: no_external_dispatch_attempt
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: release_reservation
    terminal: true
  - id: reconcile_start
    flow: effect
    from: INDETERMINATE
    event: reconcile_requested
    to: RECONCILING
    guard: reconcile_worker_available
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: false
    idempotent: true
    recovery_action: bounded_lookup_backoff
    terminal: false
  - id: reconcile_ack
    flow: effect
    from: RECONCILING
    event: verified_terminal_ack
    to: ACKED
    guard: verified_immutable_terminal_ack_succeeded
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: false
    idempotent: true
    recovery_action: finalize_usage
    terminal: true
  - id: reconcile_cancelled
    flow: effect
    from: RECONCILING
    event: verified_terminal_cancel
    to: CANCELLED
    guard: verified_immutable_terminal_ack_cancelled
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: false
    idempotent: true
    recovery_action: release_or_refund
    terminal: true
  - id: reconcile_failed
    flow: effect
    from: RECONCILING
    event: verified_terminal_failure
    to: FAILED
    guard: verified_immutable_terminal_ack_failed
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: false
    idempotent: true
    recovery_action: release_or_refund
    terminal: true
  - id: reconcile_release
    flow: effect
    from: [INDETERMINATE, RECONCILING]
    event: non_effect_proof
    to: RELEASED
    guard: provider_or_operator_proves_no_effect
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: false
    idempotent: true
    recovery_action: release_reservation
    terminal: true
  - id: reconcile_refund
    flow: effect
    from: [INDETERMINATE, RECONCILING]
    event: authorized_refund
    to: REFUNDED
    guard: non_effect_proof_and_wallet_authorization
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: false
    idempotent: true
    recovery_action: wallet_refund
    terminal: true
  - id: effect_cancel
    flow: effect
    from: [REQUESTED, ADMITTED, RESERVED]
    event: caller_cancelled
    to: CANCELLED
    guard: no_terminal_dispatch_or_cancel_is_supported
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: release_reservation
    terminal: true
  - id: effect_partial
    flow: effect
    from: [DISPATCH_ACCEPTED, RECONCILING]
    event: partial_stream_usage
    to: PARTIAL
    guard: partial_usage_receipt_valid
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: false
    idempotent: true
    recovery_action: continue_or_cancel_and_reconcile
    terminal: false
  - id: effect_partial_ack
    flow: effect
    from: PARTIAL
    event: terminal_ack
    to: ACKED
    guard: verified_immutable_terminal_ack_succeeded
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: false
    idempotent: true
    recovery_action: finalize_usage
    terminal: true
  - id: lease_renew
    flow: lease
    from: ACTIVE
    event: renewal_accepted
    to: RENEWED
    guard: owner_generation_and_epoch_match
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: replay_renewal
    terminal: false
  - id: lease_activate
    flow: lease
    from: PROPOSED
    event: lease_granted
    to: ACTIVE
    guard: owner_and_subject_fence_valid
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: replay_activation
    terminal: false
  - id: lease_renew_again
    flow: lease
    from: RENEWED
    event: renewal_accepted
    to: RENEWED
    guard: owner_generation_and_epoch_match
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: replay_renewal
    terminal: false
  - id: lease_expire
    flow: lease
    from: [ACTIVE, RENEWED, PROPOSED]
    event: ttl_elapsed
    to: EXPIRED
    guard: monotonic_expiry_reached
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: release_reservation
    terminal: true
  - id: lease_stale_owner
    flow: lease
    from: [ACTIVE, RENEWED]
    event: owner_epoch_mismatch
    to: STALE_OWNER
    guard: fencing_token_rejected
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: drain_and_reconcile
    terminal: true
  - id: refresh_claim
    flow: refresh
    from: IDLE
    event: refresh_claimed
    to: CLAIMED
    guard: profile_cas_wins
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: retry_claim
    terminal: false
  - id: refresh_start
    flow: refresh
    from: CLAIMED
    event: refresh_started
    to: IN_FLIGHT
    guard: owner_generation_valid
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: reconcile_refresh
    terminal: false
  - id: refresh_success
    flow: refresh
    from: IN_FLIGHT
    event: refresh_succeeded
    to: SUCCEEDED
    guard: token_family_cas_wins
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: publish_secret_ref_metadata
    terminal: true
  - id: refresh_backoff
    flow: refresh
    from: [IN_FLIGHT, TRANSIENT_FAILURE, INDETERMINATE]
    event: transient_failure_or_timeout
    to: BACKOFF
    guard: retry_budget_available
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: bounded_retry_or_reconcile
    terminal: false
  - id: refresh_transient
    flow: refresh
    from: IN_FLIGHT
    event: transient_refresh_error
    to: TRANSIENT_FAILURE
    guard: retryable_provider_error
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: enter_backoff
    terminal: false
  - id: refresh_indeterminate
    flow: refresh
    from: IN_FLIGHT
    event: refresh_response_unknown
    to: INDETERMINATE
    guard: no_verified_token_family_result
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: reconcile_refresh
    terminal: false
  - id: refresh_retry
    flow: refresh
    from: BACKOFF
    event: backoff_elapsed
    to: CLAIMED
    guard: profile_still_eligible
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: retry_claim
    terminal: false
  - id: credential_revoke
    flow: virtual_credential
    from: [ISSUED, ACTIVE, PARTIAL]
    event: revoke
    to: REVOKED
    guard: owner_or_policy_authorized
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: stop_new_admission
    terminal: true
  - id: credential_expire
    flow: virtual_credential
    from: [ISSUED, ACTIVE, PARTIAL]
    event: ttl_elapsed
    to: EXPIRED
    guard: monotonic_expiry_reached
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: stop_new_admission
    terminal: true
  - id: lease_revoke
    flow: lease
    from: [ACTIVE, RENEWED]
    event: revoke_or_epoch_bump
    to: REVOKED
    guard: owner_or_policy_authorized
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: drain_and_record
    terminal: true
  - id: refresh_quarantine
    flow: refresh
    from: [IN_FLIGHT, INDETERMINATE, TRANSIENT_FAILURE]
    event: invalid_grant
    to: QUARANTINED
    guard: token_family_cas_wins
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: require_reauthorization
    terminal: true
  - id: credential_activate
    flow: virtual_credential
    from: ISSUED
    event: first_authenticated_use
    to: ACTIVE
    guard: audience_ttl_and_jti_valid
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: replay_activation
    terminal: false
  - id: credential_partial
    flow: virtual_credential
    from: ACTIVE
    event: partial_usage
    to: PARTIAL
    guard: metering_receipt_valid
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: continue_or_reconcile
    terminal: false
  - id: right_quote
    flow: usage_right
    from: OFFER
    event: quote_accepted
    to: QUOTE
    guard: scope_and_terms_valid
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: replay_quote
    terminal: false
  - id: right_order
    flow: usage_right
    from: QUOTE
    event: order_created
    to: ORDER
    guard: buyer_scope_valid
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: replay_order
    terminal: false
  - id: right_escrow
    flow: usage_right
    from: ORDER
    event: escrow_held
    to: ESCROW_HELD
    guard: walletd_receipt_valid
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: query_walletd
    terminal: false
  - id: right_reserve
    flow: usage_right
    from: ESCROW_HELD
    event: permit_reserved
    to: RESERVED
    guard: authbus_permit_valid
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: reconcile_permit
    terminal: false
  - id: right_activate
    flow: usage_right
    from: RESERVED
    event: first_use
    to: ACTIVE
    guard: virtual_credential_valid
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: reconcile_usage
    terminal: false
  - id: right_partial
    flow: usage_right
    from: ACTIVE
    event: usage_reported
    to: PARTIALLY_CONSUMED
    guard: metering_receipt_valid
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: reconcile_usage
    terminal: false
  - id: right_dispute
    flow: usage_right
    from: [ESCROW_HELD, RESERVED, ACTIVE, PARTIALLY_CONSUMED]
    event: evidence_conflict
    to: DISPUTED
    guard: evidence_digest_conflict
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: hold_and_escalate
    terminal: false
  - id: right_usage_repeat
    flow: usage_right
    from: PARTIALLY_CONSUMED
    event: usage_reported
    to: PARTIALLY_CONSUMED
    guard: usage_id_is_new_or_idempotently_replayed
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: retain_monotonic_usage_head
    terminal: false
  - id: right_effect_failed
    flow: usage_right
    from: [ACTIVE, PARTIALLY_CONSUMED]
    event: effect_failed
    to: DISPUTED
    guard: terminal_failure_or_evidence_conflict_recorded
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: hold_and_escalate
    terminal: false
  - id: right_settle
    flow: usage_right
    from: [PARTIALLY_CONSUMED, DISPUTED]
    event: authorized_settlement
    to: SETTLED
    guard: walletd_and_adjudicator_authorized
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: false
    idempotent: true
    recovery_action: query_walletd
    terminal: true
  - id: right_refund
    flow: usage_right
    from: [ESCROW_HELD, RESERVED, PARTIALLY_CONSUMED, DISPUTED]
    event: authorized_refund
    to: REFUNDED
    guard: non_effect_proof_or_adjudicator_authorized
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: false
    idempotent: true
    recovery_action: query_walletd
    terminal: true
  - id: right_close
    flow: usage_right
    from: DISPUTED
    event: adjudication_closed
    to: CLOSED
    guard: outcome_and_appeal_window_recorded
    cas_required: true
    epoch_fence: true
    durable_before_dispatch: true
    idempotent: true
    recovery_action: preserve_evidence_refs
    terminal: true

wal:
  version: "1.2"
  single_writer: authbusd
  records: [CommandAccepted, ReservationHeld, EffectIntentDurable, DispatchAttemptStarted, DispatchAcceptedRef, DispatchUnknownRef, EffectAckRef, IndeterminateRef, ReconcileAttempt, Release, Refund, Revoke, EpochBump, PolicyReload, ProjectionCursor]
  fsync_order:
    - append_command_and_reservation
    - fsync_wal_and_directory
    - append_effect_intent_durable
    - fsync_wal_and_directory
    - append_dispatch_attempt_started
    - fsync_wal_and_directory
    - dispatch_to_adapter
    - append_dispatch_accepted_or_unknown_ref
    - fsync_wal_and_directory
  marker_visibility: internal_subrecord_not_public_effect_status
  recovery_rule: lookup_by_effect_key_or_provider_idempotency_key_before_any_new_attempt
  canonical_effect_ledger_owner: taskflow_agent_db
  authbus_wal_effect_content: effect_id_intent_digest_operation_ref_and_dispatch_state_only
  replay:
    dedupe_by: idempotency_key_and_payload_digest
    unknown_dispatch: reconcile_only
    projection_is_authority: false
    terminal_immutable: true
  corruption: safe_stop_and_operator_recovery
  disk_full: safe_stop_without_new_admission

failure_classes:
  - id: AUTHENTICATION
    disposition: QUARANTINED
    retry: after_reauth
    reconcile: false
  - id: AUTHORIZATION_OR_SCOPE
    disposition: DENIED
    retry: false
    reconcile: false
  - id: BACKEND_MISCONFIGURED
    disposition: SAFE_STOP
    retry: operator_recovery
    reconcile: false
  - id: NOT_FOUND
    disposition: DENIED
    retry: false
    reconcile: false
  - id: AUTHZ_DENIED
    disposition: DENIED
    retry: false
    reconcile: false
  - id: QUOTA_EXHAUSTED
    disposition: DENIED
    retry: after_observation
    reconcile: false
  - id: BACKEND_SEALED
    disposition: UNAVAILABLE
    retry: after_health_change
    reconcile: true
  - id: THROTTLED
    disposition: COOLDOWN
    retry: after_retry_after
    reconcile: false
  - id: TIMEOUT
    disposition: INDETERMINATE
    retry: false
    reconcile: true
  - id: CONNECTION_RESET
    disposition: INDETERMINATE
    retry: false
    reconcile: true
  - id: LOST_RESPONSE
    disposition: INDETERMINATE
    retry: false
    reconcile: true
  - id: LEASE_STALE
    disposition: DENIED
    retry: false
    reconcile: false
  - id: PARTITION
    disposition: INDETERMINATE
    retry: false
    reconcile: true
  - id: CLOCK_SKEW
    disposition: SAFE_STOP
    retry: after_clock_health
    reconcile: false
  - id: INVALID_GRANT
    disposition: QUARANTINED
    retry: false
    reconcile: false
  - id: DISK_FULL
    disposition: SAFE_STOP
    retry: operator_recovery
    reconcile: true
  - id: WAL_CORRUPT
    disposition: SAFE_STOP
    retry: operator_recovery
    reconcile: true
  - id: OOM
    disposition: SAFE_STOP
    retry: after_restart_and_reconcile
    reconcile: true
  - id: OWNER_EPOCH_MISMATCH
    disposition: DENIED
    retry: false
    reconcile: true
  - id: RESOURCE_REVOKED
    disposition: DENIED
    retry: false
    reconcile: false
  - id: PROVIDER_5XX
    disposition: INDETERMINATE
    retry: false
    reconcile: true
  - id: QUOTA_UNKNOWN
    disposition: DENIED
    retry: after_authoritative_observation
    reconcile: false

clock:
  snapshot_fields: [wall_time, monotonic_time, uncertainty_ms]
  rollback: safe_stop
  lease_expiry: monotonic_plus_uncertainty_bound
  remote_timestamp: observation_only

partition:
  owner_unreachable: no_new_leases
  existing_permits: ttl_and_fence_only
  remote_stale_status: indeterminate
  multi_primary: forbidden
  recovery: owner_epoch_bump_then_reconcile

reconcile:
  lookup_order: [durable_operation_ref, provider_status_by_effect_key, provider_status_by_operation_id, operator_review]
  backoff: bounded_exponential_with_jitter
  max_attempts: 32
  max_attempts_upper_bound: 32
  max_attempts_rule: "Implementations may choose a smaller finite positive value, never zero, infinite, or greater than 32."
  retry_rule: bounded_and_jittered_never_unbounded
  terminal_requirement: immutable_ack_or_terminal_failure_or_non_effect_proof
  refund_requirement: non_effect_proof_and_wallet_authorization_or_independent_adjudication
  status_lookup_unavailable: hold_and_bounded_retry_or_operator_review
  unknown_effect_escrow: hold
  blind_retry: forbidden

test_matrix:
  - crash_before_wal
  - crash_after_reservation
  - crash_after_intent_before_dispatch
  - crash_after_dispatch_before_ack
  - lost_response
  - duplicate_replay
  - changed_payload_same_key
  - owner_epoch_bump
  - network_partition
  - clock_rollback
  - disk_full
  - wal_corrupt
  - sealed_backend
  - concurrent_refresh
  - invalid_grant
  - partial_stream_cancel
  - terminal_ack_replay

claims_not_allowed:
  - "Crash/reopen is not physical power-loss evidence."
  - "HTTP 202 or queued is not a terminal effect proof."
  - "Local fixture behavior is not an external provider exactly-once contract."
  - "Agent projection or Basil audit is not the AuthBus durable writer."

negative_authority_flags:
  authority: false
  production_caller: false
  production_writer: false
  effect_authority: false
  operator_acceptance: false
  promotion: false
  execute_allowed: false

legacy_projection:
  top_level_flows_and_transitions: decode_only
  canonical_consumer: "AUTHBUS_CANONICAL_CONTRACT_REGISTRY_v1.yaml#/registry/projection_contract_map"
  legacy_status_aliases: [ACKED, RELEASED, REFUNDED, DISPATCHED, PARTIAL, AUTHZ_DENIED]

