      - {from: DISPUTED, event: appeal_opened, to: DISPUTED}
      - {from: DISPUTED, event: adjudicated_close, to: CLOSED}
    legacy_event_aliases:
      escrow_held:
        canonical: escrow_confirmed
        allowed_from: [ORDER]
        new_events_forbidden: true
      authorized_settlement:
        by_source_state:
          PARTIALLY_CONSUMED: terminal_receipt
          DISPUTED: adjudicated_settle
        new_events_forbidden: true
      authorized_refund:
        by_source_state:
          PARTIALLY_CONSUMED: approved_refund
          DISPUTED: adjudicated_refund
        new_events_forbidden: true
      adjudication_closed: adjudicated_close
    terminal_states: [SETTLED, REFUNDED, CLOSED]
    terminal_immutable: true
    terminal_guards:
      SETTLED: wallet_disposition_receipt_covers_settlement_and_fees
      REFUNDED: wallet_disposition_receipt_covers_refund_and_any_settlement_or_fee
      CLOSED: wallet_no_funds_or_explicit_disposition_receipt
    reject_rule: "adjudicated_reject is non-terminal; remain DISPUTED until explicit wallet disposition or no-funds adjudicated_close."
  failure_class:
    canonical_enum: [AUTHENTICATION, AUTHORIZATION_OR_SCOPE, BACKEND_MISCONFIGURED, NOT_FOUND, QUOTA_EXHAUSTED, BACKEND_SEALED, THROTTLED, TIMEOUT, CONNECTION_RESET, LOST_RESPONSE, LEASE_STALE, PARTITION, CLOCK_SKEW, INVALID_GRANT, DISK_FULL, WAL_CORRUPT, OOM, OWNER_EPOCH_MISMATCH, RESOURCE_REVOKED, PROVIDER_5XX, QUOTA_UNKNOWN]
    aliases:
      AUTHZ_DENIED: AUTHORIZATION_OR_SCOPE
      BACKEND_UNAVAILABLE: BACKEND_MISCONFIGURED
      TRANSPORT_UNKNOWN: LOST_RESPONSE
    alias_policy: accept_on_decode_only_and_emit_canonical
  indeterminate_reason:
    canonical_enum: [Timeout, ConnectionReset, LostResponse, NetworkPartition, Provider5xx, BackendSealed, DiskFull, WalCorrupt, Oom, OwnerEpochMismatch, UnknownDispatch, RefreshResponseUnknown, StatusLookupUnavailable]
    mapping:
      TIMEOUT: Timeout
      CONNECTION_RESET: ConnectionReset
      LOST_RESPONSE: LostResponse
      PARTITION: NetworkPartition
      PROVIDER_5XX: Provider5xx
      BACKEND_SEALED: BackendSealed
      DISK_FULL: DiskFull
      WAL_CORRUPT: WalCorrupt
      OOM: Oom
      OWNER_EPOCH_MISMATCH: OwnerEpochMismatch
      TRANSPORT_UNKNOWN: UnknownDispatch
      UNKNOWN_DISPATCH: UnknownDispatch
      DISPATCH_UNKNOWN: UnknownDispatch
      STATUS_LOOKUP_UNAVAILABLE: StatusLookupUnavailable
      BACKEND_UNAVAILABLE: StatusLookupUnavailable
      PROVIDER_STATUS_UNAVAILABLE: StatusLookupUnavailable
  dispatch_attempt:
    marker_state: DISPATCH_ATTEMPT_DURABLE
    marker_event: DispatchAttemptStarted
    visibility: internal_subrecord
    public_effect_state: EFFECT_INTENT_DURABLE
    required_fields: [effect_id, effect_intent_id, idempotency_key, attempt, operation_key, call_digest, adapter_id, command_id, run_id, aggregate_id, expected_revision, authority_epoch, owner_epoch, generation, fencing_token, logical_clock, payload_digest, policy_digest, resource_digest, causal_parent_event_id]
    fsync_before_adapter_call: true
    crash_after_marker: lookup_by_effect_key_or_idempotency_key_only
    blind_retry: forbidden
    not_found_new_attempt_requires: [verified_not_found, provider_idempotency_scope, no_effect_proof, current_epoch_and_fence]
    marker_then_release_or_refund: forbidden
  owner_epoch_algorithm:
    authority_epoch: "Increment only on authority transfer or policy epoch change; persist before accepting commands."
    owner_epoch: "Increment atomically on every writer claim/transfer; never reuse a prior value."
    generation: "Issued by agentd at launch and invalidated on process replacement."
    fencing_token: "Fresh random token bound to owner_epoch and generation; stale values are rejected."
    split_brain: no_new_admission_and_reconcile
  ci_rules:
    - canonical_effect_statuses_equal_v14_schema
    - activity_and_effect_domains_are_distinct_and_shared_names_require_domain_context
    - quota_reservation_mapping_total_and_semantics_preserving
    - reservation_terminal_outcomes_do_not_project_effect_receipt
    - usage_right_projection_byte_equivalent_to_abuse_policy_owner
    - legacy_aliases_decode_only
    - every_mutation_has_required_fence_fields
    - public_and_internal_causal_lineage_is_mapped_explicitly
    - base_contract_fields_are_present_before_authbus_extension_fields
    - dispatch_marker_fsync_precedes_adapter_call
    - indeterminate_never_terminal_without_reconcile
    - reconciliation_terminal_results_project_reconciled_with_terminal_outcome
    - normative_state_machines_are_the_only_transition_source
    - unbound_provider_failure_cannot_be_emitted_as_terminal_failed
    - hnl_source_path_mapping_is_role_qualified_and_lossless
    - usage_right_counter_has_one_writer_and_fenced_bridge
    - reserved_plus_consumed_never_exceeds_max_uses
    - reconcile_decision_is_taskflow_owned_sidecar_not_new_effect_status

# AUTHBUS.11 v1.3 execution closure.  The v1.2 crosswalk and historical state
# lists remain available for decode; this block is the only new transition source.
execution_closure_v1_3:
  id: AUTHBUS.11-execution-closure-v1.3
  normative: true
  execution_input: false
  role: generated_contract_projection
  projection_only: true
  canonical_registry_status: REQUIRED_AT_B2
  canonical_registry_ref: AUTHBUS_CANONICAL_CONTRACT_REGISTRY_v1.yaml#/registry
  source_registry_ref: AUTHBUS_CANONICAL_CONTRACT_REGISTRY_v1.yaml#/registry
  source_registry_digest: PENDING_AT_B2
  projection_transform: [metadata_wrapper, domain_grouping, decode_alias, evidence_ref_and_no_effect_proof_named_objects, delivery_and_attempt_named_objects, reconciliation_named_objects, operation_map]
  execution_input_via: AUTHBUS_CANONICAL_CONTRACT_REGISTRY_v1.yaml#/registry/projection_contract_map
  projection_authority: registry_only
  semantic_source_ref: AUTHBUS_CANONICAL_CONTRACT_REGISTRY_v1.yaml#/registry
  codegen_allowed_before_registry: false
  canonical_contract_owner: codex-hepta-contracts.v1.4_e21
  authbus_contract_owner: hepta-auth-contracts.v1
  wire_namespace: hepta.auth.v1
  supersedes_crosswalk: contract_crosswalk_v1_2
  prior_crosswalk_consumption: decode_only_historical
  no_runtime_authority_change: true
  canonical_shared:
    projection_id: AUTHBUS.11
    version: "1.3"
    canonical_source: "codex-hepta-contracts.v1.4_e21 + hepta-auth-contracts.v1"
    wire_namespace: hepta.auth.v1
    causal_lineage: {public_wire_field: causal_parent_event_id, internal_event_store_field: causal_parent_seq, mapping_rule: "Resolve internal seq through immutable event_seq->event_id index; never cast a numeric sequence to an event id.", public_schema: e21_v1_4}
    field_aliases: {revision: expected_revision, agent_generation: generation, fence: fencing_token, payload_sha256: payload_digest, resource_sha256: resource_digest}
    base_mutation_fields: [schema_version, command_id, run_id, aggregate_id, expected_revision, authority_epoch, owner_epoch, generation, fencing_token, logical_clock, causal_parent_event_id, payload_digest, policy_digest, resource_digest]
    serialization_contexts:
      e21_public_envelope: {version: codex-hepta-contracts.v1.4_e21, domain: hepta.e21, encoding: sha256-canonical-json, field_order: schema_order, unknown_fields: reject, null_rule: tagged_null}
      authbus_object: {version: hepta-auth-contracts.v1, domain: hepta.auth.v1, encoding: length_delimited_canonical_bytes, field_order: lexicographic_field_name_then_value, unknown_fields: reject, null_rule: tagged_null}
      basil_transport: {version: basil.broker.v1, domain: hepta.auth.basil.v1, encoding: protobuf_length_delimited_canonical_bytes, field_order: canonical_bytes_then_digest, unknown_fields: reject, null_rule: tagged_null}
      hnl_cose_cbor: {version: HNL-0..6, domain: hepta.hnl.v1, encoding: canonical_cbor_cose_sign1, field_order: cbor_canonical, unknown_fields: reject, null_rule: tagged_null}
      gateway_token: {version: hepta-gateway.v1, domain: hepta.gateway.v1, encoding: jwt_or_cose_sign1, field_order: registered_claim_order, unknown_fields: reject, null_rule: tagged_null}
    time_alias_scope: {lease_resource: rfc3339_utc_plus_monotonic_snapshot_and_uncertainty, jwt_cose: numeric_date, hnl_cbor: hnl_native_units, aliases_encode: declared_context_only}
    status_error_registry_ref: AUTHBUS_CANONICAL_CONTRACT_REGISTRY_v1.yaml#/registry/status_error_registry
    e21_effect_receipt_required: [effect_id, effect_intent_id, decision_id, run_id, schema_digest, status, terminal, reconciliation_required, idempotency_key, attempt, authority_scope, execution_scope, effect_authority, production_authority, snapshot_digest, graph_digest, policy_digest, provider_id, reconciliation_id, reconciles_receipt_id, external_state_digest, resolver_attempt, current_revision, cas]
  status_error_projection:
    source_ref: AUTHBUS_CANONICAL_CONTRACT_REGISTRY_v1.yaml#/registry/status_error_registry
    canonical_emit: true
    id: hepta-auth-contracts.v1/registry/status-error.v1
    effect_public_status: [Queued, DispatchAccepted, Running, Succeeded, Failed, Cancelled, Indeterminate, Reconciled]
    quota_reservation_status: [Proposed, Held, DispatchAttempted, DispatchAccepted, PartiallyConsumed, Indeterminate, Released, Refunded, Expired]
    internal_dispatch_states: [EffectIntentDurable, DispatchAttemptStarted, DispatchAcceptedRef, DirectTerminalAckRef, DispatchUnknownRef, EffectAckRef, IndeterminateRef, ReconcileQueued, Reconciled]
    internal_dispatch_aliases_decode_only: {AckRef: EffectAckRef, EffectDispatchRefDurable: EffectIntentDurable}
    terminal_public_status: [Succeeded, Failed, Cancelled, Reconciled]
    nonterminal_holds: [Indeterminate, ManualRequired, ReconcileBlocked, DispatchUnknownRef]
    terminal_hold_policy: "ManualRequired, ReconcileBlocked and DispatchUnknownRef are holds, never terminal states. They cannot release/refund quota or escrow, create a new provider attempt, or close an E21 receipt without a verified terminal ACK or NoEffectProof and a current fence."
    errors: [InvalidRequest, Conflict, StaleRevision, StaleEpoch, StaleGeneration, FencingRejected, ForbiddenCapability, ProviderUnavailable, ProviderUnknown, InvalidGrant, ReconcileUnavailable, ManualRequired, ReconcileBlocked, QuotaExceeded, QuotaUnknown, RetentionExpired, SignatureInvalid, AudienceMismatch, ReplayDetected]
    legacy_aliases_decode_only: {ACKED: Succeeded, DISPATCHED: DispatchAccepted, RECONCILING: Indeterminate, RELEASED: Released, REFUNDED: Refunded, RECONCILE_BLOCKED: ManualRequired}
    quota_reservation_aliases_decode_only: {PROPOSED: Proposed, HELD: Held, DISPATCH_ATTEMPTED: DispatchAttempted, DISPATCHED: DispatchAccepted, PARTIAL: PartiallyConsumed, INDETERMINATE: Indeterminate, RELEASED: Released, REFUNDED: Refunded, EXPIRED: Expired}
  receipt_identity:
    id_pattern: "^[A-Za-z0-9._:-]{1,128}$"
    effect_receipt_ref:
      format: "receipt-ref:v1:<sha256>"
      canonical_preimage: "preimage_v1(domain=hepta.auth.effect-receipt-ref.v1; effect_id; attempt; current_revision; status; payload_digest)"
    reconciliation_id:
      format: "recon:v1:<sha256>"
      canonical_rule: "recon:v1:<sha256(preimage_v1(domain=hepta.auth.reconciliation.v1; effect_id; effect_intent_id; idempotency_key; attempt; authority_epoch; owner_epoch; generation; fencing_token))>"
      canonical_preimage: "preimage_v1(domain=hepta.auth.reconciliation.v1; effect_id; effect_intent_id; idempotency_key; attempt; authority_epoch; owner_epoch; generation; fencing_token)"
      same_attempt_retry: reuse
      new_attempt_or_owner_epoch: new_id
    reconciles_receipt_id:
      initial_or_direct: "receipt-ref:v1:na:<sha256(preimage_v1(domain=hepta.auth.receipt-ref.na.v1; effect_id; attempt; authority_epoch; owner_epoch; generation))>"
      indeterminate: "same hashed receipt-ref:v1:na sentinel until reconciled"
      reconciled: immutable_prior_indeterminate_receipt_ref
      self_reference_allowed: false
      sentinel_rule: "The not-applicable sentinel is deterministic and is never dereferenced as a prior receipt."
    e21_required_fields: [effect_id, effect_intent_id, decision_id, run_id, schema_digest, status, terminal, reconciliation_required, idempotency_key, attempt, authority_scope, execution_scope, effect_authority, production_authority, snapshot_digest, graph_digest, policy_digest, provider_id, reconciliation_id, reconciles_receipt_id, external_state_digest, resolver_attempt, current_revision, cas]
    status_enum: [Queued, DispatchAccepted, Running, Succeeded, Failed, Cancelled, Indeterminate, Reconciled]
    reconciled_constraints: [terminal_true, reconciliation_required_false, external_state_digest_non_null]
    indeterminate_constraints: [terminal_false, reconciliation_required_true]
    top_level_extension: forbidden
  reconcile_evidence:
    schema_id: hepta.auth.reconcile-evidence.v1
    owner: taskflow_agent_db
    proposal_writer: authbusd
    record_type: ReconcileEvidenceRef
    required_fields: [reconciliation_id, effect_id, effect_intent_id, reconciles_receipt_id, idempotency_key, attempt, operation_ref, outcome, evidence_kind, evidence_digest, external_state_digest, provider_query_receipt_digest, verified_at, decided_at, resolver_attempt, authority_epoch, owner_epoch, generation, fencing_token, payload_digest, policy_digest, current_revision, cas]
    outcome_enum: [Succeeded, Failed, Cancelled, NoEffect, ManualRequired]
    field_semantics:
      verified_at: provider_or_evidence_observation_time
      decided_at: taskflow_decision_time
      provider_query_receipt_digest: "Always a digest; use a canonical no-query marker for pre-dispatch cancellation rather than null."
    binding_equalities:
      receipt_reconciliation_id: "EffectReceipt.reconciliation_id == ReconcileEvidenceRef.reconciliation_id"
      receipt_chain: "For a Reconciled receipt, reconciles_receipt_id points to the immutable prior Indeterminate receipt_ref; for initial/direct receipts it is the deterministic not-applicable sentinel."
      decision: "TaskFlow ReconcileDecision has the same reconciliation_id, effect_id, evidence_digest, outcome, and fence tuple."
      effect_fence: "effect_id, effect_intent_id, attempt, authority_epoch, owner_epoch, generation, and fencing_token must match the dispatch lineage."
    no_effect_proof:
      record_type: NoEffectProof
      required_fields: [proof_id, proof_stage, reconciliation_id, provider_id, provider_namespace, effect_id, effect_intent_id, effect_key, attempt, idempotency_key, operation_ref, proof_kind, dispatch_attempted, dispatch_marker_state, dispatch_marker_digest, outbox_delivery_seq, writer_record_fsync_confirmed, writer_fsync_witness_digest, provider_query_receipt_digest, external_state_digest, evidence_digest, observed_at, verified_at, decided_at, taskflow_decision_id, taskflow_decision_digest, authority_epoch, owner_epoch, generation, fencing_token, payload_digest, current_revision, cas]
      proof_stage: [PROPOSED, COMMITTED]
      proposed_proof_rule: authbusd_may_propose_with_pending_decision_sentinel
      committed_proof_rule: taskflow_decision_and_current_fence_required_before_release_or_refund
      proof_kind_enum: [pre_dispatch_cancel, verified_not_found, provider_explicit_no_effect]
      operation_ref_rule: "For pre_dispatch_cancel and verified_not_found, operation_ref is the deterministic preimage_v1 sentinel operation-ref:v1:not-applicable:<provider_namespace>:<effect_id>:<effect_key>:<attempt>; a provider operation reference is required only for provider_explicit_no_effect and must bind namespace/effect_id/effect_key/payload_digest/idempotency_key/attempt."
      operation_ref_sentinel: "operation-ref:v1:not-applicable:<provider_namespace>:<effect_id>:<effect_key>:<attempt>"
      operation_ref_sentinel_preimage: "preimage_v1(domain=hepta.auth.operation-ref.v1; provider_namespace; effect_id; effect_key; attempt; tagged-null provider_operation_id)"
      marker_state_enum: [present, absent]
      dispatch_marker_state_rule: "present requires the digest of the fsynced DispatchAttemptStarted marker; absent is allowed only before dispatch and uses the deterministic no-marker digest."
      no_marker_digest_formula: "SHA-256(preimage_v1(domain=hepta.auth.dispatch-marker.v1; marker_state=absent; provider_namespace; effect_key; effect_id; attempt; idempotency_key))"
      no_query_marker:
        schema_id: hepta.auth.provider-query.v1/no-query
        canonical_value: "provider-query:v1:not-attempted:<provider_namespace>:<effect_key>:<attempt>"
        digest_formula: "SHA-256(preimage_v1(domain=hepta.auth.provider-query.v1; marker=not-attempted; provider_namespace; effect_key; effect_id; attempt))"
        allowed_for: [pre_dispatch_cancel]
        forbidden_for: [verified_not_found, provider_explicit_no_effect]
      outbox_sequence_rule: "outbox_delivery_seq is the TaskFlow command-delivery sequence observed for the intent; pre-dispatch cancellation uses the durable enqueue sequence, never null or an invented value."
      writer_fsync_witness:
        required_fields: [source_owner, wal_segment, wal_offset, event_seq, commit_digest, directory_fsync, writer_boot_id, writer_generation, verified_at]
        directory_fsync: required_true
        digest_formula: "SHA-256(preimage_v1(domain=hepta.auth.writer-fsync-witness.v1; source_owner; wal_segment; wal_offset; event_seq; commit_digest; directory_fsync; writer_boot_id; writer_generation; verified_at))"
        binding_rule: "writer_fsync_witness_digest must resolve to the durable TaskFlow enqueue record and current generation/fence; a boolean without the witness is invalid."
      pre_dispatch_constraints: [dispatch_attempted_false, dispatch_marker_state_absent, dispatch_marker_digest_is_no_marker_digest, writer_record_fsync_confirmed, writer_fsync_witness_digest_resolves, provider_query_receipt_digest_is_no_query_digest, taskflow_decision_and_current_fence]
      external_state_digest_formula: "SHA-256(preimage_v1(domain=hepta.auth.no-effect-proof.v1; canonical NoEffectProof required fields excluding external_state_digest and evidence_digest; digest fields represented by explicit zero sentinel))"
      evidence_digest_formula: "SHA-256(preimage_v1(domain=hepta.auth.reconcile-evidence.v1; canonical evidence fields excluding evidence_digest and external_state_digest; digest fields represented by explicit zero sentinel))"
      taskflow_decision_binding: "taskflow_decision_id and taskflow_decision_digest must match the TaskFlow-owned ReconcileDecision with the same reconciliation_id, outcome and current fence; authbusd cannot self-close."
      receipt_projection: "Only a verified NoEffectProof may produce Reconciled with terminal=true; a reservation release alone is not proof."
    manual_required:
      effect_projection: {status: Indeterminate, terminal: false, reconciliation_required: true}
      sidecar_fields: [manual_required, manual_reason, next_review_at, evidence_digest]
      unresolved_state_digest: "Digest of domain=hepta.auth.unresolved-state.v1 marker; not proof and never eligible for Reconciled projection."
      release_or_refund: forbidden
      reservation_release: forbidden
      escrow_release: forbidden
      new_dispatch: forbidden
      terminal_transition: forbidden
      resume_event: manual_evidence_submitted
      resume_guard: verified_evidence_and_current_epoch_fence
  status_by_effect_key:
    operation: StatusByEffectKey
    operation_aliases_decode_only: {status_lookup: StatusByEffectKey}
    lookup_only: true
    dispatch: forbidden
    request_required: [schema_version, request_id, provider_id, provider_namespace, effect_key, payload_digest, idempotency_key, attempt, authority_epoch, owner_epoch, generation, fencing_token, audience, request_nonce, deadline_at, query_revision, retention_hint, expected_execution_mode, policy_digest]
    request_forbidden: [authorization_header, raw_secret, dispatch_payload, new_effect_intent]
    response_required: [schema_version, response_id, provider_id, provider_namespace, effect_key, payload_digest, terminal_state, observed_at, status_revision, binding_digest, provider_query_receipt_digest, not_found_kind, evidence_profile, execution_mode, mode_attestation_digest, policy_digest, audience, key_epoch, issuer]
    response_nullable: [operation_ref, provider_operation_id, provider_operation_id_sha256, ack_digest, signature, key_id, issued_at, expires_at, synthetic_marker_digest, synthetic_issuer]
    synthetic_loopback_sentinel: {audience: "hepta.auth.local-mode", key_epoch: 0, issuer: "local-mode-registry", signature: forbidden, key_id: forbidden, issued_at: forbidden, expires_at: forbidden}
    conditional_response:
      terminal: {when: "terminal_state in [SUCCEEDED, FAILED, CANCELLED] and not_found_kind=none", required_non_null: [operation_ref, provider_operation_id, provider_operation_id_sha256, ack_digest, evidence_profile], guard: immutable_terminal_binding}
      non_terminal: {when: "terminal_state in [UNKNOWN, QUEUED, RUNNING]", required_non_null: [observed_at, status_revision, binding_digest, provider_query_receipt_digest, evidence_profile], forbidden: [new_effect_intent], guard: lookup_only}
      not_found: {when: "not_found_kind in [verified, unavailable, expired]", required_non_null: [provider_query_receipt_digest, observed_at, evidence_profile, not_found_kind], guard: "verified_not_found_requires_no_effect_proof; unavailable_or_expired_never_closes_effect"}
      not_found_state_guard: {when: "not_found_kind in [verified, unavailable, expired]", required_non_null: [execution_mode, mode_attestation_digest, policy_digest, terminal_state], required_values: {terminal_state: UNKNOWN}, forbidden_terminal_states: [SUCCEEDED, FAILED, CANCELLED], forbidden: [operation_ref, provider_operation_id, provider_operation_id_sha256, ack_digest], guard: mode_attestation_matches_local_policy}
    terminal_evidence_profile_rules:
      synthetic_loopback: {required_non_null: [synthetic_marker_digest, synthetic_issuer], forbidden: [signature, key_id, issued_at, expires_at], allowed_only: [development, internal_test, release_prep]}
      external_attested: {required_non_null: [signature, key_id, issued_at, expires_at], audience_and_key_epoch: required, production_release_allowed: true}
    not_found_kind_enum: [none, verified, unavailable, expired]
    operation_ref_required_when: "terminal_state in [SUCCEEDED, FAILED, CANCELLED] and not_found_kind=none; verified/unavailable/expired not-found responses carry no provider operation ref. A provider_explicit_no_effect proof is a separate evidence path and requires its operation ref."
    terminal_state_enum: [UNKNOWN, QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
    terminal_states: [SUCCEEDED, FAILED, CANCELLED]
    collision_rule: "One provider_namespace/effect_key binds to one payload_digest; a different digest is Conflict, never not-found."
    retention: "Status-by-key must remain queryable for the configured reconcile horizon; expiry is StatusLookupUnavailable, never NoEffect."
    binding_digest_preimage: "binding_digest = SHA-256(preimage_v1(domain=hepta.auth.status-by-effect-key.v1; provider_namespace; effect_key; payload_digest; idempotency_key; attempt; audience; key_epoch; issuer; execution_mode; policy_digest; terminal evidence fields)); synthetic loopback uses the declared local-mode sentinel."
    terminal_ack_rule: "Only an immutable binding for SUCCEEDED/FAILED/CANCELLED may close an Indeterminate path."
    evidence_profiles:
      synthetic_loopback:
        signature_mode: synthetic_marker
        allowed_only: [development, internal_test, release_prep]
        production_release: forbidden
      external_attested:
        signature_mode: required
        required_fields: [signature, key_id, issued_at, expires_at]
        audience_and_key_epoch: required
    evidence_profile_binding: "evidence_profile, execution_mode, mode_attestation_digest and policy_digest are checked against the local mode/policy registry; a provider-supplied label alone is not evidence."
    unknown_and_expired_rule: "UNKNOWN, QUEUED, RUNNING, not_found_kind in [unavailable, expired], or unavailable lookup never closes an effect; verified not_found may close only through a NoEffectProof with current fence."
  dispatch:
    marker_order: [EffectIntentDurable, DispatchAttemptStarted, adapter_call, DispatchAcceptedRef_or_DirectTerminalAckRef_or_DispatchUnknownRef, EffectAckRef_or_IndeterminateRef]
    dispatch_ref_alias_decode_only: {EffectDispatchRefDurable: EffectIntentDurable}
    direct_terminal_ack:
      event: direct_terminal_ack
      from: DISPATCH_ATTEMPT_DURABLE
      to_public_status: [Succeeded, Failed, Cancelled]
      guard: verified_immutable_terminal_ack_with_current_epoch_and_fence
      synthetic_dispatch_accepted: allowed_internal_only
      synthetic_dispatch_accepted_constraints: [same_writer_transaction_with_terminal_ack, never_publicly_projected, marked_synthetic]
      private_acceptance_ref_same_transaction: allowed_without_public_status
    response_unknown:
      internal_ref: DispatchUnknownRef
      public_status: Indeterminate
      next_action: StatusByEffectKey_lookup_only
      blind_retry: forbidden
    accepted_timeout:
      from: DISPATCH_ACCEPTED
      event: accepted_timeout
      to_internal: DISPATCH_UNKNOWN
      to_public_status: Indeterminate
      guard: acceptance_deadline_elapsed_and_effect_key_retained
      next_action: StatusByEffectKey_lookup_only
      blind_retry: forbidden
    accepted_not_terminal: [http_202, DispatchAccepted]
  outbox_delivery:
    schema_id: hepta.auth.outbox-delivery.v1
    writer_rule: "The owner of the source record writes its own outbox row; no shared outbox writer or second scheduler exists."
