    default_denied: [GetSecret, SetSecret, ImportSecret, ListSecret, NewKey, ExportPrivateKey, ReturnCertificatePrivateKey, MintUnscopedToken, NATS, SDS, SPIFFE, Admin, RemoteInvocation, UnknownFutureRPC]
    enforcement: [compile_feature_profile, registration_allowlist, runtime_default_deny, negative_rpc, raw_byte_scan]
    public_listener: false
  writer_boundary:
    authbusd_wal: [AuthResource, ComputeResource, QuotaSnapshot, Lease, Permit, QuotaReservation, ReconcileQueue, EffectDispatchRef, DispatchAttempt]
    taskflow_db: [FlowRun, Step, EffectIntent, ActivityReceipt, EffectReceipt]
