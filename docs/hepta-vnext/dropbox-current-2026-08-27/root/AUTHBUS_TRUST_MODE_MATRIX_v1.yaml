schema: hepta.authbus.trust_mode.v1
plan_id: AUTHBUS-PLAN-2026-08-26
status: PLANNING_ONLY
authority: false
source_status: STALE_SOURCE_BINDING
current_projection_binding:
  status: CURRENT_PROJECTION_BINDING
  plan_revision: E.45
  plan_pointer: OpenClaw/hepta-vnext-development-plan-final-2026-08-23.md#development-docs-sync-e45
  plan_sha256: f0a98ae0e6cb1ff3c4bb660bfe50ca921cda434926a755d127dcc7399c4a5620
  canonical_registry_ref: OpenClaw/AUTHBUS_CANONICAL_CONTRACT_REGISTRY_v1.yaml#/registry
  canonical_registry_sha256: cda83c4776d4c2b3c2851474e476e775d6ca26fa815373083aac47fdfd0c89f5
  active_stage_selector: OpenClaw/AUTHBUS_STAGE_MATRIX_v1.yaml#/execution_closure_v1_3/phase_map
  semantic_revision: AUTHBUS.11-v1.3
  projection_kind: generated_domain_projection
  fail_closed_on_source_digest_mismatch: true
  behavioral_implementation_evidence: NOT_RUN
  runtime_authority: false
  production_effect_authority: false
implementation_branch: not-created
source_binding:
  basil_repo: https://github.com/openbasil/basil
  basil_commit: 1fd29adb8e7356968eacbff9309e056cec9bafd7
  basil_version: 0.7.2-main-snapshot
  license: Apache-2.0
purpose: >-
  Machine-readable trust, process-identity, and phase-mode inputs for the Basil-derived
  Hepta AuthBus. This file is not a production authorization or release receipt.

principles:
  - "AuthBus is the resource-admission control plane; agentd remains lifecycle authority."
  - "One authbusd instance is the durable writer for a physical host."
  - "Raw provider credentials are never a transferable product or a wire-level capability."
  - "Default deny applies to every unlisted actor, operation, Basil service, and new RPC."
  - "A settlement reference can never authorize resource use."

actors:
  - id: owner
    description: "Human or organization that owns a provider account or compute capacity."
    permissions: [discover, register, delegate, revoke, inspect_receipts]
    trust_assumptions: [explicit_consent, provider_terms, authenticated_owner_channel]
  - id: tenant
    description: "Hepta workspace subject with an attenuated usage budget."
    permissions: [discover, request_admission, consume_permit, inspect_own_receipts]
    trust_assumptions: [valid_workspace_membership, policy_scope]
  - id: agent
    description: "Agent process launched and supervised by agentd."
    permissions: [request_admission, renew_own_lease, release_own_permit, report_usage]
    trust_assumptions: [agentd_launch_attestation, generation_binding, local_peer_check]
  - id: node
    description: "Physical Hepta node participating in local or HNL federation."
    permissions: [advertise_capacity, accept_scoped_right, report_health]
    trust_assumptions: [hnl_node_identity, session_epoch, policy_digest]
  - id: agentd
    description: "Fleet and process lifecycle supervisor."
    permissions: [launch, stop, transfer_owner, drain, issue_generation]
    trust_assumptions: [single_lifecycle_authority, local_supervisor_identity]
  - id: gateway
    description: "Hepta ingress that exchanges a virtual credential for a permit."
    permissions: [authenticate_virtual_credential, request_scoped_admission, report_usage]
    trust_assumptions: [audience_binding, expiry_check, tenant_quota]
  - id: provider
    description: "External or synthetic upstream resource endpoint."
    permissions: [return_status, accept_scoped_effect, return_effect_ack]
    trust_assumptions: [adapter_contract, provider_policy]
  - id: walletd
    description: "Ledger and escrow authority, outside AuthBus."
    permissions: [hold, settle, refund, dispute]
    trust_assumptions: [ledger_single_writer, nonce_and_receipt_rules]
  - id: operator
    description: "Local operator with explicitly audited maintenance rights."
    permissions: [health, drain, rotate_policy, emergency_revoke, inspect_redacted_audit]
    trust_assumptions: [local_console_or_attested_control_socket]
  - id: basil_backend
    description: "Basil/OpenBao backend service; never the Hepta subject authority."
    permissions: [sign_in_place, decrypt_in_place, verify, public_key, health]
    trust_assumptions: [fixed_service_uid, restricted_catalog, backend_tls]
  - id: authbusd
    description: "Per-host Hepta AuthBus authority and sole durable writer for resource/quota/lease state."
    permissions: [admit, reserve, dispatch_ref, reconcile, revoke, audit_projection]
    trust_assumptions: [agentd_generation, owner_epoch, local_wal]
  - id: relay
    description: "HNL forwarding hop; transports encrypted signed envelopes without authorization power."
    permissions: [forward_encrypted_signed_messages]
    trust_assumptions: [hnl_session_identity, packet_integrity]
  - id: arbiter
    description: "Independent dispute reviewer; separate from operator control and trade parties."
    permissions: [review_digest_references, decide_dispute]
    trust_assumptions: [independent_assignment, evidence_digest_only]
  - id: taskflow_adapter
    description: "Typed TaskFlow integration client; submits commands and receives projections, never owns AuthBus state."
    permissions: [request_admission, submit_effect_intent_reference, report_usage]
    trust_assumptions: [taskflow_lineage, generation_binding, local_peer_check]
  - id: authbusd_worker
    description: "AuthBus internal worker that invokes an adapter or performs bounded reconciliation under authbusd fencing."
    permissions: [dispatch, provider_feedback, reconcile_lookup]
    trust_assumptions: [authbusd_owner_epoch, adapter_binding, local_wal]
  - id: verified_adapter
    description: "Provider adapter with an immutable effect/operation binding; lookup-only during reconciliation."
    permissions: [status_by_effect_key, return_terminal_ack]
    trust_assumptions: [adapter_contract, effect_key_binding, provider_policy]

permission_constraints:
  owner_scope: "Only resources and provider accounts owned or explicitly delegated by the owner."
  tenant_scope: "Only the tenant workspace and unexpired attenuated usage rights."
  agent_scope: "Only the agent generation, audience, and active permit."
  operator_scope: "Control socket and redacted maintenance operations; emergency revoke may only stop new admission/drain a bounded resource scope and never transfers ownership or changes market outcomes. Never secret read/export."
  wallet_scope: "Settlement references only; never admission or secret use."

permission_matrix:
  columns: [discover, admit, lease, secret_use, receipt, revoke, settle]
  rows:
    owner:        {discover: allow, admit: allow, lease: allow, secret_use: deny,  receipt: allow, revoke: allow, settle: delegate}
    tenant:       {discover: allow, admit: request, lease: own_only, secret_use: deny, receipt: own_only, revoke: own_only, settle: deny}
    agent:        {discover: scoped, admit: request, lease: own_only, secret_use: through_permit, receipt: own_only, revoke: own_only, settle: deny}
    node:         {discover: scoped, admit: scoped, lease: scoped, secret_use: through_permit, receipt: scoped, revoke: scoped, settle: deny}
    agentd:       {discover: allow, admit: allow, lease: transfer, secret_use: deny, receipt: allow, revoke: allow, settle: deny}
    gateway:      {discover: scoped, admit: request, lease: own_only, secret_use: through_adapter, receipt: own_only, revoke: own_only, settle: deny}
    provider:     {discover: status_only, admit: n_a, lease: n_a, secret_use: n_a, receipt: ack_only, revoke: n_a, settle: deny}
    walletd:      {discover: reference_only, admit: deny, lease: deny, secret_use: deny, receipt: settlement_ref, revoke: deny, settle: allow}
    operator:     {discover: redacted, admit: deny, lease: drain_only, secret_use: deny, receipt: redacted, revoke: emergency, settle: deny}
    basil_backend: {discover: health_only, admit: deny, lease: deny, secret_use: in_place_only, receipt: audit_projection, revoke: key_policy_only, settle: deny}
    authbusd:     {discover: allow, admit: allow, lease: own_writer, secret_use: through_permit, receipt: allow, revoke: allow, settle: deny}
    relay:        {discover: forward_only, admit: deny, lease: deny, secret_use: deny, receipt: forward_only, revoke: deny, settle: deny}
    arbiter:      {discover: evidence_only, admit: deny, lease: deny, secret_use: deny, receipt: evidence_only, revoke: deny, settle: adjudicate_only}
    taskflow_adapter: {discover: scoped, admit: request, lease: own_only, secret_use: deny, receipt: own_only, revoke: deny, settle: deny}
    authbusd_worker: {discover: health_only, admit: own_writer, lease: own_writer, secret_use: through_permit, receipt: audit_projection, revoke: own_writer, settle: deny}
    verified_adapter: {discover: status_only, admit: n_a, lease: n_a, secret_use: n_a, receipt: ack_only, revoke: n_a, settle: deny}

identity:
  first_hop:
    linux: "SO_PEERCRED plus authbusd registry and agentd generation/pidfd/starttime binding"
    macos: "socket peer check plus platform audit-token adapter; development target only"
  same_uid_limit: "SO_PEERCRED alone cannot distinguish two agents sharing one UID."
  self_reported_subject: reject
  forwarded_uid_claim: reject
  required_claims: [tenant_id, workspace_id, agent_id, service_id, node_id, generation, launch_nonce, session_id, epoch, nonce, key_id, capability_digest, intent_digest, transcript_digest, audience, issued_at, expires_at, policy_digest]
  derived_claims: [subject_digest, secret_ref_allowlist_digest]
  derived_claim_rule: "subject_digest and SecretRef allowlist digest are computed from verified canonical claims/capability; they are never accepted as self-reported identity."
  bridge_mode:
    preferred: embedded_basil_service
    fallback: "COSE/CBOR or mTLS bridge with nonce, audience, TTL, replay cache, epoch, and fence"
    basil_sees: service_uid_and_attenuated_capability
    basil_does_not_see: original_agent_uid_claim

basil_profile:
  profile_id: hepta-basil-host-minimal-v1
  default_features: [core, uds, backend_openbao, audit, sign, verify, public_key, health]
  optional_features:
    process_bound_decrypt:
      default: disabled
      enable_only_for: [declared_purpose, active_permit, allowlisted_secret_ref]
  allowed_services:
    - Sign
    - Verify
    - PublicKey
    - Health
    - IssueProcessBoundCapability  # Hepta wrapper operation; not assumed Basil-native RPC
  conditionally_allowed_services:
    - Decrypt
  denied_services:
    - GetSecret
    - SetSecret
    - ImportSecret
    - ListSecret
    - NewKey
    - ExportPrivateKey
    - ReturnCertificatePrivateKey
    - MintUnscopedToken
    - NATS
    - SDS
    - SPIFFE
    - Admin
    - RemoteInvocation
    - UnknownFutureRPC
  enforcement: [compile_feature_profile, registration_allowlist, runtime_default_deny, negative_rpc_tests, raw_byte_scan]
  operation_constraints:
    Decrypt: "Only an allowlisted SecretRef and declared purpose may be used; plaintext is process-bound."
    Sign: "Only an allowlisted SecretRef/purpose and an active scoped permit may be used."
    Verify: "Public material or an allowlisted reference only."

mutation_constraints:
  owner_or_agentd_mutation: [authority_epoch, owner_epoch, generation, fencing_token, expected_revision]
  unknown_operation: deny

listeners:
  agent_socket:
    path: authbusd-agent.sock
    accepts: [admission, permit, renew, release, usage, watch]
    public_bind: false
    owner: authbusd
    mode: "0600"
    directory_fsync_after_create: true
  control_socket:
    path: authbusd-control.sock
    accepts: [register_resource, owner_transfer, agentd_lifecycle, drain, policy_reload, revoke, health, ready]
    public_bind: false
    owner: authbusd
    mode: "0600"
    directory_fsync_after_create: true
    operation_aliases: {register_resource: RegisterResource, owner_transfer: OwnerTransfer, agentd_lifecycle: AgentdLifecycle, drain: Drain, policy_reload: PolicyReload, revoke: Revoke, health: Health, ready: Ready}
    caller_operations:
      agentd: [RegisterResource, OwnerTransfer, AgentdLifecycle, Drain, PolicyReload, Revoke, Health, Ready]
      operator: [Drain, PolicyReload, Revoke, Health, Ready]
    operator_revoke_constraint: "operator may invoke Revoke only with emergency=true, incident_id, reason, and a bounded resource scope; it cannot register, transfer owner, launch/stop agents, settle, or mutate market state."
  owner_mediated_channel:
    transport: authbusd-control.sock
    caller: agentd
    operation: SubmitOwnerCommand
    owner_actions: [RegisterResource, DelegateUsageRight, Revoke]
    required_binding: [owner_attestation_digest, consent_digest, tenant_id, resource_digest, authority_epoch, owner_epoch, generation, fencing_token, idempotency_key]
    direct_owner_socket: false
    rule: "The owner never receives a privileged direct socket; agentd authenticates the owner channel and submits a typed, consent-bound command."
  basil_socket:
    exposure: "private local service or embedded"
    public_bind: false
  openbao_endpoint:
    exposure: "authbusd adapter only"
    direct_agent_access: false

modes:
  DEVELOPMENT:
    listeners: [loopback_agent, loopback_control]
    resources: [synthetic_provider, synthetic_inferd]
    lan_federation: {enabled: false, policy: loopback_only}
    public_gateway: {enabled: false, policy: disabled}
    real_provider_effects: false
    real_funds: false
    production_writer: false
    production_caller: false
  INTERNAL_TEST:
    listeners: [opt_in_lan_agent, loopback_control]
    resources: [synthetic_provider, owner_local_compute]
    lan_federation: {enabled: true, policy: explicit_lan_allowlist}
    lan_federation_activation: explicit_allowlist
    public_gateway: {enabled: false, policy: disabled}
    real_provider_effects: false
    real_funds: false
    production_writer: false
    production_caller: false
  RELEASE_PREP:
    listeners: [approved_test_lan, loopback_control]
    resources: [sandbox_provider, virtual_credits_compute]
    lan_federation: {enabled: true, policy: explicit_test_allowlist}
    lan_federation_activation: explicit_approval
    public_gateway: {enabled: false, policy: canary_listener_only}
    canary_listener: true
    real_provider_effects: false
    real_funds: false
    production_writer: false
    production_caller: false
  FINAL_RELEASE:
    listeners: [explicitly_approved_release_surfaces]
    resources: [externally_qualified_resources]
    lan_federation: {enabled: false, policy: explicit_promotion_required}
    public_gateway: {enabled: false, policy: explicit_promotion_required}
    real_provider_effects: false
    real_funds: false
    requirements: [external_evidence, explicit_promotion, wallet_operator_legal_acceptance]
    activation_state: review_only
    auto_transition: false
    missing_requirement_action: remain_review_only_and_block_release_only
    explicit_promotion_required: true
    production_writer: false
    production_caller: false

negative_authority_flags:
  authority: false
  production_caller: false
  production_writer: false
  effect_authority: false
  operator_acceptance: false
  promotion: false
  g5_allowed: false
  execute_allowed: false

implementation_dag:
  - B0_provenance
  - B1_topology_profile_identity
  - B2_contracts
  - B3_adapter
  - B4_scheduler
  - B5_authbusd_wal_reconcile
  - B6_legacy_migration
  - B7_hnl
  - B8_gateway
  - B9_market_sandbox
  - B10_release_prep

external_gate_policy:
  development: deferred_by_E41
  internal_test: deferred_by_E41
  release_prep: deferred_by_E41
  final_release: required_only_for_release_action

