[package]
name = "codex-hepta-authbus-qualification"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# P0.2 is intentionally isolated from the parent default workspace until P0.1
# receives executable exact-head qualification evidence. This nested workspace
# can be built only through its explicit manifest path.
[workspace]
resolver = "2"

[features]
default = []
sqlite-qualification = [
    "dep:codex-hepta-contracts",
    "dep:codex-state",
    "dep:codex-utils-absolute-path",
    "dep:serde",
    "dep:serde_json",
    "dep:sqlx",
    "dep:thiserror",
]

[dependencies]
codex-hepta-contracts = { path = "../hepta-contracts", features = ["authbus-local-qualification"], optional = true }
codex-state = { path = "../state", optional = true }
codex-utils-absolute-path = { path = "../utils/absolute-path", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.149", optional = true }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"], optional = true }
thiserror = { version = "2.0.17", optional = true }

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
