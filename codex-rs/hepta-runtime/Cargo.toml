[package]
name = "hepta-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["compat-report"]
compat-report = ["dep:codex-core-plugins", "dep:codex-tools"]

[dependencies]
codex-core-plugins = { workspace = true, optional = true }
codex-tools = { workspace = true, optional = true }
hepta-contracts.workspace = true
hepta-core.workspace = true
hepta-egress.workspace = true
hepta-intelligence.workspace = true
hepta-kernel.workspace = true
hepta-memory.workspace = true
hepta-paths.workspace = true
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
pretty_assertions.workspace = true

[build-dependencies]
flate2.workspace = true
sha2.workspace = true
