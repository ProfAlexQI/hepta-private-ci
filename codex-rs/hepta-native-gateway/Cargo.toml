[package]
name = "hepta-native-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "hepta_native_gateway"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[features]
default = []
codex-in-process-runner = ["dep:codex-arg0", "dep:codex-exec"]

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
codex-arg0 = { workspace = true, optional = true }
codex-exec = { workspace = true, optional = true }
flate2 = { workspace = true }
hepta-authority = { workspace = true }
hepta-core = { workspace = true }
hepta-contracts = { workspace = true }
hepta-gateway = { workspace = true }
hepta-intelligence = { workspace = true }
hepta-memory = { workspace = true }
hepta-paths = { workspace = true }
hepta-runtime = { workspace = true, default-features = false }
hmac = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
zeroize.workspace = true
