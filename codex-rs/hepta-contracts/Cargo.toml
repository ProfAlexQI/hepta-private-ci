[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-contracts"
version.workspace = true

[lib]
name = "codex_hepta_contracts"
path = "src/lib.rs"
doctest = false

[features]
default = []
# Opt-in local qualification models for AuthBus B4/B5.  The feature exposes
# deterministic reference implementations only; it never enables a listener,
# provider call, external effect, or production authority.
authbus-local-qualification = ["dep:zeroize"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
