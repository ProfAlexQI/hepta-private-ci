[package]
name = "codex-hepta-authbus-p0-3-qualification"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

# P0.3 remains a nested, default-off qualification workspace. Resolver 3 keeps
# its path-dependency graph compatible with the repository Rust 1.95 toolchain.
[workspace]
resolver = "3"

[features]
default = []
p0-3-qualification = ["dep:codex-hepta-contracts"]

[dependencies]
codex-hepta-contracts = { path = "../hepta-contracts", features = ["authbus-local-qualification"], optional = true }

[dev-dependencies]
pretty_assertions = "1.4.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
