[package]
name = "codex-hepta-inferd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "codex_hepta_inferd"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "hepta-inferd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
codex-hepta-infer-core = { workspace = true }
codex-uds = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
