[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-memory-extension"
version.workspace = true

[lib]
name = "codex_hepta_memory_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
codex-extension-api = { workspace = true }
codex-hepta-contracts = { workspace = true }
codex-hepta-memory = { workspace = true }
codex-protocol = { workspace = true }
codex-state = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
chrono = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
