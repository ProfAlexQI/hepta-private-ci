[package]
name = "hepta-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hepta"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
codex-in-process-runner = ["hepta-native-gateway/codex-in-process-runner"]

[dependencies]
anyhow = { workspace = true }
hepta-native-gateway = { workspace = true }
hepta-runtime = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
pretty_assertions.workspace = true
