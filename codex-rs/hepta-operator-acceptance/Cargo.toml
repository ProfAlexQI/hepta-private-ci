[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-operator-acceptance"
version.workspace = true
publish = false

[features]
default = ["fixed-runner-supervisor"]
fixed-runner-child = []
fixed-runner-supervisor = []

[lib]
name = "codex_hepta_operator_acceptance"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "hepta-operator-acceptance"
path = "src/main.rs"
test = false

[[bin]]
name = "hepta-operator-acceptance-v2"
path = "src/bin/hepta-operator-acceptance-v2.rs"
test = false

[[bin]]
name = "hepta-operator-acceptance-v3"
path = "src/bin/hepta-operator-acceptance-v3.rs"
test = false

[[bin]]
name = "hepta-operator-acceptance-freeze-tool-v1"
path = "src/bin/hepta-operator-acceptance-freeze-tool-v1.rs"
test = false

[[bin]]
name = "hepta-inert-one-shot-runner-v3"
path = "src/bin/com.hepta.inert-one-shot-runner-v3.rs"
required-features = ["fixed-runner-child"]
test = false

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
libc = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
