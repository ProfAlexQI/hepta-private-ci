[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-agentd"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_agentd"
path = "src/lib.rs"
doctest = false

[features]
default = []
# Qualification-only host profile. This is intentionally opt-in at build time;
# the default and production binaries keep the cognitive/KG writer disabled.
qualification-cognitive-write = []
# P0.4c source/qualification-only adapter. Enabling this feature merely
# compiles an explicit host handle over the append-only shadow journal; Agentd
# startup and App Server wiring remain unchanged.
qualification-intelligence-mutation-shadow = []

[[bin]]
name = "codex-hepta-agentd"
path = "src/main.rs"
test = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
codex-app-server = { workspace = true }
codex-app-server-client = { workspace = true }
codex-app-server-protocol = { workspace = true }
codex-arg0 = { workspace = true }
codex-config = { workspace = true }
codex-features = { workspace = true }
codex-hepta-agent-protocol = { workspace = true }
codex-hepta-automation = { workspace = true }
codex-hepta-contracts = { workspace = true }
codex-hepta-fleet = { workspace = true }
codex-hepta-memory = { workspace = true }
codex-hepta-memory-extension = { workspace = true }
codex-hepta-paths = { workspace = true }
codex-protocol = { workspace = true }
codex-uds = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-cli = { workspace = true }
codex-utils-home-dir = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { workspace = true }

[dev-dependencies]
app_test_support = { workspace = true }
codex-hepta-supervisor = { workspace = true }
codex-state = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
sqlx = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
