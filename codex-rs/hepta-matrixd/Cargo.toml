[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-matrixd"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_matrixd"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
codex-app-server-client = { workspace = true }
codex-app-server-protocol = { workspace = true }
codex-hepta-agentd = { workspace = true }
codex-hepta-contracts = { workspace = true }
codex-hepta-matrix-protocol = { workspace = true }
codex-hepta-matrix-store = { workspace = true }
codex-utils-absolute-path = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
anyhow = { workspace = true }
codex-hepta-paths = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
