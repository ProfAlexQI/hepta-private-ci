[package]
edition.workspace = true
license.workspace = true
name = "codex-hepta-shadow-qualification"
version.workspace = true
publish = false

[lib]
name = "codex_hepta_shadow_qualification"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "hepta-shadow-live-trial"
path = "src/bin/hepta-shadow-live-trial.rs"
test = false

[[bin]]
name = "hepta-browser-worker-qualification"
path = "src/bin/hepta-browser-worker-qualification.rs"
test = false

[lints]
workspace = true

[dependencies]
libc = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
toml = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
