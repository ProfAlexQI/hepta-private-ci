name: Hepta inference V4 INF-S2 cancel lifecycle closure

on:
  push:
    branches:
      - codex/hepta-inference-v4-s2-cancel-chatgpt-20260830
    paths:
      - .github/workflows/hepta-inference-v4-s2-cancel-chatgpt.yml

permissions:
  contents: write

concurrency:
  group: hepta-inference-v4-s2-cancel-chatgpt
  cancel-in-progress: false

jobs:
  implement-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2

      - name: Guard exact package parent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/hepta-inference-v4-s2-cancel-chatgpt-20260830
          test "$(git rev-parse HEAD^)" = dbf68bfed0a2a034fb519c66a89725e2b74edce3
          test -z "$(git status --porcelain)"

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Add explicit running-cancel lifecycle to the controller
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          controller = Path("codex-rs/hepta-infer-core/src/controller.rs")
          source = controller.read_text(encoding="utf-8")

          lifecycle_marker = """impl LifecycleState {
              pub const fn is_terminal(self) -> bool {
                  matches!(self, Self::Completed | Self::Cancelled | Self::FailedClosed)
              }
          }
          """
          lifecycle_insert = lifecycle_marker + """
          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub enum RunningCancelPhase {
              Requested,
              Dispatched,
              Acknowledged,
              TimedOut,
          }

          #[derive(Clone, Debug, Eq, PartialEq)]
          pub struct RunningCancelEvent {
              pub request_id: RequestId,
              pub request_generation: u64,
              pub cancel_generation: u64,
              pub backend_generation: u64,
              pub sequence: u64,
              pub phase: RunningCancelPhase,
          }
          """
          if source.count(lifecycle_marker) != 1:
              raise SystemExit("unexpected lifecycle marker")
          source = source.replace(lifecycle_marker, lifecycle_insert, 1)

          record_marker = """    token_chain_digest: Digest,
              terminal_receipt: Option<TerminalReceipt>,
          """
          record_insert = """    token_chain_digest: Digest,
              running_cancel_phase: Option<RunningCancelPhase>,
              terminal_receipt: Option<TerminalReceipt>,
          """
          if source.count(record_marker) != 1:
              raise SystemExit("unexpected record marker")
          source = source.replace(record_marker, record_insert, 1)

          init_marker = """                accepted_token_bytes: 0,
                          token_chain_digest,
                          terminal_receipt: None,
          """
          init_insert = """                accepted_token_bytes: 0,
                          token_chain_digest,
                          running_cancel_phase: None,
                          terminal_receipt: None,
          """
          if source.count(init_marker) != 1:
              raise SystemExit("unexpected record init marker")
          source = source.replace(init_marker, init_insert, 1)

          cancel_marker = """    pub fn cancel(
          """
          methods = """    pub fn request_running_cancel(
                  &mut self,
                  request_id: &RequestId,
                  request_generation: u64,
                  cancel_generation: u64,
                  backend_generation: u64,
              ) -> Result<RunningCancelEvent> {
                  self.validate_backend_generation(backend_generation)?;
                  let record = self.record_mut(request_id, request_generation)?;
                  Self::ensure_nonterminal(record)?;
                  if record.state != LifecycleState::Running || record.running_cancel_phase.is_some() {
                      return Err(InferError::InvalidTransition);
                  }
                  if cancel_generation <= record.cancel_generation {
                      return Err(InferError::StaleCancelGeneration);
                  }
                  let sequence = record
                      .last_sequence
                      .checked_add(1)
                      .ok_or(InferError::SequenceOverflow)?;
                  record.cancel_generation = cancel_generation;
                  record.state = LifecycleState::Draining;
                  record.running_cancel_phase = Some(RunningCancelPhase::Requested);
                  record.last_sequence = sequence;
                  Ok(RunningCancelEvent {
                      request_id: request_id.clone(),
                      request_generation,
                      cancel_generation,
                      backend_generation,
                      sequence,
                      phase: RunningCancelPhase::Requested,
                  })
              }

              pub fn mark_running_cancel_dispatched(
                  &mut self,
                  request_id: &RequestId,
                  request_generation: u64,
                  cancel_generation: u64,
                  backend_generation: u64,
              ) -> Result<RunningCancelEvent> {
                  self.validate_backend_generation(backend_generation)?;
                  let record = self.record_mut(request_id, request_generation)?;
                  Self::ensure_nonterminal(record)?;
                  if record.state != LifecycleState::Draining
                      || record.running_cancel_phase != Some(RunningCancelPhase::Requested)
                  {
                      return Err(InferError::InvalidTransition);
                  }
                  if record.cancel_generation != cancel_generation {
                      return Err(InferError::StaleCancelGeneration);
                  }
                  let sequence = record
                      .last_sequence
                      .checked_add(1)
                      .ok_or(InferError::SequenceOverflow)?;
                  record.running_cancel_phase = Some(RunningCancelPhase::Dispatched);
                  record.last_sequence = sequence;
                  Ok(RunningCancelEvent {
                      request_id: request_id.clone(),
                      request_generation,
                      cancel_generation,
                      backend_generation,
                      sequence,
                      phase: RunningCancelPhase::Dispatched,
                  })
              }

              pub fn acknowledge_running_cancel(
                  &mut self,
                  fence: EventFence<'_>,
                  cancel_generation: u64,
              ) -> Result<TerminalReceipt> {
                  self.validate_backend_generation(fence.backend_generation)?;
                  let authority = self.config.authority.clone();
                  let (tenant, output_tokens, result_digest) = {
                      let record = self.record(fence.request_id, fence.request_generation)?;
                      Self::ensure_nonterminal(record)?;
                      if record.state != LifecycleState::Draining
                          || record.running_cancel_phase != Some(RunningCancelPhase::Dispatched)
                      {
                          return Err(InferError::InvalidTransition);
                      }
                      if record.cancel_generation != cancel_generation {
                          return Err(InferError::StaleCancelGeneration);
                      }
                      Self::validate_next_sequence(record, fence.sequence)?;
                      self.ensure_active_accounting(&record.request.identity.tenant_id, true)?;
                      (
                          record.request.identity.tenant_id.clone(),
                          record.accepted_token_count,
                          record.token_chain_digest.clone(),
                      )
                  };
                  let receipt = {
                      let record = self
                          .records
                          .get_mut(fence.request_id)
                          .ok_or(InferError::QueueInvariant)?;
                      record.state = LifecycleState::Cancelled;
                      record.running_cancel_phase = Some(RunningCancelPhase::Acknowledged);
                      record.last_sequence = fence.sequence;
                      let receipt = TerminalReceipt {
                          request_id: fence.request_id.clone(),
                          request_generation: fence.request_generation,
                          cancel_generation,
                          backend_generation: fence.backend_generation,
                          terminal_state: LifecycleState::Cancelled,
                          last_sequence: fence.sequence,
                          output_tokens,
                          result_digest: Some(result_digest),
                          forced_worker_termination: false,
                          authority,
                      };
                      record.terminal_receipt = Some(receipt.clone());
                      receipt
                  };
                  self.release_active_accounting(&tenant, true)?;
                  Ok(receipt)
              }

              pub fn mark_running_cancel_timed_out(
                  &mut self,
                  request_id: &RequestId,
                  request_generation: u64,
                  cancel_generation: u64,
                  backend_generation: u64,
              ) -> Result<RunningCancelEvent> {
                  self.validate_backend_generation(backend_generation)?;
                  let record = self.record_mut(request_id, request_generation)?;
                  Self::ensure_nonterminal(record)?;
                  if record.state != LifecycleState::Draining
                      || record.running_cancel_phase != Some(RunningCancelPhase::Dispatched)
                  {
                      return Err(InferError::InvalidTransition);
                  }
                  if record.cancel_generation != cancel_generation {
                      return Err(InferError::StaleCancelGeneration);
                  }
                  let sequence = record
                      .last_sequence
                      .checked_add(1)
                      .ok_or(InferError::SequenceOverflow)?;
                  record.running_cancel_phase = Some(RunningCancelPhase::TimedOut);
                  record.last_sequence = sequence;
                  Ok(RunningCancelEvent {
                      request_id: request_id.clone(),
                      request_generation,
                      cancel_generation,
                      backend_generation,
                      sequence,
                      phase: RunningCancelPhase::TimedOut,
                  })
              }

          """
          if source.count(cancel_marker) != 1:
              raise SystemExit("unexpected cancel method marker")
          source = source.replace(cancel_marker, methods + cancel_marker, 1)
          controller.write_text(source, encoding="utf-8")

          lib = Path("codex-rs/hepta-infer-core/src/lib.rs")
          source = lib.read_text(encoding="utf-8")
          export_marker = """pub use controller::LifecycleState;
          pub use controller::StateEvent;
          """
          export_insert = """pub use controller::LifecycleState;
          pub use controller::RunningCancelEvent;
          pub use controller::RunningCancelPhase;
          pub use controller::StateEvent;
          """
          if source.count(export_marker) != 1:
              raise SystemExit("unexpected core export marker")
          source = source.replace(export_marker, export_insert, 1)
          lib.write_text(source, encoding="utf-8")
          PY

          mkdir -p codex-rs/hepta-infer-core/tests
          cat > codex-rs/hepta-infer-core/tests/running_cancel.rs <<'RS'
          use codex_hepta_infer_core::AgentId;
          use codex_hepta_infer_core::AuthoritySnapshot;
          use codex_hepta_infer_core::Controller;
          use codex_hepta_infer_core::ControllerConfig;
          use codex_hepta_infer_core::Digest;
          use codex_hepta_infer_core::EventFence;
          use codex_hepta_infer_core::InferError;
          use codex_hepta_infer_core::InferenceRequest;
          use codex_hepta_infer_core::LifecycleState;
          use codex_hepta_infer_core::RequestId;
          use codex_hepta_infer_core::RequestIdentity;
          use codex_hepta_infer_core::ResourceBudgetId;
          use codex_hepta_infer_core::RunningCancelPhase;
          use codex_hepta_infer_core::TaskId;
          use codex_hepta_infer_core::TenantId;
          use codex_hepta_infer_core::WorkspaceId;

          fn must<T, E: std::fmt::Display>(result: std::result::Result<T, E>) -> T {
              match result {
                  Ok(value) => value,
                  Err(error) => panic!("unexpected error: {error}"),
              }
          }

          fn digest(fill: char) -> Digest {
              must(Digest::parse(&format!(
                  "sha256:{}",
                  fill.to_string().repeat(64)
              )))
          }

          fn request(id: &str) -> InferenceRequest {
              InferenceRequest {
                  identity: RequestIdentity {
                      tenant_id: must(TenantId::parse("tenant-a")),
                      workspace_id: must(WorkspaceId::parse("workspace-a")),
                      agent_id: must(AgentId::parse("agent-a")),
                      task_id: must(TaskId::parse("task-a")),
                      request_id: must(RequestId::parse(id)),
                  },
                  agent_generation: 1,
                  request_generation: 2,
                  cancel_generation: 3,
                  deadline_unix_ms: u64::MAX,
                  model_tuple_digest: digest('a'),
                  policy_digest: digest('b'),
                  resource_budget_id: must(ResourceBudgetId::parse("budget-a")),
                  prompt_digest: digest('c'),
                  prompt_byte_length: 12,
                  output_token_limit: 32,
                  authority: AuthoritySnapshot::qualification_only_closed(),
              }
          }

          fn running_controller(id: &str) -> (Controller, InferenceRequest) {
              let request = request(id);
              let mut config = ControllerConfig::qualification_only([request.model_tuple_digest.clone()]);
              config.max_queue = 4;
              config.max_per_tenant = 4;
              let mut controller = must(Controller::new(config, 7));
              must(controller.admit(request.clone(), 1));
              must(controller.start(&request.identity.request_id, 2, 7));
              (controller, request)
          }

          #[test]
          fn running_cancel_requires_dispatch_and_worker_ack() {
              let (mut controller, request) = running_controller("request-cancel-ack");
              let requested = must(controller.request_running_cancel(
                  &request.identity.request_id,
                  2,
                  4,
                  7,
              ));
              assert_eq!(requested.phase, RunningCancelPhase::Requested);
              assert_eq!(requested.sequence, 3);
              assert_eq!(
                  controller.publish_token(
                      EventFence {
                          request_id: &request.identity.request_id,
                          request_generation: 2,
                          backend_generation: 7,
                          sequence: 4,
                      },
                      &digest('d'),
                      1,
                  ),
                  Err(InferError::InvalidTransition)
              );
              let dispatched = must(controller.mark_running_cancel_dispatched(
                  &request.identity.request_id,
                  2,
                  4,
                  7,
              ));
              assert_eq!(dispatched.phase, RunningCancelPhase::Dispatched);
              assert_eq!(dispatched.sequence, 4);
              let receipt = must(controller.acknowledge_running_cancel(
                  EventFence {
                      request_id: &request.identity.request_id,
                      request_generation: 2,
                      backend_generation: 7,
                      sequence: 5,
                  },
                  4,
              ));
              assert_eq!(receipt.terminal_state, LifecycleState::Cancelled);
              assert!(!receipt.forced_worker_termination);
              assert!(receipt.result_digest.is_some());
              assert_eq!(controller.snapshot().running_requests, 0);
              assert_eq!(controller.inflight_requests(), 0);
          }

          #[test]
          fn cancel_timeout_must_roll_generation_and_fail_closed() {
              let (mut controller, request) = running_controller("request-cancel-timeout");
              must(controller.request_running_cancel(
                  &request.identity.request_id,
                  2,
                  4,
                  7,
              ));
              must(controller.mark_running_cancel_dispatched(
                  &request.identity.request_id,
                  2,
                  4,
                  7,
              ));
              let timed_out = must(controller.mark_running_cancel_timed_out(
                  &request.identity.request_id,
                  2,
                  4,
                  7,
              ));
              assert_eq!(timed_out.phase, RunningCancelPhase::TimedOut);
              let receipts = must(controller.restart_backend(7));
              assert_eq!(controller.backend_generation(), 8);
              assert_eq!(receipts.len(), 1);
              assert_eq!(receipts[0].terminal_state, LifecycleState::FailedClosed);
              assert!(receipts[0].forced_worker_termination);
              assert_eq!(
                  controller.publish_token(
                      EventFence {
                          request_id: &request.identity.request_id,
                          request_generation: 2,
                          backend_generation: 7,
                          sequence: timed_out.sequence + 2,
                      },
                      &digest('e'),
                      1,
                  ),
                  Err(InferError::StaleBackendGeneration)
              );
          }
          RS

      - name: Add child-process cancel supervisor and fixture E2E
        shell: bash
        run: |
          set -euo pipefail
          cat > codex-rs/hepta-inferd/src/cancel_supervisor.rs <<'RS'
          //! Running-request cancellation over an inherited child-process channel.
          //!
          //! An EOF, transport error, dropped future, or timeout is never classified as a
          //! worker acknowledgement. Timeout and crash paths reap the child and roll the
          //! controller generation before returning forced-failure receipts.

          use std::io;
          use std::io::ErrorKind;
          use std::path::Path;
          use std::process::Stdio;
          use std::sync::Arc;
          use std::time::Duration;

          use codex_hepta_infer_core::Controller;
          use codex_hepta_infer_core::EventFence;
          use codex_hepta_infer_core::InferError;
          use codex_hepta_infer_core::RequestId;
          use codex_hepta_infer_core::TerminalReceipt;
          use tokio::io::AsyncBufReadExt;
          use tokio::io::AsyncWriteExt;
          use tokio::io::BufReader;
          use tokio::process::Child;
          use tokio::process::ChildStdin;
          use tokio::process::ChildStdout;
          use tokio::process::Command;
          use tokio::sync::Mutex;
          use tokio::time;

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub enum WorkerCancelDisposition {
              Acknowledged,
              ForcedKill,
              WorkerExited,
          }

          #[derive(Clone, Debug, Eq, PartialEq)]
          pub struct WorkerCancelOutcome {
              pub disposition: WorkerCancelDisposition,
              pub backend_generation: u64,
              pub receipts: Vec<TerminalReceipt>,
          }

          pub struct CancelWorkerProcess {
              child: Child,
              stdin: ChildStdin,
              stdout: BufReader<ChildStdout>,
              backend_generation: u64,
          }

          impl CancelWorkerProcess {
              pub fn spawn(
                  program: &Path,
                  args: &[&str],
                  backend_generation: u64,
              ) -> io::Result<Self> {
                  if backend_generation == 0 || !program.is_absolute() {
                      return Err(io::Error::new(
                          ErrorKind::InvalidInput,
                          "INF_CANCEL_WORKER_CONFIG_INVALID",
                      ));
                  }
                  let mut command = Command::new(program);
                  command
                      .args(args)
                      .stdin(Stdio::piped())
                      .stdout(Stdio::piped())
                      .stderr(Stdio::null())
                      .kill_on_drop(true);
                  let mut child = command.spawn()?;
                  let stdin = child
                      .stdin
                      .take()
                      .ok_or_else(|| io::Error::other("INF_CANCEL_WORKER_STDIN_MISSING"))?;
                  let stdout = child
                      .stdout
                      .take()
                      .ok_or_else(|| io::Error::other("INF_CANCEL_WORKER_STDOUT_MISSING"))?;
                  Ok(Self {
                      child,
                      stdin,
                      stdout: BufReader::new(stdout),
                      backend_generation,
                  })
              }

              pub async fn cancel_running(
                  &mut self,
                  controller: &Arc<Mutex<Controller>>,
                  request_id: &RequestId,
                  request_generation: u64,
                  cancel_generation: u64,
                  acknowledgement_timeout: Duration,
              ) -> io::Result<WorkerCancelOutcome> {
                  if acknowledgement_timeout.is_zero() {
                      return Err(io::Error::new(
                          ErrorKind::InvalidInput,
                          "INF_CANCEL_ACK_TIMEOUT_ZERO",
                      ));
                  }
                  let requested = {
                      let mut controller = controller.lock().await;
                      controller
                          .request_running_cancel(
                              request_id,
                              request_generation,
                              cancel_generation,
                              self.backend_generation,
                          )
                          .map_err(infer_error_to_io)?
                  };
                  let command = format!(
                      "CANCEL\t{}\t{}\t{}\t{}\n",
                      request_id,
                      request_generation,
                      cancel_generation,
                      self.backend_generation
                  );
                  self.stdin.write_all(command.as_bytes()).await?;
                  self.stdin.flush().await?;
                  let dispatched = {
                      let mut controller = controller.lock().await;
                      controller
                          .mark_running_cancel_dispatched(
                              request_id,
                              request_generation,
                              cancel_generation,
                              self.backend_generation,
                          )
                          .map_err(infer_error_to_io)?
                  };
                  debug_assert!(dispatched.sequence > requested.sequence);

                  let expected = format!(
                      "CANCEL_ACK\t{}\t{}\t{}\t{}",
                      request_id,
                      request_generation,
                      cancel_generation,
                      self.backend_generation
                  );
                  let mut line = String::new();
                  match time::timeout(
                      acknowledgement_timeout,
                      self.stdout.read_line(&mut line),
                  )
                  .await
                  {
                      Ok(Ok(read)) if read > 0 && line.trim_end() == expected => {
                          let receipt = {
                              let mut controller = controller.lock().await;
                              controller
                                  .acknowledge_running_cancel(
                                      EventFence {
                                          request_id,
                                          request_generation,
                                          backend_generation: self.backend_generation,
                                          sequence: dispatched
                                              .sequence
                                              .checked_add(1)
                                              .ok_or_else(|| {
                                                  io::Error::other(
                                                      "INF_CANCEL_ACK_SEQUENCE_OVERFLOW",
                                                  )
                                              })?,
                                      },
                                      cancel_generation,
                                  )
                                  .map_err(infer_error_to_io)?
                          };
                          Ok(WorkerCancelOutcome {
                              disposition: WorkerCancelDisposition::Acknowledged,
                              backend_generation: self.backend_generation,
                              receipts: vec![receipt],
                          })
                      }
                      Ok(Ok(_)) | Ok(Err(_)) => {
                          self.force_fail_closed(
                              controller,
                              request_id,
                              request_generation,
                              cancel_generation,
                              WorkerCancelDisposition::WorkerExited,
                          )
                          .await
                      }
                      Err(_) => {
                          self.force_fail_closed(
                              controller,
                              request_id,
                              request_generation,
                              cancel_generation,
                              WorkerCancelDisposition::ForcedKill,
                          )
                          .await
                      }
                  }
              }

              async fn force_fail_closed(
                  &mut self,
                  controller: &Arc<Mutex<Controller>>,
                  request_id: &RequestId,
                  request_generation: u64,
                  cancel_generation: u64,
                  disposition: WorkerCancelDisposition,
              ) -> io::Result<WorkerCancelOutcome> {
                  if disposition == WorkerCancelDisposition::ForcedKill {
                      match self.child.start_kill() {
                          Ok(()) => {}
                          Err(error) if error.kind() == ErrorKind::InvalidInput => {}
                          Err(error) => return Err(error),
                      }
                  }
                  let _status = self.child.wait().await?;
                  let receipts = {
                      let mut controller = controller.lock().await;
                      controller
                          .mark_running_cancel_timed_out(
                              request_id,
                              request_generation,
                              cancel_generation,
                              self.backend_generation,
                          )
                          .map_err(infer_error_to_io)?;
                      controller
                          .restart_backend(self.backend_generation)
                          .map_err(infer_error_to_io)?
                  };
                  self.backend_generation = self
                      .backend_generation
                      .checked_add(1)
                      .ok_or_else(|| io::Error::other("INF_CANCEL_GENERATION_OVERFLOW"))?;
                  Ok(WorkerCancelOutcome {
                      disposition,
                      backend_generation: self.backend_generation,
                      receipts,
                  })
              }
          }

          fn infer_error_to_io(error: InferError) -> io::Error {
              io::Error::new(ErrorKind::InvalidData, error)
          }
          RS

          mkdir -p codex-rs/hepta-inferd/src/bin
          cat > codex-rs/hepta-inferd/src/bin/hepta-infer-cancel-fixture.rs <<'RS'
          //! Qualification-only child-process fixture for cancel ACK, hang, and crash paths.

          use std::io;
          use std::io::BufRead;
          use std::io::Write;
          use std::time::Duration;

          fn main() -> io::Result<()> {
              let mode = std::env::args().nth(1).ok_or_else(|| {
                  io::Error::new(io::ErrorKind::InvalidInput, "INF_FIXTURE_MODE_MISSING")
              })?;
              let mut request = String::new();
              io::stdin().lock().read_line(&mut request)?;
              if !request.starts_with("CANCEL\t") {
                  return Err(io::Error::new(
                      io::ErrorKind::InvalidData,
                      "INF_FIXTURE_CANCEL_FRAME_INVALID",
                  ));
              }
              match mode.as_str() {
                  "ack" => {
                      let response = request.replacen("CANCEL\t", "CANCEL_ACK\t", 1);
                      let mut stdout = io::stdout().lock();
                      stdout.write_all(response.as_bytes())?;
                      stdout.flush()
                  }
                  "hang" => loop {
                      std::thread::sleep(Duration::from_secs(60));
                  },
                  "crash" => std::process::exit(23),
                  _ => Err(io::Error::new(
                      io::ErrorKind::InvalidInput,
                      "INF_FIXTURE_MODE_INVALID",
                  )),
              }
          }
          RS

          mkdir -p codex-rs/hepta-inferd/tests
          cat > codex-rs/hepta-inferd/tests/running_cancel.rs <<'RS'
          use std::path::Path;
          use std::sync::Arc;
          use std::time::Duration;

          use codex_hepta_infer_core::AgentId;
          use codex_hepta_infer_core::AuthoritySnapshot;
          use codex_hepta_infer_core::Controller;
          use codex_hepta_infer_core::ControllerConfig;
          use codex_hepta_infer_core::Digest;
          use codex_hepta_infer_core::EventFence;
          use codex_hepta_infer_core::InferError;
          use codex_hepta_infer_core::InferenceRequest;
          use codex_hepta_infer_core::LifecycleState;
          use codex_hepta_infer_core::RequestId;
          use codex_hepta_infer_core::RequestIdentity;
          use codex_hepta_infer_core::ResourceBudgetId;
          use codex_hepta_infer_core::TaskId;
          use codex_hepta_infer_core::TenantId;
          use codex_hepta_infer_core::WorkspaceId;
          use codex_hepta_inferd::CancelWorkerProcess;
          use codex_hepta_inferd::WorkerCancelDisposition;
          use tokio::sync::Mutex;

          const FIXTURE: &str = env!("CARGO_BIN_EXE_hepta-infer-cancel-fixture");

          fn must<T, E: std::fmt::Display>(result: std::result::Result<T, E>) -> T {
              match result {
                  Ok(value) => value,
                  Err(error) => panic!("unexpected error: {error}"),
              }
          }

          fn digest(fill: char) -> Digest {
              must(Digest::parse(&format!(
                  "sha256:{}",
                  fill.to_string().repeat(64)
              )))
          }

          fn request(id: &str) -> InferenceRequest {
              InferenceRequest {
                  identity: RequestIdentity {
                      tenant_id: must(TenantId::parse("tenant-a")),
                      workspace_id: must(WorkspaceId::parse("workspace-a")),
                      agent_id: must(AgentId::parse("agent-a")),
                      task_id: must(TaskId::parse("task-a")),
                      request_id: must(RequestId::parse(id)),
                  },
                  agent_generation: 1,
                  request_generation: 2,
                  cancel_generation: 3,
                  deadline_unix_ms: u64::MAX,
                  model_tuple_digest: digest('a'),
                  policy_digest: digest('b'),
                  resource_budget_id: must(ResourceBudgetId::parse("budget-a")),
                  prompt_digest: digest('c'),
                  prompt_byte_length: 12,
                  output_token_limit: 32,
                  authority: AuthoritySnapshot::qualification_only_closed(),
              }
          }

          fn running_controller(id: &str) -> (Arc<Mutex<Controller>>, InferenceRequest) {
              let request = request(id);
              let mut config = ControllerConfig::qualification_only([request.model_tuple_digest.clone()]);
              config.max_queue = 4;
              config.max_per_tenant = 4;
              let mut controller = must(Controller::new(config, 7));
              must(controller.admit(request.clone(), 1));
              must(controller.start(&request.identity.request_id, 2, 7));
              (Arc::new(Mutex::new(controller)), request)
          }

          #[tokio::test]
          async fn exact_worker_ack_is_required_for_normal_cancelled_receipt() {
              let (controller, request) = running_controller("request-child-ack");
              let mut worker = must(CancelWorkerProcess::spawn(
                  Path::new(FIXTURE),
                  &["ack"],
                  7,
              ));
              let outcome = must(
                  worker
                      .cancel_running(
                          &controller,
                          &request.identity.request_id,
                          2,
                          4,
                          Duration::from_secs(2),
                      )
                      .await,
              );
              assert_eq!(outcome.disposition, WorkerCancelDisposition::Acknowledged);
              assert_eq!(outcome.backend_generation, 7);
              assert_eq!(outcome.receipts.len(), 1);
              assert_eq!(outcome.receipts[0].terminal_state, LifecycleState::Cancelled);
              assert!(!outcome.receipts[0].forced_worker_termination);
          }

          #[tokio::test]
          async fn timeout_kills_reaps_rolls_generation_and_rejects_stale_events() {
              let (controller, request) = running_controller("request-child-timeout");
              let mut worker = must(CancelWorkerProcess::spawn(
                  Path::new(FIXTURE),
                  &["hang"],
                  7,
              ));
              let outcome = must(
                  worker
                      .cancel_running(
                          &controller,
                          &request.identity.request_id,
                          2,
                          4,
                          Duration::from_millis(50),
                      )
                      .await,
              );
              assert_eq!(outcome.disposition, WorkerCancelDisposition::ForcedKill);
              assert_eq!(outcome.backend_generation, 8);
              assert_eq!(outcome.receipts.len(), 1);
              assert!(outcome.receipts[0].forced_worker_termination);
              let stale = controller.lock().await.publish_token(
                  EventFence {
                      request_id: &request.identity.request_id,
                      request_generation: 2,
                      backend_generation: 7,
                      sequence: outcome.receipts[0].last_sequence + 1,
                  },
                  &digest('d'),
                  1,
              );
              assert_eq!(stale, Err(InferError::StaleBackendGeneration));
          }

          #[tokio::test]
          async fn child_exit_is_not_misclassified_as_cancel_ack() {
              let (controller, request) = running_controller("request-child-crash");
              let mut worker = must(CancelWorkerProcess::spawn(
                  Path::new(FIXTURE),
                  &["crash"],
                  7,
              ));
              let outcome = must(
                  worker
                      .cancel_running(
                          &controller,
                          &request.identity.request_id,
                          2,
                          4,
                          Duration::from_secs(2),
                      )
                      .await,
              );
              assert_eq!(outcome.disposition, WorkerCancelDisposition::WorkerExited);
              assert_eq!(outcome.backend_generation, 8);
              assert!(outcome.receipts[0].forced_worker_termination);
          }
          RS

          python3 - <<'PY'
          from pathlib import Path

          lib = Path("codex-rs/hepta-inferd/src/lib.rs")
          source = lib.read_text(encoding="utf-8")
          marker = "use std::collections::HashMap;"
          replacement = (
              "mod cancel_supervisor;\n\n"
              "pub use cancel_supervisor::CancelWorkerProcess;\n"
              "pub use cancel_supervisor::WorkerCancelDisposition;\n"
              "pub use cancel_supervisor::WorkerCancelOutcome;\n\n"
              + marker
          )
          if source.count(marker) != 1:
              raise SystemExit("unexpected inferd lib marker")
          source = source.replace(marker, replacement, 1)
          lib.write_text(source, encoding="utf-8")

          cargo = Path("codex-rs/hepta-inferd/Cargo.toml")
          source = cargo.read_text(encoding="utf-8")
          bin_marker = """[[bin]]
          name = "hepta-inferd"
          path = "src/main.rs"
          """
          bin_insert = bin_marker + """
          [[bin]]
          name = "hepta-infer-cancel-fixture"
          path = "src/bin/hepta-infer-cancel-fixture.rs"
          test = false
          """
          if source.count(bin_marker) != 1:
              raise SystemExit("unexpected inferd bin marker")
          source = source.replace(bin_marker, bin_insert, 1)
          feature_marker = """    "net",
              "rt-multi-thread",
          """
          feature_insert = """    "net",
              "process",
              "rt-multi-thread",
          """
          if source.count(feature_marker) != 1:
              raise SystemExit("unexpected tokio feature marker")
          source = source.replace(feature_marker, feature_insert, 1)
          cargo.write_text(source, encoding="utf-8")
          PY

