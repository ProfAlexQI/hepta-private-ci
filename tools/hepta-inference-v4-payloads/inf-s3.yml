                  if state.receipts.insert(key, receipt).is_some() {
          """
          if source.count(receipt_marker) != 1:
              raise SystemExit("unexpected receipt index marker")
          source = source.replace(receipt_marker, receipt_insert, 1)

          self_marker = """            persist_lock: Mutex::new(()),
                      state: RwLock::new(state),
          """
          self_insert = """            persist_lock: Mutex::new(()),
                      compacted_request_ids: retention.compacted_request_ids,
                      state: RwLock::new(state),
          """
          if source.count(self_marker) != 1:
              raise SystemExit("unexpected store construction marker")
          source = source.replace(self_marker, self_insert, 1)

          contains_marker = """    async fn contains_request_id(&self, request_id: &RequestId) -> bool {
                  self.state
                      .read()
                      .await
                      .receipts
                      .values()
                      .any(|receipt| receipt.request_id == *request_id)
              }
          """
          contains_insert = """    async fn contains_request_id(&self, request_id: &RequestId) -> bool {
                  self.compacted_request_ids.contains(request_id)
                      || self
                          .state
                          .read()
                          .await
                          .receipts
                          .values()
                          .any(|receipt| receipt.request_id == *request_id)
              }
          """
          if source.count(contains_marker) != 1:
              raise SystemExit("unexpected contains marker")
          source = source.replace(contains_marker, contains_insert, 1)

          lookup_marker = """    ) -> codex_hepta_infer_core::Result<TerminalReceipt> {
                  let state = self.state.read().await;
          """
          lookup_insert = """    ) -> codex_hepta_infer_core::Result<TerminalReceipt> {
                  if self.compacted_request_ids.contains(request_id) {
                      return Err(InferError::ReceiptCompacted);
                  }
                  let state = self.state.read().await;
          """
          if source.count(lookup_marker) != 1:
              raise SystemExit("unexpected lookup marker")
          source = source.replace(lookup_marker, lookup_insert, 1)

          persist_marker = """        let key = ReceiptKey::from(receipt);
                  {
                      let state = self.state.read().await;
          """
          persist_insert = """        let key = ReceiptKey::from(receipt);
                  if self.compacted_request_ids.contains(&receipt.request_id) {
                      return Err(io::Error::new(
                          ErrorKind::AlreadyExists,
                          "INF_RECEIPT_REQUEST_COMPACTED",
                      ));
                  }
                  {
                      let state = self.state.read().await;
          """
          if source.count(persist_marker) != 1:
              raise SystemExit("unexpected persist marker")
          source = source.replace(persist_marker, persist_insert, 1)

          tests_marker = "#[cfg(test)]\nmod tests;\n"
          tests_insert = tests_marker + "#[cfg(test)]\nmod retention_tests;\n"
          if source.count(tests_marker) != 1:
              raise SystemExit("unexpected tests module marker")
          source = source.replace(tests_marker, tests_insert, 1)
          path.write_text(source, encoding="utf-8")
