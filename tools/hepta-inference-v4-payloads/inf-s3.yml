          cat > codex-rs/hepta-inferd/src/retention_tests.rs <<'RS'
          use std::collections::HashSet;
          use std::time::Duration;

          use codex_hepta_infer_core::AuthoritySnapshot;
          use codex_hepta_infer_core::InferError;
          use codex_hepta_infer_core::LifecycleState;
          use codex_hepta_infer_core::RequestId;
          use codex_hepta_infer_core::ServerMessage;
          use codex_hepta_infer_core::TerminalReceipt;
          use tempfile::TempDir;

          use super::ReceiptStore;
          use super::receipt_retention;
          use super::receipt_retention::ReceiptRetentionPolicy;

          fn must<T, E: std::fmt::Display>(result: std::result::Result<T, E>) -> T {
              match result {
                  Ok(value) => value,
                  Err(error) => panic!("unexpected error: {error}"),
              }
          }

          fn receipt(id: &str, sequence: u64) -> TerminalReceipt {
              TerminalReceipt {
                  request_id: must(RequestId::parse(id)),
                  request_generation: 1,
                  cancel_generation: 2,
                  backend_generation: 7,
                  terminal_state: LifecycleState::Cancelled,
                  last_sequence: sequence,
                  output_tokens: 0,
                  result_digest: None,
                  forced_worker_termination: false,
                  authority: AuthoritySnapshot::qualification_only_closed(),
              }
          }

          async fn open_store(root: &std::path::Path) -> ReceiptStore {
              let recovery = must(
                  receipt_retention::compact_and_recover(
                      root,
                      ReceiptRetentionPolicy {
                          minimum_retention: Duration::from_millis(1),
                          compact_on_start: false,
                      },
                      1,
                      &HashSet::new(),
                      32,
                      1024 * 1024,
                  )
                  .await,
              );
              must(ReceiptStore::open(
                  root.to_path_buf(),
                  32,
                  1024 * 1024,
                  recovery,
              )
              .await)
          }

          #[tokio::test]
          async fn expired_receipt_compacts_to_tombstone_and_blocks_replay() {
              let temp = must(TempDir::new());
              let store = open_store(temp.path()).await;
              let receipt = receipt("request-expired", 3);
              must(store.persist(&receipt).await);
              drop(store);

              let recovery = must(
                  receipt_retention::compact_and_recover(
                      temp.path(),
                      ReceiptRetentionPolicy {
                          minimum_retention: Duration::from_millis(1),
                          compact_on_start: true,
                      },
                      u64::MAX,
                      &HashSet::new(),
                      32,
                      1024 * 1024,
                  )
                  .await,
              );
              assert!(recovery.compacted_request_ids.contains(&receipt.request_id));
              let store = must(ReceiptStore::open(
                  temp.path().to_path_buf(),
                  32,
                  1024 * 1024,
                  recovery,
              )
              .await);
              assert_eq!(
                  store.lookup(&receipt.request_id, 1, 7, 1).await,
                  Err(InferError::ReceiptCompacted)
              );
              assert!(store.contains_request_id(&receipt.request_id).await);
              assert!(store.persist(&receipt).await.is_err());
          }

          #[tokio::test]
          async fn active_and_young_receipts_are_preserved() {
              let temp = must(TempDir::new());
              let store = open_store(temp.path()).await;
              let active = receipt("request-active", 3);
              let eligible = receipt("request-eligible", 4);
              must(store.persist(&active).await);
              must(store.persist(&eligible).await);
              drop(store);

              let mut active_ids = HashSet::new();
              active_ids.insert(active.request_id.clone());
              let young = must(
                  receipt_retention::compact_and_recover(
                      temp.path(),
                      ReceiptRetentionPolicy {
                          minimum_retention: Duration::from_secs(24 * 60 * 60),
                          compact_on_start: true,
                      },
                      super::unix_time_ms().unwrap_or(u64::MAX),
                      &HashSet::new(),
                      32,
                      1024 * 1024,
                  )
                  .await,
              );
              assert!(young.compacted_request_ids.is_empty());

              let recovery = must(
                  receipt_retention::compact_and_recover(
                      temp.path(),
                      ReceiptRetentionPolicy {
                          minimum_retention: Duration::from_millis(1),
                          compact_on_start: true,
                      },
                      u64::MAX,
                      &active_ids,
                      32,
                      1024 * 1024,
                  )
                  .await,
              );
              assert!(!recovery.compacted_request_ids.contains(&active.request_id));
              assert!(recovery.compacted_request_ids.contains(&eligible.request_id));
              let store = must(ReceiptStore::open(
                  temp.path().to_path_buf(),
                  32,
                  1024 * 1024,
                  recovery,
              )
              .await);
              assert_eq!(
                  must(store.lookup(&active.request_id, 1, 7, 1).await),
                  active
              );
              assert_eq!(
                  store.lookup(&eligible.request_id, 1, 7, 1).await,
                  Err(InferError::ReceiptCompacted)
              );
          }

          #[tokio::test]
          async fn tombstone_before_delete_is_recovered_after_crash_point() {
              let temp = must(TempDir::new());
              let store = open_store(temp.path()).await;
              let receipt = receipt("request-crash-window", 5);
              must(store.persist(&receipt).await);
              drop(store);

              let receipt_path = temp.path().join(super::receipt_file_name(&receipt));
              let bytes = must(tokio::fs::read(&receipt_path).await);
              let tombstone = must(receipt_retention::tombstone_for_receipt(
                  &receipt,
                  &bytes,
                  u64::MAX - 1,
              ));
              must(
                  receipt_retention::write_tombstone_for_test(temp.path(), &tombstone).await,
              );
              assert!(receipt_path.exists(), "crash point keeps both files");

              let recovery = must(
                  receipt_retention::compact_and_recover(
                      temp.path(),
                      ReceiptRetentionPolicy {
                          minimum_retention: Duration::from_millis(1),
                          compact_on_start: false,
                      },
                      u64::MAX,
                      &HashSet::new(),
                      32,
                      1024 * 1024,
                  )
                  .await,
              );
              assert!(!receipt_path.exists());
              assert!(recovery.compacted_request_ids.contains(&receipt.request_id));
              let encoded = must(ServerMessage::Receipt(receipt).encode_canonical());
              assert!(!encoded.is_empty());
          }
          RS

      - name: Format and qualify INF-S3 source
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt \
            -p codex-hepta-infer-core \
            -p codex-hepta-inferd
          cargo check --locked --all-targets \
            -p codex-hepta-infer-core \
            -p codex-hepta-inferd
          cargo test --locked --all-targets \
            -p codex-hepta-infer-core \
            -p codex-hepta-inferd -- --test-threads=1
          cargo clippy --locked --all-targets --no-deps \
            -p codex-hepta-infer-core \
            -p codex-hepta-inferd -- -D warnings

      - name: Enforce package source change set
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(cat <<'EOF' | LC_ALL=C sort
          codex-rs/hepta-infer-core/src/hashing.rs
          codex-rs/hepta-infer-core/src/lib.rs
          codex-rs/hepta-inferd/src/lib.rs
          codex-rs/hepta-inferd/src/receipt_retention.rs
          codex-rs/hepta-inferd/src/retention_tests.rs
          EOF
          )"
          test "$actual" = "$expected"
          git diff --check
          cargo metadata --locked --manifest-path codex-rs/Cargo.toml --no-deps --format-version 1 >/dev/null
          test -z "$(git status --porcelain -- codex-rs/Cargo.lock)"

      - name: Commit qualified package source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hepta-inference-v4-s3-retention-chatgpt.yml
          git add -A \
            .github/workflows/hepta-inference-v4-s3-retention-chatgpt.yml \
            codex-rs/hepta-infer-core/src/hashing.rs \
            codex-rs/hepta-infer-core/src/lib.rs \
            codex-rs/hepta-inferd/src/lib.rs \
            codex-rs/hepta-inferd/src/receipt_retention.rs \
            codex-rs/hepta-inferd/src/retention_tests.rs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat(inference): close INF-S3 receipt retention"
          git push origin "HEAD:${GITHUB_REF_NAME}"
